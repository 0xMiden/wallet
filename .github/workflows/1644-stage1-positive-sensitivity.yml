                  assert matcher['name'] == 'toEqual' and matcher['pass'] is False, 'Unexpected structured matcher'
                  assert type(matcher['message']) is str and plain(matcher['message']) == prefix[len('Error: '):], 'Raw/structured matcher mismatch'
                  assert canonical(matcher['expected']) == canonical(expected) and canonical(matcher['actual']) == canonical(actual), 'Structured values mismatch'

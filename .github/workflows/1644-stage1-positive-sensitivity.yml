                  command = load(label + '.command.json')
                  expected = [argument.replace('$PROOF_DIR', str(proof)) for argument in BINDINGS['commands'][label]]
                  assert command['argv'] == expected and command['cwd'] == str(Path.cwd()), 'Command identity mismatch: ' + label
          
          
          def validate():
              outcomes = {name: os.environ.get(name.upper() + '_OUTCOME', 'missing') for name in BINDINGS['outcomes']}
              save('step-outcomes.json', outcomes)
              validation = {'status': 'INVALID', 'runtime': 'UNACCEPTED', 'production_gate': 'CLOSED', 'outcomes': outcomes}
              try:
                  snapshot('final-validation-clean')
                  completeness('validation-completeness.json', required_files())
                  for name, outcome in outcomes.items():
                      expected = 'failure' if name.startswith('jest_') and name != 'jest_positive' else 'success'
                      assert outcome == expected, 'Independent step failed/skipped/cancelled: ' + name
                  validate_commands(BINDINGS['logged_commands'])
                  manifest = load('source-and-checkout.json')
                  assert manifest['source_commit'] == BINDINGS['source'] and manifest['source_tree'] == BINDINGS['source_tree'], 'Source receipt changed'
                  assert manifest['source_entry_map'] == tree(BINDINGS['source']) == load('source-entry-map.json'), 'Source map changed'
                  assert manifest['checkout_entry_map'] == tree('HEAD') == load('checkout-entry-map.json'), 'Checkout map changed'
                  assert all(manifest['checkout_entry_map'][name] == entry for name, entry in manifest['source_entry_map'].items()), 'Source entries changed'
                  assert set(manifest['checkout_entry_map']) - set(manifest['source_entry_map']) == {BINDINGS['workflow']}, 'Sole workflow addition changed'
                  assert manifest['proof_tools_sha256'] == digest(Path(__file__).read_bytes()), 'Validator bytes changed'
                  assert manifest['runner_helper_sha256'] == digest((proof / 'run-logged.bash').read_bytes()), 'Logging helper changed'
                  assert manifest['workflow_sha256'] == digest(Path(BINDINGS['workflow']).read_bytes()) == digest((proof / 'workflow.yml').read_bytes()), 'Workflow bytes changed'
                  assert (proof / 'expanded-source.test.ts').read_bytes() == Path(BINDINGS['test_path']).read_bytes(), 'Expanded evidence changed'
                  assert load('bindings.json') == BINDINGS and load('expected-case-inventory.json') == BINDINGS['inventory'], 'Case bindings changed'
                  assert load('run-identity.json') == {key: os.environ['PROOF_' + key] for key in BINDINGS['identity_keys']}, 'Run identity changed'
                  verify_framework()
                  tests = {name: checked_result(name) for name in BINDINGS['variants']}
                  snapshots = {label: validate_snapshot(label) for label in ['source-clean', 'prepared', 'final-clean', 'final-validation-clean']}
                  for name, variant in BINDINGS['variants'].items():
                      for phase in ['before', 'active', 'before-restore', 'after']:
                          label = name + '-' + phase
                          snapshots[label] = validate_snapshot(label, variant if phase in ['active', 'before-restore'] and name != 'positive' else None)
                      assert load(name + '.restored.json') == {'status': 'EXACT_ORIGINAL_RESTORED', 'name': name}, 'Missing exact restore'
                  assert load('final-restore-attempt.json')['errors'] == [], 'Final restore errors'
                  validation.update({'status': 'EXACT_POSITIVE_AND_THREE_SEMANTIC_MUTANTS', 'runtime': 'ACTUAL_CI_EVIDENCE_ONLY',
                                     'production_gate': 'ROOT_ACCEPTANCE_REQUIRED', 'tests': tests,
                                     'snapshot_sha256': snapshots, 'merge': 'NEVER_MERGE_TRANSPORT',
                                     'limits': 'No coverage, final review, current-main revalidation, production fix or merge credit'})
                  print('Observed exact 97-case positive and three isolated semantic mutants; natural Jest exits and source restoration retained')
              except Exception as error:
                  validation['reason'] = str(error)
                  raise
              finally:
                  save('test-set-validation.json', validation)
          
          
          def seal():
              receipt = {'status': 'INVALID', 'production_gate': 'CLOSED', 'upload': 'PENDING_EXTERNAL_OBSERVATION'}
              try:
                  completeness('evidence-completeness.json', required_files(final=True))
                  validate_commands(['validate'])
                  assert load('test-set-validation.json')['status'] == 'EXACT_POSITIVE_AND_THREE_SEMANTIC_MUTANTS', 'Validator did not accept exact variants'
                  receipt.update({'status': 'COMPLETE_ELIGIBLE_FOR_ROOT_ACCEPTANCE_ONLY', 'production_gate': 'ROOT_ACCEPTANCE_REQUIRED'})
              except Exception as error:
                  receipt['reason'] = str(error)
                  raise
              finally:
                  save('seal-receipt.json', receipt)
                  files = {}
                  for path in sorted(proof.rglob('*')):
                      if path.is_file() and path.name != 'hash-manifest.json':
                          assert not path.is_symlink(), 'Unexpected evidence symlink'
                          data = path.read_bytes()
                          files[path.relative_to(proof).as_posix()] = {'bytes': len(data), 'sha256': digest(data)}
                  save('hash-manifest.json', {'algorithm': 'sha256', 'self_excluded': ['hash-manifest.json'], 'files': files})
          
          
          mode = sys.argv[1]
          if mode == 'identity':
              identity()
          elif mode == 'source':
              source()
          elif mode == 'prepared':
              prepared()
          elif mode == 'begin':
              begin(sys.argv[2])
          elif mode == 'restore':
              restore(sys.argv[2])
          elif mode == 'final':
              final()
          elif mode == 'validate':
              validate()
          elif mode == 'seal':
              seal()
          else:
              raise ValueError('Unknown proof mode')
          PYTHON_PART
      - name: Assemble exact collector and inventory
        id: assemble
        run: |
          set -euo pipefail
          cat "$PROOF_DIR/helper-part-1.txt" "$PROOF_DIR/helper-part-2.txt" "$PROOF_DIR/helper-part-3.txt" "$PROOF_DIR/helper-part-4.txt" "$PROOF_DIR/helper-part-5.txt" "$PROOF_DIR/helper-part-6.txt" > "$PROOF_DIR/proof-tools.py"
          python3 "$PROOF_DIR/proof-tools.py" identity
      - name: Checkout sole workflow transport
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable source and workflow-only ancestry
        id: source
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged source python3 "$PROOF_DIR/proof-tools.py" source
      - name: Set supported Node runtime
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact frozen dependencies with normal hooks
        id: install
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged install timeout 10m yarn install --frozen-lockfile --non-interactive
      - name: Verify prepared source and pinned matcher sources
        id: prepared
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged prepared python3 "$PROOF_DIR/proof-tools.py" prepared
      - name: Check all changed source formatting and regression formatting
        id: format
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged format yarn prettier --check CHANGELOG.md src/lib/miden/back/sync-manager.ts src/lib/miden/swap/settlement.ts src/lib/miden/back/sync-manager.test.ts
      - name: Lint both changed modules and regression file
        id: eslint
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged eslint yarn eslint --max-warnings 0 src/lib/miden/back/sync-manager.ts src/lib/miden/swap/settlement.ts src/lib/miden/back/sync-manager.test.ts
      - name: Check unchanged TypeScript gate
        id: typescript
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged typescript yarn tsc --noEmit --pretty false
      - name: Capture clean source and apply positive
        id: begin_positive
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged begin-positive python3 "$PROOF_DIR/proof-tools.py" begin positive
      - name: Run exact 97-case positive with natural exit
        id: jest_positive
        if: ${{ !cancelled() && steps.begin_positive.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged jest-positive yarn jest --runTestsByPath src/lib/miden/back/sync-manager.test.ts --maxWorkers=2 --coverage=false --no-colors --json "--outputFile=$PROOF_DIR/positive.jest.json"
      - name: Always restore and bind original source after positive
        id: restore_positive
        if: ${{ always() && steps.begin_positive.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged restore-positive python3 "$PROOF_DIR/proof-tools.py" restore positive
      - name: Capture clean source and apply stale-saved-setting
        id: begin_stale_saved_setting
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' && steps.restore_positive.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged begin-stale-saved-setting python3 "$PROOF_DIR/proof-tools.py" begin stale-saved-setting
      - name: Run exact 97-case stale-saved-setting with natural exit
        id: jest_stale_saved_setting
        if: ${{ !cancelled() && steps.begin_stale_saved_setting.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged jest-stale-saved-setting yarn jest --runTestsByPath src/lib/miden/back/sync-manager.test.ts --maxWorkers=2 --coverage=false --no-colors --json "--outputFile=$PROOF_DIR/stale-saved-setting.jest.json"
      - name: Always restore and bind original source after stale-saved-setting
        id: restore_stale_saved_setting
        if: ${{ always() && steps.begin_stale_saved_setting.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged restore-stale-saved-setting python3 "$PROOF_DIR/proof-tools.py" restore stale-saved-setting
      - name: Capture clean source and apply truthy-fallback
        id: begin_truthy_fallback
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' && steps.restore_stale_saved_setting.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged begin-truthy-fallback python3 "$PROOF_DIR/proof-tools.py" begin truthy-fallback
      - name: Run exact 97-case truthy-fallback with natural exit
        id: jest_truthy_fallback
        if: ${{ !cancelled() && steps.begin_truthy_fallback.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged jest-truthy-fallback yarn jest --runTestsByPath src/lib/miden/back/sync-manager.test.ts --maxWorkers=2 --coverage=false --no-colors --json "--outputFile=$PROOF_DIR/truthy-fallback.jest.json"
      - name: Always restore and bind original source after truthy-fallback
        id: restore_truthy_fallback
        if: ${{ always() && steps.begin_truthy_fallback.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged restore-truthy-fallback python3 "$PROOF_DIR/proof-tools.py" restore truthy-fallback
      - name: Capture clean source and apply lost-final-can-sign
        id: begin_lost_final_can_sign
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' && steps.restore_truthy_fallback.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged begin-lost-final-can-sign python3 "$PROOF_DIR/proof-tools.py" begin lost-final-can-sign
      - name: Run exact 97-case lost-final-can-sign with natural exit
        id: jest_lost_final_can_sign
        if: ${{ !cancelled() && steps.begin_lost_final_can_sign.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged jest-lost-final-can-sign yarn jest --runTestsByPath src/lib/miden/back/sync-manager.test.ts --maxWorkers=2 --coverage=false --no-colors --json "--outputFile=$PROOF_DIR/lost-final-can-sign.jest.json"
      - name: Always restore and bind original source after lost-final-can-sign
        id: restore_lost_final_can_sign
        if: ${{ always() && steps.begin_lost_final_can_sign.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged restore-lost-final-can-sign python3 "$PROOF_DIR/proof-tools.py" restore lost-final-can-sign
      - name: Always capture final source and own-mutation cleanup
        id: final
        if: ${{ always() }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged final python3 "$PROOF_DIR/proof-tools.py" final
      - name: Always validate independent gates and seal all retained evidence
        id: validate
        if: ${{ always() }}
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PREPARED_OUTCOME: ${{ steps.prepared.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          BEGIN_POSITIVE_OUTCOME: ${{ steps.begin_positive.outcome }}
          JEST_POSITIVE_OUTCOME: ${{ steps.jest_positive.outcome }}
          RESTORE_POSITIVE_OUTCOME: ${{ steps.restore_positive.outcome }}
          BEGIN_STALE_SAVED_SETTING_OUTCOME: ${{ steps.begin_stale_saved_setting.outcome }}
          JEST_STALE_SAVED_SETTING_OUTCOME: ${{ steps.jest_stale_saved_setting.outcome }}
          RESTORE_STALE_SAVED_SETTING_OUTCOME: ${{ steps.restore_stale_saved_setting.outcome }}
          BEGIN_TRUTHY_FALLBACK_OUTCOME: ${{ steps.begin_truthy_fallback.outcome }}
          JEST_TRUTHY_FALLBACK_OUTCOME: ${{ steps.jest_truthy_fallback.outcome }}
          RESTORE_TRUTHY_FALLBACK_OUTCOME: ${{ steps.restore_truthy_fallback.outcome }}
          BEGIN_LOST_FINAL_CAN_SIGN_OUTCOME: ${{ steps.begin_lost_final_can_sign.outcome }}
          JEST_LOST_FINAL_CAN_SIGN_OUTCOME: ${{ steps.jest_lost_final_can_sign.outcome }}
          RESTORE_LOST_FINAL_CAN_SIGN_OUTCOME: ${{ steps.restore_lost_final_can_sign.outcome }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          if run_logged validate python3 "$PROOF_DIR/proof-tools.py" validate; then
            validation_exit=0
          else
            validation_exit=$?
          fi
          set +e
          python3 "$PROOF_DIR/proof-tools.py" seal
          seal_exit=$?
          set -e
          if [ "$validation_exit" -ne 0 ]; then exit "$validation_exit"; fi
          exit "$seal_exit"
      - name: Always upload private NEVER MERGE evidence
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wallet1644-stage1-positive-sensitivity-proof
          path: ${{ runner.temp }}/wallet1644-stage1-sensitivity
          if-no-files-found: error
          retention-days: 7

              "doSync - expired swap order settlement keeps the ordinary omitted-flag settlement fallback to saved true": 3
            }
          }
          ''')
          proof = Path(os.environ['PROOF_DIR'])
          
          def git(*args):
              return subprocess.check_output(['git', *args])
          
          
          def value(*args):
              return git(*args).decode().strip()
          
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def save(name, data):
              (proof / name).write_text(json.dumps(data, indent=2, ensure_ascii=True) + '\n')
          
          
          def load(name):
              return json.loads((proof / name).read_text())
          
          
          def canonical(data):
              return json.dumps(data, sort_keys=True, ensure_ascii=True, separators=(',', ':'))
          
          
          def tree(ref):
              entries = {}
              for record in git('ls-tree', '-rz', ref).split(b'\0'):
                  if record:
                      metadata, name = record.split(b'\t', 1)
                      entries[name.decode()] = metadata.decode().split()
              return entries
          
          
          def snapshot(label, variant=None):
              manifest = load('source-and-checkout.json')
              entries = tree('HEAD')
              working = {}
              for name, entry in entries.items():
                  path = Path(name)
                  try:
                      observed = path.lstat()
                      if stat.S_ISLNK(observed.st_mode):
                          kind, data = 'symlink', os.fsencode(os.readlink(path))
                      elif stat.S_ISREG(observed.st_mode):
                          kind, data = 'regular', path.read_bytes()
                      else:
                          raise ValueError('Unexpected file type')
                      working[name] = {'git_entry': entry, 'sha256': digest(data), 'bytes': len(data),
                                       'physical_mode': stat.S_IMODE(observed.st_mode), 'kind': kind,
                                       'working_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
                  except Exception as error:
                      working[name] = {'error': str(error), 'git_entry': entry}
              raw_stage = git('ls-files', '--stage', '-z')
              staged = {}
              for record in raw_stage.split(b'\0'):
                  if record:
                      metadata, name = record.split(b'\t', 1)
                      staged[name.decode()] = metadata.decode().split()
              index_path = Path(value('rev-parse', '--git-path', 'index'))
              assert index_path.is_file() and not index_path.is_symlink(), 'Missing or symlinked index'
              raw_index = index_path.read_bytes()
              (proof / (label + '.index.bin')).write_bytes(raw_index)
              (proof / (label + '.index-stage.bin')).write_bytes(raw_stage)
              record = {'head': value('rev-parse', 'HEAD'), 'tree': value('rev-parse', 'HEAD^{tree}'),
                        'committed_entries': entries, 'index_entries': staged,
                        'index_sha256': digest(raw_index), 'index_stage_sha256': digest(raw_stage),
                        'working_entries': working, 'status': value('status', '--porcelain=v2', '--untracked-files=all')}
              save(label + '.map.json', record)
              validate_snapshot(label, variant)
              return record
          
          
          def validate_snapshot(label, variant=None):
              manifest = load('source-and-checkout.json')
              record = load(label + '.map.json')
              entries = manifest['checkout_entry_map']
              assert record['head'] == manifest['checkout_commit'] and record['tree'] == manifest['checkout_tree'], 'Head/tree drift'
              assert record['committed_entries'] == entries, 'Committed entry drift'
              assert record['index_entries'] == {name: [entry[0], entry[2], '0'] for name, entry in entries.items()}, 'Index entry drift'
              assert digest((proof / (label + '.index.bin')).read_bytes()) == record['index_sha256'], 'Index evidence drift'
              assert digest((proof / (label + '.index-stage.bin')).read_bytes()) == record['index_stage_sha256'], 'Stage evidence drift'
              assert set(record['working_entries']) == set(entries), 'Working inventory drift'
              baseline = record if label == 'source-clean' else load('source-clean.map.json')
              for key in ['head', 'tree', 'committed_entries', 'index_entries', 'index_sha256', 'index_stage_sha256']:
                  assert record[key] == baseline[key], 'Source/index snapshot drift: ' + key
              target = variant.get('path') if variant else None
              if target:
                  receipt = load(variant['name'] + '.mutation.json')
                  backup = proof / (variant['name'] + '.original.bin')
                  assert backup.is_file() and not backup.is_symlink(), 'Unsafe original backup'
                  original = backup.read_bytes()
                  assert digest(original) == baseline['working_entries'][target]['sha256'], 'Original backup differs from frozen source'
                  assert original.count(variant['exact_old'].encode()) == 1, 'Original mutation anchor drift'
                  mutated = original.replace(variant['exact_old'].encode(), variant['exact_new'].encode(), 1)
                  assert receipt == {'name': variant['name'], 'path': target, 'original_sha256': digest(original), 'original_bytes': len(original), 'mutated_sha256': digest(mutated), 'mutated_bytes': len(mutated), 'physical_mode': baseline['working_entries'][target]['physical_mode'], 'replacement_count': 1}, 'Mutation receipt drift'
                  assert len(record['status'].splitlines()) == 1 and record['status'].endswith(' ' + target), 'Mutant status drift'
              else:
                  assert not record['status'], 'Working status drift'
              for name, entry in entries.items():
                  observed = record['working_entries'][name]
                  assert observed['git_entry'] == entry and entry[1] == 'blob' and entry[0] in ['100644', '100755', '120000'], 'Unsupported or changed entry'
                  assert observed['kind'] == ('symlink' if entry[0] == '120000' else 'regular'), 'File type drift: ' + name
                  if entry[0] != '120000':
                      assert bool(observed['physical_mode'] & 0o111) == (entry[0] == '100755'), 'Executable mode drift: ' + name
                  if name == target:
                      assert observed['sha256'] == receipt['mutated_sha256'] and observed['bytes'] == receipt['mutated_bytes'], 'Mutant bytes drift'
                      assert observed['physical_mode'] == baseline['working_entries'][name]['physical_mode'], 'Mutant mode drift'
                  else:
                      assert observed.get('working_blob') == entry[2] and observed == baseline['working_entries'][name], 'Working bytes or modes drift: ' + name
              return digest((proof / (label + '.map.json')).read_bytes())
          
          
          def identity():
              save('run-identity.json', {key: os.environ['PROOF_' + key] for key in BINDINGS['identity_keys']})
              save('bindings.json', BINDINGS)
              save('expected-case-inventory.json', BINDINGS['inventory'])
          
          
          def source():
              head = value('rev-parse', 'HEAD')
              before, after = tree(BINDINGS['source']), tree(head)
              manifest = {'source_commit': BINDINGS['source'], 'source_tree': value('rev-parse', BINDINGS['source'] + '^{tree}'),
                          'checkout_commit': head, 'checkout_tree': value('rev-parse', 'HEAD^{tree}'),
                          'source_entry_map': before, 'checkout_entry_map': after,
                          'workflow_sha256': digest(Path(BINDINGS['workflow']).read_bytes()),
                          'proof_tools_sha256': digest(Path(__file__).read_bytes()),
                          'runner_helper_sha256': digest((proof / 'run-logged.bash').read_bytes())}
              save('source-and-checkout.json', manifest)
              save('source-entry-map.json', before)
              save('checkout-entry-map.json', after)
              for label, ref in [('source', BINDINGS['source']), ('checkout', head), ('main', BINDINGS['main'])]:
                  (proof / (label + '-commit.txt')).write_bytes(git('cat-file', 'commit', ref))
                  (proof / (label + '-tree.txt')).write_bytes(git('ls-tree', '-r', ref))
              (proof / 'workflow.yml').write_bytes(Path(BINDINGS['workflow']).read_bytes())
              (proof / 'expanded-source.test.ts').write_bytes(Path(BINDINGS['test_path']).read_bytes())
              (proof / 'workflow-only.diff').write_bytes(git('diff', '--binary', BINDINGS['source'], head))
              (proof / 'test-only.diff').write_bytes(git('diff', '--binary', BINDINGS['main'], BINDINGS['source']))
              assert head == os.environ['PROOF_HEAD_SHA'] == os.environ['PROOF_WORKFLOW_SHA'], 'Event/workflow/head mismatch'
              assert os.environ['PROOF_EVENT'] == 'push' and os.environ['PROOF_REF'] == 'refs/heads/' + BINDINGS['branch'], 'Unique push branch required'
              assert os.environ['PROOF_REPOSITORY'] == '0xMiden/wallet', 'Unexpected repository'
              assert os.environ['PROOF_WORKFLOW_REF'] == os.environ['PROOF_REPOSITORY'] + '/' + BINDINGS['workflow'] + '@' + os.environ['PROOF_REF'], 'Workflow ref mismatch'
          PYTHON_PART
      - name: Retain frozen collector source part 5

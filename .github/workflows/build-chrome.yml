name: POL bridge logo visual proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: before
            source: 0b4ddef5fbbc18e589b412fdb6734fe8992c8fdc
          - phase: after
            source: 1e3c56bcaae1b059e577fc06d27405c53f64734a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixture only and record source
        env:
          QA_SHA: ${{ github.sha }}
          PRODUCT_SHA: ${{ matrix.source }}
          QA_PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code 0b4ddef5fbbc18e589b412fdb6734fe8992c8fdc 1e3c56bcaae1b059e577fc06d27405c53f64734a -- package.json yarn.lock
          git checkout "$QA_SHA" -- playwright/visual/one-click/fixture.tsx playwright/visual/one-click/main.tsx playwright/visual/one-click/visual.spec.ts playwright/visual/one-click/pol-proof.png
          git diff --exit-code "$PRODUCT_SHA" -- src public package.json yarn.lock
          mkdir -p proof
          printf 'phase=%s\nproduct=%s\nfixture=%s\ncatalog=f932eb8f8ef46291f06b8667608967020a8169c0\n' "$QA_PHASE" "$PRODUCT_SHA" "$QA_SHA" > proof/source.txt
          echo '54b9b701b345a7c36e60c942cbd8a03e5a688c8cd4c0fd37787bde3a2b4147bc  playwright/visual/one-click/pol-proof.png' | sha256sum -c -
          git diff --name-only "$PRODUCT_SHA" > proof/fixture-paths.txt
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Capture production review in both themes
        env:
          QA_PHASE: ${{ matrix.phase }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: proof/results.json
        run: yarn playwright test --config playwright.one-click-visual.config.ts --grep 'POL bridge logo proof' --reporter=list,json
      - name: Verify four captures executed
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {stats} = require('./proof/results.json');
          assert.equal(stats.expected, 4);
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.skipped, 0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pol-logo-${{ matrix.phase }}
          path: |
            proof/
            test-results/one-click-visual/
          retention-days: 7

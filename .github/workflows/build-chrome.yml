name: Token quantity expected-red proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record frozen source and test parity
        env:
          QA_SHA: ${{ github.sha }}
          PRODUCT_SHA: c44c9aac837ef5f3a9ef248eb7436772d1c6b416
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SHA"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git diff --name-only "$PRODUCT_SHA" HEAD)" = ".github/workflows/build-chrome.yml"
          git diff --exit-code "$PRODUCT_SHA" HEAD -- . ':(exclude).github/workflows/build-chrome.yml'
          mkdir -p proof
          printf 'product=%s\nqa=%s\n' "$PRODUCT_SHA" "$QA_SHA" > proof/source.txt
          git diff --name-status "$PRODUCT_SHA" HEAD > proof/qa-only-paths.txt
          sha256sum src/components/ui/AssetListItem.tsx playwright/visual/token-display/main.tsx playwright/visual/token-display/visual.spec.ts playwright.token-display-visual.config.ts package.json yarn.lock > proof/input-sha256.txt
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run six token display cases (expected red)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: proof/results.json
        run: yarn playwright test --config playwright.token-display-visual.config.ts --reporter=list,json
      - name: Verify six cases and the named regression
        if: always()
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const report = require('./proof/results.json');
          assert.equal(report.stats.expected, 4);
          assert.equal(report.stats.unexpected, 2);
          assert.equal(report.stats.flaky, 0);
          assert.equal(report.stats.skipped, 0);
          const failures = [];
          function visit(suite) {
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {
                if (test.status === 'unexpected') failures.push({ title: spec.title, results: test.results });
              }
            }
            for (const child of suite.suites || []) visit(child);
          }
          for (const suite of report.suites) visit(suite);
          assert.deepEqual(failures.map(test => test.title).sort(), [
            'keeps token values and normalized USD amount legible at 320px, dark',
            'keeps token values and normalized USD amount legible at 320px, light'
          ]);
          for (const failure of failures) {
            assert(failure.results.some(result => (result.errors || []).some(error =>
              error.message.includes('WTEST is fully inside the amount box')
            )), failure.title);
          }
          console.log(JSON.stringify({ stats: report.stats, intendedFailures: failures.map(test => test.title) }));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-quantity-expected-red
          path: |
            proof/
            test-results/token-display-visual/
          retention-days: 7

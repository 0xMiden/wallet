name: Eligibility topology admission expected red
on:
  push:
    branches: [ci/1894-topology-admission-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 782070988ce97f9f0eff3ca97b05f7c7a36f8eed
      - name: Verify expected functional failures
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - a fixed authenticated cache scenario returns its closed result' result.log || exit 1
          grep -F 'ok 2 - unauthenticated requests never reach the control object' result.log || exit 1
          grep -F 'not ok 3 - unknown scenarios and caller-supplied inputs are refused before control access' result.log || exit 1
          grep -F '# fail 2' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-admission-red
          path: result.log

name: Oversized dApp result message regression
on:
  push:
    branches: [ci/1948-result-message-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: test "$(git rev-parse HEAD^)" = c38f47b3e2b0f5ff79f8da8b2c4fd57492c8031a
      - run: yarn install --frozen-lockfile --network-timeout 120000
        timeout-minutes: 6
      - name: Prove oversized result message is missing
        shell: bash
        run: |
          mkdir -p proof
          set +e
          yarn jest --runTestsByPath src/lib/miden/transaction/transactions.branches.test.ts --testNamePattern='tells the dApp an accepted transaction result exceeded the size limit' --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
          status=${PIPESTATUS[0]}
          test "$status" -ne 0 || exit 1
          node -e "const x=require('./proof/results.json'); const a=x.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status!=='pending'); if(a.length!==1 || a[0].status!=='failed' || !a[0].failureMessages.join(' ').includes('exceeds the size limit')) process.exit(1); console.log('Expected red: size-limit response is missing')"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dapp-result-message-red, path: proof/ }

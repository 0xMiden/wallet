name: Guardian Bridge-Out E2E (Chrome)
on:
  pull_request:
  workflow_dispatch: {}
concurrency:
  group: bridge-guardian-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Hermetic, per-PR guardian bridge-OUT coverage. The standard-account bridge
  # suite (pr-e2e / playwright.bridge.config.ts) runs on real testnet and only
  # exercises the NON-guardian send path, so a guardian-specific bridged-send
  # regression (e.g. minting a plain private P2ID instead of a public recallable
  # P2IDE — #439) shipped uncaught. This job is the union of the earn harness
  # (fake Epoch allocator + local Anvil, via build-time vite defines started by
  # the spec's beforeAll) and the local guardian co-signer (--profile guardian).
  bridge-guardian-e2e:
    name: bridge-guardian-e2e (chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_NETWORK: localhost
      MIDEN_NTX_AUTH: e2e-ntx-secret
      # Baked into the app bundle at BUILD time (vite defines). The guardian
      # bridge spec starts the matching hermetic doubles at RUN time on these
      # exact ports: the fake Epoch allocator (quote / miden-recipient / compact)
      # on :8548, and a local Anvil (Compact stub) the one EVM read hits on :8545.
      # No positions catalog is needed — bridge-out drives the Send UI, not /earn.
      EPOCH_ALLOCATOR_URL: http://127.0.0.1:8548
      E2E_EVM_RPC_URL: http://127.0.0.1:8545
      GUARDIAN_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      # Pinned exact (NOT @stable) — a required gate must not drift with upstream
      # rustc. Bump deliberately (and the cache key below).
      - uses: dtolnay/rust-toolchain@1.96.1
      # Foundry provides `anvil` — the local EVM node the spec boots for the
      # bridge intent's `getForcedWithdrawalStatus` read (AnvilInstance resolves
      # the binary from PATH / ~/.foundry/bin).
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Cache cargo (cli + note-transport)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ${{ runner.temp }}/note-transport/target
          key: bridge-guardian-e2e-cargo-v1-rust1.96.1-${{ hashFiles('package.json', 'playwright/e2e/local-stack/versions.env') }}
      - run: yarn install --frozen-lockfile
      - name: Pre-install miden-client-cli (off the per-test clock)
        run: |
          # Pre-install the pinned rev so the harness's `miden-client --version`
          # check short-circuits (the lazy auto-install's ~7min compile blows the
          # 300s per-test timeout). Skip when the cargo cache restored it.
          if ! command -v miden-client >/dev/null 2>&1; then
            url=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.url)")
            rev=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.rev)")
            cargo install miden-client-cli --git "$url" --rev "$rev" --locked
          fi
          miden-client --version
      - name: Start local 0.16 node (validator + sequencer + ntx-builder + prover)
        uses: ./.github/actions/run-local-node
      - name: Wait for node RPC
        working-directory: playwright/e2e/local-stack
        run: |
          probe() { timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for _ in $(seq 1 90); do
            probe 57291 && probe 50052 && echo "node(57291)+prover(50052) ready" && exit 0
            sleep 2
          done
          echo "node RPC (57291) / prover (50052) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -120
          exit 1
      - name: Bring up guardian
        working-directory: playwright/e2e/local-stack
        # ghcr image pulls can transiently time out (Client.Timeout on ghcr.io/v2/);
        # retry so a flaky guardian pull doesn't fail this (to-be-required) gate.
        run: |
          for attempt in 1 2 3; do
            docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian up -d guardian && exit 0
            echo "guardian bring-up attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          exit 1
      - name: Start note-transport
        # The CLI-minted token + the P2IDE collateral note reach / are discovered
        # by the wallet through the note-transport relay; without it funding hangs.
        run: playwright/e2e/local-stack/run-note-transport.sh
      - name: Build extension (localnet)
        run: yarn test:e2e:blockchain:build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Wait for guardian
        working-directory: playwright/e2e/local-stack
        run: |
          # HTTP probe (not a bare TCP connect): the guardian must actually answer.
          for _ in $(seq 1 120); do
            curl -s -o /dev/null -m 2 http://127.0.0.1:3000 && echo "guardian(3000) ready" && exit 0
            sleep 2
          done
          echo "guardian HTTP (3000) not ready in time" >&2
          docker compose --env-file versions.env --profile guardian -f docker-compose.local.yml logs guardian --no-color | tail -150
          exit 1
      - name: Run guardian bridge-out spec
        # --retries=1: a small margin for a loaded-runner sync hiccup, not a
        # flake-masker (a genuine P2ID regression fails all attempts on the assertion).
        run: xvfb-run -a yarn playwright test --config playwright.bridge-guardian.config.ts --retries=1
      - name: Dump stack logs on failure
        if: failure()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env --profile guardian -f docker-compose.local.yml logs --no-color | tail -400
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bridge-guardian-e2e-report
          path: test-results/
      - name: Tear down
        if: always()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env --profile guardian -f docker-compose.local.yml down -v || true

  # Stable required-check name: passes iff bridge-guardian-e2e succeeded. Mark
  # THIS "required" in branch protection so the name stays stable across renames.
  bridge-guardian-e2e-gate:
    name: bridge-guardian-e2e-gate
    needs: [bridge-guardian-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.bridge-guardian-e2e.result }}" != "success" ]; then
            echo "bridge-guardian-e2e ${{ needs.bridge-guardian-e2e.result }}"; exit 1; fi
          echo "bridge-guardian-e2e ok"

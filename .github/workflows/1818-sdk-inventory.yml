name: Android SDK inventory (one-off QA)
on:
  push:
    branches: [qa/1818-sdk-inventory-20261117]
permissions: {}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.repository == '0xMiden/wallet' && github.run_attempt == 1
    steps:
      - name: Verify and inventory the pinned public SDK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          scratch=$(mktemp -d "${RUNNER_TEMP}/sdk-inventory.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          if ! python3 -I - "$scratch" >"$scratch/diagnostics" 2>&1 <<'PY'
          import base64, hashlib, os, platform, shutil, stat, subprocess, sys, zipfile
          from pathlib import Path, PurePosixPath

          PACKAGES = [['cmdline-tools;16.0', '16.0', 'cmdline-tools/16.0', 'cmdline-tools', 'https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip', 165618711, '3fab261d5219d582321db0c5670b3bbafd563096bce3f6277eb358807fc15f6e', ''], ['platforms;android-36', '2', 'platforms/android-36', 'android-36', 'https://dl.google.com/android/repository/platform-36_r02.zip', 65878410, '37607369a28c5b640b3a7998868d45898ebcb777565a0e85f9acf36f29631d2e', ''], ['build-tools;36.0.0', '36.0.0', 'build-tools/36.0.0', 'android-16', 'https://dl.google.com/android/repository/build-tools_r36_linux.zip', 63737259, '5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b', ''], ['platform-tools', '37.0.1', 'platform-tools', 'platform-tools', 'https://dl.google.com/android/repository/platform-tools_r37.0.1-linux.zip', 9054187, 'd230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1', ''], ['emulator', '37.2.13', 'emulator', 'emulator', 'https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip', 349658551, 'cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd', ''], ['system-images;android-36;google_apis;x86_64', '7', 'system-images/android-36/google_apis/x86_64', 'x86_64', 'https://dl.google.com/android/repository/sys-img/google_apis/x86_64-36_r07.zip', 1895447397, 'b1bb0769d0bed7698e61f203d7dc9bf6e7c37cd01a39d0d8788a11186bc78160', '']]

          def check(condition):
              if not condition:
                  raise ValueError('SDK inventory verification failed')

          root = Path(sys.argv[1])
          sdk = root / 'sdk'
          sdk.mkdir()
          home = root / 'home'
          home.mkdir()
          check(platform.system() == 'Linux' and platform.machine() == 'x86_64')
          check(shutil.disk_usage(root).free > sum(row[5] for row in PACKAGES) + 5935795350 + 8 * 1024**3)
          paths = []
          for i, (_, _, _, _, url, size, digest, _) in enumerate(PACKAGES):
              path = root / f'{i}.zip'
              subprocess.run(['curl', '--disable', '--fail', '--silent', '--show-error', '--proto', '=https', '--max-time', '480', '--max-filesize', str(size), '--output', str(path), url], check=True)
              check(path.stat().st_size == size)
              with path.open('rb') as stream:
                  check(hashlib.file_digest(stream, 'sha256').hexdigest() == digest)
              paths.append(path)

          expanded = 0
          for (pkg, rev, dest, prefix, _, _, _, xml), path in zip(PACKAGES, paths):
              target = sdk / dest
              target.mkdir(parents=True)
              with zipfile.ZipFile(path) as archive:
                  entries = []
                  names = set()
                  for item in archive.infolist():
                      name = item.filename.rstrip('/')
                      rel = PurePosixPath(name)
                      mode = item.external_attr >> 16
                      expected_type = stat.S_IFDIR if item.is_dir() else stat.S_IFREG
                      check(bool(rel.parts) and rel.parts[0] == prefix and str(rel) == name and '..' not in rel.parts and chr(92) not in name)
                      check(name not in names and stat.S_IFMT(mode) == expected_type and not mode & 0o7022 and not item.flag_bits & 1)
                      names.add(name)
                      if len(rel.parts) == 1:
                          check(item.is_dir())
                          continue
                      expanded += item.file_size
                      check(expanded <= 5935795350)
                      entries.append((item, target.joinpath(*rel.parts[1:]), mode))
                  for item, out, mode in entries:
                      if item.is_dir():
                          out.mkdir(parents=True, exist_ok=True)
                          continue
                      out.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(item) as src, out.open('xb') as dst:
                          shutil.copyfileobj(src, dst)
                      check(out.stat().st_size == item.file_size)
                      out.chmod(stat.S_IMODE(mode))
              with (target / 'package.xml').open('xb') as descriptor:
                  descriptor.write(base64.b64decode(xml, validate=True))
              props = dict(line.split('=', 1) for line in (target / 'source.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
              check(props['Pkg.Revision'].strip() == rev)
              if pkg.startswith(('platforms;', 'system-images;')):
                  check(props['AndroidVersion.ApiLevel'].strip() == '36')
              if pkg.startswith('system-images;'):
                  check(props['SystemImage.Abi'].strip() == 'x86_64' and props['SystemImage.TagId'].strip() == 'google_apis')
          check(expanded == 5935795350)
          for binpath in ('cmdline-tools/16.0/bin/sdkmanager', 'platform-tools/adb', 'build-tools/36.0.0/aapt', 'emulator/emulator'):
              check(os.access(sdk / binpath, os.X_OK))

          # Run only the installed-package listing, with no network or inherited SDK home.
          env = ['env', '-i', f'HOME={home}', f'ANDROID_USER_HOME={home}', f'ANDROID_HOME={sdk}', f'ANDROID_SDK_ROOT={sdk}', 'PATH=/usr/bin:/bin', f'JAVA_HOME={os.environ["JAVA_HOME_17_X64"]}']
          identity = ['setpriv', '--reuid', str(os.getuid()), '--regid', str(os.getgid()), '--clear-groups', '--no-new-privs']
          result = subprocess.run(['sudo', '-n', 'unshare', '--net', '--', *identity, *env, str(sdk / 'cmdline-tools/16.0/bin/sdkmanager'), '--sdk_root=' + str(sdk), '--list_installed'], stdout=subprocess.PIPE, text=True, check=True, timeout=120)
          installed = {}
          for line in result.stdout.splitlines():
              columns = [field.strip() for field in line.split('|')]
              if len(columns) >= 4 and columns[0] != 'Path':
                  check(columns[0] not in installed)
                  installed[columns[0]] = columns[1]
          check(installed == {pkg: rev for pkg, rev, *_ in PACKAGES})
          check(not (sdk / 'licenses').exists())
          PY
          then
            echo '1818 SDK inventory: FAIL'
            exit 1
          fi
          rm -rf -- "$scratch"
          trap - EXIT
          echo '1818 SDK inventory: PASS'

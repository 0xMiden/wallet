name: Sepolia payout diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install read-only RPC client
        run: npm install --prefix "$RUNNER_TEMP/receipt-client" --ignore-scripts --no-audit --no-fund viem@2.57.10
      - name: Verify correlated mint and actual fee without sending
        run: NODE_PATH="$RUNNER_TEMP/receipt-client/node_modules" node scripts/ci/release-sepolia-diagnostic/inspect.cjs scripts/ci/release-sepolia-diagnostic/inputs.json

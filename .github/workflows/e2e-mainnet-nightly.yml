name: R1 decline popup green proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1-decline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Test full popup helper suite without funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/test-dapp.test.ts --json --outputFile=r1-decline-proof.json
      - name: Type check
        run: yarn tsc --noEmit -p .
      - name: Lint named popup helper files
        run: yarn eslint --max-warnings=0 playwright/e2e/helpers/test-dapp.ts playwright/e2e/helpers/test-dapp.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-decline-proof
          path: r1-decline-proof.json

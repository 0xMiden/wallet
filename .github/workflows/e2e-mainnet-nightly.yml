name: Swap mounted state regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swap-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Test mounted registry and quote delivery without funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath src/lib/miden/swap/use-swap-tokens.override.test.tsx src/screens/swap-flow/SwapManager.test.tsx --json --outputFile=swap-reactivity-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swap-reactivity-proof
          path: swap-reactivity-proof.json

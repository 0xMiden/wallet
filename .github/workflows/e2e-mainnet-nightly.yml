name: E2E Mainnet Nightly

# Two Chrome jobs against Miden mainnet, from the ref they run on (main for the schedule). The first restores two
# long-lived accounts, sends one base unit of the native asset each way, then loops the minimum bridge on every
# mainnet USDCx route: Arc, Base, Arbitrum and Ethereum. The second loops native ETH over AggLayer, whose exit takes
# 40 to 45 minutes to become claimable on Ethereum; it runs after the first, failed or not, since both use the plain
# account and the Ethereum key. The loops check every chain first and send nothing if any one of them cannot cover
# tonight and tomorrow.
#
# Until the accounts on issue 1629 are funded, a scheduled run fails without moving
# funds, since the accounts hold none.

on:
  # After e2e-resilience.yml at 05:00 UTC.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the main job; a scheduled run uses the default.
        type: choice
        default: warp-ubuntu-latest-x64-8x
        options:
          - warp-ubuntu-latest-x64-8x
          - ubuntu-latest

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false

jobs:
  mainnet-nightly:
    name: Chrome mainnet round trip
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'warp-ubuntu-latest-x64-8x' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 225 || 180 }}
    outputs:
      started: ${{ steps.started.outputs.started }}
    env:
      E2E_NETWORK: mainnet
      E2E_MAINNET_PLAIN_SEED: ${{ secrets.E2E_MAINNET_PLAIN_SEED }}
      E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
      E2E_MAINNET_EVM_KEY: ${{ secrets.E2E_MAINNET_EVM_KEY }}
      MAINNET_ONE_CLICK_CHECKPOINT_ANCHOR_RUN_ID: ${{ vars.MAINNET_ONE_CLICK_CHECKPOINT_ANCHOR_RUN_ID }}
      # 1Click is off until the route is enabled on NEAR: set the repository variable to `true` to run its stages.
      MAINNET_ONE_CLICK_ENABLED: ${{ vars.MAINNET_ONE_CLICK_ENABLED }}
    steps:
      # The AggLayer job runs after this one whether it passes or fails, but not when it never started.
      - name: Mark the main job started
        id: started
        run: echo 'started=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli

      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos

      - name: Install xvfb
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture

      - name: Build the extension for mainnet
        run: yarn test:e2e:blockchain:build

      - name: Find prior mainnet checkpoint run
        id: prior-mainnet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-mainnet-nightly.yml/runs?branch=main&status=completed&per_page=20" --jq '.workflow_runs[].id')
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/artifacts" --jq '.artifacts[].name')
            if printf '%s\n' "$artifacts" | grep -Fxq "mainnet-1click-final-$run_id"; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo 'final=true' >> "$GITHUB_OUTPUT"
              break
            fi
            if printf '%s\n' "$artifacts" | grep -Fxq "mainnet-1click-execute-started-$run_id"; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo 'started=true' >> "$GITHUB_OUTPUT"
              break
            fi
            if printf '%s\n' "$artifacts" | grep -Fxq "mainnet-1click-preflight-$run_id"; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo 'preflight=true' >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$runs"

      - name: Restore prior completed mainnet artifact
        if: steps.prior-mainnet.outputs.final == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.prior-mainnet.outputs.run_id }}
          github-token: ${{ github.token }}
          name: mainnet-1click-final-${{ steps.prior-mainnet.outputs.run_id }}
          path: test-results/prior-final

      - name: Restore prior execution-start marker
        if: steps.prior-mainnet.outputs.final != 'true' && steps.prior-mainnet.outputs.started == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.prior-mainnet.outputs.run_id }}
          github-token: ${{ github.token }}
          name: mainnet-1click-execute-started-${{ steps.prior-mainnet.outputs.run_id }}
          path: test-results/prior-started

      - name: Restore prior read-only preflight
        if: steps.prior-mainnet.outputs.final != 'true' && steps.prior-mainnet.outputs.started != 'true' && steps.prior-mainnet.outputs.preflight == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.prior-mainnet.outputs.run_id }}
          github-token: ${{ github.token }}
          name: mainnet-1click-preflight-${{ steps.prior-mainnet.outputs.run_id }}
          path: test-results/prior-preflight

      - name: Carry forward the strongest prior 1Click checkpoint
        run: |
          prior=""
          if [ -f test-results/prior-final/roundtrip.json ]; then
            prior="test-results/prior-final/roundtrip.json"
          elif [ -f test-results/prior-started/roundtrip.json ]; then
            prior="test-results/prior-started/roundtrip.json"
          elif [ -f test-results/prior-preflight/roundtrip.json ]; then
            prior="test-results/prior-preflight/roundtrip.json"
          fi
          current="test-results/mainnet-1click-state/roundtrip.json"
          if [ -n "$prior" ]; then
            mkdir -p "$(dirname "$current")"
            cp "$prior" "$current"
          fi

      - name: Run mainnet round trip, USDCx bridge loops, and read-only 1Click preflight
        run: |
          set -e
          E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-round-trip xvfb-run -a yarn playwright test mainnet-round-trip.spec.ts --config playwright.mainnet.config.ts
          E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-bridge-loop xvfb-run -a yarn playwright test mainnet-bridge-loop.spec.ts --config playwright.mainnet.config.ts
          if [ "${MAINNET_ONE_CLICK_ENABLED:-}" = true ]; then
            MAINNET_ONE_CLICK_MODE=preflight E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-1click-preflight xvfb-run -a yarn playwright test mainnet-1click-loop.spec.ts --config playwright.mainnet.config.ts
          else
            echo 'MAINNET_ONE_CLICK_ENABLED is not true: skipping the 1Click preflight.'
          fi

      - name: Check whether 1Click preflight produced an authorized route
        id: mainnet-1click-ready
        run: |
          if [ "${MAINNET_ONE_CLICK_ENABLED:-}" = true ] && [ -f test-results/mainnet-1click-preflight/summary.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify reviewed initial 1Click checkpoint anchor
        if: success() && steps.mainnet-1click-ready.outputs.ready == 'true' && steps.prior-mainnet.outputs.run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          anchor="$MAINNET_ONE_CLICK_CHECKPOINT_ANCHOR_RUN_ID"
          if ! [[ "$anchor" =~ ^[1-9][0-9]*$ ]]; then
            echo 'A reviewed completed mainnet nightly run ID is required before first 1Click activation.' >&2
            exit 1
          fi
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-mainnet-nightly.yml" --jq '.id')
          read -r anchor_workflow anchor_branch anchor_status anchor_conclusion <<< "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$anchor" --jq '[.workflow_id, .head_branch, .status, .conclusion] | @tsv')"
          if [ "$anchor_workflow" != "$workflow_id" ] || [ "$anchor_branch" != main ] || [ "$anchor_status" != completed ] || [ "$anchor_conclusion" != success ]; then
            echo 'The configured 1Click checkpoint anchor is not a successful completed run of this mainnet workflow on main.' >&2
            exit 1
          fi

      - name: Upload read-only 1Click preflight checkpoint
        if: success() && steps.mainnet-1click-ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-1click-preflight-${{ github.run_id }}
          path: test-results/mainnet-1click-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error

      - name: Create execution-start marker
        if: steps.mainnet-1click-ready.outputs.ready == 'true'
        run: MAINNET_ONE_CLICK_MODE=arm E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-1click-arm xvfb-run -a yarn playwright test mainnet-1click-loop.spec.ts --config playwright.mainnet.config.ts

      - name: Upload execution-start marker before funded stage
        if: steps.mainnet-1click-ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-1click-execute-started-${{ github.run_id }}
          path: test-results/mainnet-1click-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error

      - name: Run funded 1Click swap-out and swap-back acceptance
        if: steps.mainnet-1click-ready.outputs.ready == 'true'
        run: MAINNET_ONE_CLICK_MODE=execute E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-1click-execute xvfb-run -a yarn playwright test mainnet-1click-loop.spec.ts --config playwright.mainnet.config.ts

      - name: Retain the current 1Click recovery checkpoint
        if: always() && hashFiles('test-results/mainnet-1click-state/roundtrip.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-1click-final-${{ github.run_id }}
          path: test-results/mainnet-1click-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish the spend summary
        if: always()
        run: |
          if [ -f test-results/mainnet-spend.json ]; then
            {
              echo '### Mainnet spend'
              echo '```json'
              cat test-results/mainnet-spend.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-nightly-${{ github.run_id }}
          path: |
            test-results/mainnet-round-trip/
            test-results/mainnet-bridge-loop/
            test-results/mainnet-1click-preflight/
            test-results/mainnet-1click-arm/
            test-results/mainnet-1click-execute/
            test-results/mainnet-1click-state/
            test-results/mainnet-spend.json
          retention-days: 90
          if-no-files-found: ignore

  mainnet-agglayer:
    name: Chrome mainnet AggLayer loop
    needs: mainnet-nightly
    # After the main job, failed or not: the two share the plain account and the Ethereum key, so they never overlap.
    # !cancelled() rather than always(), so cancelling the run does not start a funded loop.
    if: ${{ !cancelled() && needs.mainnet-nightly.outputs.started == 'true' }}
    # It mostly waits on the exit: up to 120 minutes for its claim after the bridge-out, inside a 165-minute test.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 230 || 185 }}
    env:
      E2E_NETWORK: mainnet
      E2E_MAINNET_PLAIN_SEED: ${{ secrets.E2E_MAINNET_PLAIN_SEED }}
      E2E_MAINNET_EVM_KEY: ${{ secrets.E2E_MAINNET_EVM_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli

      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos

      - name: Install xvfb
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture

      - name: Build the extension for mainnet
        run: yarn test:e2e:blockchain:build

      - name: Run the mainnet AggLayer loop
        run: E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-agglayer-loop xvfb-run -a yarn playwright test mainnet-agglayer-loop.spec.ts --config playwright.mainnet.config.ts

      - name: Publish the AggLayer summary
        if: always()
        run: |
          if [ -f test-results/mainnet-agglayer-loop/agglayer-night.md ]; then
            cat test-results/mainnet-agglayer-loop/agglayer-night.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-agglayer-${{ github.run_id }}
          path: test-results/mainnet-agglayer-loop/
          retention-days: 90
          if-no-files-found: ignore

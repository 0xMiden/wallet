name: Android consume result regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consume-result:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Test live consume completion without funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath src/lib/miden/transaction/consume-reaper-liveness.test.ts --json --outputFile=consume-result-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consume-result-proof
          path: consume-result-proof.json

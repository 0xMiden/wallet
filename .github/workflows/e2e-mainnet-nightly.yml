name: iOS profile validation proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Profile material regression without native builds or credentials
        run: |
          node --test scripts/store-publishing/*.test.mjs
          python3 scripts/store-publishing/apple-profile.test.py
          python3 scripts/store-publishing/inspect-artifact.test.py

name: Combined stores startup eligibility source proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-routing-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore and prove exact candidate content tree for global workflow contracts
        run: |
          git fetch --no-tags --depth=1 origin 4215fe91213e92c0a6adf629f51b726bc1a540bb
          git show 4215fe91213e92c0a6adf629f51b726bc1a540bb:.github/workflows/e2e-mainnet-nightly.yml > .github/workflows/e2e-mainnet-nightly.yml
          git add .github/workflows/e2e-mainnet-nightly.yml
          test "$(git write-tree)" = 032529fc5961678ce1fff1d82dc7e2e94b2846bd
      - name: Combined publishing and coordinator regression tests without store access
        run: node --test scripts/store-publishing/*.test.mjs services/feature-eligibility/worker.test.mjs
      - name: Retained artifact and profile validation without signing
        run: |
          python3 scripts/store-publishing/apple-profile.test.py
          python3 scripts/store-publishing/inspect-artifact.test.py
      - uses: ./.github/actions/yarn-install
      - name: Verify actual frozen workflow and build contracts without store access
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/harness/linked-pr-injection.test.ts src/lib/build-scripts.test.ts src/lib/update/release-workflows.test.ts src/app/WalletAccessGate.test.tsx src/lib/remote-config/geo-lookup.test.ts src/lib/remote-config/geo.test.ts src/lib/remote-config/runtime.test.ts src/lib/telemetry/crash-diagnostics.test.ts src/lib/telemetry/crash-diagnostics.policy.test.ts src/lib/telemetry/egress-boundary.test.ts src/lib/telemetry/use-user-visible-error.test.tsx src/lib/telemetry/user-visible-error.test.ts src/lib/telemetry/user-visible-error.guard.test.ts
      - name: Check combined application types
        run: yarn tsc --noEmit
      - name: Lint combined seams
        run: yarn eslint playwright/e2e/harness/linked-pr-injection.test.ts src/app/WalletAccessGate.tsx src/app/WalletAccessGate.test.tsx src/lib/remote-config/geo-lookup.ts src/lib/remote-config/geo-lookup.test.ts src/lib/remote-config/geo.ts src/lib/remote-config/runtime.ts src/lib/remote-config/runtime.test.ts src/lib/telemetry/crash-diagnostics.ts src/lib/telemetry/crash-diagnostics.test.ts src/lib/telemetry/crash-diagnostics.policy.test.ts src/lib/telemetry/egress-boundary.test.ts src/lib/telemetry/use-user-visible-error.ts src/lib/telemetry/user-visible-error.ts src/lib/telemetry/user-visible-error.test.ts
      - name: Check new routing and adapter formatting
        run: yarn prettier --check playwright/e2e/harness/linked-pr-injection.test.ts scripts/store-publishing/release-plan.mjs scripts/store-publishing/release-plan.test.mjs scripts/store-publishing/README.md

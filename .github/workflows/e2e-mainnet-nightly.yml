name: Mainnet settled balance regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Test vault measurement boundaries without sending
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/mainnet-roundtrip-balance.test.ts playwright/e2e/helpers/mainnet-bridge-plan.test.ts playwright/e2e/helpers/balance-truth.test.ts --json --outputFile=receipt-proof.json
      - name: Type check
        run: yarn tsc --noEmit
      - name: Lint changed helpers
        run: yarn eslint playwright/e2e/helpers/mainnet-roundtrip-balance.ts playwright/e2e/helpers/mainnet-roundtrip-balance.test.ts playwright/e2e/tests/mainnet/mainnet-round-trip.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-proof
          path: receipt-proof.json

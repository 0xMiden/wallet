name: Mainnet fee policy regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fee-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Test mainnet fee eligibility without sending
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/arc-usdcx.test.ts playwright/e2e/helpers/usdcx-l2-deposit.test.ts playwright/e2e/helpers/usdcx-cctp-proof.test.ts playwright/e2e/helpers/mainnet-bridge-plan.test.ts --json --outputFile=receipt-proof.json
      - name: Type check
        run: yarn tsc --noEmit
      - name: Lint changed helpers
        run: yarn eslint playwright/e2e/helpers/arc-usdcx.ts playwright/e2e/helpers/arc-usdcx.test.ts playwright/e2e/helpers/usdcx-l2-deposit.ts playwright/e2e/helpers/usdcx-l2-deposit.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-proof
          path: receipt-proof.json

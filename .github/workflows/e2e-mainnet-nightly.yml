name: Height witness trusted roots regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate-regression:
    runs-on: macos-26-xlarge
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: ./.github/actions/yarn-install
      - name: Test height witness regression without funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/dapp-node-calls.test.ts --json --outputFile=height-ca-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: height-ca-tests
          path: height-ca-tests.json

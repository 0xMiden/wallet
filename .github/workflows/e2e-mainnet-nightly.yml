name: iOS SHA256 profile binding proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind the valid Store profile to its SHA256 identity
        run: python3 scripts/store-publishing/apple-profile.test.py ProfileTests.test_valid_store_profile_binds_installed_distribution_certificate

name: Static dApp transport green proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Verify static transport and direct helper consumers
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/test-dapp-transport.test.ts playwright/e2e/helpers/test-dapp-server.test.ts playwright/e2e/helpers/test-dapp.test.ts playwright/e2e/helpers/react-dapp.test.ts playwright/e2e/helpers/dapp-command-server.test.ts --json --outputFile=trace-transport-proof.json
      - name: TypeScript check
        run: yarn tsc --noEmit
      - name: Lint changed harness files
        run: yarn eslint playwright/e2e/helpers/test-dapp-server.ts playwright/e2e/helpers/test-dapp-server.test.ts playwright/e2e/helpers/test-dapp-transport.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-transport-proof
          path: trace-transport-proof.json

name: Mainnet receipt regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Test receipt chain budgets without sending
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/arc-usdcx.test.ts --testNamePattern='waitForReceipt chain budgets' --json --outputFile=receipt-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-proof
          path: receipt-proof.json

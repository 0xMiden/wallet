name: Swap amount-anchor proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swap-anchor-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Swap anchor regression without funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/swap-order-inputs.test.ts src/lib/miden/swap/quote.test.ts src/screens/swap-flow/useSwapQuote.test.ts src/screens/swap-flow/SwapManager.test.tsx --json --outputFile=swap-anchor-proof.json
      - name: TypeScript
        run: yarn ts
      - name: Named lint and formatting
        run: |
          yarn eslint playwright/e2e/helpers/swap.ts playwright/e2e/helpers/swap-order-inputs.test.ts playwright/e2e/tests/swap/swap-cancel.spec.ts playwright/e2e/tests/swap/swap-create-guards.spec.ts playwright/e2e/tests/swap/swap-full-fill.spec.ts playwright/e2e/tests/swap/swap-full-fill-reverse.spec.ts playwright/e2e/tests/swap/swap-partial-fill.spec.ts playwright/e2e/tests/swap/swap-guardian.spec.ts
          yarn prettier --check playwright/e2e/helpers/swap.ts playwright/e2e/helpers/swap-order-inputs.test.ts playwright/e2e/tests/swap/swap-cancel.spec.ts playwright/e2e/tests/swap/swap-create-guards.spec.ts playwright/e2e/tests/swap/swap-full-fill.spec.ts playwright/e2e/tests/swap/swap-full-fill-reverse.spec.ts playwright/e2e/tests/swap/swap-partial-fill.spec.ts playwright/e2e/tests/swap/swap-guardian.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swap-anchor-proof
          path: swap-anchor-proof.json

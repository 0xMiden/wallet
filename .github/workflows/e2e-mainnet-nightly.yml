name: Height witness trusted roots regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate-regression:
    runs-on: macos-26-xlarge
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: ./.github/actions/yarn-install
      - name: Test height witness regression without funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/dapp-node-calls.test.ts --json --outputFile=height-ca-tests.json
      - name: Type check
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: yarn tsc --noEmit -p .
      - name: Lint named height witness files
        run: yarn eslint --max-warnings=0 playwright/e2e/helpers/dapp-node-calls.ts playwright/e2e/helpers/dapp-node-calls.test.ts
      - name: Query actual SDK through the source height witness
        env:
          TS_NODE_COMPILER_OPTIONS: '{"module":"CommonJS","moduleResolution":"node"}'
        run: |
          node -r ts-node/register/transpile-only <<'JS'
          const { nodeHeight, waitForNodeHeight } = require('./playwright/e2e/helpers/dapp-node-calls.ts');
          const { writeFileSync } = require('node:fs');
          (async () => {
            const rpc = 'https://rpc.testnet.miden.io';
            const before = await nodeHeight(rpc, 30000);
            const after = await waitForNodeHeight(rpc, before, 30000);
            if (!Number.isInteger(before) || !Number.isInteger(after) || before <= 0 || after < before) throw new Error('invalid source height witness');
            const report = { node: process.version, platform: process.platform, fundedActions: false, sourceHeightWitness: true, calls: 2, before, after };
            writeFileSync('height-ca-native.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: height-ca-tests
          path: |
            height-ca-tests.json
            height-ca-native.json

name: iOS SHA256 profile binding proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind the valid Store profile to its SHA256 identity
        run: |
          python3 scripts/store-publishing/apple-profile.test.py
          python3 scripts/store-publishing/inspect-artifact.test.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publishing regression suite
        run: node --test scripts/store-publishing/*.test.mjs

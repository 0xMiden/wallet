name: Combined four-target store routing proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-routing-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: All combined publishing and workflow-contract tests without store access
        run: node --test scripts/store-publishing/*.test.mjs
      - name: Retained profile validation without signing
        run: python3 scripts/store-publishing/apple-profile.test.py

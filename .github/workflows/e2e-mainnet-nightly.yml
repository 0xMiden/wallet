name: E2E Mainnet Nightly

# Recover every provider before spending. New loops recycle the same Guardian principal in
# swap → Epoch → NEAR order under one $2 loss/fee allowance; legacy coverage runs afterwards.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the main job; a scheduled run uses the default.
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - warp-ubuntu-latest-x64-8x
      swaps_only:
        description: Validate only the solver round trip, without fresh bridge or send fees.
        type: boolean
        default: false
      loops_only:
        description: Validate swap, Epoch and NEAR without the legacy send, USDCx or AggLayer loops.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false

jobs:
  mainnet-nightly:
    name: Chrome mainnet round trip
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 245 || 200 }}
    outputs:
      started: ${{ steps.started.outputs.started }}
      recovery_only: ${{ steps.recovery-barrier.outputs.recovery_only }}
      recovery_cleared: ${{ steps.recovery-barrier.outputs.recovery_cleared }}
      legacy_cleared: ${{ steps.legacy-barrier.outputs.legacy_cleared }}
    env:
      E2E_NETWORK: mainnet
      E2E_MAINNET_PLAIN_SEED: ${{ secrets.E2E_MAINNET_PLAIN_SEED }}
      E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
      E2E_MAINNET_EVM_KEY: ${{ secrets.E2E_MAINNET_EVM_KEY }}
    steps:
      - name: Mark the main job started
        id: started
        run: echo 'started=true' >> "$GITHUB_OUTPUT"
      - name: Require an original, unambiguous run
        env:
          SWAPS_ONLY: ${{ inputs.swaps_only }}
          LOOPS_ONLY: ${{ inputs.loops_only }}
        run: |
          [ "$GITHUB_RUN_ATTEMPT" = 1 ]
          if [ "$SWAPS_ONLY" = true ] && [ "$LOOPS_ONLY" = true ]; then
            echo 'Choose swaps_only or loops_only, not both.' >&2; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr
      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install
      - name: Find prior swap checkpoint
        id: swap-prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs find
      - name: Restore prior swap checkpoint
        if: steps.swap-prior.outputs.name != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.swap-prior.outputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.swap-prior.outputs.name }}
          path: test-results/mainnet-swap-state
      - name: Check prior swap submission attempts
        id: swap-attempts
        if: steps.swap-prior.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs attempts
      - name: Find prior Epoch checkpoint
        id: epoch-prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs find epoch
      - name: Restore prior Epoch checkpoint
        if: steps.epoch-prior.outputs.name != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.epoch-prior.outputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.epoch-prior.outputs.name }}
          path: test-results/mainnet-epoch-state
      - name: Check prior Epoch submission attempts
        id: epoch-attempts
        if: steps.epoch-prior.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs attempts epoch
      - name: Find prior NEAR checkpoint
        id: near-prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs find near
      - name: Restore prior NEAR checkpoint
        if: steps.near-prior.outputs.name != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.near-prior.outputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.near-prior.outputs.name }}
          path: test-results/mainnet-1click-state
      - name: Check prior NEAR submission attempts
        id: near-attempts
        if: steps.near-prior.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs attempts near
      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli
      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos
      - name: Install xvfb
        timeout-minutes: 6
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then exit 0; fi
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture
      - name: Select owned provider overlay
        id: overlay
        env:
          SWAPS_ONLY: ${{ inputs.swaps_only }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const active = ['epoch', '1click'].some(provider => {
            const path = `test-results/mainnet-${provider}-state/roundtrip.json`;
            return existsSync(path) && !['complete', 'cancelled', 'unspent'].includes(JSON.parse(readFileSync(path, 'utf8')).phase);
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${process.env.SWAPS_ONLY !== 'true' || active}\n`);
          NODE
      - name: Start owned provider loop config
        if: steps.overlay.outputs.required == 'true'
        run: |
          set -euo pipefail
          yarn esbuild playwright/e2e/helpers/mainnet-loop-config.ts --bundle --platform=node --format=esm --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-loop-config.mjs
          node scripts/mainnet-loop-config-server.mjs > "$RUNNER_TEMP/mainnet-config.log" 2>&1 &
          pid=$!
          for n in $(seq 1 30); do
            if grep -q '^Nightly mainnet snapshot ready at http://127.0.0.1:' "$RUNNER_TEMP/mainnet-config.log" && grep -q '^MIDEN_REMOTE_CONFIG_URL=http://127.0.0.1:' "$GITHUB_ENV"; then exit 0; fi
            kill -0 "$pid"; sleep 1
          done
          echo 'Owned provider overlay did not become ready.' >&2; exit 1
      - name: Build the extension for mainnet
        run: yarn test:e2e:blockchain:build
      - name: Recover prior mainnet swap
        id: swap-recover
        env:
          MAINNET_SWAP_BOOTSTRAP: ${{ steps.swap-prior.outputs.bootstrap }}
          MAINNET_SWAP_PRIOR_FORWARD_ATTEMPTED: ${{ steps.swap-attempts.outputs.forward_attempted }}
          MAINNET_SWAP_PRIOR_REVERSE_ATTEMPTED: ${{ steps.swap-attempts.outputs.reverse_attempted }}
        run: |
          echo 'recovery_only=false' >> "$GITHUB_OUTPUT"
          MAINNET_SWAP_MODE=recover E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-swap-recover xvfb-run -a yarn playwright test mainnet-swap-loop.spec.ts --config playwright.mainnet.config.ts --retries=0
      - name: Check original swap return disposition
        id: swap-recovery-return
        if: steps.swap-recover.outputs.recovery_only == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const state = JSON.parse(readFileSync('test-results/mainnet-swap-state/roundtrip.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${state.phase === 'reverse-authorized' && state.authorizationRunId === process.env.GITHUB_RUN_ID}\n`);
          NODE
      - name: Upload mainnet swap reverse authorization
        if: steps.swap-recovery-return.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-swap-reverse-authorized-${{ github.run_id }}
          path: test-results/mainnet-swap-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error
      - name: Run mainnet swap reverse
        if: steps.swap-recovery-return.outputs.required == 'true'
        run: |
          umask 077
          (code=0; MAINNET_SWAP_MODE=reverse MAINNET_SWAP_SDK_GATE=test-results/mainnet-swap-state/roundtrip.json.reverse.sdk E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/swap-recovered-return-results" xvfb-run -a yarn playwright test mainnet-swap-loop.spec.ts --config playwright.mainnet.config.ts --retries=0 > "$RUNNER_TEMP/swap-recovered-return.log" 2>&1 || code=$?; printf '%s\n' "$code" > "$RUNNER_TEMP/swap-recovered-return.exit") &
          echo $! > "$RUNNER_TEMP/swap-recovered-return.pid"
      - name: Upload recovered swap SDK return authority
        if: steps.swap-recovery-return.outputs.required == 'true'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-swap-state/roundtrip.json
          gate: test-results/mainnet-swap-state/roundtrip.json.reverse.sdk
          artifact-name: mainnet-swap-reverse-sdk-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/swap-recovered-return.pid
          snapshot-directory: ${{ runner.temp }}/swap-recovered-return-auth
      - name: Wait for recovered swap return
        if: steps.swap-recovery-return.outputs.required == 'true'
        timeout-minutes: 31
        run: |
          while [ ! -f "$RUNNER_TEMP/swap-recovered-return.exit" ]; do read -r pid < "$RUNNER_TEMP/swap-recovered-return.pid"; kill -0 "$pid"; sleep 1; done
          read -r code < "$RUNNER_TEMP/swap-recovered-return.exit"; [ "$code" = 0 ] || { echo 'Original swap return blocked; retain its authority.' >&2; exit 1; }
      - name: Recover prior mainnet Epoch
        env:
          MAINNET_EPOCH_FORWARD_ATTEMPTED: ${{ steps.epoch-attempts.outputs.forward_attempted }}
        run: |
          umask 077
          mkdir -p test-results/mainnet-epoch-state
          (
            code=0
            MAINNET_EPOCH_MODE=recover E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/epoch-recover-results" xvfb-run -a yarn playwright test mainnet-epoch-loop.spec.ts --config playwright.mainnet.config.ts --retries=0 > "$RUNNER_TEMP/epoch-recover.log" 2>&1 || code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/epoch-recover.exit"
            if [ "$code" = 0 ]; then touch test-results/mainnet-epoch-state/roundtrip.json.recover.done.ready; fi
          ) &
          echo $! > "$RUNNER_TEMP/epoch-recover.pid"
      - name: Authorize original Epoch reverse
        id: epoch-recover-auth
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-epoch-state/roundtrip.json
          gate: test-results/mainnet-epoch-state/roundtrip.json.recover-reverse
          artifact-name: mainnet-epoch-reverse-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/epoch-recover.pid
          snapshot-directory: ${{ runner.temp }}/epoch-recover-auth
          alternative-gates: |
            test-results/mainnet-epoch-state/roundtrip.json.recover.claim
            test-results/mainnet-epoch-state/roundtrip.json.refund
            test-results/mainnet-epoch-state/roundtrip.json.recover.done
      - name: Upload mainnet epoch signed EVM 1
        id: epoch-recover-evm1
        if: steps.epoch-recover-auth.outputs.skipped != 'true'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-epoch-state/roundtrip.json
          gate: test-results/mainnet-epoch-state/roundtrip.json.recover-reverse.evm-1
          artifact-name: mainnet-epoch-reverse-signed-1-${{ github.run_id }}
          process-id: ${{ runner.temp }}/epoch-recover.pid
          snapshot-directory: ${{ runner.temp }}/epoch-recover-evm1
      - name: Upload mainnet epoch signed EVM 2
        id: epoch-recover-evm2
        if: steps.epoch-recover-auth.outputs.skipped != 'true' && steps.epoch-recover-evm1.outputs.envelope-kind != 'deposit'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-epoch-state/roundtrip.json
          gate: test-results/mainnet-epoch-state/roundtrip.json.recover-reverse.evm-2
          artifact-name: mainnet-epoch-reverse-signed-2-${{ github.run_id }}
          process-id: ${{ runner.temp }}/epoch-recover.pid
          snapshot-directory: ${{ runner.temp }}/epoch-recover-evm2
      - name: Upload mainnet epoch signed EVM 3
        if: steps.epoch-recover-auth.outputs.skipped != 'true' && steps.epoch-recover-evm1.outputs.envelope-kind != 'deposit' && steps.epoch-recover-evm2.outputs.envelope-kind != 'deposit'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-epoch-state/roundtrip.json
          gate: test-results/mainnet-epoch-state/roundtrip.json.recover-reverse.evm-3
          artifact-name: mainnet-epoch-reverse-signed-3-${{ github.run_id }}
          process-id: ${{ runner.temp }}/epoch-recover.pid
          snapshot-directory: ${{ runner.temp }}/epoch-recover-evm3
      - name: Upload mainnet epoch native return claim
        if: steps.epoch-recover-auth.outputs.skipped != 'true'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-epoch-state/roundtrip.json
          gate: test-results/mainnet-epoch-state/roundtrip.json.recover-reverse.claim
          artifact-name: mainnet-epoch-return-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/epoch-recover.pid
          snapshot-directory: ${{ runner.temp }}/epoch-recover-new-claim
      - name: Authorize original epoch return claim
        if: steps.epoch-recover-auth.outputs.alternative-gate == 'test-results/mainnet-epoch-state/roundtrip.json.recover.claim'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-epoch-state/roundtrip.json
          gate: test-results/mainnet-epoch-state/roundtrip.json.recover.claim
          artifact-name: mainnet-epoch-return-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/epoch-recover.pid
          snapshot-directory: ${{ runner.temp }}/epoch-recover-old-claim
      - name: Authorize original epoch refund
        if: steps.epoch-recover-auth.outputs.alternative-gate == 'test-results/mainnet-epoch-state/roundtrip.json.refund'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-epoch-state/roundtrip.json
          gate: test-results/mainnet-epoch-state/roundtrip.json.refund
          artifact-name: mainnet-epoch-refund-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/epoch-recover.pid
          snapshot-directory: ${{ runner.temp }}/epoch-recover-refund
      - name: Wait for original Epoch recovery
        id: epoch-recovered
        timeout-minutes: 21
        run: |
          while [ ! -f "$RUNNER_TEMP/epoch-recover.exit" ]; do read -r pid < "$RUNNER_TEMP/epoch-recover.pid"; kill -0 "$pid"; sleep 1; done
          read -r code < "$RUNNER_TEMP/epoch-recover.exit"
          if [ "$code" != 0 ]; then echo 'Original Epoch recovery blocked; retain its public checkpoint.' >&2; exit 1; fi
      - name: Recover prior mainnet NEAR
        env:
          MAINNET_NEAR_FORWARD_ATTEMPTED: ${{ steps.near-attempts.outputs.forward_attempted }}
        run: |
          umask 077
          mkdir -p test-results/mainnet-1click-state
          (
            code=0
            MAINNET_NEAR_MODE=recover E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/near-recover-results" xvfb-run -a yarn playwright test mainnet-1click-loop.spec.ts --config playwright.mainnet.config.ts --retries=0 > "$RUNNER_TEMP/near-recover.log" 2>&1 || code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/near-recover.exit"
            if [ "$code" = 0 ]; then touch test-results/mainnet-1click-state/roundtrip.json.recover.done.ready; fi
          ) &
          echo $! > "$RUNNER_TEMP/near-recover.pid"
      - name: Authorize original NEAR reverse
        id: near-recover-auth
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-1click-state/roundtrip.json
          gate: test-results/mainnet-1click-state/roundtrip.json.recover.reverse
          artifact-name: mainnet-1click-reverse-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/near-recover.pid
          snapshot-directory: ${{ runner.temp }}/near-recover-auth
          alternative-gates: |
            test-results/mainnet-1click-state/roundtrip.json.recover.claim
            test-results/mainnet-1click-state/roundtrip.json.recover.refund.claim
            test-results/mainnet-1click-state/roundtrip.json.recover.done
      - name: Upload mainnet near signed EVM 1
        if: steps.near-recover-auth.outputs.skipped != 'true'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-1click-state/roundtrip.json
          gate: test-results/mainnet-1click-state/roundtrip.json.recover.reverse.evm-1
          artifact-name: mainnet-1click-reverse-signed-1-${{ github.run_id }}
          process-id: ${{ runner.temp }}/near-recover.pid
          snapshot-directory: ${{ runner.temp }}/near-recover-evm
      - name: Upload mainnet near native return claim
        if: steps.near-recover-auth.outputs.skipped != 'true'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-1click-state/roundtrip.json
          gate: test-results/mainnet-1click-state/roundtrip.json.recover.reverse.claim
          artifact-name: mainnet-1click-return-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/near-recover.pid
          snapshot-directory: ${{ runner.temp }}/near-recover-new-claim
      - name: Authorize original near return claim
        if: steps.near-recover-auth.outputs.alternative-gate == 'test-results/mainnet-1click-state/roundtrip.json.recover.claim'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-1click-state/roundtrip.json
          gate: test-results/mainnet-1click-state/roundtrip.json.recover.claim
          artifact-name: mainnet-1click-return-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/near-recover.pid
          snapshot-directory: ${{ runner.temp }}/near-recover-old-claim
      - name: Authorize original near refund
        if: steps.near-recover-auth.outputs.alternative-gate == 'test-results/mainnet-1click-state/roundtrip.json.recover.refund.claim'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-1click-state/roundtrip.json
          gate: test-results/mainnet-1click-state/roundtrip.json.recover.refund.claim
          artifact-name: mainnet-1click-refund-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/near-recover.pid
          snapshot-directory: ${{ runner.temp }}/near-recover-refund
      - name: Wait for original NEAR recovery
        id: near-recovered
        timeout-minutes: 21
        run: |
          while [ ! -f "$RUNNER_TEMP/near-recover.exit" ]; do read -r pid < "$RUNNER_TEMP/near-recover.pid"; kill -0 "$pid"; sleep 1; done
          read -r code < "$RUNNER_TEMP/near-recover.exit"
          if [ "$code" != 0 ]; then echo 'Original NEAR recovery blocked; retain its public checkpoint.' >&2; exit 1; fi
      - name: Clear all-provider recovery barrier
        id: recovery-barrier
        env:
          SWAP_RECOVERY_ONLY: ${{ steps.swap-recover.outputs.recovery_only }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          if (!['true', 'false'].includes(process.env.SWAP_RECOVERY_ONLY)) throw new Error('Missing actual swap recovery disposition');
          const reports = ['test-results/mainnet-epoch-recovery.json', 'test-results/mainnet-near-recovery.json'].map(path => JSON.parse(readFileSync(path, 'utf8')));
          if (reports.some(report => typeof report.recoveryOnly !== 'boolean')) throw new Error('Missing actual provider recovery disposition');
          const recovered = process.env.SWAP_RECOVERY_ONLY === 'true' || reports.some(report => report.recoveryOnly);
          appendFileSync(process.env.GITHUB_OUTPUT, `recovery_only=${recovered}\nrecovery_cleared=${!recovered}\n`);
          if (!recovered) appendFileSync(process.env.GITHUB_ENV, 'MAINNET_LOOP_RECOVERY_CLEARED=true\n');
          NODE
      - name: Prepare mainnet solver swap
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true'
        run: MAINNET_SWAP_MODE=prepare E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-swap-prepare xvfb-run -a yarn playwright test mainnet-swap-loop.spec.ts --config playwright.mainnet.config.ts --retries=0
      - name: Upload mainnet swap forward authorization
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-swap-forward-authorized-${{ github.run_id }}
          path: test-results/mainnet-swap-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error
      - name: Run mainnet swap forward
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true'
        run: |
          umask 077
          (code=0; MAINNET_SWAP_MODE=forward MAINNET_SWAP_SDK_GATE=test-results/mainnet-swap-state/roundtrip.json.forward.sdk E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/swap-forward-results" xvfb-run -a yarn playwright test mainnet-swap-loop.spec.ts --config playwright.mainnet.config.ts --retries=0 > "$RUNNER_TEMP/swap-forward.log" 2>&1 || code=$?; printf '%s\n' "$code" > "$RUNNER_TEMP/swap-forward.exit") &
          echo $! > "$RUNNER_TEMP/swap-forward.pid"
      - name: Upload swap SDK forward authority
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true'
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-swap-state/roundtrip.json
          gate: test-results/mainnet-swap-state/roundtrip.json.forward.sdk
          artifact-name: mainnet-swap-forward-sdk-authorized-${{ github.run_id }}
          process-id: ${{ runner.temp }}/swap-forward.pid
          snapshot-directory: ${{ runner.temp }}/swap-forward-auth
      - name: Wait for mainnet swap forward
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true'
        timeout-minutes: 31
        run: |
          while [ ! -f "$RUNNER_TEMP/swap-forward.exit" ]; do read -r pid < "$RUNNER_TEMP/swap-forward.pid"; kill -0 "$pid"; sleep 1; done
          read -r code < "$RUNNER_TEMP/swap-forward.exit"; [ "$code" = 0 ] || { echo 'Swap forward blocked; retain original authority.' >&2; exit 1; }
      - name: Upload mainnet swap reverse authorization
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-swap-reverse-authorized-${{ github.run_id }}
          path: test-results/mainnet-swap-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error

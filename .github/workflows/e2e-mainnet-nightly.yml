name: Combined store workflow source proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-routing-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore and prove exact candidate content tree for global workflow contracts
        run: |
          git fetch --no-tags --depth=1 origin bdf101147c3053d7d4f19dd886769e5b8aaf8704
          git show bdf101147c3053d7d4f19dd886769e5b8aaf8704:.github/workflows/e2e-mainnet-nightly.yml > .github/workflows/e2e-mainnet-nightly.yml
          git add .github/workflows/e2e-mainnet-nightly.yml
          test "$(git write-tree)" = 09112f738c65a366c6298f621334e6886c4fc3b3
      - name: Combined publishing and coordinator regression tests without store access
        run: node --test scripts/store-publishing/*.test.mjs
      - name: Retained artifact and profile validation without signing
        run: |
          python3 scripts/store-publishing/apple-profile.test.py
          python3 scripts/store-publishing/inspect-artifact.test.py
      - uses: ./.github/actions/yarn-install
      - name: Verify actual frozen workflow and build contracts without store access
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/harness/linked-pr-injection.test.ts src/lib/build-scripts.test.ts src/lib/update/release-workflows.test.ts
      - name: Lint changed workflow contract
        run: yarn eslint playwright/e2e/harness/linked-pr-injection.test.ts
      - name: Check new routing and adapter formatting
        run: yarn prettier --check playwright/e2e/harness/linked-pr-injection.test.ts scripts/store-publishing/release-plan.mjs scripts/store-publishing/release-plan.test.mjs scripts/store-publishing/README.md

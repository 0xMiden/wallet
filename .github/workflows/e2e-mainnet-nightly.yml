      - name: Wait for mainnet NEAR return
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true' && !inputs.swaps_only
        timeout-minutes: 21
        run: |
          while [ ! -f "$RUNNER_TEMP/near-reverse.exit" ]; do read -r pid < "$RUNNER_TEMP/near-reverse.pid"; kill -0 "$pid"; sleep 1; done
          read -r code < "$RUNNER_TEMP/near-reverse.exit"; [ "$code" = 0 ] || { echo 'NEAR return blocked; retain original authority.' >&2; exit 1; }
      - name: Verify no new provider principal remains unresolved
        id: legacy-barrier
        if: ${{ !cancelled() && steps.recovery-barrier.outputs.recovery_cleared == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          for (const provider of ['swap', 'epoch', '1click']) {
            const path = `test-results/mainnet-${provider}-state/roundtrip.json`;
            if (existsSync(path) && !['complete', 'cancelled', 'unspent'].includes(JSON.parse(readFileSync(path, 'utf8')).phase))
              throw new Error('An original provider loop remains unresolved; legacy spending is blocked');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'legacy_cleared=true\n');
          NODE
      - name: Run native mainnet round trip

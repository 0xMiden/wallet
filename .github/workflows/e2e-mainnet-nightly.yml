name: Read-only native SDK certificate probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate-probe:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Compare SDK height reads with baseline and trusted public roots
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync, mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { rootCertificates } from 'node:tls';
          const directory = mkdtempSync(path.join(tmpdir(), 'sdk-public-roots-'));
          const pem = path.join(directory, 'roots.pem');
          writeFileSync(pem, rootCertificates.join('\n') + '\n');
          const script = `
            try {
              const { RpcClient, Endpoint } = await import('@miden-sdk/miden-sdk');
              const header = await new RpcClient(new Endpoint(process.argv[1])).getBlockHeaderByNumber();
              console.log(JSON.stringify({ height: header.blockNum() }));
            } catch (error) {
              console.error(String(error?.message ?? error));
              process.exitCode = 1;
            }
          `;
          const run = (name, env) => {
            try {
              const output = execFileSync(process.execPath,
                ['--input-type=module', '--eval', script, 'https://rpc.testnet.miden.io'],
                { env, encoding: 'utf8', timeout: 60000, maxBuffer: 65536 });
              const value = JSON.parse(output.trim());
              return { name, ok: Number.isInteger(value.height) && value.height >= 0, height: value.height };
            } catch (error) {
              const reason = String(error.stderr ?? error.message).trim().slice(0, 1000);
              return { name, ok: false, status: error.status, signal: error.signal, nativeCerts: reason.includes('no native certs found'), reason };
            }
          };
          const results = [];
          try {
            results.push(run('baseline-before', process.env));
            results.push(run('trusted-public-PEM', { ...process.env, SSL_CERT_FILE: pem }));
            results.push(run('baseline-after', process.env));
            const proven = results[0].nativeCerts === true && results[1].ok && results[2].nativeCerts === true;
            const report = { platform: process.platform, architecture: process.arch, node: process.version,
              certificateCount: rootCertificates.length, onlyChildOverride: 'SSL_CERT_FILE',
              fundedActions: false, proven, results };
            writeFileSync('native-ca-probe.json', JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
            if (!proven) process.exitCode = 2;
          } finally {
            rmSync(directory, { recursive: true, force: true });
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ca-probe
          path: native-ca-probe.json

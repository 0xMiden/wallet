name: Read-only mainnet reverted burn diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated read-only decoder
        run: npm install --prefix /tmp/read-only-probe viem@2.38.5 --ignore-scripts --no-audit --no-fund
      - name: Inspect existing transaction without signing or sending
        run: |
          cp scripts/diagnostics/mainnet-revert.mjs /tmp/read-only-probe/probe.mjs
          node /tmp/read-only-probe/probe.mjs

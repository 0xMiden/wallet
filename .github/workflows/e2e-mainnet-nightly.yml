name: Fresh original recovery readiness audit - NO payment or funded green
on:
  push:
    branches: [wiktor/green03-original-readiness-refresh-once]
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  mainnet-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_NETWORK: mainnet
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 32
      - name: Bind original application and exact nonfinancial canonical overlay
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/wiktor/green03-original-readiness-refresh-once
          git merge-base --is-ancestor 775f30df7ab450165d82f0f2ddd9ff1742431585 HEAD
          test "$(git diff --name-only 775f30df7ab450165d82f0f2ddd9ff1742431585 HEAD)" = "$(printf '%s\n' .github/workflows/e2e-mainnet-nightly.yml .github/workflows/nightly-loop-proof.yml docs/superpowers/plans/2026-11-17-original-epoch-owner-refund-retirement.md docs/superpowers/specs/2026-11-17-original-epoch-owner-refund-retirement.md playwright/e2e/tests/mainnet/green02-private-outcome.spec.ts scripts/green02-public-outcome.mjs scripts/mainnet-compact-owner-recovery.mjs scripts/mainnet-compact-recovery-guard.mjs scripts/retire-original-epoch-owner-refund.mjs scripts/verify-original-epoch-owner-refund.mjs test/compact-owner-recovery.node.test.mjs test/epoch-owner-refund-retirement.node.test.mjs)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44034323631
          github-token: ${{ github.token }}
          pattern: mainnet-*-44034323631
          path: test-results/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44055319371
          github-token: ${{ github.token }}
          name: original-compact-enable-authority-44055319371
          path: test-results/enable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44067623911
          github-token: ${{ github.token }}
          name: original-compact-withdraw-authority-44067623911
          path: test-results/withdraw
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44071758997
          github-token: ${{ github.token }}
          name: original-compact-disable-authority-44071758997
          path: test-results/disable
      - name: Bind original producer, financial receipts, immutable journals and official predecessor frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/0xMiden/wallet/actions/runs/44034323631 > "$RUNNER_TEMP/producer.json"
          gh api repos/0xMiden/wallet/actions/runs/44055319371 > "$RUNNER_TEMP/enable.json"
          gh api repos/0xMiden/wallet/actions/runs/44067623911 > "$RUNNER_TEMP/withdraw.json"
          gh api repos/0xMiden/wallet/actions/runs/44071758997 > "$RUNNER_TEMP/disable.json"
          gh api 'repos/0xMiden/wallet/actions/workflows/e2e-mainnet-nightly.yml/runs?per_page=5' > "$RUNNER_TEMP/frontier.json"
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto'),read=n=>JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${n}.json`));const p=read('producer'),e=read('enable'),w=read('withdraw'),d=read('disable'),f=read('frontier').workflow_runs;a.equal(f[0].id,Number(process.env.GITHUB_RUN_ID));a.equal(f.find(r=>String(r.id)!==process.env.GITHUB_RUN_ID)?.id,44126541096);a.equal(p.workflow_id,391951744);a.equal(p.head_sha,'775f30df7ab450165d82f0f2ddd9ff1742431585');a.equal(p.run_attempt,1);a.equal(p.conclusion,'failure');a.equal(e.head_sha,'09070f46e3b302d87dfdb15bd31772a8733941da');a.equal(w.head_sha,'026475b9becfb265e0c739989bdddcf4b4265ee6');a.equal(d.head_sha,'7c6f41bda3e82759349796d8011fb36aed56eaa0');for(const r of[e,w,d]){a.equal(r.run_attempt,1);a.equal(r.conclusion,'success');a.equal(r.event,'push');}a.equal(w.head_branch,'wiktor/green02-compact-withdraw-once');a.equal(d.head_branch,'wiktor/green02-compact-disable-once');
          for(const [path,digest]of[['test-results/enable/compact-recovery-enable-authority.json','3bd825c51b868b3129fb3afd84e416cc7d35c742b4e2f376539d81b0f1f8e4a4'],['test-results/withdraw/compact-recovery-withdraw-authority.json','087550abab7094fb719a62a5f1c9a693f5ce53cd4cb16eaae384232fb587d7e1'],['test-results/disable/compact-recovery-disable-authority.json','b2cbd9e1a2930e6a6b9eb180da2bf709f0585675232fb2d1875bcf08158d8f50']])a.equal(crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex'),digest);
          const roles={'mainnet-swap-final':'swap','mainnet-epoch-final':'epoch','mainnet-1click-final':'near','mainnet-epoch-forward-sdk-authorized':'epoch-forward','mainnet-swap-forward-sdk-authorized':'forward-create','mainnet-swap-reverse-sdk-authorized':'reverse-create','mainnet-swap-forward-claim-sdk-authorized':'forward-claim','mainnet-swap-reverse-claim-sdk-authorized':'reverse-claim','mainnet-nightly':'public'};for(const[name,role]of Object.entries(roles))fs.cpSync(`test-results/evidence/${name}-44034323631`,`test-results/${role}`,{recursive:true});
          NODE
      - name: Find canonical prior swap using existing official checkpoint discovery
        id: swap-prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs find
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ steps.swap-prior.outputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.swap-prior.outputs.name }}
          path: test-results/canonical/swap
      - name: Find canonical prior Epoch using existing official checkpoint discovery
        id: epoch-prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs find epoch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ steps.epoch-prior.outputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.epoch-prior.outputs.name }}
          path: test-results/canonical/epoch
      - name: Find canonical prior NEAR using existing official checkpoint discovery
        id: near-prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mainnet-swap-artifacts.mjs find near
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ steps.near-prior.outputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.near-prior.outputs.name }}
          path: test-results/canonical/near
      - name: Bind actual original canonical run and all actual receipt and upload steps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/0xMiden/wallet/actions/runs/44079205760 > test-results/canonical-run.json
          gh api 'repos/0xMiden/wallet/actions/runs/44079205760/jobs?per_page=100' > test-results/canonical-jobs.json
      - name: Build original immutable read-only Epoch SDK
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';import YAML from 'yaml';const source=execFileSync('git',['show','775f30df7ab450165d82f0f2ddd9ff1742431585:.github/workflows/e2e-mainnet-nightly.yml'],{encoding:'utf8'}),doc=YAML.parse(source),step=doc.jobs['mainnet-nightly'].steps.find(s=>s.name==='Build read-only Epoch SDK');if(!step?.run)throw new Error('Missing immutable original SDK bootstrap');execFileSync('bash',['-euo','pipefail','-c',step.run],{stdio:'inherit'});
          NODE
      - name: Actual original public SDK018 settlement, owner return and disabled empty lock
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-swap-claim.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-swap-claim.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-evm.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-evm.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-provider.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-provider.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-loop-budget.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-loop-budget.mjs
          node scripts/green02-public-outcome.mjs
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - run: yarn test:e2e:blockchain:build
        env:
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      - name: Actual original PRIVATE SDK018 holdings with consume blocked and no policy
        env:
          E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
        run: |
          umask 077
          code=0
          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/canonical-owner-private" xvfb-run -a yarn playwright test green02-private-outcome.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/canonical-owner-private.log" 2>&1 || code=$?
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';for(const path of ['test-results/green02-private-status.json','test-results/green02-private-outcome.json'])if(existsSync(path))console.log(JSON.stringify(JSON.parse(readFileSync(path,'utf8'))));
          NODE
          exit "$code"
      - name: All original financial guards and exact cancellation contracts on fresh actual outcomes
        run: node --test test/compact-owner-recovery.node.test.mjs test/epoch-owner-refund-retirement.node.test.mjs
      - name: Independently verify actual canonical finder results, only permitted changes and current SDK018 holdings
        env:
          FINDER_SWAP_RUN: ${{ steps.swap-prior.outputs.run_id }}
          FINDER_SWAP_NAME: ${{ steps.swap-prior.outputs.name }}
          FINDER_SWAP_BOOTSTRAP: ${{ steps.swap-prior.outputs.bootstrap }}
          FINDER_EPOCH_RUN: ${{ steps.epoch-prior.outputs.run_id }}
          FINDER_EPOCH_NAME: ${{ steps.epoch-prior.outputs.name }}
          FINDER_EPOCH_BOOTSTRAP: ${{ steps.epoch-prior.outputs.bootstrap }}
          FINDER_NEAR_RUN: ${{ steps.near-prior.outputs.run_id }}
          FINDER_NEAR_NAME: ${{ steps.near-prior.outputs.name }}
          FINDER_NEAR_BOOTSTRAP: ${{ steps.near-prior.outputs.bootstrap }}
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-checkpoint.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-checkpoint.mjs
          node scripts/verify-original-epoch-owner-refund.mjs
      - name: Retain sanitized no-spend cancellation evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainnet-nightly-${{ github.run_id }}
          path: |
            test-results/original-epoch-owner-refund-canonical-verification.json
            test-results/green02-public-outcome.json
            test-results/green02-private-status.json
            test-results/green02-private-outcome.json
      - name: Report recovery-only coverage
        run: |
          echo 'Original cancelled Epoch checkpoint independently verified with existing official discovery and actual SDK018 holdings. This is NOT selected swap/Epoch/NEAR funded green.'
          exit 1

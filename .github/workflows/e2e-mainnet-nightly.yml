          read -r code < "$RUNNER_TEMP/near-forward.exit"; [ "$code" = 0 ] || { echo 'NEAR forward blocked; retain original authority.' >&2; exit 1; }
      - name: Run mainnet near reverse
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true' && !inputs.swaps_only
        run: |
          umask 077

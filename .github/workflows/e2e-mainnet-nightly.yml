name: Swap amount-anchor proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swap-anchor-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Swap anchor regression without funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/swap-order-inputs.test.ts --json --outputFile=swap-anchor-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swap-anchor-proof
          path: swap-anchor-proof.json

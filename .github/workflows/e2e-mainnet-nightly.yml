name: E2E Mainnet Nightly

# Two Chrome jobs against Miden mainnet, from the ref they run on (main for the schedule). The first restores two
# long-lived accounts, sends one base unit of the native asset each way, then loops the minimum bridge on every
# mainnet USDCx route: Arc, Base, Arbitrum and Ethereum. The second loops native ETH over AggLayer, whose exit takes
# 40 to 45 minutes to become claimable on Ethereum; it runs after the first, failed or not, since both use the plain
# account and the Ethereum key. The loops check every chain first and send nothing if any one of them cannot cover
# tonight and tomorrow.
#
# Until the accounts on issue 1629 are funded, a scheduled run fails without moving
# funds, since the accounts hold none.

on:
  # After e2e-resilience.yml at 05:00 UTC.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the main job; a scheduled run uses the default.
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - warp-ubuntu-latest-x64-8x

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false

jobs:
  mainnet-nightly:
    name: Chrome mainnet round trip
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 245 || 200 }}
    outputs:
      started: ${{ steps.started.outputs.started }}
    env:
      E2E_NETWORK: mainnet
      E2E_MAINNET_PLAIN_SEED: ${{ secrets.E2E_MAINNET_PLAIN_SEED }}
      E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
      E2E_MAINNET_EVM_KEY: ${{ secrets.E2E_MAINNET_EVM_KEY }}
    steps:
      # The AggLayer job runs after this one whether it passes or fails, but not when it never started.
      - name: Mark the main job started
        id: started
        run: echo 'started=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli

      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos

      - name: Install xvfb
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture

      - name: Build the extension for mainnet
        run: yarn test:e2e:blockchain:build

      - name: Run mainnet round trip and USDCx bridge loops
        run: |
          set -e
          E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-round-trip xvfb-run -a yarn playwright test mainnet-round-trip.spec.ts --config playwright.mainnet.config.ts
          E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-bridge-loop xvfb-run -a yarn playwright test mainnet-bridge-loop.spec.ts --config playwright.mainnet.config.ts

      # The loop logs each payout it proved before a failure, so a red night still shows those fees.
      - name: Publish the USDCx payout summary
        if: always()
        run: |
          if [ -f test-results/mainnet-usdcx-payouts.md ]; then
            cat test-results/mainnet-usdcx-payouts.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the spend summary
        if: always()
        run: |
          if [ -f test-results/mainnet-spend.json ]; then
            {
              echo '### Mainnet spend'
              echo '```json'
              cat test-results/mainnet-spend.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-nightly-${{ github.run_id }}
          path: |
            test-results/mainnet-round-trip/
            test-results/mainnet-bridge-loop/
            test-results/mainnet-spend.json
          retention-days: 90
          if-no-files-found: ignore

  mainnet-agglayer:
    name: Chrome mainnet AggLayer loop
    needs: mainnet-nightly
    # After the main job, failed or not: the two share the plain account and the Ethereum key, so they never overlap.
    # !cancelled() rather than always(), so cancelling the run does not start a funded loop.
    if: ${{ !cancelled() && needs.mainnet-nightly.outputs.started == 'true' }}
    # It mostly waits on the exit: up to 120 minutes for its claim after the bridge-out, inside a 165-minute test.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 230 || 185 }}
    env:
      E2E_NETWORK: mainnet
      E2E_MAINNET_PLAIN_SEED: ${{ secrets.E2E_MAINNET_PLAIN_SEED }}
      E2E_MAINNET_EVM_KEY: ${{ secrets.E2E_MAINNET_EVM_KEY }}
    steps:
      # An empty key skips the spec and Playwright exits 0, so this job would read green having bridged nothing.
      - name: Require the Ethereum key
        run: |
          key="${E2E_MAINNET_EVM_KEY#"${E2E_MAINNET_EVM_KEY%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          if [ -z "$key" ]; then
            echo 'E2E_MAINNET_EVM_KEY is empty'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli

      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos

      - name: Install xvfb
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture

      - name: Build the extension for mainnet
        run: yarn test:e2e:blockchain:build

      - name: Run the mainnet AggLayer loop
        run: E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-agglayer-loop xvfb-run -a yarn playwright test mainnet-agglayer-loop.spec.ts --config playwright.mainnet.config.ts

      - name: Publish the AggLayer summary
        if: always()
        run: |
          if [ -f test-results/mainnet-agglayer-loop/agglayer-night.md ]; then
            cat test-results/mainnet-agglayer-loop/agglayer-night.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-agglayer-${{ github.run_id }}
          path: test-results/mainnet-agglayer-loop/
          retention-days: 90
          if-no-files-found: ignore

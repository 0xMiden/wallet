        if: ${{ !cancelled() && !inputs.swaps_only && !inputs.loops_only && steps.recovery-barrier.outputs.recovery_cleared == 'true' && steps.legacy-barrier.outputs.legacy_cleared == 'true' }}
        run: E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-round-trip xvfb-run -a yarn playwright test mainnet-round-trip.spec.ts --config playwright.mainnet.config.ts
      - name: Run USDCx bridge loops
        if: ${{ !cancelled() && !inputs.swaps_only && !inputs.loops_only && steps.recovery-barrier.outputs.recovery_only != 'true' && steps.recovery-barrier.outputs.recovery_cleared == 'true' && steps.legacy-barrier.outputs.legacy_cleared == 'true' && steps.native-roundtrip.outcome == 'success' }}
        run: E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-bridge-loop xvfb-run -a yarn playwright test mainnet-bridge-loop.spec.ts --config playwright.mainnet.config.ts
      - name: Retain mainnet swap checkpoint

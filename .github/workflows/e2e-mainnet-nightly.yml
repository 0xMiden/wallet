        if: steps.recovery-barrier.outputs.recovery_cleared == 'true' && !inputs.swaps_only
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-1click-state/roundtrip.json
          gate: test-results/mainnet-1click-state/roundtrip.json.reverse.evm-1
          artifact-name: mainnet-1click-reverse-signed-1-${{ github.run_id }}
          process-id: ${{ runner.temp }}/near-reverse.pid
          snapshot-directory: ${{ runner.temp }}/near-evm
      - name: Upload mainnet near native return claim
        if: steps.recovery-barrier.outputs.recovery_cleared == 'true' && !inputs.swaps_only
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: test-results/mainnet-1click-state/roundtrip.json
          gate: test-results/mainnet-1click-state/roundtrip.json.reverse.claim

name: Static dApp transport regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Test static transport without browser or funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/test-dapp-transport.test.ts --json --outputFile=trace-transport-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-transport-proof
          path: trace-transport-proof.json

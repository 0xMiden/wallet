name: Guardian reset canonicalization proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian-reset-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Guardian reset regression without funded actions
        run: yarn jest --ci --maxWorkers=2 --runTestsByPath playwright/e2e/helpers/guardian-forgot-password-precondition.test.ts playwright/e2e/harness/guardian-commitments.test.ts src/lib/miden/guardian/discover.test.ts --json --outputFile=guardian-reset-proof.json
      - name: TypeScript
        run: yarn ts
      - name: Named lint and formatting
        run: |
          yarn eslint playwright/e2e/helpers/guardian-forgot-password-precondition.test.ts playwright/e2e/tests/guardian-forgot-password.spec.ts
          yarn prettier --check playwright/e2e/helpers/guardian-forgot-password-precondition.test.ts playwright/e2e/tests/guardian-forgot-password.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-reset-proof
          path: guardian-reset-proof.json

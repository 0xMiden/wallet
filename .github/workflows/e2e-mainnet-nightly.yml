      - name: Verify no new provider principal remains unresolved
        id: legacy-barrier
        if: ${{ !cancelled() && steps.recovery-barrier.outputs.recovery_cleared == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          for (const provider of ['swap', 'epoch', '1click']) {
            const path = `test-results/mainnet-${provider}-state/roundtrip.json`;
            if (existsSync(path) && !['complete', 'cancelled', 'unspent'].includes(JSON.parse(readFileSync(path, 'utf8')).phase))
              throw new Error('An original provider loop remains unresolved; legacy spending is blocked');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'legacy_cleared=true\n');
          NODE
      - name: Run native mainnet round trip
        id: native-roundtrip
        if: ${{ !cancelled() && !inputs.swaps_only && !inputs.loops_only && steps.recovery-barrier.outputs.recovery_cleared == 'true' && steps.legacy-barrier.outputs.legacy_cleared == 'true' }}
        run: E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-round-trip bash scripts/wallet-e2e/run.sh native-round-trip xvfb-run -a yarn playwright test mainnet-round-trip.spec.ts --config playwright.mainnet.config.ts
      - name: Run USDCx bridge loops
        id: wallet-observe-usdcx-round-trip
        if: ${{ !cancelled() && !inputs.swaps_only && !inputs.loops_only && steps.recovery-barrier.outputs.recovery_only != 'true' && steps.recovery-barrier.outputs.recovery_cleared == 'true' && steps.legacy-barrier.outputs.legacy_cleared == 'true' && steps.native-roundtrip.outcome == 'success' }}
        run: E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-bridge-loop bash scripts/wallet-e2e/run.sh usdcx-round-trip xvfb-run -a yarn playwright test mainnet-bridge-loop.spec.ts --config playwright.mainnet.config.ts
      - name: Retain mainnet swap checkpoint
        if: always() && hashFiles('test-results/mainnet-swap-state/roundtrip.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainnet-swap-final-${{ github.run_id }}
          path: test-results/mainnet-swap-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error
      - name: Retain mainnet Epoch checkpoint
        if: always() && hashFiles('test-results/mainnet-epoch-state/roundtrip.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainnet-epoch-final-${{ github.run_id }}
          path: test-results/mainnet-epoch-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error
      - name: Retain mainnet NEAR checkpoint
        if: always() && hashFiles('test-results/mainnet-1click-state/roundtrip.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainnet-1click-final-${{ github.run_id }}
          path: test-results/mainnet-1click-state/roundtrip.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish mainnet swap summary
        if: always()
        run: |
          if [ -f test-results/mainnet-swap-summary.md ]; then cat test-results/mainnet-swap-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish the USDCx payout summary
        if: always()
        run: |
          if [ -f test-results/mainnet-usdcx-payouts.md ]; then
            cat test-results/mainnet-usdcx-payouts.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish the spend summary
        if: always()
        run: |
          if [ -f test-results/mainnet-spend.json ]; then
            { echo '### Mainnet spend'; echo '```json'; cat test-results/mainnet-spend.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload public summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainnet-nightly-${{ github.run_id }}
          path: |
            test-results/mainnet-spend.json
            test-results/mainnet-swap-summary.json
            test-results/mainnet-swap-summary.md
            test-results/mainnet-swap-recovery-grant.json
            test-results/mainnet-swap-recovery-claim.json
            test-results/mainnet-swap-forward-claim.json
            test-results/mainnet-swap-reverse-claim.json
            test-results/mainnet-swap-claim-failure.json
            test-results/mainnet-epoch-summary.json
            test-results/mainnet-epoch-state/roundtrip.json.return-readiness-failure.json
            test-results/mainnet-epoch-state/roundtrip.json.return-solve-failure.json
            test-results/mainnet-near-summary.json
            test-results/mainnet-epoch-recovery.json
            test-results/mainnet-near-recovery.json
            test-results/mainnet-usdcx-payouts.md
          retention-days: 90
          if-no-files-found: ignore
      - name: Report recovery-only coverage
        if: ${{ !cancelled() && steps.recovery-barrier.outputs.recovery_only == 'true' }}
        run: |
          echo '::error::Recovered original provider principal only; no fresh coverage or legacy spending was authorized.'
          exit 1
      - name: Assemble Wallet E2E report
        id: wallet-report-assemble
        if: always() && steps.wallet-report-init.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_BUILD_OUTCOME: ${{ steps.wallet-build.outcome }}
          REPORT_SWAP_RECOVERY_OUTCOME: ${{ steps.swap-recovery-wait.outcome }}
          REPORT_EPOCH_RECOVERY_OUTCOME: ${{ steps.epoch-recovered.outcome }}
          REPORT_NEAR_RECOVERY_OUTCOME: ${{ steps.near-recovered.outcome }}
          REPORT_BARRIER_OUTCOME: ${{ steps.recovery-barrier.outcome }}
          REPORT_RECOVERY_ONLY: ${{ steps.recovery-barrier.outputs.recovery_only }}
          REPORT_INVOCATION_SWAP_RECOVERY_GRANT: ${{ steps.wallet-observe-swap-recovery-grant.outcome }}
          REPORT_INVOCATION_SWAP_RECOVER: ${{ steps.swap-recover.outcome }}
          REPORT_WAIT_SWAP_RECOVER: ${{ steps.swap-recovery-wait.outcome }}
          REPORT_INVOCATION_SWAP_RECOVERED_RETURN: ${{ steps.wallet-observe-swap-recovered-return.outcome }}
          REPORT_WAIT_SWAP_RECOVERED_RETURN: ${{ steps.wallet-wait-swap-recovered-return.outcome }}
          REPORT_INVOCATION_EPOCH_RECOVER: ${{ steps.wallet-observe-epoch-recover.outcome }}
          REPORT_WAIT_EPOCH_RECOVER: ${{ steps.epoch-recovered.outcome }}
          REPORT_INVOCATION_NEAR_RECOVER: ${{ steps.wallet-observe-near-recover.outcome }}
          REPORT_WAIT_NEAR_RECOVER: ${{ steps.near-recovered.outcome }}
          REPORT_INVOCATION_SWAP_PREPARE: ${{ steps.wallet-observe-swap-prepare.outcome }}
          REPORT_INVOCATION_SWAP_FORWARD: ${{ steps.swap-forward-run.outcome }}
          REPORT_WAIT_SWAP_FORWARD: ${{ steps.wallet-wait-swap-forward.outcome }}
          REPORT_INVOCATION_SWAP_REVERSE: ${{ steps.wallet-observe-swap-reverse.outcome }}
          REPORT_WAIT_SWAP_REVERSE: ${{ steps.wallet-wait-swap-reverse.outcome }}
          REPORT_INVOCATION_EPOCH_PREPARE: ${{ steps.wallet-observe-epoch-prepare.outcome }}
          REPORT_INVOCATION_EPOCH_FORWARD: ${{ steps.wallet-observe-epoch-forward.outcome }}
          REPORT_WAIT_EPOCH_FORWARD: ${{ steps.wallet-wait-epoch-forward.outcome }}
          REPORT_INVOCATION_EPOCH_REVERSE: ${{ steps.wallet-observe-epoch-reverse.outcome }}
          REPORT_WAIT_EPOCH_REVERSE: ${{ steps.wallet-wait-epoch-reverse.outcome }}
          REPORT_INVOCATION_NEAR_PREPARE: ${{ steps.wallet-observe-near-prepare.outcome }}
          REPORT_INVOCATION_NEAR_FORWARD: ${{ steps.wallet-observe-near-forward.outcome }}
          REPORT_WAIT_NEAR_FORWARD: ${{ steps.wallet-wait-near-forward.outcome }}
          REPORT_INVOCATION_NEAR_REVERSE: ${{ steps.wallet-observe-near-reverse.outcome }}
          REPORT_WAIT_NEAR_REVERSE: ${{ steps.wallet-wait-near-reverse.outcome }}
          REPORT_INVOCATION_NATIVE_ROUND_TRIP: ${{ steps.native-roundtrip.outcome }}
          REPORT_INVOCATION_USDCX_ROUND_TRIP: ${{ steps.wallet-observe-usdcx-round-trip.outcome }}
        run: node scripts/wallet-e2e/job.cjs assemble
      - name: Upload Wallet E2E report
        if: always() && steps.wallet-report-assemble.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-e2e-v1-${{ github.run_id }}-${{ github.run_attempt }}-mainnet
          path: ${{runner.temp}}/wallet-e2e/mainnet/wallet-e2e-report-v1.json
          retention-days: 30
          if-no-files-found: ignore

  mainnet-agglayer:
    name: Chrome mainnet AggLayer loop
    needs: mainnet-nightly
    # Preserve the independent legacy verdict, but never spend after unresolved new principal or recovery-only work.
    if: ${{ !cancelled() && !inputs.swaps_only && needs.mainnet-nightly.outputs.started == 'true' && !inputs.loops_only && needs.mainnet-nightly.outputs.recovery_only != 'true' && needs.mainnet-nightly.outputs.recovery_cleared == 'true' && needs.mainnet-nightly.outputs.legacy_cleared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 230 || 185 }}
    env:
      E2E_NETWORK: mainnet
      E2E_WALLET_REPORT_JOB_KEY: agglayer
      WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
      E2E_MAINNET_PLAIN_SEED: ${{ secrets.E2E_MAINNET_PLAIN_SEED }}
      E2E_MAINNET_EVM_KEY: ${{ secrets.E2E_MAINNET_EVM_KEY }}
    steps:
      - name: Require the Ethereum key
        run: |
          key="${E2E_MAINNET_EVM_KEY#"${E2E_MAINNET_EVM_KEY%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          if [ -z "$key" ]; then echo 'E2E_MAINNET_EVM_KEY is empty'; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Initialize Wallet E2E report
        id: wallet-report-init
        if: github.repository == '0xMiden/wallet' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          REPORT_SWAPS_ONLY: ${{ inputs.swaps_only }}
          REPORT_BRIDGES_ONLY: ${{ inputs.bridges_only }}
          REPORT_LOOPS_ONLY: ${{ inputs.loops_only }}
          REPORT_EXPLICIT_RECOVERY_ONLY: ${{ inputs.authorize_swap_recovery_return || inputs.replace_unsubmitted_swap_return }}
        run: node scripts/wallet-e2e/job.cjs initialize
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache miden-client-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr
      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install
      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli
      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos
      - name: Install xvfb
        timeout-minutes: 6
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then exit 0; fi
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture
      - name: Build the extension for mainnet
        id: wallet-build
        run: yarn test:e2e:blockchain:build
      - name: Capture Wallet E2E build identity
        if: steps.wallet-report-init.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/wallet-e2e/job.cjs capture-build
      - name: Run the mainnet AggLayer loop
        id: agglayer-run
        run: E2E_PLAYWRIGHT_OUTPUT_DIR=test-results/mainnet-agglayer-loop bash scripts/wallet-e2e/run.sh agglayer-round-trip xvfb-run -a yarn playwright test mainnet-agglayer-loop.spec.ts --config playwright.mainnet.config.ts
      - name: Publish the AggLayer summary
        if: always()
        run: |
          if [ -f test-results/mainnet-agglayer-loop/agglayer-night.md ]; then
            cat test-results/mainnet-agglayer-loop/agglayer-night.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainnet-agglayer-${{ github.run_id }}
          path: test-results/mainnet-agglayer-loop/agglayer-night.md
          retention-days: 90
          if-no-files-found: ignore
      - name: Assemble Wallet E2E report
        id: wallet-report-assemble
        if: always() && steps.wallet-report-init.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_BUILD_OUTCOME: ${{ steps.wallet-build.outcome }}
          REPORT_INVOCATION_AGGLAYER_ROUND_TRIP: ${{ steps.agglayer-run.outcome }}
        run: node scripts/wallet-e2e/job.cjs assemble
      - name: Upload Wallet E2E report
        if: always() && steps.wallet-report-assemble.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-e2e-v1-${{ github.run_id }}-${{ github.run_attempt }}-agglayer
          path: ${{runner.temp}}/wallet-e2e/agglayer/wallet-e2e-report-v1.json
          retention-days: 30
          if-no-files-found: ignore

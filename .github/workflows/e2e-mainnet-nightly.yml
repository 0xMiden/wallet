name: E2E Mainnet Nightly
on:
  push:
    branches: [wiktor/green10-epoch-retirement-once]
permissions:
  actions: read
  contents: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  retire:
    if: github.event.created == true && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Preserve exact retained inputs and bind the official frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/0xMiden/wallet/git/ref/heads/main --jq '.object.sha')" = 4cda551849cdc69c9990d6943696fbbbc34ac468
          frontier=$(gh api 'repos/0xMiden/wallet/actions/workflows/391951744/runs?per_page=10' --jq '.workflow_runs[] | [.id,.status]|join(":")')
          test "$(printf '%s\n' "$frontier" | head -n 1)" = "$GITHUB_RUN_ID:in_progress"
          test "$(printf '%s\n' "$frontier" | head -n 2 | tail -n 1)" = 44990040178:completed
          umask 077
          mkdir -p test-results/{swap,epoch,near}
          fetch() {
            gh api "repos/0xMiden/wallet/actions/artifacts/$1/zip" > "$RUNNER_TEMP/$1.zip"
            printf '%s  %s\n' "$2" "$RUNNER_TEMP/$1.zip" | sha256sum --check --status
            test "$(unzip -Z1 "$RUNNER_TEMP/$1.zip")" = "$3"
            unzip -p "$RUNNER_TEMP/$1.zip" "$3" > "$4"
          }
          fetch 14741337576 f597480eb3fe285b1365753c1799fc4fd36ee7457ce685b152e8264fecca9415 roundtrip.json test-results/swap/roundtrip.json
          fetch 14741840831 a50610cdcdc057a64afbc01fcf018b43f71e3de6654fdddb1a7be5f0b6e8c541 roundtrip.json test-results/epoch/roundtrip.json
          fetch 14742035251 3e2ed1b4b81bd5713e2472d8e523ca6c02ade85712a4a44e2e560f469b04add6 roundtrip.json test-results/near/roundtrip.json
          fetch 14766153975 d8dd64a20f9d2ff3b4fed25e632b72439dbcc554cf212ea9a7f98e87d515a36b green10-custody.json test-results/green10-custody.json
          printf '%s\n' '2c9fd1259d419bfe2fddae6059a1ab7661220c87cbe1652af2e5d3d2b95db2cf  test-results/swap/roundtrip.json' '75dc01ea0a1050ad3b48a43d918cc3e7810cf4dec5c88a46b6d8329103a8b832  test-results/near/roundtrip.json' | sha256sum --check --status
      - name: Reconcile finalized receipts and retire only the original Epoch checkpoint
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-checkpoint.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-checkpoint.mjs
          cp test-results/epoch/roundtrip.json "$RUNNER_TEMP/altered.json"
          printf ' ' >> "$RUNNER_TEMP/altered.json"
          if node scripts/retire-green10-epoch.mjs "$RUNNER_TEMP/altered.json" test-results/green10-custody.json "$RUNNER_TEMP/invalid-result.json" "$RUNNER_TEMP/invalid-report.json" > "$RUNNER_TEMP/refusal.log" 2>&1; then exit 1; fi
          test ! -e "$RUNNER_TEMP/invalid-result.json"
          grep -q 'AssertionError' "$RUNNER_TEMP/refusal.log"
          if ! node scripts/retire-green10-epoch.mjs test-results/epoch/roundtrip.json test-results/green10-custody.json test-results/mainnet-epoch-state/roundtrip.json test-results/green10-retirement.json > "$RUNNER_TEMP/retire.log" 2>&1; then
            echo 'Receipt, custody, or checkpoint invariant did not qualify.' >&2
            exit 1
          fi
          jq -ce '{originalDigest,retiredDigest,epochCostUsdMicros,verifiedReceipts,rpcCount,noSpend}' test-results/green10-retirement.json
      - name: Retain byte-identical Swap checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainnet-swap-final-${{ github.run_id }}
          path: test-results/swap/roundtrip.json
          if-no-files-found: error
      - name: Retain byte-identical NEAR checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainnet-1click-final-${{ github.run_id }}
          path: test-results/near/roundtrip.json
          if-no-files-found: error
      - name: Retain bounded reconciliation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainnet-nightly-${{ github.run_id }}
          path: test-results/green10-retirement.json
          if-no-files-found: error
      - name: Retain only the reconciled Epoch checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainnet-epoch-final-${{ github.run_id }}
          path: test-results/mainnet-epoch-state/roundtrip.json
          if-no-files-found: error
      - name: Report recovery-only coverage
        run: |
          echo 'Green10 recovery-only checkpoint retirement; not a funded three-provider green run.'
          exit 1

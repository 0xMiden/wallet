name: Pre-handler state expected red
on:
  push:
    branches: [ci/1961-prehandler-state-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: test "$(git rev-parse HEAD^)" = 899559fd23fbbf02e236f0be95944d64a2a85095
      - run: yarn install --frozen-lockfile --network-timeout 120000
        timeout-minutes: 6
      - name: Verify the missing initialization marker
        run: |
          mkdir -p proof
          set +e
          yarn jest --runTestsByPath src/lib/intercom/server.test.ts --testNamePattern='marks the pre-handler state response as not initialized' --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
          status=${PIPESTATUS[0]}
          test "$status" -ne 0 || exit 1
          node -e "const x=require('./proof/results.json');const a=x.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status!=='pending');if(a.length!==1 || a[0].status!=='failed' || !a[0].failureMessages.join(' ').includes('backendInitialized')) {console.error(JSON.stringify(a));process.exit(1)} console.log('Expected red: startup response lacks initialization marker')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prehandler-state-red
          path: proof/

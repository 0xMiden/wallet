name: Command AI service

on:
  pull_request:
    paths:
      - 'services/command-ai/**'
      - 'services/command-ai-proxy/server.mjs'
      - 'src/lib/command-ai/help-facts.json'
      - 'src/lib/command-ai/redactor.ts'
      - 'src/lib/command-ai/schema.ts'
      - 'scripts/command-ai-eval/**'
      - 'scripts/feature-eligibility-deploy-source.mjs'
      - '.github/workflows/command-ai.yml'
      - '.github/workflows/deploy-command-ai.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Live model suite. Anything but none spends the eval key's quota and needs owner approval.
        required: true
        default: none
        type: choice
        options:
          - none
          - commands
          - selection
          - measure

permissions:
  contents: read

concurrency:
  group: command-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Command AI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Check Command AI fixtures offline
        run: node --test scripts/command-ai-eval/offline.test.mjs
      - name: Type-check the Worker and its tests
        run: |
          npx tsc --noEmit -p services/command-ai/tsconfig.json
          npx tsc --noEmit -p services/command-ai/tsconfig.test.json
      - name: Validate Worker bundle and bindings
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.3 deploy --dry-run --config services/command-ai/wrangler.jsonc

  live:
    name: Command AI live evaluation
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'none'
    runs-on: ubuntu-latest
    # Provisional until the eval key's rate limits are known.
    timeout-minutes: 180
    environment: command-ai-eval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Run the selected suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUITE: ${{ inputs.suite }}
          COMMAND_AI_EVAL_ONLY: patch_bridge_provider,patch_note_type,patch_amount_only,cmd_reset_draft_amount,fragment_public
          COMMAND_AI_EVAL_RETRY_BUDGET_MS: '600000'
          COMMAND_AI_EVAL_SUMMARY: ${{ github.workspace }}/command-ai-eval.json
        run: |
          case "$SUITE" in
            commands) node scripts/command-ai-eval/run-eval.mjs --commands --require-live ;;
            *) echo "Suite $SUITE is not implemented yet." >&2; exit 1 ;;
          esac
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: command-ai-eval-${{ inputs.suite }}-${{ github.sha }}
          path: command-ai-eval.json
          if-no-files-found: ignore

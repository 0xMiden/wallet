name: Command AI service

on:
  pull_request:
    paths:
      - 'services/command-ai/**'
      - 'scripts/feature-eligibility-deploy-source.mjs'
      - '.github/workflows/command-ai.yml'
      - '.github/workflows/deploy-command-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Command AI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Type-check the Worker and its tests
        run: |
          npx tsc --noEmit -p services/command-ai/tsconfig.json
          npx tsc --noEmit -p services/command-ai/tsconfig.test.json
      - name: Validate Worker bundle and bindings
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.3 deploy --dry-run --config services/command-ai/wrangler.jsonc

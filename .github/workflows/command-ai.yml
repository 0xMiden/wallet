name: Command AI service

on:
  pull_request:
    paths:
      - 'services/command-ai/**'
      - 'services/command-ai-proxy/server.mjs'
      - 'src/lib/command-ai/help-facts.json'
      - 'src/lib/command-ai/redactor.ts'
      - 'src/lib/command-ai/schema.ts'
      - 'scripts/command-ai-eval/**'
      - 'scripts/feature-eligibility-deploy-source.mjs'
      - '.github/workflows/command-ai.yml'
      - '.github/workflows/deploy-command-ai.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Live model suite. Anything but none and writing-score spends provider quota and needs owner approval.
        required: true
        default: none
        type: choice
        options:
          - none
          - commands
          - selection-dev
          - selection
          - measure
          - writing-checker-dev
          - writing-checker
          - writing-dev
          - writing
          - writing-knockout
          - writing-score

permissions:
  contents: read

concurrency:
  group: command-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Command AI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Check Command AI fixtures offline
        run: node --test scripts/command-ai-eval/offline.test.mjs
      - name: Type-check the Worker and its tests
        run: |
          npx tsc --noEmit -p services/command-ai/tsconfig.json
          npx tsc --noEmit -p services/command-ai/tsconfig.test.json
      - name: Validate Worker bundle and bindings
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.3 deploy --dry-run --config services/command-ai/wrangler.jsonc

  live:
    name: Command AI live evaluation
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'none'
    runs-on: ubuntu-latest
    # Provisional until the measure suite shows the provider's rate limits.
    timeout-minutes: 180
    environment: command-ai-eval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Run the selected suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUITE: ${{ inputs.suite }}
          COMMAND_AI_EVAL_ONLY: first_reply_note_type,first_reply_provider,first_reply_amount,first_reply_reset_amount,first_reply_yes,fragment_public,fragment_public_after_help,fragment_amount,fragment_provider,cmd_bare_cancel,send_partial_hex_0x02323,fragment_private,fragment_network
          COMMAND_AI_EVAL_RETRY_BUDGET_MS: '600000'
          COMMAND_AI_EVAL_SUMMARY: ${{ github.workspace }}/command-ai-eval.json
        run: |
          case "$SUITE" in
            commands)
              # A committed baseline turns the run into the command gate.
              compare=()
              if [[ -f scripts/command-ai-eval/baseline.json ]]; then
                compare=(--compare scripts/command-ai-eval/baseline.json)
              fi
              node scripts/command-ai-eval/run-eval.mjs --commands --require-live "${compare[@]}"
              ;;
            selection-dev) node scripts/command-ai-eval/run-eval.mjs --selection --dev-only --require-live ;;
            selection) node scripts/command-ai-eval/run-eval.mjs --selection --require-live ;;
            measure) node scripts/command-ai-eval/run-eval.mjs --measure --require-live ;;
            writing-checker-dev) node scripts/command-ai-eval/run-eval.mjs --writing-checker --dev-only --require-live ;;
            writing-checker) node scripts/command-ai-eval/run-eval.mjs --writing-checker --require-live ;;
            writing-dev) node scripts/command-ai-eval/run-eval.mjs --writing --dev-only --require-live ;;
            writing) node scripts/command-ai-eval/run-eval.mjs --writing --require-live ;;
            writing-knockout) node scripts/command-ai-eval/run-eval.mjs --writing-knockout --require-live ;;
            # No model calls: scores the summaries and grading files committed under results/.
            writing-score) node scripts/command-ai-eval/run-eval.mjs --writing-score scripts/command-ai-eval/results ;;
            *) echo "Suite $SUITE is not implemented yet." >&2; exit 1 ;;
          esac
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: command-ai-eval-${{ inputs.suite }}-${{ github.sha }}
          # Synthetic questions and model text only: a public repository's artifacts are downloadable.
          path: |
            command-ai-eval.json
            grading.json
          if-no-files-found: ignore

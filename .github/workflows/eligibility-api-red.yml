name: Eligibility bounded provider reads expected red
on:
  push:
    branches: [ci/1894-api-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 0ef71b4b0897cca45a197c4c070dcab3f21a4c28
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-api.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - read adapter calls only fixed account paths without returning credentials' result.log || exit 1
          grep -F 'not ok 4 - read adapter retains only a valid target-script absence receipt' result.log || exit 1
          grep -F '# fail 2' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest-red
          path: result.log

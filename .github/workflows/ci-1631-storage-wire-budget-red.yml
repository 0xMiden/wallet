          source "$PROOF_DIR/record.sh"
          record corepack-enable corepack enable
          record corepack-prepare corepack prepare yarn@1.22.22 --activate
          record node-version node --version
          record yarn-version yarn --version
          record python-version python3 --version
          record install yarn install --frozen-lockfile --network-timeout 600000
          record jest-version yarn --silent jest --version
      - name: Named test formatting lint and whole types before runtime
        id: preflight
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record snapshot-before python3 "$PROOF_DIR/capture.py" snapshot before
          failed=0
          if record format yarn prettier --check src/lib/telemetry/egress-boundary.test.ts; then :; else failed=1; fi
          if record lint yarn eslint src/lib/telemetry/egress-boundary.test.ts --max-warnings 0; then :; else failed=1; fi
          if record types yarn ts --noEmit; then :; else failed=1; fi
          exit "$failed"
      - name: Run seven complete suites and preserve natural expected red
        id: tests
        if: steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record jest yarn jest --runTestsByPath src/lib/miden/repo.test.ts src/lib/telemetry/crash-diagnostics.test.ts src/lib/telemetry/crash-diagnostics.policy.test.ts src/lib/telemetry/crash.test.ts src/lib/telemetry/crash.visibility.worker.test.ts src/lib/telemetry/egress-boundary.test.ts src/lib/telemetry/guarantees.test.ts --maxWorkers=2 --coverage=false --watch=false --testLocationInResults --json --outputFile="$PROOF_DIR/jest.json"
      - name: Retain source index runtime and framework after checks
        if: always() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record snapshot-after python3 "$PROOF_DIR/capture.py" snapshot after
      - name: Classify exact causal red independently
        if: always() && steps.bind.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record classification python3 "$PROOF_DIR/capture.py" classify
      - name: Seal raw producer payloads
        if: always() && steps.bind.outcome == 'success'
        run: |
          set -euo pipefail
          python3 "$PROOF_DIR/capture.py" seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1631-storage-wire-budget-red
          path: ${{ runner.temp }}/1631-storage-wire-budget-red/
          include-hidden-files: true
          if-no-files-found: error

name: E2E Bridge-IN (Android)

# Manual, headed Android emulator run on an Intel macOS runner. The EVM leg uses a local Anvil bridge
# double; the wallet's Miden receipt/claim leg uses Testnet and the WalletConnect
# relay. One sequential test owns all requested deposits and writes a loop
# manifest plus an append-only ledger into test-results-android/.

on:
  workflow_dispatch:
    inputs:
      loop_count:
        description: Sequential AggLayer bridge-in deposits (1-100)
        required: true
        default: 100
        type: number

permissions:
  contents: read

concurrency:
  group: e2e-bridge-in-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-bridge-in-testnet:
    name: AggLayer bridge-in (${{ inputs.loop_count }} loops, Android Testnet)
    # macOS larger runners are virtual machines and do not support nested
    # virtualization. Use the standard Intel runner so its x86_64 AVD can use
    # Hypervisor.framework and keep a native, visible emulator window.
    runs-on: macos-26-intel
    # The 100-loop test has a 280-minute Playwright budget. Remaining time
    # covers SDK/AVD setup, Android build, and final artifact upload.
    timeout-minutes: 360
    env:
      E2E_NETWORK: testnet
      MIDEN_E2E_TEST: 'true'
      # The Android bridge-in setup uses adb reverse so app requests to host
      # services use device loopback. The Node counterparty uses host loopback.
      E2E_EVM_RPC_URL: http://127.0.0.1:8545
      E2E_COUNTERPARTY_EVM_RPC_URL: http://127.0.0.1:8545
      MIDEN_REMOTE_CONFIG_URL: http://127.0.0.1:8550
      BRIDGE_IN_ROUTE: agglayer
      BRIDGE_IN_LOOP_COUNT: ${{ inputs.loop_count }}
      # Pin ONE avd directory for all three tools. `avdmanager` writes where its
      # own home resolution lands, `emulator -list-avds` scans where ITS home
      # resolution lands, and the harness reads
      # `ANDROID_AVD_HOME ?? $HOME/.android/avd` — on the runner those did not
      # agree, so the base AVD was created successfully, listed as nothing, and
      # the run died in global setup with `Base AVD "Pixel_API_34" not found`
      # after paying for the SDK install and the APK build. Setting this makes
      # all three read the same path.
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
    steps:
      - uses: actions/checkout@v4

      # Hypervisor.framework is what makes the emulator usable rather than
      # merely present on this macOS runner. Without it, the boot fails or stalls.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The action's default packages include the retired 'tools' package, which sdkmanager no longer finds.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "::error::macos-26-intel must provide an x86_64 host for the Android image"
            exit 1
          fi
          sdkmanager --install "platform-tools" "emulator" \
            "platforms;android-34" "system-images;android-34;default;x86_64"

      # Prove the selected runner exposes Hypervisor.framework before paying
      # for dependencies, CLI compilation, or the Android build.
      - name: Verify Android VM acceleration
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check

      # The wallet AVD is derived from this base by the harness, so its name has to
      # match BASE_AVD in emulator-control.ts. Kept in one place there; if it is
      # ever renamed, this step fails loudly rather than silently booting nothing.
      - name: Create base AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --name Pixel_API_34 \
            --package "system-images;android-34;default;x86_64" \
            --device pixel_6 \
            --force
          # Fail HERE if the emulator can't see what avdmanager just wrote,
          # rather than 5 minutes later in Playwright's global setup with the
          # SDK install and the APK build already paid for.
          echo "AVDs visible to the emulator (ANDROID_AVD_HOME=$ANDROID_AVD_HOME):"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx 'Pixel_API_34' || {
            echo "::error::avdmanager created Pixel_API_34 but 'emulator -list-avds' does not list it" >&2
            ls -la "$ANDROID_AVD_HOME" || true
            exit 1
          }

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Pinned exact, matching every other E2E workflow: this job builds
      # miden-client-cli from source, and the cache key below names the rustc
      # version, so leaving it to the runner image's default made that key a
      # claim nothing enforced.
      - uses: dtolnay/rust-toolchain@1.98.1

      # Same pre-install flow used by other E2E workflows. Without it, the
      # harness compiles miden-client-cli lazily on FIRST USE — i.e.
      # inside the test — and the ~9 minutes of cargo build ate the 15-minute
      # per-test budget: `mint-and-balance.android` failed with "Test timeout of
      # 900000ms exceeded" having spent most of it in `Compiling thiserror`.
      # Keyed by host OS/architecture as well as the rustc pin and pinned CLI
      # rev because ~/.cargo/bin contains compiled, platform-specific binaries.
      - name: Compute platform-specific cargo cache key
        id: cargo_cache_key
        run: |
          rev=$(node -p "require('./package.json').midenClientCliGit.rev")
          url=$(node -p "require('./package.json').midenClientCliGit.url")
          ver=$(node -p "require('./package.json').midenClientCliVersion ?? ''")
          pins=$(printf '%s|%s|%s' "$url" "$rev" "$ver" | sha256sum | cut -c1-16)
          # This cache includes ~/.cargo/bin, whose rustup and CLI binaries are
          # host-OS-specific as well as architecture-specific.
          namespace=miden-e2e-cargo-v3-${{ runner.os }}-${{ runner.arch }}
          echo "key=$namespace-rust1.98.1-cli-$pins" >> "$GITHUB_OUTPUT"

      - name: Cache cargo (cli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: ${{ steps.cargo_cache_key.outputs.key }}

      - name: Pre-install miden-client-cli (off the per-test clock)
        # The harness auto-installs the CLI lazily on first use, but that ~7min compile
        # blows the 300s per-test timeout, so it is pre-installed here. The action also
        # rebuilds it against a linked Protocol PR when the PR carries one: the CLI
        # EXECUTES AND PROVES transactions client-side, so an unpatched one dies inside
        # its own local execution with a bare `x assert` that the harness misreports as
        # a drained chain. No marker, no rebuild, and nothing about this step changes.
        uses: ./.github/actions/install-miden-client-cli

      - name: Build debug APK
        run: yarn test:e2e:android:build

      # Reclaim the Gradle daemon's heap before the emulator starts. The daemon lingers after `assembleDebug` holding
      # a GB or two it will never use again in this job.
      - name: Stop the Gradle daemon
        run: cd android && ./gradlew --stop || true

      - name: Run Android E2E
        run: |
          if ! [[ "$BRIDGE_IN_LOOP_COUNT" =~ ^[0-9]+$ ]] || (( BRIDGE_IN_LOOP_COUNT < 1 || BRIDGE_IN_LOOP_COUNT > 100 )); then
            echo "::error::AggLayer loop count must be an integer from 1 to 100"
            exit 1
          fi
          yarn playwright test \
            --config playwright.android.bridge-in.config.ts \
            playwright/e2e/android/tests/bridge-in-deposit.android.spec.ts \
            --retries=0

      # Upload run output before diagnostics so a broken adb server cannot hold
      # test results behind a log-collection step.
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-in-android-testnet-${{ github.run_id }}
          path: test-results-android/
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect emulator logs on failure
        if: failure()
        timeout-minutes: 3
        run: node scripts/collect-android-emulator-logs.mjs

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-in-android-diagnostics-${{ github.run_id }}
          path: test-results-android/emulator-logs/failure-diagnostics.log
          retention-days: 7
          if-no-files-found: ignore

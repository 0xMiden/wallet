name: E2E Bridge-IN

# Runs the cross-chain bridge-IN deposit E2E (EVM -> Miden) on every push to
# main, covering BOTH routes (two specs):
#   - AggLayer "Slow"/ETH: the app builds `bridgeAsset` calldata a headless WC
#     counterparty signs + broadcasts to a local Anvil bridge stub.
#   - Epoch "Fast"/USDC: the Epoch SDK reads a stubbed Compact + USDC on Anvil,
#     builds a real `depositERC20AndRegister` the counterparty signs+broadcasts,
#     and registers the allocation with a local FAKE allocator.
# Both drive the real deposit UI through a REAL WalletConnect pairing, then the
# wallet consumes a REAL Miden note delivered by the miden-client CLI "solver"
# and reconciles it to "Bridged from EVM".
#
# HYBRID by necessity: the EVM leg is HERMETIC on a local Anvil (chain 11155111)
# with on-chain doubles (the real L1 AggLayer bridge + the hosted Epoch solver
# can't run locally), while the Miden leg runs against LIVE testnet (the
# mobile harness has no local Miden node — same as every other iOS spec and the
# bridge-OUT gate). The only non-local transport is the WalletConnect relay, so
# the connect step is retry-guarded and the run uses `--retries=2`.
#
# Testnet-only (LIVE Miden testnet) -> a post-merge signal on main, not a
# per-PR gate. Needs NO required secrets: the EVM key is Anvil's deterministic
# dev account and the relay projectId falls back to DEFAULT_WC_PROJECT_ID in
# src/lib/walletconnect/config.ts.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Run iOS, prepare Android inputs, or run Android AggLayer loops
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android-prepare
          - android
      loop_count:
        description: Sequential Android AggLayer bridge-in deposits (1-100)
        required: true
        default: 100
        type: number

permissions:
  contents: read
  actions: read
  # The linked-PR injections list a dispatched branch's open pull request and read its description.
  pull-requests: read

concurrency:
  group: e2e-bridge-in-${{ inputs.platform || 'ios' }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.platform != 'android' && inputs.platform != 'android-prepare' }}

jobs:
  android-prepare-cli:
    name: Prepare pinned Miden CLI (Intel macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'android-prepare'
    runs-on: macos-26-large
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Build and verify pinned CLI
        id: cli
        env:
          MIDEN_CLI_INSTALL_TIMEOUT_MS: '9000000'
        uses: ./.github/actions/install-miden-client-cli

      - name: Record CLI build provenance
        env:
          CLI_BIN: ${{ steps.cli.outputs.bin }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-in-cli"
          cp "$CLI_BIN" "$RUNNER_TEMP/bridge-in-cli/miden-client"
          chmod 755 "$RUNNER_TEMP/bridge-in-cli/miden-client"
          node - "$RUNNER_TEMP/bridge-in-cli/metadata.json" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = require(path.resolve('package.json'));
          const metadata = {
            buildOs: process.env.RUNNER_OS_NAME,
            buildArch: process.env.RUNNER_ARCH_NAME,
            rustToolchain: '1.98.1',
            versionText: require('node:child_process').execFileSync(process.env.CLI_BIN, ['--version'], {
              encoding: 'utf8'
            }).trim(),
            cliVersion: pkg.midenClientCliVersion ?? null,
            cliGitUrl: pkg.midenClientCliGit?.url ?? null,
            cliGitRev: pkg.midenClientCliGit?.rev ?? null,
            cliProtocolVersion: pkg.midenClientCliProtocolVersion ?? null,
          };
          fs.writeFileSync(process.argv[2], `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-in-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/bridge-in-cli/
          retention-days: 1
          if-no-files-found: error

  android-prepare-apk:
    name: Prepare Android E2E inputs (Intel macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'android-prepare'
    runs-on: macos-26-large
    timeout-minutes: 90
    env:
      E2E_NETWORK: testnet
      E2E_EVM_RPC_URL: http://127.0.0.1:8545
      MIDEN_REMOTE_CONFIG_URL: http://127.0.0.1:8550
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore or seed Android E2E dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/hd-key/dist
          key: bridge-in-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node22-yarn1-${{ hashFiles('package.json', 'yarn.lock', '.yarnrc', '.npmrc', 'patches/**', 'packages/hd-key/src/**', 'packages/hd-key/tsconfig.json', 'packages/hd-key/package.json') }}

      - name: Install dependencies on cache miss
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Verify prepared dependency tree
        run: yarn check:deps

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK components provided by the runner image
        run: |
          command -v sdkmanager
          command -v avdmanager
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Restore or seed the Android API 34 image cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Android/sdk/system-images/android-34/default/x86_64
          key: bridge-in-android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/e2e-bridge-in.yml') }}

      - name: Install the Android API 34 image on cache miss
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sdkmanager --install "system-images;android-34;default;x86_64"
          yes | sdkmanager --licenses >/dev/null

      - name: Verify Android emulator host acceleration
        run: |
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -s "$ANDROID_HOME/system-images/android-34/default/x86_64/package.xml"
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Build Testnet E2E APK
        run: yarn test:e2e:android:build

      - name: Record APK build provenance
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          NODE_MODULES_CACHE_KEY: bridge-in-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node22-yarn1-${{ hashFiles('package.json', 'yarn.lock', '.yarnrc', '.npmrc', 'patches/**', 'packages/hd-key/src/**', 'packages/hd-key/tsconfig.json', 'packages/hd-key/package.json') }}
          ANDROID_IMAGE_CACHE_KEY: bridge-in-android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/e2e-bridge-in.yml') }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          mkdir -p "$RUNNER_TEMP/bridge-in-apk"
          cp "$apk" "$RUNNER_TEMP/bridge-in-apk/app-debug.apk"
          node - "$RUNNER_TEMP/bridge-in-apk/metadata.json" <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const java = spawnSync('java', ['-version'], { encoding: 'utf8' });
          if (java.status !== 0) throw new Error('Could not read the Java toolchain version.');
          const androidVariables = fs.readFileSync('android/variables.gradle', 'utf8');
          const compileSdkApi = Number(androidVariables.match(/compileSdkVersion\s*=\s*(\d+)/)?.[1]);
          const targetSdkApi = Number(androidVariables.match(/targetSdkVersion\s*=\s*(\d+)/)?.[1]);
          if (!Number.isInteger(compileSdkApi) || !Number.isInteger(targetSdkApi)) {
            throw new Error('Could not resolve the Android compile and target SDKs.');
          }
          const metadata = {
            buildOs: process.env.RUNNER_OS_NAME,
            buildArch: process.env.RUNNER_ARCH_NAME,
            nodeVersion: process.version,
            javaVersion: `${java.stdout}${java.stderr}`.trim(),
            compileSdkApi,
            targetSdkApi,
            emulatorApi: 34,
            variant: 'debug',
            command: 'yarn test:e2e:android:build',
            nodeModulesCacheKey: process.env.NODE_MODULES_CACHE_KEY,
            nodeModulesCacheReady: true,
            androidImageCacheKey: process.env.ANDROID_IMAGE_CACHE_KEY,
            androidImageCacheReady: true,
            flags: {
              MIDEN_E2E_TEST: 'true',
              MIDEN_E2E_DISABLE_ENDPOINT_OVERRIDES: 'true',
              MIDEN_NETWORK: 'testnet',
              E2E_EVM_RPC_URL: 'http://127.0.0.1:8545',
              MIDEN_REMOTE_CONFIG_URL: 'http://127.0.0.1:8550',
            },
          };
          fs.writeFileSync(process.argv[2], `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-in-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/bridge-in-apk/
          retention-days: 1
          if-no-files-found: error

  android-prepare-package:
    name: Bind prepared artifacts to source and workflow run
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'android-prepare'
    needs: [android-prepare-cli, android-prepare-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bridge-in-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/bridge-in-cli

      - uses: actions/download-artifact@v4
        with:
          name: bridge-in-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/bridge-in-apk

      - name: Build provenance manifest and verify inputs
        env:
          CLI_DIR: ${{ runner.temp }}/bridge-in-cli
          APK_DIR: ${{ runner.temp }}/bridge-in-apk
          PREPARATION_MODE: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-in-prebuilt/bin" "$RUNNER_TEMP/bridge-in-prebuilt/android/app/build/outputs/apk/debug"
          cp "$CLI_DIR/miden-client" "$RUNNER_TEMP/bridge-in-prebuilt/bin/miden-client"
          chmod 755 "$RUNNER_TEMP/bridge-in-prebuilt/bin/miden-client"
          cp "$APK_DIR/app-debug.apk" "$RUNNER_TEMP/bridge-in-prebuilt/android/app/build/outputs/apk/debug/app-debug.apk"
          node - "$CLI_DIR/metadata.json" "$APK_DIR/metadata.json" "$RUNNER_TEMP/bridge-in-prebuilt/manifest.json" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const [cliMetaPath, apkMetaPath, manifestPath] = process.argv.slice(2);
          const cliMeta = JSON.parse(fs.readFileSync(cliMetaPath, 'utf8'));
          const apkMeta = JSON.parse(fs.readFileSync(apkMetaPath, 'utf8'));
          const cliPath = path.resolve(path.dirname(manifestPath), 'bin/miden-client');
          const apkPath = path.resolve(path.dirname(manifestPath), 'android/app/build/outputs/apk/debug/app-debug.apk');
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const manifest = {
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            workflowFile: 'e2e-bridge-in.yml',
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowEvent: process.env.GITHUB_EVENT_NAME,
            workflowRef: process.env.GITHUB_REF,
            commit: process.env.GITHUB_SHA,
            artifactName: `bridge-in-prebuilt-${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ID}`,
            cli: { ...cliMeta, sha256: sha256(cliPath) },
            apk: { ...apkMeta, sha256: sha256(apkPath) },
          };
          if (manifest.workflowEvent !== 'workflow_dispatch' || process.env.PREPARATION_MODE !== 'android-prepare') {
            throw new Error('Preparation must be dispatched in android-prepare mode.');
          }
          if (cliMeta.buildOs !== 'macOS' || cliMeta.buildArch !== 'X64') throw new Error('CLI must be built on Intel macOS.');
          if (apkMeta.buildOs !== 'macOS' || apkMeta.buildArch !== 'X64') throw new Error('APK must be built on Intel macOS.');
          if (apkMeta.nodeModulesCacheReady !== true || apkMeta.androidImageCacheReady !== true) {
            throw new Error('The exact Android dependency and system-image caches were not verified.');
          }
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Prepared ${manifest.artifactName}: CLI ${manifest.cli.versionText}; APK SHA-256 ${manifest.apk.sha256}.`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-in-prebuilt-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bridge-in-prebuilt/
          retention-days: 90
          if-no-files-found: error

  mobile-bridge-in-testnet:
    name: Bridge-IN E2E (iOS, testnet + local Anvil)
    if: github.event_name == 'push' || inputs.platform == 'ios'
    # macos-26 matches build-mobile.yml (iOS 26 SDK symbols in dapp-browser's
    # WKWebViewController). -xlarge is the dedicated Apple-Silicon runner —
    # shared macos-26 runners were intermittently too degraded for two-sim setup.
    runs-on: macos-26-xlarge
    # Setup dominates: miden-client-cli compile on cache miss (~7-15 min) + iOS
    # build (~25 min) + simulator cold boot (overlapped). The suite is two tests
    # (~2 min each, serial), and --retries=2 gives up to three fresh attempts each.
    # A dispatch may first build a linked web-sdk PR from source (73 min on macos-26, pr-compile-surfaces.yml).
    # A `Client PR:` or `Protocol PR:` marker on that PR also rebuilds the CLI cold (up to 6 min on this runner).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 195 || 110 }}
    env:
      E2E_NETWORK: testnet
      # Redirect the app's EVM reads (balance, receipt) AND the counterparty's
      # broadcasts at the local Anvil the spec starts. Baked into the app bundle
      # at build time (config.ts override) and read by the counterparty at run.
      E2E_EVM_RPC_URL: http://127.0.0.1:8545
      # The USDCx spec forks Sepolia on that Anvil and deposits into Circle's real
      # xReserve contract; an Arc Testnet fork cannot move Arc's USDC. This makes
      # the wallet's USDCx route use Sepolia's xReserve and USDC. Baked into the app
      # bundle at build time, and read by the spec at run to decide if it can run.
      MIDEN_E2E_USDCX_CHAIN: sepolia
      # Optional: the RPC the fork reads Sepolia's state from. Unset, the spec uses
      # a public Sepolia RPC.
      E2E_SEPOLIA_FORK_URL: ${{ secrets.E2E_SEPOLIA_FORK_URL }}
      # The config document the suite's global setup serves on :8550: the live
      # testnet bridge account, indexer and USDC faucet, this job's Anvil bridge
      # and USDC, and the local FAKE allocator (:8548) the Epoch spec starts for
      # the SDK's quote / createAllocation / intentStatus calls. Baked at build
      # time (MIDEN_REMOTE_CONFIG_URL define).
      MIDEN_REMOTE_CONFIG_URL: http://127.0.0.1:8550
      # Optional: give the headless counterparty its OWN relay projectId so it
      # doesn't double the app projectId's load on the relay (reduces
      # rate-limit trips) - per-projectId load relief only, never the fix for a
      # suspended or rejected projectId. When unset, empty or blank, the
      # counterparty uses WC_PROJECT_ID from src/lib/walletconnect/config.ts,
      # resolved from this job's own env: WALLETCONNECT_PROJECT_ID (which this
      # workflow does not set), else DEFAULT_WC_PROJECT_ID. Do NOT override
      # WALLETCONNECT_PROJECT_ID here - the iOS bundle needs a projectId
      # allow-listed for com.miden.bread, and the one allow-list check on
      # record (tasks/todo.md) covers the retired default b54ef53.
      WC_COUNTERPARTY_PROJECT_ID: ${{ secrets.WC_COUNTERPARTY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Foundry provides `anvil` (the local EVM the spec boots) + `forge`/`cast`.
      # AnvilInstance resolves the binary from PATH / ~/.foundry/bin.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      # On a dispatch from a pull request's branch these build against that pull request's linked
      # web-sdk and Guardian PRs, as its own CI does; on any other run both are no-ops.
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      # Not frozen: an injection rewrites package.json to `file:` deps the committed lockfile cannot match.
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      - name: Install miden-client-cli
        # Reads the CLI pin (midenClientCliGit, else midenClientCliVersion) from
        # package.json — the same resolution playwright/e2e/helpers/miden-cli.ts does —
        # and skips the ~7 min compile when the cache above already restored the binary.
        # It also rebuilds the CLI against a linked Protocol PR when the PR carries one;
        # no marker means the published pin, exactly as before.
        uses: ./.github/actions/install-miden-client-cli

      # CDP bridge (appium-remote-debugger) requires Simulator.app GUI running —
      # headless simctl boots don't expose webinspectord.
      - name: Launch Simulator.app
        run: open -a Simulator || true

      # idb (Facebook's iOS debug bridge) lets the harness tap "Allow" on the
      # native notification-permission SpringBoard alert, which lives outside the
      # WebView (CDP can't reach it) and otherwise covers every screenshot.
      # Best-effort: the harness degrades gracefully when idb is absent, so a
      # broken install must never fail the job.
      #
      # fb-idb (1.1.7, unmaintained) calls asyncio.get_event_loop(), which
      # Python 3.14 — the runner's default python3 — removed, crashing idb. Pin
      # 3.11 for it; nothing else in this job uses python3 (build is node +
      # xcodebuild). `brew trust ... || true` because older-Homebrew runners have
      # no `trust` subcommand (and `brew install` auto-taps anyway).
      - name: Set up Python for idb
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install idb (dismiss native notification alert)
        continue-on-error: true
        run: |
          brew trust facebook/fb || true
          brew install facebook/fb/idb-companion
          python3 -m pip install fb-idb

      # Fresh-create + boot of custom sims hangs on macos-26 runners. Pin to
      # preinstalled Xcode sims by writing .device-pair.json before globalSetup.
      - name: Pin test pair to preinstalled simulators
        shell: bash
        run: |
          list_json=$(xcrun simctl list devices --json)
          UDID_A=$(echo "$list_json" | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) |
              .value[] | select(.name == "iPhone 17" and .isAvailable) ]
            | first | .udid // empty')
          UDID_B=$(echo "$list_json" | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) |
              .value[] | select(.name == "iPhone 17 Pro" and .isAvailable) ]
            | first | .udid // empty')
          if [[ -z "$UDID_A" || -z "$UDID_B" ]]; then
            echo "Missing preinstalled sim. A='$UDID_A'  B='$UDID_B'"
            echo "Full device list:"
            xcrun simctl list devices
            exit 1
          fi
          mkdir -p test-results-ios
          printf '{"udidA":"%s","udidB":"%s"}\n' "$UDID_A" "$UDID_B" > test-results-ios/.device-pair.json
          echo "Wrote .device-pair.json: A=$UDID_A  B=$UDID_B"

      # Kick the cold boot off now so it overlaps the ~25-minute app build.
      - name: Pre-boot simulators (async, overlaps build)
        shell: bash
        run: |
          UDID_A=$(jq -r .udidA test-results-ios/.device-pair.json)
          UDID_B=$(jq -r .udidB test-results-ios/.device-pair.json)
          boot_with_retry() {
            local udid="$1"
            for attempt in 1 2 3 4; do
              state=$(xcrun simctl list devices | grep "$udid" | grep -o '(Booted)\|(Shutdown)\|(Booting)' || true)
              if [[ "$state" == "(Booted)" || "$state" == "(Booting)" ]]; then
                echo "$udid already $state"
                return 0
              fi
              if xcrun simctl boot "$udid"; then
                echo "$udid boot issued (attempt $attempt)"
                return 0
              fi
              echo "boot attempt $attempt for $udid failed; retrying in 20s"
              sleep 20
            done
            return 1
          }
          ensure_bootable() {
            local udid="$1"
            if boot_with_retry "$udid"; then return 0; fi
            echo "CoreSimulatorService appears wedged; restarting it"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
            sleep 15
            open -a Simulator || true
            sleep 10
            if boot_with_retry "$udid"; then return 0; fi
            echo "::error::simulator subsystem unusable on this runner (boot of $udid failed after CoreSimulatorService restart)"
            return 1
          }
          ensure_bootable "$UDID_A"
          ensure_bootable "$UDID_B"
          xcrun simctl list devices | grep -E "$UDID_A|$UDID_B" || true

      # Built for a GENERIC simulator destination (see test:e2e:mobile:build), so
      # it doesn't need a concrete booted device. E2E_EVM_RPC_URL is baked here.
      - name: Build iOS app
        # Self-heal the recurring GitHub macOS-runner SwiftPM cache
        # corruption ("xcodebuild: error: Could not resolve package
        # dependencies: ... org.swift.swiftpm/repositories/<pkg> ... No
        # such file or directory"): on a failed build, wipe the corrupt
        # SwiftPM cache + derived data and retry once before failing.
        run: |
          yarn test:e2e:mobile:build || {
            echo "::warning::iOS build failed; clearing SwiftPM cache (runner cache corruption) and retrying once"
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm" ios/App/build
            yarn test:e2e:mobile:build
          }

      - name: Run bridge-IN deposit E2E (mobile, testnet + local Anvil)
        id: e2e
        # The `bridge-in-deposit` filter matches BOTH deposit specs (AggLayer +
        # Epoch); they run serially (workers:1), each booting/tearing down its own
        # Anvil (+ the Epoch spec its own fake allocator). --retries=2 absorbs
        # flaky CDP setup on macos-26 AND transient relay rate-limit trips on the
        # connect step; each attempt is a fresh wallet + pairing + Anvil.
        #
        # NON-BLOCKING for now: the deposit ships to users (testnet.json switches
        # bridge-in on), so this suite is its only E2E. Its WalletConnect handshake was
        # rejected with WS close 3000 ("Project not found"). Until #1259, an
        # unset WC_COUNTERPARTY_PROJECT_ID secret made the counterparty send a
        # blank project id, which alone produces that rejection; whether the
        # app's own id was also rejected is not recorded. REMOVE this
        # continue-on-error once a run on the current default passes.
        continue-on-error: true
        run: yarn playwright test --config playwright.ios.bridge-in.config.ts --retries=2

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-in-e2e-testnet-${{ github.run_id }}
          path: test-results-ios/
          retention-days: 7
          if-no-files-found: ignore

  android-bridge-in-testnet:
    name: AggLayer bridge-in (${{ inputs.loop_count }} loops, Android Testnet)
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'android'
    # The standard 4-vCPU Intel runner let Hypervisor.framework pass, but the
    # Android emulator then forced its guest to one vCPU and QEMU never exposed
    # adb. The 12-core Intel larger runner keeps hardware acceleration and has
    # enough host CPU/RAM for the visible x86_64 AVD.
    runs-on: macos-26-large
    # Android builds, dependency installs, and SDK/image downloads are prepared
    # on the exact SHA before this job. The watchdog bounds the first real loop.
    timeout-minutes: 360
    env:
      E2E_NETWORK: testnet
      MIDEN_E2E_TEST: 'true'
      E2E_EVM_RPC_URL: http://127.0.0.1:8545
      E2E_COUNTERPARTY_EVM_RPC_URL: http://127.0.0.1:8545
      MIDEN_REMOTE_CONFIG_URL: http://127.0.0.1:8550
      BRIDGE_IN_ROUTE: agglayer
      BRIDGE_IN_LOOP_COUNT: ${{ inputs.loop_count }}
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
    steps:
      - name: Start the dispatch-based first-loop clock
        id: startup-clock
        uses: actions/github-script@v7
        timeout-minutes: 1
        env:
          STARTUP_DEADLINE_MS: '300000'
          BRIDGE_IN_LOOP_COUNT: ${{ inputs.loop_count }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const reportPath = path.join(process.env.RUNNER_TEMP, `bridge-in-startup-watchdog-${context.runId}.json`);
            const androidJobStartedAt = new Date().toISOString();
            let run;
            try {
              run = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
            } catch (error) {
              fs.writeFileSync(reportPath, `${JSON.stringify({
                status: 'startup_clock_lookup_failed',
                androidJobStartedAt,
                observedAt: new Date().toISOString(),
                firstLoopStarted: false,
                error: { name: error.name, message: error.message },
              }, null, 2)}\n`);
              core.setFailed(`Could not load the workflow creation time for the five-minute first-loop deadline: ${error.message}`);
              return;
            }
            const workflowCreatedAt = run.data.created_at;
            const workflowCreatedAtMs = Date.parse(workflowCreatedAt);
            const deadlineMs = Number(process.env.STARTUP_DEADLINE_MS);
            if (!Number.isFinite(workflowCreatedAtMs) || !Number.isSafeInteger(deadlineMs) || deadlineMs <= 0) {
              fs.writeFileSync(reportPath, `${JSON.stringify({
                status: 'startup_clock_invalid',
                workflowCreatedAt,
                androidJobStartedAt,
                observedAt: new Date().toISOString(),
                firstLoopStarted: false,
              }, null, 2)}\n`);
              core.setFailed('Could not establish the workflow-created first-loop deadline.');
              return;
            }
            core.exportVariable('E2E_WORKFLOW_CREATED_AT', workflowCreatedAt);
            core.exportVariable('E2E_ANDROID_JOB_STARTED_AT', androidJobStartedAt);
            core.setOutput('workflow-created-at', workflowCreatedAt);
            core.setOutput('android-job-started-at', androidJobStartedAt);
            core.setOutput('deadline-ms', String(deadlineMs));
            if (!/^[0-9]+$/.test(process.env.BRIDGE_IN_LOOP_COUNT) ||
                Number(process.env.BRIDGE_IN_LOOP_COUNT) < 1 || Number(process.env.BRIDGE_IN_LOOP_COUNT) > 100) {
              fs.writeFileSync(reportPath, `${JSON.stringify({
                status: 'invalid_loop_count',
                workflowCreatedAt,
                androidJobStartedAt,
                observedAt: new Date().toISOString(),
                firstLoopStarted: false,
                requestedLoopCount: process.env.BRIDGE_IN_LOOP_COUNT,
              }, null, 2)}\n`);
              core.setFailed('AggLayer loop count must be an integer from 1 to 100.');
              return;
            }
            const elapsedMs = Date.now() - workflowCreatedAtMs;
            core.info(
              `Workflow-to-job elapsed ${elapsedMs}ms; ${Math.max(0, deadlineMs - elapsedMs)}ms remain before the first-loop deadline.`
            );
            if (elapsedMs >= deadlineMs) {
              fs.writeFileSync(reportPath, `${JSON.stringify({
                status: 'startup_deadline_exceeded_before_job_setup',
                workflowCreatedAt,
                androidJobStartedAt,
                deadlineAt: new Date(workflowCreatedAtMs + deadlineMs).toISOString(),
                observedAt: new Date().toISOString(),
                dispatchToObservedMs: elapsedMs,
                dispatchToFirstLoopMs: null,
                withinFiveMinuteTarget: false,
                deadlineMs,
              }, null, 2)}\n`);
              core.setFailed(
                `The workflow reached its Android job after ${elapsedMs}ms; ` +
                `the first-loop deadline is ${deadlineMs}ms from workflow creation.`
              );
            }

      - name: Find prepared Android artifacts for this commit
        id: prepared
        uses: actions/github-script@v7
        timeout-minutes: 1
        env:
          WORKFLOW_CREATED_AT: ${{ steps.startup-clock.outputs.workflow-created-at }}
          STARTUP_DEADLINE_MS: ${{ steps.startup-clock.outputs.deadline-ms }}
        with:
          script: |
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const [runsResponse, artifactsResponse] = await Promise.all([
              github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'e2e-bridge-in.yml',
                branch,
                head_sha: context.sha,
                per_page: 100,
              }),
              github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }),
            ]);
            const workflowCreatedAtMs = Date.parse(process.env.WORKFLOW_CREATED_AT);
            const deadlineMs = Number(process.env.STARTUP_DEADLINE_MS);
            const elapsedMs = Date.now() - workflowCreatedAtMs;
            if (!Number.isFinite(workflowCreatedAtMs) || !Number.isSafeInteger(deadlineMs) ||
                elapsedMs >= deadlineMs) {
              const reportPath = require('node:path').join(
                process.env.RUNNER_TEMP,
                `bridge-in-startup-watchdog-${context.runId}.json`
              );
              require('node:fs').writeFileSync(reportPath, `${JSON.stringify({
                status: 'startup_deadline_exceeded_during_artifact_lookup',
                workflowCreatedAt: process.env.WORKFLOW_CREATED_AT,
                observedAt: new Date().toISOString(),
                dispatchToObservedMs: elapsedMs,
                dispatchToFirstLoopMs: null,
                withinFiveMinuteTarget: false,
                firstLoopStarted: false,
                deadlineMs,
              }, null, 2)}\n`);
              core.setFailed(`The five-minute first-loop budget expired during exact-SHA artifact lookup (${elapsedMs}ms).`);
              return;
            }
            const successfulPreparationRunIds = new Set(runsResponse.data.workflow_runs
              .filter(run => run.event === 'workflow_dispatch' &&
                run.status === 'completed' && run.conclusion === 'success' &&
                run.head_branch === branch && run.head_sha === context.sha)
              .map(run => run.id));
            const namePrefix = `bridge-in-prebuilt-${context.sha}-`;
            const preparedArtifact = artifactsResponse.data.artifacts.find(artifact =>
              artifact.name.startsWith(namePrefix) && !artifact.expired &&
              successfulPreparationRunIds.has(artifact.workflow_run?.id) &&
              artifact.workflow_run?.head_branch === branch &&
              artifact.workflow_run?.head_sha === context.sha &&
              artifact.workflow_run?.head_repository_id === Number(process.env.GITHUB_REPOSITORY_ID)
            );
            if (!preparedArtifact) {
              core.setFailed(
                `No successful Android preparation artifact exists for ${context.sha}. ` +
                `Run: gh workflow run e2e-bridge-in.yml -R ${context.repo.owner}/${context.repo.repo} --ref ${branch} -f platform=android-prepare`
              );
            } else {
              core.setOutput('run-id', String(preparedArtifact.workflow_run.id));
              core.setOutput('artifact-name', preparedArtifact.name);
              core.info(`Using exact-SHA preparation run ${preparedArtifact.workflow_run.id}.`);
            }

      - uses: actions/checkout@v4
        timeout-minutes: 1
        id: checkout

      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with: { node-version: 22 }

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline runner_setup

      # Dependency installation took over four minutes cold. The preparation mode
      # seeds this exact lockfile/platform cache; never install dependencies on the live path.
      - name: Restore prepared Android E2E dependencies
        id: deps-cache
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/hd-key/dist
          key: bridge-in-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node22-yarn1-${{ hashFiles('package.json', 'yarn.lock', '.yarnrc', '.npmrc', 'patches/**', 'packages/hd-key/src/**', 'packages/hd-key/tsconfig.json', 'packages/hd-key/package.json') }}

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline dependency_cache_restore

      - name: Require and verify prepared Android E2E dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::The exact Android E2E dependency cache is missing. Run e2e-bridge-in.yml with platform=android-prepare for this commit before starting the live workflow."
          exit 1

      - name: Download prepared CLI and APK
        if: steps.prepared.outputs.run-id != ''
        timeout-minutes: 2
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prepared.outputs.artifact-name }}
          path: ${{ runner.temp }}/bridge-in-prebuilt
          repository: ${{ github.repository }}
          run-id: ${{ steps.prepared.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline prepared_artifact_download

      - name: Verify prepared artifacts and install their paths
        timeout-minutes: 1
        env:
          PREBUILT_DIR: ${{ runner.temp }}/bridge-in-prebuilt
          PREBUILT_RUN_ID: ${{ steps.prepared.outputs.run-id }}
          EXPECTED_NODE_MODULES_CACHE_KEY: bridge-in-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node22-yarn1-${{ hashFiles('package.json', 'yarn.lock', '.yarnrc', '.npmrc', 'patches/**', 'packages/hd-key/src/**', 'packages/hd-key/tsconfig.json', 'packages/hd-key/package.json') }}
          EXPECTED_ANDROID_IMAGE_CACHE_KEY: bridge-in-android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/e2e-bridge-in.yml') }}
        run: |
          set -euo pipefail
          cli="$PREBUILT_DIR/bin/miden-client"
          chmod 755 "$cli"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const manifestPath = path.join(process.env.PREBUILT_DIR, 'manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const hash = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const cli = path.join(process.env.PREBUILT_DIR, 'bin', 'miden-client');
          const apk = path.join(process.env.PREBUILT_DIR, 'android', 'app', 'build', 'outputs', 'apk', 'debug', 'app-debug.apk');
          const pin = require('./package.json');
          for (const [field, expected] of Object.entries({
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            workflowFile: 'e2e-bridge-in.yml',
            workflowRunId: process.env.PREBUILT_RUN_ID,
            workflowEvent: 'workflow_dispatch',
            workflowRef: process.env.GITHUB_REF,
            commit: process.env.GITHUB_SHA,
            artifactName: `bridge-in-prebuilt-${process.env.GITHUB_SHA}-${process.env.PREBUILT_RUN_ID}`,
          })) {
            if (String(manifest[field]) !== String(expected)) throw new Error(`Prepared artifact ${field} mismatch.`);
          }
          if (manifest.cli?.cliVersion !== (pin.midenClientCliVersion ?? null) ||
              manifest.cli?.cliGitUrl !== (pin.midenClientCliGit?.url ?? null) ||
              manifest.cli?.cliGitRev !== (pin.midenClientCliGit?.rev ?? null) ||
              manifest.cli?.cliProtocolVersion !== (pin.midenClientCliProtocolVersion ?? null) ||
              manifest.cli?.rustToolchain !== '1.98.1' ||
              manifest.cli?.buildOs !== 'macOS' || manifest.cli?.buildArch !== 'X64') {
            throw new Error('Prepared CLI pin does not match this checkout.');
          }
          const expectedApkFlags = {
            MIDEN_E2E_TEST: 'true',
            MIDEN_E2E_DISABLE_ENDPOINT_OVERRIDES: 'true',
            MIDEN_NETWORK: 'testnet',
            E2E_EVM_RPC_URL: 'http://127.0.0.1:8545',
            MIDEN_REMOTE_CONFIG_URL: 'http://127.0.0.1:8550',
          };
          if (manifest.apk?.buildOs !== 'macOS' || manifest.apk?.buildArch !== 'X64' ||
              manifest.apk?.compileSdkApi !== 36 || manifest.apk?.targetSdkApi !== 36 ||
              manifest.apk?.emulatorApi !== 34 || manifest.apk?.variant !== 'debug' ||
              manifest.apk?.command !== 'yarn test:e2e:android:build' ||
              manifest.apk?.nodeModulesCacheReady !== true ||
              manifest.apk?.nodeModulesCacheKey !== process.env.EXPECTED_NODE_MODULES_CACHE_KEY ||
              manifest.apk?.androidImageCacheReady !== true ||
              manifest.apk?.androidImageCacheKey !== process.env.EXPECTED_ANDROID_IMAGE_CACHE_KEY ||
              JSON.stringify(manifest.apk?.flags) !== JSON.stringify(expectedApkFlags)) {
            throw new Error('Prepared APK build environment does not match this workflow.');
          }
          for (const file of [cli, apk]) {
            if (!fs.statSync(file).isFile()) throw new Error(`Prepared artifact is not a file: ${file}`);
          }
          if (hash(cli) !== manifest.cli?.sha256 || hash(apk) !== manifest.apk?.sha256) {
            throw new Error('Prepared CLI or APK SHA-256 does not match its manifest.');
          }
          const cliVersion = require('node:child_process').execFileSync(cli, ['--version'], { encoding: 'utf8' }).trim();
          if (cliVersion !== manifest.cli.versionText) throw new Error('Prepared CLI version text does not match its manifest.');
          console.log(`Verified prepared artifacts for ${manifest.commit}; ${cliVersion}.`);
          NODE
          mkdir -p android/app/build/outputs/apk/debug
          cp "$PREBUILT_DIR/android/app/build/outputs/apk/debug/app-debug.apk" android/app/build/outputs/apk/debug/app-debug.apk
          "$cli" --version
          echo "MIDEN_CLIENT_BIN=$cli" >> "$GITHUB_ENV"

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline prepared_artifact_verification

      - name: Restore prepared Android API 34 image
        id: android-sdk-cache
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Android/sdk/system-images/android-34/default/x86_64
          key: bridge-in-android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/e2e-bridge-in.yml') }}

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline android_image_restore

      - name: Require prepared Android API 34 image
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::The exact Android API 34 image cache is missing. Run e2e-bridge-in.yml with platform=android-prepare for this commit before starting the live workflow."
          exit 1

      # Emulator 37.2.12 explicitly reduced the guest to one vCPU on hosts with
      # fewer than six logical cores, then QEMU stalled before adb became ready.
      - name: Verify Android emulator host capacity
        timeout-minutes: 1
        run: |
          host_cores=$(sysctl -n hw.ncpu)
          if ! [[ "$host_cores" =~ ^[0-9]+$ ]] || (( host_cores < 6 )); then
            echo "::error::The Android x86_64 emulator requires at least 6 host logical CPUs; this runner reports '$host_cores'."
            exit 1
          fi
          echo "Android emulator host exposes $host_cores logical CPUs."

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline emulator_host_check

      - name: Verify restored Android SDK packages
        timeout-minutes: 1
        run: |
          command -v sdkmanager
          command -v avdmanager
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "::error::macos-26-large must provide an x86_64 host for the Android image"
            exit 1
          fi
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -s "$ANDROID_HOME/system-images/android-34/default/x86_64/package.xml"

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline android_sdk_verification

      # Prove the selected runner exposes Hypervisor.framework before emulator boot.
      - name: Verify Android VM acceleration
        # The exact Intel runner must expose Hypervisor.framework before the
        # visible emulator is booted; APK compilation has already happened in preparation.
        timeout-minutes: 1
        run: '"$ANDROID_HOME/emulator/emulator" -accel-check'

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline hypervisor_check

      - name: Create base AVD
        timeout-minutes: 1
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --name Pixel_API_34 \
            --package "system-images;android-34;default;x86_64" \
            --device pixel_6 \
            --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx 'Pixel_API_34' || {
            echo "::error::avdmanager created Pixel_API_34 but the emulator cannot list it" >&2
            ls -la "$ANDROID_AVD_HOME" || true
            exit 1
          }

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline avd_creation

      - name: Start visible emulator boot before Playwright setup
        timeout-minutes: 1
        run: |
          node -r ts-node/register -e "require('./playwright/e2e/android/helpers/emulator-control').EmulatorControl.startSingle().then(serial => console.log('Visible Android emulator boot started on ' + serial)).catch(error => { console.error(error); process.exitCode = 1 })"

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline emulator_launch

      - name: Install Foundry (anvil)
        timeout-minutes: 1
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check dispatch-based first-loop deadline
        run: node scripts/run-android-bridge-in-with-startup-deadline.cjs --check-startup-deadline foundry_install

      - name: Run Android E2E
        id: android-e2e
        env:
          E2E_FIRST_LOOP_MARKER: ${{ runner.temp }}/bridge-in-first-loop-${{ github.run_id }}.json
          E2E_STARTUP_WATCHDOG_REPORT: ${{ runner.temp }}/bridge-in-startup-watchdog-${{ github.run_id }}.json
          E2E_ANDROID_STARTUP_DEADLINE_MS: '300000'
        run: |
          rm -f "$E2E_FIRST_LOOP_MARKER" "$E2E_FIRST_LOOP_MARKER.tmp" "$E2E_STARTUP_WATCHDOG_REPORT"
          node scripts/run-android-bridge-in-with-startup-deadline.cjs \
            --config playwright.android.bridge-in.config.ts \
            playwright/e2e/android/tests/bridge-in-deposit.android.spec.ts \
            --retries=0

      - name: Record startup result if setup or cancellation skipped the watchdog report
        if: always()
        timeout-minutes: 1
        uses: actions/github-script@v7
        env:
          FIRST_LOOP_MARKER: ${{ runner.temp }}/bridge-in-first-loop-${{ github.run_id }}.json
          STARTUP_REPORT: ${{ runner.temp }}/bridge-in-startup-watchdog-${{ github.run_id }}.json
          WORKFLOW_CREATED_AT: ${{ steps.startup-clock.outputs.workflow-created-at }}
          ANDROID_JOB_STARTED_AT: ${{ steps.startup-clock.outputs.android-job-started-at }}
          STARTUP_DEADLINE_MS: ${{ steps.startup-clock.outputs.deadline-ms }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            if (fs.existsSync(process.env.STARTUP_REPORT)) {
              core.info(`Startup outcome is already recorded at ${process.env.STARTUP_REPORT}.`);
              return;
            }
            const workflowCreatedAt = process.env.WORKFLOW_CREATED_AT || null;
            const androidJobStartedAt = process.env.ANDROID_JOB_STARTED_AT || null;
            const workflowCreatedAtMs = Date.parse(workflowCreatedAt || '');
            const androidJobStartedAtMs = Date.parse(androidJobStartedAt || '');
            const deadlineMs = Number(process.env.STARTUP_DEADLINE_MS || 300000);
            let marker;
            try {
              marker = JSON.parse(fs.readFileSync(process.env.FIRST_LOOP_MARKER, 'utf8'));
            } catch (error) {
              if (!error || error.code !== 'ENOENT') throw error;
            }
            const firstLoopAtMs = Date.parse(marker?.at || '');
            const observedAt = Date.now();
            const report = {
              status: marker ? 'workflow_exited_without_startup_report_after_loop_entry' : 'workflow_exited_before_loop_entry_without_startup_report',
              ...(workflowCreatedAt ? { workflowCreatedAt } : {}),
              ...(androidJobStartedAt ? { androidJobStartedAt } : {}),
              ...(Number.isFinite(firstLoopAtMs) ? { firstLoopStartedAt: new Date(firstLoopAtMs).toISOString() } : {}),
              ...(Number.isFinite(firstLoopAtMs) && Number.isFinite(workflowCreatedAtMs)
                ? { dispatchToFirstLoopMs: firstLoopAtMs - workflowCreatedAtMs }
                : {}),
              ...(Number.isFinite(firstLoopAtMs) && Number.isFinite(androidJobStartedAtMs)
                ? { jobToFirstLoopMs: firstLoopAtMs - androidJobStartedAtMs }
                : {}),
              ...(Number.isFinite(workflowCreatedAtMs)
                ? { deadlineAt: new Date(workflowCreatedAtMs + deadlineMs).toISOString() }
                : {}),
              observedAt: new Date(observedAt).toISOString(),
              ...(Number.isFinite(workflowCreatedAtMs)
                ? { dispatchToObservedMs: observedAt - workflowCreatedAtMs }
                : {}),
              firstLoopStarted: Boolean(marker),
              withinFiveMinuteTarget: Number.isFinite(firstLoopAtMs) && Number.isFinite(workflowCreatedAtMs) &&
                firstLoopAtMs - workflowCreatedAtMs <= deadlineMs,
              deadlineMs,
              reportFinalized: true,
            };
            fs.mkdirSync(path.dirname(process.env.STARTUP_REPORT), { recursive: true });
            const temporary = `${process.env.STARTUP_REPORT}.tmp`;
            fs.writeFileSync(temporary, `${JSON.stringify(report, null, 2)}\n`);
            fs.renameSync(temporary, process.env.STARTUP_REPORT);
            core.warning(`Recorded missing startup outcome at ${process.env.STARTUP_REPORT}.`);

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-in-android-testnet-${{ github.run_id }}
          path: |
            test-results-android/
            ${{ runner.temp }}/bridge-in-startup-watchdog-${{ github.run_id }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect emulator logs on failure
        if: failure() && steps.checkout.outcome == 'success'
        timeout-minutes: 3
        run: node scripts/collect-android-emulator-logs.mjs

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-in-android-diagnostics-${{ github.run_id }}
          path: test-results-android/emulator-logs/failure-diagnostics.log
          retention-days: 7
          if-no-files-found: ignore

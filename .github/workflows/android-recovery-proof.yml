name: Android publishing recovery proof
on:
  push:
    branches: [fix/play-submit-recovery]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/store-publishing/auth.test.mjs scripts/store-publishing/play.test.mjs scripts/store-publishing/publish-plan.test.mjs scripts/store-publishing/cli.test.mjs

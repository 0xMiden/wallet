name: Restart state focused proof
on:
  push:
    branches: ['ci/1961-restart-green-*']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/workflow-sha.txt
          echo acef74f46f7015c0284e9db2e0e1496da8d11d08 | tee proof/source-sha.txt
          test "$(git rev-parse HEAD^)" = acef74f46f7015c0284e9db2e0e1496da8d11d08
      - name: Install dependencies
        id: install
        timeout-minutes: 6
        run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Run focused suites
        if: steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/store/index.test.ts src/lib/store/hooks/useIntercomSync.test.ts --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
          node -e "const x=require('./proof/results.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests}));if(n===0 || x.numFailedTests!==0)process.exit(1)"
      - name: Typecheck
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn ts 2>&1 | tee proof/typecheck.log
      - name: Produce formatted files
        if: always() && steps.install.outcome == 'success'
        run: |
          yarn prettier --write src/lib/store/index.ts src/lib/store/index.test.ts
          cp src/lib/store/index.ts proof/index.ts
          cp src/lib/store/index.test.ts proof/index.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-state-green
          path: proof/

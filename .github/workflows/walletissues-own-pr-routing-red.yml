                  ),
              },
          }
          root = pathlib.Path(sys.argv[1])
          for name, spec in payloads.items():
              data = gzip.decompress(base64.b64decode(spec['gzip_base64'], validate=True))
              assert hashlib.sha256(data).hexdigest() == spec['sha256'], name
              path = root / 'source' / name
              path.write_bytes(data)
              path.chmod(spec['mode'])
          bindings = {name: {k: v for k, v in spec.items() if k != 'gzip_base64'}
                      for name, spec in payloads.items()}
          (root / 'source-bindings.json').write_text(json.dumps(bindings, indent=2) + '\n')
          (root / 'transport.json').write_text(json.dumps({
              'source_commit': 'b51de67e421267b76c0cd93ed5acb68829e97ff5',
              'transport_sha': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT']
          }, indent=2) + '\n')
          (root / 'command.json').write_text(json.dumps(
              ['python3', '-B', '-m', 'unittest', '-v', 'test_discover']) + '\n')
          (root / 'before.json').write_text(json.dumps({name: {
              'sha256': hashlib.sha256((root / 'source' / name).read_bytes()).hexdigest(),
              'mode': (root / 'source' / name).stat().st_mode & 0o777
          } for name in bindings}, indent=2) + '\n')
          MATERIALIZE
          python3 --version > "$PROOF_DIR/runtime.txt" 2>&1
      - name: Run all 61 unittest methods and preserve the expected natural red
        id: tests
        run: |
          set -euo pipefail
          cd "$PROOF_DIR/source"
          set +e
          python3 -B -m unittest -v test_discover 2>&1 | tee "$PROOF_DIR/unittest.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$PROOF_DIR/unittest.exit"
          printf '%s\n' "${statuses[1]}" > "$PROOF_DIR/unittest.tee.exit"
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          exit "${statuses[0]}"
      - name: Always verify all three source hashes and modes after the run
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - "$PROOF_DIR" <<'VERIFY_AFTER'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          bindings = json.loads((root / 'source-bindings.json').read_text())
          actual = {name: {'sha256': hashlib.sha256((root / 'source' / name).read_bytes()).hexdigest(),
                           'mode': (root / 'source' / name).stat().st_mode & 0o777}
                    for name in bindings}
          (root / 'after.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual == json.loads((root / 'before.json').read_text()), 'source changed during unittest'
          assert all(actual[name]['sha256'] == spec['sha256'] and actual[name]['mode'] == spec['mode']
                     for name, spec in bindings.items()), 'source does not match signed bindings'
          VERIFY_AFTER
      - name: Always upload scoped red evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: walletissues-own-pr-routing-red
          path: ${{ env.PROOF_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

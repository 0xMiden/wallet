name: E2E USDCx Bridge-IN (live)

# Runs the live USDCx E2E on iOS against the LIVE networks (Arc Testnet, Base
# Sepolia, Arbitrum Sepolia, Ethereum Sepolia and Miden testnet). Nothing on the
# path is a double.
#   Each job deposits 5.2 USDC through the wallet UI and verifies the mint and claim.
#   It then tries one public faucet grant for up to 30 seconds. If the faucet is
#   unavailable, the deposit funds a 5 USDCx return burn. A verified and consumed
#   grant raises the burn to 6 USDCx. Both paths require Circle's payout and the
#   wallet's Confirmed status. Grant failures are recorded in the test evidence.
#   Arc deposits go through xReserve. Base, Arbitrum, and Ethereum Sepolia
#   deposits go through Circle's executor. Each return burn pays the source key
#   on the same chain. Failed grants mean the key loses the fee reserve and
#   payout fees over repeated runs; check its balance before each deposit.
#
# By default the DEPLOYED relayer mints: the faucet does not look at who sent a mint
# note, so the jobs need no relayer of their own and only the EVM key. To test a
# relayer build before it is deployed, set vars.USDCX_RELAYER_ACCOUNT_ID (with the
# other relayer values below); the Arc job then installs that relayer and the spec
# starts it as a local process.
#
# E2E Bridge-IN (e2e-bridge-in.yml) covers the AggLayer deposit UI and the Reown
# pairing hermetically in Release E2E. These jobs cover what that suite cannot:
# Circle's real contracts, its attestation and forward, and the mint.
#
# It spends real Arc Testnet USDC, USDC and ETH on the three source chains, and
# public faucet USDCx on each run, and it depends on Circle's service, the relayer
# and the faucet, so it runs nightly on its own cron (Release E2E's nightly leaves
# it to that cron), on demand and in Release E2E's release runs, and is never a
# per-PR gate.
#
# Required configuration:
#   secrets.USDCX_LIVE_EVM_PRIVATE_KEY        the deposit key: USDC on Arc Testnet (its gas token too), and
#                                             ETH and USDC on Base Sepolia, Arbitrum Sepolia and Ethereum Sepolia
#
# Local relayer only (all required when vars.USDCX_RELAYER_ACCOUNT_ID is set):
#   vars.USDCX_RELAYER_ACCOUNT_ID             funded Miden account that creates the mint notes
#   vars.USDCX_FAUCET_ACCOUNT_ID              the USDCx faucet Circle's Miden domain mints from
#   vars.USDCX_CIRCLE_ATTESTER_PUBLIC_KEY     the key Circle signs deposit attestations with
#   secrets.USDCX_RELAYER_KEYSTORE_TGZ_B64    base64 of a .tgz that holds the relayer's `keystore/`
# The local relayer is installed by scripts/install-usdcx-relayer.sh and cached. The
# miden-usdcx project publishes only the `usdcx-bridge` Docker image, which also
# starts the withdrawal attester and so needs AWS KMS keys; the stand-alone relayer
# has no published binary yet. When it has one, replace the install step with a
# download and set USDCX_RELAYER_BIN.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      deposit_amount:
        description: Arc deposit amount in USDC (at least 5.2)
        required: false
        default: '5.2'
      legs:
        description: Which legs run (all, arc, or one executor source chain)
        required: false
        type: choice
        options:
          - all
          - arc
          - base-sepolia
          - arbitrum-sepolia
          - sepolia
        default: all

permissions:
  contents: read
  # The linked-PR injections list a dispatched branch's open pull request and read its description.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  # Two runs would share the EVM key's nonce and the relayer account. Queue, never cancel:
  # a cancelled run can leave a deposit that no relayer mints.
  cancel-in-progress: false

jobs:
  mobile-usdcx-live:
    name: USDCx bridge-IN E2E (iOS, live testnets)
    # Every run but a dispatch that names one executor source chain; a push and the nightly have no inputs.
    if: ${{ !inputs.legs || inputs.legs == 'all' || inputs.legs == 'arc' }}
    # macos-26 matches build-mobile.yml (iOS 26 SDK symbols in dapp-browser's
    # WKWebViewController). -xlarge is the dedicated Apple-Silicon runner.
    runs-on: macos-26-xlarge
    # Relayer compile on a cache miss + iOS build (~25 min) + the test, which waits
    # for Circle's attestation and the faucet's network transaction.
    # A dispatch may first build a linked web-sdk PR from source (73 min on macos-26, pr-compile-surfaces.yml).
    # A `Client PR:` or `Protocol PR:` marker on that PR also rebuilds the CLI cold (up to 10 min on this runner).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 235 || 150 }}
    env:
      E2E_NETWORK: testnet
      # NO E2E_EVM_RPC_URL here: that flag sends the wallet's Arc reads to a local
      # Anvil, and this job needs the real Arc Testnet RPC.
      # NO USDCX_LIVE_EVM_PRIVATE_KEY here either: every step sees a job variable, the dependency install and the app
      # build among them, so the key is set only on the two steps that read it.
      # The deposit covers a 5 USDCx return burn plus claim and burn fee reserves.
      USDCX_LIVE_DEPOSIT_AMOUNT: ${{ inputs.deposit_amount || '5.2' }}
      USDCX_FAUCET_ACCOUNT_ID: ${{ vars.USDCX_FAUCET_ACCOUNT_ID }}
      USDCX_RELAYER_ACCOUNT_ID: ${{ vars.USDCX_RELAYER_ACCOUNT_ID }}
      USDCX_CIRCLE_ATTESTER_PUBLIC_KEY: ${{ vars.USDCX_CIRCLE_ATTESTER_PUBLIC_KEY }}
      # Optional: a relay projectId of the counterparty's own. See e2e-bridge-in.yml.
      WC_COUNTERPARTY_PROJECT_ID: ${{ secrets.WC_COUNTERPARTY_PROJECT_ID }}
    steps:
      # The spec skips itself without this key, and a skipped spec passes the job, so a run that tested nothing
      # would read green. Fail first instead.
      - name: Require the live Arc Testnet key
        env:
          USDCX_LIVE_EVM_PRIVATE_KEY: ${{ secrets.USDCX_LIVE_EVM_PRIVATE_KEY }}
        run: |
          if [ -z "$USDCX_LIVE_EVM_PRIVATE_KEY" ]; then
            echo "::error title=USDCX_LIVE_EVM_PRIVATE_KEY is not set::Add a funded Arc Testnet key as the repository secret USDCX_LIVE_EVM_PRIVATE_KEY. Without it the spec skips and the run tests nothing."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # The four relayer steps below run only when a local relayer is configured.
      - name: Cache the USDCx deposit relayer
        if: vars.USDCX_RELAYER_ACCOUNT_ID != ''
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/xreserve-deposit-relayer
          key: usdcx-relayer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-usdcx-relayer.sh') }}

      - name: Install the USDCx deposit relayer
        if: vars.USDCX_RELAYER_ACCOUNT_ID != ''
        run: scripts/install-usdcx-relayer.sh

      # The relayer's SDK store and its progress file. A restored store only syncs
      # what changed, and a restored progress file stops the relayer from walking
      # Circle's whole feed again. Both are safe to lose: the faucet's used-nonce
      # map is the ledger. The keystore is NOT cached; it comes from the secret.
      - name: Restore the relayer state
        if: vars.USDCX_RELAYER_ACCOUNT_ID != ''
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/usdcx-relayer/store.sqlite3
            ${{ runner.temp }}/usdcx-relayer/progress.json
          key: usdcx-relayer-state-${{ github.run_id }}
          restore-keys: |
            usdcx-relayer-state-

      - name: Install the relayer keystore
        if: vars.USDCX_RELAYER_ACCOUNT_ID != ''
        shell: bash
        env:
          KEYSTORE_TGZ_B64: ${{ secrets.USDCX_RELAYER_KEYSTORE_TGZ_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_TGZ_B64" ]]; then
            echo "::error::USDCX_RELAYER_KEYSTORE_TGZ_B64 is not set"
            exit 1
          fi
          DATA_DIR="$RUNNER_TEMP/usdcx-relayer"
          mkdir -p "$DATA_DIR"
          chmod 700 "$DATA_DIR"
          printf '%s' "$KEYSTORE_TGZ_B64" | base64 --decode | tar -xzf - -C "$DATA_DIR"
          if [[ ! -d "$DATA_DIR/keystore" ]]; then
            echo "::error::the keystore archive must hold a top-level keystore/ directory"
            exit 1
          fi
          echo "USDCX_RELAYER_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      # On a dispatch from a pull request's branch these build against that pull request's linked
      # web-sdk and Guardian PRs, as its own CI does; on any other run both are no-ops.
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      # Not frozen: an injection rewrites package.json to `file:` deps the committed lockfile cannot match.
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      # The two-simulator fixture sets up the CLI for every spec, this one included.
      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli

      # CDP bridge (appium-remote-debugger) requires Simulator.app GUI running —
      # headless simctl boots don't expose webinspectord.
      - name: Launch Simulator.app
        run: open -a Simulator || true

      # idb lets the harness tap "Allow" on the native notification-permission
      # alert. Best-effort, as in e2e-bridge-in.yml.
      - name: Set up Python for idb
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install idb (dismiss native notification alert)
        continue-on-error: true
        run: |
          brew trust facebook/fb || true
          brew install facebook/fb/idb-companion
          python3 -m pip install fb-idb

      # Fresh-create + boot of custom sims hangs on macos-26 runners. Pin to
      # preinstalled Xcode sims by writing .device-pair.json before globalSetup.
      - name: Pin test pair to preinstalled simulators
        shell: bash
        run: |
          list_json=$(xcrun simctl list devices --json)
          UDID_A=$(echo "$list_json" | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) |
              .value[] | select(.name == "iPhone 17" and .isAvailable) ]
            | first | .udid // empty')
          UDID_B=$(echo "$list_json" | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) |
              .value[] | select(.name == "iPhone 17 Pro" and .isAvailable) ]
            | first | .udid // empty')
          if [[ -z "$UDID_A" || -z "$UDID_B" ]]; then
            echo "Missing preinstalled sim. A='$UDID_A'  B='$UDID_B'"
            xcrun simctl list devices
            exit 1
          fi
          mkdir -p test-results-ios
          printf '{"udidA":"%s","udidB":"%s"}\n' "$UDID_A" "$UDID_B" > test-results-ios/.device-pair.json
          echo "Wrote .device-pair.json: A=$UDID_A  B=$UDID_B"

      # Kick the cold boot off now so it overlaps the ~25-minute app build.
      - name: Pre-boot simulators (async, overlaps build)
        shell: bash
        run: |
          UDID_A=$(jq -r .udidA test-results-ios/.device-pair.json)
          UDID_B=$(jq -r .udidB test-results-ios/.device-pair.json)
          boot_with_retry() {
            local udid="$1"
            for attempt in 1 2 3 4; do
              state=$(xcrun simctl list devices | grep "$udid" | grep -o '(Booted)\|(Shutdown)\|(Booting)' || true)
              if [[ "$state" == "(Booted)" || "$state" == "(Booting)" ]]; then
                echo "$udid already $state"
                return 0
              fi
              if xcrun simctl boot "$udid"; then
                echo "$udid boot issued (attempt $attempt)"
                return 0
              fi
              echo "boot attempt $attempt for $udid failed; retrying in 20s"
              sleep 20
            done
            return 1
          }
          ensure_bootable() {
            local udid="$1"
            if boot_with_retry "$udid"; then return 0; fi
            echo "CoreSimulatorService appears wedged; restarting it"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
            sleep 15
            open -a Simulator || true
            sleep 10
            if boot_with_retry "$udid"; then return 0; fi
            echo "::error::simulator subsystem unusable on this runner (boot of $udid failed after CoreSimulatorService restart)"
            return 1
          }
          ensure_bootable "$UDID_A"
          ensure_bootable "$UDID_B"
          xcrun simctl list devices | grep -E "$UDID_A|$UDID_B" || true

      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture
        env:
          E2E_FIXTURE_PRELAUNCH_TESTNET: 'true'

      - name: Build iOS app
        # Self-heal the recurring GitHub macOS-runner SwiftPM cache corruption:
        # on a failed build, wipe the SwiftPM cache + derived data and retry once.
        run: |
          yarn test:e2e:mobile:build || {
            echo "::warning::iOS build failed; clearing SwiftPM cache (runner cache corruption) and retrying once"
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm" ios/App/build
            yarn test:e2e:mobile:build
          }

      - name: Run USDCx bridge-IN E2E (mobile, live testnets)
        # NO retries: a retry sends a second real deposit, and past the deposit leg it also burns again and Circle pays
        # out again. A failed run is read, not repeated.
        env:
          USDCX_LIVE_EVM_PRIVATE_KEY: ${{ secrets.USDCX_LIVE_EVM_PRIVATE_KEY }}
        run: yarn test:e2e:mobile:usdcx-live:run usdcx-live-deposit.ios

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdcx-live-e2e-${{ github.run_id }}
          path: test-results-ios/
          retention-days: 7
          if-no-files-found: ignore

      # Circle's fee varies with network fees and is not a gate, so each proven return burn's fee is reported here.
      - name: Add the payout fees to the job summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f test-results/usdcx-payout-fees.md ]; then
            cat test-results/usdcx-payout-fees.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # After the Arc job, red or green, never in a cancelled run: every job spends from one key, and a forwarded burn
  # names that key as the executor's recovery address on Arc, so no source chain's deposit may run inside the Arc job's
  # payout window. One job per source chain, in parallel: each reads and refills only its own chain's balance of the
  # key, whose nonce there is its own. Like the Arc job, a retry would send a second real deposit, so there is none.
  mobile-usdcx-live-executor:
    name: USDCx bridge-IN E2E from ${{ matrix.source }} (iOS, live testnets)
    needs: mobile-usdcx-live
    if: ${{ !cancelled() && inputs.legs != 'arc' }}
    strategy:
      # A failed chain must not cancel another mid-deposit: a cancelled run can leave a deposit no relayer mints.
      fail-fast: false
      matrix:
        # The executor spec's sources (L2_BRIDGE_IN_SOURCES), by the slug USDCX_LIVE_SOURCE takes; a dispatch that
        # names one runs it alone.
        source: ${{ fromJSON(inputs.legs == 'base-sepolia' && '["base-sepolia"]' || inputs.legs == 'arbitrum-sepolia' && '["arbitrum-sepolia"]' || inputs.legs == 'sepolia' && '["sepolia"]' || '["base-sepolia","arbitrum-sepolia","sepolia"]') }}
    runs-on: macos-26-xlarge
    # Per source chain: the iOS build and setup (~21 min) + a cold miden-client-cli compile (~15 min; its cache is
    # keyed on package.json) + the test (140 min worst case, the spec's own timeout) = 176, rounded up to 200.
    # A dispatch may first build a linked web-sdk PR from source (73 min on macos-26, pr-compile-surfaces.yml).
    # A `Client PR:` or `Protocol PR:` marker on that PR also rebuilds the CLI cold; the extra 85 minutes cover both.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 285 || 200 }}
    env:
      E2E_NETWORK: testnet
      # NO E2E_EVM_RPC_URL: the wallet reads the source chain and Arc through their real RPCs.
      # NO USDCX_LIVE_EVM_PRIVATE_KEY either: it is set only on the two steps that read it.
      # Optional: a relay projectId of the counterparty's own. See e2e-bridge-in.yml.
      WC_COUNTERPARTY_PROJECT_ID: ${{ secrets.WC_COUNTERPARTY_PROJECT_ID }}
    steps:
      # The spec skips itself without this key, and a skipped spec passes the job. Fail first instead.
      - name: Require the live deposit key
        env:
          USDCX_LIVE_EVM_PRIVATE_KEY: ${{ secrets.USDCX_LIVE_EVM_PRIVATE_KEY }}
        run: |
          if [ -z "$USDCX_LIVE_EVM_PRIVATE_KEY" ]; then
            echo "::error title=USDCX_LIVE_EVM_PRIVATE_KEY is not set::Add the funded deposit key as the repository secret USDCX_LIVE_EVM_PRIVATE_KEY. Without it the spec skips and the run tests nothing."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      # On a dispatch from a pull request's branch these build against that pull request's linked
      # web-sdk and Guardian PRs, as its own CI does; on any other run both are no-ops.
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      # Not frozen: an injection rewrites package.json to `file:` deps the committed lockfile cannot match.
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      # The two-simulator fixture sets up the CLI for every spec, this one included.
      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli

      # CDP bridge (appium-remote-debugger) requires Simulator.app GUI running.
      - name: Launch Simulator.app
        run: open -a Simulator || true

      # idb lets the harness tap "Allow" on the native notification-permission alert. Best-effort.
      - name: Set up Python for idb
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install idb (dismiss native notification alert)
        continue-on-error: true
        run: |
          brew trust facebook/fb || true
          brew install facebook/fb/idb-companion
          python3 -m pip install fb-idb

      # Fresh-create + boot of custom sims hangs on macos-26 runners. Pin to
      # preinstalled Xcode sims by writing .device-pair.json before globalSetup.
      - name: Pin test pair to preinstalled simulators
        shell: bash
        run: |
          list_json=$(xcrun simctl list devices --json)
          UDID_A=$(echo "$list_json" | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) |
              .value[] | select(.name == "iPhone 17" and .isAvailable) ]
            | first | .udid // empty')
          UDID_B=$(echo "$list_json" | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) |
              .value[] | select(.name == "iPhone 17 Pro" and .isAvailable) ]
            | first | .udid // empty')
          if [[ -z "$UDID_A" || -z "$UDID_B" ]]; then
            echo "Missing preinstalled sim. A='$UDID_A'  B='$UDID_B'"
            xcrun simctl list devices
            exit 1
          fi
          mkdir -p test-results-ios
          printf '{"udidA":"%s","udidB":"%s"}\n' "$UDID_A" "$UDID_B" > test-results-ios/.device-pair.json
          echo "Wrote .device-pair.json: A=$UDID_A  B=$UDID_B"

      # Kick the cold boot off now so it overlaps the ~25-minute app build.
      - name: Pre-boot simulators (async, overlaps build)
        shell: bash
        run: |
          UDID_A=$(jq -r .udidA test-results-ios/.device-pair.json)
          UDID_B=$(jq -r .udidB test-results-ios/.device-pair.json)
          boot_with_retry() {
            local udid="$1"
            for attempt in 1 2 3 4; do
              state=$(xcrun simctl list devices | grep "$udid" | grep -o '(Booted)\|(Shutdown)\|(Booting)' || true)
              if [[ "$state" == "(Booted)" || "$state" == "(Booting)" ]]; then
                echo "$udid already $state"
                return 0
              fi
              if xcrun simctl boot "$udid"; then
                echo "$udid boot issued (attempt $attempt)"
                return 0
              fi
              echo "boot attempt $attempt for $udid failed; retrying in 20s"
              sleep 20
            done
            return 1
          }
          ensure_bootable() {
            local udid="$1"
            if boot_with_retry "$udid"; then return 0; fi
            echo "CoreSimulatorService appears wedged; restarting it"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
            sleep 15
            open -a Simulator || true
            sleep 10
            if boot_with_retry "$udid"; then return 0; fi
            echo "::error::simulator subsystem unusable on this runner (boot of $udid failed after CoreSimulatorService restart)"
            return 1
          }
          ensure_bootable "$UDID_A"
          ensure_bootable "$UDID_B"
          xcrun simctl list devices | grep -E "$UDID_A|$UDID_B" || true

      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture
        env:
          E2E_FIXTURE_PRELAUNCH_TESTNET: 'true'

      - name: Build iOS app
        # Self-heal the recurring GitHub macOS-runner SwiftPM cache corruption:
        # on a failed build, wipe the SwiftPM cache + derived data and retry once.
        run: |
          yarn test:e2e:mobile:build || {
            echo "::warning::iOS build failed; clearing SwiftPM cache (runner cache corruption) and retrying once"
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm" ios/App/build
            yarn test:e2e:mobile:build
          }

      - name: Run USDCx bridge-IN E2E from a source chain (mobile, live testnets)
        # NO retries: a retry sends a second real deposit, and past the deposit leg it also burns again.
        env:
          USDCX_LIVE_EVM_PRIVATE_KEY: ${{ secrets.USDCX_LIVE_EVM_PRIVATE_KEY }}
          # The spec defines this source chain's test alone; a slug that names none fails the file.
          USDCX_LIVE_SOURCE: ${{ matrix.source }}
        run: yarn test:e2e:mobile:usdcx-live:run usdcx-live-executor-deposit.ios

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdcx-live-executor-e2e-${{ matrix.source }}-${{ github.run_id }}
          path: test-results-ios/
          retention-days: 7
          if-no-files-found: ignore

      # Circle's fee varies with network fees and is not a gate, so each proven return burn's fee is reported here.
      - name: Add the payout fees to the job summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f test-results/usdcx-payout-fees.md ]; then
            cat test-results/usdcx-payout-fees.md >> "$GITHUB_STEP_SUMMARY"
          fi

name: NEVER-MERGE 1589 native terminal positive
on:
  push:
    branches: [ci/1589-native-terminal-positive]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_OPTIONAL_LOCKS: '0'
      CI: 'true'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Bind frozen fixed source and transport
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/1589-native-terminal-positive"
          test ! -e "$proof"
          mkdir "$proof"
          echo "PROOF_DIR=$proof" >> "$GITHUB_ENV"
          cp .github/ci/1589-native-terminal-positive.py "$proof/snapshot.py"
          cp .github/ci/1589-native-terminal-positive.json "$proof/contract.json"
          cat > "$proof/run.bash" <<'BASH'
          run_logged() {
            local label="$1" stem="$2"
            shift 2
            local out="$PROOF_DIR/raw-results/$label"
            mkdir -p "$out"
            printf '%s\0' "$@" > "$out/$stem.argv"
            set +e
            "$@" 2>&1 | tee "$out/$stem.log"
            local codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${codes[0]}" > "$out/$stem.exit"
            printf '%s\n' "${codes[1]}" > "$out/$stem.tee.exit"
            if [ "${codes[1]}" -ne 0 ]; then return "${codes[1]}"; fi
            return "${codes[0]}"
          }
          BASH
          PROOF_DIR="$proof" python3 "$proof/snapshot.py" transport
          git checkout --detach '90f135706f73399008a11bbc9a670ec5086693c9'
          PROOF_DIR="$proof" python3 "$proof/snapshot.py" snapshot initial fixed
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run.bash"
          if run_logged prerequisites corepack-enable corepack enable; then :; else exit "$?"; fi
          if run_logged prerequisites corepack-prepare corepack prepare yarn@1.22.22 --activate; then :; else exit "$?"; fi
          if run_logged prerequisites node node --version; then :; else exit "$?"; fi
          if run_logged prerequisites yarn yarn --version; then :; else exit "$?"; fi
          if run_logged prerequisites install yarn install --frozen-lockfile --network-timeout 600000; then :; else exit "$?"; fi
      - name: Check named files and the candidate package
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run.bash"
          paths=(packages/bread-connect-capacitor/src/native-opener.ts packages/bread-connect-capacitor/src/transport.ts packages/bread-connect-capacitor/src/index.ts packages/bread-connect-capacitor/src/transport.test.ts)
          if run_logged prerequisites format yarn prettier --check "${paths[@]}"; then :; else exit "$?"; fi
          if run_logged prerequisites lint yarn eslint "${paths[@]}"; then :; else exit "$?"; fi
          if run_logged prerequisites typescript yarn tsc --noEmit --project packages/bread-connect-capacitor/tsconfig.json; then :; else exit "$?"; fi
          python3 "$PROOF_DIR/snapshot.py" snapshot fixed-prerequisites fixed
      - name: Positive full72 cases
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run.bash"
          python3 "$PROOF_DIR/snapshot.py" snapshot positive-before fixed
          if run_logged positive jest yarn jest --runTestsByPath packages/bread-connect-capacitor/src/index.test.ts packages/bread-connect-capacitor/src/transport.test.ts packages/bread-connect-capacitor/src/wallet.test.ts packages/bread-connect-capacitor/src/native-opener.test.ts --maxWorkers=2 --coverage=false --watch=false --json --outputFile="$PROOF_DIR/raw-results/positive/jest.json"; then :; else :; fi
          python3 "$PROOF_DIR/snapshot.py" snapshot positive-after fixed
          python3 "$PROOF_DIR/snapshot.py" classify positive
      - name: Retirement-assignment omission full72 cases
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run.bash"
          python3 "$PROOF_DIR/snapshot.py" mutate
          python3 "$PROOF_DIR/snapshot.py" snapshot omission-before omission
          if run_logged omission jest yarn jest --runTestsByPath packages/bread-connect-capacitor/src/index.test.ts packages/bread-connect-capacitor/src/transport.test.ts packages/bread-connect-capacitor/src/wallet.test.ts packages/bread-connect-capacitor/src/native-opener.test.ts --maxWorkers=2 --coverage=false --watch=false --json --outputFile="$PROOF_DIR/raw-results/omission/jest.json"; then :; else :; fi
          python3 "$PROOF_DIR/snapshot.py" snapshot omission-after omission
          python3 "$PROOF_DIR/snapshot.py" classify omission
      - name: Restored full72 cases
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run.bash"
          python3 "$PROOF_DIR/snapshot.py" restore
          python3 "$PROOF_DIR/snapshot.py" snapshot restored-before fixed
          if run_logged restored jest yarn jest --runTestsByPath packages/bread-connect-capacitor/src/index.test.ts packages/bread-connect-capacitor/src/transport.test.ts packages/bread-connect-capacitor/src/wallet.test.ts packages/bread-connect-capacitor/src/native-opener.test.ts --maxWorkers=2 --coverage=false --watch=false --json --outputFile="$PROOF_DIR/raw-results/restored/jest.json"; then :; else :; fi
          python3 "$PROOF_DIR/snapshot.py" snapshot restored-after fixed
          python3 "$PROOF_DIR/snapshot.py" classify restored
      - name: Always restore exact signed source and preserve bookends
        if: always()
        run: |
          set -euo pipefail
          python3 "$PROOF_DIR/snapshot.py" finalize
      - name: Seal raw producer payloads
        if: always()
        run: |
          set -euo pipefail
          python3 "$PROOF_DIR/snapshot.py" seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1589-native-terminal-positive
          path: ${{ env.PROOF_DIR }}/
          include-hidden-files: true
          if-no-files-found: error

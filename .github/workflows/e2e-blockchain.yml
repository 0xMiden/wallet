name: E2E Blockchain

# Runs the blockchain-backed E2E suites (Chrome extension + iOS simulator)
# against the public network that matches the BRANCH'S PROTOCOL LINE.
#
#   push to main  ->  testnet   (main is on @miden-sdk/miden-sdk 0.15.x)
#   push to next  ->  devnet    (next is on 0.16.0-rc.x)
#
# Devnet and testnet run different protocol versions, so a wallet built for one
# genuinely cannot pass against the other. This used to be handled by running
# BOTH on every main push, marking devnet `continue-on-error`, and having each
# per-platform gate pass if EITHER network succeeded.
#
# That gate could not fail for the case it mattered most: a real testnet
# regression on main was masked by devnet passing. "At least one network passed"
# is not the property anyone wants — the property is "the network this branch
# targets passed".
#
# Measured, not asserted: over the last 14 pushes to main, `Chrome Guardian E2E
# (testnet)` concluded failure 7 times, success once, and was cancelled 3 times —
# while the Chrome Guardian gate reported green throughout, because devnet passed
# alongside it. That is not academic: it hid a real guardian rotation bug on main
# for at least three consecutive runs.
#
# Splitting by branch gives each line a hard gate. Nothing is `continue-on-error`
# any more: on main a testnet failure is fatal, and on next a devnet failure is
# fatal, because in each case that network IS the branch's line. GitHub runs the
# workflow file from the PUSHED ref, so `next` carries its own copy of the split
# (#678) alongside main's (#676) — otherwise devnet would never run here at all.
#
# `workflow_dispatch` still takes a network argument for ad-hoc runs, so either
# network can be exercised from either branch by hand.
#
# KNOWN (#797): ALL FOUR devnet suites are QUARANTINED. Devnet's 2026-08-27
# re-genesis (node v0.16.0-rc.2) enabled transaction fees, and no released
# tooling can transact against it: fee conversion info is opt-in on the client
# and neither the CLI (the harness cannot create its test faucet), the web-sdk
# (wallet sends), nor the multisig-client (guardian transactions) thread it
# yet. The devnet jobs skip their push arm and every gate carves the resulting
# neither-ran shape out explicitly, so the gap is loud in the gate logs rather
# than a permanently red branch nobody reads. workflow_dispatch still runs the
# suites; closing #797 reverts all eight spots (4 jobs + 4 gates).

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:
    inputs:
      network:
        # Defaults to this branch's line (devnet); flips to testnet when `next`
        # becomes main. NOT 'both': the gates now require every network that ran
        # to pass, and a wallet built for one protocol line cannot pass against
        # the other — so a 'both' default would fail by construction.
        description: 'Network to test against'
        required: false
        default: 'devnet'
        type: choice
        options:
          # No 'both': the gates require every network that ran to succeed, and a
          # wallet built for one protocol line cannot pass against the other, so
          # 'both' is unpassable by construction rather than merely slow.
          - devnet
          - testnet

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Chrome ---------------------------------------------------------------

  chrome-devnet:
    name: Chrome E2E (devnet)
    # QUARANTINED on push (#797): devnet's 2026-08-27 re-genesis enabled
    # transaction fees, and NO released tooling can transact against it — the
    # harness CLI cannot even create the test faucet (fee conversion info is
    # opt-in on the client and the CLI/web-sdk do not thread it yet). The gate
    # below knows. workflow_dispatch still runs it; closing #797 reverts.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && (inputs.network == 'both' || inputs.network == 'devnet') }}
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 60
    env:
      E2E_NETWORK: devnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cargo is needed to install miden-client-cli from crates.io on first run.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        # Cache key follows the root package.json so a SDK version bump
        # (or any other root-level dep change) naturally invalidates — the
        # CLI is installed version-matched to @miden-sdk/miden-sdk by
        # helpers/miden-cli.ts.
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Pre-install the miden-client-cli so the cold-cache ~7 min cargo
      # compile happens in its own step, not inside Playwright's 5-min
      # per-test timeout. `cargo install` is a no-op on warm cache.
      - name: Install miden-client-cli
        # Reads the CLI pin (midenClientCliGit, else midenClientCliVersion) from
        # package.json — the same resolution playwright/e2e/helpers/miden-cli.ts does —
        # and skips the ~7 min compile when the cache above already restored the binary.
        # It also rebuilds the CLI against a linked Protocol PR when the PR carries one;
        # no marker (as here) means the published pin, exactly as before.
        uses: ./.github/actions/install-miden-client-cli

      - name: Install xvfb
        # The azure apt mirror intermittently blackholes: runs have stalled ~57 min
        # inside `apt-get update`, been killed by the job cap, and produced no test
        # results. Prefer the canonical mirror, bound + retry fetches, cap the step.
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Run blockchain E2E (devnet)
        id: e2e
        # Fatal, deliberately. This job only runs on `next`, whose SDK line IS
        # devnet's — so a failure here is a real failure of the branch, not the
        # protocol mismatch that made this non-fatal when it also ran on main.
        run: xvfb-run -a yarn test:e2e:blockchain:devnet

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-e2e-devnet-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  chrome-testnet:
    name: Chrome E2E (testnet)
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && (inputs.network == 'both' || inputs.network == 'testnet')) }}
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 60
    env:
      E2E_NETWORK: testnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install miden-client-cli
        # Reads the CLI pin (midenClientCliGit, else midenClientCliVersion) from
        # package.json — the same resolution playwright/e2e/helpers/miden-cli.ts does —
        # and skips the ~7 min compile when the cache above already restored the binary.
        # It also rebuilds the CLI against a linked Protocol PR when the PR carries one;
        # no marker (as here) means the published pin, exactly as before.
        uses: ./.github/actions/install-miden-client-cli

      - name: Install xvfb
        # The azure apt mirror intermittently blackholes: runs have stalled ~57 min
        # inside `apt-get update`, been killed by the job cap, and produced no test
        # results. Prefer the canonical mirror, bound + retry fetches, cap the step.
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Run blockchain E2E (testnet)
        run: xvfb-run -a yarn test:e2e:blockchain:testnet

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-e2e-testnet-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  chrome-gate:
    name: Chrome E2E Gate
    needs: [chrome-devnet, chrome-testnet]
    # `!cancelled()` rather than `always()`: the concurrency group supersedes
    # in-progress runs constantly, and the whitelist below correctly treats a
    # cancelled network as not-a-pass. Combined with `always()` that would paint a
    # red gate on every superseded run — noise that trains people to ignore it. A
    # cancelled run should report cancelled, not failed; a genuinely failed job
    # still runs this gate and still fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the branch's network to pass
        shell: bash
        env:
          DEVNET_RESULT: ${{ needs.chrome-devnet.result }}
          TESTNET_RESULT: ${{ needs.chrome-testnet.result }}
        run: |
          echo "devnet=$DEVNET_RESULT  testnet=$TESTNET_RESULT"
          # WHITELIST, not blacklist. `needs.<job>.result` is one of
          # success/failure/cancelled/skipped, and `cancelled` is routine here
          # because the concurrency group cancels in-progress runs. An earlier
          # version of this gate failed only on "failure", so a cancelled suite
          # reported GREEN — the identical hole this split exists to close.
          # Exactly one network runs per push (devnet on next, testnet on main);
          # the other is skipped. So: require that the one which ran SUCCEEDED.
          ran=0
          for result in "$DEVNET_RESULT" "$TESTNET_RESULT"; do
            if [[ "$result" != "skipped" ]]; then
              ran=$((ran + 1))
              if [[ "$result" != "success" ]]; then
                echo "Chrome E2E: the network for this branch did not pass (result=$result)."
                exit 1
              fi
            fi
          done
          if [[ "$ran" -eq 0 ]]; then
            # QUARANTINE CARVE-OUT (#797): on next the devnet suite skips its
            # push arm until released tooling can transact on the fee-enabled
            # devnet. Flip to false when closing #797.
            DEVNET_QUARANTINED=true
            if [[ "$DEVNET_QUARANTINED" == "true" ]]; then
              echo "Chrome E2E: devnet suite is QUARANTINED (#797) — passing without it. This is a"
              echo "known coverage gap on next, not a green suite."
              exit 0
            fi
            echo "Chrome E2E: neither network ran — check the branch gating on the jobs."
            exit 1
          fi
          echo "Chrome E2E: passed."

  # --- Guardian (Chrome, against OZ's hosted guardian) ----------------------
  # The published ghcr guardian image is ABI-incompatible with the multisig
  # client the wallet ships, so these jobs run against OZ's hosted guardian
  # endpoints rather than a locally-spawned container.
  #
  # TESTNET GUARDIAN WORKS. An earlier version of this comment claimed the
  # opposite — that testnet was "expected red until testnet upgrades" — and that
  # was wrong. It mattered: paired with a gate that passed if EITHER network
  # succeeded, it turned real testnet guardian failures on main into something
  # the workflow described as normal. Over the last 14 pushes to main this job
  # concluded failure 7 times against 1 success, and the gate stayed green.
  #
  # The direction of the version risk is the other way round: DEVNET guardian is
  # the one expected to break, until guardian packages are published for the
  # 0.16 line this branch targets — see the KNOWN note at the top of this file.

  chrome-guardian-devnet:
    name: Chrome Guardian E2E (devnet)
    # QUARANTINED on push (#797): devnet runs a fee-enabled genesis since
    # 2026-08-27, and every guardian transaction aborts locally until the
    # multisig-client fee release ships — the suite cannot pass, so the push
    # arm is removed rather than left red. The guardian gate below knows
    # (GUARDIAN_DEVNET_QUARANTINED). workflow_dispatch still runs it, which is
    # how the un-quarantine gets verified when closing #797.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && (inputs.network == 'both' || inputs.network == 'devnet') }}
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 60
    env:
      E2E_NETWORK: devnet
      GUARDIAN_URL: https://guardian-stg.openzeppelin.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install miden-client-cli
        # Reads the CLI pin (midenClientCliGit, else midenClientCliVersion) from
        # package.json — the same resolution playwright/e2e/helpers/miden-cli.ts does —
        # and skips the ~7 min compile when the cache above already restored the binary.
        # It also rebuilds the CLI against a linked Protocol PR when the PR carries one;
        # no marker (as here) means the published pin, exactly as before.
        uses: ./.github/actions/install-miden-client-cli

      - name: Install xvfb
        # The azure apt mirror intermittently blackholes: runs have stalled ~57 min
        # inside `apt-get update`, been killed by the job cap, and produced no test
        # results. Prefer the canonical mirror, bound + retry fetches, cap the step.
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Build Chrome extension (devnet)
        run: yarn test:e2e:blockchain:build

      - name: Run Guardian E2E (devnet)
        id: e2e
        # Fatal, deliberately. This job only runs on `next`, whose SDK line IS
        # devnet's — so a failure here is a real failure of the branch, not the
        # protocol mismatch that made this non-fatal when it also ran on main.
        run: xvfb-run -a yarn test:e2e:guardian:run

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-guardian-e2e-devnet-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  chrome-guardian-testnet:
    name: Chrome Guardian E2E (testnet)
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && (inputs.network == 'both' || inputs.network == 'testnet')) }}
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 60
    env:
      E2E_NETWORK: testnet
      GUARDIAN_URL: https://guardian.openzeppelin.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install miden-client-cli
        # Reads the CLI pin (midenClientCliGit, else midenClientCliVersion) from
        # package.json — the same resolution playwright/e2e/helpers/miden-cli.ts does —
        # and skips the ~7 min compile when the cache above already restored the binary.
        # It also rebuilds the CLI against a linked Protocol PR when the PR carries one;
        # no marker (as here) means the published pin, exactly as before.
        uses: ./.github/actions/install-miden-client-cli

      - name: Install xvfb
        # The azure apt mirror intermittently blackholes: runs have stalled ~57 min
        # inside `apt-get update`, been killed by the job cap, and produced no test
        # results. Prefer the canonical mirror, bound + retry fetches, cap the step.
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Build Chrome extension (testnet)
        run: yarn test:e2e:blockchain:build

      - name: Run Guardian E2E (testnet)
        run: xvfb-run -a yarn test:e2e:guardian:run

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-guardian-e2e-testnet-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  chrome-guardian-gate:
    name: Chrome Guardian E2E Gate
    needs: [chrome-guardian-devnet, chrome-guardian-testnet]
    # `!cancelled()` rather than `always()`: the concurrency group supersedes
    # in-progress runs constantly, and the whitelist below correctly treats a
    # cancelled network as not-a-pass. Combined with `always()` that would paint a
    # red gate on every superseded run — noise that trains people to ignore it. A
    # cancelled run should report cancelled, not failed; a genuinely failed job
    # still runs this gate and still fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the branch's network to pass
        shell: bash
        env:
          DEVNET_RESULT: ${{ needs.chrome-guardian-devnet.result }}
          TESTNET_RESULT: ${{ needs.chrome-guardian-testnet.result }}
        run: |
          echo "devnet=$DEVNET_RESULT  testnet=$TESTNET_RESULT"
          # WHITELIST, not blacklist. `needs.<job>.result` is one of
          # success/failure/cancelled/skipped, and `cancelled` is routine here
          # because the concurrency group cancels in-progress runs. An earlier
          # version of this gate failed only on "failure", so a cancelled suite
          # reported GREEN — the identical hole this split exists to close.
          # Exactly one network runs per push (devnet on next, testnet on main);
          # the other is skipped. So: require that the one which ran SUCCEEDED.
          ran=0
          for result in "$DEVNET_RESULT" "$TESTNET_RESULT"; do
            if [[ "$result" != "skipped" ]]; then
              ran=$((ran + 1))
              if [[ "$result" != "success" ]]; then
                echo "Chrome Guardian E2E: the network for this branch did not pass (result=$result)."
                exit 1
              fi
            fi
          done
          if [[ "$ran" -eq 0 ]]; then
            # QUARANTINE CARVE-OUT (#797). On next, devnet guardian is skipped by
            # the job's own `if` until the multisig-client fee release; with
            # testnet also skipped (main's network), zero networks ran and that is
            # the EXPECTED shape, not a branch-gating bug. Flip this to false when
            # closing #797 so "neither ran" goes back to meaning a real bug.
            GUARDIAN_DEVNET_QUARANTINED=true
            if [[ "$GUARDIAN_DEVNET_QUARANTINED" == "true" ]]; then
              echo "Chrome Guardian E2E: devnet suite is QUARANTINED (#797) — passing without it. This is a"
              echo "known coverage gap on next, not a green guardian suite."
              exit 0
            fi
            echo "Chrome Guardian E2E: neither network ran — check the branch gating on the jobs."
            exit 1
          fi
          echo "Chrome Guardian E2E: passed."

  # --- iOS Simulator --------------------------------------------------------

  mobile-devnet:
    name: Mobile E2E (devnet)
    # QUARANTINED on push (#797) — same reason and exit criteria as
    # chrome-devnet above.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && (inputs.network == 'both' || inputs.network == 'devnet') }}
    # macos-26 matches build-mobile.yml — required for iOS 26 SDK symbols
    # used by dapp-browser's WKWebViewController. The -xlarge size is the
    # DEDICATED Apple-Silicon larger runner (2x vCPU/RAM, no noisy-neighbour
    # IO contention) — the shared standard macos-26 runners were intermittently
    # degraded for hours at a time, with CoreSimulator install/launch crawling
    # so badly that two-sim `_simPair` setup couldn't finish even in 13-15 min.
    runs-on: macos-26-xlarge
    # Observed worst case: ~40 min setup (CLI compile on cache miss + iOS
    # build + simulator cold boot overlap) + ~55 min suite with one retry.
    # 90 minutes guillotined an otherwise-passing run at test 7 of 7.
    timeout-minutes: 130
    env:
      E2E_NETWORK: devnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install miden-client-cli
        # Reads the CLI pin (midenClientCliGit, else midenClientCliVersion) from
        # package.json — the same resolution playwright/e2e/helpers/miden-cli.ts does —
        # and skips the ~7 min compile when the cache above already restored the binary.
        # It also rebuilds the CLI against a linked Protocol PR when the PR carries one;
        # no marker (as here) means the published pin, exactly as before.
        uses: ./.github/actions/install-miden-client-cli

      # CDP bridge (appium-remote-debugger) requires Simulator.app GUI to be
      # running — headless simctl boots don't expose webinspectord. Ignore
      # exit status because `open -a` returns 0 even if already open.
      - name: Launch Simulator.app
        run: open -a Simulator || true

      # idb (Facebook's iOS debug bridge) lets the harness tap "Allow" on the
      # native notification-permission SpringBoard alert, which lives outside the
      # WebView (CDP can't reach it) and otherwise covers every screenshot.
      # Best-effort: the harness degrades gracefully when idb is absent, so a
      # broken install must never fail the job.
      #
      # fb-idb (1.1.7, unmaintained) calls asyncio.get_event_loop(), which
      # Python 3.14 — the runner's default python3 — removed, crashing idb. Pin
      # 3.11 for it; nothing else in this job uses python3 (build is node +
      # xcodebuild). `brew trust ... || true` because older-Homebrew runners have
      # no `trust` subcommand (and `brew install` auto-taps anyway).
      - name: Set up Python for idb
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install idb (dismiss native notification alert)
        continue-on-error: true
        run: |
          brew trust facebook/fb || true
          brew install facebook/fb/idb-companion
          python3 -m pip install fb-idb

      # Fresh-create + boot of custom simulators hangs multi-minute then
      # errors on macos-26 runners. Pin the test harness to preinstalled
      # Xcode sims by writing .device-pair.json before globalSetup reads it.
      - name: Pin test pair to preinstalled simulators
        shell: bash
        run: |
          list_json=$(xcrun simctl list devices --json)
          UDID_A=$(echo "$list_json" | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) |
              .value[] | select(.name == "iPhone 17" and .isAvailable) ]
            | first | .udid // empty')
          UDID_B=$(echo "$list_json" | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) |
              .value[] | select(.name == "iPhone 17 Pro" and .isAvailable) ]
            | first | .udid // empty')
          if [[ -z "$UDID_A" || -z "$UDID_B" ]]; then
            echo "Missing preinstalled sim. A='$UDID_A'  B='$UDID_B'"
            echo "Full device list:"
            xcrun simctl list devices
            exit 1
          fi
          mkdir -p test-results-ios

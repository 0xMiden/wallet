name: E2E Blockchain

# Runs the blockchain-backed E2E suites (Chrome extension + iOS simulator)
# against public networks on every push to main. The per-platform gate jobs
# pass as long as AT LEAST ONE network (devnet OR testnet) succeeded for
# that platform — this tolerates short windows where wallet@main and a
# single network are protocol-mismatched (e.g. devnet ahead of the pinned
# SDK version).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      network:
        description: 'Network(s) to test against'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - devnet
          - testnet

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Chrome ---------------------------------------------------------------

  chrome-devnet:
    name: Chrome E2E (devnet)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'both' || inputs.network == 'devnet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_NETWORK: devnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # cargo is needed to install miden-client-cli from crates.io on first run.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        # Cache key follows the root package.json so a SDK version bump
        # (or any other root-level dep change) naturally invalidates — the
        # CLI is installed version-matched to @miden-sdk/miden-sdk by
        # helpers/miden-cli.ts.
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Pre-install the miden-client-cli so the cold-cache ~7 min cargo
      # compile happens in its own step, not inside Playwright's 5-min
      # per-test timeout. `cargo install` is a no-op on warm cache.
      - name: Install miden-client-cli
        shell: bash
        run: |
          # Decoupled from the JS SDK version — read the CLI pin from
          # package.json. `midenClientCliGit` ({url, rev}) takes precedence
          # over `midenClientCliVersion` and is used while the target
          # miden-client line is unreleased on crates.io (the 0.15 series
          # ships from the repo's `next` branch only). See
          # playwright/e2e/helpers/miden-cli.ts for the matching local-dev
          # path.
          GIT_URL=$(node -p "require('./package.json').midenClientCliGit?.url ?? ''")
          GIT_REV=$(node -p "require('./package.json').midenClientCliGit?.rev ?? ''")
          VERSION=$(node -p "require('./package.json').midenClientCliVersion")
          if [[ -z "$GIT_URL" && (-z "$VERSION" || "$VERSION" == "undefined") ]]; then
            echo "::error::neither midenClientCliGit nor midenClientCliVersion present in package.json"
            exit 1
          fi
          if [[ -x "$HOME/.cargo/bin/miden-client" ]]; then
            echo "miden-client already present from cache:"
            "$HOME/.cargo/bin/miden-client" --version || true
          elif [[ -n "$GIT_URL" ]]; then
            echo "Installing miden-client-cli from ${GIT_URL}@${GIT_REV:0:8}..."
            cargo install miden-client-cli --git "$GIT_URL" --rev "$GIT_REV" --locked
          else
            echo "Installing miden-client-cli@${VERSION}..."
            cargo install miden-client-cli --version "$VERSION"
          fi

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run blockchain E2E (devnet)
        run: xvfb-run -a yarn test:e2e:blockchain:devnet

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-e2e-devnet-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  chrome-testnet:
    name: Chrome E2E (testnet)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'both' || inputs.network == 'testnet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_NETWORK: testnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install miden-client-cli
        shell: bash
        run: |
          # Decoupled from the JS SDK version — read the CLI pin from
          # package.json. `midenClientCliGit` ({url, rev}) takes precedence
          # over `midenClientCliVersion` and is used while the target
          # miden-client line is unreleased on crates.io (the 0.15 series
          # ships from the repo's `next` branch only). See
          # playwright/e2e/helpers/miden-cli.ts for the matching local-dev
          # path.
          GIT_URL=$(node -p "require('./package.json').midenClientCliGit?.url ?? ''")
          GIT_REV=$(node -p "require('./package.json').midenClientCliGit?.rev ?? ''")
          VERSION=$(node -p "require('./package.json').midenClientCliVersion")
          if [[ -z "$GIT_URL" && (-z "$VERSION" || "$VERSION" == "undefined") ]]; then
            echo "::error::neither midenClientCliGit nor midenClientCliVersion present in package.json"
            exit 1
          fi
          if [[ -x "$HOME/.cargo/bin/miden-client" ]]; then
            echo "miden-client already present from cache:"
            "$HOME/.cargo/bin/miden-client" --version || true
          elif [[ -n "$GIT_URL" ]]; then
            echo "Installing miden-client-cli from ${GIT_URL}@${GIT_REV:0:8}..."
            cargo install miden-client-cli --git "$GIT_URL" --rev "$GIT_REV" --locked
          else
            echo "Installing miden-client-cli@${VERSION}..."
            cargo install miden-client-cli --version "$VERSION"
          fi

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run blockchain E2E (testnet)
        run: xvfb-run -a yarn test:e2e:blockchain:testnet

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-e2e-testnet-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  chrome-gate:
    name: Chrome E2E Gate
    needs: [chrome-devnet, chrome-testnet]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one network to pass
        shell: bash
        env:
          DEVNET_RESULT: ${{ needs.chrome-devnet.result }}
          TESTNET_RESULT: ${{ needs.chrome-testnet.result }}
        run: |
          echo "devnet=$DEVNET_RESULT  testnet=$TESTNET_RESULT"
          if [[ "$DEVNET_RESULT" == "success" || "$TESTNET_RESULT" == "success" ]]; then
            echo "Chrome E2E: at least one network passed."
            exit 0
          fi
          echo "Chrome E2E: both networks failed or were skipped."
          exit 1

  # --- Guardian (Chrome, devnet + testnet against OZ's hosted guardian) ------
  # The published ghcr guardian image is 0.14.x and ABI-incompatible with the
  # 0.15 multisig client the wallet ships, so these jobs run against OZ's hosted
  # guardian endpoints instead of a locally-spawned container. Devnet
  # (guardian-stg, the 0.15 server) is expected green; testnet
  # (guardian.openzeppelin.com, still the 0.14 server) is expected red until
  # testnet upgrades — mirroring the non-guardian devnet/testnet split. The gate
  # below passes as long as at least one network succeeds.

  chrome-guardian-devnet:
    name: Chrome Guardian E2E (devnet)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'both' || inputs.network == 'devnet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_NETWORK: devnet
      GUARDIAN_URL: https://guardian-stg.openzeppelin.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install miden-client-cli
        shell: bash
        run: |
          GIT_URL=$(node -p "require('./package.json').midenClientCliGit?.url ?? ''")
          GIT_REV=$(node -p "require('./package.json').midenClientCliGit?.rev ?? ''")
          VERSION=$(node -p "require('./package.json').midenClientCliVersion")
          if [[ -z "$GIT_URL" && (-z "$VERSION" || "$VERSION" == "undefined") ]]; then
            echo "::error::neither midenClientCliGit nor midenClientCliVersion present in package.json"
            exit 1
          fi
          if [[ -x "$HOME/.cargo/bin/miden-client" ]]; then
            echo "miden-client already present from cache:"
            "$HOME/.cargo/bin/miden-client" --version || true
          elif [[ -n "$GIT_URL" ]]; then
            echo "Installing miden-client-cli from ${GIT_URL}@${GIT_REV:0:8}..."
            cargo install miden-client-cli --git "$GIT_URL" --rev "$GIT_REV" --locked
          else
            echo "Installing miden-client-cli@${VERSION}..."
            cargo install miden-client-cli --version "$VERSION"
          fi

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Chrome extension (devnet)
        run: yarn test:e2e:blockchain:build

      - name: Run Guardian E2E (devnet)
        run: xvfb-run -a yarn test:e2e:guardian:run

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-guardian-e2e-devnet-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  chrome-guardian-testnet:
    name: Chrome Guardian E2E (testnet)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'both' || inputs.network == 'testnet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_NETWORK: testnet
      GUARDIAN_URL: https://guardian.openzeppelin.com
    steps:

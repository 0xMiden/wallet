            local udid="$1"
            for attempt in 1 2 3 4; do
              state=$(xcrun simctl list devices | grep "$udid" | grep -o '(Booted)\|(Shutdown)\|(Booting)' || true)
              if [[ "$state" == "(Booted)" || "$state" == "(Booting)" ]]; then
                echo "$udid already $state"
                return 0
              fi

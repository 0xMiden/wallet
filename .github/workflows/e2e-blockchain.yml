name: E2E Blockchain

# Runs the blockchain-backed E2E suites (Chrome extension + iOS simulator)
# against the public network that matches the BRANCH'S PROTOCOL LINE.
#
#   main  ->  testnet   (main is on @miden-sdk/miden-sdk 0.15.x)
#   next  ->  devnet    (next is on 0.16.0-rc.x)
#
# Nothing runs it on push. Release E2E (release-e2e.yml) dispatches it nightly
# and on each release with network=testnet, and Next E2E (devnet)
# (next-e2e-devnet.yml) dispatches next's own copy nightly with network=devnet.
# The `push` arms of the job gates below are inert until a push trigger returns.
#
# Devnet and testnet run different protocol versions, so a wallet built for one
# genuinely cannot pass against the other. This used to be handled by running
# BOTH on every main push, marking devnet `continue-on-error`, and having each
# per-platform gate pass if EITHER network succeeded.
#
# That gate could not fail for the case it mattered most: a real testnet
# regression on main was masked by devnet passing. "At least one network passed"
# is not the property anyone wants — the property is "the network this branch
# targets passed".
#
# Measured, not asserted: over the last 14 pushes to main, `Chrome Guardian E2E
# (testnet)` concluded failure 7 times, success once, and was cancelled 3 times —
# while the Chrome Guardian gate reported green throughout, because devnet passed
# alongside it. That is not academic: it hid a real guardian rotation bug on main
# for at least three consecutive runs.
#
# Splitting by branch gives each line a hard gate. Nothing is `continue-on-error`
# any more: on main a testnet failure is fatal, and on next a devnet failure is
# fatal, because in each case that network IS the branch's line. GitHub runs the
# workflow file from the DISPATCHED ref, so `next` carries its own copy of the split
# (#678) alongside main's (#676) — otherwise devnet would never run here at all.
#
# `workflow_dispatch` takes the network argument, so either network can be
# exercised from either branch by hand; pass it, since the default is devnet.
#
# (#797, CLOSED) Devnet's 2026-08-27 re-genesis enabled transaction fees, and for a week no
# released tooling could transact against it, so all four devnet suites were taken off the
# push arm. All four are back: the wallet pays the fee on every path, and the harness funds
# its accounts from the chain's own public faucet, which IS devnet's native fee-asset faucet.
# Nothing here carves out a neither-ran shape any more -- a devnet suite that does not run is
# a real bug again.

on:
  workflow_dispatch:
    inputs:
      network:
        # Defaults to this branch's line (devnet); flips to testnet when `next`
        # becomes main. NOT 'both': the gates now require every network that ran
        # to pass, and a wallet built for one protocol line cannot pass against
        # the other — so a 'both' default would fail by construction.
        description: 'Network to test against'
        required: false
        default: 'devnet'
        type: choice
        options:
          # No 'both': the gates require every network that ran to succeed, and a
          # wallet built for one protocol line cannot pass against the other, so
          # 'both' is unpassable by construction rather than merely slow.
          - devnet
          - testnet

permissions:
  contents: read
  # The linked-PR injections list a dispatched branch's open pull request and read its description.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scratch diagnostic only; not release qualification.
  chrome-guardian-testnet:
    name: Chrome Guardian E2E (testnet)
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && (inputs.network == 'both' || inputs.network == 'testnet')) }}
    runs-on: warp-ubuntu-latest-x64-8x
    # The suite (34 tests on one worker) took 48-55 min on green testnet runs (2026-10-08/09) and outran
    # 60 min on a slow testnet on 2026-10-10 with every finished test passing. A dispatch may first build a linked
    # web-sdk PR from source (about 26 min on ubuntu-latest, pr-compile-surfaces.yml).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 90 }}
    env:
      E2E_NETWORK: testnet
      GUARDIAN_URL: https://guardian-testnet.openzeppelin.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache miden-client-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      # On a dispatch from a pull request's branch these build against that pull request's linked
      # web-sdk and Guardian PRs, as its own CI does; on any other run both are no-ops.
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      # Not frozen: an injection rewrites package.json to `file:` deps the committed lockfile cannot match.
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      - name: Install miden-client-cli
        # Reads the CLI pin (midenClientCliGit, else midenClientCliVersion) from
        # package.json — the same resolution playwright/e2e/helpers/miden-cli.ts does —
        # and skips the ~7 min compile when the cache above already restored the binary.
        # It also rebuilds the CLI against a linked Protocol PR when the PR carries one;
        # no marker means the published pin, exactly as before.
        uses: ./.github/actions/install-miden-client-cli

      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos

      - name: Install xvfb
        # The azure apt mirror intermittently blackholes: runs have stalled ~57 min
        # inside `apt-get update`, been killed by the job cap, and produced no test
        # results. Prefer the canonical mirror, bound + retry fetches, cap the step.
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture
        env:
          E2E_FIXTURE_PRELAUNCH_TESTNET: ${{ (env.E2E_NETWORK == '' || env.E2E_NETWORK == 'testnet') && !startsWith(env.MIDEN_REMOTE_CONFIG_URL, 'http://') && 'true' || 'false' }}

      - name: Build Chrome extension (testnet)
        run: yarn test:e2e:blockchain:build

      - name: Verify fresh Guardian onboarding and public funding (testnet)
        run: xvfb-run -a yarn test:e2e:guardian:run guardian-onboarding-create.spec.ts --output=test-results/playwright/onboarding

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-guardian-e2e-testnet-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

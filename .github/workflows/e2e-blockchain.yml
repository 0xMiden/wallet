  mobile-gate:
    name: Mobile E2E Gate
    needs: [mobile-devnet, mobile-testnet]
    # `!cancelled()` rather than `always()`: the concurrency group supersedes
    # in-progress runs constantly, and the whitelist below correctly treats a
    # cancelled network as not-a-pass. Combined with `always()` that would paint a
    # red gate on every superseded run — noise that trains people to ignore it. A
    # cancelled run should report cancelled, not failed; a genuinely failed job
    # still runs this gate and still fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the branch's network to pass
        shell: bash
        env:
          DEVNET_RESULT: ${{ needs.mobile-devnet.result }}
          TESTNET_RESULT: ${{ needs.mobile-testnet.result }}
        run: |
          echo "devnet=$DEVNET_RESULT  testnet=$TESTNET_RESULT"
          # WHITELIST, not blacklist. `needs.<job>.result` is one of
          # success/failure/cancelled/skipped, and `cancelled` is routine here
          # because the concurrency group cancels in-progress runs. An earlier
          # version of this gate failed only on "failure", so a cancelled suite
          # reported GREEN — the identical hole this split exists to close.
          # Exactly one network runs per push (devnet on next, testnet on main);
          # the other is skipped. So: require that the one which ran SUCCEEDED.
          ran=0
          for result in "$DEVNET_RESULT" "$TESTNET_RESULT"; do
            if [[ "$result" != "skipped" ]]; then
              ran=$((ran + 1))
              if [[ "$result" != "success" ]]; then
                echo "Mobile E2E: the network for this branch did not pass (result=$result)."
                exit 1
              fi
            fi
          done
          if [[ "$ran" -eq 0 ]]; then
            # QUARANTINE CARVE-OUT (#797) — same as the Chrome E2E gate.
            DEVNET_QUARANTINED=true
            if [[ "$DEVNET_QUARANTINED" == "true" ]]; then
              echo "Mobile E2E: devnet suite is QUARANTINED (#797) — passing without it. This is a"
              echo "known coverage gap on next, not a green suite."
              exit 0
            fi
            echo "Mobile E2E: neither network ran — check the branch gating on the jobs."
            exit 1
          fi
          echo "Mobile E2E: passed."


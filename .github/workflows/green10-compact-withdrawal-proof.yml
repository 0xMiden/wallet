name: Green10 empty-lock cleanup
on:
  push:
    branches: [wiktor/green10-compact-cleanup-readiness, wiktor/green10-compact-disable-once]
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  audit:
    if: github.run_attempt == '1' && (github.ref_name == 'wiktor/green10-compact-cleanup-readiness' || github.event.created == true)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Verify exact owner, amount and maturity guards
        run: node --test test/green10-compact-withdraw.node.test.mjs
      - name: Verify withdrawal custody without a signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/0xMiden/wallet/git/ref/heads/main --jq '.object.sha')" = 4cda551849cdc69c9990d6943696fbbbc34ac468
          test "$(gh run list -w e2e-mainnet-nightly.yml -L 1 --json databaseId,status --jq '.[0]|[.databaseId,.status]|join(":")')" = 44990040178:completed
          umask 077
          gh api repos/0xMiden/wallet/actions/artifacts/14741840831/zip > "$RUNNER_TEMP/epoch.zip"
          printf '%s  %s\n' a50610cdcdc057a64afbc01fcf018b43f71e3de6654fdddb1a7be5f0b6e8c541 "$RUNNER_TEMP/epoch.zip" | sha256sum --check --status
          test "$(unzip -Z1 "$RUNNER_TEMP/epoch.zip")" = roundtrip.json
          unzip -p "$RUNNER_TEMP/epoch.zip" roundtrip.json > "$RUNNER_TEMP/epoch.json"
          node scripts/green10-compact-withdraw.mjs "$RUNNER_TEMP/epoch.json" disable > "$RUNNER_TEMP/withdrawal-readiness.json"
          jq -ce 'select(.signed==false and .broadcast==false and .nonce==124 and .heldBaseUnits=="0")' "$RUNNER_TEMP/withdrawal-readiness.json"
      - name: Start exact empty-lock cleanup once on branch creation
        if: github.ref_name == 'wiktor/green10-compact-disable-once' && github.event.created == true
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_MAINNET_EVM_KEY: ${{ secrets.E2E_MAINNET_EVM_KEY }}
        run: |
          jq -e '.ready==true and .finalized==true' "$RUNNER_TEMP/withdrawal-readiness.json" >/dev/null
          umask 077
          (
            set +e
            node scripts/green10-compact-enable.mjs > "$RUNNER_TEMP/compact-withdrawal-private.log" 2>&1
            printf '%s\n' "$?" > "$RUNNER_TEMP/compact-activation.exit"
          ) &
          printf '%s\n' "$!" > "$RUNNER_TEMP/compact-activation.pid"
      - if: github.ref_name == 'wiktor/green10-compact-disable-once' && github.event.created == true
        uses: ./.github/actions/mainnet-loop-upload
        with:
          checkpoint: ${{ runner.temp }}/compact-activation.json
          gate: ${{ runner.temp }}/compact-activation-gate
          artifact-name: green10-compact-cleanup-journal-${{ github.run_id }}
          process-id: ${{ runner.temp }}/compact-activation.pid
          snapshot-directory: ${{ runner.temp }}/compact-withdrawal-snapshot
      - name: Require single cleanup submission result
        if: github.ref_name == 'wiktor/green10-compact-disable-once' && github.event.created == true
        run: |
          for _ in $(seq 1 90); do
            test -s "$RUNNER_TEMP/compact-activation.exit" && break
            sleep 1
          done
          test "$(< "$RUNNER_TEMP/compact-activation.exit")" = 0
          test "$(jq -er '.hash' "$RUNNER_TEMP/compact-activation-outcome.json")" = "$(< "$RUNNER_TEMP/compact-activation.broadcast.once")"
      - name: Preserve bounded withdrawal outcome, including ambiguous attempts
        if: always() && github.ref_name == 'wiktor/green10-compact-disable-once' && github.event.created == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: green10-compact-cleanup-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compact-activation.broadcast.once
            ${{ runner.temp }}/compact-activation-outcome.json
          if-no-files-found: ignore

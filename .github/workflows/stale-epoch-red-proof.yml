name: Storage recovery stale epoch red proof
on:
  push:
    branches: [ci/1948-stale-epoch-red]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frozen source
        run: |
          git checkout --detach 0b31ed4e0e76f4fa999d26a6897179e087b8d8d5
          test "$(git rev-parse HEAD)" = 0b31ed4e0e76f4fa999d26a6897179e087b8d8d5
      - uses: ./.github/actions/yarn-install
      - name: Stale epoch tests (expected red)
        run: >-
          yarn test --runInBand --runTestsByPath
          src/lib/store/index.ready-balance-read.test.ts
          src/lib/store/utils/updateBalancesFromSyncData.test.ts
          --testNamePattern='delayed pre-recovery incident|delayed pending snapshot|old sync snapshot'

name: Exact legacy read-only reconciliation RED
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
  actions: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Known immutable pre-deposit failure retains older funded swap checkpoint
        run: yarn jest scripts/mainnet-swap-artifacts.test.ts --maxWorkers=2 --watch=false

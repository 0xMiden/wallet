name: Remaining allowance GREEN and frozen codec RED
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify frozen source
        run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Lower remaining allowance regression GREEN
        run: yarn jest scripts/mainnet-loop-budget.test.ts --maxWorkers=2 --watch=false
      - name: Frozen loss allowance codec regression RED
        run: yarn jest scripts/mainnet-swap-checkpoint.test.ts --maxWorkers=2 --watch=false

name: Independent NEAR custody audit (read only)
on:
  push:
    branches: [wiktor/green04-near-fee-proof-once]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      E2E_NETWORK: mainnet
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 8
      - name: Bind exact audit source and original producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/wiktor/green04-near-fee-proof-once
          base=84e600746824080d9b4e1b24a53ab665db0cc8dd
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(gh pr view 2220 --json headRefOid --jq .headRefOid)" = "$base"
          test "$(gh run list --workflow e2e-mainnet-nightly.yml -L 1 --json databaseId,status --jq '.[0]|[.databaseId,.status]|join(":")')" = 44681947124:completed
          gh run view 44318071333 --json headSha,attempt,conclusion,jobs | jq -e '.headSha=="eb23473d006c3564a30cdb991f177e64ff89ec24" and .attempt==1 and .conclusion=="failure" and ([.jobs[].steps[]|select(.name=="Wait for mainnet NEAR forward" and .conclusion=="failure")]|length)==1' >/dev/null
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD)" = "$(printf '%s\n' .github/workflows/nightly-loop-proof.yml playwright/e2e/tests/mainnet/green04-near-custody.spec.ts)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44681947124
          github-token: ${{ github.token }}
          name: mainnet-1click-final-44681947124
          path: test-results/near
      - name: Verify checkpoint bytes and audit types
        run: |
          echo '49280822379e8ce1e83a36e11e128e28ebee70001a2eadc56ce654ed410c7147  test-results/near/roundtrip.json' | sha256sum -c
          yarn ts
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - run: yarn test:e2e:blockchain:build
        env:
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      - name: Verify both public settlements and restored private vault without authority
        env:
          E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
        run: |
          umask 077
          if ! E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/custody-private" xvfb-run -a yarn playwright test green04-near-custody.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/custody-private.log" 2>&1; then
            echo 'Read-only custody audit did not pass; no private logs retained.'; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: green04-near-stage
          path: test-results/green04-near-stage.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: green04-near-custody
          path: test-results/green04-near-custody.json
          if-no-files-found: error

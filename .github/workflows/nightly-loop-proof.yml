name: Received note full export regression RED
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Authenticated input note, proof denial, retired hold and output fallback
        run: yarn jest src/lib/miden/sdk/miden-client-interface.test.ts --maxWorkers=2 --watch=false --testNamePattern='full input note export'

name: Green13 Swap and Epoch fee audit (read only)
on:
  push:
    branches: [wiktor/green13-fee-audit]
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_NETWORK: mainnet
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - name: Verify original producer and artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          base=3f2e9134360616f82490a113d185a5f206fc1156
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = "$(printf '%s\n' .github/workflows/nightly-loop-proof.yml playwright/e2e/tests/mainnet/green13-fee-audit.spec.ts)"
          test "$(gh run list -w e2e-mainnet-nightly.yml -L 1 --json databaseId,status --jq '.[0]|[.databaseId,.status]|join(":")')" = 45092013711:completed
          gh run view 45092013711 --json headSha,attempt,conclusion --jq '[.headSha,.attempt,.conclusion]|join(":")' | grep -Fx '22a5d73c0d09630b9075d574a4e3f4ad81cc7dbc:1:failure'
          umask 077
          mkdir -p test-results/fee-audit
          cd test-results/fee-audit
          fetch() {
            gh api "repos/0xMiden/wallet/actions/artifacts/$1/zip" > "$3.zip"
            printf '%s  %s\n' "$2" "$3.zip" | sha256sum --check --status
          }
          fetch 14782442886 48822c62df7779ffaadb7632f7f29dfb7fa2afe5ceaa07193b60bc65a667820a swap
          fetch 14782856259 a25f26bd4544c8604a479eb84ad6ccf0d275a5f25ddbc6bff0fc62ed6bf1c23a epoch
          fetch 14782925198 be0d2a68d6aab993c98e9a5c7144db7b49f07103063ab21c4d49c6e8a758d11d nightly
          unzip -p swap.zip roundtrip.json > swap.json
          unzip -p epoch.zip roundtrip.json > epoch.json
          unzip -p nightly.zip mainnet-swap-forward-claim.json > forward.json
          unzip -p nightly.zip mainnet-swap-reverse-claim.json > reverse.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - run: yarn test:e2e:blockchain:build
        env:
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      - name: Audit canonical fees without transaction authorization
        env:
          E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
        run: |
          umask 077
          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/fee-audit-private" xvfb-run -a yarn playwright test green13-fee-audit.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/fee-audit-private.log" 2>&1
          jq -Rcer 'select(startswith("GREEN13_FEE_AUDIT "))|split(" ")[1]|fromjson|{swapFees,swapCostUsdMicros,epochNativeFee,epochCostUsdMicros,netCostUsdMicros,custodyMatches}' "$RUNNER_TEMP/fee-audit-private.log"

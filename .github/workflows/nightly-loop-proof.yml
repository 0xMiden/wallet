name: Recovery authority contract proof
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Exact SDK payback contract regression
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-swap-claim.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-swap-claim.mjs
          node --test --test-concurrency=2 scripts/mainnet-swap-claim.test.mjs
      - name: Frozen recovery contracts
        if: always()
        run: |
          test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
          printf 'Verified source %s\n' "$(git rev-parse HEAD^2)"
          yarn jest scripts/mainnet-swap-checkpoint.test.ts scripts/mainnet-consume-coordination.test.ts scripts/mainnet-loop-wallet.test.ts --maxWorkers=2 --watch=false
      - name: Check connected types
        if: always()
        run: yarn ts
      - name: Owned formatting patch
        if: always()
        run: |
          yarn prettier --write playwright/e2e/helpers/mainnet-swap-checkpoint.ts playwright/e2e/helpers/mainnet-consume-authorization.ts playwright/e2e/helpers/mainnet-loop-wallet.ts playwright/e2e/helpers/mainnet-swap-ui.ts playwright/e2e/helpers/mainnet-swap-claim.ts scripts/mainnet-swap-checkpoint.test.ts scripts/mainnet-consume-coordination.test.ts scripts/mainnet-loop-wallet.test.ts scripts/mainnet-swap-claim.test.mjs
          git diff --binary -- playwright/e2e/helpers/mainnet-swap-checkpoint.ts playwright/e2e/helpers/mainnet-consume-authorization.ts playwright/e2e/helpers/mainnet-loop-wallet.ts playwright/e2e/helpers/mainnet-swap-ui.ts playwright/e2e/helpers/mainnet-swap-claim.ts scripts/mainnet-swap-checkpoint.test.ts scripts/mainnet-consume-coordination.test.ts scripts/mainnet-loop-wallet.test.ts scripts/mainnet-swap-claim.test.mjs > recovery-owned-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-owned-format
          path: recovery-owned-format.patch
          retention-days: 2

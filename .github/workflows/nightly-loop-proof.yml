name: NEAR provenance unit proof
on:
  push:
    branches: [wiktor/near-readonly-absence-types]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test scripts/mainnet-near-return-provenance.node.test.mjs
      - run: yarn install --frozen-lockfile
      - run: yarn esbuild scripts/helpers/mainnet-epoch-readonly-sdk.ts --bundle --platform=node --format=cjs --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-epoch-readonly-sdk.cjs
      - run: yarn tsc --noEmit -p playwright.mainnet.tsconfig.json

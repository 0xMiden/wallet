name: Recovery transport and remaining-budget integration GREEN
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify frozen source
        run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Actual SDK request and frozen recovery-bound contracts GREEN
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-swap-claim.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-swap-claim.mjs
          yarn esbuild src/lib/miden/sdk/test-send-request.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-send-request.mjs
          node --test --test-concurrency=2 scripts/mainnet-swap-claim.test.mjs scripts/mainnet-swap-request.test.mjs scripts/mainnet-send-request.test.mjs
      - name: All connected mainnet contracts and harness lint
        if: always()
        run: |
          yarn jest scripts/mainnet-*.test.ts playwright/e2e/config/mainnet-nightly.test.ts --maxWorkers=2 --watch=false
          yarn lint:e2e
      - name: Canonical connected type gate
        if: always()
        run: yarn ts
      - name: Owned formatting patch
        if: always()
        run: |
          yarn prettier --write .github/actions/mainnet-loop-upload/action.yml .github/workflows/e2e-mainnet-nightly.yml playwright/e2e/helpers/mainnet-loop-budget.ts playwright/e2e/helpers/mainnet-swap-checkpoint.ts playwright/e2e/helpers/mainnet-swap-claim.ts playwright/e2e/tests/mainnet/mainnet-swap-loop.spec.ts scripts/mainnet-loop-upload.test.ts scripts/mainnet-swap-workflow.test.ts scripts/mainnet-loop-budget.test.ts scripts/mainnet-swap-checkpoint.test.ts scripts/mainnet-swap-claim.test.mjs
          git diff --binary -- .github/actions/mainnet-loop-upload/action.yml .github/workflows/e2e-mainnet-nightly.yml playwright/e2e/helpers/mainnet-loop-budget.ts playwright/e2e/helpers/mainnet-swap-checkpoint.ts playwright/e2e/helpers/mainnet-swap-claim.ts playwright/e2e/tests/mainnet/mainnet-swap-loop.spec.ts scripts/mainnet-loop-upload.test.ts scripts/mainnet-swap-workflow.test.ts scripts/mainnet-loop-budget.test.ts scripts/mainnet-swap-checkpoint.test.ts scripts/mainnet-swap-claim.test.mjs > transport-budget-final-owned-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-budget-final-owned-format
          path: transport-budget-final-owned-format.patch
          if-no-files-found: error

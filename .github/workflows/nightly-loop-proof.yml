name: Replacement workflow GREEN and source freshness RED
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Failed-source and chain-freshness functional RED
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-swap-claim.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-swap-claim.mjs
          node --test --test-concurrency=2 scripts/mainnet-swap-claim.test.mjs
      - name: Immutable replacement codec GREEN
        if: always()
        run: yarn jest scripts/mainnet-swap-checkpoint.test.ts --maxWorkers=2 --watch=false
      - name: Explicit replacement permission GREEN
        if: always()
        run: yarn jest scripts/mainnet-swap-workflow.test.ts --maxWorkers=2 --watch=false
      - name: Canonical types
        if: always()
        run: yarn ts

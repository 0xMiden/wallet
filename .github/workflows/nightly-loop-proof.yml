name: NEAR unspent reconciliation regression
on:
  push:
    branches: [wiktor/near-unspent-reconciliation]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Functional reconciliation, provenance and existing budget/workflow guards
        run: yarn jest scripts/mainnet-near-unspent.test.ts scripts/mainnet-provider-artifacts.test.ts scripts/mainnet-swap-workflow.test.ts scripts/mainnet-loop-budget.test.ts --maxWorkers=2
      - name: Produce formatting patch in CI after exact-source regression tests
        if: always()
        run: |
          yarn prettier --write playwright/e2e/helpers/mainnet-near-runtime.ts scripts/mainnet-near-unspent.test.ts scripts/mainnet-provider-artifacts.test.ts scripts/mainnet-swap-artifacts.mjs scripts/mainnet-swap-workflow.test.ts
          git diff --binary > "$RUNNER_TEMP/near-reconciliation-format.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: near-reconciliation-format
          path: ${{ runner.temp }}/near-reconciliation-format.patch

name: Mainnet harness regression proof

on:
  push:
    branches: [wiktor/nightly-loop-proof]

permissions:
  contents: read

concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false

jobs:
  helpers:
    runs-on: ubuntu-latest
    env:
      RAYON_NUM_THREADS: 2
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Verify immutable source and mainnet helpers
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          yarn jest src/lib/miden/sdk/miden-client-interface.prove-worker.test.ts src/lib/one-click/fees.test.ts src/lib/one-click/client.test.ts src/lib/remote-config/schema.test.ts src/lib/epoch/epoch-send.test.ts src/screens/send-flow/ReviewTransaction.test.tsx src/screens/send-flow/useEpochQuote.test.ts scripts/mainnet-*.test.ts playwright/e2e/helpers/mainnet-one-click-*.test.ts playwright/e2e/config/mainnet-nightly.test.ts playwright/e2e/harness/spec-selection.test.ts --maxWorkers=2 --watch=false
          yarn lint:e2e
          E2E_NETWORK=mainnet yarn playwright test --config playwright.mainnet.config.ts --list
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-request.ts --bundle --platform=node --format=esm --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-epoch-request.mjs
          yarn esbuild scripts/helpers/mainnet-epoch-fixture.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-fixture.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-loop-config.ts --bundle --platform=node --format=esm --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-loop-config.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-miden-read.ts --bundle --platform=node --format=cjs --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-miden-read.cjs
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-evm.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-evm.mjs
          yarn esbuild scripts/helpers/mainnet-epoch-readonly-sdk.ts --bundle --platform=node --format=cjs --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-epoch-readonly-sdk.cjs
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-provider.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-provider.mjs
          node --test --test-concurrency=2 scripts/mainnet-epoch-request.test.mjs scripts/mainnet-loop-config-cli.test.mjs scripts/mainnet-epoch-evm.test.mjs scripts/mainnet-epoch-provider.test.mjs
          node scripts/consume-request-equivalence.mjs
          yarn ts
      - name: Check public mainnet SDK reads without keys or writes
        run: node scripts/mainnet-sdk-readonly.mjs
      - name: Inspect public receipt lookup capability without keys or funding
        if: always()
        run: |
          node --input-type=module <<'NODE'
          async function boundedText(response) {
            let body = ''; const decoder = new TextDecoder(); let length = 0;
            for await (const chunk of response.body ?? []) {
              length += chunk.length; if (length > 1048576) throw new Error('Public response too large');
              body += decoder.decode(chunk, { stream: true });
            }
            return body;
          }
          const targets = [
            ['https://1click.chaindefuser.com/v1/receipts/resolve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{"transactionHashes":[]}' }],
            ['https://explorer.mainnet.miden.io', {}],
            ['https://explorer.mainnet.miden.io/api/openapi.json', {}],
            ['https://explorer.mainnet.miden.io/api/transactions?limit=1', {}]
          ];
          const deadline = Date.now() + 45000;
          const signal = () => AbortSignal.timeout(Math.max(1, Math.min(8000, deadline - Date.now())));
          for (const [url, init] of targets) {
            if (Date.now() >= deadline) break;
            try {
              const response = await fetch(url, { ...init, signal: signal() });
              const body = await boundedText(response);
              let schema = {};
              if (response.headers.get('content-type')?.includes('application/json')) {
                try { const json = JSON.parse(body); schema = { keys: Object.keys(json).slice(0, 20), paths: Object.keys(json.paths ?? {}).slice(0, 80) }; } catch {}
              }
              const scripts = url === 'https://explorer.mainnet.miden.io' ? [...body.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].slice(0, 32).map(match => new URL(match[1], url)).filter(asset => asset.origin === new URL(url).origin).map(asset => asset.pathname.slice(0, 200)) : [];
              const transactionPath = url === 'https://explorer.mainnet.miden.io' ? body.match(/\/tx\/0x[0-9a-f]{64}/i)?.[0] : undefined;
              if (transactionPath) {
                const detail = await boundedText(await fetch(new URL(transactionPath, url), { signal: signal() }));
                for (const match of detail.matchAll(/<script[^>]+src=["']([^"']+)["']/g)) {
                  const asset = new URL(match[1], url);
                  if (asset.origin === new URL(url).origin && !scripts.includes(asset.pathname) && scripts.length < 40) scripts.push(asset.pathname.slice(0, 200));
                }
              }
              console.log(JSON.stringify({ url, status: response.status, contentType: response.headers.get('content-type'), scripts, schema, transactionPath, publicConfiguration: [...body.matchAll(/GRAPHQL_URL.{0,220}/g)].slice(0, 4).map(match => match[0]) }));
              for (const path of scripts) {
                if (Date.now() >= deadline) break;
                try {
                  const source = await boundedText(await fetch(new URL(path, url), { signal: signal() }));
                  const urls = [...source.matchAll(/https?:\/\/[A-Za-z0-9._:/-]+/g)].map(match => new URL(match[0])).filter(value => (value.hostname.includes('miden') || value.hostname.includes('walnut') || value.pathname.includes('graphql'))).map(value => `${value.origin}${value.pathname}`.slice(0, 200));
                  const routes = [...source.matchAll(/["'`]\/(?:api|v1|graphql)[A-Za-z0-9._/-]*/g)].map(match => match[0].slice(1, 201));
                  const receiptCode = [...source.matchAll(/(?:getTransaction|fetchTransaction|output_?notes|input_?notes|transactions?\/|txHash|transactionId|graphql|apiBaseUrl|NEXT_PUBLIC_API)[^;]{0,180}/gi)].slice(0, 15).map(match => match[0]);
                  const configIndex = source.indexOf('NEXT_PUBLIC_GRAPHQL_URL');
                  const publicConfiguration = configIndex < 0 ? undefined : source.slice(Math.max(0, configIndex - 800), configIndex + 800);
                  const pageRoutes = path.endsWith('_buildManifest.js') ? [...source.matchAll(/["']\/[^"']+/g)].slice(0, 30).map(match => match[0].slice(1, 201)) : [];
                  console.log(JSON.stringify({ script: path, endpoints: [...new Set([...urls, ...routes])].slice(0, 30), receiptCode, publicConfiguration, pageRoutes }));
                } catch { console.log(JSON.stringify({ script: path, status: 'unavailable' })); }
              }
            } catch { console.log(JSON.stringify({ url, status: 'unavailable' })); }
          }
          NODE

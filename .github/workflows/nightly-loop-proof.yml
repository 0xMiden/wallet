name: Exact mainnet Playwright registration GREEN
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Register all actual mainnet specs without execution
        run: |
          set -euo pipefail
          yarn playwright test --config playwright.mainnet.config.ts --list | tee mainnet-listed-tests.txt
          grep -Eq 'Total: [1-9][0-9]* tests' mainnet-listed-tests.txt
      - name: Canonical types and harness lint
        run: |
          yarn ts
          yarn lint:e2e

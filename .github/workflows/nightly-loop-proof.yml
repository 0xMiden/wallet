name: Epoch restored-vault and fast-only route regression RED
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
  actions: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn jest scripts/mainnet-epoch-route.test.ts scripts/mainnet-epoch-readonly-completion.test.ts --runInBand --watch=false

name: Final merged-tree pre-funding dual SDK readiness
on:
  push:
    branches: [wiktor/green01-fixed-sdk018-readiness]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  public-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 16
      - name: Bind exact qualified application and only read-only audit files
        run: |
          git merge-base --is-ancestor 5e73a88245b277ca2c2542eeb4384a63a1476e5b HEAD
          test "$(git diff --name-only 5e73a88245b277ca2c2542eeb4384a63a1476e5b HEAD)" = "$(printf '%s\n' .github/workflows/nightly-loop-proof.yml playwright/e2e/tests/mainnet/fresh-epoch-claim-private.spec.ts scripts/fresh-epoch-claim-settlement.mjs)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked Guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43999834254
          github-token: ${{ github.token }}
          pattern: mainnet-*-43999834254
          path: test-results/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44014690598
          github-token: ${{ github.token }}
          pattern: mainnet-*-final-44014690598
          path: test-results/recovery-evidence
      - name: Bind qualified and merged trees plus the current producer frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/0xMiden/wallet/git/commits/775f30df7ab450165d82f0f2ddd9ff1742431585 > "$RUNNER_TEMP/qualified.json"
          gh api repos/0xMiden/wallet/git/commits/6d7b52e163d11d6883ccc03fc19a37612a2290c2 > "$RUNNER_TEMP/merged.json"
          gh api repos/0xMiden/wallet/branches/main > "$RUNNER_TEMP/current-main.json"
          gh api 'repos/0xMiden/wallet/actions/workflows/e2e-mainnet-nightly.yml/runs?per_page=1' > "$RUNNER_TEMP/latest-producer.json"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');const load=name=>JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}.json`));const qualified=load('qualified'),merged=load('merged'),main=load('current-main'),latest=load('latest-producer').workflow_runs[0];assert.equal(qualified.sha,'775f30df7ab450165d82f0f2ddd9ff1742431585');assert.equal(merged.sha,'6d7b52e163d11d6883ccc03fc19a37612a2290c2');assert.equal(qualified.tree.sha,'57ba7af5212ab0b6042cde42c20a6699ee3ff4d3');assert.equal(merged.tree.sha,qualified.tree.sha);assert.equal(merged.verification.verified,true);assert.equal(main.commit.sha,merged.sha);assert.equal(latest.id,44025142736);assert.equal(latest.status,'completed');assert.equal(latest.conclusion,'cancelled');
          NODE
      - name: Verify intervening scheduled safety-stop reached no payment authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/0xMiden/wallet/actions/runs/44025142736 > "$RUNNER_TEMP/safety-run.json"
          gh api repos/0xMiden/wallet/actions/runs/44025142736/jobs > "$RUNNER_TEMP/safety-jobs.json"
          gh api 'repos/0xMiden/wallet/actions/runs/44025142736/artifacts?per_page=100' > "$RUNNER_TEMP/safety-artifacts.json"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');const run=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/safety-run.json`)),jobs=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/safety-jobs.json`)),artifacts=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/safety-artifacts.json`));assert.ok(artifacts.total_count<=100);assert.deepEqual(artifacts.artifacts.map(a=>a.name).sort(),['mainnet-1click-final-44025142736','mainnet-epoch-final-44025142736','mainnet-nightly-44025142736','mainnet-swap-final-44025142736'].sort());assert.equal(run.head_sha,'3a3463e69db938291e9b6358914f0784d2b90f0e');assert.equal(run.status,'completed');assert.equal(run.conclusion,'cancelled');const job=jobs.jobs.find(j=>j.id===133844266244);assert.ok(job);const fresh=job.steps.filter(s=>s.number>=57&&s.number<=92);assert.equal(fresh.length,36);assert.ok(fresh.every(s=>s.conclusion==='skipped'));for(const number of [32,35,37,38,42,43,44,45,46,47,50,51,52,53,54])assert.equal(job.steps.find(s=>s.number===number)?.conclusion,'skipped');assert.equal(job.steps.find(s=>s.number===41)?.conclusion,'success');for(const number of [93,94,95])assert.equal(job.steps.find(s=>s.number===number)?.conclusion,'success');
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44025142736
          github-token: ${{ github.token }}
          pattern: mainnet-*-final-44025142736
          path: test-results/safety-stop-evidence
      - name: Bind immutable original SDK snapshots and canonically reconciled checkpoints
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const roles={'mainnet-swap-final':'fresh','mainnet-epoch-final':'final','mainnet-1click-final':'original-near','mainnet-epoch-return-authorized':'claim','mainnet-epoch-forward-sdk-authorized':'epoch-forward-sdk','mainnet-epoch-reverse-signed-1':'evm1','mainnet-epoch-reverse-signed-2':'evm2','mainnet-swap-forward-sdk-authorized':'forward-create','mainnet-swap-reverse-sdk-authorized':'reverse-create','mainnet-swap-forward-claim-sdk-authorized':'forward-claim','mainnet-swap-reverse-claim-sdk-authorized':'reverse-claim','mainnet-nightly':'fresh-public'};
          for(const [name,role] of Object.entries(roles))fs.cpSync(`test-results/evidence/${name}-43999834254`,`test-results/${role}`,{recursive:true});
          for(const [name,role] of Object.entries({'mainnet-swap-final':'fresh','mainnet-epoch-final':'final','mainnet-1click-final':'near'}))fs.cpSync(`test-results/recovery-evidence/${name}-44014690598`,`test-results/${role}`,{recursive:true});
          for(const name of ['mainnet-swap-final','mainnet-epoch-final','mainnet-1click-final'])if(!fs.readFileSync(`test-results/recovery-evidence/${name}-44014690598/roundtrip.json`).equals(fs.readFileSync(`test-results/safety-stop-evidence/${name}-44025142736/roundtrip.json`)))throw new Error('Intervening safety-stop changed an original checkpoint');
          NODE
      - name: Exact production read-only SDK bootstrap
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {execFileSync} from 'node:child_process';import YAML from 'yaml';
          const doc=YAML.parse(readFileSync('.github/workflows/e2e-mainnet-nightly.yml','utf8')),step=doc.jobs['mainnet-nightly'].steps.find(step=>step.name==='Build read-only Epoch SDK');
          if(!step?.run)throw new Error('Missing production SDK bootstrap');execFileSync('bash',['-euo','pipefail','-c',step.run],{stdio:'inherit'});
          NODE
      - name: Verify original SDK byte authorities, native settlement, EVM receipts and once-only cost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-evm.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-evm.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-request.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-epoch-request.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-swap-claim.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-swap-claim.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-miden-read.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-miden-read.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-loop-budget.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-loop-budget.mjs
          node scripts/fresh-epoch-claim-settlement.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fresh-epoch-claim-public-settlement
          path: test-results/fresh-epoch-claim-public-settlement.json
  private-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_NETWORK: mainnet
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
      WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 775f30df7ab450165d82f0f2ddd9ff1742431585
      - name: Bind current SDK application and only its read-only private audit overlay
        run: |
          test "$(git rev-parse HEAD)" = 775f30df7ab450165d82f0f2ddd9ff1742431585
          git fetch origin "$GITHUB_SHA" --depth=1
          git show "$GITHUB_SHA:playwright/e2e/tests/mainnet/fresh-epoch-claim-private.spec.ts" > playwright/e2e/tests/mainnet/fresh-epoch-claim-private.spec.ts
          test "$(git status --porcelain --untracked-files=all)" = '?? playwright/e2e/tests/mainnet/fresh-epoch-claim-private.spec.ts'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked Guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43999834254
          github-token: ${{ github.token }}
          pattern: mainnet-*-final-43999834254
          path: test-results/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44014690598
          github-token: ${{ github.token }}
          pattern: mainnet-*-final-44014690598
          path: test-results/recovery-evidence
      - name: Bind exact original and canonically reconciled checkpoints
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          fs.cpSync('test-results/evidence/mainnet-1click-final-43999834254','test-results/original-near',{recursive:true});
          for(const [name,role] of Object.entries({'mainnet-swap-final':'fresh','mainnet-epoch-final':'final','mainnet-1click-final':'near'}))fs.cpSync(`test-results/recovery-evidence/${name}-44014690598`,`test-results/${role}`,{recursive:true});
          NODE
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - run: yarn test:e2e:blockchain:build
      - name: Restore original PRIVATE holdings and verify signed NEAR status with no spend or mutation
        run: |
          umask 077
          code=0
          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/attempt01-private" xvfb-run -a yarn playwright test fresh-epoch-claim-private.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/attempt01-private.log" 2>&1 || code=$?
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          for(const file of ['test-results/fresh-epoch-claim-private-status.json','test-results/fresh-epoch-claim-private-settlement.json'])if(existsSync(file))console.log(JSON.stringify(JSON.parse(readFileSync(file,'utf8'))));
          NODE
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fresh-epoch-claim-private-settlement
          path: |
            test-results/fresh-epoch-claim-private-status.json
            test-results/fresh-epoch-claim-private-settlement.json

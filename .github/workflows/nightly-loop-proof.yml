name: Mainnet harness regression proof

on:
  push:
    branches: [wiktor/nightly-loop-proof]

permissions:
  contents: read

concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false

jobs:
  helpers:
    runs-on: ubuntu-latest
    env:
      RAYON_NUM_THREADS: 2
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Verify immutable source and mainnet helpers
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          yarn jest src/lib/miden/sdk/miden-client-interface.prove-worker.test.ts src/lib/one-click/fees.test.ts src/lib/one-click/client.test.ts src/lib/remote-config/schema.test.ts src/lib/epoch/epoch-send.test.ts src/screens/send-flow/ReviewTransaction.test.tsx src/screens/send-flow/useEpochQuote.test.ts scripts/mainnet-*.test.ts playwright/e2e/helpers/mainnet-one-click-*.test.ts playwright/e2e/config/mainnet-nightly.test.ts playwright/e2e/harness/spec-selection.test.ts --maxWorkers=2 --watch=false
          yarn lint:e2e
          E2E_NETWORK=mainnet yarn playwright test --config playwright.mainnet.config.ts --list
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-request.ts --bundle --platform=node --format=esm --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-epoch-request.mjs
          yarn esbuild scripts/helpers/mainnet-epoch-fixture.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-fixture.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-loop-config.ts --bundle --platform=node --format=esm --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-loop-config.mjs
          yarn esbuild playwright/e2e/helpers/mainnet-miden-read.ts --bundle --platform=node --format=cjs --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-miden-read.cjs
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-evm.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-evm.mjs
          yarn esbuild scripts/helpers/mainnet-epoch-readonly-sdk.ts --bundle --platform=node --format=cjs --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-epoch-readonly-sdk.cjs
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-provider.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-provider.mjs
          node --test --test-concurrency=2 scripts/mainnet-epoch-request.test.mjs scripts/mainnet-loop-config-cli.test.mjs scripts/mainnet-epoch-evm.test.mjs scripts/mainnet-epoch-provider.test.mjs
          node scripts/consume-request-equivalence.mjs
          yarn ts
      - name: Check public mainnet SDK reads without keys or writes
        run: node scripts/mainnet-sdk-readonly.mjs
      - name: Inspect public receipt lookup capability without keys or funding
        if: always()
        run: |
          node --input-type=module <<'NODE'
          async function boundedText(response) {
            let body = ''; const decoder = new TextDecoder(); let length = 0;
            for await (const chunk of response.body ?? []) {
              length += chunk.length; if (length > 1048576) throw new Error('Public response too large');
              body += decoder.decode(chunk, { stream: true });
            }
            return body;
          }
          const url = 'https://scan-backend-cedar-miden.eu-central-8.gateway.fm/graphql';
          try {
            const html = await boundedText(await fetch('https://explorer.mainnet.miden.io', { signal: AbortSignal.timeout(10000) }));
            if (!html.includes(`"GRAPHQL_URL":"${url}"`) || !html.includes('"MIDEN_NETWORK":"mainnet"')) throw new Error('Public explorer configuration changed');
            async function read(query, variables = {}) {
              const response = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ query, variables }), signal: AbortSignal.timeout(10000) });
              const json = JSON.parse(await boundedText(response));
              if (!response.ok || json.errors?.length) throw new Error('Public metadata query refused');
              return json.data;
            }
            const latest = await read('{transactions(first:1,input:{order_by:desc,sort_by:timestamp}){edges{node{transaction_id account_bech block_number}}}}');
            const sample = latest.transactions.edges[0]?.node;
            if (!sample) throw new Error('No public sample transaction');
            const query = `query($id:DigestString!,$account:String!,$height:BigIntNumber!){
              transaction(input:{transaction_id:$id}){transaction_id account_bech block_number}
              transactions(first:2,input:{account_bech:$account,block_number:$height,order_by:asc,sort_by:timestamp}){
                edges{node{transaction_id account_bech block_number}} pageInfo{hasNextPage}}
              notes(first:100,input:{sender:$account,block_number:$height,order_by:asc,sort_by:timestamp}){
                edges{node{note_id sender block_number}} pageInfo{hasNextPage}}}`;
            const metadata = await read(query, { id: sample.transaction_id, account: sample.account_bech, height: sample.block_number });
            console.log(JSON.stringify({ url, metadata, purpose: 'Public transaction/note ID correlation probe only; not funded loop acceptance' }));
          } catch { console.log(JSON.stringify({ url, status: 'unavailable' })); }
          NODE

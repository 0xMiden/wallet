name: Held-only native NEAR boundary diagnostic
on:
  push:
    branches: [wiktor/nightly-near-held-probe]
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  held-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_NETWORK: mainnet
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
      WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Bind unchanged qualified application and held-only diagnostic scope
        run: |
          test "$(git rev-parse HEAD^)" = c3b9997f069267a02a8e1715f691d0187982e23d
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/nightly-loop-proof.yml playwright/e2e/tests/mainnet/near-held-readonly.spec.ts)"
          ! grep -E 'releaseMainnetSendAuthorization|awaitMainnetLoopAuthorization' playwright/e2e/tests/mainnet/near-held-readonly.spec.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/inject-linked-web-sdk-pr
      - uses: ./.github/actions/inject-linked-guardian-pr
      - uses: ./.github/actions/yarn-install
      - name: Verify accepted independent outcome audit identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/0xMiden/wallet/actions/runs/44005625246 > "$RUNNER_TEMP/outcome-run.json"
          gh api repos/0xMiden/wallet/actions/runs/44005625246/jobs > "$RUNNER_TEMP/outcome-jobs.json"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');const run=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/outcome-run.json`)),jobs=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/outcome-jobs.json`));assert.equal(run.head_sha,'cca4608ecc222693a9f04124c671f06b48cd850f');assert.equal(run.conclusion,'success');assert.deepEqual(Object.fromEntries(jobs.jobs.map(j=>[j.name,j.conclusion])),{'private-inventory':'success','public-sdk':'success'});
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43999834254
          github-token: ${{ github.token }}
          name: mainnet-1click-final-43999834254
          path: test-results/original-near
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44005625246
          github-token: ${{ github.token }}
          name: fresh-epoch-claim-private-settlement
          path: test-results/accepted-private
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - name: Exact production owned provider overlay, without public rollout
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {execFileSync} from 'node:child_process';import YAML from 'yaml';const doc=YAML.parse(readFileSync('.github/workflows/e2e-mainnet-nightly.yml','utf8'));const step=doc.jobs['mainnet-nightly'].steps.find(s=>s.name==='Start owned provider loop config');if(!step?.run)throw new Error('Missing production owned-only overlay');execFileSync('bash',['-euo','pipefail','-c',step.run],{stdio:'inherit'});
          NODE
      - run: yarn test:e2e:blockchain:build
      - name: Observe UI and SDK behind mandatory unreleased local scope; verify zero native spend
        run: |
          umask 077
          code=0
          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/near-held-private" xvfb-run -a yarn playwright test near-held-readonly.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/near-held-private.log" 2>&1 || code=$?
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';if(existsSync('test-results/near-held-diagnostic.json'))console.log(JSON.stringify(JSON.parse(readFileSync('test-results/near-held-diagnostic.json','utf8'))));
          NODE
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: near-held-diagnostic
          path: test-results/near-held-diagnostic.json
          if-no-files-found: warn

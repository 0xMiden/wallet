name: Command Swap regression proof
on:
  push:
    branches: [wiktor/nightly-command-swap-review-red, wiktor/nightly-command-swap-review-green]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn jest --maxWorkers=2 --runTestsByPath scripts/mainnet-swap-ui.test.ts src/screens/swap-flow/CommandSwap.test.tsx

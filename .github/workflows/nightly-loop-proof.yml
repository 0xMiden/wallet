name: Green12 Swap and Epoch fee audit (read only)
on:
  push:
    branches: [wiktor/green12-fee-audit]
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_NETWORK: mainnet
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify original producer and artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          base=239ada789a8f2fc06ce2afdec8896d4f2dbcd977
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = "$(printf '%s\n' .github/workflows/nightly-loop-proof.yml playwright/e2e/tests/mainnet/green12-fee-audit.spec.ts)"
          test "$(gh run list -w e2e-mainnet-nightly.yml -L 1 --json databaseId,status --jq '.[0]|[.databaseId,.status]|join(":")')" = 45072272341:completed
          gh run view 45072272341 --json headSha,attempt,conclusion --jq '[.headSha,.attempt,.conclusion]|join(":")' | grep -Fx "$base:1:failure"
          umask 077
          mkdir -p test-results/fee-audit
          cd test-results/fee-audit
          fetch() {
            gh api "repos/0xMiden/wallet/actions/artifacts/$1/zip" > "$3.zip"
            printf '%s  %s\n' "$2" "$3.zip" | sha256sum --check --status
          }
          fetch 14773554378 68105ebc7770627a096f78bfd96b02e92007079fa0bf9d3e63a1d4f15a77e440 swap
          fetch 14774097073 9c8be3f5adfe625f78b8f5b1482ed112c456a5be6726b58e4e708d1b020f288a epoch
          fetch 14773294895 d6617719cd9c1fd920ad193b5e97af27101d1de923dd5fa5fa8b8b4b02517e9e nightly
          unzip -p swap.zip roundtrip.json > swap.json
          unzip -p epoch.zip roundtrip.json > epoch.json
          unzip -p nightly.zip mainnet-swap-forward-claim.json > forward.json
          unzip -p nightly.zip mainnet-swap-reverse-claim.json > reverse.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - run: yarn test:e2e:blockchain:build
        env:
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      - name: Audit canonical fees without transaction authorization
        env:
          E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
        run: |
          umask 077
          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/fee-audit-private" xvfb-run -a yarn playwright test green12-fee-audit.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/fee-audit-private.log" 2>&1
          jq -Rcer 'select(startswith("GREEN12_FEE_AUDIT "))|split(" ")[1]|fromjson|{swapFees,swapCostUsdMicros,epochNativeFee,epochCostUsdMicros,netCostUsdMicros,custodyMatches}' "$RUNNER_TEMP/fee-audit-private.log"

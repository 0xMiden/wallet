name: Read-only original mainnet swap review
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
  actions: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_NETWORK: mainnet
      E2E_MAINNET_PLAIN_SEED: ${{ secrets.E2E_MAINNET_PLAIN_SEED }}
      E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
      E2E_MAINNET_EVM_KEY: ${{ secrets.E2E_MAINNET_EVM_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@v4
        with:
          run-id: 43410679381
          github-token: ${{ github.token }}
          name: mainnet-swap-final-43410679381
          path: test-results/original-unspent
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - name: Install Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - name: Reuse the exact owned provider overlay
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-loop-config.ts --bundle --platform=node --format=esm --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-loop-config.mjs
          node scripts/mainnet-loop-config-server.mjs > "$RUNNER_TEMP/mainnet-config.log" 2>&1 &
          pid=$!
          for n in $(seq 1 30); do
            if grep -q '^Nightly mainnet snapshot ready at http://127.0.0.1:' "$RUNNER_TEMP/mainnet-config.log" && grep -q '^MIDEN_REMOTE_CONFIG_URL=http://127.0.0.1:' "$GITHUB_ENV"; then exit 0; fi
            kill -0 "$pid"; sleep 1
          done
          echo 'Read-only overlay unavailable'; exit 1
      - name: Build the same mainnet extension
        run: yarn test:e2e:blockchain:build
      - name: Reproduce review only, never arm or submit
        run: |
          umask 077
          code=0
          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/review-results" xvfb-run -a yarn playwright test mainnet-swap-review-probe.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/read-only-review.log" 2>&1 || code=$?
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const path = 'test-results/read-only-swap-review.json';
          if (!existsSync(path)) { console.log('Read-only probe stopped before approved diagnostics; private process logs remain private.'); process.exit(1); }
          const value = JSON.parse(readFileSync(path, 'utf8'));
          const allowed = ['purpose','initialBalance','eta','reviewReady','minimumReceive','errorKind','flowVisible','reviewVisible','pay','receive','finalBalance','rowsUnchanged','noAuthority'];
          if (!value || Object.keys(value).some(key => !allowed.includes(key))) throw new Error('Unexpected diagnostic fields');
          console.log(JSON.stringify(value));
          NODE
          exit "$code"

name: Mainnet harness regression proof

on:
  push:
    branches: [wiktor/nightly-loop-proof]

permissions:
  contents: read

concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: true

jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Verify immutable source and mainnet helpers
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          yarn jest scripts/mainnet-*.test.ts playwright/e2e/config/mainnet-nightly.test.ts playwright/e2e/harness/spec-selection.test.ts --maxWorkers=2 --watch=false
          yarn lint:e2e
          E2E_NETWORK=mainnet yarn playwright test --config playwright.mainnet.config.ts --list
          yarn ts

name: Green13 NEAR Send review (read only)
on:
  push:
    branches: [wiktor/green13-near-readonly]
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_NETWORK: mainnet
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact settlement archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          base=3f2e9134360616f82490a113d185a5f206fc1156
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(gh run list -w e2e-mainnet-nightly.yml -L 1 --json databaseId,status --jq '.[0]|[.databaseId,.status]|join(":")')" = 45092013711:completed
          test "$(git diff --name-only "$base" HEAD)" = "$(printf '%s\n' .github/workflows/nightly-loop-proof.yml playwright/e2e/tests/mainnet/green13-near-readonly.spec.ts)"
          umask 077
          gh api repos/0xMiden/wallet/actions/artifacts/14782587076/zip > "$RUNNER_TEMP/near.zip"
          printf '%s  %s\n' df0cdddac0f5d7e393e33f27eef290790dc4cdae789c51c082dd3f488517c490 "$RUNNER_TEMP/near.zip" | sha256sum --check --status
          test "$(unzip -Z1 "$RUNNER_TEMP/near.zip")" = roundtrip.json
          mkdir -p test-results/near-readonly
          unzip -p "$RUNNER_TEMP/near.zip" roundtrip.json > test-results/near-readonly/roundtrip.json
          printf '%s  %s\n' 5c71be7ebac3e379684182de9d120994193d0a7d1ba7cee5dc503bf0e214fa1e test-results/near-readonly/roundtrip.json | sha256sum --check --status
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - name: Start owned provider loop config
        shell: bash
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-loop-config.ts --bundle --platform=node --format=esm --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-loop-config.mjs
          node scripts/mainnet-loop-config-server.mjs > "$RUNNER_TEMP/mainnet-config.log" 2>&1 &
          pid=$!
          for ((i = 0; i < 30; i++)); do
            if grep -q '^Nightly mainnet snapshot ready at http://127.0.0.1:' "$RUNNER_TEMP/mainnet-config.log" && grep -q '^MIDEN_REMOTE_CONFIG_URL=http://127.0.0.1:' "$GITHUB_ENV"; then exit 0; fi
            kill -0 "$pid"; sleep 1
          done
          echo 'Owned provider overlay did not become ready.' >&2; exit 1
      - run: yarn test:e2e:blockchain:build
        env:
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      - name: Observe NEAR custody and Send review without arming
        shell: bash
        env:
          E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
        run: |
          umask 077
          rc=0
          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/near-audit-private" xvfb-run -a yarn playwright test green13-near-readonly.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/near-audit-private.log" 2>&1 || rc=$?
          if test -f test-results/near-readonly-result.json; then
            jq -c '{stage,custodyMatches,providerUnused,reviewReached}' test-results/near-readonly-result.json
          fi
          exit "$rc"

name: Original claim public inclusion and shared allowance audit
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
  actions: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@v4
        with:
          run-id: 43509688294
          github-token: ${{ github.token }}
          name: mainnet-swap-final-43509688294
          path: test-results/final
      - uses: actions/download-artifact@v4
        with:
          run-id: 43509688294
          github-token: ${{ github.token }}
          name: mainnet-swap-reverse-claim-sdk-authorized-43509688294
          path: test-results/sdk
      - uses: actions/download-artifact@v4
        with:
          run-id: 43509688294
          github-token: ${{ github.token }}
          name: mainnet-nightly-43509688294
          path: test-results/public
      - uses: actions/download-artifact@v4
        with:
          run-id: 43485129750
          github-token: ${{ github.token }}
          name: mainnet-swap-final-43485129750
          path: test-results/prior
      - name: Independent public nullifier, retained authorities and remaining cap
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-swap-claim.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-swap-claim.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {Address,RpcClient,Endpoint} from '@miden-sdk/miden-sdk';
          import {readMainnetSwapPayback} from './node_modules/.cache/nightly-swap-claim.mjs';
          const read=path=>JSON.parse(readFileSync(path,'utf8'));
          const state=read('test-results/final/roundtrip.json');
          const sdk=read('test-results/sdk/roundtrip.json');
          const prior=read('test-results/prior/roundtrip.json');
          const receipt=read('test-results/public/mainnet-swap-recovery-claim.json');
          assert.equal(state.phase,'complete');assert.equal(sdk.phase,'reverse-authorized');
          assert.equal(state.sourceRunId,'43427924008');assert.equal(state.authorizationRunId,'43485129750');assert.equal(state.recoveredRunId,'43509688294');
          for(const key of ['account','createdAt','pricedAt','offer','request','native','principal','feeBudget','baseFee','forwardRequestAuthority','reverseRequestAuthority','recoveryReturnAuthorizedAt','recoveryReturnReplacement','returnBaseline']) assert.deepEqual(state[key],prior[key],key);
          assert.deepEqual(state.reverseClaimAuthority,sdk.reverseClaimAuthority);
          assert.equal(state.reverseClaimAuthority.noteId,receipt.paybackNoteId);
          assert.equal(state.reverseClaimAuthority.amount,receipt.paybackAmount);
          assert.equal(sdk.recoveryClaimNativeBefore,'18987229');assert.equal(sdk.paidFees,'399');
          const authority=state.reverseRequestAuthority;
          const proof=await readMainnetSwapPayback('https://rpc.mainnet.miden.io',{kind:'swap',accountId:Address.fromBech32(state.account).accountId().toString(),faucetId:state.request.hex,amount:state.returnAmount,requestedFaucetId:state.offer.hex,requestedAmount:authority.minimumReceive,noteId:authority.noteId,orderId:authority.orderId});
          assert.ok(proof);assert.equal(proof.noteId,receipt.paybackNoteId);assert.equal(proof.amount,1010066n);assert.equal(proof.claimedAtBlock,866163);
          assert.equal(proof.originalCreatedAtBlock,receipt.creationAtBlock);assert.equal(proof.createdAtBlock,receipt.paybackCreatedAtBlock);
          const rpc=new RpcClient(new Endpoint('https://rpc.mainnet.miden.io'));
          const header=await rpc.getBlockHeaderByNumber(proof.claimedAtBlock);
          assert.equal(header.blockNum(),receipt.claimedAtBlock);
          assert.ok(header.timestamp()*1000<=state.reverseClaimAuthority.expiresAt);
          const claimFee=BigInt(receipt.claimFee),nativeFinal=BigInt(receipt.nativeFinal);
          assert.equal(claimFee,133n);assert.equal(BigInt(sdk.recoveryClaimNativeBefore)+proof.amount-claimFee,nativeFinal);assert.equal(nativeFinal,19997162n);assert.equal(receipt.requestFinal,'0');
          assert.equal(BigInt(sdk.paidFees)+claimFee,BigInt(state.paidFees));assert.equal(state.paidFees,receipt.aggregateNativeCosts);assert.equal(state.paidFees,'532');
          const debit=BigInt(state.native.balance)-nativeFinal;
          const cost=(debit*BigInt(state.native.usdMicros)+999999n)/1000000n;
          assert.equal(cost,894n);assert.equal(cost.toString(),state.realizedCostUsdMicros);assert.equal(state.realizedCostUsdMicros,receipt.realizedCostUsdMicros);
          const allowance=2000000n-cost;assert.equal(allowance,1999106n);
          console.log(JSON.stringify({purpose:'keyless original recovery claim and reduced shared allowance audit, not fresh provider acceptance',sourceRunId:state.sourceRunId,authorityRunId:state.authorizationRunId,claimRunId:state.recoveredRunId,paybackNoteId:proof.noteId,paybackAmount:proof.amount.toString(),claimedAtBlock:proof.claimedAtBlock,claimTransactionId:receipt.claimTransactionId,claimFee:claimFee.toString(),aggregateNativeCosts:state.paidFees,nativeFinal:nativeFinal.toString(),requestFinal:receipt.requestFinal,originalAuthoritiesUnchanged:true,sdkClaimFingerprintUnchanged:true,claimWithinFrozenDeadline:true,realizedCostUsdMicros:cost.toString(),freshQualificationAllowanceUsdMicros:allowance.toString(),vaultAccountingSource:'actual signed claim receipt and runner vault reconciliation; no fabricated historical per-transaction fees'}));
          NODE

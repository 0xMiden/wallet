name: Original Epoch returned-owner cancellation contract qualification
on:
  push:
    branches: [wiktor/green02-epoch-owner-refund-retire]
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  owner-refund-retirement-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 32
      - name: Bind isolated changes to actual post-disable audit source
        run: |
          git merge-base --is-ancestor 9937b4d7872e90b90d1aa8c323b08846b74f13fc HEAD
          test "$(git diff --name-only 9937b4d7872e90b90d1aa8c323b08846b74f13fc HEAD)" = "$(printf '%s\n' .github/workflows/e2e-mainnet-nightly.yml .github/workflows/nightly-loop-proof.yml docs/superpowers/plans/2026-11-17-original-epoch-owner-refund-retirement.md docs/superpowers/specs/2026-11-17-original-epoch-owner-refund-retirement.md scripts/retire-original-epoch-owner-refund.mjs test/epoch-owner-refund-retirement.node.test.mjs)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44034323631
          github-token: ${{ github.token }}
          name: mainnet-epoch-final-44034323631
          path: test-results/epoch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 44073655271
          github-token: ${{ github.token }}
          name: original-compact-disabled-phase-independent-audit
          path: test-results
      - name: Bind original checkpoint and actual audited fixture provenance only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/0xMiden/wallet/actions/runs/44034323631 > "$RUNNER_TEMP/producer.json"
          gh api repos/0xMiden/wallet/actions/runs/44073655271 > "$RUNNER_TEMP/audit.json"
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto');const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/producer.json')),r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/audit.json'));a.equal(p.head_sha,'775f30df7ab450165d82f0f2ddd9ff1742431585');a.equal(p.run_attempt,1);a.equal(p.conclusion,'failure');a.equal(r.head_sha,'9937b4d7872e90b90d1aa8c323b08846b74f13fc');a.equal(r.run_attempt,1);a.equal(r.conclusion,'success');a.equal(crypto.createHash('sha256').update(fs.readFileSync('test-results/epoch/roundtrip.json')).digest('hex'),'77652e5b0590797753f5fe920d79fec252af3411a5b125a663a12d77f60e40a1');
          NODE
      - name: Original financial guard contracts and exact-case cancelled checkpoint behavior
        run: node --test test/compact-owner-recovery.node.test.mjs test/epoch-owner-refund-retirement.node.test.mjs
      - name: Existing loader and writer smoke on audited unit fixtures only, no canonical publication
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-epoch-checkpoint.ts --bundle --platform=node --format=esm --outfile=node_modules/.cache/nightly-epoch-checkpoint.mjs
          node scripts/retire-original-epoch-owner-refund.mjs

name: Retained unsigned Swap return regression
on:
  push:
    branches: [wiktor/nightly-swap-retained-return-red-proof]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD^)" = f3ab4320c54acbf32a58835b8097ec90f4986b2a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Verify intended failing assertion and passing neighbors
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-swap-claim.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-swap-claim.mjs
          status=0
          node --test --test-concurrency=2 scripts/mainnet-swap-claim.test.mjs > "$RUNNER_TEMP/red.tap" 2>&1 || status=$?
          grep -E '^not ok |^# (tests|pass|fail) ' "$RUNNER_TEMP/red.tap"
          test "$status" = 1
          grep -Eq '^not ok [0-9]+ - accepts exact retained return preparation' "$RUNNER_TEMP/red.tap"
          grep -Fq 'Recovery return already prepared or issued; never renew its authority' "$RUNNER_TEMP/red.tap"
          grep -Fxq '# fail 1' "$RUNNER_TEMP/red.tap"
          grep -Eq '^# pass [1-9][0-9]*$' "$RUNNER_TEMP/red.tap"

name: Wallet popup diagnostic proof
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  popup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: browser-actions/setup-chrome@v1
      - uses: ./.github/actions/start-eligibility-fixture
        env:
          E2E_FIXTURE_PRELAUNCH_TESTNET: 'true'
      - name: Build the identical mocked extension
        run: yarn build:chrome
        env:
          MIDEN_USE_MOCK_CLIENT: 'true'
          MIDEN_E2E_DISABLE_SIDEPANEL: 'false'
      - name: Verify extension output
        run: node -e "const fs=require('node:fs'); JSON.parse(fs.readFileSync('dist/chrome_unpacked/manifest.json','utf8'));"
      - uses: ./.github/actions/apt-drop-unused-repos
      - name: Install Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Run the actual strict popup test with origin-only diagnostics
        run: xvfb-run -a yarn test:e2e playwright/tests/popup-smoke.spec.ts --grep 'loads UI without console errors' --workers=1 --retries=0

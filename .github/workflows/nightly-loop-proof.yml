name: Public input note discovery regression RED
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Exact public import, identity denial and retired hold
        run: yarn jest src/lib/miden/swap/test-hooks.test.ts --maxWorkers=2 --watch=false --testNamePattern='public input note|public import|public note discovery'

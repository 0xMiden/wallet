name: Nightly Guardian mock identity proof
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable source
        run: |
          SOURCE=$(git rev-parse HEAD^2)
          test "$(git diff --name-only "$SOURCE" HEAD)" = .github/workflows/nightly-loop-proof.yml
          printf 'Verified source %s\n' "$SOURCE"
      - uses: ./.github/actions/yarn-install
      - name: Prove warm resolver mock identity
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const Resolver = require('jest-resolve').default;
          const root = process.cwd();
          const moduleMap = { getModule: () => null, getPackage: () => null, getMockModule: () => null };
          const options = { rootDir: root, extensions: ['.ts', '.tsx', '.js', '.json', '.node'], moduleDirectories: ['node_modules'], hasCoreModules: true };
          const importer = path.join(root, 'src/lib/miden/transaction/index.ts');
          const fixture = path.join(root, 'src/lib/miden/transaction/transactions.guardian-offscreen.test.ts');
          const name = '../sdk/test-guardian-authorization';
          const resolver = new Resolver(moduleMap, options);
          resolver.getModuleID(new Map(), importer, name);
          const virtual = new Map([[resolver.getModulePath(fixture, name), true]]);
          assert.notEqual(resolver.getModuleID(virtual, fixture, name), resolver.getModuleID(virtual, importer, name), 'virtual fixture and warm actual import split identity');
          const fixed = new Resolver(moduleMap, options);
          fixed.getModuleID(new Map(), importer, name);
          assert.equal(fixed.getModuleID(new Map(), fixture, name), fixed.getModuleID(new Map(), importer, name), 'ordinary mock retains actual module identity');
          console.log('Verified actual Jest resolver: warm virtual mock splits identity; ordinary existing-module mock preserves identity.');
          NODE
      - name: Guardian execution boundary regressions
        run: yarn jest src/lib/miden/transaction/transactions.guardian-offscreen.test.ts src/offscreen/main.test.ts scripts/mainnet-guardian-authorization.test.ts --maxWorkers=2 --watch=false
      - name: Owned formatting
        if: always()
        run: |
          yarn prettier --write src/lib/miden/transaction/transactions.guardian-offscreen.test.ts src/offscreen/main.test.ts playwright/e2e/helpers/mainnet-swap-ui.ts
          git diff --binary -- src/lib/miden/transaction/transactions.guardian-offscreen.test.ts src/offscreen/main.test.ts playwright/e2e/helpers/mainnet-swap-ui.ts > guardian-owned-format.patch
          test ! -s guardian-owned-format.patch
      - name: Retain owned formatting correction
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-owned-format
          path: guardian-owned-format.patch
          if-no-files-found: ignore

name: Explicit retained return replacement integration GREEN
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
  actions: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Actual SDK retained replacement and original request contracts
        run: |
          yarn esbuild playwright/e2e/helpers/mainnet-swap-claim.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-swap-claim.mjs
          yarn esbuild src/lib/miden/sdk/test-send-request.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-send-request.mjs
          node --test --test-concurrency=2 scripts/mainnet-swap-claim.test.mjs scripts/mainnet-swap-request.test.mjs scripts/mainnet-send-request.test.mjs
      - name: All connected mainnet contracts and lint
        if: always()
        run: |
          yarn jest scripts/mainnet-*.test.ts playwright/e2e/config/mainnet-nightly.test.ts --maxWorkers=2 --watch=false
          yarn lint:e2e
      - name: Canonical connected types
        if: always()
        run: yarn ts
      - uses: actions/download-artifact@v4
        with:
          run-id: 43461752016
          github-token: ${{ github.token }}
          name: mainnet-swap-final-43461752016
          path: test-results/previous-return
      - name: Actual failed-source and current absence reader without financial keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { readMainnetSwapReturnAbsence } from './node_modules/.cache/nightly-swap-claim.mjs';
          const state = JSON.parse(readFileSync('test-results/previous-return/roundtrip.json','utf8'));
          const result = await readMainnetSwapReturnAbsence('https://rpc.mainnet.miden.io',state);
          assert.equal(result.previousRunId,'43461752016');
          assert.equal(result.noteId,state.reverseRequestAuthority.noteId);
          assert.equal(result.noteCount,0);
          assert.ok(result.atTime>state.reverseRequestAuthority.expiresAt);
          assert.ok(Date.now()-result.atTime>=0&&Date.now()-result.atTime<120000);
          console.log(JSON.stringify({purpose:'read-only failed source and fresh absence; no keys, authority or writes',...result}));
          NODE
      - name: Owned format patch
        if: always()
        run: |
          yarn prettier --write .github/workflows/e2e-mainnet-nightly.yml playwright/e2e/helpers/mainnet-swap-claim.ts playwright/e2e/helpers/mainnet-swap-checkpoint.ts playwright/e2e/tests/mainnet/mainnet-swap-loop.spec.ts scripts/mainnet-swap-claim.test.mjs scripts/mainnet-swap-checkpoint.test.ts scripts/mainnet-swap-workflow.test.ts
          git diff --binary -- .github/workflows/e2e-mainnet-nightly.yml playwright/e2e/helpers/mainnet-swap-claim.ts playwright/e2e/helpers/mainnet-swap-checkpoint.ts playwright/e2e/tests/mainnet/mainnet-swap-loop.spec.ts scripts/mainnet-swap-claim.test.mjs scripts/mainnet-swap-checkpoint.test.ts scripts/mainnet-swap-workflow.test.ts > replacement-owned-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replacement-owned-format
          path: replacement-owned-format.patch
          if-no-files-found: error

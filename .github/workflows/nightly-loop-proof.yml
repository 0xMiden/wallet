name: Independent no-spend NEAR reconciliation audit
on:
  push:
    branches: [wiktor/near-recovery-zero-audit]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: e2e-mainnet-nightly
  cancel-in-progress: false
jobs:
  public-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Bind original qualified application and audit-only overlay
        run: |
          test "$(git merge-base 9b57c6f10eae6b2c84b74ae18d486ce21ca92128 HEAD)" = 9b57c6f10eae6b2c84b74ae18d486ce21ca92128
          test "$(git diff --name-only 9b57c6f10eae6b2c84b74ae18d486ce21ca92128 HEAD)" = "$(printf '%s\n' .github/workflows/nightly-loop-proof.yml playwright/e2e/tests/mainnet/recovery-zero-private.spec.ts scripts/recovery-zero-public.mjs)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43947551561
          github-token: ${{ github.token }}
          pattern: mainnet-*-43947551561
          path: test-results/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43811169447
          github-token: ${{ github.token }}
          name: mainnet-1click-final-43811169447
          path: test-results/original-near
      - name: Bind immutable recovery snapshots
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const [name,role] of Object.entries({'mainnet-swap-final':'fresh','mainnet-epoch-final':'final','mainnet-1click-final':'near','mainnet-nightly':'public'}))fs.cpSync(`test-results/evidence/${name}-43947551561`,`test-results/${role}`,{recursive:true});
          NODE
      - name: Independently verify original raw fields, fresh phases skipped, public holdings and cost zero
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recovery-zero-public.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recovery-zero-public-audit
          path: test-results/recovery-zero-public-audit.json
  private-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_NETWORK: mainnet
      MIDEN_E2E_MAINNET_NIGHTLY: 'true'
      WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_ONE_CLICK_E2E_PROJECT_ID }}
      E2E_MAINNET_GUARDIAN_KEY_PAIR: ${{ secrets.E2E_MAINNET_GUARDIAN_KEY_PAIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked Guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43947551561
          github-token: ${{ github.token }}
          pattern: mainnet-*-43947551561
          path: test-results/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43811169447
          github-token: ${{ github.token }}
          name: mainnet-1click-final-43811169447
          path: test-results/original-near
      - name: Bind immutable recovery snapshots
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const [name,role] of Object.entries({'mainnet-swap-final':'fresh','mainnet-epoch-final':'final','mainnet-1click-final':'near','mainnet-nightly':'public'}))fs.cpSync(`test-results/evidence/${name}-43947551561`,`test-results/${role}`,{recursive:true});
          NODE
      - uses: ./.github/actions/install-miden-client-cli
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/start-eligibility-fixture
      - run: yarn test:e2e:blockchain:build
      - name: Independently restore original private holdings without any spending policy
        run: |
          umask 077
          code=0
          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/recovery-zero-private" xvfb-run -a yarn playwright test recovery-zero-private.spec.ts --config playwright.mainnet.config.ts --workers=1 --retries=0 > "$RUNNER_TEMP/recovery-zero-private.log" 2>&1 || code=$?
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          for(const file of ['test-results/recovery-zero-private-status.json','test-results/recovery-zero-private-audit.json','test-results/recovery-readonly-diagnostic.json'])if(existsSync(file))console.log(JSON.stringify(JSON.parse(readFileSync(file,'utf8'))));
          NODE
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recovery-zero-private-audit
          path: |
            test-results/recovery-zero-private-status.json
            test-results/recovery-zero-private-audit.json
            test-results/recovery-readonly-diagnostic.json

name: Read-only transport and remaining-budget regression RED
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify frozen source
        run: test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Functional transport and workflow RED with budget and codec GREEN
        run: yarn jest scripts/mainnet-loop-upload.test.ts scripts/mainnet-swap-workflow.test.ts scripts/mainnet-loop-budget.test.ts scripts/mainnet-swap-checkpoint.test.ts --maxWorkers=2 --watch=false
      - name: Connected types
        if: always()
        run: yarn ts && yarn tsc --project playwright.mainnet.tsconfig.json

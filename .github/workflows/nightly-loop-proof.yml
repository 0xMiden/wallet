name: PSWAP protocol order regression proof
on:
  push:
    branches: [wiktor/nightly-loop-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-loop-regression-proof
  cancel-in-progress: false
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify immutable source
        run: |
          test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-loop-proof.yml
          printf 'Verified source %s\n' "$(git rev-parse HEAD^2)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Build exact actual SDK inspector
        run: yarn esbuild src/lib/miden/sdk/test-send-request.ts --bundle --platform=node --format=esm --alias:@miden-sdk/miden-sdk/lazy=@miden-sdk/miden-sdk --external:@miden-sdk/miden-sdk --outfile=node_modules/.cache/nightly-send-request.mjs
      - name: Actual SDK protocol order regression
        run: node --test --test-concurrency=2 scripts/mainnet-swap-request.test.mjs
      - name: Verify original public note without wallet keys or writes
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { RpcClient, Endpoint, NoteId, Word, Address, NoteArray, TransactionRequestBuilder } from '@miden-sdk/miden-sdk';
          import { inspectTestMainnetSwapRequest } from './node_modules/.cache/nightly-send-request.mjs';
          const noteId = '0xa026c7215add3ace6074d40ee30735489ce414dc2925b899b5004e3390df7bfa';
          const actor = Address.fromBech32('mm1aqtc4ltp5usswqfx7s22ks3qg5g4kyr5').accountId().toString();
          const rpc = new RpcClient(new Endpoint('https://rpc.mainnet.miden.io'));
          const fetched = await rpc.getNotesById([NoteId.fromHex(noteId)]);
          assert.equal(fetched.length, 1);
          const record = fetched[0];
          assert.equal(record.noteId.toString(), noteId);
          assert.equal(record.metadata.sender().toString(), actor);
          const proof = record.inclusionProof;
          const header = await rpc.getBlockHeaderByNumber(855895);
          assert.equal(proof.location().blockNum(), 855895);
          assert.equal(header.blockNum(), 855895);
          assert.equal(proof.notePath().verify(BigInt(proof.location().blockNoteTreeIndex()), Word.fromHex(noteId), header.noteRoot()), true);
          const note = record.note;
          assert.ok(note, 'Original public body unavailable; do not infer an order identity');
          const request = new TransactionRequestBuilder().withOwnOutputNotes(new NoteArray([note])).withExpirationDelta(600).build();
          const scope = { kind: 'swap', accountId: actor, faucetId: '0xe69e6ca6e39df1b10c1e5399399feb', amount: '1010428', requestedFaucetId: '0x5cb79d29507d3ad17bb6dc60279e89', requestedAmount: '1010384' };
          assert.equal(inspectTestMainnetSwapRequest(scope, Uint8Array.from(request.serialize())).noteId, noteId);
          const serial = note.recipient().serialNum().toU64s();
          assert.equal(serial[0].toString(), '4527770481039375833');
          assert.notEqual(serial[1], serial[0]);
          console.log(JSON.stringify({ purpose: 'Original public note historical SDK proof; no wallet keys, signatures or writes', noteId, blockNumber: 855895, verified: true, exactReviewedNote: true, recordedIdMatchesSerial0: true, protocolOrderId: serial[1].toString() }));
          NODE

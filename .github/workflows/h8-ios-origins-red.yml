name: H8 iOS closed origin regression proof
on:
  push:
    branches: [ci/h8-ios-origins-red]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD^)" = a0f5e3992ee55290040129a1179d7ce35cd88f2c
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/yarn-install
      - name: Prove closed origins functional red
        run: |
          mkdir -p proof
          set +e
          yarn jest --runTestsByPath src/lib/walletconnect/native-request-failure.test.ts --testNamePattern='requires exact prefix and mandatory enums|accepts iOS fixed call origin' --maxWorkers=2 --json --outputFile=proof/results.json > proof/jest.log 2>&1
          result=$?
          set -e
          cat proof/jest.log
          test "$result" -ne 0
          node -e 'const r=require("./proof/results.json");const a=r.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status==="failed");console.log(JSON.stringify({failed:a.length,runtime:r.numRuntimeErrorTestSuites,names:a.map(t=>t.fullName)}));if(r.numRuntimeErrorTestSuites!==0||a.length!==3||a.some(t=>!t.failureMessages.join(" ").includes("expect(")))process.exit(1)'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: h8-ios-origins-red, path: proof/ }

name: NEVER-MERGE 1616 Earn first-query expected red v2
on:
  push:
    branches: [ci/1616-earn-first-query-red-v2]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_OPTIONAL_LOCKS: '0'
      CI: 'true'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Bind exact signed test-only source
        run: |
          set -euo pipefail
          umask 077
          proof="$RUNNER_TEMP/1616-earn-first-query-red-v2"
          test ! -e "$proof"
          mkdir "$proof"
          printf 'PROOF_DIR=%s\n' "$proof" >> "$GITHUB_ENV"
          cat > "$proof/capture.py" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          OUT = Path(os.environ['PROOF_DIR'])
          BIND = json.loads((OUT / 'bindings.json').read_text())
          SOURCE = BIND['source']
          FRAMEWORK = ['jest', 'expect', 'jest-circus', 'jest-config', 'jest-runtime', 'jest-resolve',
                       'jest-runner', 'jest-environment-jsdom', '@jest', '@swc', 'typescript', 'prettier',
                       'eslint', 'eslint-plugin-import', 'react', 'react-dom', '@testing-library/react',
                       '@testing-library/dom', 'dexie', 'fake-indexeddb', 'constate',
                       '@epoch-protocol/epoch-intents-sdk', 'viem', '@miden-sdk/miden-sdk']


          def git(*args):
              return subprocess.check_output(['git', *args], cwd=ROOT)


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def save(name, value):
              (OUT / name).write_text(json.dumps(value, indent=2) + '\n')


          def snapshot(label):
              assert git('rev-parse', 'HEAD').decode().strip() == SOURCE
              assert git('rev-parse', 'HEAD^{tree}').decode().strip() == BIND['tree']
              assert not git('diff', '--name-only') and not git('diff', '--cached', '--name-only')
              assert not git('status', '--porcelain=v1', '--untracked-files=all')
              stage = git('ls-files', '--stage', '-z')
              (OUT / (label + '.stage.nul')).write_bytes(stage)
              files = {}
              for record in stage.split(b'\0'):
                  if not record:
                      continue
                  header, raw_path = record.split(b'\t', 1)
                  mode, oid, number = header.decode().split()
                  assert number == '0' and mode in ['100644', '100755', '120000']
                  path = raw_path.decode()
                  p = ROOT / path
                  info = p.lstat()
                  if mode == '120000':
                      assert stat.S_ISLNK(info.st_mode)
                      data = os.readlink(p).encode()
                      kind = 'symlink'
                  else:
                      assert stat.S_ISREG(info.st_mode) and not p.is_symlink()
                      assert bool(info.st_mode & 0o111) == (mode == '100755')
                      data = p.read_bytes()
                      kind = 'regular'
                  assert data == git('cat-file', 'blob', oid), path
                  files[path] = {'git_mode': mode, 'oid': oid, 'sha256': digest(data), 'bytes': len(data),
                                 'physical_mode': format(stat.S_IMODE(info.st_mode), '04o'), 'type': kind}
              for entry in BIND['source_inputs']:
                  assert files[entry['path']]['sha256'] == entry['sha256']
                  assert files[entry['path']]['git_mode'] == entry['git_mode']
              framework = {}
              versions = {}
              for package in FRAMEWORK:
                  base = ROOT / 'node_modules' / package
                  assert base.is_dir() and not base.is_symlink(), package
                  metadata = base / 'package.json'
                  if metadata.is_file():
                      value = json.loads(metadata.read_text())
                      versions[package] = {'name': value['name'], 'version': value['version'],
                                           'package_json_sha256': digest(metadata.read_bytes())}
                  for p in sorted(base.rglob('*')):
                      info = p.lstat()
                      if p.is_symlink():
                          raw_link = os.readlink(p)
                          target = p.resolve(strict=True)
                          assert target.is_relative_to(ROOT) and target != ROOT, str(p)
                          target_info = target.stat()
                          assert stat.S_ISREG(target_info.st_mode), str(p)
                          data = target.read_bytes()
                          target_hash = digest(data)
                          retained = OUT / 'framework-symlink-target-bytes' / target_hash
                          retained.parent.mkdir(exist_ok=True)
                          if retained.exists():
                              assert retained.read_bytes() == data
                          else:
                              retained.write_bytes(data)
                          framework[str(p.relative_to(ROOT))] = {
                              'type': 'symlink', 'lstat_mode': format(stat.S_IMODE(info.st_mode), '04o'),
                              'raw_link_text': raw_link, 'raw_link_sha256': digest(os.fsencode(raw_link)),
                              'resolved_root_relative_path': str(target.relative_to(ROOT)),
                              'target_bytes': len(data), 'target_sha256': target_hash,
                              'target_mode': format(stat.S_IMODE(target_info.st_mode), '04o'),
                              'target_byte_copy': str(retained.relative_to(OUT))}
                      elif p.is_file():
                          assert p.resolve().is_relative_to(ROOT)
                          data = p.read_bytes()
                          framework[str(p.relative_to(ROOT))] = {
                              'sha256': digest(data), 'bytes': len(data), 'type': 'regular',
                              'mode': format(stat.S_IMODE(info.st_mode), '04o')}
              index = Path(git('rev-parse', '--git-path', 'index').decode().strip())
              if not index.is_absolute():
                  index = ROOT / index
              raw_index = index.read_bytes()
              (OUT / (label + '.index')).write_bytes(raw_index)
              save(label + '.json', {'head': SOURCE, 'tree': BIND['tree'], 'stage_sha256': digest(stage),
                                    'physical_index_sha256': digest(raw_index), 'source': files,
                                    'framework': framework, 'framework_versions': versions})
              if label == 'before':
                  with tarfile.open(OUT / 'bound-source.tar', 'w') as archive:
                      for entry in BIND['source_inputs']:
                          archive.add(ROOT / entry['path'], arcname=entry['path'], recursive=False)


          def classify():
              gates = ['install', 'format', 'lint', 'types']
              prerequisite = {name: {'exit': (OUT / (name + '.exit')).read_text().strip(),
                                     'tee': (OUT / (name + '.tee.exit')).read_text().strip()}
                              for name in gates if (OUT / (name + '.exit')).exists()}
              save('prerequisite-exits.json', prerequisite)
              if len(prerequisite) != len(gates) or any(v != {'exit': '0', 'tee': '0'} for v in prerequisite.values()):
                  save('classification.json', {'status': 'UNRUN_RUNTIME_PREREQUISITE', 'gates': prerequisite})
                  raise SystemExit(1)
              before = json.loads((OUT / 'before.json').read_text())
              after = json.loads((OUT / 'after.json').read_text())
              for key in ['head', 'tree', 'stage_sha256', 'source', 'framework', 'framework_versions']:
                  assert before[key] == after[key], key
              save('bookend-comparison.json', {'source_stage_framework_equal': True,
                   'raw_index_equal': before['physical_index_sha256'] == after['physical_index_sha256'],
                   'raw_index_policy': 'Both complete raw indices retained; textual stage and all physical source hashes must match.'})
              x = json.loads((OUT / 'jest.json').read_text())
              rows = []
              for suite in x['testResults']:
                  path = str(Path(suite['name']).relative_to(ROOT))
                  for ordinal, row in enumerate(suite['assertionResults']):
                      rows.append({'file': path, 'ordinal': ordinal, 'assertion': row})
              save('inventory.json', rows)
              assert {str(Path(s['name']).relative_to(ROOT)) for s in x['testResults']} == set(BIND['tests'])
              assert len(x['testResults']) == 3 and x['numTotalTestSuites'] == 3
              assert x['numRuntimeErrorTestSuites'] == 0
              assert x['numPendingTests'] == 0 and x['numTodoTests'] == 0
              assert x['numTotalTests'] == 78 and len(rows) == 78
              assert x['numFailedTests'] == 1 and x['numPassedTests'] == 77
              assert x['numFailedTestSuites'] == 1 and x['numPassedTestSuites'] == 2
              for path, names in BIND['expected_names'].items():
                  observed = [r['assertion']['fullName'] for r in rows if r['file'] == path]
                  assert observed == names, path
              new = [r['assertion'] for r in rows if r['file'] == BIND['tests'][0]]
              assert len(new) == 8 and sum(a['numPassingAsserts'] for a in new) == 41
              for case, row in zip(BIND['new_suite_cases'], new):
                  assert row['status'] == case['prediction']
                  wanted = 13 if case['prediction'] == 'failed' else case['authored_assertion_count']
                  assert row['numPassingAsserts'] == wanted
              for record in rows:
                  row = record['assertion']
                  assert row['invocations'] == 1 and row['retryReasons'] == []
                  if row['status'] == 'failed':
                      assert record['file'] == BIND['tests'][0] and row['fullName'] == new[0]['fullName']
                      assert len(row['failureDetails']) == 1 and len(row['failureMessages']) == 1
                      result = row['failureDetails'][0]['matcherResult']
                      assert result['name'] == 'toEqual' and result['pass'] is False
                      assert result['actual'] == []
                      assert result['expected'] == [['raw_earn_withdraw_failed', 'status_screen']]
                      assert isinstance(result['message'], str) and result['message']
                      frames = re.findall(re.escape(BIND['tests'][0]) + r':(\d+):(\d+)', row['failureMessages'][0])
                      assert frames and frames[0] == ('367', '62')
                  else:
                      assert row['status'] == 'passed' and not row['failureMessages'] and not row['failureDetails']
              assert (OUT / 'jest.exit').read_text().strip() == '1'
              assert (OUT / 'jest.tee.exit').read_text().strip() == '0'
              save('classification.json', {'status': 'EXACT_EXPECTED_CAUSAL_RED', 'source': SOURCE,
                   'normal_cases': 78, 'old_compatibility_passed': 70, 'new_passed': 7, 'new_failed': 1,
                   'new_passing_assertions': 41, 'new_reached_assertions': 42,
                   'first_frame': '367:62', 'prior_passing_assertions': 13,
                   'no_production_green_or_whole_branch_acceptance': True})


          def seal():
              files = []
              for p in sorted(OUT.rglob('*')):
                  if p.is_file() and p.name != 'hashes.json':
                      assert not p.is_symlink()
                      files.append({'path': str(p.relative_to(OUT)), 'bytes': p.stat().st_size,
                                    'sha256': digest(p.read_bytes()), 'type': 'regular',
                                    'mode': format(stat.S_IMODE(p.stat().st_mode), '04o')})
              save('hashes.json', files)


          if sys.argv[1] == 'snapshot':
              snapshot(sys.argv[2])
          elif sys.argv[1] == 'classify':
              try:
                  classify()
              except Exception as error:
                  save('classification-refusal.json', {'status': 'NOT_ACCEPTED', 'error_type': type(error).__name__,
                                                      'detail': str(error)})
                  raise
          elif sys.argv[1] == 'seal':
              seal()
          else:
              raise SystemExit('unknown operation')
          PY

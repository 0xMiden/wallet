name: Eligibility topology run bounds focused proof
on:
  push:
    branches: [ci/1894-topology-run-green]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = e7ecc800b2f91557dbeea5761c16f34fe2cf01ba
      - name: Exercise admission and failure boundaries
        shell: bash
        run: |
          set -o pipefail
          node --test services/feature-eligibility/staging-topology.test.mjs services/feature-eligibility/staging-topology-run.test.mjs | tee result.log
          grep -F '# tests 12' result.log
          grep -F '# pass 12' result.log
          grep -F '# fail 0' result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-run-green
          path: result.log

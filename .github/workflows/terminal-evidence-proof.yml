name: Terminal evidence focused proof
on:
  push:
    branches: ['ci/terminal-evidence-*']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr
      - name: Run Install
        uses: ./.github/actions/yarn-install
      - name: Verify source proof parent
        run: git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/terminal-evidence-proof.yml'
      - name: Run focused producer and privacy acceptance
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/lib/miden/guardian/proposal-diagnostics.test.ts
            src/lib/telemetry/transaction-failure.test.ts
            src/lib/miden/transaction/transactions.guardian.test.ts
            src/lib/miden/back/miden-client-proxy.test.ts
            src/lib/miden/transaction/transaction-failure-sentry.integration.test.ts
            src/lib/telemetry/crash-diagnostics.test.ts
            src/lib/telemetry/crash.test.ts
            src/lib/telemetry/transaction-failure.worker.test.ts
            src/lib/miden/transaction/proposal-diagnostics.integration.test.ts
          )
          for candidate in src/lib/telemetry/{proposal-create,guardian-proving,offscreen-deadline}-diagnostics.test.ts src/lib/miden/sdk/proposal-create-error-family.test.ts src/lib/miden/transaction/queue-admission-diagnostics.test.ts; do
            if [ -f "$candidate" ]; then files+=("$candidate"); fi
          done
          yarn test --runTestsByPath "${files[@]}" --maxWorkers=2 --ci --json --outputFile=terminal-test-results.json
      - name: Check TypeScript
        run: yarn ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-evidence-results
          path: terminal-test-results.json

name: Eligibility namespace inventory expected red
on:
  push:
    branches: [ci/1894-namespaces-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 7dddeca8a4e6e4a3a9107aa5b583d20ce9ff5f38
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-namespaces.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - namespace inventory accepts only complete matching owned classes' result.log || exit 1
          grep -F 'ok 4 - namespace inventory rejects incomplete or inconsistent pagination' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namespaces-red
          path: result.log

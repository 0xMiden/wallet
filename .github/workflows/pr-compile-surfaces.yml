name: QA 2147 C-01 mutation evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: C-01 all-hunk mutation measurement
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE_SHA: 'a4b2e40d7ad95446bb718820e0b3a38fa01d9af0'
      EXPECTED_SOURCE_TREE: '9c4221f0eb58d5fded335a0791b7ebf3df98d851'
      EXPECTED_SOURCE_PARENT: '1fe48b4a2badf7223e22dfa655c7b5b950e2932f'
      ORIGINAL_REVIEW_HEAD: '657f4b98cb0aa7756865c0030ea11bc99bb7a016'
      PR_BASE_SHA: '94e5ba9b2a40df2e706a323e0155510880cabaa0'
      EXPECTED_QA_BRANCH: 'ci/qa-2147-c01-mutate-9c4221f0-20261112-v1'
      NODE_OPTIONS: '--max-old-space-size=4096'
      UV_THREADPOOL_SIZE: '2'
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - name: Set the evidence path from the runner environment
        shell: bash
        run: printf 'EVIDENCE_DIR=%s/qa-2147-c01-mutation\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: 'a4b2e40d7ad95446bb718820e0b3a38fa01d9af0'
          fetch-depth: 0
          persist-credentials: false
      - name: Record and verify the exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf 'workflow_sha=%s\nworkflow_ref=%s\nsource_sha=%s\nsource_tree=%s\ninstall_lifecycle_scripts=enabled\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$EVIDENCE_DIR/source.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = "$EXPECTED_QA_BRANCH"
          python3 <<'PYBIND'
          import hashlib,json,os,pathlib,subprocess
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          source=os.environ['EXPECTED_SOURCE_SHA'];parent=os.environ['EXPECTED_SOURCE_PARENT'];workflow=os.environ['GITHUB_SHA']
          fix_paths=["src/lib/miden/transaction/index.ts", "src/lib/miden/transaction/transactions.background-matrix.test.ts", "src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts", "src/lib/miden/transaction/transactions.guardian.test.ts", "src/lib/miden/transaction/transactions.send-stage-timings.test.ts", "src/lib/miden/transaction/transactions.test.ts"]
          path_union=["CHANGELOG.md", "src/lib/miden/transaction/effect-checked-signer.test.ts", "src/lib/miden/transaction/index.ts", "src/lib/miden/transaction/proposal-effect-guard.test.ts", "src/lib/miden/transaction/proposal-effect-guard.ts", "src/lib/miden/transaction/transactions.background-matrix.test.ts", "src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts", "src/lib/miden/transaction/transactions.guardian.test.ts", "src/lib/miden/transaction/transactions.send-stage-timings.test.ts", "src/lib/miden/transaction/transactions.test.ts"]
          assert git('rev-parse','HEAD')==source
          assert git('rev-parse','HEAD^{tree}')==os.environ['EXPECTED_SOURCE_TREE']
          assert git('show','-s','--format=%P',source)==parent
          assert git('diff','--name-only',parent,source).splitlines()==sorted(fix_paths)
          assert git('diff','--name-only',os.environ['ORIGINAL_REVIEW_HEAD'],source).splitlines()==sorted(fix_paths)
          assert git('diff','--name-only',os.environ['PR_BASE_SHA'],source).splitlines()==path_union
          assert git('diff','--name-only',source,workflow).splitlines()==['.github/workflows/pr-compile-surfaces.yml']
          paths=['package.json','yarn.lock','jest.config.ts','jest.setup.js','src/lib/miden/transaction/proposal-effect-guard.ts','src/lib/miden/transaction/effect-checked-signer.ts']
          blobs={p:git('rev-parse',source+':'+p) for p in paths}
          assert all(blobs[p]==git('rev-parse',parent+':'+p) for p in paths)
          hashed=sorted(set(paths+path_union))
          data={'workflowSha':workflow,'workflowRef':os.environ['GITHUB_WORKFLOW_REF'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'sourceSha':source,'sourceTree':os.environ['EXPECTED_SOURCE_TREE'],'sourceParent':parent,'originalReviewHead':os.environ['ORIGINAL_REVIEW_HEAD'],'prBase':os.environ['PR_BASE_SHA'],'installLifecycleScripts':'enabled','fixPaths':fix_paths,'fullPrPathUnion':path_union,'unchangedBlobs':blobs,'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in hashed}}
          pathlib.Path(os.environ['EVIDENCE_DIR'],'source-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PYBIND
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies with normal lifecycle scripts
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --network-timeout 600000 2>&1 | tee "$EVIDENCE_DIR/install.log"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Measure every repair hunk and the retained prewrite check
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYSETUP'
          import base64,hashlib,json,os,pathlib,shlex,subprocess
          e=pathlib.Path(os.environ['EVIDENCE_DIR']);e.mkdir(parents=True,exist_ok=True)
          (e/'rev-mutate.sh').write_bytes(base64.b64decode(''))
          (e/'mutation-test-command.py').write_bytes(base64.b64decode(''))
          (e/'mutation-validate.py').write_bytes(base64.b64decode(''))
          (e/'mutation-config.json').write_bytes(base64.b64decode(''))
          (e/'mutation-predictions.json').write_bytes(base64.b64decode(''))
          assert hashlib.sha256((e/'rev-mutate.sh').read_bytes()).hexdigest()=='32bf2e9ca9c676dac2916f9bf3acc1c048e5fa76060178a6cb65fd61ee045bfc'
          session=e/'measurement-session';session.mkdir();(session/'scope.env').write_text('REV_ROOT='+shlex.quote(os.environ['GITHUB_WORKSPACE'])+'\n');(session/'state.json').write_text(json.dumps({'phase':'fix','purpose':'isolated source-bound measurement only; no provider review or receipt'})+'\n')
          subprocess.run(['git','reset','--mixed',os.environ['EXPECTED_SOURCE_PARENT']],check=True)
          subprocess.run(['git','diff',os.environ['EXPECTED_SOURCE_SHA'],'--exit-code'],check=True)
          patch=subprocess.check_output(['git','diff','--binary']);(e/'all-hunk-baseline.patch').write_bytes(patch)
          assert hashlib.sha256(patch).hexdigest()=='2abbb7f2a0e6b2da5ebffcbfcdc833af92d3c14dfff97251210aec87d6ab9eb4'
          PYSETUP
          set +e
          REVIEW_COUNCIL_HOST=codex bash "$EVIDENCE_DIR/rev-mutate.sh" "$EVIDENCE_DIR/measurement-session" 'python3 "$EVIDENCE_DIR/mutation-test-command.py"' 2>&1 | tee "$EVIDENCE_DIR/canonical-mutate.log"
          mutation_exit=${PIPESTATUS[0]}
          printf '%s\n' "$mutation_exit" > "$EVIDENCE_DIR/canonical-exit.txt"
          set -e
          test "$mutation_exit" -eq 0 -o "$mutation_exit" -eq 3
          python3 <<'PYRETAINED'
          import os,pathlib,subprocess,sys
          root=pathlib.Path.cwd();e=pathlib.Path(os.environ['EVIDENCE_DIR']);p=root/'src/lib/miden/transaction/index.ts';original=p.read_bytes()
          needle=b"          if (transaction.type === 'earn-deposit') await requireEarnDepositRequestBytes(transaction);\n          await requireBridgeSubmitClaim(transaction);"
          assert original.count(needle)==1
          try:
           p.write_bytes(original.replace(needle,b'          await requireBridgeSubmitClaim(transaction);'))
           (e/'retained-check-negative.patch').write_bytes(subprocess.check_output(['git','diff',os.environ['EXPECTED_SOURCE_SHA'],'--binary']))
           r=subprocess.run([sys.executable,str(e/'mutation-test-command.py')]);(e/'retained-check-exit.txt').write_text(str(r.returncode)+'\n')
           assert r.returncode==1
          finally:
           p.write_bytes(original)
           subprocess.run(['git','diff',os.environ['EXPECTED_SOURCE_SHA'],'--exit-code'],check=True)
          r=subprocess.run([sys.executable,str(e/'mutation-test-command.py')]);(e/'final-restored-exit.txt').write_text(str(r.returncode)+'\n');assert r.returncode==0
          PYRETAINED
      - name: Validate predictions while retaining the canonical result
        if: always()
        shell: bash
        run: python3 "$EVIDENCE_DIR/mutation-validate.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-2147-c01-mutation-9c4221f0
          path: ${{ runner.temp }}/qa-2147-c01-mutation/
          if-no-files-found: error
          retention-days: 7

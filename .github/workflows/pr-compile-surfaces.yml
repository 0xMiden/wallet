name: QA capsule full Android unit module

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: capsule-full-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Full Android dApp-browser unit module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      RESULTS: ${{ github.workspace }}/native-full-unit
    steps:
      - uses: actions/checkout@v4
      - name: Bind fixed production and regression source
        run: |
          mkdir -p "$RESULTS"
          python3 <<'PYBIND'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = {'package.json': '7452638a89d169308c7d8bfb353927ed109e257b', 'yarn.lock': 'edab292553d3aca80fd174b6caeea28767c079a4', 'src': 'd49fa46177051e01c849de7341e40a9ce9d37e05', 'packages/dapp-browser/android/src/main': 'a27c7dc5bff48be852b0333a8288579b4f660787', 'packages/dapp-browser/android/src/test/java/ee/forgr/capacitor_inappbrowser/BreadPresentationControllerTest.java': 'c496d479bc9032e2b5913964acf91981f3e78a3f'}
          actual = {name: git('rev-parse', 'HEAD:' + name) for name in expected}
          source = {'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'expected_product_source': '3b5533bc75094a51b310bb60b671bbc6c3eb30a5',
                    'expected': expected, 'actual': actual}
          pathlib.Path(os.environ['RESULTS'], 'source-binding.json').write_text(json.dumps(source, indent=2) + '\n')
          assert source['head'] == os.environ['GITHUB_SHA']
          assert actual == expected, (actual, expected)
          PYBIND
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr
      - name: Run Install
        uses: ./.github/actions/yarn-install
      - name: Build debug APK
        run: |
          set -o pipefail
          yarn test:e2e:android:build 2>&1 | tee "$RESULTS/build-debug.log"
      - name: Run the complete Android unit module without selectors
        run: |
          set +e
          cd android
          ./gradlew :miden-dapp-browser:testDebugUnitTest --max-workers=2 --console=plain > "$RESULTS/gradle.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RESULTS/gradle-exit.txt"
          cat "$RESULTS/gradle.log"
          exit "$status"
      - name: Require full counts and both regression cases with no failures or skips
        if: always()
        run: |
          python3 <<'PYCLASSIFY'
          import json, os, pathlib, shutil, sys, xml.etree.ElementTree as ET
          output = pathlib.Path(os.environ['RESULTS'])
          output.mkdir(parents=True, exist_ok=True)
          junit = output / 'junit'
          junit.mkdir(exist_ok=True)
          cases = []
          for source in pathlib.Path('packages/dapp-browser/android/build/test-results/testDebugUnitTest').glob('*.xml'):
              shutil.copy2(source, junit / source.name)
              cases.extend(ET.parse(source).getroot().iter('testcase'))
          expected = {'capsuleReturnToScreenStartCancelsAfterItsParentTransforms',
                      'capsuleVelocityKeepsBatchedPhysicalSamplesWhenParentTransforms'}
          counts = {tag: sum(len(case.findall(tag)) for case in cases) for tag in ('failure', 'error', 'skipped')}
          regressions = [case.attrib['name'] for case in cases
                         if case.attrib.get('classname') == 'ee.forgr.capacitor_inappbrowser.BreadPresentationControllerTest'
                         and case.attrib.get('name') in expected]
          exit_path = output / 'gradle-exit.txt'
          gradle_exit = int(exit_path.read_text().strip()) if exit_path.exists() else None
          def accepted(executed, failures, errors, skipped, names, status):
              return executed >= 324 and failures == errors == skipped == 0 and set(names) == expected and len(names) == 2 and status == 0
          assert accepted(324, 0, 0, 0, sorted(expected), 0)
          assert not accepted(0, 0, 0, 0, sorted(expected), 0)
          assert not accepted(324, 1, 0, 0, sorted(expected), 0)
          assert not accepted(324, 0, 1, 0, sorted(expected), 0)
          assert not accepted(324, 0, 0, 1, sorted(expected), 0)
          assert not accepted(324, 0, 0, 0, [], 0)
          assert not accepted(324, 0, 0, 0, sorted(expected), 1)
          passed = accepted(len(cases), counts['failure'], counts['error'], counts['skipped'], regressions, gradle_exit)
          result = {'source': os.environ['GITHUB_SHA'], 'executed': len(cases), **counts,
                    'regressions': regressions, 'gradle_exit': gradle_exit, 'full_module_pass': passed}
          (output / 'classification.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          if not passed:
              sys.exit('Full module gate failed: require at least324 cases, both regressions, zero failures/errors/skips and Gradle0')
          PYCLASSIFY
      - name: Upload exact-source full module evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-full-unit-${{ github.run_id }}
          path: native-full-unit/
          retention-days: 7
          if-no-files-found: error

name: QA F15 retryable simulation regression (expected red)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: F15 simulation retry identity (expected red)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fadc9fdc3c4d3c8fa79eb95b2ce8210e194c0361'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies
        timeout-minutes: 5
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Run the frozen F15 regressions
        env:
          EXPECTED_SOURCE_SHA: 'fadc9fdc3c4d3c8fa79eb95b2ce8210e194c0361'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code
          printf 'workflow_sha=%s\ntested_source_sha=%s\ntested_source_tree=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > qa-f15-red-source.txt
          sha256sum src/lib/miden/back/simulate-custom-tx.ts src/lib/miden/back/dapp.ts src/lib/miden/back/simulate-custom-tx.test.ts src/lib/miden/back/dapp.custom-consent.test.ts >> qa-f15-red-source.txt
          yarn jest --runTestsByPath src/lib/miden/back/simulate-custom-tx.test.ts src/lib/miden/back/dapp.custom-consent.test.ts --testNamePattern='a simulation timeout rejects|rethrows a lock eviction|rethrows a terminated client|rethrows the kill and releases' --maxWorkers=2 --coverage=false --json --outputFile=qa-f15-red-results.json 2>&1 | tee qa-f15-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f15-regression-expected-red
          path: |
            qa-f15-red-source.txt
            qa-f15-red-results.json
            qa-f15-red.log
          if-no-files-found: error
          retention-days: 7

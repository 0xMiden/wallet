name: QA batch 1 regressions (expected red)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Recovery and claim selection (expected red)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ce8d2d7e3c80ecde34ec792556124c70a45a7326'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: ./.github/actions/yarn-install
      - name: Run the frozen batch regressions
        env:
          EXPECTED_SOURCE_SHA: 'ce8d2d7e3c80ecde34ec792556124c70a45a7326'
          REGRESSION_PATTERN: 'recovery signer preservation|chooses the newest eligible claim row per note'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD > qa-batch01-red-source.txt
          yarn jest --runTestsByPath src/lib/miden/guardian/index.test.ts src/app/hooks/useClaimNotes.test.ts --testNamePattern "$REGRESSION_PATTERN" --maxWorkers=2 --coverage=false --json --outputFile=qa-batch01-red-results.json 2>&1 | tee qa-batch01-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch01-regressions-expected-red
          path: |
            qa-batch01-red-source.txt
            qa-batch01-red-results.json
            qa-batch01-red.log
          if-no-files-found: error
          retention-days: 7

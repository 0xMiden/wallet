name: QA 2147 current guards (mocked only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Current independent signing guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: '147f5e4c64559d2f8c71f8929edc07c8ced1eb82'
      EXPECTED_SOURCE_TREE: '407a34b4ef8d0047d5ebe6bada29f904b9fccc36'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '147f5e4c64559d2f8c71f8929edc07c8ced1eb82'
          persist-credentials: false
      - name: Record the frozen source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'qa_workflow_sha=%s\nworkflow_ref=%s\ntested_source_sha=%s\ntested_source_tree=%s\ninstall_lifecycle_scripts=omitted\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > qa-2147-guards-source.txt
          sha256sum package.json yarn.lock jest.config.ts jest.setup.js src/lib/miden/transaction/proposal-effect-guard.ts src/lib/miden/transaction/effect-checked-signer.ts src/lib/miden/transaction/proposal-effect-guard.test.ts src/lib/miden/transaction/effect-checked-signer.test.ts >> qa-2147-guards-source.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies without lifecycle builds
        timeout-minutes: 5
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Run the two exact mocked suites
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          yarn jest --runTestsByPath src/lib/miden/transaction/proposal-effect-guard.test.ts src/lib/miden/transaction/effect-checked-signer.test.ts --maxWorkers=1 --coverage=false --json --outputFile=qa-2147-guards-results.json 2>&1 | tee qa-2147-guards.log
      - name: Require nonempty exact-suite results and the six signing cases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > qa-2147-guards-summary.json
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const result = JSON.parse(fs.readFileSync('qa-2147-guards-results.json', 'utf8'));
          const expected = [
            'src/lib/miden/transaction/proposal-effect-guard.test.ts',
            'src/lib/miden/transaction/effect-checked-signer.test.ts'
          ];
          assert.equal(result.success, true);
          assert.equal(result.numRuntimeErrorTestSuites, 0);
          assert.equal(result.numFailedTests, 0);
          assert.equal(result.numTotalTestSuites, 2);
          assert.equal(result.numPassedTestSuites, 2);
          assert.ok(result.numTotalTests > 0);
          assert.ok(result.numPassedTests > 0);
          assert.equal(result.testResults.length, 2);
          const suites = expected.map(file => {
            const suite = result.testResults.find(row => row.name === path.resolve(file));
            assert.ok(suite, `missing exact suite: ${file}`);
            assert.equal(suite.status, 'passed');
            assert.ok(suite.assertionResults.some(row => row.status === 'passed'));
            return { file, assertions: suite.assertionResults.length };
          });
          const signer = result.testResults.find(row => row.name === path.resolve(expected[1]));
          const signingCases = ['send', 'swap', 'earn-deposit'].flatMap(type => [
            `refuses ${type} signing above its persisted approval`,
            `passes ${type} signing within its persisted approval`
          ]);
          for (const name of signingCases) {
            assert.ok(signer.assertionResults.some(row => row.fullName === name && row.status === 'passed'), name);
          }
          console.log(JSON.stringify({
            qaWorkflowSha: process.env.GITHUB_SHA,
            sourceSha: process.env.EXPECTED_SOURCE_SHA,
            sourceTree: process.env.EXPECTED_SOURCE_TREE,
            installLifecycleScripts: 'omitted',
            totalTests: result.numTotalTests,
            passedTests: result.numPassedTests,
            failedTests: result.numFailedTests,
            pendingTests: result.numPendingTests,
            suites,
            signingCases
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-2147-current-guards
          path: |
            qa-2147-guards-source.txt
            qa-2147-guards-results.json
            qa-2147-guards-summary.json
            qa-2147-guards.log
          if-no-files-found: error
          retention-days: 7

name: Token detail Task 3 expected-red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Token detail Task 3 expected-red assertions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE_SHA: '4022f5daa89a6d9aeb6c8c05ceead588cd5a145b'
      BASELINE_TREE: '0746189c82cc03dbac74dd30218a70c35bb3a0e4'
      DETAIL_SOURCE_BLOB: '808b11bb47a50d11da569762e8fb7fd3812b7d1c'
      AMOUNT_SOURCE_BLOB: 'efb8af950cec5672c9fe8f8e33b51c941a81c1e3'
      DETAIL_TEST_BLOB: '1f1f76c239ccb92c18f3950dcc15826f026b10e2'
      AMOUNT_TEST_BLOB: '730d07b764d3eabffad861742540baabd999f51e'
      PACKAGE_BLOB: 'ff2b37987a6aaf6022bfdcd65bc6cebc93266c3e'
      LOCK_BLOB: 'edab292553d3aca80fd174b6caeea28767c079a4'
      TEST_NAME_PATTERN: 'values SDK-authenticated native USDCX at \$1 without a feed or a market chart|shows verified market provenance and schedules the existing freshness clock|hides a stale quote from the available value and current-price chart|does not value a market quote without provider provenance|values a known zero balance with a fresh market quote|does not use a same-symbol quote for an unlisted faucet|passes only matching-faucet claim cards through the shared token History|requires a positive finite price and an observed timestamp'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Verify frozen source and test-only QA overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$BASELINE_SHA"
          test "$(git rev-parse "${BASELINE_SHA}^{tree}")" = "$BASELINE_TREE"
          test "$(git rev-parse "${BASELINE_SHA}:src/app/pages/TokenDetail.tsx")" = "$DETAIL_SOURCE_BLOB"
          test "$(git rev-parse "${BASELINE_SHA}:src/lib/prices/amount.ts")" = "$AMOUNT_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:src/app/pages/TokenDetail.tsx")" = "$DETAIL_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:src/lib/prices/amount.ts")" = "$AMOUNT_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:src/app/pages/TokenDetail.test.tsx")" = "$DETAIL_TEST_BLOB"
          test "$(git rev-parse "HEAD:src/lib/prices/amount.test.ts")" = "$AMOUNT_TEST_BLOB"
          test "$(git rev-parse HEAD:package.json)" = "$PACKAGE_BLOB"
          test "$(git rev-parse HEAD:yarn.lock)" = "$LOCK_BLOB"
          git diff --exit-code "$BASELINE_SHA" HEAD -- src/app/pages/TokenDetail.tsx src/lib/prices/amount.ts package.json yarn.lock
          expected_paths=$(printf '%s\n' .github/workflows/pr-compile-surfaces.yml src/app/pages/TokenDetail.test.tsx src/lib/prices/amount.test.ts | LC_ALL=C sort)
          actual_paths=$(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort)
          test "$actual_paths" = "$expected_paths"
          node <<'NODE' > qa-2028-red-source.json
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const paths = [
            'src/app/pages/TokenDetail.tsx',
            'src/lib/prices/amount.ts',
            'src/app/pages/TokenDetail.test.tsx',
            'src/lib/prices/amount.test.ts',
            'package.json',
            'yarn.lock',
          ];
          const git = (args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const sha256 = (path) => createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const blobs = Object.fromEntries(paths.map((path) => [path, {
            git_blob: git(['rev-parse', `HEAD:${path}`]),
            sha256: sha256(path),
          }]));
          const names = [
            'values SDK-authenticated native USDCX at $1 without a feed or a market chart',
            'shows verified market provenance and schedules the existing freshness clock',
            'hides a stale quote from the available value and current-price chart',
            'does not value a market quote without provider provenance',
            'values a known zero balance with a fresh market quote',
            'does not use a same-symbol quote for an unlisted faucet',
            'passes only matching-faucet claim cards through the shared token History',
            'requires a positive finite price and an observed timestamp',
          ];
          console.log(JSON.stringify({
            workflow_sha: process.env.GITHUB_SHA,
            baseline_sha: process.env.BASELINE_SHA,
            baseline_tree: process.env.BASELINE_TREE,
            qa_head: git(['rev-parse', 'HEAD']),
            qa_tree: git(['rev-parse', 'HEAD^{tree}']),
            selector_pattern: process.env.TEST_NAME_PATTERN,
            selector_names: names,
            blobs,
          }, null, 2));
          NODE
      - name: Install frozen dependencies
        timeout-minutes: 5
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Run the selected baseline regressions
        shell: bash
        run: |
          set -euo pipefail
          yarn jest --runInBand --coverage=false --runTestsByPath src/app/pages/TokenDetail.test.tsx src/lib/prices/amount.test.ts --testNamePattern="$TEST_NAME_PATTERN" --json --outputFile=qa-2028-red-results.json 2>&1 | tee qa-2028-red.log
      - name: Assert eight selected tests executed with the expected baseline failures
        if: always()
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const results = JSON.parse(fs.readFileSync('qa-2028-red-results.json', 'utf8'));
          const expected = new Map([
            ['values SDK-authenticated native USDCX at $1 without a feed or a market chart', 'failed'],
            ['shows verified market provenance and schedules the existing freshness clock', 'failed'],
            ['hides a stale quote from the available value and current-price chart', 'failed'],
            ['does not value a market quote without provider provenance', 'failed'],
            ['values a known zero balance with a fresh market quote', 'passed'],
            ['does not use a same-symbol quote for an unlisted faucet', 'passed'],
            ['passes only matching-faucet claim cards through the shared token History', 'failed'],
            ['requires a positive finite price and an observed timestamp', 'failed'],
          ]);
          const files = results.testResults ?? [];
          const executed = files.flatMap((file) => file.assertionResults ?? [])
            .filter((test) => test.status === 'passed' || test.status === 'failed');
          assert.equal(files.length, 2, 'both selected test files must run');
          assert.equal(executed.length, 8, 'exactly eight assertions must execute');
          assert.equal(results.numFailedTests, 6, 'six intended regressions must fail');
          assert.equal(results.numPassedTests, 2, 'both control assertions must pass');
          assert.equal(results.numRuntimeErrorTestSuites ?? 0, 0, 'no suite runtime errors');
          const seen = new Set();
          for (const test of executed) {
            const name = [...expected.keys()].find((expectedName) => test.fullName?.endsWith(expectedName));
            assert.ok(name, `unexpected executed test: ${test.fullName}`);
            assert.equal(test.status, expected.get(name), `wrong result for ${name}`);
            assert.ok(!seen.has(name), `duplicate selected test: ${name}`);
            seen.add(name);
          }
          assert.deepEqual(seen, new Set(expected.keys()), 'all eight named assertions must execute');
          assert.equal(executed.find((test) => test.fullName?.endsWith(
            'values SDK-authenticated native USDCX at $1 without a feed or a market chart'))?.status, 'failed',
            'the literal $1 test must be selected and fail on the frozen baseline');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-detail-task-3-expected-red
          path: |
            qa-2028-red-source.json
            qa-2028-red-results.json
            qa-2028-red.log
          if-no-files-found: warn
          retention-days: 7

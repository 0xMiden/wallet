name: Token Detail Task 3 focused suites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task3-tests:
    name: Full TokenDetail and amount suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: '9df0493a5403b7025058bd14e990f703600a393a'
      SOURCE_TREE: 'ed000a9ee4fb89dcc2f3ffb94bd5a0be0288bc36'
      DETAIL_SOURCE_BLOB: '226ccaa8dcb231ed8bc6048680cf928e15be016c'
      DETAIL_TEST_BLOB: '1f1f76c239ccb92c18f3950dcc15826f026b10e2'
      AMOUNT_SOURCE_BLOB: '3f31f3cbcc28652f098fc37c71bdbed517c8d168'
      AMOUNT_TEST_BLOB: '730d07b764d3eabffad861742540baabd999f51e'
      LOCALE_BLOB: '7b7089ade64c54a107bf4644d2a3270f3ae07899'
      CHANGELOG_BLOB: '9986ef06c62fcdf96cf303cd6d3290d7ecb156b4'
      PACKAGE_BLOB: 'ff2b37987a6aaf6022bfdcd65bc6cebc93266c3e'
      LOCK_BLOB: 'edab292553d3aca80fd174b6caeea28767c079a4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Verify frozen source and QA-only workflow overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          expected_paths='.github/workflows/pr-compile-surfaces.yml'
          actual_paths="$(git diff --name-only "$SOURCE_SHA" HEAD | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          git diff --exit-code "$SOURCE_SHA" HEAD -- \
            src/app/pages/TokenDetail.tsx \
            src/app/pages/TokenDetail.test.tsx \
            src/lib/prices/amount.ts \
            src/lib/prices/amount.test.ts \
            public/_locales/en/en.json CHANGELOG.md package.json yarn.lock
          test "$(git rev-parse "$SOURCE_SHA:src/app/pages/TokenDetail.tsx")" = "$DETAIL_SOURCE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:src/app/pages/TokenDetail.test.tsx")" = "$DETAIL_TEST_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:src/lib/prices/amount.ts")" = "$AMOUNT_SOURCE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:src/lib/prices/amount.test.ts")" = "$AMOUNT_TEST_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:public/_locales/en/en.json")" = "$LOCALE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:CHANGELOG.md")" = "$CHANGELOG_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:package.json")" = "$PACKAGE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:yarn.lock")" = "$LOCK_BLOB"
          node <<'NODE' > qa-2028-task3-source.json
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const paths = [
            'src/app/pages/TokenDetail.tsx',
            'src/app/pages/TokenDetail.test.tsx',
            'src/lib/prices/amount.ts',
            'src/lib/prices/amount.test.ts',
            'public/_locales/en/en.json',
            'CHANGELOG.md',
            'package.json',
            'yarn.lock',
          ];
          const git = (args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const blobs = Object.fromEntries(paths.map((path) => [path, {
            git_blob: git(['rev-parse', `HEAD:${path}`]),
            sha256: createHash('sha256').update(fs.readFileSync(path)).digest('hex'),
          }]));
          console.log(JSON.stringify({
            source_sha: process.env.SOURCE_SHA,
            source_tree: process.env.SOURCE_TREE,
            qa_sha: git(['rev-parse', 'HEAD']),
            qa_tree: git(['rev-parse', 'HEAD^{tree}']),
            workflow_sha: process.env.GITHUB_SHA,
            workflow_blob: git(['rev-parse', 'HEAD:.github/workflows/pr-compile-surfaces.yml']),
            command: 'yarn jest --runInBand --coverage=false --runTestsByPath src/app/pages/TokenDetail.test.tsx src/lib/prices/amount.test.ts',
            source_blobs: blobs,
          }, null, 2));
          NODE

      - name: Install frozen dependencies with standard workspace setup
        timeout-minutes: 10
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Run both full mocked suites
        id: jest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yarn jest --runInBand --coverage=false --runTestsByPath \
            src/app/pages/TokenDetail.test.tsx \
            src/lib/prices/amount.test.ts \
            --json --outputFile=qa-2028-task3-results.json 2>&1 | tee qa-2028-task3.log

      - name: Verify both complete suites executed and summarize
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const results = JSON.parse(fs.readFileSync('qa-2028-task3-results.json', 'utf8'));
          const expected = [
            'src/app/pages/TokenDetail.test.tsx',
            'src/lib/prices/amount.test.ts',
          ].sort();
          const files = results.testResults ?? [];
          const actual = files.map((file) => path.relative(process.cwd(), file.name).replaceAll('\\', '/')).sort();
          assert.deepEqual(actual, expected, 'both requested test files must run, with no substituted suite');
          const assertions = files.flatMap((file) => file.assertionResults ?? []);
          const executed = assertions.filter((test) => test.status === 'passed' || test.status === 'failed');
          assert.ok(files.every((file) => (file.assertionResults ?? []).some(
            (test) => test.status === 'passed' || test.status === 'failed')),
            'each suite must execute at least one assertion');
          assert.ok(executed.length > 0, 'the run must execute assertions');
          assert.equal(executed.length, (results.numPassedTests ?? 0) + (results.numFailedTests ?? 0),
            'executed assertion count must match the Jest summary');
          assert.equal(results.numRuntimeErrorTestSuites ?? 0, 0, 'no suite runtime errors');
          const summary = [
            `Suites: ${files.length}/2`,
            `Tests: ${results.numTotalTests ?? 0}`,
            `Passed: ${results.numPassedTests ?? 0}`,
            `Failed: ${results.numFailedTests ?? 0}`,
            `Skipped: ${results.numPendingTests ?? 0}`,
            `Runtime errors: ${results.numRuntimeErrorTestSuites ?? 0}`,
          ].join('\n');
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE

      - name: Preserve a failing Jest result
        if: steps.jest.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-detail-task3-focused-suites
          path: |
            qa-2028-task3-source.json
            qa-2028-task3-results.json
            qa-2028-task3.log
          if-no-files-found: warn
          retention-days: 7

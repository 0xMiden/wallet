name: QA Rule1 simulated-only preview regression (expected red)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Rule1 declared preview exclusion (expected red)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '79df4eaefc161681089a88b325ff029ec3b7feea'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies
        timeout-minutes: 5
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Run the frozen Rule1 regressions
        env:
          EXPECTED_SOURCE_SHA: '79df4eaefc161681089a88b325ff029ec3b7feea'
          EXPECTED_SOURCE_TREE: '3d0e03932d3a429330b2b66ab5206e17b92d02c2'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'workflow_sha=%s\ntested_source_sha=%s\ntested_source_tree=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > qa-rule1-red-source.txt
          sha256sum package.json yarn.lock src/lib/miden/back/dapp.ts src/lib/miden/back/public-error.ts src/lib/miden/back/simulate-custom-tx.ts src/lib/miden/back/dapp.extension.test.ts src/lib/miden/back/dapp.offextension-preview.test.ts >> qa-rule1-red-source.txt
          yarn jest --runTestsByPath src/lib/miden/back/dapp.extension.test.ts src/lib/miden/back/dapp.offextension-preview.test.ts --testNamePattern='never reads the declared outputs of the request, so the sheet shows only the dry run|renders the simulated asset movement, never the movement the request declares' --maxWorkers=2 --coverage=false --json --outputFile=qa-rule1-red-results.json 2>&1 | tee qa-rule1-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rule1-regression-expected-red
          path: |
            qa-rule1-red-source.txt
            qa-rule1-red-results.json
            qa-rule1-red.log
          if-no-files-found: error
          retention-days: 7

name: QA 2147 C-01 passing guards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: C-01 seven suites and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 'a4b2e40d7ad95446bb718820e0b3a38fa01d9af0'
      EXPECTED_SOURCE_TREE: '9c4221f0eb58d5fded335a0791b7ebf3df98d851'
      EXPECTED_SOURCE_PARENT: '1fe48b4a2badf7223e22dfa655c7b5b950e2932f'
      ORIGINAL_REVIEW_HEAD: '657f4b98cb0aa7756865c0030ea11bc99bb7a016'
      PR_BASE_SHA: '94e5ba9b2a40df2e706a323e0155510880cabaa0'
      EXPECTED_QA_BRANCH: 'ci/qa-2147-c01-green-9c4221f0-20261112-v2'
      NODE_OPTIONS: '--max-old-space-size=4096'
      UV_THREADPOOL_SIZE: '2'
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - name: Set the evidence path from the runner environment
        shell: bash
        run: printf 'EVIDENCE_DIR=%s/qa-2147-c01-green-v2\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: 'a4b2e40d7ad95446bb718820e0b3a38fa01d9af0'
          fetch-depth: 0
          persist-credentials: false
      - name: Record and verify the exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf 'workflow_sha=%s\nworkflow_ref=%s\nsource_sha=%s\nsource_tree=%s\ninstall_lifecycle_scripts=enabled\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$EVIDENCE_DIR/source.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = "$EXPECTED_QA_BRANCH"
          python3 <<'PYBIND'
          import hashlib,json,os,pathlib,subprocess
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          source=os.environ['EXPECTED_SOURCE_SHA'];parent=os.environ['EXPECTED_SOURCE_PARENT'];workflow=os.environ['GITHUB_SHA']
          fix_paths=["src/lib/miden/transaction/index.ts", "src/lib/miden/transaction/transactions.background-matrix.test.ts", "src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts", "src/lib/miden/transaction/transactions.guardian.test.ts", "src/lib/miden/transaction/transactions.send-stage-timings.test.ts", "src/lib/miden/transaction/transactions.test.ts"]
          path_union=["CHANGELOG.md", "src/lib/miden/transaction/effect-checked-signer.test.ts", "src/lib/miden/transaction/index.ts", "src/lib/miden/transaction/proposal-effect-guard.test.ts", "src/lib/miden/transaction/proposal-effect-guard.ts", "src/lib/miden/transaction/transactions.background-matrix.test.ts", "src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts", "src/lib/miden/transaction/transactions.guardian.test.ts", "src/lib/miden/transaction/transactions.send-stage-timings.test.ts", "src/lib/miden/transaction/transactions.test.ts"]
          assert git('rev-parse','HEAD')==source
          assert git('rev-parse','HEAD^{tree}')==os.environ['EXPECTED_SOURCE_TREE']
          assert git('show','-s','--format=%P',source)==parent
          assert git('diff','--name-only',parent,source).splitlines()==sorted(fix_paths)
          assert git('diff','--name-only',os.environ['ORIGINAL_REVIEW_HEAD'],source).splitlines()==sorted(fix_paths)
          assert git('diff','--name-only',os.environ['PR_BASE_SHA'],source).splitlines()==path_union
          assert git('diff','--name-only',source,workflow).splitlines()==['.github/workflows/pr-compile-surfaces.yml']
          paths=['package.json','yarn.lock','jest.config.ts','jest.setup.js','src/lib/miden/transaction/proposal-effect-guard.ts','src/lib/miden/transaction/effect-checked-signer.ts']
          blobs={p:git('rev-parse',source+':'+p) for p in paths}
          assert all(blobs[p]==git('rev-parse',parent+':'+p) for p in paths)
          hashed=sorted(set(paths+path_union))
          data={'workflowSha':workflow,'workflowRef':os.environ['GITHUB_WORKFLOW_REF'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'sourceSha':source,'sourceTree':os.environ['EXPECTED_SOURCE_TREE'],'sourceParent':parent,'originalReviewHead':os.environ['ORIGINAL_REVIEW_HEAD'],'prBase':os.environ['PR_BASE_SHA'],'installLifecycleScripts':'enabled','fixPaths':fix_paths,'fullPrPathUnion':path_union,'unchangedBlobs':blobs,'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in hashed}}
          pathlib.Path(os.environ['EVIDENCE_DIR'],'source-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PYBIND
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies with normal lifecycle scripts
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --network-timeout 600000 2>&1 | tee "$EVIDENCE_DIR/install.log"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Run all seven named suites
        timeout-minutes: 12
        shell: bash
        run: |
          set +e
          set -o pipefail
          printf '%s\n' 'yarn jest --runTestsByPath src/lib/miden/transaction/transactions.test.ts src/lib/miden/transaction/transactions.guardian.test.ts src/lib/miden/transaction/transactions.send-stage-timings.test.ts src/lib/miden/transaction/transactions.background-matrix.test.ts src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts src/lib/miden/transaction/proposal-effect-guard.test.ts src/lib/miden/transaction/effect-checked-signer.test.ts --maxWorkers=2 --watchman=false --coverage=false --json --outputFile=<evidence>/jest-results.json' > "$EVIDENCE_DIR/test-command.txt"
          yarn jest --runTestsByPath src/lib/miden/transaction/transactions.test.ts src/lib/miden/transaction/transactions.guardian.test.ts src/lib/miden/transaction/transactions.send-stage-timings.test.ts src/lib/miden/transaction/transactions.background-matrix.test.ts src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts src/lib/miden/transaction/proposal-effect-guard.test.ts src/lib/miden/transaction/effect-checked-signer.test.ts --maxWorkers=2 --watchman=false --coverage=false --json --outputFile="$EVIDENCE_DIR/jest-results.json" 2>&1 | tee "$EVIDENCE_DIR/jest.log"
          test_exit=${PIPESTATUS[0]}
          printf '%s\n' "$test_exit" > "$EVIDENCE_DIR/jest-exit.txt"
          exit 0
      - name: Check the full TypeScript project
        timeout-minutes: 6
        shell: bash
        run: |
          set +e
          set -o pipefail
          yarn tsc --noEmit --pretty false -p . 2>&1 | tee "$EVIDENCE_DIR/tsc.log"
          type_exit=${PIPESTATUS[0]}
          printf '%s\n' "$type_exit" > "$EVIDENCE_DIR/tsc-exit.txt"
          exit 0
      - name: Check lint on all six fix files
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          set -o pipefail
          yarn eslint --max-warnings 0 src/lib/miden/transaction/index.ts src/lib/miden/transaction/transactions.background-matrix.test.ts src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts src/lib/miden/transaction/transactions.guardian.test.ts src/lib/miden/transaction/transactions.send-stage-timings.test.ts src/lib/miden/transaction/transactions.test.ts 2>&1 | tee "$EVIDENCE_DIR/eslint.log"
          lint_exit=${PIPESTATUS[0]}
          printf '%s\n' "$lint_exit" > "$EVIDENCE_DIR/eslint-exit.txt"
          exit 0
      - name: Check formatting after the tests
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          set +e
          set -o pipefail
          yarn prettier --check src/lib/miden/transaction/index.ts src/lib/miden/transaction/transactions.background-matrix.test.ts src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts src/lib/miden/transaction/transactions.guardian.test.ts src/lib/miden/transaction/transactions.send-stage-timings.test.ts src/lib/miden/transaction/transactions.test.ts 2>&1 | tee "$EVIDENCE_DIR/prettier.log"
          format_exit=${PIPESTATUS[0]}
          printf '%s\n' "$format_exit" > "$EVIDENCE_DIR/prettier-exit.txt"
          exit 0
      - name: Require complete passing source-bound evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.EVIDENCE_DIR;
          const summary = {workflowSha: process.env.GITHUB_SHA, sourceSha: process.env.EXPECTED_SOURCE_SHA, sourceTree: process.env.EXPECTED_SOURCE_TREE, validPassingProof: false};
          try {
            const source = JSON.parse(fs.readFileSync(path.join(dir, 'source-manifest.json'), 'utf8'));
            assert.equal(source.workflowSha, process.env.GITHUB_SHA);
            assert.equal(source.sourceSha, process.env.EXPECTED_SOURCE_SHA);
            assert.equal(source.sourceTree, process.env.EXPECTED_SOURCE_TREE);
            assert.equal(source.sourceParent, process.env.EXPECTED_SOURCE_PARENT);
            assert.equal(source.installLifecycleScripts, 'enabled');
            summary.exits = Object.fromEntries(['jest', 'tsc', 'eslint', 'prettier'].map(name => [name, Number(fs.readFileSync(path.join(dir, name + '-exit.txt'), 'utf8').trim())]));
            for (const [name, value] of Object.entries(summary.exits)) assert.equal(value, 0, name + ' exit');
            const result = JSON.parse(fs.readFileSync(path.join(dir, 'jest-results.json'), 'utf8'));
            const expected = ["src/lib/miden/transaction/transactions.test.ts", "src/lib/miden/transaction/transactions.guardian.test.ts", "src/lib/miden/transaction/transactions.send-stage-timings.test.ts", "src/lib/miden/transaction/transactions.background-matrix.test.ts", "src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts", "src/lib/miden/transaction/proposal-effect-guard.test.ts", "src/lib/miden/transaction/effect-checked-signer.test.ts"];
            summary.counts = {total: result.numTotalTests, passed: result.numPassedTests, failed: result.numFailedTests, pending: result.numPendingTests, todo: result.numTodoTests, runtimeErrorSuites: result.numRuntimeErrorTestSuites};
            assert.equal(result.success, true);
            assert.equal(result.numTotalTestSuites, 7);
            assert.equal(result.numPassedTestSuites, 7);
            assert.equal(result.numFailedTestSuites, 0);
            assert.equal(result.numRuntimeErrorTestSuites, 0);
            assert.equal(result.numFailedTests, 0);
            assert.equal(result.numPendingTests, 0);
            assert.equal(result.numTodoTests, 0);
            assert.equal(result.numTotalTests, 700);
            assert.equal(result.numPassedTests, result.numTotalTests);
            assert.equal(result.testResults.length, 7);
            summary.suites = expected.map(file => {
              const suite = result.testResults.find(row => row.name === path.resolve(file));
              assert.ok(suite, 'missing exact suite: ' + file);
              assert.equal(suite.status, 'passed');
              assert.ok(suite.assertionResults.length > 0, file);
              assert.ok(suite.assertionResults.every(row => row.status === 'passed'), file);
              return {file, assertions: suite.assertionResults.length};
            });
            const earn = result.testResults.find(row => row.name === path.resolve('src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts'));
            assert.equal(earn.assertionResults.length, 13);
            const earnRequired = [
              'earn-deposit refuses to submit once the caller abandoned the Epoch intent',
              'earn-deposit with no request bytes is refused before it mints: no send-style fallback for Earn',
              'refuses an Earn deposit abandoned during unknown fee discovery',
              'refuses an Earn deposit abandoned during known fee discovery',
              'requeues a live Earn deposit with request bytes when its fee is unknown'
            ];
            for (const title of earnRequired) assert.ok(earn.assertionResults.some(row => row.title === title && row.status === 'passed'), title);
            const guardian = result.testResults.find(row => row.name === path.resolve('src/lib/miden/transaction/transactions.guardian.test.ts'));
            const guardianRequired = ['signs a send whose summary moves its approved amount', 'refuses a send whose proposal carries no summary before it signs', 'refuses a send whose amount is a string before it signs'];
            for (const title of guardianRequired) assert.ok(guardian.assertionResults.some(row => row.title === title && row.status === 'passed'), title);
            summary.earnAssertions = earn.assertionResults.map(row => ({title: row.title, fullName: row.fullName, status: row.status}));
            summary.guardianRequired = guardianRequired;
            summary.validPassingProof = true;
          } catch (error) {
            summary.error = error.stack || String(error);
            process.exitCode = 1;
          } finally {
            fs.mkdirSync(dir, {recursive: true});
            fs.writeFileSync(path.join(dir, 'summary.json'), JSON.stringify(summary, null, 2) + '\n');
            console.log(JSON.stringify(summary, null, 2));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-2147-c01-green-9c4221f0-v2
          path: ${{ runner.temp }}/qa-2147-c01-green-v2/
          if-no-files-found: error
          retention-days: 7

name: QA 2147 Earn precondition expected red

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Earn precondition expected-red proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: '1fe48b4a2badf7223e22dfa655c7b5b950e2932f'
      EXPECTED_SOURCE_TREE: '8fca34c7a5a6bb4a7e688183a1df1ec72c5bebc7'
      BASELINE_SHA: '657f4b98cb0aa7756865c0030ea11bc99bb7a016'
      EXPECTED_QA_BRANCH: 'ci/qa-2147-earn-precondition-red-1fe48b4a2-20261112-v2'
      NODE_OPTIONS: '--max-old-space-size=4096'
      UV_THREADPOOL_SIZE: '2'
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - name: Set the evidence path from the runner environment
        shell: bash
        run: printf 'EVIDENCE_DIR=%s/qa-2147-earn-red\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: '1fe48b4a2badf7223e22dfa655c7b5b950e2932f'
          fetch-depth: 0
          persist-credentials: false
      - name: Record and verify the frozen source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf 'workflow_sha=%s\nworkflow_ref=%s\nsource_sha=%s\nsource_tree=%s\ninstall_lifecycle_scripts=enabled\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$EVIDENCE_DIR/source.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = "$EXPECTED_QA_BRANCH"
          python3 <<'PYBIND'
          import hashlib,json,os,pathlib,subprocess
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          source=os.environ['EXPECTED_SOURCE_SHA'];baseline=os.environ['BASELINE_SHA'];workflow=os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD')==source
          assert git('rev-parse','HEAD^{tree}')==os.environ['EXPECTED_SOURCE_TREE']
          subprocess.run(['git','merge-base','--is-ancestor',baseline,source],check=True)
          test_file='src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts'
          assert git('diff','--name-only',baseline,source).splitlines()==[test_file]
          assert git('diff','--name-only',source,workflow).splitlines()==['.github/workflows/pr-compile-surfaces.yml']
          paths=['package.json','yarn.lock','jest.config.ts','jest.setup.js','src/lib/miden/transaction/index.ts','src/lib/miden/transaction/proposal-effect-guard.ts','src/lib/miden/transaction/effect-checked-signer.ts']
          blobs={p:git('rev-parse',source+':'+p) for p in paths}
          assert all(blobs[p]==git('rev-parse',baseline+':'+p) for p in paths)
          data={'workflowSha':workflow,'workflowRef':os.environ['GITHUB_WORKFLOW_REF'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'sourceSha':source,'sourceTree':os.environ['EXPECTED_SOURCE_TREE'],'baselineSha':baseline,'installLifecycleScripts':'enabled','testOnlyDelta':[test_file],'unchangedBlobs':blobs,'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths+[test_file]}}
          pathlib.Path(os.environ['EVIDENCE_DIR'],'source-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PYBIND
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies with normal lifecycle scripts
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --network-timeout 600000 2>&1 | tee "$EVIDENCE_DIR/install.log"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Run the complete named Earn seam suite
        timeout-minutes: 8
        shell: bash
        run: |
          set +e
          set -o pipefail
          printf '%s\n' 'yarn jest --runTestsByPath src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts --maxWorkers=1 --coverage=false --json --outputFile=<evidence>/jest-results.json' > "$EVIDENCE_DIR/test-command.txt"
          yarn jest --runTestsByPath src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts --maxWorkers=1 --coverage=false --json --outputFile="$EVIDENCE_DIR/jest-results.json" 2>&1 | tee "$EVIDENCE_DIR/jest.log"
          test_exit=${PIPESTATUS[0]}
          printf '%s\n' "$test_exit" > "$EVIDENCE_DIR/jest-exit.txt"
          exit 0
      - name: Check the named test formatting after execution
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          set +e
          set -o pipefail
          yarn prettier --check src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts 2>&1 | tee "$EVIDENCE_DIR/prettier.log"
          format_exit=${PIPESTATUS[0]}
          printf '%s\n' "$format_exit" > "$EVIDENCE_DIR/prettier-exit.txt"
          exit "$format_exit"
      - name: Require the exact expected-red assertions and passing controls
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.EVIDENCE_DIR;
          const summary = {workflowSha: process.env.GITHUB_SHA, sourceSha: process.env.EXPECTED_SOURCE_SHA, sourceTree: process.env.EXPECTED_SOURCE_TREE, validExpectedRed: false};
          try {
            const source = JSON.parse(fs.readFileSync(path.join(dir, 'source-manifest.json'), 'utf8'));
            assert.equal(source.workflowSha, process.env.GITHUB_SHA);
            assert.equal(source.sourceSha, process.env.EXPECTED_SOURCE_SHA);
            assert.equal(source.sourceTree, process.env.EXPECTED_SOURCE_TREE);
            assert.equal(source.installLifecycleScripts, 'enabled');
            const result = JSON.parse(fs.readFileSync(path.join(dir, 'jest-results.json'), 'utf8'));
            const testExit = Number(fs.readFileSync(path.join(dir, 'jest-exit.txt'), 'utf8').trim());
            const formatPath = path.join(dir, 'prettier-exit.txt');
            summary.prettierExit = fs.existsSync(formatPath) ? Number(fs.readFileSync(formatPath, 'utf8').trim()) : null;
            summary.testExit = testExit;
            summary.counts = {total: result.numTotalTests, passed: result.numPassedTests, failed: result.numFailedTests, pending: result.numPendingTests, todo: result.numTodoTests, runtimeErrorSuites: result.numRuntimeErrorTestSuites};
            assert.equal(testExit, 1);
            assert.equal(result.success, false);
            assert.equal(result.numTotalTestSuites, 1);
            assert.equal(result.numRuntimeErrorTestSuites, 0);
            assert.equal(result.numTotalTests, 13);
            assert.equal(result.numFailedTests, 3);
            assert.equal(result.numPassedTests, 10);
            assert.equal(result.numPendingTests, 0);
            assert.equal(result.numTodoTests, 0);
            assert.equal(result.testResults.length, 1);
            const suite = result.testResults[0];
            assert.equal(suite.name, path.resolve('src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts'));
            assert.equal(suite.status, 'failed');
            assert.equal(suite.assertionResults.length, 13);
            assert.ok(suite.assertionResults.every(row => row.status === 'passed' || row.status === 'failed'));
            const failures = suite.assertionResults.filter(row => row.status === 'failed');
            const expectedFailures = [
              'earn-deposit refuses to submit once the caller abandoned the Epoch intent',
              'earn-deposit with no request bytes is refused before it mints: no send-style fallback for Earn',
              'refuses an Earn deposit abandoned during unknown fee discovery'
            ];
            assert.deepEqual(failures.map(row => row.title).sort(), expectedFailures.slice().sort());
            for (const row of failures) {
              const message = row.failureMessages.join('\n').replace(/\u001b\[[0-9;]*m/g, '');
              assert.ok(message.includes('Received promise resolved instead of rejected'), row.fullName);
            }
            const controls = [
              'refuses an Earn deposit abandoned during known fee discovery',
              'requeues a live Earn deposit with request bytes when its fee is unknown'
            ];
            for (const title of controls) assert.ok(suite.assertionResults.some(row => row.title === title && row.status === 'passed'), title);
            summary.assertions = suite.assertionResults.map(row => ({title: row.title, fullName: row.fullName, status: row.status}));
            summary.expectedFailures = expectedFailures;
            summary.controls = controls;
            summary.validExpectedRed = true;
          } catch (error) {
            summary.error = error.stack || String(error);
            process.exitCode = 1;
          } finally {
            fs.mkdirSync(dir, {recursive: true});
            fs.writeFileSync(path.join(dir, 'summary.json'), JSON.stringify(summary, null, 2) + '\n');
            console.log(JSON.stringify(summary, null, 2));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-2147-earn-precondition-red-1fe48b4a2
          path: ${{ runner.temp }}/qa-2147-earn-red/
          if-no-files-found: error
          retention-days: 7

name: Compile surfaces

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-detail-visual-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  token-detail-visual:
    if: ${{ github.ref == 'refs/heads/qa/2028-token-detail-visual-4de8-20261112' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QA_BRANCH: qa/2028-token-detail-visual-4de8-20261112
      BASELINE_SHA: 94e5ba9b2a40df2e706a323e0155510880cabaa0
      BASELINE_TREE: a6dde6ee0618c0b1b815a5fb117f1fec1aa3bf93
      CANDIDATE_SOURCE_SHA: 4de8f851b42f3e249d4e8725bba3074c149fd83c
      CANDIDATE_SOURCE_TREE: b6d3d676fa84d369091de4ac807376b3a5b99f4d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact QA commit, source and overlay paths
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$QA_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$CANDIDATE_SOURCE_SHA^{tree}")" = "$CANDIDATE_SOURCE_TREE"
          test "$(git rev-parse "$BASELINE_SHA^{tree}")" = "$BASELINE_TREE"
          git merge-base --is-ancestor "$BASELINE_SHA" "$CANDIDATE_SOURCE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SOURCE_SHA" HEAD

          expected_paths=$(printf '%s\n' \
            .github/workflows/pr-compile-surfaces.yml \
            playwright.token-detail-visual.config.ts \
            playwright/visual/token-detail/fixture.tsx \
            playwright/visual/token-detail/history.fixture.tsx \
            playwright/visual/token-detail/index.html \
            playwright/visual/token-detail/main.tsx \
            playwright/visual/token-detail/native-faucet.fixture.ts \
            playwright/visual/token-detail/vite.config.mts \
            playwright/visual/token-detail/visual.spec.ts \
            tsconfig.token-detail-visual.json | LC_ALL=C sort)
          actual_paths=$(git diff --name-only "$CANDIDATE_SOURCE_SHA" HEAD | LC_ALL=C sort)
          test "$actual_paths" = "$expected_paths"

          protected_paths=(
            src/app/pages/TokenDetail.tsx
            src/app/pages/TokenDetail.test.tsx
            src/app/templates/history/History.tsx
            src/app/templates/history/PendingActivityCard.tsx
            src/app/templates/history/useActivityClaimList.tsx
            src/lib/prices/amount.ts
            src/lib/prices/amount.test.ts
            src/lib/prices/binance.ts
            src/lib/prices/binance.test.ts
            src/lib/prices/feed.ts
            src/lib/prices/feed.test.ts
            src/lib/prices/fixed.ts
            src/lib/prices/unquoted-default.ts
            src/lib/prices/use-quote-clock.ts
            src/lib/miden/metadata/scale.ts
            public/_locales/en/en.json
            CHANGELOG.md
            package.json
            yarn.lock
          )
          git diff --exit-code "$CANDIDATE_SOURCE_SHA" HEAD -- "${protected_paths[@]}"
          for path in "${protected_paths[@]}"; do
            test "$(git rev-parse "$CANDIDATE_SOURCE_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          test -z "$(git status --porcelain)"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASELINE_SHA }}
          path: token-detail-baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Verify baseline source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C token-detail-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C token-detail-baseline rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"

      - name: Record exact before and after source bindings
        run: |
          node <<'NODE' > token-detail-visual-source.json
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const paths = [
            'src/app/pages/TokenDetail.tsx',
            'src/app/pages/TokenDetail.test.tsx',
            'src/app/templates/history/History.tsx',
            'src/app/templates/history/PendingActivityCard.tsx',
            'src/app/templates/history/useActivityClaimList.tsx',
            'src/lib/prices/amount.ts',
            'src/lib/prices/amount.test.ts',
            'src/lib/prices/binance.ts',
            'src/lib/prices/binance.test.ts',
            'src/lib/prices/feed.ts',
            'src/lib/prices/feed.test.ts',
            'src/lib/prices/fixed.ts',
            'src/lib/prices/unquoted-default.ts',
            'src/lib/prices/use-quote-clock.ts',
            'src/lib/miden/metadata/scale.ts',
            'public/_locales/en/en.json',
            'CHANGELOG.md',
            'package.json',
            'yarn.lock',
          ];
          const git = (cwd, args) => execFileSync('git', args, { cwd, encoding: 'utf8' }).trim();
          const digest = (cwd, path) => createHash('sha256').update(fs.readFileSync(`${cwd}/${path}`)).digest('hex');
          const binding = (cwd, sha) => Object.fromEntries(paths.map(path => [path, {
            git_blob: git(cwd, ['rev-parse', `${sha}:${path}`]),
            sha256: digest(cwd, path),
          }]));
          const candidate = process.cwd();
          const baseline = `${candidate}/token-detail-baseline`;
          const before = git(baseline, ['rev-parse', 'HEAD']);
          const after = git(candidate, ['rev-parse', 'HEAD']);
          console.log(JSON.stringify({
            workflow_head: after,
            workflow_tree: git(candidate, ['rev-parse', 'HEAD^{tree}']),
            candidate_source_sha: process.env.CANDIDATE_SOURCE_SHA,
            candidate_source_tree: process.env.CANDIDATE_SOURCE_TREE,
            baseline_sha: before,
            baseline_tree: git(baseline, ['rev-parse', 'HEAD^{tree}']),
            baseline_blobs: binding(baseline, before),
            candidate_blobs: binding(candidate, process.env.CANDIDATE_SOURCE_SHA),
          }, null, 2));
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frozen dependencies
        timeout-minutes: 15
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Typecheck and lint the visual harness
        timeout-minutes: 10
        run: |
          yarn tsc --noEmit --pretty false --project tsconfig.token-detail-visual.json
          yarn eslint \
            playwright.token-detail-visual.config.ts \
            playwright/visual/token-detail/fixture.tsx \
            playwright/visual/token-detail/history.fixture.tsx \
            playwright/visual/token-detail/main.tsx \
            playwright/visual/token-detail/native-faucet.fixture.ts \
            playwright/visual/token-detail/vite.config.mts \
            playwright/visual/token-detail/visual.spec.ts \
            --max-warnings 0

      - name: Install Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Prepare the identical baseline harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p token-detail-baseline/playwright/visual
          cp playwright.token-detail-visual.config.ts token-detail-baseline/
          cp -R playwright/visual/token-detail token-detail-baseline/playwright/visual/
          ln -s "$GITHUB_WORKSPACE/node_modules" token-detail-baseline/node_modules

      - name: Capture current-main baseline in four compact contexts
        working-directory: token-detail-baseline
        env:
          TOKEN_DETAIL_CAPTURE: before
        timeout-minutes: 10
        run: yarn playwright test --config playwright.token-detail-visual.config.ts

      - name: 'Capture #2028 candidate in four compact contexts'
        env:
          TOKEN_DETAIL_CAPTURE: after
        timeout-minutes: 15
        run: yarn playwright test --config playwright.token-detail-visual.config.ts

      - name: Verify visual case counts and screenshot bounds
        if: always()
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = [
            'mobile-light', 'mobile-dark', 'extension-light', 'extension-dark'
          ];
          for (const [root, role, tests] of [
            ['token-detail-baseline/test-results/token-detail-visual', 'before', 4],
            ['test-results/token-detail-visual', 'after', 24],
          ]) {
            const reportPath = path.join(root, 'results.json');
            assert.ok(fs.existsSync(reportPath), `${role} Playwright result is missing`);
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            assert.equal(report.stats?.expected, tests, `${role} selected case count`);
            assert.equal(report.stats?.unexpected, 0, `${role} failures`);
            assert.equal(report.stats?.skipped, 0, `${role} skipped cases`);
            assert.equal(report.stats?.flaky, 0, `${role} flaky cases`);
            const screenshots = [];
            const visit = directory => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const file = path.join(directory, entry.name);
                if (entry.isDirectory()) visit(file);
                else if (entry.name.endsWith('.png')) screenshots.push(file);
              }
            };
            visit(root);
            const surfaces = role === 'before' ? ['hero', 'history'] : ['hero', 'history', 'pending'];
            assert.equal(screenshots.length, surfaces.length * expected.length, `${role} screenshot count`);
            const names = screenshots.map(file => path.basename(file));
            for (const context of expected) {
              for (const surface of surfaces) {
                assert.equal(names.filter(name => name === `token-detail-${context}-${role}-${surface}.png`).length, 1,
                  `${role} ${context} ${surface} screenshot`);
              }
            }
            for (const file of screenshots) {
              const png = fs.readFileSync(file);
              assert.equal(png.readUInt32BE(16) <= 1800 && png.readUInt32BE(20) <= 1800, true,
                `screenshot exceeds 1800px: ${file}`);
            }
          }
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-detail-2028-visual-qa
          path: |
            token-detail-visual-source.json
            token-detail-baseline/test-results/token-detail-visual/
            test-results/token-detail-visual/
          if-no-files-found: warn
          retention-days: 7

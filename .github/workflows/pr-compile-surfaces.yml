name: QA capsule physical-input regressions

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: capsule-physical-input-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile Android
    runs-on: ubuntu-latest
    # Both linked-dependency injections build from source before yarn install: the
    # guardian client and the web-sdk. On a cold runner that is ~26 minutes before the
    # platform build even starts - Android's own gradle step takes 4 minutes and was
    # being cut off at the 30-minute mark having already printed BUILD SUCCESSFUL.
    # The ceiling only binds while those markers are present.
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      RESULTS: ${{ github.workspace }}/native-physical-input-red
    steps:
      - uses: actions/checkout@v4
      - name: Bind the exact test and unchanged native source
        run: |
          mkdir -p "$RESULTS"
          python3 <<'PYBIND'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = {'package.json': '7452638a89d169308c7d8bfb353927ed109e257b', 'yarn.lock': 'edab292553d3aca80fd174b6caeea28767c079a4', 'src': 'd49fa46177051e01c849de7341e40a9ce9d37e05', 'packages/dapp-browser/android/src/main': '2cf9267369d9c2f708d3d7af4472dc72a593ab79', 'packages/dapp-browser/android/src/test/java/ee/forgr/capacitor_inappbrowser/BreadPresentationControllerTest.java': '61d06cb953d3b4cab449d13889a25a8a8b22c650'}
          actual = {name: git('rev-parse', 'HEAD:' + name) for name in expected}
          source = {'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'expected_test_base': '68c7c48fe4219386b1d20eb52be7991d0d0ff3e4',
                    'native_base': 'a5f75ebe548463a655d1f9230aa9905d819fc543',
                    'expected': expected, 'actual': actual}
          pathlib.Path(os.environ['RESULTS'], 'source-binding.json').write_text(json.dumps(source, indent=2) + '\n')
          assert source['head'] == os.environ['GITHUB_SHA']
          assert actual == expected, (actual, expected)
          PYBIND
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The action's default packages include the retired 'tools' package, which sdkmanager no longer finds.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # These surfaces compile wallet code that imports unreleased APIs from
      # both the web SDK and the guardian multisig client. Without the
      # injections they build against the published packages and fail on the
      # missing exports, which reads as a wallet bug rather than an unshipped
      # dependency. Both are no-ops when the PR body carries no marker.
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr
      # Plain `yarn install` via the shared action: the injections above
      # rewrite package.json to `file:` deps, which the committed lockfile
      # cannot match, so `--frozen-lockfile` would fail by construction.
      - name: Run Install
        uses: ./.github/actions/yarn-install
      # `mobile:sync` regenerates the Capacitor bridge files the gradle build
      # needs; assembleDebug is the same target the Android E2E job builds, so a
      # break here is a break there.
      - name: Build debug APK
        run: |
          set -o pipefail
          yarn test:e2e:android:build 2>&1 | tee "$RESULTS/build-debug.log"
      - name: Prove both physical-input regressions fail
        run: |
          set +e
          cd android
          ./gradlew :miden-dapp-browser:testDebugUnitTest --tests ee.forgr.capacitor_inappbrowser.BreadPresentationControllerTest.capsuleReturnToScreenStartCancelsAfterItsParentTransforms --tests ee.forgr.capacitor_inappbrowser.BreadPresentationControllerTest.capsuleVelocityKeepsBatchedPhysicalSamplesWhenParentTransforms --max-workers=2 --console=plain > "$RESULTS/gradle.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RESULTS/gradle-exit.txt"
          cat "$RESULTS/gradle.log"
          exit "$status"
      - name: Classify exactly two executed functional failures
        if: always()
        run: |
          python3 <<'PYCLASSIFY'
          import json, os, pathlib, shutil, sys, xml.etree.ElementTree as ET
          output = pathlib.Path(os.environ['RESULTS'])
          output.mkdir(parents=True, exist_ok=True)
          junit = output / 'junit'
          junit.mkdir(exist_ok=True)
          cases = []
          for source in pathlib.Path('packages/dapp-browser/android/build/test-results/testDebugUnitTest').glob('*.xml'):
              shutil.copy2(source, junit / source.name)
              cases.extend(ET.parse(source).getroot().iter('testcase'))
          expected = {
              'capsuleReturnToScreenStartCancelsAfterItsParentTransforms': (
                  'the page follows the contact back to its original screen position',
                  "a physical return to the contact's start cancels the collapse"),
              'capsuleVelocityKeepsBatchedPhysicalSamplesWhenParentTransforms': (
                  'capsule velocity must match raw physical event history',)}
          failures = [(case, failure) for case in cases for failure in case.findall('failure')]
          errors = sum(len(case.findall('error')) for case in cases)
          messages = {case.attrib.get('name'): [failure.attrib.get('message', '')
                      for failure in case.findall('failure')] for case in cases}
          exit_path = output / 'gradle-exit.txt'
          gradle_exit = int(exit_path.read_text().strip()) if exit_path.exists() else None
          def predicted_message(name, message):
              return message.removeprefix('java.lang.AssertionError: ').startswith(expected[name])
          return_case, velocity_case = expected
          assert predicted_message(return_case, 'java.lang.AssertionError: the page follows the contact back to its original screen position expected:<1.0> but was:<0.1>')
          assert predicted_message(velocity_case, 'java.lang.AssertionError: capsule velocity must match raw physical event history expected:<1.0> but was:<0.1>')
          assert not predicted_message(return_case, 'java.lang.AssertionError: raw screen coordinates differ')
          assert not predicted_message(velocity_case, 'java.lang.AssertionError: the page follows the contact back to its original screen position')
          functional = (gradle_exit not in (None, 0) and len(cases) == 2 and errors == 0
                        and len(failures) == 2 and set(messages) == set(expected)
                        and all(case.attrib.get('classname') == 'ee.forgr.capacitor_inappbrowser.BreadPresentationControllerTest'
                                for case in cases)
                        and all(len(messages[name]) == 1 and predicted_message(name, messages[name][0])
                                for name in expected))
          result = {'source': os.environ['GITHUB_SHA'], 'selectors': list(expected), 'executed': len(cases),
                    'failures': len(failures), 'errors': errors, 'gradle_exit': gradle_exit,
                    'messages': messages, 'functional_red': functional}
          (output / 'classification.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          if not functional:
              sys.exit('Not functional red: require both exact selectors and their predicted return/velocity assertion failures')
          PYCLASSIFY
      - name: Upload exact-source red evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-physical-input-red-${{ github.run_id }}
          path: native-physical-input-red/
          retention-days: 7
          if-no-files-found: error

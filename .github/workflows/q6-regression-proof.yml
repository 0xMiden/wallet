name: Settings storage frozen regression proof
on:
  push:
    branches:
      - ci/q6-settings-council-red-proof
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind frozen regression source
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/workflow-sha.txt
          echo 7de478538d0a8494dd5106858f794118108b262a | tee proof/source-sha.txt
          test "$(git rev-parse HEAD^)" = 7de478538d0a8494dd5106858f794118108b262a
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/q6-regression-proof.yml
      - name: Install frozen dependencies
        id: install
        timeout-minutes: 6
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee proof/install.log
      - name: Expected failing preference storage regressions
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/settings/helpers.test.ts src/lib/miden/front/NativeNoteAutoConsumeManager.test.tsx --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
      - name: Verify nonzero executed regression count
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('proof/results.json'));const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,runtime:x.numRuntimeErrorTestSuites}));if(n!==106||x.numFailedTests!==23||x.numRuntimeErrorTestSuites!==0)process.exit(1);for(const s of x.testResults)for(const a of s.assertionResults)if(a.status==='failed')console.log(a.fullName)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-storage-red-proof
          path: proof/

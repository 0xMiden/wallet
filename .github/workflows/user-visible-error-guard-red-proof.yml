name: User-visible error guard red-before proof

on:
  push:
    branches: [ci/1616-guard-red]

permissions:
  contents: read

jobs:
  red-before:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PROOF_HEAD_SHA: ${{ github.sha }}
      PROOF_REF: ${{ github.ref }}
      PROOF_EVENT: ${{ github.event_name }}
      PROOF_WORKFLOW_REF: ${{ github.workflow_ref }}
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_RUN_ID: ${{ github.run_id }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Initialize private proof evidence
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="$RUNNER_TEMP/user-visible-error-guard-red-proof"
          printf 'PROOF_DIR=%s\n' "$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$PROOF_DIR"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          proof = Path(os.environ['PROOF_DIR'])
          identity = {key: value for key, value in os.environ.items() if key.startswith('PROOF_')}
          (proof / 'run-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          (proof / 'checks.log').touch()
          PYTHON

      - name: Checkout exact proof head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture and verify immutable guard source
        id: source
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTHON' 2>&1 | tee "$PROOF_DIR/source-validation.log"
          import hashlib
          import json
          import os
          import shutil
          import stat
          import subprocess
          from pathlib import Path

          proof = Path(os.environ['PROOF_DIR'])
          base = '23f18973364e9bfc5aff46343ab5bb46415a3c0f'
          base_tree = '982eddd4f616a2a4d8dd2ba656f1444a43f183f5'
          workflow = '.github/workflows/user-visible-error-guard-red-proof.yml'
          guard = {
              'path': 'src/lib/telemetry/user-visible-error.guard.test.ts',
              'source_commit': '23f18973364e9bfc5aff46343ab5bb46415a3c0f',
              'source_blob': '4ac06b4535054f61389710b1f43b31bf348a84fa',
              'sha256': '66e1ecd1efad1795d7083bdd7c592ca2e347ab915539ea6c9f463f8756c68fb4',
              'bytes': 30953,
              'mode': '100644',
              'helper_bytes': 13093,
              'helper_sha256': '63835089be849a0371298018f95aa2c2c90c373c6f34c55899e78a3cee391add'
          }
          source_commits = [
              {
                  'commit': '7fdfdd09c49f288de0f482fe8e7d94f03c371066',
                  'parent': 'f6c02fa605b435523cce1c414a306013c76d63a0',
                  'tree': '3beca85980084886f2242cab882187669e4c47f6',
                  'signature_status_at_preparation': 'G'
              },
              {
                  'commit': '8156de4c572e92ff78198d1cb9ac40828d067eb0',
                  'parent': '7fdfdd09c49f288de0f482fe8e7d94f03c371066',
                  'tree': '05ae76b86fa9056d52ba9188bc76a9d39911942b',
                  'signature_status_at_preparation': 'G'
              },
              {
                  'commit': 'aa9c86c758f969351a25726692a3bc438fdbd93e',
                  'parent': '8156de4c572e92ff78198d1cb9ac40828d067eb0',
                  'tree': 'afd83ccfc03fa53091e61493cb7c2558012032f1',
                  'signature_status_at_preparation': 'G'
              },
              {
                  'commit': 'cfc114955e71b6d5fe872c8ceb26a1687566a381',
                  'parent': 'aa9c86c758f969351a25726692a3bc438fdbd93e',
                  'tree': '6c104a68febb99c62084e7d93d9bcc63467de20f',
                  'signature_status_at_preparation': 'G'
              },
              {
                  'commit': '23f18973364e9bfc5aff46343ab5bb46415a3c0f',
                  'parent': 'cfc114955e71b6d5fe872c8ceb26a1687566a381',
                  'tree': '982eddd4f616a2a4d8dd2ba656f1444a43f183f5',
                  'signature_status_at_preparation': 'G'
              }
          ]
          def git_bytes(*args):
              return subprocess.check_output(['git', *args])

          def git(*args):
              return git_bytes(*args).decode().strip()

          def tree(commit):
              entries = {}
              for record in git_bytes('ls-tree', '-r', '-z', commit).split(b'\0'):
                  if not record:
                      continue
                  metadata, name = record.split(b'\t', 1)
                  mode, kind, blob = metadata.decode().split()
                  entries[name.decode()] = {'mode': mode, 'type': kind, 'blob': blob}
              return entries

          head = git('rev-parse', 'HEAD')
          if head != os.environ['PROOF_HEAD_SHA'] or head != os.environ['PROOF_WORKFLOW_SHA']:
              raise SystemExit('Checkout, event head and workflow SHA must match')
          if os.environ['PROOF_EVENT'] != 'push' or os.environ['PROOF_REF'] != 'refs/heads/ci/1616-guard-red':
              raise SystemExit('Proof is restricted to the disposable push branch')
          if git('rev-parse', base + '^{tree}') != base_tree:
              raise SystemExit('Immutable base tree mismatch')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, head], check=True)
          before, after = tree(base), tree(head)
          if len(before) != 3618 or any(after.get(name) != value for name, value in before.items()):
              raise SystemExit('A base path blob, type or mode changed')
          if set(after) - set(before) != {workflow} or after[workflow]['mode'] != '100644':
              raise SystemExit('Only the new regular workflow may be added')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          path = Path(guard['path'])
          data = path.read_bytes()
          helper_bytes = data.index(b'const ROOT =')
          if helper_bytes != guard['helper_bytes']:
              raise SystemExit('Scanner helper boundary mismatch')
          if path.is_symlink() or stat.S_IMODE(path.stat().st_mode) != 0o644:
              raise SystemExit('Guard file mode or type mismatch')
          if (git('hash-object', str(path)) != guard['source_blob']
                  or hashlib.sha256(data).hexdigest() != guard['sha256']
                  or len(data) != guard['bytes']
                  or hashlib.sha256(data[:guard['helper_bytes']]).hexdigest() != guard['helper_sha256']):
              raise SystemExit('Immutable guard or scanner helper mismatch')
          if after[guard['path']] != {'mode': guard['mode'], 'type': 'blob', 'blob': guard['source_blob']}:
              raise SystemExit('Guard tree entry mismatch')
          for item in source_commits:
              commit = item['commit']
              if git('rev-parse', commit + '^') != item['parent'] or git('rev-parse', commit + '^{tree}') != item['tree']:
                  raise SystemExit('Source commit ancestry or tree mismatch')
              raw = git_bytes('cat-file', 'commit', commit)
              if b'\ngpgsig ' not in raw.split(b'\n\n', 1)[0]:
                  raise SystemExit('Source commit signature missing')
              item['raw_commit_sha256'] = hashlib.sha256(raw).hexdigest()
              item['signature_present_in_ci'] = True
              target = proof / 'commits' / (commit + '.txt')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          manifest = {
              'base_commit': base,
              'base_tree': base_tree,
              'checkout_commit': head,
              'checkout_tree': git('rev-parse', 'HEAD^{tree}'),
              'base_paths_verified_unchanged': len(before),
              'source_changes': git('diff', '--name-status', base, 'HEAD').splitlines(),
              'tracked_working_tree_before_preparation': 'unchanged from checkout',
              'workflow_ref': os.environ['PROOF_WORKFLOW_REF'],
              'workflow_sha': os.environ['PROOF_WORKFLOW_SHA'],
              'workflow_blob': after[workflow]['blob'],
              'workflow_sha256': hashlib.sha256(Path(workflow).read_bytes()).hexdigest(),
              'run_id': os.environ['PROOF_RUN_ID'],
              'run_attempt': os.environ['PROOF_RUN_ATTEMPT'],
              'actions': {
                  'checkout': '11bd71901bbe5b1630ceea73d27597364c9af683',
                  'setup-node': '49933ea5288caeca8642d1e84afbd3f7d6820020',
                  'upload-artifact': 'ea165f8d65b6e75b540449e92b4886f43607fa02'
              },
              'guard': guard,
              'signed_source_commits': source_commits,
              'source_packet_hashes_at_preparation': {
                  "wallet1616-guard-fix/var-scope-fix/report.md": "e1fa1186f7eef5c167ecfbe6d67a24200c81afd91cd46cd6256407be2e0c9c6f",
                  "wallet1616-guard-fix/var-scope-fix/identity.json": "619094dd30587ed32757c7b816d3ea9b6a4122fbb4692d6c385b97b7f0a25d06",
                  "wallet1616-guard-fix/var-scope-fix/predictions.json": "c0a75a9acc0bbc17f75b2d2b5ab0b12e88b9090a6655bb511f342311b7e070b2",
                  "wallet1616-guard-fix/var-scope-fix/preservation.json": "121f733ad9c36b44d1573b4e8c84388bb85e7b107120c6107a2c6151e7e71b1b",
                  "wallet1616-guard-fix/var-scope-fix/normal-review/report.md": "3abc4bd134505aad23fec541b32d5abd4a2ecbb8f027dbc838a9593e033cc260",
                  "wallet1616-guard-fix/var-scope-fix/normal-review/findings.json": "9bcb8c4f9f941bfdfe603920f854666e4b28c116ba83465ac6effcf1679853ea",
                  "wallet1616-guard-fix/var-scope-fix/normal-review/prooflimits.json": "f7e36e84b3ad9abd9191d9ce4329d5ffa2ff06c33973003ecb9dbc27fc0c805d"
              },
              'historical_packet_hashes_at_preparation': {
                  "wallet1616-guard-ci-red/controller-acceptance.json": "e66a18216f155bc7f7a493e6cd6df9fff5cb675f0f45a363f5650af56fc4280b",
                  "wallet1616-guard-fix/review-regressions/ci-transport/controller-acceptance.json": "eb22e39bce4887e4db345e8fa35e6fa7536ed52cc83dc8ad33c40f9b60a298a0"
              },
              'prior_actual_ci_evidence_at_preparation': {
                  "run_id": 39355725876,
                  "run_attempt": 1,
                  "source_commit": "cfc114955e71b6d5fe872c8ceb26a1687566a381",
                  "transport_commit": "9c79fb7c1e883080ffbd7f8ef69c45b26cfed26d",
                  "accepted_status": "ACCEPTED_TWO_VAR_SCOPE_ASSERTION_REDS_ONLY",
                  "counts": {
                      "tests": 61,
                      "target_selftest_failures": 2,
                      "separate_production_assertion_failure": 1,
                      "passes": 58,
                      "skips": 0,
                      "runtime_errors": 0
                  },
                  "lint": "success",
                  "types": "success",
                  "current_checkpoint_results": "UNRUN at transport preparation; this is historical red-before evidence"
              },
              'source_predictions_only': {
                  "total_assertions": 61,
                  "expected_selftests_pass": 60,
                  "prior_identity_regressions_required_pass": 12,
                  "var_scope_regressions_required_pass": 2,
                  "required_passing_regressions": [
                      "user-visible error guard self-tests guards imported surfaces after a lexical loop while ignoring its local binding: for (const ErrorLine of alternatives)",
                      "user-visible error guard self-tests guards imported surfaces after a lexical loop while ignoring its local binding: for (let ErrorLine of alternatives)",
                      "user-visible error guard self-tests guards imported surfaces after a lexical loop while ignoring its local binding: for (const ErrorLine in alternatives)",
                      "user-visible error guard self-tests guards imported surfaces after a lexical loop while ignoring its local binding: for (let ErrorLine in alternatives)",
                      "user-visible error guard self-tests guards imported surfaces after a lexical loop while ignoring its local binding: for (const ErrorLine = Local; ready;)",
                      "user-visible error guard self-tests guards imported surfaces after a lexical loop while ignoring its local binding: for (let ErrorLine = Local; ready; advance())",
                      "user-visible error guard self-tests does not waive native alerts through an unrelated explicit hook export: star then named override",
                      "user-visible error guard self-tests does not waive native alerts through an unrelated explicit hook export: star then default alias override",
                      "user-visible error guard self-tests does not waive native alerts through an unrelated explicit hook export: star then local function",
                      "user-visible error guard self-tests does not waive native alerts through an unrelated explicit hook export: local function then star",
                      "user-visible error guard self-tests does not waive native alerts through an unrelated explicit hook export: star then local constant",
                      "user-visible error guard self-tests does not waive native alerts through an unrelated explicit hook export: local constant then star",
                      "user-visible error guard self-tests does not waive native alerts through a var hook alias in an unbraced lexical-loop body",
                      "user-visible error guard self-tests keeps a var surface alias in an unbraced lexical-loop body shadowed after the loop"
                  ],
                  "intended_selftest_assertion_reds": 0,
                  "intended_failed_selftests": [],
                  "production_assertions_run_unsuppressed": 1,
                  "production_assertion_reds": 1,
                  "production_violations": [
                      {
                          "file": "src/app/templates/history/PendingActivityCard.tsx",
                          "line": 231,
                          "category": "missing-error-id",
                          "surface": "Notice"
                      },
                      {
                          "file": "src/screens/send-flow/AddContactDrawer.tsx",
                          "line": 122,
                          "category": "unreported-alert"
                      },
                      {
                          "file": "src/screens/send-flow/SendAmount.tsx",
                          "line": 116,
                          "category": "missing-error-id",
                          "surface": "AmountInput"
                      }
                  ],
                  "predicted_total_assertion_reds": 1,
                  "predicted_total_passes": 60,
                  "predicted_total_skipped": 0,
                  "predicted_runtime_errors": 0,
                  "predicted_lint": "success",
                  "predicted_types": "success",
                  "current_checkpoint_ci": "UNRUN; predictions must be measured"
              }
          }
          (proof / 'source-and-workflow-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (proof / 'base-tree.json').write_text(json.dumps(before, indent=2, sort_keys=True) + '\n')
          (proof / 'head-tree.json').write_text(json.dumps(after, indent=2, sort_keys=True) + '\n')
          for name in [guard['path'], workflow]:
              target = proof / 'source' / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          print('Verified 3618 unchanged base entries and one workflow addition; predictions are not CI results')
          PYTHON

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install frozen dependencies with existing preparation hooks
        id: install
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          yarn install --frozen-lockfile --non-interactive 2>&1 | tee "$PROOF_DIR/install.log"

      - name: Verify prepared source remains unchanged
        id: prepared
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          {
            git diff --exit-code HEAD --
            printf '%s  %s\n' \
              66e1ecd1efad1795d7083bdd7c592ca2e347ab915539ea6c9f463f8756c68fb4 \
              src/lib/telemetry/user-visible-error.guard.test.ts | sha256sum --check --strict
          } 2>&1 | tee "$PROOF_DIR/prepared-source.log"

      - name: Check only the guard file with ESLint
        id: eslint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.source.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          yarn eslint --max-warnings 0 src/lib/telemetry/user-visible-error.guard.test.ts \
            2>&1 | tee "$PROOF_DIR/eslint.log" | tee -a "$PROOF_DIR/checks.log"

      - name: Check TypeScript without emitting
        id: typescript
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.source.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          yarn tsc --noEmit --pretty false 2>&1 | tee "$PROOF_DIR/typescript.log" | tee -a "$PROOF_DIR/checks.log"

      - name: Run only guard selftests and unsuppressed production completeness
        id: jest
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.source.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          yarn jest --runTestsByPath src/lib/telemetry/user-visible-error.guard.test.ts \
            --maxWorkers=2 --coverage=false --json --outputFile="$PROOF_DIR/jest.json" \
            2>&1 | tee "$PROOF_DIR/jest.log" | tee -a "$PROOF_DIR/checks.log"

      - name: Record separate check outcomes even on failure
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          PREPARED_SOURCE_OUTCOME: ${{ steps.prepared.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          JEST_OUTCOME: ${{ steps.jest.outcome }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          outcomes = {key: value for key, value in os.environ.items() if key.endswith('_OUTCOME')}
          (Path(os.environ['PROOF_DIR']) / 'step-outcomes.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          PYTHON

      - name: Upload private guard evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: user-visible-error-guard-red-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

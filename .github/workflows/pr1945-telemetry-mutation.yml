name: PR1945 telemetry fixture sensitivity proof
on:
  push:
    branches: ['ci/pr1945-telemetry-mutation-*']
concurrency:
  group: e2e-telemetry-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  # The linked-PR injections list a dispatched branch's open pull request and read its description.
  pull-requests: read
jobs:
  telemetry-egress:
    name: telemetry-egress (chrome)
    runs-on: ubuntu-latest
    # A dispatch may first build a linked web-sdk PR from source (about 26 min on ubuntu-latest, pr-compile-surfaces.yml).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      # On a dispatch from a pull request's branch these build against that pull request's linked
      # web-sdk and Guardian PRs, as its own CI does; on a push both are no-ops. Skipped on this
      # suite's own pull request runs, which install the published packages as they always have.
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      # Not frozen: an injection rewrites package.json to `file:` deps the committed lockfile cannot match.
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      - name: Install Playwright Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      # The build this suite exists for: the ONLY configuration in the repo with
      # a live Aptabase endpoint compiled in. It points at 127.0.0.1, and
      # SENTRY_DSN is unset, so a suite that accepts consent cannot reach
      # anything off the runner. `build:chrome:telemetry` holds the values;
      # the spec reads them back out of the bundle before it trusts them.
      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture

      - name: Build extension with telemetry pointed at the local sink
        run: yarn build:chrome:telemetry

      - name: Prepare pinned sensitivity helper
        run: |
          python3 - <<'SETUP'
          import base64,hashlib,json,os
          from pathlib import Path
          s=Path('/tmp/pr1945-telemetry-mutation');s.mkdir()
          helper=base64.b64decode('')
          assert hashlib.sha256(helper).hexdigest()=='32bf2e9ca9c676dac2916f9bf3acc1c048e5fa76060178a6cb65fd61ee045bfc'
          (s/'mutate.sh').write_bytes(helper)
          (s/'check.py').write_bytes(base64.b64decode(''))
          (s/'state.json').write_text(json.dumps({'phase':'fix'}))
          (s/'scope.env').write_text('REV_ROOT='+repr(os.environ['GITHUB_WORKSPACE'])+'\n')
          SETUP
      - name: Expose exact fixture fix hunks against the regression source
        run: |
          git reset --mixed 92215cea7055dba8757048747984945f6a5c5d0f
          git diff > /tmp/pr1945-telemetry-mutation/fixed-fixture.patch
      - name: Revert every fixture code hunk and prove sensitivity
        run: |
          set -o pipefail
          bash /tmp/pr1945-telemetry-mutation/mutate.sh /tmp/pr1945-telemetry-mutation 'python3 /tmp/pr1945-telemetry-mutation/check.py' 2>&1 | tee /tmp/pr1945-telemetry-mutation/mutation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1945-telemetry-sensitivity
          path: /tmp/pr1945-telemetry-mutation/
          if-no-files-found: error
          retention-days: 7

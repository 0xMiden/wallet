name: Eligibility topology preflight expected red
on:
  push:
    branches: [ci/1894-preflight-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = fef8340c349eb782bdd80c728778bd9d944e9018
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-preflight.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - account-bound inventory preparation produces only a local manifest' result.log || exit 1
          grep -F 'ok 3 - account-bound preparation rejects a pre-existing script' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest-red
          path: result.log

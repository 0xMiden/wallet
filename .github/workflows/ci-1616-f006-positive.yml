      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Record runtime and install the frozen workspace
        shell: bash
        run: |
          source "$PROOF_DIR/logger.bash"
          if run_logged prerequisites/node node --version; then :; else exit "$?"; fi
          if run_logged prerequisites/yarn yarn --version; then :; else exit "$?"; fi
          if run_logged prerequisites/python python3 --version; then :; else exit "$?"; fi
          if run_logged prerequisites/git git --version; then :; else exit "$?"; fi
          test "$(node --version)" = v22.23.3
          test "$(yarn --version)" = 1.22.22
          if run_logged prerequisites/install yarn install --frozen-lockfile --network-timeout 600000; then :; else exit "$?"; fi
          python3 "$PROOF_DIR/collector.py" framework
      - name: Check the named source and frozen regressions
        shell: bash
        run: |
          source "$PROOF_DIR/logger.bash"
          paths=(
            src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.tsx
            src/app/templates/EvmConnectModal/EvmBridgeDepositStatus.tsx
            src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.usdcx.test.tsx
            src/app/templates/EvmConnectModal/EvmBridgeDepositStatus.test.tsx
          )
          if run_logged prerequisites/format yarn -s prettier --check "${paths[@]}"; then :; else exit "$?"; fi
          if run_logged prerequisites/lint yarn -s eslint "${paths[@]}"; then :; else exit "$?"; fi
          if run_logged prerequisites/typescript yarn -s tsc --noEmit -p .; then :; else exit "$?"; fi
      - name: Positive full140 cases
        shell: bash
        run: |
          source "$PROOF_DIR/logger.bash"
          python3 "$PROOF_DIR/collector.py" snapshot positive/before fixed
          if run_logged positive yarn -s jest --runTestsByPath src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.usdcx.test.tsx src/app/templates/EvmConnectModal/EvmBridgeDepositStatus.test.tsx --maxWorkers=2 --json --outputFile="$PROOF_DIR/raw-results/positive/jest-results.json"; then :; else :; fi
          python3 "$PROOF_DIR/collector.py" snapshot positive/after fixed
          python3 "$PROOF_DIR/collector.py" classify positive
      - name: Caller-only omission full140 cases
        shell: bash
        run: |
          source "$PROOF_DIR/logger.bash"
          python3 "$PROOF_DIR/collector.py" mutate omit-caller
          python3 "$PROOF_DIR/collector.py" snapshot omit-caller/before omit-caller
          if run_logged omit-caller yarn -s jest --runTestsByPath src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.usdcx.test.tsx src/app/templates/EvmConnectModal/EvmBridgeDepositStatus.test.tsx --maxWorkers=2 --json --outputFile="$PROOF_DIR/raw-results/omit-caller/jest-results.json"; then :; else :; fi
          python3 "$PROOF_DIR/collector.py" snapshot omit-caller/after omit-caller
          python3 "$PROOF_DIR/collector.py" classify omit-caller
      - name: Restore before the independent consumer omission
        shell: bash
        run: |
          python3 "$PROOF_DIR/collector.py" restore
          python3 "$PROOF_DIR/collector.py" snapshot between-omissions-restore fixed
      - name: Consumer-only omission full140 cases
        shell: bash
        run: |
          source "$PROOF_DIR/logger.bash"
          python3 "$PROOF_DIR/collector.py" mutate omit-consumer
          python3 "$PROOF_DIR/collector.py" snapshot omit-consumer/before omit-consumer
          if run_logged omit-consumer yarn -s jest --runTestsByPath src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.usdcx.test.tsx src/app/templates/EvmConnectModal/EvmBridgeDepositStatus.test.tsx --maxWorkers=2 --json --outputFile="$PROOF_DIR/raw-results/omit-consumer/jest-results.json"; then :; else :; fi
          python3 "$PROOF_DIR/collector.py" snapshot omit-consumer/after omit-consumer
          python3 "$PROOF_DIR/collector.py" classify omit-consumer
      - name: Restored full140 cases
        shell: bash
        run: |
          source "$PROOF_DIR/logger.bash"
          python3 "$PROOF_DIR/collector.py" restore
          python3 "$PROOF_DIR/collector.py" snapshot restored/before fixed
          if run_logged restored yarn -s jest --runTestsByPath src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.usdcx.test.tsx src/app/templates/EvmConnectModal/EvmBridgeDepositStatus.test.tsx --maxWorkers=2 --json --outputFile="$PROOF_DIR/raw-results/restored/jest-results.json"; then :; else :; fi
          python3 "$PROOF_DIR/collector.py" snapshot restored/after fixed
          python3 "$PROOF_DIR/collector.py" classify restored
      - name: Always restore the exact signed production source
        if: always()
        shell: bash
        run: |
          if [ -f "$PROOF_DIR/collector.py" ]; then
            python3 "$PROOF_DIR/collector.py" finalize
          else
            exit 1
          fi
      - name: Seal every producer payload
        if: always()
        shell: bash
        run: |
          python3 "$PROOF_DIR/collector.py" seal
      - name: Preserve complete raw proof including hidden source views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-f006-positive-and-two-omissions
          path: ${{ env.PROOF_DIR }}/
          include-hidden-files: true
          if-no-files-found: error

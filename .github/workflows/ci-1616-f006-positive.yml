          expected = {'collector.py': '88dd0de84f17f05eb89054b8cbadaa3d55d0e1f0b47828a7b197f12c58f97f63', 'logger.bash': '18d46d86a944917cf8ba47d1afe85cd089b487dbd7004996bb9c398a7218895e', 'contract.json': '3a0ddbdd3e7233a9ba8c79fdb8492b626b0133af6ef6313b8560fd55b70b05fc'}

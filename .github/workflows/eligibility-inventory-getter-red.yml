name: Eligibility inventory descriptor expected red
on:
  push:
    branches: [ci/1894-inventory-getter-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 329b99323ef02a0f5366ccd3b0dfa849025e1afa
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-manifest.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 4 - topology manifest rejects accessor-backed identity and inventory' result.log || exit 1
          grep -F 'not ok 5 - topology manifest independently rejects accessor-backed inventory' result.log || exit 1
          grep -F '# fail 2' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest-red
          path: result.log

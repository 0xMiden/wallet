name: Eligibility failure expected red
on:
  push:
    branches: [ci/1894-failure-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = d61f1d60e3c9f9e405ab06a80b18650524321260
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-failure.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - failure scenario distinguishes overload from a retryable failure' result.log || exit 1
          grep -F 'not ok 3 - failure scenario rejects skipping the bounded retry' result.log || exit 1
          grep -F '# fail 3' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-red
          path: result.log

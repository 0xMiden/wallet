name: Eligibility provider redaction expected red
on:
  push:
    branches: [ci/1894-ownership-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = c16597f1fc3389d345dbc42ce000bc55dcbc56c6
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-ownership.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - live topology evidence is bound to account, markers, content and safe logging without authorizing cleanup' result.log || exit 1
          grep -F 'ok 2 - observation fixture binds the named script and distinct namespaces' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest-red
          path: result.log

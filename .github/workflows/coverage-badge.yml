name: Badges

# Publishes the Jest line-coverage % (coverage.json) and total test count
# (tests.json) to the orphan `badges` branch so shields.io renders live badges
# in README.md. Runs only after a push to main. It does not rerun the suite: the
# pushed commit's pull request already measured both in pr.yml's Coverage Check,
# which uploads them as the `coverage-badge-data` artifact, so this reads that
# artifact from the newest pr.yml run of the PR's head. A push with no PR, or a
# PR whose runs carry no artifact, leaves the badges as they are. No external
# service login required - shields.io reads the JSON directly from
# raw.githubusercontent.com. The `badges` branch is an orphan holding only the
# endpoint JSON; nothing merges back into main.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  coverage-badge:
    name: Publish coverage badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the pull request's coverage run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          if [ -z "$pr" ]; then
            echo "::notice::$SHA came from no merged pull request; badges left unchanged"
            echo "run=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
          run=""
          # Newest first. A run counts only if its Coverage Check uploaded the badge data, so a run cut short or a
          # failed coverage gate is skipped rather than read.
          for id in $(gh api "repos/$REPO/actions/workflows/pr.yml/runs?head_sha=$head&per_page=20" --jq '.workflow_runs[].id'); do
            if gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name == "coverage-badge-data" and .expired == false) | .id' | grep -q .; then
              run=$id; break
            fi
          done
          if [ -z "$run" ]; then
            echo "::notice::no pr.yml run of #$pr ($head) carries coverage-badge-data; badges left unchanged"
          else
            echo "Reading #$pr's coverage from pr.yml run $run"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Download badge data
        if: steps.source.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.source.outputs.run }}" --repo "${{ github.repository }}" --name coverage-badge-data --dir /tmp/badge
      - name: Compose shields.io endpoint JSON
        if: steps.source.outputs.run != ''
        id: badge
        run: |
          set -euo pipefail
          pct=$(node -e 'process.stdout.write(Number(require("/tmp/badge/badge-data.json").lines).toFixed(1))')
          int=$(printf '%.0f' "$pct")
          color=red
          if [ "$int" -ge 80 ]; then color=yellow; fi
          if [ "$int" -ge 90 ]; then color=brightgreen; fi
          if [ "$int" -ge 95 ]; then color=green; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > /tmp/coverage.json
          echo "Line coverage: ${pct}%"
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"

          count=$(node -e 'process.stdout.write(String(require("/tmp/badge/badge-data.json").tests))')
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"blue"}\n' "$count" > /tmp/tests.json
          echo "Total tests: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
      - name: Publish to `badges` branch
        if: steps.source.outputs.run != ''
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null 2>&1; then
            git fetch origin badges
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . > /dev/null 2>&1 || true
          fi
          cp /tmp/coverage.json coverage.json
          cp /tmp/tests.json tests.json
          git add coverage.json tests.json
          if git diff --cached --quiet; then
            echo "Badge JSON unchanged"
          else
            git commit -m "chore: badges -> coverage ${{ steps.badge.outputs.pct }}%, tests ${{ steps.badge.outputs.count }}"
            git push origin badges
          fi

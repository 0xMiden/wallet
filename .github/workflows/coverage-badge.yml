name: Badges

# Publishes the Jest line-coverage % (coverage.json) and total test count
# (tests.json) to the orphan `badges` branch so shields.io renders live badges
# in README.md. Runs only after a push to main. It does not rerun the suite: the
# pushed commit's pull request already measured both in pr.yml's Coverage Check,
# which uploads them as the `coverage-badge-data` artifact, so this reads that
# artifact from the newest pr.yml run of the PR's head. A push with no PR, or a
# PR whose runs carry no artifact, leaves the badges as they are. No external
# service login required - shields.io reads the JSON directly from
# raw.githubusercontent.com. The `badges` branch is an orphan holding only the
# endpoint JSON; nothing merges back into main.
on:
  push:
    branches: [main]

# One publish at a time, never cancelled. Each run also checks it is still for
# the main tip right before it pushes, so a run for a superseded commit skips
# rather than overwriting newer badges.
concurrency:
  group: badges
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: read

# Every value that comes from the API or the artifact reaches a script through
# `env:`, never `${{ }}` inside `run:`.
jobs:
  coverage-badge:
    name: Publish coverage badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the pull request's coverage run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out=$(node scripts/badge-source-run.mjs "$REPO" "$SHA")
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
          case "$out" in
            *reason=no-pr*) echo "::notice::$SHA came from no merged pull request into main; badges left unchanged" ;;
            *reason=no-artifact*) echo "::warning::no pr.yml run of the pull request that merged $SHA carries coverage-badge-data; badges left unchanged" ;;
            *) printf 'Reading coverage from:\n%s\n' "$out" ;;
          esac
      - name: Download badge data
        if: steps.source.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run }}
        run: gh run download "$RUN_ID" --repo "$REPO" --name coverage-badge-data --dir "$RUNNER_TEMP/badge"
      - name: Validate badge data
        if: steps.source.outputs.run != ''
        id: data
        run: node scripts/badge-data.mjs read "$RUNNER_TEMP/badge/badge-data.json" >> "$GITHUB_OUTPUT"
      - name: Compose shields.io endpoint JSON
        if: steps.source.outputs.run != ''
        env:
          PCT: ${{ steps.data.outputs.pct }}
          COUNT: ${{ steps.data.outputs.count }}
        run: |
          set -euo pipefail
          int=$(printf '%.0f' "$PCT")
          color=red
          if [ "$int" -ge 80 ]; then color=yellow; fi
          if [ "$int" -ge 90 ]; then color=brightgreen; fi
          if [ "$int" -ge 95 ]; then color=green; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > /tmp/coverage.json
          echo "Line coverage: ${PCT}%"
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"blue"}\n' "$COUNT" > /tmp/tests.json
          echo "Total tests: ${COUNT}"
      - name: Check this is still the main tip
        if: steps.source.outputs.run != ''
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tip=$(node scripts/badge-source-run.mjs --check-tip "$REPO" "$SHA")
          echo "$tip" >> "$GITHUB_OUTPUT"
          if [ "$tip" != "tip=true" ]; then
            echo "::notice::$SHA is no longer the tip of main; the newer push publishes the badges"
          fi
      - name: Publish to `badges` branch
        if: steps.source.outputs.run != '' && steps.tip.outputs.tip == 'true'
        env:
          PCT: ${{ steps.data.outputs.pct }}
          COUNT: ${{ steps.data.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null 2>&1; then
            git fetch origin badges
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . > /dev/null 2>&1 || true
          fi
          cp /tmp/coverage.json coverage.json
          cp /tmp/tests.json tests.json
          git add coverage.json tests.json
          if git diff --cached --quiet; then
            echo "Badge JSON unchanged"
          else
            git commit -m "chore: badges -> coverage ${PCT}%, tests ${COUNT}"
            git push origin badges
          fi

name: Eligibility class collection expected red
on:
  push:
    branches: [ci/1894-class-collect-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 952a015d600ff23c20fffb69dab862a753b42e69
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-collect-namespaces.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 4 - namespace collection retains the class paired with each owned identity' result.log || exit 1
          grep -F 'ok 1 - namespace collection repeats fixed-path inventory and returns matching identities' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect-red
          path: result.log

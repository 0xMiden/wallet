name: Eligibility restart expected red
on:
  push:
    branches: [ci/1894-restart-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = c7d65deab929a62d78c3b4a6cf7a6c7fc0710d82
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-restart.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - restart scenario preserves a lease and resets the next day' result.log || exit 1
          grep -F 'not ok 4 - restart scenario detects a failed day reset' result.log || exit 1
          grep -F '# fail 4' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-red
          path: result.log

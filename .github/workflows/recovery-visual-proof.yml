name: Recovery visual proof
on:
  push:
    branches: [ci/recovery-visual-1948-fixed]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: npx playwright install --with-deps chromium
      - run: yarn playwright test --config playwright.recovery-visual.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-visual
          path: test-results/recovery-visual/

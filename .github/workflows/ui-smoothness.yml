# Untrusted half of the UI smoothness bot.
#
# The job runs on macOS. The mock client's browser build rejects its own
# genesis block in Linux headless Chrome (`block signature at position 0
# does not verify`), so the wallet never finishes creating and there is
# nothing to measure. The same create works in macOS Chrome.
#
# This workflow builds and runs code the PR author controls, so it holds no
# credentials that can write to the pull request. It emits feel samples for six
# passes from Overview to Swap, six tap durations, and three overview-list scrolls.
# ui-smoothness-comment.yml, which never checks
# out pull request code, renders and posts the comment.
#
# !! ui-smoothness-comment.yml matches this workflow by the `name:` field
# !! below, not by filename. Renaming it silently disables the PR comment.
name: UI Smoothness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # A denylist, same as the proving bench: a missed path wastes a run, an
    # allowlist that misses a path ships an unmeasured change. Only trees that
    # cannot reach the mobile UI bundle are listed. The comment renderer is
    # listed because workflow_run executes the default branch's copy, so this
    # pull request's renderer never runs.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "ios/**"
      - "android/**"
      - "src-tauri/**"
      - "playwright/**"
      - ".github/workflows/ui-smoothness-comment.yml"
      - ".github/scripts/render-ui-smoothness-comment.mjs"
      - ".github/scripts/render-ui-smoothness-comment.test.mjs"
      - ".github/scripts/ui-smoothness-profile.mjs"

permissions:
  contents: read

concurrency:
  group: ui-smoothness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Same-build repeats, only on this branch, to read the noise floor. Removed
  # once the floor is set from the spread.
  repeat:
    name: Repeat the same build
    if: ${{ github.head_ref == 'fix/home-carousel-snap' && !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Install
        uses: ./.github/actions/yarn-install

      - name: Install Playwright Chrome
        timeout-minutes: 12
        run: npx playwright install --with-deps chrome

      - name: Measure the same build six times
        timeout-minutes: 40
        env:
          BENCH_BROWSER: chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reps"
          for i in 1 2 3 4 5 6; do
            echo "repeat $i/6"
            rebuild=()
            if [ "$i" = 1 ]; then rebuild=(--rebuild); fi
            BENCH_PROFILE="repeat-$i" node scripts/home-swipe-bench.mjs \
              --label "repeat-$i" --reps 6 --throttle 4 "${rebuild[@]}" \
              --summary "$RUNNER_TEMP/reps/$i.json"
          done
          node --input-type=module -e '
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";
            const dir = process.env.RUNNER_TEMP + "/reps";
            const rows = readdirSync(dir).filter(name => name.endsWith(".json")).sort().map(name => {
              const body = JSON.parse(readFileSync(dir + "/" + name, "utf8"));
              const mid = values => {
                const sorted = [...values].sort((a, b) => a - b);
                const i = Math.floor(sorted.length / 2);
                return sorted.length % 2 ? sorted[i] : (sorted[i - 1] + sorted[i]) / 2;
              };
              return {
                label: body.label,
                feel: mid(body.samples),
                inp: Math.max(...body.inp),
                listDropped: mid(body.listDropped),
                listP95: mid(body.listP95)
              };
            });
            writeFileSync(process.env.RUNNER_TEMP + "/spread.json", JSON.stringify(rows, null, 2));
            console.log(JSON.stringify(rows, null, 2));
          '

      - name: Upload the repeats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoothness-repeats
          path: |
            ${{ runner.temp }}/spread.json
            ${{ runner.temp }}/reps
          if-no-files-found: ignore

  measure:
    name: Measure feel
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Install
        uses: ./.github/actions/yarn-install

      - name: Install Playwright Chrome
        timeout-minutes: 12
        run: npx playwright install --with-deps chrome

      - name: Measure head and base
        timeout-minutes: 25
        env:
          BENCH_BROWSER: chrome
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          git fetch origin "$BASE_REF"
          base_sha="$(git merge-base HEAD "origin/$BASE_REF")"
          mkdir -p "$RUNNER_TEMP/harness"
          cp scripts/home-swipe-bench.mjs scripts/home-swipe-score.mjs scripts/ui-smoothness-artifact.mjs "$RUNNER_TEMP/harness/"

          measure() {
            local label="$1"
            BENCH_PROFILE="$label" node scripts/home-swipe-bench.mjs \
              --label "$label" --reps 6 --throttle 4 --rebuild \
              --summary "$RUNNER_TEMP/$label.json"
          }

          measure head

          git checkout "$base_sha" -- .
          mkdir -p scripts
          cp "$RUNNER_TEMP/harness/home-swipe-bench.mjs" "$RUNNER_TEMP/harness/home-swipe-score.mjs" scripts/
          if ! git diff --quiet "$head_sha" "$base_sha" -- yarn.lock; then
            yarn install --frozen-lockfile
          fi
          measure base

          node "$RUNNER_TEMP/harness/ui-smoothness-artifact.mjs" \
            "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/results.json"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoothness-report
          path: ${{ runner.temp }}/results.json
          if-no-files-found: ignore

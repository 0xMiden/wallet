      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Install frozen lock and retain runtime versions
        id: install
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record corepack-enable corepack enable
          record corepack-prepare corepack prepare yarn@1.22.22 --activate
          record node-version node --version
          record yarn-version yarn --version
          record python-version python3 --version
          record install yarn install --frozen-lockfile --network-timeout 600000
          record jest-version yarn --silent jest --version
      - name: Named changed-file format lint and whole types before runtime
        id: preflight
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record snapshot-before python3 "$PROOF_DIR/capture.py" snapshot before
          failed=0
          if record format yarn prettier --check src/lib/telemetry/crash.ts src/lib/telemetry/crash.test.ts src/lib/telemetry/crash.visibility.worker.test.ts src/lib/telemetry/egress-boundary.test.ts; then :; else failed=1; fi
          if record lint yarn eslint src/lib/telemetry/crash.ts src/lib/telemetry/crash.test.ts src/lib/telemetry/crash.visibility.worker.test.ts src/lib/telemetry/egress-boundary.test.ts --max-warnings 0; then :; else failed=1; fi
          if record types yarn ts --noEmit; then :; else failed=1; fi
          exit "$failed"
      - name: Positive seven complete suites
        id: positive
        if: steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record positive yarn jest --runTestsByPath src/lib/miden/repo.test.ts src/lib/telemetry/crash-diagnostics.test.ts src/lib/telemetry/crash-diagnostics.policy.test.ts src/lib/telemetry/crash.test.ts src/lib/telemetry/crash.visibility.worker.test.ts src/lib/telemetry/egress-boundary.test.ts src/lib/telemetry/guarantees.test.ts --maxWorkers=2 --coverage=false --watch=false --testLocationInResults --json --outputFile="$PROOF_DIR/positive.jest.json"
      - name: Retain positive source index runtime and framework
        id: positive_after
        if: always() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record snapshot-positive-after python3 "$PROOF_DIR/capture.py" snapshot positive-after
      - name: Restore only duplicate production tag and bind mutant source
        id: mutation
        if: always() && steps.positive.outcome == 'success' && steps.positive_after.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record mutation python3 "$PROOF_DIR/capture.py" mutate
          record snapshot-mutant-before python3 "$PROOF_DIR/capture.py" snapshot mutant-before tag-restored
      - name: Run seven complete suites with natural sensitivity failure
        id: mutant
        if: always() && steps.mutation.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record tag-restored yarn jest --runTestsByPath src/lib/miden/repo.test.ts src/lib/telemetry/crash-diagnostics.test.ts src/lib/telemetry/crash-diagnostics.policy.test.ts src/lib/telemetry/crash.test.ts src/lib/telemetry/crash.visibility.worker.test.ts src/lib/telemetry/egress-boundary.test.ts src/lib/telemetry/guarantees.test.ts --maxWorkers=2 --coverage=false --watch=false --testLocationInResults --json --outputFile="$PROOF_DIR/tag-restored.jest.json"
      - name: Retain mutant source index runtime and framework
        id: mutant_after
        if: always() && steps.mutation.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record snapshot-mutant-after python3 "$PROOF_DIR/capture.py" snapshot mutant-after tag-restored
      - name: Safely restore exact fixed source and retain before snapshot
        id: restoration
        if: always() && steps.preflight.outcome == 'success' && steps.positive_after.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record restoration python3 "$PROOF_DIR/capture.py" restore
          record snapshot-restored-before python3 "$PROOF_DIR/capture.py" snapshot restored-before
      - name: Exact restored seven complete suites
        id: restored
        if: always() && steps.mutation.outcome == 'success' && steps.mutant_after.outcome == 'success' && steps.restoration.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record restored yarn jest --runTestsByPath src/lib/miden/repo.test.ts src/lib/telemetry/crash-diagnostics.test.ts src/lib/telemetry/crash-diagnostics.policy.test.ts src/lib/telemetry/crash.test.ts src/lib/telemetry/crash.visibility.worker.test.ts src/lib/telemetry/egress-boundary.test.ts src/lib/telemetry/guarantees.test.ts --maxWorkers=2 --coverage=false --watch=false --testLocationInResults --json --outputFile="$PROOF_DIR/restored.jest.json"
      - name: Retain restored source index runtime and framework
        id: restored_after
        if: always() && steps.restoration.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record snapshot-restored-after python3 "$PROOF_DIR/capture.py" snapshot restored-after
      - name: Classify positive causal tag restoration and exact restored
        if: always() && steps.bind.outcome == 'success'
        run: |
          set -euo pipefail
          source "$PROOF_DIR/record.sh"
          record classification python3 "$PROOF_DIR/capture.py" classify
      - name: Seal all raw producer payloads
        if: always() && steps.bind.outcome == 'success'
        run: |
          set -euo pipefail
          python3 "$PROOF_DIR/capture.py" seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1631-storage-wire-budget-positive
          path: ${{ runner.temp }}/1631-storage-wire-budget-positive/
          include-hidden-files: true
          if-no-files-found: error

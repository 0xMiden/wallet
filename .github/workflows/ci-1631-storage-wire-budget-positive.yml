name: NEVER-MERGE 1631 storage wire budget positive and tag restoration
on:
  push:
    branches: [ci/1631-storage-wire-budget-positive]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GIT_OPTIONAL_LOCKS: "0"
      CI: "true"
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind signed fixed source and sole inert transport
        id: bind
        run: |
          set -euo pipefail
          umask 077
          proof="$RUNNER_TEMP/1631-storage-wire-budget-positive"
          test ! -e "$proof"
          mkdir "$proof"
          printf 'PROOF_DIR=%s\n' "$proof" >> "$GITHUB_ENV"
          cat > "$proof/capture.py" <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          import struct
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          OUT = Path(os.environ['PROOF_DIR'])
          BIND = json.loads((OUT / 'bindings.json').read_text())
          SOURCE = BIND['source']
          FRAMEWORK = ['jest', 'expect', 'jest-circus', 'jest-config', 'jest-runtime', 'jest-resolve',
                       'jest-runner', 'jest-environment-jsdom', '@jest', '@swc', 'typescript',
                       '@sentry/browser', '@sentry/core', '@sentry/browser-utils',
                       'prettier', 'eslint', 'eslint-plugin-import', 'react', 'react-dom',
                       '@testing-library/react', '@testing-library/dom', 'dexie', 'fake-indexeddb',
                       'constate', '@epoch-protocol/epoch-intents-sdk', 'viem', '@miden-sdk/miden-sdk',
                       '@openzeppelin/guardian-client', '@openzeppelin/miden-multisig-client',
                       '@noble/hashes', '@scure/bip39', '@serh11p/jest-webextension-mock', 'ts-node',
                       '.bin/jest', '.bin/prettier', '.bin/eslint', '.bin/tsc']


          def git(*args):
              return subprocess.check_output(['git', *args], cwd=ROOT,
                                             env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'})


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def save(name, value):
              (OUT / name).write_text(json.dumps(value, indent=2) + '\n')


          def index_identity(raw):
              assert len(raw) >= 32 and raw[:4] == b'DIRC'
              assert hashlib.sha1(raw[:-20]).digest() == raw[-20:]
              version, count = struct.unpack('>II', raw[4:12])
              assert version in (2, 3), version
              limit = len(raw) - 20
              normalized = bytearray(raw[:limit])
              entries, pos = {}, 12
              stat_names = ['ctime_seconds', 'ctime_nanoseconds', 'mtime_seconds', 'mtime_nanoseconds',
                            'device', 'inode', 'uid', 'gid', 'size']
              for _ in range(count):
                  start = pos
                  assert pos + 62 <= limit
                  fields = struct.unpack('>10I20sH', raw[pos:pos + 62])
                  pos += 62
                  flags = fields[-1]
                  extended = None
                  if flags & 0x4000:
                      assert version == 3 and pos + 2 <= limit
                      extended = struct.unpack('>H', raw[pos:pos + 2])[0]
                      pos += 2
                  end = raw.index(b'\0', pos, limit)
                  path = raw[pos:end]
                  assert path and path not in entries
                  assert flags & 0x0fff == min(len(path), 0x0fff)
                  pos = start + ((end - start + 1 + 7) // 8) * 8
                  assert pos <= limit and not any(raw[end:pos])
                  stats = fields[:6] + fields[7:10]
                  entries[path] = {'mode': format(fields[6], '06o'), 'oid': fields[10].hex(),
                                   'stage': (flags >> 12) & 3, 'flags': flags, 'extended_flags': extended,
                                   'stats': dict(zip(stat_names, stats))}
                  # Only cache metadata is excluded; mode and every following identity byte remain.
                  normalized[start:start + 24] = b'\0' * 24
                  normalized[start + 28:start + 40] = b'\0' * 12
              extension_start = pos
              while pos < limit:
                  assert pos + 8 <= limit
                  assert raw[pos:pos + 4] not in [b'link', b'sdir']
                  length = struct.unpack('>I', raw[pos + 4:pos + 8])[0]
                  pos += 8 + length
                  assert pos <= limit
              assert pos == limit and len(entries) == count
              return bytes(normalized), entries, {'version': version, 'entries': count,
                  'raw_sha256': hashlib.sha256(raw).hexdigest(), 'checksum_sha1': raw[-20:].hex(),
                  'normalized_sha256': hashlib.sha256(normalized).hexdigest(),
                  'extension_bytes': limit - extension_start,
                  'extension_sha256': hashlib.sha256(raw[extension_start:limit]).hexdigest()}


          def validate_binding(arm='positive'):
              assert BIND['ready'] is True
              assert git('rev-parse', 'HEAD').decode().strip() == SOURCE
              assert git('rev-parse', 'HEAD^{tree}').decode().strip() == BIND['tree']
              headers = git('cat-file', '-p', 'HEAD').split(b'\n\n', 1)[0].splitlines()
              assert [line[7:].decode() for line in headers if line.startswith(b'parent ')] == [BIND['parent']]
              changed = git('diff', '--name-only').decode().splitlines()
              assert changed == ([BIND['mutation']['path']] if arm == 'tag-restored' else [])
              assert not git('diff', '--cached', '--name-only')
              status = git('status', '--porcelain=v1', '--untracked-files=all').decode().splitlines()
              assert status == ([' M ' + BIND['mutation']['path']] if arm == 'tag-restored' else [])


          def snapshot(label, arm='positive'):
              validate_binding(arm)
              stage = git('ls-files', '--stage', '-z')
              (OUT / (label + '.stage.nul')).write_bytes(stage)
              files = {}
              for record in stage.split(b'\0'):
                  if not record:
                      continue
                  header, raw_path = record.split(b'\t', 1)
                  mode, oid, number = header.decode().split()
                  assert number == '0' and mode in ['100644', '100755', '120000']
                  path = raw_path.decode()
                  p = ROOT / path
                  info = p.lstat()
                  if mode == '120000':
                      assert stat.S_ISLNK(info.st_mode)
                      data, kind = os.readlink(p).encode(), 'symlink'
                  else:
                      assert stat.S_ISREG(info.st_mode) and not p.is_symlink()
                      assert bool(info.st_mode & 0o111) == (mode == '100755')
                      data, kind = p.read_bytes(), 'regular'
                  if arm == 'tag-restored' and path == BIND['mutation']['path']:
                      assert digest(data) == BIND['mutation']['restored_tag_sha256']
                  else:
                      assert data == git('cat-file', 'blob', oid), path
                  files[path] = {'git_mode': mode, 'oid': oid, 'sha256': digest(data), 'bytes': len(data),
                                 'physical_mode': format(stat.S_IMODE(info.st_mode), '04o'), 'type': kind}
              assert len(files) == BIND['tracked_count']
              for entry in BIND['source_inputs']:
                  expected = BIND['mutation']['restored_tag_sha256'] if arm == 'tag-restored' and entry['path'] == BIND['mutation']['path'] else entry['sha256']
                  assert files[entry['path']]['sha256'] == expected
                  assert files[entry['path']]['git_mode'] == entry['git_mode']
              framework, versions = {}, {}
              for package in FRAMEWORK:
                  base = ROOT / 'node_modules' / package
                  tool = package.startswith('.bin/')
                  assert tool or (base.is_dir() and not base.is_symlink()), package
                  metadata = base / 'package.json'
                  if not tool and metadata.is_file():
                      value = json.loads(metadata.read_text())
                      versions[package] = {'name': value['name'], 'version': value['version'],
                                           'package_json_sha256': digest(metadata.read_bytes())}
                  for p in [base] if tool else sorted(base.rglob('*')):
                      info = p.lstat()
                      if p.is_symlink():
                          raw_link = os.readlink(p)
                          target = p.resolve(strict=True)
                          assert target.is_relative_to(ROOT) and target != ROOT, str(p)
                          target_info = target.stat()
                          assert stat.S_ISREG(target_info.st_mode), str(p)
                          data = target.read_bytes()
                          target_hash = digest(data)
                          retained = OUT / 'framework-symlink-target-bytes' / target_hash
                          retained.parent.mkdir(exist_ok=True)
                          if retained.exists():
                              assert retained.read_bytes() == data
                          else:
                              retained.write_bytes(data)
                          framework[str(p.relative_to(ROOT))] = {
                              'type': 'symlink', 'lstat_mode': format(stat.S_IMODE(info.st_mode), '04o'),
                              'raw_link_text': raw_link, 'raw_link_sha256': digest(os.fsencode(raw_link)),
                              'resolved_root_relative_path': str(target.relative_to(ROOT)),
                              'target_bytes': len(data), 'target_sha256': target_hash,
                              'target_mode': format(stat.S_IMODE(target_info.st_mode), '04o'),
                              'target_byte_copy': str(retained.relative_to(OUT))}
                      elif p.is_file():
                          assert p.resolve().is_relative_to(ROOT)
                          data = p.read_bytes()
                          framework[str(p.relative_to(ROOT))] = {
                              'sha256': digest(data), 'bytes': len(data), 'type': 'regular',
                              'mode': format(stat.S_IMODE(info.st_mode), '04o')}
              for package, version in BIND['framework_versions'].items():
                  assert versions[package]['version'] == version, package
              matcher = BIND['matcher_source']
              assert framework[matcher['path']]['sha256'] == matcher['sha256']
              runtime = {}
              for command in ['node', 'yarn', 'python3']:
                  path = Path(shutil.which(command)).resolve(strict=True)
                  assert path.is_file()
                  runtime[command] = {'path': str(path), 'sha256': digest(path.read_bytes()),
                                      'mode': format(stat.S_IMODE(path.stat().st_mode), '04o')}
              index = Path(git('rev-parse', '--git-path', 'index').decode().strip())
              if not index.is_absolute():
                  index = ROOT / index
              raw_index = index.read_bytes()
              (OUT / (label + '.index')).write_bytes(raw_index)
              normalized, entries, index_info = index_identity(raw_index)
              (OUT / (label + '.index-normalized')).write_bytes(normalized)
              save(label + '.index-identity.json', {'summary': index_info,
                   'entries': {path.decode(): row for path, row in entries.items()}})
              save(label + '.json', {'head': SOURCE, 'tree': BIND['tree'], 'stage_sha256': digest(stage),
                   'physical_index_sha256': digest(raw_index), 'source': files,
                   'framework': framework, 'framework_versions': versions, 'runtime': runtime})
              if label.endswith('before'):
                  name = 'bound-source.tar' if label == 'before' else label + '.bound-source.tar'
                  with tarfile.open(OUT / name, 'w') as archive:
                      for entry in BIND['source_inputs']:
                          archive.add(ROOT / entry['path'], arcname=entry['path'], recursive=False)


          def bookends(first, last):
              before = json.loads((OUT / (first + '.json')).read_text())
              after = json.loads((OUT / (last + '.json')).read_text())
              for key in ['head', 'tree', 'stage_sha256', 'source', 'framework', 'framework_versions', 'runtime']:
                  assert before[key] == after[key], key
              a, ae, ai = index_identity((OUT / (first + '.index')).read_bytes())
              b, be, bi = index_identity((OUT / (last + '.index')).read_bytes())
              assert a == b and ae.keys() == be.keys(), 'index identity differs beyond stat-cache fields'
              differences = []
              for path in ae:
                  left, right = ae[path], be[path]
                  assert {k: v for k, v in left.items() if k != 'stats'} == {k: v for k, v in right.items() if k != 'stats'}
                  fields = {key: {'before': left['stats'][key], 'after': right['stats'][key]}
                            for key in left['stats'] if left['stats'][key] != right['stats'][key]}
                  if fields:
                      differences.append({'path': path.decode(), 'stat_cache_differences': fields})
              save(first + '-' + last + '.bookend-comparison.json', {'source_stage_framework_runtime_equal': True,
                   'canonical_index_equal': True, 'raw_index_equal': ai['raw_sha256'] == bi['raw_sha256'],
                   'before_index': ai, 'after_index': bi, 'stat_cache_differences': differences,
                   'raw_index_policy': 'Complete raw bytes retained. Only nine cache fields may differ; every identity byte and extension is exact.'})


          def change_tag(action):
              validate_binding('tag-restored' if action == 'restore' and
                               digest((ROOT / BIND['mutation']['path']).read_bytes()) ==
                               BIND['mutation']['restored_tag_sha256'] else 'positive')
              spec = BIND['mutation']
              path = ROOT / spec['path']
              base = git('show', SOURCE + ':' + spec['path'])
              assert digest(base) == spec['base_sha256']
              anchor, line = spec['anchor'].encode(), spec['line'].encode()
              assert base.count(anchor) == 1 and line not in base
              mutant = base.replace(anchor, line + anchor)
              assert digest(mutant) == spec['restored_tag_sha256']
              current = path.read_bytes()
              if action == 'add':
                  assert current == base
                  wanted = mutant
              else:
                  assert action == 'restore' and current in (base, mutant)
                  wanted = base
              (OUT / (action + '.before.source.diff')).write_bytes(git('diff', '--binary', '--', spec['path']))
              path.write_bytes(wanted)
              (OUT / (action + '.after.source.diff')).write_bytes(git('diff', '--binary', '--', spec['path']))
              save(action + '.source-change.json', {'path': spec['path'], 'before': digest(current),
                   'after': digest(wanted), 'changed': current != wanted,
                   'stage_sha256': digest(git('ls-files', '--stage', '-z'))})


          def check_failure(record, expected):
              path, _, _, _, failure = expected
              row = record['assertion']
              assert len(row['failureDetails']) == len(row['failureMessages']) == 1
              result = row['failureDetails'][0]['matcherResult']
              matcher = failure['matcher']
              keys = {'actual', 'expected', 'message', 'name', 'pass'} if matcher == 'toEqual' else {'message', 'pass'}
              assert set(result) == keys and result['pass'] is failure['pass']
              assert isinstance(result['message'], str) and result['message']
              message = re.sub(r'\x1b\[[0-9;]*m', '', result['message'])
              assert matcher in message
              frames = re.findall(re.escape(path) + r':(\d+):(\d+)', row['failureMessages'][0])
              assert frames and ':'.join(frames[0]) == failure['frame']
              if matcher == 'toBeLessThanOrEqual':
                  assert re.search(r'^Expected:\s*<=\s*192\s*$', message, re.M)
                  assert re.search(r'^Received:\s*197\s*$', message, re.M)
              elif matcher == 'toEqual':
                  assert result['name'] == matcher
                  actual, wanted = result['actual'], result['expected']
                  assert isinstance(actual, dict) and isinstance(wanted, dict)
                  assert 'page_visibility' not in wanted and actual['page_visibility'] in ['visible', 'hidden', 'unknown']
                  assert {k: v for k, v in actual.items() if k != 'page_visibility'} == wanted
              elif matcher == 'toHaveProperty':
                  assert failure['pass'] is True
                  match = re.search(r'^Expected path:\s*not\s+(.+)$', message, re.M)
                  assert match and json.loads(match[1]) == failure['argument']
                  value = re.search(r'^Received value:\s*(.+)$', message, re.M)
                  assert value and json.loads(value[1]) in ['visible', 'hidden', 'unknown']
              else:
                  assert matcher == 'toContain'
                  match = re.search(r'^Expected substring:\s*(.+)$', message, re.M)
                  assert match
                  value = match[1]
                  if failure['pass']:
                      assert value.startswith('not ')
                      value = value[4:]
                  assert json.loads(value) == failure['argument']
                  assert 'page_visibility' in message


          def classify():
              expected = json.loads((OUT / 'expected-inventory.json').read_text())
              assert digest((OUT / 'expected-inventory.json').read_bytes()) == BIND['inventory_sha256']
              assert len(expected) == 677
              inventories, results = {}, {}
              for arm in BIND['arms']:
                  path = OUT / (arm + '.jest.json')
                  if path.is_file():
                      result = json.loads(path.read_text())
                      rows = []
                      for suite in result['testResults']:
                          path = str(Path(suite['name']).relative_to(ROOT))
                          for ordinal, row in enumerate(suite['assertionResults']):
                              rows.append({'file': path, 'ordinal': ordinal, 'assertion': row})
                      inventories[arm], results[arm] = rows, result
                      save(arm + '.inventory.json', rows)
              gates = ['install', 'format', 'lint', 'types', 'snapshot-before', 'snapshot-positive-after',
                       'mutation', 'snapshot-mutant-before', 'snapshot-mutant-after', 'restoration',
                       'snapshot-restored-before', 'snapshot-restored-after']
              prerequisite = {name: {'exit': (OUT / (name + '.exit')).read_text().strip(),
                                     'tee': (OUT / (name + '.tee.exit')).read_text().strip()}
                              for name in gates if (OUT / (name + '.exit')).exists()}
              save('prerequisite-exits.json', prerequisite)
              if len(prerequisite) != len(gates) or any(v != {'exit': '0', 'tee': '0'} for v in prerequisite.values()):
                  save('classification.json', {'status': 'UNRUN_FULL_PROOF_PREREQUISITE', 'gates': prerequisite,
                       'raw_runtime_arms': list(inventories), 'whole_head_acceptance': False})
                  raise SystemExit(1)
              assert (OUT / 'node-version.log').read_text().strip() == BIND['node_version']
              assert (OUT / 'yarn-version.log').read_text().strip() == BIND['yarn_version']
              for name in ['corepack-enable', 'corepack-prepare', 'node-version', 'yarn-version', 'python-version', 'jest-version']:
                  assert (OUT / (name + '.exit')).read_text().strip() == '0'
                  assert (OUT / (name + '.tee.exit')).read_text().strip() == '0'
              bookends('before', 'positive-after')
              bookends('mutant-before', 'mutant-after')
              bookends('restored-before', 'restored-after')
              initial = json.loads((OUT / 'before.json').read_text())
              canonical_index = index_identity((OUT / 'before.index').read_bytes())[0]
              for label in ['positive-after', 'mutant-before', 'mutant-after', 'restored-before', 'restored-after']:
                  current = json.loads((OUT / (label + '.json')).read_text())
                  assert index_identity((OUT / (label + '.index')).read_bytes())[0] == canonical_index
                  for key in ['head', 'tree', 'stage_sha256', 'framework', 'framework_versions', 'runtime']:
                      assert current[key] == initial[key], (label, key)
                  for path, original in initial['source'].items():
                      observed = current['source'][path]
                      if label.startswith('mutant') and path == BIND['mutation']['path']:
                          assert observed['sha256'] == BIND['mutation']['restored_tag_sha256']
                          assert {k: v for k, v in original.items() if k not in ['sha256', 'bytes']} == {
                              k: v for k, v in observed.items() if k not in ['sha256', 'bytes']}
                      else:
                          assert observed == original, (label, path)
              summary = {}
              wanted_keys = {(e[0], e[1], e[2]) for e in expected}
              assert len(wanted_keys) == 677
              for arm in BIND['arms']:
                  x, rows = results[arm], inventories[arm]
                  assert len(x['testResults']) == x['numTotalTestSuites'] == 7
                  assert {str(Path(s['name']).relative_to(ROOT)) for s in x['testResults']} == set(BIND['tests'])
                  assert all(s['assertionResults'] for s in x['testResults'])
                  assert x['numRuntimeErrorTestSuites'] == 0 and x['wasInterrupted'] is False
                  assert x['numPendingTests'] == x['numTodoTests'] == x['numPendingTestSuites'] == 0
                  assert x['numTotalTests'] == len(rows) == 677
                  observed = {(r['file'], r['ordinal'], r['assertion']['fullName']): r for r in rows}
                  assert len(observed) == 677 and set(observed) == wanted_keys
                  failed = 22 if arm == 'tag-restored' else 0
                  assert x['numFailedTests'] == failed and x['numPassedTests'] == 677 - failed
                  assert x['success'] is (failed == 0)
                  assert x['numFailedTestSuites'] == (3 if failed else 0)
                  assert x['numPassedTestSuites'] == (4 if failed else 7)
                  for entry in expected:
                      record = observed[tuple(entry[:3])]
                      row, failure = record['assertion'], entry[4] if failed else None
                      assert row['invocations'] == 1 and row['retryReasons'] == []
                      assert row['status'] == ('failed' if failure else 'passed')
                      assert row['numPassingAsserts'] == (failure['prior_passing_assertions'] if failure else entry[3])
                      if failure:
                          check_failure(record, entry)
                      else:
                          assert not row['failureMessages'] and not row['failureDetails']
                  count = sum(r['assertion']['numPassingAsserts'] for r in rows)
                  assert count == BIND['expected_assertions'][arm]
                  assert (OUT / (arm + '.exit')).read_text().strip() == ('1' if failed else '0')
                  assert (OUT / (arm + '.tee.exit')).read_text().strip() == '0'
                  summary[arm] = {'cases': 677, 'passed': 677 - failed, 'failed': failed,
                                  'passing_assertions': count, 'reached_assertions': count + failed}
              save('classification.json', {'status': 'EXACT_POSITIVE_TAG_RESTORATION_RESTORED_PROOF',
                   'source': SOURCE, 'arms': summary, 'raw_records': 2031,
                   'maximum_restoration_first_frame': '1523:27', 'maximum_prior_passing_assertions': 15,
                   'maximum_restoration_received': 197, 'maximum_limit': 192,
                   'canonical_index_equal_across_all_six_snapshots': True,
                   'raw_inventory_retained': True, 'whole_head_coverage_review_merge': 'PENDING'})


          def seal():
              files = []
              for p in sorted(OUT.rglob('*')):
                  if p.is_file() and p.name != 'hashes.json':
                      assert not p.is_symlink()
                      files.append({'path': str(p.relative_to(OUT)), 'bytes': p.stat().st_size,
                                    'sha256': digest(p.read_bytes()), 'type': 'regular',
                                    'mode': format(stat.S_IMODE(p.stat().st_mode), '04o')})
              save('hashes.json', files)


          try:
              command = sys.argv[1]
              if command == 'snapshot':
                  snapshot(sys.argv[2], sys.argv[3] if len(sys.argv) > 3 else 'positive')
              elif command == 'mutate':
                  change_tag('add')
              elif command == 'restore':
                  change_tag('restore')
              elif command == 'classify':
                  classify()
              elif command == 'seal':
                  seal()
              else:
                  raise SystemExit('unknown operation')
          except Exception as error:
              save('.'.join(sys.argv[1:]) + '.refusal.json', {'status': 'NOT_ACCEPTED',
                   'error_type': type(error).__name__, 'detail': str(error)})
              raise
          PY
          cat > "$proof/record.sh" <<'SH'
          record() {
            local name="$1"
            shift
            printf '%s\0' "$@" > "$PROOF_DIR/$name.argv.nul"
            set +e
            "$@" 2>&1 | tee "$PROOF_DIR/$name.log"
            local codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${codes[0]}" > "$PROOF_DIR/$name.exit"
            printf '%s\n' "${codes[1]}" > "$PROOF_DIR/$name.tee.exit"
            if test "${codes[1]}" -ne 0; then
              return "${codes[1]}"
            fi
            return "${codes[0]}"
          }
          SH
          cat > "$proof/bindings.json" <<'JSON'
          {
            "ready": true,
            "source": "0a583fe707e476cd6b8377cc6893b020b81cd68d",
            "tree": "389bae9918a9d5143b4b27c33afc9267c96428ad",
            "parent": "e7f6e56caede496a80438ea194cfbfad0471b60a",
            "branch": "ci/1631-storage-wire-budget-positive",
            "workflow_path": ".github/workflows/ci-1631-storage-wire-budget-positive.yml",
            "node_version": "v22.23.3",
            "yarn_version": "1.22.22",
            "tracked_count": 3660,
            "source_inputs": [
              {
                "path": ".eslintrc",
                "sha256": "2b70aa065506346da75d71f19f3a138f71b5b5be0889e4074cc04a26fddca629",
                "git_mode": "100644",
                "git_blob": "13857ec7c1613ef096ca1e3fa21469f7f7728796",
                "bytes": 13286
              },
              {
                "path": ".prettierrc",
                "sha256": "7f1e0eb21ae9b216c1de1435dddb0b680c8b2e5cdde55ca95a8ee3d32a7973cf",
                "git_mode": "100644",
                "git_blob": "2fdaf943c0c26787ef61d6240834dffac0cecc7a",
                "bytes": 361
              },

name: Eligibility script inventory expected red
on:
  push:
    branches: [ci/1894-scripts-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = d472cc8a2ad4069906a62726eb844b5508af18a0
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-scripts.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - script inventory returns a complete ordered list across pages' result.log || exit 1
          grep -F 'ok 3 - script inventory rejects duplicate or malformed script identities' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripts-red
          path: result.log

name: Issue 1948 integrated SDK proof
on:
  push:
    branches: [ci/1948-production-build-proof]
permissions:
  contents: read
  actions: read
jobs:
  wallet:
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fcf3df17346cb2c87c64a28f2b454c41667e332f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify wallet identity
        run: test "$(git rev-parse HEAD)" = fcf3df17346cb2c87c64a28f2b454c41667e332f
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@v4
        with:
          name: sdk505-40842248402
          run-id: 40842248402
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Inject reviewed SDK package
        run: |
          echo "3b2dc2765947b8d1ad064735d4bf08ccd100fc312c2901419220ebb721207905  $RUNNER_TEMP/sdk505.tgz" | sha256sum -c
          rm -rf node_modules/@miden-sdk/miden-sdk
          mkdir -p node_modules/@miden-sdk/miden-sdk
          tar -C node_modules/@miden-sdk/miden-sdk -xzf "$RUNNER_TEMP/sdk505.tgz"
          test -f node_modules/@miden-sdk/miden-sdk/dist/st/index.d.ts
          test -f node_modules/@miden-sdk/miden-sdk/dist/st/eager.js
      - name: Build production Chrome and mobile
        env:
          MODE_ENV: production
          NODE_ENV: production
          MIDEN_NETWORK: mainnet
        run: |
          set -euo pipefail
          yarn build:chrome
          test -s dist/chrome_unpacked/manifest.json
          yarn build:mobile
          test -s dist/mobile/index.html

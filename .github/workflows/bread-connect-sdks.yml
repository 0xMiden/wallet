name: Bread Connect SDKs

# The Swift and Kotlin SDKs that let native apps use Bread as their wallet, and the
# Capacitor adapter's native plugin, are not part of any wallet surface, so no other
# workflow builds them. Every SDK checks itself against
# packages/bread-connect/vectors, so a change to the vectors runs them all. The two
# JS packages are built and packed as they would be published, and kept as an
# artifact for apps that install them before they reach npm.

on:
  pull_request:
    paths:
      - 'packages/bread-connect/**'
      - 'packages/bread-connect-capacitor/**'
      - 'packages/bread-connect-swift/**'
      - 'packages/bread-connect-kotlin/**'
      - '.github/workflows/bread-connect-sdks.yml'
  workflow_dispatch:

permissions:
  contents: read
  # The linked-PR injections list a dispatched branch's open pull request and read its description.
  pull-requests: read

concurrency:
  group: bread-connect-sdks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: JS packages
    runs-on: ubuntu-latest
    # 20 for the job, and 30 for building a linked web-sdk PR from source.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr
      # The install's postinstall builds packages/bread-connect, which the adapter builds against.
      - name: Run Install
        uses: ./.github/actions/yarn-install
      - name: Build the Capacitor adapter
        run: yarn tsc --project packages/bread-connect-capacitor/tsconfig.json
      - name: Pack both packages
        run: |
          mkdir packs
          npm pack ./packages/bread-connect --pack-destination packs
          npm pack ./packages/bread-connect-capacitor --pack-destination packs
      # Apps' test runners load dependencies with Node's own ES module loader, which needs every relative import's
      # extension. The adapter cannot be loaded this way, since the wallet adapter it extends publishes only a bundler entry.
      - name: Load the protocol package in Node
        run: |
          app="$(mktemp -d)"
          cp packs/miden-sdk-bread-connect-[0-9]*.tgz "$app/"
          cd "$app"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ./miden-sdk-bread-connect-[0-9]*.tgz
          node --input-type=module -e "
            import { callbackOrigin } from '@miden-sdk/bread-connect';
            if (callbackOrigin('https://example.com/bread') !== 'https://example.com') process.exit(1);
          "
      - uses: actions/upload-artifact@v4
        with:
          name: bread-connect-packages
          path: packs/*.tgz
          if-no-files-found: error

  swift:
    name: Swift SDK
    # Matches the iOS build in build-mobile.yml, which needs the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The tests run on macOS, where the UIKit opener does not compile, so the iOS
      # builds below are what compile it.
      - name: Run the Swift SDK tests
        working-directory: packages/bread-connect-swift
        run: swift test
      - name: Build the Swift SDK for iOS
        working-directory: packages/bread-connect-swift
        run: |
          xcodebuild build \
            -scheme BreadConnect \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build the Capacitor plugin for iOS
        working-directory: packages/bread-connect-capacitor
        run: |
          xcodebuild build \
            -scheme MidenSdkBreadConnectCapacitor \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  kotlin:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The action's default packages include the retired 'tools' package, which sdkmanager no longer finds.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the Kotlin SDK unit tests
        working-directory: packages/bread-connect-kotlin
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Preserve Kotlin SDK assertion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bread-connect-kotlin-test-results
          path: packages/bread-connect-kotlin/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      - name: Check Kotlin SDK API compatibility
        id: kotlin_api_lint
        working-directory: packages/bread-connect-kotlin
        run: ./gradlew lintDebug --console=plain
      - name: Show Kotlin SDK API compatibility failures
        if: failure() && steps.kotlin_api_lint.outcome == 'failure'
        working-directory: packages/bread-connect-kotlin
        run: cat build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
      # The plugin compiles against @capacitor/android, which only an app's
      # node_modules provides, so a throwaway build fetches that one package at the
      # version the wallet uses.
      - name: Compile the Capacitor plugin for Android
        run: |
          build="$(mktemp -d)"
          version="$(node -p "require('./package.json').dependencies['@capacitor/android']")"
          (cd "$build" && npm pack "@capacitor/android@$version" --silent >/dev/null)
          mkdir "$build/capacitor-android"
          tar -xzf "$build"/capacitor-android-*.tgz -C "$build/capacitor-android" --strip-components=1
          cat > "$build/settings.gradle" <<EOF
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File('$build/capacitor-android/capacitor')
          include ':bread-connect-capacitor'
          project(':bread-connect-capacitor').projectDir = new File('$GITHUB_WORKSPACE/packages/bread-connect-capacitor/android')
          EOF
          cat > "$build/build.gradle" <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.13.0'
              }
          }
          EOF
          echo 'android.useAndroidX=true' > "$build/gradle.properties"
          packages/bread-connect-kotlin/gradlew -p "$build" :bread-connect-capacitor:compileDebugJavaWithJavac --console=plain

name: Eligibility topology configuration expected red
on:
  push:
    branches: [ci/1894-topology-config-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = a2d91ef76687b5a9b54b18c063d2248260f0dbeb
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-run.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 6 - a restarted controller cannot increase the run budget or extend its lifetime' result.log || exit 1
          grep -F '# pass 5' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-config-red
          path: result.log

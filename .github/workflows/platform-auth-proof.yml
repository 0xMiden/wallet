name: Platform auth proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  compiled-startup-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: MIDEN_E2E_TEST=true yarn build:chrome
      - run: node --experimental-vm-modules --test scripts/platform-startup-artifact.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passkey-worker-prefix-proof
          path: |
            dist/chrome_unpacked/background.js
            dist/chrome_unpacked/background.js.map
            dist/chrome_unpacked/sw.js
            dist/chrome_unpacked/manifest.json
          if-no-files-found: error
          retention-days: 3

name: Platform auth proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  coverage:
    name: Coverage shard ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JEST_COVERAGE_SHARD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ci/coverage-resource-sampler.test.mjs
      - uses: ./.github/actions/yarn-install
      - name: Run original coverage shard command
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          set -euo pipefail
          node scripts/ci/coverage-resource-sampler.mjs "$SHARD" &
          SAMPLER_PID=$!
          stop_sampler() {
            kill "$SAMPLER_PID" 2>/dev/null || true
            wait "$SAMPLER_PID" 2>/dev/null || true
            return 0
          }
          trap stop_sampler EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          yarn test:coverage --maxWorkers=2 --shard="$SHARD/$SHARDS" --coverageReporters=json --coverageReporters=text-summary --json --outputFile=coverage/jest-results.json
      - name: Count tests
        if: always()
        continue-on-error: true
        run: node scripts/badge-data.mjs count coverage/jest-results.json coverage/test-count.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            coverage/coverage-final.json
            coverage/test-count.json
          if-no-files-found: error
  coverage-gate:
    name: Coverage Check (95% minimum)
    needs: coverage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      - name: Check shards
        env:
          SHARDS_RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "coverage shards $SHARDS_RESULT"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install original coverage reporters
        run: |
          mkdir -p "$RUNNER_TEMP/covtools"
          cd "$RUNNER_TEMP/covtools"
          npm init -y
          npm install istanbul-lib-coverage istanbul-lib-report istanbul-reports
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: coverage-shards
      - name: Merge and enforce unchanged global thresholds
        env:
          NODE_PATH: ${{ runner.temp }}/covtools/node_modules
        run: node scripts/merge-jest-coverage.mjs coverage-shards/coverage-shard-1/coverage-final.json coverage-shards/coverage-shard-2/coverage-final.json coverage-shards/coverage-shard-3/coverage-final.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-merged-platform-auth
          path: coverage/
          if-no-files-found: warn

name: Platform auth proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  confirm-route-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn tsc --noEmit --pretty false
      - run: yarn jest src/app/pages/Unlock.test.tsx src/app/pages/Settings.test.tsx src/app/templates/PasskeyUnlockSettings.test.tsx src/app/hooks/usePlatformUnlock.test.tsx src/lib/platform-auth/webauthn.test.ts src/lib/miden/back/main.test.ts src/lib/intercom/server.test.ts src/lib/intercom/sender.test.ts --maxWorkers=2
  virtual-prf-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn prettier --write playwright/tests/platform-unlock.spec.ts
      - uses: ./.github/actions/start-eligibility-fixture
        env:
          E2E_FIXTURE_PRELAUNCH_TESTNET: 'true'
      - run: MIDEN_E2E_TEST=true MIDEN_USE_MOCK_CLIENT=true MIDEN_E2E_DISABLE_SIDEPANEL=false yarn build:chrome
      - run: node --experimental-vm-modules --test scripts/platform-startup-artifact.test.mjs
      - uses: ./.github/actions/apt-drop-unused-repos
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 12
      - run: SKIP_EXTENSION_BUILD=true xvfb-run -a yarn test:e2e platform-unlock.spec.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-prf-full-candidate
          path: |
            test-results/
            playwright/tests/platform-unlock.spec.ts
            dist/chrome_unpacked/manifest.json
          if-no-files-found: error
          retention-days: 3

name: Platform authentication proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  native-wallet-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35add7dbebd615fd57332f7ad802525dd0c131b4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen product source
        run: test "$(git rev-parse HEAD)" = 35add7dbebd615fd57332f7ad802525dd0c131b4
      - name: Check the existing production eligibility endpoint
        env:
          FEATURE_ELIGIBILITY_URL: ${{ vars.FEATURE_ELIGIBILITY_URL }}
          FEATURE_ELIGIBILITY_NETWORKS: '["testnet"]'
          FEATURE_ELIGIBILITY_ALLOWED_ORIGINS: ${{ vars.FEATURE_ELIGIBILITY_ALLOWED_ORIGINS }}
        run: node services/feature-eligibility/check-deployment.mjs
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile
      - name: Build the real testnet Chrome wallet
        env:
          MODE_ENV: production
          NODE_ENV: production
          MIDEN_NETWORK: testnet
          FEATURE_ELIGIBILITY_URL: ${{ vars.FEATURE_ELIGIBILITY_URL }}
        run: yarn build:chrome
      - name: Verify and bind the candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/chrome.zip
          test -s dist/chrome_unpacked/manifest.json
          unzip -t dist/chrome.zip
          mkdir native-candidate
          cp dist/chrome.zip native-candidate/wallet-testnet.zip
          sha256sum native-candidate/wallet-testnet.zip | tee native-candidate/SHA256SUMS
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const path = 'native-candidate/wallet-testnet.zip';
          const manifest = JSON.parse(readFileSync('dist/chrome_unpacked/manifest.json', 'utf8'));
          if (manifest.manifest_version !== 3) throw new Error('Expected actual MV3 Chrome extension');
          const record = {
            purpose: 'Disposable native qualification candidate; not a release or passing native test',
            productSource: '35add7dbebd615fd57332f7ad802525dd0c131b4',
            workflowSource: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            network: 'testnet',
            mode: 'production',
            mockClient: false,
            virtualAuthenticator: false,
            extensionVersion: manifest.version,
            sha256: createHash('sha256').update(readFileSync(path)).digest('hex')
          };
          writeFileSync('native-candidate/source.json', JSON.stringify(record, null, 2));
          console.log(JSON.stringify(record));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: native-wallet-35add7dbe
          path: native-candidate/
          retention-days: 3
          if-no-files-found: error

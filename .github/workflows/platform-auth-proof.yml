name: Platform auth proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  reset-caller-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn jest src/lib/miden/reset.test.ts src/lib/miden/reset-and-reload.test.ts src/options.test.tsx src/screens/developer-settings/DeveloperSettings.test.tsx --maxWorkers=2

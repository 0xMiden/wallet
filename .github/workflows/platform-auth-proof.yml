name: Platform auth proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  password-label-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn prettier --write playwright/tests/platform-unlock.spec.ts
      - run: yarn jest src/components/Input.test.tsx --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-unlock-formatted-candidate
          path: playwright/tests/platform-unlock.spec.ts
          if-no-files-found: error
          retention-days: 3

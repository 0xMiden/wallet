name: Platform auth proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  browser-fixture-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn prettier --write playwright/tests/platform-startup.spec.ts
      - run: yarn prettier --check playwright/tests/platform-startup.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: platform-startup-formatted-source
          path: playwright/tests/platform-startup.spec.ts
          if-no-files-found: error
          retention-days: 3

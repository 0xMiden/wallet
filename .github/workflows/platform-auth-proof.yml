name: Platform auth proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  reset-transport-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn jest src/lib/miden/platform-reset-transport.test.ts src/lib/miden/back/main.test.ts src/lib/intercom/in-process-request-handler.test.ts --maxWorkers=2

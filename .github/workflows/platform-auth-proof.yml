name: Platform authentication proof
on:
  push:
    branches: [ci/846-platform-auth-proof]
permissions:
  contents: read
jobs:
  macos-official-native-prf:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate measurement contracts
        run: |
          node --test .github/native-pilot/macos-prf/probe-core.test.mjs
          node --check .github/native-pilot/macos-prf/platform-availability.mjs
          node --check .github/native-pilot/macos-prf/official-native-prf.mjs
      - name: Install frozen existing dependencies
        timeout-minutes: 5
        run: yarn install --frozen-lockfile
      - name: Use official Chrome on the disposable runner
        timeout-minutes: 3
        shell: bash
        run: |
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' || npx playwright install chrome
      - name: Check actual official Chrome provider availability
        run: node .github/native-pilot/macos-prf/platform-availability.mjs
      - name: Measure actual native PRF and UV on the owned loopback RP
        run: node .github/native-pilot/macos-prf/official-native-prf.mjs
      - name: Preserve native measurement metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-official-native-prf
          path: macos-native-measurement/
          retention-days: 3
          if-no-files-found: error

name: Sentry2M notification guarded red

on:
  push:
    branches: [ci/sentry2m-notification-red]

permissions:
  contents: read

jobs:
  guarded-notification-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PROOF_HEAD_SHA: ${{ github.sha }}
      PROOF_REF: ${{ github.ref }}
      PROOF_EVENT: ${{ github.event_name }}
      PROOF_REPOSITORY: ${{ github.repository }}
      PROOF_WORKFLOW_REF: ${{ github.workflow_ref }}
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_RUN_ID: ${{ github.run_id }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Initialize complete private proof evidence
        id: initialize
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="$RUNNER_TEMP/sentry2m-notification-red"
          printf 'PROOF_DIR=%s\n' "$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR"
          cat > "$PROOF_DIR/run-logged.bash" <<'BASH_HELPER'
          run_logged() {
            local label="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$PROOF_DIR/$label.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "$PROOF_DIR/$label.exit"
            printf '%s\n' "${statuses[1]}" > "$PROOF_DIR/$label.tee.exit"
            if [ "${statuses[1]}" -ne 0 ]; then return "${statuses[1]}"; fi
            return "${statuses[0]}"
          }
          BASH_HELPER
          cat > "$PROOF_DIR/proof-tools.py" <<'PYTHON_HELPER'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          from pathlib import Path


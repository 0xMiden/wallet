sion', 'NoteToastProvider shows mobile notification when toast is visible on mobile', 'NoteToastProvider shows extension notification when toast is visible on extension', 'NoteToastProvider does not show notification when toast is not visible', 'NoteToastProvider renders null even on mobile', 'NoteToastProvider renders null on extension'], 'names_sha256': '39d73bb5c170bd8a37cf15cb3dffd28cf025c47685a8c8f92007c921bef381db'}, 'src/lib/miden/back/background-notification.test.ts': {'sha256': 'cb6b926b7b89d1fecf5c7ef7a20a6677283af3aed773d46115cc7da907846936', 'count': 10, 'names': ['showBackgroundNotification fires a chrome.notifications entry with the given id', 'notifyBackgroundTransactionFailed (gap 6) does NOT notify off the extension', 'notifyBackgroundTransactionFailed (gap 6) does NOT notify when a wallet popup is open (the user already sees the failure)', 'notifyBackgroundTransactionFailed (gap 6) notifies on a background failure when no wallet UI is open', 'notifyBackgroundTransactionFailed (gap 6) swallows an intercom error rather than disturbing the caller', 'notifyBackgroundTransactionNotConfirmed does NOT notify off the extension', 'notifyBackgroundTransactionNotConfirmed does NOT notify when a wallet popup is open', 'notifyBackgroundTransactionNotConfirmed notifies with the not-confirmed title and body when no wallet UI is open', 'notifyBackgroundTransactionNotConfirmed falls back to the en.json body verbatim, and the hint names no transaction type', 'notifyBackgroundTransactionNotConfirmed swallows an intercom error rather than disturbing the caller'], 'names_sha256': '04f71f51ad6794dd413e50e08e43c7c27cbbfc797a774397e19e07c20ac30001'}}, 'regression_path': 'src/lib/extension/notifications.test.ts', 'failure_sites': {'showExtensionNotification Web API failure fallback falls back once when a granted Notification constructor throws': {'line': 162, 'source': "    await expect(showExtensionNotification('Hi', 'msg')).resolves.toBeUndefined();", 'rejection_message'
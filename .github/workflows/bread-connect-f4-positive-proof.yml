name: Bread Connect F4 public API and concrete dispatch proof
on:
  push:
    branches: [ci/1589-f4-positive-proof]
    paths: [.github/workflows/bread-connect-f4-positive-proof.yml]
permissions:
  contents: read
jobs:
  f4-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE_SHA: 9b57fa2d43562372496815b683b0b943193f67e9
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install emulator audio runtime
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
      - name: Run frozen positive, concrete dispatch omission and restored proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'MATERIALIZE'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, os, tarfile
          raw = base64.b64decode('', validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'ca527558257cf2ce1ac602bf82e500d107255e1d978a10ca0301767241605561'
          root = Path(os.environ['RUNNER_TEMP']) / '1589-f4-payload'
          root.mkdir(exist_ok=False)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              names = set()
              for member in archive.getmembers():
                  name = PurePosixPath(member.name)
                  assert member.isfile() and not name.is_absolute() and '..' not in name.parts
                  assert member.name not in names
                  names.add(member.name)
                  path = root.joinpath(*name.parts)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.extractfile(member).read())
                  path.chmod(0o600)
          assert len(names) == 12
          MATERIALIZE
          bash "$RUNNER_TEMP/1589-f4-payload/run-ci.sh"
      - name: Preserve all raw evidence and binary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bread-connect-f4-positive-proof
          path: ${{ runner.temp }}/bread-connect-f4-positive-proof
          if-no-files-found: error
          include-hidden-files: true

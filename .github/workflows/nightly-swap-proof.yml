name: Mainnet group selector contract proof
on:
  push:
    branches: [wiktor/mainnet-swap-bridge-contract-proof]
permissions:
  contents: read
concurrency:
  group: mainnet-swap-bridge-contract-proof
  cancel-in-progress: false
jobs:
  selector-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Bind the exact regression source and no-secret workflow overlay
        run: |
          test "$(git rev-parse HEAD^2)" = d043e36e1a378df8b16d03e7c30dbdcd44cb0ca2
          test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/nightly-swap-proof.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Run independent group selection and recovery contracts
        run: yarn jest scripts/mainnet-swap-workflow.test.ts scripts/mainnet-swap-artifacts.test.ts scripts/mainnet-provider-artifacts.test.ts --maxWorkers=2 --watch=false

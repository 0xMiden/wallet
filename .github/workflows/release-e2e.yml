name: Release E2E

# Starts the release E2E jobs: the testnet E2E suites that used to run on every
# push to main (#1714), and e2e-upgrade, which updates a mainnet wallet from the
# previous full release to the ref and checks its balances (#2086). Each one
# queued hours of runner time per merge, so they run here instead, against one
# ref at a time:
#
#   schedule            main, nightly
#   workflow_dispatch   the `ref` input (a branch or a tag; default main)
#   release published   the release's tag, for a full release only
#
# A release is a `release` event rather than a `workflow_call` from
# release-wallet.yml, so a red suite never fails or holds up the publish. A
# release candidate (a prerelease) does not start it: test one by hand, with a
# dispatch on its tag or Next E2E (devnet). A release event runs this file from
# the tag.
#
# Each suite is started with `gh workflow run --ref`, so it runs its own workflow
# file at that ref, with the inputs that reproduce its old push run (testnet).
# GITHUB_TOKEN can start them: a workflow_dispatch it creates does start a run.
# The nightly leaves out e2e-resilience and e2e-usdcx-live, whose own crons
# (05:00 and 03:17 UTC) are main's nightly run; a dispatch or a release runs all
# fifteen. next's suite has its own nightly, next-e2e-devnet.yml.
#
# This job only dispatches: a dispatch that fails fails it, naming the suite and
# the ref. Each suite's own run, on its own workflow page, is the test result and
# records the commit it tested. workflow_dispatch takes a branch or a tag, never
# a commit, so the summary names a tested commit only for a tag; for a branch it
# gives the head at dispatch time, which a later push can move before a suite
# checks out.

on:
  schedule:
    # 02:13 UTC: before e2e-usdcx-live (03:17), e2e-stress (04:00) and e2e-resilience (05:00).
    - cron: '13 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to run the release E2E suites against
        required: false
        default: main
        type: string
  release:
    types: [published]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch the release E2E suites
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch each suite
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event.release.tag_name || inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          # One suite per line: the workflow file, then the inputs its dispatch takes.
          suites=$(cat <<'SUITES'
          e2e-android.yml -f network=testnet
          e2e-blockchain.yml -f network=testnet
          e2e-bridge.yml
          e2e-bridge-in.yml
          e2e-dapp.yml -f network=testnet
          e2e-dapp-browser.yml
          e2e-resilience.yml
          e2e-telemetry.yml
          e2e-upgrade.yml
          e2e-usdcx.yml
          e2e-usdcx-live.yml
          pr-e2e-bridge-guardian.yml
          pr-e2e-earn.yml
          pr-e2e-guardian-lifecycle.yml
          pr-e2e-swap.yml
          SUITES
          )

          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha) || {
            echo "::error title=Release E2E::${REF} does not name a commit in ${GITHUB_REPOSITORY}"
            exit 1
          }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REF}" --silent 2>/dev/null; then
            heading="### Release E2E on tag \`${REF}\` (${sha:0:9}), ${EVENT}"
          else
            heading="### Release E2E on branch \`${REF}\`, head ${sha:0:9} at dispatch, ${EVENT}"
          fi
          {
            echo "$heading"
            echo
            echo "Each suite's own run records the commit it tested."
            echo
            echo '| Suite | Dispatch |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          failed=()
          while read -r file args; do
            [ -n "$file" ] || continue
            if [ "$EVENT" = schedule ]; then
              case "$file" in
                e2e-resilience.yml | e2e-usdcx-live.yml)
                  echo "| ${file} | its own nightly cron |" >> "$GITHUB_STEP_SUMMARY"
                  continue
                  ;;
              esac
            fi
            # shellcheck disable=SC2086 # args is the suite's own list of -f flags
            if gh workflow run "$file" --repo "$GITHUB_REPOSITORY" --ref "$REF" $args; then
              echo "| ${file} | started |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Release E2E::could not dispatch ${file} on ${REF}"
              echo "| ${file} | **failed** |" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$file")
            fi
          done <<< "$suites"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error title=Release E2E::${#failed[@]} suite(s) not dispatched on ${REF} (${sha}): ${failed[*]}"
            exit 1
          fi
          echo "Dispatched the release E2E suites on ${REF} (${sha})."

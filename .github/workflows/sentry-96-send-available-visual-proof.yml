name: Sentry 96 Send Available visual proof

on:
  push:
    branches: [ci/sentry-96-send-available-visual-6cf802d9-v2]

permissions:
  contents: read

jobs:
  send-available-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE: 6cf802d983801d7afa68f28a91747a32e7a62544
      BASELINE: 42a7043b1463c5f516018d7a5ff8ec4495975488
      OVERLAY_SHA256: 029f9068f68b0b2a0197ff609f36ef4659ea74eb7259b3fc2dda67435945f524
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Bind exact source and test overlay
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^")" = "$BASELINE"
          specs=(
            playwright/visual/token-detail/send-available.html
            playwright/visual/token-detail/send-available.leaves.ts
            playwright/visual/token-detail/send-available.tsx
            playwright/visual/token-detail/visual.spec.ts
            playwright/visual/token-detail/vite.config.mts
          )
          printf '%s\n' .github/workflows/sentry-96-send-available-visual-proof.yml "${specs[@]}" > "$RUNNER_TEMP/allowed"
          git diff --name-only "$CANDIDATE" HEAD | diff "$RUNNER_TEMP/allowed" -
          git diff --exit-code "$BASELINE" "$CANDIDATE" -- "${specs[@]}" package.json yarn.lock playwright.token-detail-visual.config.ts
          proof="$RUNNER_TEMP/send-available-proof"
          mkdir "$proof"
          git diff --full-index --binary --no-color "$CANDIDATE" HEAD -- "${specs[@]}" > "$proof/overlay.patch"
          printf '%s  %s\n' "$OVERLAY_SHA256" "$proof/overlay.patch" | sha256sum --check
          printf 'proof=%s\nsource=%s\nbaseline=%s\noverlay_sha256=%s\n' \
            "$GITHUB_SHA" "$CANDIDATE" "$BASELINE" "$OVERLAY_SHA256" | tee "$proof/source.txt" >> "$GITHUB_STEP_SUMMARY"
          git checkout --detach "$CANDIDATE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: timeout 6m yarn install --frozen-lockfile --non-interactive --network-timeout 60000
      - uses: ./.github/actions/apt-drop-unused-repos
      - name: Install Chromium
        timeout-minutes: 5
        run: yarn playwright install --with-deps chromium
      - name: Capture exact before and after states
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/send-available-proof"
          output=test-results/token-detail-visual
          for capture in before after; do
            if [[ "$capture" == before ]]; then sha="$BASELINE"; else sha="$CANDIDATE"; fi
            git checkout --detach "$sha"
            test "$(git rev-parse HEAD)" = "$sha"
            git diff --exit-code
            git apply --check "$proof/overlay.patch"
            git apply "$proof/overlay.patch"
            printf '%s=%s tree=%s\n' "$capture" "$sha" "$(git rev-parse "HEAD^{tree}")" | tee -a "$proof/source.txt" >> "$GITHUB_STEP_SUMMARY"
            mkdir "$proof/$capture"
            PLAYWRIGHT_JSON_OUTPUT_FILE="$proof/$capture/results.json" SEND_AVAILABLE_CAPTURE="$capture" \
              yarn playwright test --config playwright.token-detail-visual.config.ts \
                --project extension-light --project extension-dark --grep 'captures Send Available at the precision boundary' \
                --workers=1 --retries=0 --reporter=list,json 2>&1 | tee "$proof/$capture/playwright.log"
            cp -R "$output/." "$proof/$capture/"
            for theme in light dark; do
              shot=$(find "$proof/$capture" -name "send-available-$theme-$capture.png")
              test -n "$shot"
              file "$shot" | grep -F 'PNG image data, 320 x 640'
            done
            git apply --reverse "$proof/overlay.patch"
            git diff --exit-code
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sentry-96-send-available-visual
          path: ${{ runner.temp }}/send-available-proof/
          if-no-files-found: error
          retention-days: 7

name: Infra Resilience E2E (Chrome)
# Fault-injection suite: stands up the hermetic localnet stack and runs
# playwright/e2e/tests/resilience, each spec arming a network/guardian fault
# (harness/network-faults.ts) and asserting the wallet degrades / recovers
# gracefully. The node + prover come from .github/actions/run-local-node and the
# note-transport from run-note-transport.sh (both HOST processes on 0.16); only
# the two guardians come from docker-compose.local.yml.
#
# Trigger: push to main (post-merge signal), manual dispatch, and a nightly cron.
# This is NOT a required pre-merge PR gate (spec decision) — a full docker stack
# per PR is too costly; it runs after merge and nightly to catch resilience
# regressions over time.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly at 05:00 UTC (after the stress suite's 04:00).
    - cron: '0 5 * * *'
concurrency:
  group: e2e-resilience-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resilience-chrome:
    name: infra-resilience-e2e (chrome)
    runs-on: warp-ubuntu-latest-x64-8x
    # Cold-cache runs compile miden-client-cli (~8m) + note-transport (~5m);
    # warm-cache runs are ~20m. The fault suite adds guardian bring-up + more
    # specs, so 60m gives headroom over pr-e2e-local's 45m.
    timeout-minutes: 60
    env:
      E2E_NETWORK: localhost
      MIDEN_NTX_AUTH: e2e-ntx-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Pinned exact (NOT @stable): a binary built with a newer rustc can reject
      # the pinned older CLI/transport crates. Bump deliberately (and the cache
      # key). Mirrors pr-e2e-local.yml.
      - uses: dtolnay/rust-toolchain@1.96.1
      # The cargo cache is SHARED by every E2E workflow and warmed on main
      # (.github/workflows/warm-e2e-cargo-cache.yml), so this suite restores it
      # instead of spending ~12 min rebuilding binaries that are byte-identical
      # across jobs. Keyed on what actually determines those binaries — the rustc
      # pin, the note-transport ref and the pinned miden-client-cli rev — NOT on
      # all of package.json (which changes for unrelated reasons and used to bust
      # the cache). Keep this step identical to pr-e2e-local.yml.
      - name: Compute shared cargo cache key
        id: cargo_cache_key
        run: |
          rev=$(node -p "require('./package.json').midenClientCliGit.rev")
          url=$(node -p "require('./package.json').midenClientCliGit.url")
          ver=$(node -p "require('./package.json').midenClientCliVersion ?? ''")
          pins=$(printf '%s|%s|%s' "$url" "$rev" "$ver" | sha256sum | cut -c1-16)
          # Only the note-transport pins from versions.env: that file also holds
          # NODE_SRC_REF (the node has its own cache, keyed on it directly) and
          # GUARDIAN_IMAGE_TAG (a Docker tag, which cannot affect a Rust build).
          # Hashing the whole file meant bumping either one threw away ~8 min of
          # cargo work — the same defect this key was already narrowed once to
          # fix when it hashed all of package.json.
          nts_src=$(grep -E '^NOTE_TRANSPORT_(REPO|REF)=' playwright/e2e/local-stack/versions.env)
          # Guard: an empty match would hash to a constant, silently pinning the
          # key and letting a note-transport bump reuse a stale binary.
          [ -n "$nts_src" ] || { echo "::error::no NOTE_TRANSPORT_* pins in versions.env"; exit 1; }
          nts=$(printf '%s' "$nts_src" | sha256sum | cut -c1-16)
          echo "key=miden-e2e-cargo-v2-rust1.96.1-$nts-$pins" >> "$GITHUB_OUTPUT"
      - name: Cache cargo (cli + note-transport)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ${{ runner.temp }}/note-transport/target
          key: ${{ steps.cargo_cache_key.outputs.key }}
      - run: yarn install --frozen-lockfile
      - name: Pre-install miden-client-cli (off the per-test clock)
        # The harness auto-installs the CLI lazily on first use, but that ~7min compile
        # blows the 300s per-test timeout, so it is pre-installed here. The action also
        # rebuilds it against a linked Protocol PR when the PR carries one: the CLI
        # EXECUTES AND PROVES transactions client-side, so an unpatched one dies inside
        # its own local execution with a bare `x assert` that the harness misreports as
        # a drained chain. No marker, no rebuild, and nothing about this step changes.
        uses: ./.github/actions/install-miden-client-cli
      - name: Start local 0.16 node (validator + sequencer + ntx-builder + prover)
        uses: ./.github/actions/run-local-node
        with:
          # Fault injection against guarded accounts, which pay fees via protocol#3786.
          # Fees also change what a failure looks like, which is the point of this suite.
          verification-base-fee: '10000'
      - name: Wait for node RPC + prover
        working-directory: playwright/e2e/local-stack
        run: |
          probe() { timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for _ in $(seq 1 90); do
            probe 57291 && probe 50052 && echo "node(57291)+prover(50052) ready" && exit 0
            sleep 2
          done
          echo "node RPC (57291) / prover (50052) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -120
          exit 1
      - name: Bring up guardians (Tier-2 + Tier-3)
        working-directory: playwright/e2e/local-stack
        run: |
          # The guardian resilience specs need BOTH operators; the
          # guardian-switch profile implies Tier-2, so this starts guardian (:3000)
          # + guardian-b (:3001) and their postgres backends.
          # (These specs were quarantined on SDK 0.16 — #522 — until the 0.17
          # guardian client re-enabled them in #766.)
          docker compose --env-file versions.env -f docker-compose.local.yml \
            --profile guardian-switch up -d guardian guardian-postgres guardian-b guardian-b-postgres
      - name: Wait for guardians
        working-directory: playwright/e2e/local-stack
        run: |
          probe() { timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for _ in $(seq 1 90); do
            probe 3000 && probe 3001 && echo "guardian(3000)+guardian-b(3001) ready" && exit 0
            sleep 2
          done
          echo "guardians (3000/3001) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color guardian guardian-b | tail -120
          exit 1
      - name: Start note-transport
        run: playwright/e2e/local-stack/run-note-transport.sh
      - name: Build extension (localnet)
        run: E2E_NETWORK=localhost yarn test:e2e:blockchain:build
      - name: Install xvfb
        # The azure apt mirror intermittently blackholes: runs have stalled ~57 min
        # inside `apt-get update`, been killed by the job cap, and produced no test
        # results. Prefer the canonical mirror, bound + retry fetches, cap the step.
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb
      - name: Install Playwright browser
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Run resilience specs
        # No --retries override: use the config's retries=2. The resilience
        # ASSERTIONS are deterministic (armed fault → a non-graceful regression
        # fails on every attempt, so a retry can't mask it), but wallet-onboarding
        # SETUP drives real proofs through the single serial prover and flakes
        # under back-to-back load — the prover-timing flake pr-e2e-local absorbs
        # with --retries=1. See the config comment. The "Report flaky" step below
        # surfaces any retried-then-passed spec so a creeping flake stays visible
        # instead of silent.
        run: xvfb-run -a yarn test:e2e:resilience:run
      - name: Report flaky (retried-then-passed) specs
        if: always()
        run: node scripts/report-flaky-e2e.mjs test-results/results.json
      - name: Dump local node logs on failure
        if: failure()
        uses: ./.github/actions/dump-local-node-logs

      - name: Dump stack logs on failure
        if: failure()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-resilience-report
          path: test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian-switch down -v || true

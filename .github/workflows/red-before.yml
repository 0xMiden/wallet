name: Wallet 1451 simulated browser capture
run-name: Wallet 1451 simulated browser capture ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact diagnostic commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    if: github.ref == 'refs/heads/ci/1451-offline-visual'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify product source
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          git rev-parse HEAD > source.txt
          test "$(cat source.txt)" = "$EXPECTED_SHA"
          git diff --exit-code 5ad96b8f2e90b122301e0ad4f9b582ba49b1edd1 HEAD -- src public packages package.json yarn.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
        with:
          attempts: '2'
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Capture simulated provider comparison
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/1451-visual/results.json
        run: yarn playwright test --config .superpowers/1451-visual/playwright.config.ts --workers=1 --retries=0 --reporter=line,json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wallet-1451-simulated-captures
          path: |
            test-results/1451-visual/
            source.txt

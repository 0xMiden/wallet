name: Activity offline Chrome acceptance
run-name: Activity offline Chrome acceptance ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact diagnostic commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-chrome:
    if: github.ref == 'refs/heads/ci/801-activity-visual'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MIDEN_E2E_TEST: 'true'
      MIDEN_USE_MOCK_CLIENT: 'true'
      E2E_HEADLESS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify diagnostic source
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -3 --format='%H %s' | tee "$RUNNER_TEMP/source.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Install Chrome test browser
        run: yarn playwright install chrome
      - name: Build offline Chrome extension
        run: yarn build:extension
      - name: Exercise the Activity view with synthetic state
        run: yarn playwright test --config playwright.activity.config.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: activity-offline-chrome
          path: |
            test-results/
            ${{ runner.temp }}/source.txt

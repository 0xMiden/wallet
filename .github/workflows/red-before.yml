name: Activity import order check
run-name: Activity import order check ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact diagnostic commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-chrome:
    if: github.ref == 'refs/heads/ci/801-activity-visual'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MIDEN_E2E_TEST: 'true'
      MIDEN_USE_MOCK_CLIENT: 'true'
      E2E_HEADLESS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify diagnostic source
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -3 --format='%H %s' | tee "$RUNNER_TEMP/source.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Verify Activity import order at the staged product revision
        run: |
          test "$(git rev-parse HEAD:src)" = d6ca80afdb034be06b16264c65de90f6a757fab8
          yarn eslint --max-warnings 0 src/app/templates/history/ActivityGroupedHistory.tsx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: activity-offline-chrome
          path: |
            ${{ runner.temp }}/source.txt

name: Unlock offline visual acceptance
run-name: Unlock offline visual acceptance ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact diagnostic commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  synthetic-unlock:
    if: github.ref == 'refs/heads/ci/876-unlock-visual'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify diagnostic source
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -3 --format='%H %s' | tee "$RUNNER_TEMP/source.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Install browser
        run: yarn playwright install --with-deps chromium
      - name: Exercise the real Unlock page against synthetic admission state
        run: yarn playwright test --config playwright.unlock-visual.config.ts --workers=1 --retries=0 --project 320-light --project 320-dark --grep 'a pending admission message'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unlock-offline-visual
          path: |
            test-results/
            ${{ runner.temp }}/source.txt

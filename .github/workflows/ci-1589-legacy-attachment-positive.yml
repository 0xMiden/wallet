name: Bread Connect legacy opening attachment positive and sensitivity proof
on:
  push:
    branches: [ci/1589-legacy-attachment-positive]
    paths: [.github/workflows/ci-1589-legacy-attachment-positive.yml]
permissions:
  contents: read
jobs:
  legacy-attachment-positive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 59faf9135fe8666f862ba3a8a3575aae3f1be0c9
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - name: Retain setup identity and refuse an unbound template
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/bread-connect-legacy-attachment-positive-proof"
          mkdir "$proof"
          printf '%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$proof/setup-transport.txt"
          printf '%s\n' UNRUN_NOT_ACCEPTED_POSITIVE_OR_SENSITIVITY > "$proof/outcome.txt"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Materialize exact sealed evidence payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'MATERIALIZE'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, os, re, tarfile

          payload_sha256 = 'c688d962dcecb538e3a31c6f57ae782c99af6893314af0fcff2223c2d099beab'
          payload_base64 = ''
          assert re.fullmatch('[0-9a-f]{64}', payload_sha256), 'unbound payload'
          raw = base64.b64decode(payload_base64, validate=True)
          assert hashlib.sha256(raw).hexdigest() == payload_sha256
          root = Path(os.environ['RUNNER_TEMP']) / '1589-legacy-attachment-positive-payload'
          root.mkdir(exist_ok=False)
          expected = {'helper.py', 'run-ci.sh', 'record-framework.gradle', 'contract.json',
                      'expected-source.json', 'expected-sdk.json', 'expected-cases.json',
                      'expected-red.json', 'expected-runtime-pins.json'}
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              names = set()
              for member in archive.getmembers():
                  name = PurePosixPath(member.name)
                  assert member.isfile() and not name.is_absolute() and '..' not in name.parts
                  assert member.name in expected and member.name not in names
                  names.add(member.name)
                  data = archive.extractfile(member).read()
                  assert len(data) == member.size
                  path = root.joinpath(*name.parts)
                  path.write_bytes(data)
                  path.chmod(0o600)
          assert names == expected
          MATERIALIZE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run all65 positive, guard-only omission and restored inventories
        shell: bash
        run: bash "$RUNNER_TEMP/1589-legacy-attachment-positive-payload/run-ci.sh"
      - name: Seal every retained setup and execution payload
        if: always()
        shell: bash
        run: |
          python3 - <<'SEAL'
          from pathlib import Path
          import hashlib, json, os, stat
          root = Path(os.environ['RUNNER_TEMP']) / 'bread-connect-legacy-attachment-positive-proof'
          root.mkdir(exist_ok=True)
          rows = []
          for path in sorted(root.rglob('*')):
              assert not path.is_symlink()
              if path.is_file() and path.name != 'producer-manifest.json':
                  raw = path.read_bytes()
                  rows.append({'path': path.relative_to(root).as_posix(), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'mode': oct(stat.S_IMODE(path.stat().st_mode))})
          (root / 'producer-manifest.json').write_text(json.dumps({'payload_count': len(rows), 'files': rows}, indent=2, sort_keys=True) + '\n')
          SEAL
      - name: Preserve complete raw JVM, source, index and framework evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bread-connect-legacy-attachment-positive-proof
          path: ${{ runner.temp }}/bread-connect-legacy-attachment-positive-proof
          if-no-files-found: error
          include-hidden-files: true

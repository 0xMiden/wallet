name: Eligibility staging binding probe

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Probe once, clean one prior probe, or inspect the original probe
        type: choice
        options: [probe, cleanup, inspect]
        default: probe
        required: true
      cleanup_run_id:
        description: Exact prior probe run ID for cleanup only
        type: string
        required: false
      cleanup_attempt:
        description: Exact prior probe attempt for cleanup only
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: feature-eligibility-staging-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == '0xMiden/wallet' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: feature-eligibility-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate fixed operation
        env:
          PROBE_OPERATION: ${{ inputs.operation }}
          CLEANUP_RUN_ID: ${{ inputs.cleanup_run_id }}
          CLEANUP_ATTEMPT: ${{ inputs.cleanup_attempt }}
        shell: bash
        run: |
          if [[ "$PROBE_OPERATION" == probe || "$PROBE_OPERATION" == inspect ]]; then
            test -z "$CLEANUP_RUN_ID" && test -z "$CLEANUP_ATTEMPT"
          elif [[ "$PROBE_OPERATION" == cleanup ]]; then
            [[ "$CLEANUP_RUN_ID" =~ ^[1-9][0-9]{0,17}$ ]] && [[ "$CLEANUP_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          else
            exit 1
          fi
      - name: Verify prior run provenance
        if: inputs.operation == 'cleanup'
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_RUN_ID: ${{ inputs.cleanup_run_id }}
          CLEANUP_ATTEMPT: ${{ inputs.cleanup_attempt }}
        run: node scripts/feature-eligibility-staging-probe-recovery.mjs prepare
      - name: Download exact prior attempt evidence
        if: inputs.operation == 'cleanup'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: 0xMiden/wallet
          run-id: ${{ inputs.cleanup_run_id }}
          artifact-ids: ${{ steps.recovery.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/probe-recovered
      - name: Verify original inspection provenance
        if: inputs.operation == 'inspect'
        id: inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/feature-eligibility-staging-inspect.mjs prepare
      - name: Download original inspection evidence
        if: inputs.operation == 'inspect'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: 0xMiden/wallet
          run-id: '40309563506'
          artifact-ids: ${{ steps.inspection.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/probe-recovered
      - name: Inspect original probe with GET requests only
        if: inputs.operation == 'inspect'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/feature-eligibility-staging-inspect.mjs inspect
      - name: Run bounded isolated probe
        if: inputs.operation == 'probe'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          umask 077
          node scripts/feature-eligibility-staging-probe.mjs run > "$RUNNER_TEMP/probe-result.json"
      - name: Recover exact prior probe
        if: inputs.operation == 'cleanup'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_OPERATION: cleanup
        run: node scripts/feature-eligibility-staging-probe-recovery.mjs cleanup
      - name: Always clean current probe
        if: always() && inputs.operation == 'probe'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          umask 077
          if test -f "$RUNNER_TEMP/feature-eligibility-probe/manifest.json"; then
            node scripts/feature-eligibility-staging-probe.mjs cleanup > "$RUNNER_TEMP/probe-cleanup-result.json"
          fi
      - name: Validate sanitized inspection evidence
        if: always() && inputs.operation == 'inspect'
        run: node scripts/feature-eligibility-staging-inspect.mjs evidence
      - name: Retain sanitized inspection evidence
        if: always() && inputs.operation == 'inspect'
        uses: actions/upload-artifact@v4
        with:
          name: eligibility-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe-inspection-evidence/inspection.json
          if-no-files-found: warn
          retention-days: 3
      - name: Validate sanitized evidence
        if: always() && inputs.operation != 'inspect'
        env:
          PROBE_OPERATION: ${{ inputs.operation }}
        run: node scripts/feature-eligibility-staging-probe-recovery.mjs evidence
      - name: Retain sanitized evidence
        if: always() && inputs.operation != 'inspect'
        uses: actions/upload-artifact@v4
        with:
          name: eligibility-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/probe-evidence/manifest.json
            ${{ runner.temp }}/probe-evidence/result.json
          if-no-files-found: warn
          retention-days: 3

name: Eligibility duplicate binding expected red
on:
  push:
    branches: [ci/1894-bindings-duplicate-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = f3ac99105f8f35ed5b44218676a47205c82f943b
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-bindings.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 6 - binding inventory rejects unexpected or duplicated target-worker namespaces' result.log || exit 1
          grep -F 'not ok 7 - binding inventory rejects duplicated target-worker namespaces independently' result.log || exit 1
          grep -F '# fail 2' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bindings-duplicate-red
          path: result.log

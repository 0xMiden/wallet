name: Retry history evidence red proof
on:
  push:
    branches: [ci/retry-history-red-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry-history-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/retry-history-evidence/workflow-sha.txt"
          test "$(git rev-parse HEAD^)" = 35d8d9cd735a06601fd0157adbeb03f63638433c
          cp -R .github/retry-history-proof "$RUNNER_TEMP/retry-history-packet"
          git checkout --detach 35d8d9cd735a06601fd0157adbeb03f63638433c
          cp "$RUNNER_TEMP/retry-history-packet/source.json" "$RUNNER_TEMP/retry-history-evidence/"
      - name: Install frozen dependencies
        timeout-minutes: 6
        run: yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee "$RUNNER_TEMP/retry-history-evidence/install.log"
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn tsc --noEmit -p . 2>&1 | tee "$RUNNER_TEMP/retry-history-evidence/types.log"
      - name: Strict named lint
        run: yarn eslint src/app/templates/history/HistoryDetails.test.tsx src/app/templates/history/SwapDetail.test.tsx --max-warnings 0 2>&1 | tee "$RUNNER_TEMP/retry-history-evidence/lint.log"
      - name: Verify intended functional failures
        run: python3 "$RUNNER_TEMP/retry-history-packet/proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-history-red-proof
          path: ${{ runner.temp }}/retry-history-evidence
          if-no-files-found: error

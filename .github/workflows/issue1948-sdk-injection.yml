name: Issue1948 pinned SDK Node addon and V8 coverage diagnostic
on:
  push:
    branches: ['ci/1948-sdk-injection-*']
permissions:
  contents: read
jobs:
  addon:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      RAYON_NUM_THREADS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 20c24ddbcff1c32eccec17562aee149f4557a6bf
          path: wallet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 0xMiden/web-sdk
          ref: fd52477d7c7d5d475dc14987ebbd7a36dbb703da
          path: sdk
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind source, lock and native dependency
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD^)" = 20c24ddbcff1c32eccec17562aee149f4557a6bf
          test "$(git -C wallet rev-parse HEAD)" = 20c24ddbcff1c32eccec17562aee149f4557a6bf
          test "$(git -C wallet rev-parse HEAD^{tree})" = 2af05fb4a4ae0f8197e11001c9b3daff31050d41
          test "$(git -C sdk rev-parse HEAD)" = fd52477d7c7d5d475dc14987ebbd7a36dbb703da
          test "$(git -C sdk rev-parse HEAD^{tree})" = 0d4504105c5ba62f9ab439cfc19cf3ee503277a5
          echo 'c8b254c0e0ee462271c5d5805b1a79399cb709c97bd7c650d8d5b2f2f058fac1  sdk/Cargo.lock' | sha256sum -c
          grep -Fq 'git+https://github.com/0xMiden/rust-sdk?rev=9a9b58a598a71801199d69309e1fb8e4ef27293c#9a9b58a598a71801199d69309e1fb8e4ef27293c' sdk/Cargo.lock
          mkdir -p addon-proof addon
          git -C sdk status --porcelain > addon-proof/sdk-before.txt
          test ! -s addon-proof/sdk-before.txt
      - name: Install pinned Rust toolchain
        timeout-minutes: 8
        run: rustup toolchain install nightly-2026-08-06 --profile minimal
      - name: Build exact SDK Node addon
        timeout-minutes: 45
        run: |
          set -euo pipefail
          cd sdk
          cargo +nightly-2026-08-06 build -p miden-client-web --no-default-features --features nodejs --release --locked --message-format=json-render-diagnostics > ../addon-proof/cargo-artifacts.jsonl
          python3 - <<'PY'
          import json, pathlib, shutil
          records = [json.loads(line) for line in pathlib.Path('../addon-proof/cargo-artifacts.jsonl').read_text().splitlines() if line.startswith('{')]
          found = [path for record in records if record.get('reason') == 'compiler-artifact' and record.get('target', {}).get('name') == 'miden_client_web' for path in record.get('filenames', []) if path.endswith('.so')]
          assert len(found) == 1 and pathlib.Path(found[0]).is_file()
          shutil.copyfile(found[0], '../addon/miden_client_web.node')
          PY
          sha256sum ../addon/miden_client_web.node | awk '{print $1}' > ../addon/sha256.txt
          node -e 'const m=require(process.argv[1]);if(!m||typeof m!=="object")process.exit(1);process.exit(0)' "$(realpath ../addon/miden_client_web.node)"
          git status --porcelain > ../addon-proof/sdk-after.txt
          test ! -s ../addon-proof/sdk-after.txt
          printf '%s\n' 20c24ddbcff1c32eccec17562aee149f4557a6bf fd52477d7c7d5d475dc14987ebbd7a36dbb703da 9a9b58a598a71801199d69309e1fb8e4ef27293c > ../addon/source-binding.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-addon-producer-proof
          path: addon-proof/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sdk-addon-binary
          path: addon/
          if-no-files-found: error
  diagnostic:
    needs: addon
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [proxy, offscreen]
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=8192
      JEST_COVERAGE_SHARD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 20c24ddbcff1c32eccec17562aee149f4557a6bf
          path: wallet
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bind
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 controller/.github/ci/issue1948-sdk-injection.py bind --config controller/.github/ci/issue1948-sdk-injection-inputs.json 2>&1 | tee proof/stage-bind.log
      - name: packages
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 controller/.github/ci/issue1948-sdk-injection.py packages --config controller/.github/ci/issue1948-sdk-injection-inputs.json 2>&1 | tee proof/stage-packages.log
      - name: inject
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 controller/.github/ci/issue1948-sdk-injection.py inject --config controller/.github/ci/issue1948-sdk-injection-inputs.json 2>&1 | tee proof/stage-inject.log
      - name: generate-lock
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 controller/.github/ci/issue1948-sdk-injection.py generate-lock --config controller/.github/ci/issue1948-sdk-injection-inputs.json 2>&1 | tee proof/stage-generate-lock.log
      - name: replay
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 controller/.github/ci/issue1948-sdk-injection.py replay --config controller/.github/ci/issue1948-sdk-injection-inputs.json 2>&1 | tee proof/stage-replay.log
      - name: identities
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 controller/.github/ci/issue1948-sdk-injection.py identities --config controller/.github/ci/issue1948-sdk-injection-inputs.json 2>&1 | tee proof/stage-identities.log
      - uses: actions/download-artifact@v4
        with:
          name: sdk-addon-binary
          path: addon
      - name: Bind and stage exact native addon
        run: |
          set -euo pipefail
          test "$(sha256sum addon/miden_client_web.node | cut -d' ' -f1)" = "$(cat addon/sha256.txt)"
          test "$(sed -n '1p' addon/source-binding.txt)" = 20c24ddbcff1c32eccec17562aee149f4557a6bf
          test "$(sed -n '2p' addon/source-binding.txt)" = fd52477d7c7d5d475dc14987ebbd7a36dbb703da
          test "$(sed -n '3p' addon/source-binding.txt)" = 9a9b58a598a71801199d69309e1fb8e4ef27293c
          mkdir -p replay/node_modules/@miden-sdk/node-linux-x64-gnu
          cp addon/miden_client_web.node replay/node_modules/@miden-sdk/node-linux-x64-gnu/miden_client_web.node
          printf '%s\n' '{"name":"@miden-sdk/node-linux-x64-gnu","version":"0.17.6","main":"miden_client_web.node"}' > replay/node_modules/@miden-sdk/node-linux-x64-gnu/package.json
          cd replay
          node -e 'const m=require("@miden-sdk/node-linux-x64-gnu");if(!m||typeof m!=="object")process.exit(1);process.exit(0)'
          cp ../addon/sha256.txt ../proof/native-addon-sha256.txt
      - name: Run bounded V8 coverage diagnostic
        timeout-minutes: 12
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd replay
          case "$TARGET" in
            proxy) file=src/lib/miden/back/miden-client-proxy.test.ts; pattern='the try-lock read reports busy without waiting'; pending=206 ;;
            offscreen) file=src/offscreen/main.test.ts; pattern='boots the rayon pool and signals OFFSCREEN_READY'; pending=235 ;;
            *) exit 1 ;;
          esac
          yarn jest --coverage --runTestsByPath "$file" --testNamePattern "$pattern" --maxWorkers=2 --workerIdleMemoryLimit=768MB --coverageReporters=json --coverageReporters=text-summary --json --outputFile=coverage/jest-results.json 2>&1 | tee ../proof/diagnostic.log
          node -e 'const x=require("./coverage/jest-results.json"),n=Number(process.argv[1]);if(x.numPassedTests!==1||x.numFailedTests||x.numPendingTests!==n||x.numRuntimeErrorTestSuites)process.exit(1)' "$pending"
          test -s coverage/coverage-final.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-addon-coverage-${{ matrix.target }}
          path: |
            proof/
            replay/coverage/
          if-no-files-found: error

name: Issue1948 V8 partition integrity tests
on:
  push:
    branches: ['ci/1948-sdk-injection-*']
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run integrity tests
        run: |
          set -euo pipefail
          mkdir -p proof
          node --test .github/ci/v8-split/core.test.mjs 2>&1 | tee proof/test.log
          grep -Eq '^# tests [1-9][0-9]*$' proof/test.log
          grep -Eq '^# fail 0$' proof/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-split-core-tests
          path: proof/
          if-no-files-found: error

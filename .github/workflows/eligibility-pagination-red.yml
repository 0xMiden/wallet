name: Eligibility namespace pagination expected red
on:
  push:
    branches: [ci/1894-pagination-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 0dfbf4f915d7785845dd1755a442efef176f2dfa
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-namespaces.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 6 - namespace inventory rejects impossible page sizes for the reported total' result.log || exit 1
          grep -F 'ok 5 - namespace inventory accepts a complete multi-page response' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagination-red
          path: result.log

name: PR1945 C03 fix sensitivity proof
on:
  push:
    branches: ['ci/pr1945-c03-mutation-*']
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Check exact candidate types and named-file lint
        run: |
          yarn tsc --noEmit --pretty false
          yarn eslint src/lib/miden/sdk/pswap-order-note.ts src/lib/miden/sdk/pswap-order-note.test.ts --max-warnings=0
      - name: Prepare pinned helper and result collector
        run: |
          python3 - <<'SETUP'
          import base64,hashlib,json,os
          from pathlib import Path
          s=Path('/tmp/pr1945-c03-proof');s.mkdir()
          helper=base64.b64decode('')
          assert hashlib.sha256(helper).hexdigest()=='32bf2e9ca9c676dac2916f9bf3acc1c048e5fa76060178a6cb65fd61ee045bfc'
          (s/'mutate.sh').write_bytes(helper)
          (s/'check.py').write_bytes(base64.b64decode(''))
          (s/'scope.env').write_text('REV_ROOT='+repr(os.environ['GITHUB_WORKSPACE'])+chr(10))
          (s/'state.json').write_text(json.dumps({'phase':'fix'}))
          SETUP
      - name: Expose exact C03 production hunks
        run: |
          git reset --mixed 92215cea7055dba8757048747984945f6a5c5d0f
          git add src/lib/miden/sdk/pswap-order-note.test.ts .github/workflows/pr1945-c03-sensitivity.yml
          git diff > /tmp/pr1945-c03-proof/fixed-production.patch
      - name: Baseline, per-hunk sensitivity, restored closing test
        run: |
          set -o pipefail
          bash /tmp/pr1945-c03-proof/mutate.sh /tmp/pr1945-c03-proof 'python3 /tmp/pr1945-c03-proof/check.py' 2>&1 | tee /tmp/pr1945-c03-proof/mutation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1945-c03-sensitivity
          path: /tmp/pr1945-c03-proof/
          if-no-files-found: error
          retention-days: 7

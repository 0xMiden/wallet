name: Android eligibility Origin observation
on:
  push:
    branches: [ci/1894-android-origin]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Start wallet fixture
        uses: ./.github/actions/start-eligibility-fixture
      - name: Build Android application and instrumentation
        run: |
          yarn test:e2e:android:build
          cd android
          ./gradlew :app:assembleDebugAndroidTest
      - name: Observe the actual Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb reverse tcp:8551 tcp:8551
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.miden.wallet.EligibilityOriginProbeTest com.miden.wallet.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/origin.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/origin.txt"
            adb logcat -d -s 'EligibilityOriginProbe:I' '*:S' | tee "$RUNNER_TEMP/origin-category.txt"
            grep -q 'ELIGIBILITY_ORIGIN_CATEGORY=' "$RUNNER_TEMP/origin-category.txt"

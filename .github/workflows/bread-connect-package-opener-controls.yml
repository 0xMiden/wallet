name: Bread Connect actual PackageOpener controls
on:
  push:
    branches: [ci/1589-package-opener-controls]
    paths: [.github/workflows/bread-connect-package-opener-controls.yml]
permissions:
  contents: read
jobs:
  platform-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE_SHA: 4024b8b9f1e0a7110bdf6ea2f8857cbd7777b22d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run existing Kotlin suites and five real platform controls
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip -dc > "$RUNNER_TEMP/expected-source.json"
          printf '%s  %s\n' '42f5fa7328966b4ce4849a76b73731349b9a9091fa08f572529b92d8f904250f' "$RUNNER_TEMP/expected-source.json" | sha256sum --check --status
          printf '%s' '' | base64 --decode | gzip -dc > "$RUNNER_TEMP/expected-sdk.json"
          printf '%s  %s\n' 'a17b8f89f0aae8e043b014cc983f3d4953c9ca75a136d767b64f0b6bb56ead02' "$RUNNER_TEMP/expected-sdk.json" | sha256sum --check --status
          printf '%s' '' | base64 --decode | gzip -dc > "$RUNNER_TEMP/expected-cases.json"
          printf '%s  %s\n' 'c8344c026995d2add55160bc9bd383cab123144f13b0d8a9c469fec751fe7ede' "$RUNNER_TEMP/expected-cases.json" | sha256sum --check --status
          printf '%s' '' | base64 --decode | gzip -dc > "$RUNNER_TEMP/run-ci.sh"
          printf '%s  %s\n' '11fb7f4c51ad6f93601511698a736ff999e4cf61dcae78d6e52a1e9aaf306b80' "$RUNNER_TEMP/run-ci.sh" | sha256sum --check --status
          bash "$RUNNER_TEMP/run-ci.sh"
      - name: Preserve raw source, runtime and test proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bread-connect-package-opener-platform-proof
          path: ${{ runner.temp }}/bread-connect-platform-proof
          if-no-files-found: error

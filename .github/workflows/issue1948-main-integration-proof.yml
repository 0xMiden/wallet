name: Issue 1948 main integration proof
on:
  push:
    branches: [ci/1948-main-integration-proof]
permissions:
  contents: read
  actions: read
jobs:
  wallet:
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1a231822a09524e9a93374164e798aae2d29d43
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify wallet identity
        run: test "$(git rev-parse HEAD)" = a1a231822a09524e9a93374164e798aae2d29d43
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@v4
        with:
          name: sdk505-40842248402
          run-id: 40842248402
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Inject reviewed SDK package
        run: |
          echo "3b2dc2765947b8d1ad064735d4bf08ccd100fc312c2901419220ebb721207905  $RUNNER_TEMP/sdk505.tgz" | sha256sum -c
          rm -rf node_modules/@miden-sdk/miden-sdk
          mkdir -p node_modules/@miden-sdk/miden-sdk
          tar -C node_modules/@miden-sdk/miden-sdk -xzf "$RUNNER_TEMP/sdk505.tgz"
          test -f node_modules/@miden-sdk/miden-sdk/dist/st/index.d.ts
          test -f node_modules/@miden-sdk/miden-sdk/dist/st/eager.js
      - name: Full TypeScript check
        run: yarn tsc --noEmit
      - name: Recovery and state integration tests
        run: |
          mapfile -t tests < <(find src/lib/miden/recovery src/screens/storage-recovery src/lib/store -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
          tests+=(src/lib/miden/back/main.test.ts src/offscreen/main.test.ts src/lib/miden/back/miden-client-proxy.test.ts src/lib/miden/sdk/miden-client-interface.recovery.test.ts src/lib/miden/back/vault.test.ts src/app/StorageRecoveryPage.test.tsx src/app/PageRouter.test.tsx src/lib/epoch/bridge.test.ts src/lib/miden/spending-limits/queue.test.ts src/lib/miden/spending-limits/queue.recovery.test.ts src/lib/miden/transaction/retry.test.ts src/lib/miden/transaction/retry.recovery.test.ts src/lib/miden/transaction/retry.unconfirmed.test.ts src/lib/miden/transaction/retry.landed.test.ts src/lib/miden/transaction/proposal-diagnostics.integration.test.ts src/lib/miden/transaction/transaction-failure-sentry.integration.test.ts src/lib/miden/transaction/transactions.guardian.test.ts src/screens/earn-flow/useEarnPositions.test.ts)
          printf 'Selected %s suites\n' "${#tests[@]}"
          test "${#tests[@]}" -gt 6
          yarn jest --runTestsByPath "${tests[@]}" --maxWorkers=2 --no-coverage --json --outputFile="$RUNNER_TEMP/issue1948-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet1948-${{ github.run_id }}
          path: ${{ runner.temp }}/issue1948-results.json
          if-no-files-found: warn

name: Retry status evidence green proof
on:
  push:
    branches: [ci/retry-status-green-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry-status-green-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/retry-status-green-evidence/workflow-sha.txt"
          test "$(git rev-parse HEAD~2)" = 399e9ebeae61ca1521914cf1aa8039e9faeab625
          cp -R .github/retry-status-green "$RUNNER_TEMP/retry-status-green-packet"
          git checkout --detach 399e9ebeae61ca1521914cf1aa8039e9faeab625
          cp "$RUNNER_TEMP/retry-status-green-packet/source.json" "$RUNNER_TEMP/retry-status-green-evidence/"
      - name: Install frozen dependencies
        timeout-minutes: 6
        run: yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee "$RUNNER_TEMP/retry-status-green-evidence/install.log"
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn tsc --noEmit -p . 2>&1 | tee "$RUNNER_TEMP/retry-status-green-evidence/types.log"
      - name: Strict named lint
        run: yarn eslint src/screens/generating-transaction/GeneratingTransaction.test.tsx src/screens/generating-transaction/GeneratingTransaction.tsx src/screens/generating-transaction/types.ts --max-warnings 0 2>&1 | tee "$RUNNER_TEMP/retry-status-green-evidence/lint.log"
      - name: Check formatting
        run: yarn prettier --check src/screens/generating-transaction/GeneratingTransaction.test.tsx src/screens/generating-transaction/GeneratingTransaction.tsx src/screens/generating-transaction/types.ts 2>&1 | tee "$RUNNER_TEMP/retry-status-green-evidence/format.log"
      - name: Verify green and functional mutations
        run: python3 "$RUNNER_TEMP/retry-status-green-packet/proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-status-green-proof
          path: ${{ runner.temp }}/retry-status-green-evidence
          if-no-files-found: error

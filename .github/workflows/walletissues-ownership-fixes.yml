name: Wallet issue ownership fixes evidence - NEVER MERGE

on:
  push:
    branches: [ci/walletissues-ownership-guard-fixes]

permissions:
  contents: read

jobs:
  ownership-fixes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Capture full commit, scoped physical source, index and actual Python sources
        shell: bash
        working-directory: .github/fixtures/walletissues-ownership-fixes
        run: |
          export OWNERSHIP_RESULTS="$RUNNER_TEMP/ownership-fix-results"
          printf 'OWNERSHIP_RESULTS=%s\n' "$OWNERSHIP_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$OWNERSHIP_RESULTS"
          python3 -B capture_proof.py before
      - name: Run complete fixed ownership helper checkpoint
        shell: bash
        working-directory: .github/fixtures/walletissues-ownership-fixes
        run: |
          set +e
          python3 -B run_tests.py 2>&1 | tee "$OWNERSHIP_RESULTS/tests.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'python=%s\ntee=%s\n' "${statuses[0]}" "${statuses[1]}" > "$OWNERSHIP_RESULTS/exits.txt"
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          exit "${statuses[0]}"
      - name: Observe private ignored-command assertion sensitivity
        if: ${{ always() }}
        shell: bash
        working-directory: .github/fixtures/walletissues-ownership-fixes
        run: |
          set +e
          python3 -B run_sensitivity.py 2>&1 | tee "$OWNERSHIP_RESULTS/sensitivity.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'python=%s\ntee=%s\n' "${statuses[0]}" "${statuses[1]}" > "$OWNERSHIP_RESULTS/sensitivity-exits.txt"
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          exit "${statuses[0]}"
      - name: Observe private import and inverse-admission guard sensitivity
        if: ${{ always() }}
        shell: bash
        working-directory: .github/fixtures/walletissues-ownership-fixes
        run: |
          set +e
          python3 -B run_control_sensitivity.py 2>&1 | tee "$OWNERSHIP_RESULTS/control-sensitivity.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'python=%s\ntee=%s\n' "${statuses[0]}" "${statuses[1]}" > "$OWNERSHIP_RESULTS/control-sensitivity-exits.txt"
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          exit "${statuses[0]}"
      - name: Always retain final source, index and runtime identities
        if: ${{ always() }}
        shell: bash
        working-directory: .github/fixtures/walletissues-ownership-fixes
        run: python3 -B capture_proof.py after
      - name: Always validate natural full-suite and sensitivity evidence
        if: ${{ always() }}
        shell: bash
        working-directory: .github/fixtures/walletissues-ownership-fixes
        run: python3 -B capture_proof.py validate
      - name: Always seal every retained payload
        if: ${{ always() }}
        shell: bash
        working-directory: .github/fixtures/walletissues-ownership-fixes
        run: python3 -B capture_proof.py seal
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: walletissues-ownership-fixes-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ownership-fix-results
          if-no-files-found: error
          retention-days: 14

name: PR Tests

on:
  pull_request:
    branches:
      - main
      - dev
      - next
      - 'mw-**'
      - 'feat/**'

permissions:
  contents: read
  # Required by .github/actions/inject-linked-web-sdk-pr's sticky comment
  # step. Only the `ci` job opts into posting (`comment: true`), but
  # workflow-level perms apply to all jobs.
  pull-requests: write

jobs:
  # #594 — fail the build when the native prover's miden-client pin drifts from
  # the version behind @miden-sdk/miden-sdk (unless recorded as a safe exemption).
  # No install needed: the guard uses only Node built-ins.
  native-prover-pin:
    name: Native prover pin lockstep
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v3
      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22
      - name: Check native-prover miden-client pin
        run: |
          node scripts/check-native-prover-pin.mjs --self-test
          node scripts/check-native-prover-pin.mjs

  translations:
    name: Update Translation Files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check Out Code
        uses: actions/checkout@v3
        with:
          # Use a PAT (not GITHUB_TOKEN) so the translation commit this job pushes
          # RE-TRIGGERS the PR checks automatically. By GitHub design, a commit
          # pushed with GITHUB_TOKEN is the `github-actions[bot]` actor and does NOT
          # start new workflow runs (GitHub then marks them "action_required",
          # requiring a maintainer to manually "Approve and run") — which silently
          # gated all PR CI (earn/swap/local e2e, PR Tests) the moment this job
          # started pushing locale updates. A PAT-authenticated push from a real
          # maintainer is not exempt, so CI re-runs on the translation commit without
          # approval. No loop: the push below is gated on
          # `git-check.outputs.changes == 'true'`, and the re-run regenerates
          # identical locales → no diff → no second push.
          #
          # SETUP: repo/org admin must add a `TRANSLATIONS_PAT` secret — a token with
          # write (contents) access to this repo (classic PAT with `repo`, or a
          # fine-grained PAT / GitHub App token with Contents: write). Until then this
          # falls back to GITHUB_TOKEN (push still works, manual-approval behavior kept),
          # so forks / unconfigured repos don't break.
          token: ${{ secrets.TRANSLATIONS_PAT || secrets.GITHUB_TOKEN }}
          # Fork PRs: the head branch lives in the contributor's fork, not the
          # base repo. Without `repository`, checkout defaults to the base repo
          # and the fetch of `head_ref` fails (Check Out Code errors, and every
          # job that `needs: translations` skips). Push-back below stays gated
          # to same-repo PRs, so forks check out + generate but skip the push.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # If the PR description carries a "Web SDK PR: #N" marker, this
      # builds @miden-sdk/miden-sdk + @miden-sdk/react from the linked
      # web-sdk PR and rewrites package.json to consume them via file:
      # deps. Silent no-op when no marker.
      #
      # `translations` is the designated comment-poster (comment=true).
      # It's the topologically first yarn-using job — has no `needs:`
      # deps — so the sticky linked-web-sdk-pr comment lands ASAP after
      # CI starts, independent of whether downstream jobs pass. The
      # marocchino/sticky-pull-request-comment library upserts on a
      # `header`, so other jobs setting `comment: false` is fine: only
      # one comment ever exists, posted by the first job to reach this
      # step with a parsed marker.
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
        with:
          comment: 'true'
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Run Install
        uses: ./.github/actions/yarn-install

      - name: Generate Translation Files
        uses: borales/actions-yarn@v4
        env:
          # DeepL API key for the translation engine (utility/generateLanguageFiles.ts).
          # Add it under repo Settings → Secrets and variables → Actions → DEEPL_API_KEY.
          # Absent on fork PRs (secrets aren't shared to forks); the utility then skips
          # translation and this job still runs (it also posts the linked-web-sdk comment).
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        with:
          cmd: createTranslationFile

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet public/_locales/ || echo "changes=true" >> $GITHUB_OUTPUT

      # Only commit/push for non-fork PRs (forks can't push back)
      - name: Commit and push translation updates
        id: commit
        if: steps.git-check.outputs.changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/_locales/
          git commit -m "chore: update translation files"
          git push
          echo "committed=true" >> $GITHUB_OUTPUT

  ci:
    name: Test
    needs: translations
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v3
        with:
          # Fork PRs: the head branch lives in the fork, not the base repo.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # comment=false (default): translations is the designated
      # comment-poster — see its `Inject` step for rationale. Other
      # jobs just need the package.json mutation, not the comment.
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
        with:
          # This job runs playwright/tests/mock-web-client.spec.ts, which imports the SDK under
          # node and so needs the napi binary the published package supplies through its platform
          # optionalDependencies; a `file:` source build has none.
          build-node-module: 'true'
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Run Install
        uses: ./.github/actions/yarn-install

      - name: Run ESLint
        uses: borales/actions-yarn@v4
        with:
          cmd: lint

      - name: Run TypeScript Check
        uses: borales/actions-yarn@v4
        with:
          cmd: ts

      - name: Run Unit Tests
        uses: borales/actions-yarn@v4
        with:
          cmd: test

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build chrome
        uses: borales/actions-yarn@v4
        with:
          cmd: build:chrome
        env:
          MIDEN_USE_MOCK_CLIENT: 'true'

      - name: Install Playwright Browsers
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: xvfb-run -a yarn test:e2e

  coverage:
    name: Coverage Check (95% minimum)
    needs: translations
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v3
        with:
          # Fork PRs: the head branch lives in the fork, not the base repo.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Run Install
        uses: ./.github/actions/yarn-install

      - name: Run Coverage Check
        uses: borales/actions-yarn@v4
        with:
          cmd: test:coverage

  i18n-check:
    name: Check for non-i18n'd strings
    needs: translations
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4
        with:
          # Fork PRs: the head branch lives in the fork, not the base repo.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      # Deliberately no `cache: yarn` here or in any other workflow. setup-node
      # writes its yarn cache under the running ref, so a PR's entry lands in
      # `refs/pull/N/merge` where no other PR can read it — and at ~1.8 GB
      # (two per PR, Linux + macOS) they exhausted the repo's 10 GB budget and
      # LRU-evicted each other before the same PR ran again. Every entry we
      # measured had `last_accessed_at == created_at`: written once, never read.
      # The cost was not just the waste — they evicted `local-node-install-*`,
      # which is worth ~36 min per E2E job, so every E2E run rebuilt the node
      # from source. `yarn install` takes ~90-140s either way; the save step
      # alone cost 13-130s per job.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        # When the inject action has rewritten package.json, --frozen-lockfile
        # would fail because yarn.lock no longer matches the new file: deps.
        # Skip the frozen flag conditionally: if the action patched, fall
        # back to a normal install which will update yarn.lock in-place.
        # On runs without a Web SDK PR marker, --frozen-lockfile stays on.
        run: |
          if [ -f .linked-web-sdk-pr.json ] || grep -qE '"@miden-sdk/(miden-sdk|react)":[[:space:]]*"file:' package.json; then
            yarn install
          else
            yarn install --frozen-lockfile
          fi

      - name: Check i18n compliance
        run: yarn lint:i18n

      # Ratchet over the E2E suites: blocks NEW assertion shapes that cannot fail
      # (toBeGreaterThan(0), waitForBalanceAbove(0), long bare sleeps, expect()
      # inside an if branch). The existing instances are recorded in
      # playwright/e2e/eslint-rules/known-violations.json and do not fail the job.
      - name: Check E2E harness conventions
        run: yarn lint:e2e

name: Retry notice contract and privacy proof
on:
  push:
    branches: [ci/retry-notice-contract-green-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind immutable test source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry-notice-green-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/retry-notice-green-evidence/workflow-sha.txt"
          test "$(git rev-parse HEAD^)" = 595cf22f6f10b58fd6afb61f616ab7914519aaaf
          cp -R .github/retry-notice-green-proof "$RUNNER_TEMP/retry-notice-green-packet"
          git checkout --detach 595cf22f6f10b58fd6afb61f616ab7914519aaaf
          test "$(git rev-parse HEAD^{tree})" = 699185c94ac3f158a707b51280c63495050dc20f
          cp "$RUNNER_TEMP/retry-notice-green-packet/source.json" "$RUNNER_TEMP/retry-notice-green-evidence/"
      - name: Install frozen dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee "$RUNNER_TEMP/retry-notice-green-evidence/install.log"
      - name: Full TypeScript check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          yarn tsc --noEmit -p . 2>&1 | tee "$RUNNER_TEMP/retry-notice-green-evidence/types.log"
      - name: Strict named test lint
        run: |
          set -euo pipefail
          yarn eslint src/lib/telemetry/ui-producer-diagnostics.ts src/lib/telemetry/crash-diagnostics.policy.test.ts src/lib/telemetry/retry-notice-diagnostics.test.ts src/lib/telemetry/user-visible-error.test.ts src/lib/telemetry/egress-boundary.test.ts --max-warnings 0 2>&1 | tee "$RUNNER_TEMP/retry-notice-green-evidence/lint.log"
      - name: Verify green baseline and independent functional mutations
        run: python3 "$RUNNER_TEMP/retry-notice-green-packet/proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-notice-green-proof
          path: ${{ runner.temp }}/retry-notice-green-evidence
          if-no-files-found: error

name: Eligibility rate refusal expected red
on:
  push:
    branches: [ci/1894-rate-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 4e428e6722663f5edacd5aaee6d06bf8475014ba
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-rate.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - rate scenario checks both refusals before object access' result.log || exit 1
          grep -F 'not ok 3 - rate scenario rejects object access before refusal' result.log || exit 1
          grep -F '# fail 3' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rate-red
          path: result.log

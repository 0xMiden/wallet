name: Eligibility topology admission focused proof
on:
  push:
    branches: [ci/1894-topology-admission-green]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 01291c6aa7b3709f72b4bcff9ea7b282e4ca5dc5
      - name: Exercise admission and failure boundaries
        shell: bash
        run: |
          set -o pipefail
          node --test services/feature-eligibility/staging-topology.test.mjs | tee result.log
          grep -F '# tests 6' result.log
          grep -F '# pass 6' result.log
          grep -F '# fail 0' result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-admission-green
          path: result.log

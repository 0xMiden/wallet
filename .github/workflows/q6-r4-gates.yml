name: Integrated queue and settings verification gates
on:
  push:
    branches: [ci/q6-r4-integrated-gates-20261029]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind current integrated source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q6-r4-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/q6-r4-evidence/workflow-sha.txt"
          test "$(git rev-parse HEAD^)" = ae4be03e693baf19b502183202d0c9d2ece065af
          cp -R .github/q6-r4-proof "$RUNNER_TEMP/q6-r4-packet"
          cp "$RUNNER_TEMP/q6-r4-packet/"* "$RUNNER_TEMP/q6-r4-evidence/"
          git checkout --detach ae4be03e693baf19b502183202d0c9d2ece065af
          test "$(git rev-parse HEAD^{tree})" = f2add27c35a044491106067afee3c769938f4323
      - name: Install frozen dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee "$RUNNER_TEMP/q6-r4-evidence/install.log"
      - name: Full current typecheck and strict named lint
        run: |
          set -euo pipefail
          yarn tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/q6-r4-evidence/typecheck.log"
          yarn eslint src/lib/miden/transaction/index.ts src/lib/settings/helpers.ts src/lib/settings/helpers.test.ts src/lib/miden/back/sync-manager.ts src/lib/miden/back/sync-manager.test.ts src/lib/miden/transaction/transaction-failure-sentry.integration.test.ts --max-warnings 0 2>&1 | tee "$RUNNER_TEMP/q6-r4-evidence/lint.log"
      - name: Verify365 integration assertions
        env:
          PROOF_EVIDENCE: ${{ runner.temp }}/q6-r4-evidence
        run: python3 "$RUNNER_TEMP/q6-r4-packet/proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q6-r4-integrated-gates
          path: ${{ runner.temp }}/q6-r4-evidence
          if-no-files-found: error

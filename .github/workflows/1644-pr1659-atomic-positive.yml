      - name: Initialize private evidence and natural-status logger
        id: initialize
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="$RUNNER_TEMP/wallet1644-pr1659-atomic-positive"
          mkdir -m 700 "$PROOF_DIR"
          printf 'PROOF_DIR=%s\n' "$PROOF_DIR" >> "$GITHUB_ENV"
          cat > "$PROOF_DIR/run-logged.bash" <<'W1644_LOGGER'
          run_logged() {
            local label="$1"
            shift
            python3 - "$PROOF_DIR/$label.command.json" "$@" <<'COMMAND_RECORD'
          import datetime, json, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              'argv': sys.argv[2:], 'cwd': os.getcwd(),
              'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, indent=2) + '\n')
          COMMAND_RECORD
            set +e
            "$@" 2>&1 | tee "$PROOF_DIR/$label.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "$PROOF_DIR/$label.exit"
            printf '%s\n' "${statuses[1]}" > "$PROOF_DIR/$label.tee.exit"
            if [ "${statuses[1]}" -ne 0 ]; then return "${statuses[1]}"; fi
            return "${statuses[0]}"
          }
          W1644_LOGGER

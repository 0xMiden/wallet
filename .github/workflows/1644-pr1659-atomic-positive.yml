          from pathlib import Path
          import copy
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          
          P = Path(os.environ['PROOF_DIR']).resolve()
          B = json.loads((P / 'bindings.json').read_text())
          
          
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          
          
          def save(name, value):
              (P / name).write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
          
          
          def load(name):
              return json.loads((P / name).read_text())
          
          
          def git(*args):
              return subprocess.check_output(['git', *args], env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'})
          
          
          def tree(ref):
              result = {}
              for row in git('ls-tree', '-rz', ref).split(b'\0'):
                  if row:
                      meta, name = row.split(b'\t', 1)
                      result[name.decode()] = meta.decode().split()
              return result
          
          
          def snapshot(label, omitted=False):
              entries = tree('HEAD')
              observed = {}
              for name, entry in entries.items():
                  path = Path(name)
                  info = path.lstat()
                  if entry[0] == '120000':
                      assert stat.S_ISLNK(info.st_mode), name
                      raw = os.readlink(path).encode()
                      kind = 'symlink'
                  else:
                      assert entry[1] == 'blob' and stat.S_ISREG(info.st_mode), name
                      assert bool(info.st_mode & 0o111) == (entry[0] == '100755'), name
                      raw = path.read_bytes()
                      kind = 'regular'
                  observed[name] = {
                      'git_entry': entry, 'kind': kind, 'physical_mode': stat.S_IMODE(info.st_mode),
                      'bytes': len(raw), 'sha256': digest(raw),
                      'working_blob': hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  }
              index = Path(git('rev-parse', '--git-path', 'index').decode().strip())
              index_raw = index.read_bytes()
              stages = git('ls-files', '--stage', '-z')
              (P / (label + '.index.bin')).write_bytes(index_raw)
              (P / (label + '.index-stage.bin')).write_bytes(stages)
              row = {'head': git('rev-parse', 'HEAD').decode().strip(),
                     'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                     'entries': entries, 'working': observed, 'index_sha256': digest(index_raw),
                     'index_stage_sha256': digest(stages), 'status': git('status', '--porcelain=v1').decode()}
              save(label + '.map.json', row)
              assert row['head'] == os.environ['GITHUB_SHA']
              if label == 'initial':
                  assert row['status'] == ''
                  assert all(value['working_blob'] == entries[name][2] for name, value in observed.items())
              else:
                  expected = copy.deepcopy(load('initial.map.json'))
                  if omitted:
                      name = B['omission']['path']
                      item = expected['working'][name]
                      item.update(bytes=B['omission']['bytes'], sha256=B['omission']['sha256'],
                                  working_blob=B['omission']['blob'])
                      expected['status'] = ' M ' + name + '\n'
                  assert row == expected, 'Unexpected source/index/types/modes: ' + label
              return row
          
          
          def framework(capture):
              for package, spec in B['framework'].items():
                  root = Path('node_modules') / package
                  assert json.loads((root / 'package.json').read_text())['version'] == spec['version']
                  for key, item in spec['files'].items():
                      raw = (root / item['relative']).read_bytes()
                      assert len(raw) == item['bytes'] and digest(raw) == item['sha256'], (package, key)
                      artifact = P / (spec['artifact_prefix'] + '-' + key)
                      if capture:
                          artifact.write_bytes(raw)
                      else:
                          assert artifact.read_bytes() == raw
          
          
          def frozen_inputs():
              workflow = Path(B['workflow']).read_bytes()
              assert workflow == git('show', 'HEAD:' + B['workflow'])
              start = b'          cat > "$PROOF_DIR/bindings.json" <<\'W1644_BINDINGS\'\n'
              embedded = workflow.split(start, 1)[1].split(b'          W1644_BINDINGS\n', 1)[0]
              assert all(line.startswith(b'          ') for line in embedded.splitlines())
              assert b''.join(line[10:] + b'\n' for line in embedded.splitlines()) == (P / 'bindings.json').read_bytes()
              assert digest(Path(__file__).read_bytes()) == B['helper_sha256']
              assert digest((P / 'run-logged.bash').read_bytes()) == B['logger_sha256']
          
          
          def source():
              assert os.environ['GITHUB_EVENT_NAME'] == 'push'
              assert os.environ['GITHUB_REF_NAME'] == B['branch']
              assert git('rev-parse', 'HEAD^').decode().strip() == B['source']
              for ref, tree_id in [('source', 'source_tree'), ('baseline', 'baseline_tree'), ('member', 'member_tree')]:
                  assert git('rev-parse', B[ref] + '^{tree}').decode().strip() == B[tree_id]
              assert git('rev-parse', B['source'] + '^').decode().strip() == B['baseline']
              assert git('rev-parse', B['baseline'] + '^').decode().strip() == B['member']
              assert git('diff-tree', '--no-commit-id', '--name-status', '-r', B['baseline']).decode().strip() == 'A\t' + B['target']
              assert git('diff-tree', '--no-commit-id', '--name-status', '-r', 'HEAD').decode().strip() == 'A\t' + B['workflow']
              base = tree(B['baseline'])
              before = tree(B['source'])
              after = tree('HEAD')
              assert len(base) == len(before) == B['source_count'] and len(after) == B['source_count'] + 1
              assert set(after) - set(before) == {B['workflow']} and all(after[name] == row for name, row in before.items())
              changed = {name for name in base if base[name] != before[name]}
              assert set(base) == set(before) and changed == set(B['source_changes'])
              for name, item in B['source_changes'].items():
                  assert digest(git('show', B['baseline'] + ':' + name)) == item['before']
                  assert digest(git('show', B['source'] + ':' + name)) == item['after']
              patch = git('diff', B['baseline'], B['source'], '--binary')
              assert digest(patch) == B['source_patch_sha256']
              (P / 'source.patch').write_bytes(patch)
              frozen_inputs()
              (P / 'workflow.yml').write_bytes(Path(B['workflow']).read_bytes())
              assert digest(Path('yarn.lock').read_bytes()) == B['lock_sha256']
              assert digest(Path(B['target']).read_bytes()) == B['target_sha256']
              for name, spec in B['compatibility'].items():
                  assert digest(Path(name).read_bytes()) == spec['sha256']
              for ref, name in [(B['member'], 'member-commit.raw'), (B['baseline'], 'baseline-commit.raw'),
                                (B['source'], 'source-commit.raw'), ('HEAD', 'checkout-commit.raw')]:
                  (P / name).write_bytes(git('cat-file', 'commit', ref))
              save('source-entry-map.json', before)
              save('checkout-entry-map.json', after)
              save('source-and-checkout.json', {
                  'source': B['source'], 'source_tree': B['source_tree'],
                  'checkout': git('rev-parse', 'HEAD').decode().strip(),
                  'checkout_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                  'workflow_sha256': digest(Path(B['workflow']).read_bytes()),
                  'helper_sha256': B['helper_sha256'], 'logger_sha256': B['logger_sha256']})
              save('run-identity.json', {key: os.environ[key] for key in [
                  'GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_REF_NAME', 'GITHUB_RUN_ID',
                  'GITHUB_RUN_ATTEMPT', 'GITHUB_EVENT_NAME']})
              snapshot('initial')
          
          
          def omit():
              snapshot('before-omission')
              framework(False)
              path = Path(B['omission']['path'])
              positive = path.read_bytes()
              assert positive == git('show', B['source'] + ':' + str(path))
              block = B['omission']['before'].encode()
              assert positive.count(block) == 1
              omitted = positive.replace(block, B['omission']['after'].encode(), 1)
              assert len(omitted) == B['omission']['bytes'] and digest(omitted) == B['omission']['sha256']
              (P / 'positive-initiate.ts').write_bytes(positive)
              (P / 'omitted-initiate.ts').write_bytes(omitted)
              path.write_bytes(omitted)
              (P / 'omission.patch').write_bytes(git('diff', '--binary'))
              snapshot('omitted', True)
          
          
          def restore():
              path = Path(B['omission']['path'])
              positive = git('show', B['source'] + ':' + str(path))
              try:
                  snapshot('sensitivity-end', path.read_bytes() != positive)
              finally:
                  assert stat.S_ISREG(path.lstat().st_mode), 'Refuse to restore through a non-regular source path'
                  path.write_bytes(positive)
              snapshot('restored')
              framework(False)
          
          
          def checked_result(label):
              sensitivity = label == 'sensitivity'
              compatibility = label == 'compatibility'
              expected_paths = B['compatibility'] if compatibility else {B['target']: B['target_spec']}
              expected_total = sum(item['count'] for item in expected_paths.values())
              sites = {item['name']: item for item in B['omission_sites']} if sensitivity else {}
              result = load(label + '.jest.json')
              assert len(result['testResults']) == len(expected_paths)
              counts = {'numTotalTests': expected_total, 'numPassedTests': expected_total - len(sites),
                        'numFailedTests': len(sites), 'numTotalTestSuites': len(expected_paths),
                        'numFailedTestSuites': int(sensitivity),
                        'numPassedTestSuites': len(expected_paths) - int(sensitivity),
                        'numPendingTestSuites': 0, 'numPendingTests': 0, 'numTodoTests': 0,
                        'numRuntimeErrorTestSuites': 0}
              for key, value in counts.items():
                  assert result[key] == value, (label, key)
              assert result['success'] is (not sensitivity) and result['wasInterrupted'] is False and result['openHandles'] == []
              assert result['snapshot']['failure'] is False and result['snapshot']['unmatched'] == result['snapshot']['unchecked'] == 0
              inventory = []
              failures = {}
              seen_paths = set()
              for suite in result['testResults']:
                  name = str(Path(suite['name']).relative_to(Path.cwd()))
                  assert name in expected_paths and name not in seen_paths, name
                  seen_paths.add(name)
                  spec = expected_paths[name]
                  assert suite['status'] == ('failed' if sensitivity else 'passed')
                  cases = suite['assertionResults']
                  assert len(cases) == spec['count'] and len({item['fullName'] for item in cases}) == spec['count']
                  if not compatibility:
                      expected = {item['full_name']: item for item in spec['cases']}
                      assert {item['fullName'] for item in cases} == set(expected)
                  for case in cases:
                      full_name = case['fullName']
                      assert full_name == ' '.join([*case['ancestorTitles'], case['title']])
                      assert case['invocations'] == 1 and case['retryReasons'] == [] and case['failing'] is False
                      inventory.append({'path': name, 'case': case})
                      if not compatibility:
                          identity = expected[full_name]
                          assert case['title'] == identity['title'] and case['ancestorTitles'] == identity['ancestor_titles']
                      if full_name not in sites:
                          assert case['status'] == 'passed' and case['failureMessages'] == case['failureDetails'] == []
                          if not compatibility:
                              assert case['numPassingAsserts'] == spec['complete_assertions'][full_name]
                          continue
                      site = sites[full_name]
                      assert case['status'] == 'failed' and len(case['failureMessages']) == len(case['failureDetails']) == 1
                      assert case['numPassingAsserts'] == site['prior_passing_assertions']
                      raw = re.sub(r'\x1b\[[0-9;]*m', '', case['failureMessages'][0])
                      prefix, stack = re.split(r'\n\s+at ', raw, maxsplit=1)
                      detail = case['failureDetails'][0]
                      assert type(detail) is dict and set(detail) == {'matcherResult'}
                      matcher = detail['matcherResult']
                      assert type(matcher) is dict and matcher['pass'] is False
                      message = re.sub(r'\x1b\[[0-9;]*m', '', matcher['message'])
                      if site['matcher'] == 'toEqual':
                          assert set(matcher) == {'expected', 'message', 'name', 'pass'}
                          assert matcher['name'] == 'toEqual' and matcher['expected'] == site['expected']
                          assert message == 'expect(received).toEqual(expected) // deep equality\n\nExpected: ' + json.dumps(site['expected']) + '\nReceived: undefined'
                      else:
                          assert site['matcher'] == 'toMatchObject' and set(matcher) == {'message', 'pass'}
                          assert message.startswith('expect(received).toMatchObject(expected)\n\n')
                          minus = [line for line in message.splitlines() if line.startswith('-') and not line.startswith('- Expected')]
                          for token in ['"extraInputs"', '"swapOrderTxId": "swap-order"', '"swapSettleKind": "settle"']:
                              assert any(token in line for line in minus), token
                          plus = [line for line in message.splitlines() if line.startswith('+') and not line.startswith('+ Received')]
                          assert all('swapOrderTxId' not in line and 'swapSettleKind' not in line for line in plus)
                          assert '"noteIds"' in message and '"fresh"' in message and '"status": 0' in message
                      assert prefix == 'Error: ' + message
                      first = re.split(r'\n\s+at ', stack)[0].strip()
                      pattern = r'[^\n]*\(' + re.escape(str(Path.cwd() / name)) + ':' + str(site['line']) + ':' + str(site['column']) + r'\)'
                      assert re.fullmatch(pattern, first), first
                      failures[full_name] = {'first_frame': first, 'prior_passing_assertions': site['prior_passing_assertions'],
                                             'matcher': matcher, 'post_failure_assertions': 'UNRUN; no credit'}
              assert seen_paths == set(expected_paths) and set(failures) == set(sites)
              save(label + '.inventory.json', {'origin': 'Actual complete unfiltered Jest assertionResults, not a historical inventory',
                                             'expected_static_count': expected_total, 'actual': inventory})
              return {'total': expected_total, 'pass': expected_total - len(sites), 'fail': len(sites),
                      'failures': failures, 'inventory': label + '.inventory.json'}
          
          
          def seal():
              validation = {'status': 'INVALID', 'production_gate': 'CLOSED', 'merge': 'NEVER_MERGE_TRANSPORT'}
              try:
                  outcomes = {key: os.environ.get(key.upper() + '_OUTCOME', 'missing') for key in B['outcomes']}
                  validation['outcomes'] = outcomes
                  for key, value in outcomes.items():
                      assert value == ('failure' if key == 'sensitivity' else 'success'), (key, value)
                  snapshot('validation')
                  framework(False)
                  frozen_inputs()
                  for label, template in B['commands'].items():
                      assert (P / (label + '.log')).is_file(), 'Missing raw command log: ' + label
                      command = load(label + '.command.json')
                      assert command['argv'] == [item.replace('$PROOF_DIR', str(P)) for item in template]
                      assert command['cwd'] == str(Path.cwd())
                      assert int((P / (label + '.exit')).read_text()) == (1 if label == 'sensitivity' else 0)
                      assert int((P / (label + '.tee.exit')).read_text()) == 0
                  suites = {label: checked_result(label) for label in ['positive', 'compatibility', 'sensitivity', 'restored_positive']}
                  assert suites['positive']['total'] + suites['compatibility']['total'] == B['combined_count'] == 226
                  assert load('source-entry-map.json') == tree(B['source'])
                  assert load('checkout-entry-map.json') == tree('HEAD')
                  assert (P / 'workflow.yml').read_bytes() == Path(B['workflow']).read_bytes()
                  assert digest(Path(__file__).read_bytes()) == B['helper_sha256']
                  assert digest((P / 'run-logged.bash').read_bytes()) == B['logger_sha256']
                  positive = git('show', B['source'] + ':' + B['omission']['path'])
                  assert (P / 'positive-initiate.ts').read_bytes() == positive
                  assert digest((P / 'omitted-initiate.ts').read_bytes()) == B['omission']['sha256']
                  for label in B['snapshots']:
                      row = load(label + '.map.json')
                      expected = copy.deepcopy(load('initial.map.json'))
                      if label in ['omitted', 'sensitivity-end']:
                          name = B['omission']['path']
                          expected['working'][name].update(bytes=B['omission']['bytes'], sha256=B['omission']['sha256'],
                                                           working_blob=B['omission']['blob'])
                          expected['status'] = ' M ' + name + '\n'
                      assert row == expected, 'Saved source/index/types/modes mismatch: ' + label
                      assert digest((P / (label + '.index.bin')).read_bytes()) == row['index_sha256']
                      assert digest((P / (label + '.index-stage.bin')).read_bytes()) == row['index_stage_sha256']
                  validation.update(status='EXACT_ATOMIC_LINKAGE_POSITIVE_AND_CAUSAL_OMISSION',
                                    production_gate='ROOT_ACTUAL_SCOPED_ACCEPTANCE_REQUIRED', suites=suites,
                                    limits='Narrow source proof only; whole1644/current-main/final Council/full95/visual remain OPEN')
              except Exception as error:
                  validation['reason'] = str(error)
              finally:
                  save('validation.json', validation)
                  files = {}
                  for path in sorted(P.iterdir()):
                      if path.name == 'hash-manifest.json':
                          continue
                      assert path.is_file() and not path.is_symlink(), path.name
                      raw = path.read_bytes()
                      files[path.name] = {'bytes': len(raw), 'sha256': digest(raw)}
                  save('hash-manifest.json', {'files': files, 'self_excluded': ['hash-manifest.json']})
              print(json.dumps({'status': validation['status'], 'reason': validation.get('reason')}))
              raise SystemExit(0 if validation['status'] == 'EXACT_ATOMIC_LINKAGE_POSITIVE_AND_CAUSAL_OMISSION' else 1)
          
          
          mode = sys.argv[1]
          if mode == 'source':
              source()
          elif mode == 'prepared':
              snapshot('prepared')
              framework(True)
          elif mode == 'omit':
              omit()
          elif mode == 'restore':
              restore()
          elif mode == 'final':
              snapshot('final')
          elif mode == 'seal':
              seal()
          else:
              raise SystemExit('Unknown collector mode')
          W1644_HELPER
      - name: Checkout sole-workflow transport
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind member, test-only, signed source and sole-workflow ancestry
        id: source
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged source python3 "$PROOF_DIR/proof-tools.py" source
      - name: Set supported Node runtime
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install frozen dependencies with normal hooks
        id: install
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged install timeout 10m yarn install --frozen-lockfile --non-interactive
      - name: Verify prepared source and frozen Jest implementations
        id: prepared
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged prepared python3 "$PROOF_DIR/proof-tools.py" prepared
      - name: Check named source and frozen regression format
        id: format
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged format yarn prettier --check src/lib/miden/transaction/initiate.ts src/lib/miden/swap/settlement.ts src/lib/miden/swap/settlement.test.ts src/lib/miden/transaction/initiate.swap-settlement.test.ts
      - name: Lint named source and frozen regression
        id: eslint
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged eslint yarn eslint --max-warnings 0 src/lib/miden/transaction/initiate.ts src/lib/miden/swap/settlement.ts src/lib/miden/swap/settlement.test.ts src/lib/miden/transaction/initiate.swap-settlement.test.ts
      - name: Run unchanged TypeScript gate
        id: typescript
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged typescript yarn tsc --noEmit --pretty false
      - name: Run all seven atomic linkage cases on positive source
        id: positive
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged positive yarn jest --runTestsByPath src/lib/miden/transaction/initiate.swap-settlement.test.ts --maxWorkers=2 --ci --coverage=false --json --outputFile "$PROOF_DIR/positive.jest.json"
      - name: Run all five current compatibility suites without case filters
        id: compatibility
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged compatibility yarn jest --runTestsByPath src/lib/miden/swap/settlement.test.ts src/lib/miden/transaction/initiate.batch-isolation.test.ts src/lib/miden/transaction/initiate.held-claims.test.ts src/lib/miden/transaction/complete.swap-stamp.test.ts src/lib/miden/back/sync-manager.test.ts --maxWorkers=2 --ci --coverage=false --json --outputFile "$PROOF_DIR/compatibility.jest.json"
      - name: Omit only the newly added row initializer
        id: omit
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged omit python3 "$PROOF_DIR/proof-tools.py" omit
      - name: Run unchanged seven cases against the controlled omission
        id: sensitivity
        if: ${{ !cancelled() && steps.omit.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged sensitivity yarn jest --runTestsByPath src/lib/miden/transaction/initiate.swap-settlement.test.ts --maxWorkers=2 --ci --coverage=false --json --outputFile "$PROOF_DIR/sensitivity.jest.json"
      - name: Always restore exact signed positive source
        id: restore
        if: ${{ always() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged restore python3 "$PROOF_DIR/proof-tools.py" restore
      - name: Rerun all seven cases on exact restored positive source
        id: restored_positive
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged restored_positive yarn jest --runTestsByPath src/lib/miden/transaction/initiate.swap-settlement.test.ts --maxWorkers=2 --ci --coverage=false --json --outputFile "$PROOF_DIR/restored_positive.jest.json"
      - name: Always retain final source and index
        id: final
        if: ${{ always() }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged final python3 "$PROOF_DIR/proof-tools.py" final
      - name: Always validate and seal complete unfiltered evidence
        id: seal
        if: ${{ always() }}
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          BINDINGS_OUTCOME: ${{ steps.bindings.outcome }}
          HELPER_OUTCOME: ${{ steps.helper.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PREPARED_OUTCOME: ${{ steps.prepared.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          POSITIVE_OUTCOME: ${{ steps.positive.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          OMIT_OUTCOME: ${{ steps.omit.outcome }}
          SENSITIVITY_OUTCOME: ${{ steps.sensitivity.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          RESTORED_POSITIVE_OUTCOME: ${{ steps.restored_positive.outcome }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        run: |
          set -euo pipefail
          python3 "$PROOF_DIR/proof-tools.py" seal
      - name: Always upload private NEVER MERGE proof
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wallet1644-pr1659-atomic-positive-proof
          path: ${{ env.PROOF_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

name: Issue 1948 offscreen split worker coverage
on:
  push:
    branches: [ci/1948-offscreen-split-workers]
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    name: Coverage shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      JEST_COVERAGE_SHARD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6411c24a4793ad53c61701c8608732e734b291bf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen source
        run: test "$(git rev-parse HEAD)" = 6411c24a4793ad53c61701c8608732e734b291bf
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@v4
        with:
          name: sdk505-40842248402
          run-id: 40842248402
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Inject reviewed SDK
        run: |
          echo "3b2dc2765947b8d1ad064735d4bf08ccd100fc312c2901419220ebb721207905  $RUNNER_TEMP/sdk505.tgz" | sha256sum -c
          rm -rf node_modules/@miden-sdk/miden-sdk
          mkdir -p node_modules/@miden-sdk/miden-sdk
          tar -C node_modules/@miden-sdk/miden-sdk -xzf "$RUNNER_TEMP/sdk505.tgz"
          test -f node_modules/@miden-sdk/miden-sdk/dist/st/index.d.ts
          test -f node_modules/@miden-sdk/miden-sdk/dist/st/eager.js
      - name: Run unchanged coverage shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          yarn test:coverage --runTestsByPath src/offscreen/main.test.ts src/offscreen/main.dispatch-1.test.ts src/offscreen/main.dispatch-2.test.ts src/offscreen/main.dispatch-3.test.ts src/offscreen/main.dispatch-4.test.ts --coverageReporters=json --coverageReporters=text-summary --json --outputFile=coverage/jest-results.json
      - name: Count shard tests
        if: always()
        continue-on-error: true
        run: node scripts/badge-data.mjs count coverage/jest-results.json coverage/test-count.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1948-coverage-shard-${{ matrix.shard }}
          path: |
            coverage/coverage-final.json
            coverage/test-count.json
            coverage/jest-results.json
          if-no-files-found: warn

name: Guardian Lifecycle E2E (Chrome)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: guardian-lifecycle-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Dedicated two-guardian job for the guardian switch/recovery suite
  # (guardian-switch*.spec.ts / guardian-recovery*.spec.ts — design doc
  # 2026-08-03-guardian-switch-recovery-e2e-design.md). Unlike the existing
  # Tier-2 guardian coverage (single guardian, guardian-send-consume.spec.ts,
  # wired into pr-e2e-local.yml), switch/recovery scenarios need a SECOND,
  # distinct-keypair guardian ("B", :3001) to switch/recover TO — brought up
  # via the `guardian-switch` compose profile (docker-compose.local.yml).
  # The specs are live (seven guardian-*.spec.ts files), picked up via
  # playwright.guardian.config.ts's `**/guardian-*.spec.ts` testMatch.
  # guardian-lifecycle-e2e-gate is the stable required-check name.
  # #615: guardian-recovery.spec.ts:65 flaked ~10% of executions (~11 failures /
  # ~110 real runs, 2026-08-04 -> 2026-08-12) since the spec landed — there was
  # no regression commit. The cause was a harness false negative: claimAllNotes
  # billed its reload against the drain budget and could time out mid-way through
  # its two-sample "drained" confirmation, failing wallets that HAD drained. Fixed
  # here; the dump now also renders `status` by name so a Completed row cannot be
  # misread as in-flight.
  #
  # A red run on this job is therefore NOT pre-excused. Guardian 401/429 handling
  # is tracked separately (#617 rate-limit requeue, #619 post-rotation
  # re-register) — if a failure shows those, triage it, don't assume flake.
  # This is NOT #522 (that is the SDK-0.16 protocol gate).
  guardian-lifecycle-e2e:
    name: guardian-lifecycle-e2e (chrome)
    # QUARANTINED (blocked on OZ multisig protocol-0.16 — tracking #522): guardian account
    # creation fails on SDK 0.16 because @openzeppelin/miden-multisig-client has no
    # protocol-0.16 release (latest 0.16.2 targets SDK ^0.15.8; its guardian_ecdsa MASM
    # references AUTH_UNAUTHORIZED_EVENT, removed in protocol 0.16). Delete this `if:` to
    # re-enable once OZ ships a protocol-0.16 client (the gate below tolerates `skipped`).
    if: false
    runs-on: ubuntu-latest
    # Stress scenarios (kill/reopen, guardian-fault injection, A->B->A repeat)
    # are heavier than the Tier-2 happy-path spec; sized like the other
    # dedicated single-purpose e2e jobs (swap/earn/bridge-guardian) rather
    # than pr-e2e-local.yml's 45m. Revisit once real spec timings exist.
    timeout-minutes: 60
    env:
      E2E_NETWORK: localhost
      MIDEN_NTX_AUTH: e2e-ntx-secret
      # Guardian A. Guardian B has no env override -- its localnet-only,
      # MIDEN_E2E_TEST-gated URL (http://localhost:3001) is hardcoded in
      # src/lib/miden-chain/constants.ts (GUARDIAN_OPTIONS), matching the
      # fixed :3001 publish in docker-compose.local.yml.
      GUARDIAN_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      # Pinned exact (NOT @stable): a required gate must not drift with upstream
      # rustc -- a newer stable can reject the pinned older CLI/transport crates and
      # go red on unrelated PRs. Bump this deliberately (and the cache key below).
      - uses: dtolnay/rust-toolchain@1.96.1
      # The cargo cache is SHARED by every E2E workflow and warmed on main
      # (.github/workflows/warm-e2e-cargo-cache.yml), so a PR restores it instead
      # of spending ~12 min rebuilding binaries that are byte-identical across
      # jobs. Keyed on what actually determines those binaries — the rustc pin,
      # the note-transport ref and the pinned miden-client-cli rev — NOT on all of
      # package.json, which changes on most PRs for unrelated reasons and used to
      # bust this cache every time.
      - name: Compute shared cargo cache key
        id: cargo_cache_key
        run: |
          rev=$(node -p "require('./package.json').midenClientCliGit.rev")
          url=$(node -p "require('./package.json').midenClientCliGit.url")
          ver=$(node -p "require('./package.json').midenClientCliVersion ?? ''")
          pins=$(printf '%s|%s|%s' "$url" "$rev" "$ver" | sha256sum | cut -c1-16)
          echo "key=miden-e2e-cargo-v1-rust1.96.1-${{ hashFiles('playwright/e2e/local-stack/versions.env') }}-$pins" >> "$GITHUB_OUTPUT"
      - name: Cache cargo (cli + note-transport)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ${{ runner.temp }}/note-transport/target
          # rustc pin is in the key so a toolchain bump forces a clean rebuild
          # (a binary built with a different rustc must not be reused).
          key: ${{ steps.cargo_cache_key.outputs.key }}
      - run: yarn install --frozen-lockfile
      - name: Pre-install miden-client-cli (off the per-test clock)
        run: |
          # The harness auto-installs the CLI lazily on first use, but that ~7min
          # compile blows the 300s per-test timeout. Pre-install the SAME pinned
          # rev here so the harness's `miden-client --version` check short-circuits.
          # Skip when the cargo cache already restored it (else `cargo install`
          # errors "binary already exists"). The cache key hashes package.json, so
          # a present binary is guaranteed to be the pinned rev.
          if ! command -v miden-client >/dev/null 2>&1; then
            url=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.url)")
            rev=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.rev)")
            cargo install miden-client-cli --git "$url" --rev "$rev" --locked
          fi
          miden-client --version
      - name: Start local 0.16 node (validator + sequencer + ntx-builder + prover)
        uses: ./.github/actions/run-local-node
      - name: Wait for node RPC
        working-directory: playwright/e2e/local-stack
        run: |
          probe() { timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for _ in $(seq 1 90); do
            probe 57291 && probe 50052 && echo "node(57291)+prover(50052) ready" && exit 0
            sleep 2
          done
          echo "node RPC (57291) / prover (50052) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -120
          exit 1
      - name: Bring up both guardians (guardian-switch profile)
        working-directory: playwright/e2e/local-stack
        # `guardian-switch` implies Tier-2 too: it needs BOTH the original
        # guardian ("A", profile `guardian`) and the second, distinct-keypair
        # guardian-b ("B", profile `guardian-switch`) up together, so every
        # service is named explicitly -- Compose starts an explicitly-named
        # service regardless of its own `profiles:` gating.
        # ghcr image pulls can transiently time out (Client.Timeout on ghcr.io/v2/);
        # retry so a flaky guardian pull doesn't fail this (to-be-required) gate.
        run: |
          for attempt in 1 2 3; do
            docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian-switch up -d guardian guardian-postgres guardian-b guardian-b-postgres && exit 0
            echo "guardian bring-up attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          exit 1
      - name: Start note-transport
        run: playwright/e2e/local-stack/run-note-transport.sh
      - name: Build extension (localnet)
        # E2E_NETWORK=localhost bakes MIDEN_NETWORK=localhost AND (always, per
        # test:e2e:blockchain:build) MIDEN_E2E_TEST=true -- required both for the
        # standard test hooks (__TEST_STORE__/__TEST_INTERCOM__) and for the
        # second, localnet-only guardian option in GUARDIAN_OPTIONS to appear
        # in the picker at all (constants.ts gates it on MIDEN_E2E_TEST).
        run: E2E_NETWORK=localhost yarn test:e2e:blockchain:build
      - name: Install xvfb
        # The azure apt mirror intermittently blackholes: runs have stalled ~57 min
        # inside `apt-get update`, been killed by the job cap, and produced no test
        # results. Prefer the canonical mirror, bound + retry fetches, cap the step.
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb
      - name: Install Playwright browser
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Wait for both guardians
        working-directory: playwright/e2e/local-stack
        run: |
          # HTTP probe (not a bare TCP connect): the guardian must actually answer.
          # Neither guardian image ships a /health endpoint -- root `/` is the
          # documented liveness probe (200; /pubkey?scheme=ecdsa also works and
          # additionally proves A/B hold distinct keys, but root is cheaper here).
          wait_for() {
            local port=$1 label=$2
            for _ in $(seq 1 120); do
              curl -s -o /dev/null -m 2 "http://127.0.0.1:${port}/" && echo "guardian ${label}(${port}) ready" && return 0
              sleep 2
            done
            echo "guardian ${label} HTTP (${port}) not ready in time" >&2
            return 1
          }
          ok=0
          wait_for 3000 A || ok=1
          wait_for 3001 B || ok=1
          if [ "$ok" -ne 0 ]; then
            docker compose --env-file versions.env --profile guardian --profile guardian-switch -f docker-compose.local.yml logs --no-color | tail -150
            exit 1
          fi
      - name: Run guardian lifecycle specs
        # No --retries override: retries:0 (playwright.e2e.config.ts, inherited
        # by playwright.guardian.config.ts) is deliberate for this suite -- a
        # flake here is a bug to fix, not to paper over (design doc §11).
        # testMatch is `**/guardian-*.spec.ts`, so this also runs the existing
        # Tier-2 guardian-send-consume/guardian-fault specs until the
        # guardian-switch*/guardian-recovery*.spec.ts files land (later phases
        # of this project) -- expected, not a bug in this workflow.
        run: xvfb-run -a yarn playwright test --config playwright.guardian.config.ts
      - name: Capture OS memory / OOM diagnostics on failure
        if: failure()
        # The guardian recovery specs kill the wallet page mid device-key-
        # rotation while its service worker runs the WASM proof in the
        # background, then reopen(). Intermittently the whole Chromium instance
        # is gone by reopen() ("context or browser has been closed"). dmesg is
        # the decisive evidence: an OOM-kill logs "Killed process ... chrome";
        # its ABSENCE means the browser died some other way (renderer crash),
        # which points the fix somewhere other than memory. `free`/MemTotal also
        # confirm the runner tier (public repo => 16GB expected).
        run: |
          echo "=== free -h ==="; free -h || true
          echo "=== MemTotal / MemAvailable / Swap ==="; grep -iE "MemTotal|MemAvailable|SwapTotal|SwapFree" /proc/meminfo || true
          echo "=== dmesg OOM signals (decisive: present => OOM-kill, absent => non-OOM crash) ==="
          sudo dmesg 2>/dev/null | grep -iE "killed process|out of memory|oom-kill|oom_reaper|Out of memory: Kill" | tail -40 \
            || echo "(no OOM-kill in dmesg -- the browser death was NOT an out-of-memory kill)"
      - name: Dump stack logs on failure
        if: failure()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env --profile guardian --profile guardian-switch -f docker-compose.local.yml logs --no-color | tail -400
      - uses: actions/upload-artifact@v4
        # Keep the screenshot filmstrip only on main-push runs (the record);
        # on PRs, upload only when the run failed (debug artifact, as before).
        if: ${{ github.event_name == 'push' || failure() }}
        with:
          name: guardian-lifecycle-e2e-report
          path: test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env --profile guardian --profile guardian-switch -f docker-compose.local.yml down -v || true

  # Stable required-check name: passes iff guardian-lifecycle-e2e succeeded.
  # Mark THIS "required" in branch protection so the name stays stable across
  # job renames.
  guardian-lifecycle-e2e-gate:
    name: guardian-lifecycle-e2e-gate
    needs: [guardian-lifecycle-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          # QUARANTINED (#522): tolerate `skipped` while guardian-lifecycle-e2e is gated off
          # (guardian unsupported on SDK 0.16 pending an OZ protocol-0.16 client). Revert to
          # require `success` only once the job's `if:` guard is removed.
          R="${{ needs.guardian-lifecycle-e2e.result }}"
          if [ "$R" != "success" ] && [ "$R" != "skipped" ]; then
            echo "guardian-lifecycle-e2e $R"; exit 1; fi
          echo "guardian-lifecycle-e2e $R"

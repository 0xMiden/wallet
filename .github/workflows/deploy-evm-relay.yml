name: Deploy EVM relay

# Deploys the deposit-address relay Worker (services/evm-relay) to Cloudflare.
# A production deploy is always started by hand: this workflow has only a
# `workflow_dispatch` trigger, and the `evm-relay-production` environment's
# required reviewers approve each run. A published release or a merge into
# main deploys nothing.
#
# The committed wrangler.jsonc holds placeholders only. This workflow checks the
# release values, renders a release copy with the allowed origins, the gas mode,
# the relay config and the revision, then deploys with the relayer key and the
# RPC URLs as server-only secrets, and probes the deployment. The Durable Object
# migration is in wrangler.jsonc, and the deploy applies it.

on:
  workflow_dispatch:
    inputs:
      deployment_source:
        description: Source revision to deploy
        type: choice
        options:
          - published-release
          - main
        default: published-release
        required: true
      release_tag:
        description: Published wallet release tag to deploy
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: evm-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: evm-relay-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Resolve deployment source
        id: source
        env:
          DEPLOYMENT_SOURCE: ${{ inputs.deployment_source || 'published-release' }}
          DEPLOYMENT_LABEL: EVM relay
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_WORKFLOW_REF: ${{ github.ref }}
          DEPLOY_WORKFLOW_SHA: ${{ github.sha }}
        run: node scripts/feature-eligibility-deploy-source.mjs

      - name: Require a published release
        if: steps.source.outputs.mode == 'published-release'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG
            });
            if (release.draft || !release.published_at) throw new Error('A published release tag is required');

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.ref }}
      - name: Resolve deployment revision
        id: revision
        env:
          DEPLOYMENT_SOURCE: ${{ steps.source.outputs.mode }}
          DEPLOYMENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          if [[ "$DEPLOYMENT_SOURCE" == main && "$revision" != "$DEPLOYMENT_SHA" ]]; then
            echo 'Main deployment checkout does not match the workflow commit' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == release && "$revision" != "$GITHUB_SHA" ]]; then
            echo 'Release tag moved after the publication event' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      # Wrangler bundles viem and the shared batch module from the repository
      # root. The release check bundles the Worker's config parse with esbuild.
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Type-check the Worker
        run: npx tsc --noEmit -p services/evm-relay/tsconfig.json

      # The script checks every value before it writes a file, and no message
      # names a secret value. It writes the release config and the secrets file
      # to RUNNER_TEMP with mode 0600. EVM_RELAY_RPC_URLS is one JSON object of
      # chain id to URL, and its chains are the chains that the Worker serves,
      # so a new chain needs no change to this workflow.
      - name: Check release values and prepare server configuration and secrets
        id: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVM_RELAY_RELAYER_PRIVATE_KEY: ${{ secrets.EVM_RELAY_RELAYER_PRIVATE_KEY }}
          EVM_RELAY_RPC_URLS: ${{ secrets.EVM_RELAY_RPC_URLS }}
          EVM_RELAY_ALLOWED_ORIGINS: ${{ vars.EVM_RELAY_ALLOWED_ORIGINS }}
          EVM_RELAY_GAS_MODE: ${{ vars.EVM_RELAY_GAS_MODE }}
          EVM_RELAY_CONFIG: ${{ vars.EVM_RELAY_CONFIG }}
          EVM_RELAY_URL: ${{ vars.EVM_RELAY_URL }}
          DEPLOYMENT_REVISION: ${{ steps.revision.outputs.sha }}
        run: node services/evm-relay/prepare-deployment.mjs

      - name: Deploy tagged service with server-only secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          DEPLOYMENT_MESSAGE: ${{ steps.source.outputs.message }}
        run: >-
          npx --yes wrangler@4.151.3 deploy
          --config "$RUNNER_TEMP/evm-relay-release.json"
          --secrets-file "$RUNNER_TEMP/evm-relay-secrets.json"
          --message "$DEPLOYMENT_MESSAGE"

      - name: Verify deployment
        id: readiness
        env:
          EVM_RELAY_URL: ${{ vars.EVM_RELAY_URL }}
          EVM_RELAY_ALLOWED_ORIGINS: ${{ vars.EVM_RELAY_ALLOWED_ORIGINS }}
          EVM_RELAY_REVISION: ${{ steps.revision.outputs.sha }}
        run: node services/evm-relay/check-deployment.mjs

      - name: Remove temporary server secrets
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/evm-relay-secrets.json" "$RUNNER_TEMP/evm-relay-release.json"

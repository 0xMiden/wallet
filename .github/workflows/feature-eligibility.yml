name: Feature eligibility service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/store-publishing/*.test.mjs
      - run: python3 scripts/store-publishing/apple-profile.test.py
      - run: python3 scripts/store-publishing/inspect-artifact.test.py

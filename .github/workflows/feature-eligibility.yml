name: Feature eligibility service

on:
  pull_request:
    paths:
      - 'services/feature-eligibility/**'
      - 'scripts/feature-eligibility-deploy-source.mjs'
      - '.github/workflows/**'
      - '.github/actions/start-eligibility-fixture/**'
      - 'scripts/feature-eligibility-fixture*'
      - 'scripts/start-e2e-eligibility*'
      - '.github/workflows/deploy-feature-eligibility.yml'
      - '.github/workflows/release-wallet.yml'
      - '.github/workflows/build-chrome.yml'
      - '.github/workflows/build-mobile.yml'
      - '.github/workflows/build-desktop.yml'
  push:
    branches:
      - 'ci/feature-eligibility-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-eligibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Feature eligibility service tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test services/feature-eligibility/worker.test.mjs services/feature-eligibility/check-deployment.test.mjs services/feature-eligibility/staging-probe.test.mjs scripts/feature-eligibility-staging-probe.test.mjs scripts/feature-eligibility-fixture.test.mjs scripts/start-e2e-eligibility.test.mjs
      - name: Verify store publishing and production artifact guards
        run: node --test scripts/store-publishing/*.test.mjs
      - name: Verify store artifact archive inspection
        run: python3 scripts/store-publishing/inspect-artifact.test.py
      - name: Verify generated probe config with pinned Wrangler (uncredentialed proof only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdir, readFile, writeFile, copyFile, unlink } from 'node:fs/promises';
          import { join } from 'node:path';
          import { createProbeController } from './scripts/feature-eligibility-staging-probe.mjs';
          const root = join(process.env.RUNNER_TEMP, 'generated-probe-proof');
          const privateDir = join(root, 'private');
          const outputDir = join(root, 'dry-run');
          await mkdir(root, { mode: 0o700 });
          await mkdir(outputDir, { mode: 0o700 });
          const identity = { repository: '0xMiden/wallet', workflowPath: '.github/workflows/probe-feature-eligibility.yml', runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, sourceSha: process.env.GITHUB_SHA };
          const response = result => Response.json({ success: true, errors: [], result });
          const controller = createProbeController({
            context: { ...identity, ref: 'refs/heads/main', eventName: 'workflow_dispatch' },
            workerBytes: await readFile('services/feature-eligibility/staging-probe.mjs'),
            environment: { PATH: process.env.PATH },
            randomSecret: () => 'fake-uncredentialed-probe-secret',
            privateFiles: {
              createDirectory: async mode => { await mkdir(privateDir, { mode }); return privateDir; },
              write: (path, data, mode) => writeFile(path, data, { mode }),
              remove: async path => { try { await unlink(path); } catch (error) { if (error.code !== 'ENOENT') throw error; } }
            },
            providerAPI: async path => {
              if (path === '/user/tokens/verify') return response({ status: 'active' });
              if (path.startsWith('/workers/scripts?')) return response([]);
              if (path === '/workers/subdomain') return response({ subdomain: 'fake-uncredentialed' });
              if (path.endsWith('/settings')) return Response.json({ success: false, errors: [{ code: 10007 }], result: null }, { status: 404 });
              throw new Error('Unpermitted proof effect');
            },
            deploy: async () => {
              for (const file of ['wrangler.json', 'secrets.json', 'staging-probe.mjs', 'manifest.json']) await copyFile(join(privateDir, file), join(outputDir, file));
              return { exitCode: 1 };
            }
          });
          const result = await controller.run(identity);
          assert.equal(result.reason, 'deploy_rejected');
          assert.equal(result.cleanup, 'absent');
          const manifest = JSON.parse(await readFile(join(outputDir, 'manifest.json'), 'utf8'));
          assert.equal(manifest.identity.sourceSha, process.env.GITHUB_SHA);
          console.log('Generated probe config captured from exact source:', process.env.GITHUB_SHA);
          NODE
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/generated-probe-proof" TMPDIR="$RUNNER_TEMP" CI=true WRANGLER_SEND_METRICS=false npx --yes wrangler@4.151.3 deploy --dry-run --no-bundle --config "$RUNNER_TEMP/generated-probe-proof/dry-run/wrangler.json" --secrets-file "$RUNNER_TEMP/generated-probe-proof/dry-run/secrets.json" --outdir "$RUNNER_TEMP/generated-probe-proof/output"
          test -s "$RUNNER_TEMP/generated-probe-proof/output/staging-probe.js"
      - name: Validate Worker bundle and bindings
        run: npx --yes wrangler@4.151.3 deploy --dry-run --config services/feature-eligibility/wrangler.jsonc

  release-workflow-lint:
    name: Eligibility release workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned workflow linter
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/eligibility-actionlint"
          cd "$RUNNER_TEMP/eligibility-actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --pattern actionlint_1.7.12_checksums.txt
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
      - name: Check fixture action shell
        run: bash -n <(printf '%s\n' 'node scripts/start-e2e-eligibility.mjs')
      - name: Lint release and E2E workflows
        run: >-
          "$RUNNER_TEMP/eligibility-actionlint/actionlint"
          .github/workflows/deploy-feature-eligibility.yml
          .github/workflows/release-wallet.yml
          .github/workflows/build-chrome.yml
          .github/workflows/build-mobile.yml
          .github/workflows/build-desktop.yml
          .github/workflows/build-store-artifacts.yml
          .github/workflows/publish-stores.yml
          .github/workflows/ci.yml
          .github/workflows/e2e-android.yml
          .github/workflows/e2e-blockchain.yml
          .github/workflows/e2e-bridge-in.yml
          .github/workflows/e2e-bridge.yml
          .github/workflows/e2e-dapp-browser.yml
          .github/workflows/e2e-dapp.yml
          .github/workflows/e2e-resilience.yml
          .github/workflows/e2e-stress.yml
          .github/workflows/e2e-telemetry.yml
          .github/workflows/e2e-usdcx-live.yml
          .github/workflows/e2e-usdcx.yml
          .github/workflows/pr-e2e-bridge-guardian.yml
          .github/workflows/pr-e2e-earn.yml
          .github/workflows/pr-e2e-guardian-lifecycle.yml
          .github/workflows/pr-e2e-local.yml
          .github/workflows/pr-e2e-swap.yml
          .github/workflows/pr.yml
          .github/workflows/release-e2e.yml
          .github/workflows/next-e2e-devnet.yml
          .github/workflows/ui-smoothness.yml
          .github/workflows/feature-eligibility.yml

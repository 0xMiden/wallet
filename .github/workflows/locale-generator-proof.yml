name: PR 1982 locale generation proof
on:
  push:
    branches: [ci/1982-locale-generator-proof]
permissions:
  contents: read
jobs:
  locale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind source
        run: git checkout --detach 71c14d96417d6f4cf00c0bcb40a1dc1794c25167 && test "$(git rev-parse HEAD)" = 71c14d96417d6f4cf00c0bcb40a1dc1794c25167
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Generate standard locale files
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: yarn createTranslationFile
      - name: Test locale parity
        run: yarn jest src/lib/i18n/locale-bundle-parity.test.ts --runInBand --json --outputFile="$RUNNER_TEMP/locale-result.json"
      - name: Verify tests executed
        run: node -e 'const d=require(process.env.RUNNER_TEMP+"/locale-result.json"); if(!d.success || d.numTotalTests < 1 || d.numFailedTests !== 0) process.exit(1); console.log(`Executed ${d.numTotalTests} tests`);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-1982-generated-locales
          path: public/_locales/

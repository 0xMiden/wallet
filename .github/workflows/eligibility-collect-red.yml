name: Eligibility stable inventory expected red
on:
  push:
    branches: [ci/1894-collect-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 65be46339738309f32c2cd9a13449e042b59e37b
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-collect.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - script collection repeats the bounded fixed-path inventory and returns matching identities' result.log || exit 1
          grep -F 'ok 3 - script collection rejects failed or incomplete provider responses' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect-red
          path: result.log

name: NEVER-MERGE 1616 Earn first-query scoped positive and sensitivity
on:
  push:
    branches: [ci/1616-earn-first-query-positive]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GIT_OPTIONAL_LOCKS: '0'
      CI: 'true'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Bind exact signed four-file source and inert transport
        id: bind
        run: |
          set -euo pipefail
          umask 077
          proof="$RUNNER_TEMP/1616-earn-first-query-positive"
          test ! -e "$proof"
          mkdir "$proof"
          printf 'PROOF_DIR=%s\n' "$proof" >> "$GITHUB_ENV"
          cat > "$proof/capture.py" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          OUT = Path(os.environ['PROOF_DIR'])
          BIND = json.loads((OUT / 'bindings.json').read_text())
          SOURCE = BIND['source']
          FRAMEWORK = ['jest', 'expect', 'jest-circus', 'jest-config', 'jest-runtime', 'jest-resolve',
                       'jest-runner', 'jest-environment-jsdom', '@jest', '@swc', 'typescript', 'prettier',
                       'eslint', 'eslint-plugin-import', 'react', 'react-dom', '@testing-library/react',
                       '@testing-library/dom', 'dexie', 'fake-indexeddb', 'constate',
                       '@epoch-protocol/epoch-intents-sdk', 'viem', '@miden-sdk/miden-sdk']


          def git(*args):
              return subprocess.check_output(['git', *args], cwd=ROOT,
                                             env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'})


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def save(name, value):
              (OUT / name).write_text(json.dumps(value, indent=2) + '\n')


          def validate_binding():
              assert BIND.get('ready') is True
              for key in ['source', 'tree', 'parent']:
                  assert re.fullmatch(r'[0-9a-f]{40}', BIND[key]), key
              assert BIND['source_inputs'] and len(BIND['phases']) == 5
              assert set(BIND['mutants']) == {'caller', 'consumer'}
              for mutant in BIND['mutants'].values():
                  assert re.fullmatch(r'[0-9a-f]{64}', mutant['sha256'])
                  assert digest((OUT / mutant['patch']).read_bytes()) == mutant['patch_sha256']
              assert git('rev-parse', 'HEAD').decode().strip() == SOURCE
              assert git('rev-parse', 'HEAD^{tree}').decode().strip() == BIND['tree']
              headers = git('cat-file', '-p', 'HEAD').split(b'\n\n', 1)[0].splitlines()
              parents = [line[7:].decode() for line in headers if line.startswith(b'parent ')]
              assert parents == [BIND['parent']]


          def source_records(state):
              validate_binding()
              assert state in ['positive', 'caller', 'consumer']
              mutant = None if state == 'positive' else BIND['mutants'][state]
              assert not git('diff', '--cached', '--name-only')
              dirty = [] if mutant is None else [mutant['path']]
              assert git('diff', '--name-only').decode().splitlines() == dirty
              expected_status = ''.join(' M ' + path + '\n' for path in dirty).encode()
              assert git('status', '--porcelain=v1', '--untracked-files=all') == expected_status
              stage = git('ls-files', '--stage', '-z')
              files = {}
              for record in stage.split(b'\0'):
                  if not record:
                      continue
                  header, raw_path = record.split(b'\t', 1)
                  mode, oid, number = header.decode().split()
                  assert number == '0' and mode in ['100644', '100755', '120000']
                  path = raw_path.decode()
                  p = ROOT / path
                  info = p.lstat()
                  if mode == '120000':
                      assert stat.S_ISLNK(info.st_mode)
                      data = os.readlink(p).encode()
                      kind = 'symlink'
                  else:
                      assert stat.S_ISREG(info.st_mode) and not p.is_symlink()
                      assert bool(info.st_mode & 0o111) == (mode == '100755')
                      data = p.read_bytes()
                      kind = 'regular'
                  if mutant is not None and path == mutant['path']:
                      assert kind == 'regular' and mode == '100644'
                      assert digest(data) == mutant['sha256'] and len(data) == mutant['bytes']
                      assert format(stat.S_IMODE(info.st_mode), '04o') == mutant['mode']
                  else:
                      assert data == git('cat-file', 'blob', oid), path
                  files[path] = {'git_mode': mode, 'oid': oid, 'sha256': digest(data), 'bytes': len(data),
                                 'physical_mode': format(stat.S_IMODE(info.st_mode), '04o'), 'type': kind}
              for entry in BIND['source_inputs']:
                  wanted = mutant['sha256'] if mutant is not None and entry['path'] == mutant['path'] else entry['sha256']
                  assert files[entry['path']]['sha256'] == wanted
                  assert files[entry['path']]['git_mode'] == entry['git_mode']
              return stage, files


          def snapshot(phase, label):
              state = 'positive' if phase in ['gates', 'cleanup'] else BIND['phases'][phase]['state']
              stage, files = source_records(state)
              prefix = phase + '.' + label
              (OUT / (prefix + '.stage.nul')).write_bytes(stage)
              framework = {}
              versions = {}
              for package in FRAMEWORK:
                  base = ROOT / 'node_modules' / package
                  assert base.is_dir() and not base.is_symlink(), package
                  metadata = base / 'package.json'
                  if metadata.is_file():
                      value = json.loads(metadata.read_text())
                      versions[package] = {'name': value['name'], 'version': value['version'],
                                           'package_json_sha256': digest(metadata.read_bytes())}
                  for p in sorted(base.rglob('*')):
                      info = p.lstat()
                      if p.is_symlink():
                          raw_link = os.readlink(p)
                          target = p.resolve(strict=True)
                          assert target.is_relative_to(ROOT) and target != ROOT, str(p)
                          target_info = target.stat()
                          assert stat.S_ISREG(target_info.st_mode), str(p)
                          data = target.read_bytes()
                          target_hash = digest(data)
                          retained = OUT / 'framework-symlink-target-bytes' / target_hash
                          retained.parent.mkdir(exist_ok=True)
                          if retained.exists():
                              assert retained.read_bytes() == data
                          else:
                              retained.write_bytes(data)
                          framework[str(p.relative_to(ROOT))] = {
                              'type': 'symlink', 'lstat_mode': format(stat.S_IMODE(info.st_mode), '04o'),
                              'raw_link_text': raw_link, 'raw_link_sha256': digest(os.fsencode(raw_link)),
                              'resolved_root_relative_path': str(target.relative_to(ROOT)),
                              'target_bytes': len(data), 'target_sha256': target_hash,
                              'target_mode': format(stat.S_IMODE(target_info.st_mode), '04o'),
                              'target_byte_copy': str(retained.relative_to(OUT))}
                      elif p.is_file():
                          assert p.resolve().is_relative_to(ROOT)
                          data = p.read_bytes()
                          framework[str(p.relative_to(ROOT))] = {
                              'sha256': digest(data), 'bytes': len(data), 'type': 'regular',
                              'mode': format(stat.S_IMODE(info.st_mode), '04o')}
              matcher = BIND['expected_framework_matcher']
              assert versions['expect']['version'] == matcher['version']
              assert framework[matcher['path']]['sha256'] == matcher['sha256']
              index = Path(git('rev-parse', '--git-path', 'index').decode().strip())
              if not index.is_absolute():
                  index = ROOT / index
              raw_index = index.read_bytes()
              (OUT / (prefix + '.index')).write_bytes(raw_index)
              save(prefix + '.json', {'head': SOURCE, 'tree': BIND['tree'], 'stage_sha256': digest(stage),
                                    'physical_index_sha256': digest(raw_index), 'source': files,
                                    'framework': framework, 'framework_versions': versions})
              if label == 'before':
                  with tarfile.open(OUT / (phase + '.bound-source.tar'), 'w') as archive:
                      for entry in BIND['source_inputs']:
                          archive.add(ROOT / entry['path'], arcname=entry['path'], recursive=False)


          def prepare(phase):
              wanted = 'positive' if phase == 'cleanup' else BIND['phases'][phase]['state']
              current = []
              for state in ['positive', 'caller', 'consumer']:
                  try:
                      source_records(state)
                      current.append(state)
                  except AssertionError:
                      pass
              if len(current) != 1:
                  (OUT / (phase + '.unrecognized-source.diff')).write_bytes(git('diff', '--binary'))
                  (OUT / (phase + '.unrecognized-stage.diff')).write_bytes(git('diff', '--cached', '--binary'))
                  (OUT / (phase + '.unrecognized-stage.nul')).write_bytes(git('ls-files', '--stage', '-z'))
                  (OUT / (phase + '.unrecognized-status.nul')).write_bytes(git('status', '--porcelain=v1', '-z'))
                  raise AssertionError('source does not match one exact recognized state; no files restored')
              previous = current[0]
              if previous != 'positive':
                  path = BIND['mutants'][previous]['path']
                  raw = (ROOT / path).read_bytes()
                  (OUT / (phase + '.restored-from-' + previous + '.bytes')).write_bytes(raw)
                  (ROOT / path).write_bytes(git('show', SOURCE + ':' + path))
              source_records('positive')
              if wanted != 'positive':
                  mutant = BIND['mutants'][wanted]
                  patch = OUT / mutant['patch']
                  assert digest(patch.read_bytes()) == mutant['patch_sha256']
                  subprocess.run(['git', 'apply', '--check', str(patch)], cwd=ROOT, check=True)
                  subprocess.run(['git', 'apply', str(patch)], cwd=ROOT, check=True)
              source_records(wanted)
              save(phase + '.transition.json', {'previous': previous, 'state': wanted, 'exact_source_verified': True})


          def bookends(phase):
              before = json.loads((OUT / (phase + '.before.json')).read_text())
              after = json.loads((OUT / (phase + '.after.json')).read_text())
              baseline = json.loads((OUT / 'gates.before.json').read_text())
              for key in ['head', 'tree', 'stage_sha256', 'source', 'framework', 'framework_versions']:
                  assert before[key] == after[key], (phase, key)
              for key in ['head', 'tree', 'stage_sha256', 'framework', 'framework_versions']:
                  assert before[key] == baseline[key], (phase, key)
              differences = [path for path in baseline['source'] if baseline['source'][path] != before['source'][path]]
              state = 'positive' if phase in ['gates', 'cleanup'] else BIND['phases'][phase]['state']
              wanted = [] if state == 'positive' else [BIND['mutants'][state]['path']]
              assert differences == wanted
              save(phase + '.bookends.json', {'exact_phase_source_and_framework_equal': True,
                   'source_difference_from_positive': differences,
                   'raw_index_equal': before['physical_index_sha256'] == after['physical_index_sha256'],
                   'raw_index_matches_initial': before['physical_index_sha256'] == baseline['physical_index_sha256'],
                   'raw_index_policy': 'Complete raw bytes retained separately from exact textual stage and physical source maps.'})


          def prerequisites():
              gates = ['install', 'format', 'lint', 'types']
              values = {name: {'exit': (OUT / (name + '.exit')).read_text().strip(),
                               'tee': (OUT / (name + '.tee.exit')).read_text().strip()}
                        for name in gates if (OUT / (name + '.exit')).exists()}
              save('prerequisite-exits.json', values)
              assert len(values) == len(gates) and all(v == {'exit': '0', 'tee': '0'} for v in values.values())
              bookends('gates')


          def check_failure(record, target):
              row = record['assertion']
              assert row['numPassingAsserts'] == target['numPassingAsserts']
              assert len(row['failureDetails']) == 1 and len(row['failureMessages']) == 1
              result = row['failureDetails'][0]['matcherResult']
              assert result['pass'] is False and isinstance(result['message'], str) and result['message']
              frames = re.findall(re.escape(target['file']) + r':(\d+):(\d+)', row['failureMessages'][0])
              first = target['first_frame']
              assert frames and frames[0] == (str(first['line']), str(first['column']))
              if target['file'].endswith('EarnWithdrawReview.test.tsx'):
                  assert set(result) == {'message', 'pass'}
                  message = re.sub(r'\x1b\[[0-9;]*m', '', result['message'])
                  for token in target['matcherResult']['message_required_tokens']:
                      assert token in message, token
                  expected = [line[len('Expected: '):] for line in message.splitlines() if line.startswith('Expected: ')]
                  received = [line[len('Received: '):] for line in message.splitlines() if line.startswith('Received: ')]
                  assert len(expected) == 1 and json.loads(expected[0]) == target['expected_navigation_argument']
                  assert len(received) == 1 and json.loads(received[0]) == target['omitted_caller_actual_argument']
                  assert message.splitlines().count('Number of calls: 1') == 1
              else:
                  assert result['name'] == 'toEqual' and result['actual'] == []
                  assert result['expected'] == [['raw_earn_withdraw_failed', 'status_screen']]


          def classify(phase):
              prerequisites()
              bookends(phase)
              arm = BIND['phases'][phase]
              x = json.loads((OUT / (phase + '.jest.json')).read_text())
              rows = []
              for suite in x['testResults']:
                  path = str(Path(suite['name']).relative_to(ROOT))
                  for ordinal, row in enumerate(suite['assertionResults']):
                      rows.append({'file': path, 'ordinal': ordinal, 'assertion': row})
              save(phase + '.inventory.json', rows)
              assert {str(Path(s['name']).relative_to(ROOT)) for s in x['testResults']} == set(arm['tests'])
              assert len(x['testResults']) == 3 and x['numTotalTestSuites'] == 3
              assert x['numRuntimeErrorTestSuites'] == 0 and x['wasInterrupted'] is False
              assert x['numPendingTests'] == 0 and x['numTodoTests'] == 0
              assert x['numTotalTests'] == arm['total'] and len(rows) == arm['total']
              assert x['numFailedTests'] == arm['failed'] and x['numPassedTests'] == arm['passed']
              assert x['success'] is (arm['failed'] == 0)
              failed_files = {t['file'] for t in arm['targets']}
              assert x['numFailedTestSuites'] == len(failed_files)
              assert x['numPassedTestSuites'] == 3 - len(failed_files)
              if arm['expected_names'] is not None:
                  for path, names in BIND['expected_names'].items():
                      assert [r['assertion']['fullName'] for r in rows if r['file'] == path] == names
                  integration = [r['assertion'] for r in rows if r['file'] == arm['tests'][0]]
                  assert len(integration) == 8
                  assert sum(a['numPassingAsserts'] for a in integration) == arm['integration_passing_assertions']
                  for case, row in zip(BIND['new_suite_cases'], integration):
                      wanted = 13 if row['status'] == 'failed' else case['authored_assertion_count']
                      assert row['numPassingAsserts'] == wanted
              else:
                  for path, count in arm['expected_per_suite'].items():
                      assert len([r for r in rows if r['file'] == path]) == count
              observed_failures = []
              for record in rows:
                  row = record['assertion']
                  assert row['invocations'] == 1 and row['retryReasons'] == []
                  target = [t for t in arm['targets'] if (t['file'], t['fullName']) == (record['file'], row['fullName'])]
                  if target:
                      assert len(target) == 1 and row['status'] == 'failed'
                      check_failure(record, target[0])
                      observed_failures.append((record['file'], row['fullName']))
                  else:
                      assert row['status'] == 'passed' and not row['failureMessages'] and not row['failureDetails']
              assert len(observed_failures) == arm['failed']
              assert (OUT / (phase + '.jest.exit')).read_text().strip() == str(arm['natural_exit'])
              assert (OUT / (phase + '.jest.tee.exit')).read_text().strip() == '0'
              save(phase + '.classification.json', {'status': 'EXACT_EXPECTED_SCOPED_RESULT', 'source': SOURCE,
                   'phase': phase, 'cases': len(rows), 'passed': arm['passed'], 'failed': arm['failed'],
                   'no_whole_head_acceptance': True})


          def final():
              try:
                  prerequisites()
              except (AssertionError, FileNotFoundError):
                  save('classification.json', {'status': 'UNRUN_RUNTIME_PREREQUISITE', 'source': SOURCE,
                       'no_whole_head_acceptance': True})
                  raise
              baseline = json.loads((OUT / 'gates.before.json').read_text())
              restored = json.loads((OUT / 'cleanup.after.json').read_text())
              for key in ['head', 'tree', 'stage_sha256', 'source', 'framework', 'framework_versions']:
                  assert restored[key] == baseline[key], ('final restoration', key)
              for name in ['prepare.cleanup', 'snapshot.cleanup.after']:
                  assert (OUT / (name + '.exit')).read_text().strip() == '0'
                  assert (OUT / (name + '.tee.exit')).read_text().strip() == '0'
              save('final-restoration.json', {'complete_source_stage_framework_equal': True,
                   'raw_index_equal': restored['physical_index_sha256'] == baseline['physical_index_sha256']})
              count = 0
              for phase, arm in BIND['phases'].items():
                  value = json.loads((OUT / (phase + '.classification.json')).read_text())
                  assert value['status'] == 'EXACT_EXPECTED_SCOPED_RESULT'
                  count += value['cases']
              assert count == 357
              source_records('positive')
              save('classification.json', {'status': 'EXACT_SCOPED_POSITIVE_SENSITIVITY_RESTORATION',
                   'source': SOURCE, 'actual_method_records': count, 'normal_positive': 78,
                   'caller_omission': {'passed': 76, 'failed': 2}, 'consumer_omission': {'passed': 77, 'failed': 1},
                   'restored': 78, 'shared_compatibility': 45, 'whole_head_coverage_platform_review_merge': 'PENDING'})


          def seal():
              files = []
              for p in sorted(OUT.rglob('*')):
                  if p.is_file() and p.name != 'hashes.json':
                      assert not p.is_symlink()
                      files.append({'path': str(p.relative_to(OUT)), 'bytes': p.stat().st_size,
                                    'sha256': digest(p.read_bytes()), 'type': 'regular',
                                    'mode': format(stat.S_IMODE(p.stat().st_mode), '04o')})
              save('hashes.json', files)


          try:
              command = sys.argv[1]
              if command == 'snapshot':
                  snapshot(sys.argv[2], sys.argv[3])
              elif command == 'prepare':
                  prepare(sys.argv[2])
              elif command == 'prerequisites':
                  prerequisites()
              elif command == 'classify':
                  classify(sys.argv[2])
              elif command == 'final':
                  final()
              elif command == 'seal':
                  seal()
              else:
                  raise SystemExit('unknown operation')
          except Exception as error:
              save('.'.join(sys.argv[1:]) + '.refusal.json', {'status': 'NOT_ACCEPTED',
                   'error_type': type(error).__name__, 'detail': str(error)})
              raise
          PY
          cat > "$proof/record.sh" <<'SH'
          record() {
            local name="$1"
            shift
            printf '%s\0' "$@" > "$PROOF_DIR/$name.argv.nul"
            set +e
            "$@" 2>&1 | tee "$PROOF_DIR/$name.log"
            local codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${codes[0]}" > "$PROOF_DIR/$name.exit"
            printf '%s\n' "${codes[1]}" > "$PROOF_DIR/$name.tee.exit"
            if test "${codes[1]}" -ne 0; then
              return "${codes[1]}"
            fi
            return "${codes[0]}"
          }
          SH
          cat > "$proof/bindings.json" <<'JSON'
          {
            "schema": 2,
            "ready": true,
            "source": "135949ab445af8553daf89917f27db0b3b4a338c",
            "tree": "35eee92233fc6b65228fba3e595b5708e76dafcd",
            "parent": "ac1fffca303cc91f0d7e109678496ef5bc81bce7",
            "branch": "ci/1616-earn-first-query-positive",
            "workflow_path": ".github/workflows/ci-1616-earn-first-query-positive.yml",
            "source_inputs": [
              {
                "path": "AGENTS.md",
                "sha256": "603055343b022dd9fc1872d78bdf73e8ee8aceff93185da196daa3c59aecb155",
                "bytes": 16945,
                "git_mode": "100644"
              },
              {
                "path": "skills/miden-wallet-frontend/SKILL.md",
                "sha256": "a8d8ba4229f01d08ed05d78304bedf6eda25d469db3fd7512954b6f278674b6a",
                "bytes": 3652,
                "git_mode": "100644"
              },
              {
                "path": "src/screens/earn-flow/EarnWithdrawReview.tsx",
                "sha256": "3ed74d1b2928d40541975c7cd324e7daed693893248dca6d16fd2aa74947dfde",
                "bytes": 14339,
                "git_mode": "100644"
              },
              {
                "path": "src/screens/earn-flow/EarnWithdrawReview.test.tsx",
                "sha256": "bf635515ddeb916e17e1cf7893b8d8eeb09cb8ab4d84aac1a2c33cf28480569c",
                "bytes": 41286,
                "git_mode": "100644"
              },
              {
                "path": "src/screens/earn-flow/EarnWithdrawStatus.tsx",
                "sha256": "26d6d18d13fe685b8a2132864a49b9f171b844bcca7a49884a8fecaabab933eb",
                "bytes": 8608,
                "git_mode": "100644"
              },
              {
                "path": "src/screens/earn-flow/EarnWithdrawStatus.test.tsx",
                "sha256": "66f99082c6be7d97aa15e019c9c633b5c91bcce0a7f003b61e37ac3d7cbddd56",
                "bytes": 19580,
                "git_mode": "100644"
              },
              {
                "path": "src/lib/epoch/earn-withdraw.ts",
                "sha256": "7f094500af41ae0e8750486713bb8257ded9ab2c0a3442105aeab46f7b05738b",
                "bytes": 43543,
                "git_mode": "100644"
              },
              {
                "path": "src/lib/epoch/earn-withdraw.test.ts",
                "sha256": "9edcf4d95cd3294fabde428afc4372544ada74775462634d96420408231c6bb1",
                "bytes": 86387,
                "git_mode": "100644"
              },
              {
                "path": "src/screens/generating-transaction/useTransactionRow.ts",
                "sha256": "652d94fed29bec87fa61067cc74c1612fd6be435e3dca591b6711d3b7d69f802",

              },
              {
                "path": "src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.usdcx.test.tsx",
                "sha256": "ff91f9b0185da4363ed57e7820df33cb0788587c567d86c11863aa2d364a00e8",
                "bytes": 94777,
                "git_mode": "100644"
              },
              {
                "path": "jest.config.ts",
                "sha256": "73a3951b600a8514cbe91fa7e1be098cc3ae0948c470f2649e8686b192e559a6",
                "bytes": 10839,
                "git_mode": "100644"
              },

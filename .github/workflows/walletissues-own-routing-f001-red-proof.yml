          root = pathlib.Path(sys.argv[1])
          assert root.is_absolute() and root.is_dir() and not root.is_symlink()
          for name, spec in payloads.items():
              relative = pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              data = gzip.decompress(base64.b64decode(spec['gzip_base64'], validate=True))
              assert len(data) == spec['size'] and hashlib.sha256(data).hexdigest() == spec['sha256'], name
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
              assert not path.exists()
              path.write_bytes(data)
              path.chmod(spec['mode'])
          bindings = {name: {key: spec[key] for key in ('sha256', 'size', 'mode')}
                      for name, spec in payloads.items()}
          (root / 'source-bindings.json').write_text(json.dumps(bindings, indent=2) + '\n')
          before = {name: {'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest(),
                           'size': (root / name).stat().st_size,
                           'mode': (root / name).stat().st_mode & 0o777} for name in bindings}
          assert before == bindings
          (root / 'before.json').write_text(json.dumps(before, indent=2) + '\n')
          contract = json.loads((root / 'contract.json').read_text())
          (root / 'command.json').write_text(json.dumps(contract['argv']) + '\n')
          (root / 'transport.json').write_text(json.dumps({
              'source_commit': contract['source_commit'], 'source_tree': contract['source_tree'],
              'source_parent': contract['source_parent'],
              'transport_sha': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'job': os.environ['GITHUB_JOB'], 'runner_os': os.environ['RUNNER_OS'],
              'python_version': platform.python_version(), 'executable': sys.executable,
              'version': sys.version, 'materialized_payloads': len(bindings)
          }, indent=2) + '\n')
          MATERIALIZE
          python3 --version > "$PROOF_DIR/runtime.txt" 2>&1
      - name: Run all 67 unittest methods and retain the expected natural red
        id: tests
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          cd "$PROOF_DIR/source"
          set +e
          python3 -B -m unittest -v test_discover 2>&1 | tee "$PROOF_DIR/unittest.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$PROOF_DIR/unittest.exit"
          printf '%s\n' "${statuses[1]}" > "$PROOF_DIR/unittest.tee.exit"
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          exit "${statuses[0]}"
      - name: Always validate unchanged source and exact raw red records
        if: ${{ always() && steps.source.outcome == 'success' }}
        id: verify
        run: |
          set -euo pipefail
          set +e
          python3 -B "$PROOF_DIR/verify-results.py" "$PROOF_DIR" 2>&1 | tee "$PROOF_DIR/verification.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$PROOF_DIR/verification.exit"
          printf '%s\n' "${statuses[1]}" > "$PROOF_DIR/verification.tee.exit"
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          exit "${statuses[0]}"
      - name: Always upload scoped raw red evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: walletissues-own-routing-f001-red
          path: ${{ env.PROOF_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

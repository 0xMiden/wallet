name: dApp send and consume result cap regression
on:
  push:
    branches: [ci/1948-result-cap-origin-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: test "$(git rev-parse HEAD^)" = ed90e27c8492073f35944c285ecec42329467eea
      - run: yarn install --frozen-lockfile --network-timeout 120000
        timeout-minutes: 6
      - name: Prove both dApp result cases exceed the bound
        shell: bash
        run: |
          mkdir -p proof
          set +e
          yarn jest --runTestsByPath src/lib/miden/transaction/result-size-limit.test.ts --testNamePattern='bounds a dApp-owned' --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
          status=${PIPESTATUS[0]}
          test "$status" -ne 0 || exit 1
          node -e "const x=require('./proof/results.json'); const a=x.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status!=='pending'); if(a.length!==2 || a.some(t=>t.status!=='failed' || !t.failureMessages.join(' ').includes('toBe'))) process.exit(1); console.log('Expected red: send and consume results are unbounded')"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dapp-result-origin-red, path: proof/ }

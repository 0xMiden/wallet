name: NEVER-MERGE PR1638 round-trip minimum positive and sensitivity proof

on:
  push:
    branches: [ci/pr1638-roundtrip-minimum-positive]

permissions:
  contents: read

jobs:
  roundtrip-minimum-positive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PROOF_HEAD: ${{ github.sha }}
      PROOF_REF: ${{ github.ref }}
      PROOF_RUN: ${{ github.run_id }}
      PROOF_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout exact isolated transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind signed source lineage and initialize complete raw evidence
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="$RUNNER_TEMP/pr1638-roundtrip-minimum-positive-proof"
          printf 'PROOF_DIR=%s\n' "$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir "$PROOF_DIR"
          test "$(git rev-parse HEAD)" = "$PROOF_HEAD"
          test "$PROOF_REF" = refs/heads/ci/pr1638-roundtrip-minimum-positive
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = 202047e6f2f06fafe61e35f472d90a4504c1f911
          test "$(git rev-parse 202047e6f2f06fafe61e35f472d90a4504c1f911^{tree})" = 66ba0f239cd94128c8e6d2bc10113c1a35416e6f
          test "$(git rev-parse 202047e6f2f06fafe61e35f472d90a4504c1f911^)" = 27a23941b2153a1c9d97d92761381ab073159245
          test "$(git rev-parse 27a23941b2153a1c9d97d92761381ab073159245^)" = 0778dd8bb219b0e70b31fc175af7199ed3bbd6bf
          test "$(git rev-parse 0778dd8bb219b0e70b31fc175af7199ed3bbd6bf^1)" = c005160e1c53d7a983277f84a535b80467f3188c
          test "$(git rev-parse 0778dd8bb219b0e70b31fc175af7199ed3bbd6bf^2)" = 4c696a37bd487c02b2d20c3748f5050eee3c3a60
          test "$(git rev-parse c005160e1c53d7a983277f84a535b80467f3188c^)" = 57a324980b06d105d5e6a53e1a50ecfca451623d
          test "$(git rev-parse 57a324980b06d105d5e6a53e1a50ecfca451623d^)" = ea3c26ede409335ecca02ba15ae6e9ec64305827
          test "$(git rev-parse ea3c26ede409335ecca02ba15ae6e9ec64305827^1)" = a047062821659016e4ffde48f1e767f939c36417
          test "$(git rev-parse ea3c26ede409335ecca02ba15ae6e9ec64305827^2)" = e60c38fae58bcef13f0c4c814956512ab042a7ce
          git cat-file commit 202047e6f2f06fafe61e35f472d90a4504c1f911 > "$PROOF_DIR/source-commit.txt"
          git cat-file commit 27a23941b2153a1c9d97d92761381ab073159245 > "$PROOF_DIR/product-fix-commit.txt"
          git cat-file commit 0778dd8bb219b0e70b31fc175af7199ed3bbd6bf > "$PROOF_DIR/current-main-merge-commit.txt"
          git cat-file commit c005160e1c53d7a983277f84a535b80467f3188c > "$PROOF_DIR/causal-test-commit.txt"
          git cat-file commit 57a324980b06d105d5e6a53e1a50ecfca451623d > "$PROOF_DIR/original-test-commit.txt"
          git cat-file commit ea3c26ede409335ecca02ba15ae6e9ec64305827 > "$PROOF_DIR/original-main-merge-commit.txt"
          git cat-file commit a047062821659016e4ffde48f1e767f939c36417 > "$PROOF_DIR/member-commit.txt"
          git cat-file commit 4c696a37bd487c02b2d20c3748f5050eee3c3a60 > "$PROOF_DIR/current-main-commit.txt"
          git cat-file commit e60c38fae58bcef13f0c4c814956512ab042a7ce > "$PROOF_DIR/causal-main-commit.txt"
          git cat-file commit HEAD > "$PROOF_DIR/checkout-commit.txt"
          git ls-tree --full-tree -r 202047e6f2f06fafe61e35f472d90a4504c1f911 > "$PROOF_DIR/source-tree.txt"
          git ls-tree --full-tree -r HEAD > "$PROOF_DIR/checkout-tree.txt"
          git diff --name-status 202047e6f2f06fafe61e35f472d90a4504c1f911 HEAD > "$PROOF_DIR/workflow-only.names"
          printf 'A\t.github/workflows/pr1638-roundtrip-minimum-positive-proof.yml\n' > "$PROOF_DIR/expected-workflow-only.names"
          cmp "$PROOF_DIR/workflow-only.names" "$PROOF_DIR/expected-workflow-only.names"
          git diff --binary --full-index --no-color --no-ext-diff --no-textconv --no-renames --diff-algorithm=myers 202047e6f2f06fafe61e35f472d90a4504c1f911 HEAD > "$PROOF_DIR/workflow-only.diff"
          git diff --binary --full-index --no-color --no-ext-diff --no-textconv --no-renames --diff-algorithm=myers 0778dd8bb219b0e70b31fc175af7199ed3bbd6bf 202047e6f2f06fafe61e35f472d90a4504c1f911 > "$PROOF_DIR/fix.diff"
          printf '%s\n' '905e3e0575402e1d0bee4f3fb3e4a400c0890b227e65b58befdc7510763235e5  '"$PROOF_DIR/fix.diff" | sha256sum --check
          printf '%s\n' "$PROOF_HEAD" "$PROOF_REF" "$PROOF_RUN" "$PROOF_ATTEMPT" > "$PROOF_DIR/run-identity.txt"
          cat > "$PROOF_DIR/expected-source-sha256.txt" <<'SOURCE_HASHES'
          02cbcbd2135d5848e6339315f2fb87f6fcc59363134f2bf74af2e0959efba3cf  playwright/e2e/helpers/usdcx-roundtrip-funding.test.ts
          67871141006f7e06c25a6629942f165c890eb359fa8a5a35042c560d630ef991  playwright/e2e/helpers/usdcx-roundtrip-funding.ts
          402268f0ff28d67dc09bfc138a7aa8b598216df1267443c4a70ce6c2ddda8e1e  playwright/e2e/helpers/public-faucet.ts
          9f060055d0f13aae74eecb993a6b0a2a083098d2979b7420fdabe12316d2e086  src/lib/miden-chain/faucet-protocol.ts

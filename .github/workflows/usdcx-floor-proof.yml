name: USDCx burn-floor candidate proof

on:
  push:
    branches: [ci/1615-floor-proof]

permissions:
  contents: read

jobs:
  floor-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PROOF_HEAD_SHA: ${{ github.sha }}
      PROOF_REF: ${{ github.ref }}
      PROOF_EVENT: ${{ github.event_name }}
      PROOF_REPOSITORY: ${{ github.repository }}
      PROOF_WORKFLOW_REF: ${{ github.workflow_ref }}
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_RUN_ID: ${{ github.run_id }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Initialize proof evidence
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="$RUNNER_TEMP/usdcx-floor-proof"
          printf 'PROOF_DIR=%s\n' "$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          keys = ['HEAD_SHA', 'REF', 'EVENT', 'REPOSITORY', 'WORKFLOW_REF', 'WORKFLOW_SHA', 'RUN_ID', 'RUN_ATTEMPT']
          identity = {key: os.environ['PROOF_' + key] for key in keys}
          (Path(os.environ['PROOF_DIR']) / 'run-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PYTHON

      - name: Checkout exact proof head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout to the reviewed source and sole workflow addition
        id: source
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTHON' 2>&1 | tee "$PROOF_DIR/source-validation.log"
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          proof = Path(os.environ['PROOF_DIR'])
          source = '44071b792f171e977b691656910a272dbee0b5ce'
          expected_tree = '92aae17c2834a82dae431a846a7a48e0204e77ac'
          tests = {'playwright/e2e/helpers/arc-usdcx.test.ts': {'sha256': '141c60b49e5c3e8588b6912d78ce152d7e72e71403358d9db85e23b0d8ec9800',
                                                        'test_count': 108,
                                                        'test_names_sha256': '14ba205d287e09d0cc2eaf9ec0abdb9b1ff056a2246a2644d5d85cc3f09f21bd'},
           'playwright/e2e/helpers/usdcx-config.test.ts': {'sha256': 'ce71df525f2252a2faa366df42030ae6213560405f260bbcaa810a080cdfefab',
                                                           'test_count': 6,
                                                           'test_names_sha256': '7ddbc119b953f4d74110a5c5d40d14cd77a19071a7ea00cc21dbf7d909354d74'},
           'src/lib/usdcx/burn.test.ts': {'sha256': 'b2ff561f38ad057528bbf547be62eb19df60d37b411648ec979f80008500c2ab',
                                          'test_count': 8,
                                          'test_names_sha256': 'b91aef4b30839615a39c5034533eb855dae025e87ab53d0373b27b61fa9591a0'},
           'src/lib/usdcx/constant.test.ts': {'sha256': 'd49b16304e6347d29c936989135fbfd4562758906c5badbd22a10a7c0b2db179',
                                              'test_count': 9,
                                              'test_names_sha256': '501a62ad3de8b98637a3afea93607b759a73a5a88953ca5a5104d712ae03addd'},
           'src/lib/usdcx/use-burn-minimum.test.ts': {'sha256': '041c2c7635e8ccb8de5dd2efb25ea4dc3d8ccc04a80c6d5fd0b926f301f4944f',
                                                      'test_count': 3,
                                                      'test_names_sha256': '9fc3ccadb9cb5ef4a11440d9fe4247064bf2d64d35573a868bf42d871eda69f6'},
           'src/lib/usdcx/withdrawal.test.ts': {'sha256': 'e72a3ac6cb4a15db37fc8d101b4ea710f28a11caebd3231a1bbfb2376c79f0a8',
                                                'test_count': 16,
                                                'test_names_sha256': '064c208a19790aad83835cfe35bb827a56768a85f3ad147c72206e95d0efcc99'},
           'src/screens/send-flow/ReviewTransaction.test.tsx': {'sha256': 'c71b847134a6723bbe93e884340480cf59efb348a787925ab6526cde178eaaae',
                                                                'test_count': 103,
                                                                'test_names_sha256': 'af2cd1d4c8e14c4a61cea0c9dfbc52cd9cd3a552978d95ccb23d918d30b3a25c'}}
          provenance = {'wallet1615-f1-f2-source-fix/normal-review/controller-acceptance.json': 'e6ce7b15211f9011be95d47f01aa7155e4020b3ced74110c3d45dc490f9aec13',
           'wallet1615-f1-f2-source-fix/normal-review/report.md': '83d30e552ef0c6ece4175ec759807d56f84e430d6febae5bc87859eb697c96e5',
           'wallet1615-f1-f2-source-fix/remaining-ci-predictions.json': 'b83a24715da988d067c42e2172d919d2d281f26138d15376abc9ea3a5d3b33bb',
           'wallet1615-f1-f2-source-fix/report.md': 'd45ad12143194daaf546b4728342ee14d6c1201c95d9d9b9163486fbb6de1cef',
           'wallet1615-f2-regressions/ci-transport/context-fix/controller-acceptance.json': 'caa89481684584f6b63e640cf114854cd9e33d790a8912085aef1ad4d6503c38'}
          workflow = '.github/workflows/usdcx-floor-proof.yml'

          def git(*args):
              return subprocess.check_output(['git', *args])

          def value(*args):
              return git(*args).decode().strip()

          def tree(ref):
              entries = {}
              for record in git('ls-tree', '-r', '-z', ref).split(b'\0'):
                  if record:
                      metadata, name = record.split(b'\t', 1)
                      entries[name.decode()] = metadata.decode().split()
              return entries

          head = value('rev-parse', 'HEAD')
          source_tree = value('rev-parse', source + '^{tree}')
          before, after = tree(source), tree(head)
          manifest = {
              'expected_source_commit': source,
              'expected_source_tree': expected_tree,
              'source_commit': value('rev-parse', source),
              'source_tree': source_tree,
              'checkout_commit': head,
              'checkout_tree': value('rev-parse', 'HEAD^{tree}'),
              'source_entries': len(before),
              'delta': value('diff', '--name-status', source, 'HEAD'),
              'expected_tests': tests,
              'checkout_test_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in tests},
              'review_provenance_sha256': provenance,
              'accepted_red_before_run': 39359602500,
              'workflow_blob': after.get(workflow),
              'workflow_sha256': hashlib.sha256(Path(workflow).read_bytes()).hexdigest()
          }
          (proof / 'source-and-checkout.json').write_text(json.dumps(manifest, indent=2) + '\n')
          for label, ref in [('source', source), ('checkout', head)]:
              (proof / (label + '-commit.txt')).write_bytes(git('cat-file', 'commit', ref))
              (proof / (label + '-tree.txt')).write_bytes(git('ls-tree', '-r', ref))
          (proof / 'workflow-only.diff').write_bytes(git('diff', '--binary', source, 'HEAD', '--', workflow))

          assert head == os.environ['PROOF_HEAD_SHA'] == os.environ['PROOF_WORKFLOW_SHA'], 'Checkout/event/workflow head mismatch'
          assert os.environ['PROOF_EVENT'] == 'push', 'Push event required'
          assert os.environ['PROOF_REF'] == 'refs/heads/ci/1615-floor-proof', 'Disposable branch required'
          expected_ref = os.environ['PROOF_REPOSITORY'] + '/' + workflow + '@' + os.environ['PROOF_REF']
          assert os.environ['PROOF_WORKFLOW_REF'] == expected_ref, 'Workflow ref mismatch'
          assert all(os.environ['PROOF_' + key].isdigit() for key in ['RUN_ID', 'RUN_ATTEMPT']), 'Run identity missing'
          assert source_tree == expected_tree, 'Reviewed source tree mismatch'
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, head], check=True)
          assert len(before) == 3606 and all(after.get(name) == entry for name, entry in before.items()), 'Source entry changed'
          assert set(after) - set(before) == {workflow}, 'Expected exactly one added workflow'
          assert after[workflow][:2] == ['100644', 'blob'], 'Workflow must be a regular file'
          subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--'], check=True)
          assert not value('status', '--porcelain=v1', '--untracked-files=all'), 'Checkout is dirty'
          assert all(not Path(name).is_symlink() and manifest['checkout_test_sha256'][name] == binding['sha256'] for name, binding in tests.items()), 'Test bytes changed'
          print('Verified all 3606 source entries unchanged and exactly one regular workflow addition')
          PYTHON

      - name: Setup Node 22
        id: node
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install frozen dependencies with normal preparation hooks
        id: install
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.node.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          umask 077
          timeout 10m yarn install --frozen-lockfile --non-interactive 2>&1 | tee "$PROOF_DIR/install.log"

      - name: Recheck tracked source and all seven test files after preparation
        id: prepared
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTHON' 2>&1 | tee "$PROOF_DIR/prepared-source.log"
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest = json.loads((Path(os.environ['PROOF_DIR']) / 'source-and-checkout.json').read_text())
          subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--'], check=True)
          for name, binding in manifest['expected_tests'].items():
              assert not Path(name).is_symlink(), 'Symlink test: ' + name
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == binding['sha256'], 'Test bytes changed: ' + name
          print('Verified unchanged tracked source and all seven test files after preparation')
          PYTHON

      - name: Lint the five changed source and test files
        id: eslint
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          yarn eslint --max-warnings 0 \
            src/lib/usdcx/withdrawal.ts \
            src/lib/usdcx/withdrawal.test.ts \
            src/screens/send-flow/ReviewTransaction.tsx \
            src/screens/send-flow/ReviewTransaction.test.tsx \
            playwright/e2e/helpers/usdcx-config.test.ts \
            2>&1 | tee "$PROOF_DIR/eslint.log"

      - name: Check project TypeScript without emitting
        id: typescript
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          yarn tsc --noEmit --pretty false 2>&1 | tee "$PROOF_DIR/typescript.log"

      - name: Run all seven focused suites with natural exit status
        id: jest
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          yarn jest --runTestsByPath \
            src/lib/usdcx/withdrawal.test.ts \
            src/lib/usdcx/constant.test.ts \
            src/lib/usdcx/use-burn-minimum.test.ts \
            src/lib/usdcx/burn.test.ts \
            src/screens/send-flow/ReviewTransaction.test.tsx \
            playwright/e2e/helpers/usdcx-config.test.ts \
            playwright/e2e/helpers/arc-usdcx.test.ts \
            --maxWorkers=2 --coverage=false --json --outputFile="$PROOF_DIR/jest.json" \
            2>&1 | tee "$PROOF_DIR/jest.log"

      - name: Record independent outcomes and require complete evidence
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PREPARED_SOURCE_OUTCOME: ${{ steps.prepared.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          JEST_OUTCOME: ${{ steps.jest.outcome }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PROOF_DIR"
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          proof = Path(os.environ['PROOF_DIR'])
          outcomes = {key: value for key, value in os.environ.items() if key.endswith('_OUTCOME')}
          (proof / 'step-outcomes.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          required = ['run-identity.json', 'source-and-checkout.json', 'source-commit.txt', 'checkout-commit.txt',
                      'source-tree.txt', 'checkout-tree.txt', 'workflow-only.diff', 'source-validation.log',
                      'install.log', 'prepared-source.log', 'eslint.log', 'typescript.log', 'jest.log', 'jest.json']
          missing = [name for name in required if not (proof / name).is_file() or not (proof / name).stat().st_size]
          (proof / 'evidence-completeness.json').write_text(json.dumps({'missing_or_empty': missing}, indent=2) + '\n')
          assert not missing, 'Missing or empty proof evidence: ' + ', '.join(missing)
          manifest = json.loads((proof / 'source-and-checkout.json').read_text())
          expected = manifest['expected_tests']
          result = json.loads((proof / 'jest.json').read_text())
          actual = {}
          for suite in result['testResults']:
              name = Path(suite['name']).relative_to(Path.cwd()).as_posix()
              assert name not in actual, 'Duplicate test suite: ' + name
              names = sorted(case['fullName'] for case in suite['assertionResults'])
              names_json = json.dumps(names, ensure_ascii=False, separators=(',', ':')).encode()
              actual[name] = {
                  'test_count': len(names),
                  'test_names_sha256': hashlib.sha256(names_json).hexdigest(),
                  'all_passed': suite['status'] == 'passed' and all(case['status'] == 'passed' and not case['failureMessages'] for case in suite['assertionResults'])
              }
          summary_keys = ['numTotalTestSuites', 'numPassedTestSuites', 'numFailedTestSuites', 'numPendingTestSuites',
                          'numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests', 'numTodoTests',
                          'numRuntimeErrorTestSuites', 'success', 'wasInterrupted']
          validation = {'summary': {key: result[key] for key in summary_keys}, 'suites': actual}
          (proof / 'test-set-validation.json').write_text(json.dumps(validation, indent=2) + '\n')
          assert set(actual) == set(expected), 'Focused suite set changed'
          for name, binding in expected.items():
              assert actual[name]['test_count'] == binding['test_count'], 'Test count changed: ' + name
              assert actual[name]['test_names_sha256'] == binding['test_names_sha256'], 'Test identities changed: ' + name
              assert actual[name]['all_passed'], 'Failed or skipped case: ' + name
              assert not Path(name).is_symlink() and hashlib.sha256(Path(name).read_bytes()).hexdigest() == binding['sha256'], 'Post-test bytes changed: ' + name
          assert result['numTotalTestSuites'] == result['numPassedTestSuites'] == 7, 'Seven suites must pass'
          assert result['numTotalTests'] == result['numPassedTests'] == 253, 'All 253 predicted cases must pass'
          assert all(result[key] == 0 for key in ['numFailedTestSuites', 'numPendingTestSuites', 'numFailedTests', 'numPendingTests', 'numTodoTests', 'numRuntimeErrorTestSuites']), 'Failure, skip or runtime error'
          assert result['success'] is True and result['wasInterrupted'] is False, 'Interrupted or unsuccessful Jest run'
          subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--'], check=True)
          assert len(outcomes) == 8 and all(value == 'success' for value in outcomes.values()), 'Independent gate did not pass'
          print('Verified all seven suites and 253 exact predicted test identities passed; independent gates succeeded')
          PYTHON

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usdcx-floor-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_DIR }}
          if-no-files-found: error
          retention-days: 7

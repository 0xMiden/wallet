name: Restart state expected red
on:
  push:
    branches: ['ci/1961-restart-red-*']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/workflow-sha.txt
          echo 48183e475e747c4e802f89d0947821d919b4a170 | tee proof/source-sha.txt
          test "$(git rev-parse HEAD^)" = 48183e475e747c4e802f89d0947821d919b4a170
      - name: Install dependencies
        id: install
        timeout-minutes: 6
        run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Run expected failing regressions
        if: steps.install.outcome == 'success'
        run: |
          set +e
          yarn jest --runTestsByPath src/lib/store/index.test.ts --testNamePattern='post-action state refresh during backend startup' --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
          status=${PIPESTATUS[0]}
          test "$status" -ne 0
          node -e "const x=require('./proof/results.json');const a=x.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status!=='pending');if(a.length!==2 || a.some(t=>t.status!=='failed' || !t.failureMessages.join(' ').includes('Expected: 2'))) { console.error(JSON.stringify(a));process.exit(1) } console.log('Expected red: both pending snapshots changed Ready to Idle')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-state-red
          path: proof/

name: Warm E2E node-build cache

# The pr-e2e-* workflows build the local 0.16 node from source and cache it under the
# key `local-node-install-<rev>` (see .github/actions/run-local-node). A `pull_request`
# run only ever SAVES to that PR branch's cache scope, never to `next` — so every brand
# new PR's first run misses the cache, recompiles the node (~28 min), and the full
# local-e2e suite then trips its timeout before it can finish.
#
# Building + caching the node here on push to `next`/`main` populates the base-branch
# cache scope that PRs restore from, so a PR branches off a WARM cache and skips the
# cold rebuild. It only actually recompiles when the node rev (versions.env) or the
# action changes; otherwise the action restores the existing cache and this run is a
# fast no-op. Ongoing PR restore activity keeps the entry from evicting between bumps.
#
# LIMIT, while the linked-Protocol-PR pinning is in place: this job runs on `push`, and a
# push carries no PR body, so inject-linked-web-sdk-pr never runs and
# MIDEN_LINKED_PROTOCOL_REV is never set. run-local-node therefore takes its UNPINNED path
# and warms `local-node-install-<rev>-fee<fee>-rust<v>`. A PR that declares a Protocol PR
# restores `...-fee<fee>-proto<sha>-rust<v>` instead — a key this job cannot produce — so
# such a PR is cold no matter how warm the base branch is, and goes cold again on every new
# commit to the linked protocol PR (the rev is that PR's head sha). Scaffolding: it ends
# when the protocol change is released and the pinning comes out.
on:
  push:
    branches: [next, main]
    paths:
      - playwright/e2e/local-stack/versions.env
      - .github/actions/run-local-node/**
      - .github/workflows/warm-node-cache.yml
  workflow_dispatch: {}

concurrency:
  group: warm-node-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    name: warm-node-cache
    # Pure compile — it runs no specs and waits on nothing — so a bigger runner buys
    # the most time here: measured ubuntu-latest = 4 cores / 15 GB against
    # warp-ubuntu-latest-x64-8x = 8 cores / 31 GB, on a cold node build documented at
    # ~36 min against a 60 min timeout. The pr-e2e-* callers of run-local-node moved to
    # the same label afterwards; they spend most of their wall clock waiting on the
    # chain and on Playwright, so the cores buy them far less than they buy this job.
    # The label has to stay available to this repo for the workflow to be schedulable.
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      # We only want the cache side effect. The action now saves INLINE (a split
      # actions/cache restore+save, not a post step), from a step placed after node
      # bring-up, so `continue-on-error` still has to hold: bring-up is occasionally
      # flaky (a service can exit during startup) and a hard failure here would abort
      # the composite action before its save step and warm nothing.
      - name: Build + cache the local 0.16 node
        uses: ./.github/actions/run-local-node
        with:
          # this job only warms the build cache and runs no specs, so the fee is irrelevant;
          # pinned explicitly so it never silently diverges from the suites.
          verification-base-fee: '10000'
        continue-on-error: true

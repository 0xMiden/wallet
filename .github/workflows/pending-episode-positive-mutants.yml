          M3_REGRESSION_OUTCOME: ${{ steps.m3_regression.outcome }}
          M3_CONTROLS_OUTCOME: ${{ steps.m3_controls.outcome }}
          M3_SUPPORT_OUTCOME: ${{ steps.m3_support.outcome }}
          M3_RESTORE_OUTCOME: ${{ steps.m3_restore.outcome }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="${PROOF_DIR:-$RUNNER_TEMP/pending-episode-proof}"
          source "$PROOF_DIR/run-logged.bash"
          run_logged validate python3 "$PROOF_DIR/proof-tools.py" validate

      - name: Retain complete raw evidence on every result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pending-episode-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_DIR }}
          if-no-files-found: error
          retention-days: 7

name: Issue1948 frozen storage proof
on:
  push:
    branches:
      - 'ci/1948-proof-*'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/workflow-sha.txt
          echo 6fa40fcf97c24f88ae8fb7298c405fa5f5b1879c | tee proof/source-sha.txt
          test "$(git rev-parse HEAD^)" = 6fa40fcf97c24f88ae8fb7298c405fa5f5b1879c
      - name: Install frozen dependencies
        id: install
        timeout-minutes: 6
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee proof/install.log
      - name: Run functional storage regressions
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/back/actions.test.ts src/lib/miden/recovery/restore.test.ts src/lib/miden/recovery/guardian-state.test.ts --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
      - name: Report executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('proof/results.json'));const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n!==193)process.exit(1);for(const s of x.testResults)for(const a of s.assertionResults)if(a.status!=='pending')console.log(a.status+': '+a.fullName)"
      - name: Prove unchanged production statements and imports
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          git show 1d5f0b75119c84761978266baea13a7387f755a8:.github/workflows/issue1948-proof.yml >/dev/null 2>&1 || git cat-file -e 1d5f0b75119c84761978266baea13a7387f755a8^{commit}
          node .github/ci/verify-task4b-source-identity.cjs 1d5f0b75119c84761978266baea13a7387f755a8 2>&1 | tee proof/source-identity.log
      - name: Run complete Vault continuity group
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/back/vault.test.ts --testNamePattern='^Vault storage continuity' --maxWorkers=2 --json --outputFile=proof/vault-results.json 2>&1 | tee proof/vault-tests.log
          node -e "const x=require('./proof/vault-results.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n!==15||x.numFailedTests||x.numRuntimeErrorTestSuites)process.exit(1)"
      - name: Typecheck full wallet
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn tsc --noEmit 2>&1 | tee proof/types.log
      - name: Lint all changed source
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn eslint src/lib/guardian-note-recovery-progress.test.ts src/lib/guardian-note-recovery-progress.ts src/lib/intercom/in-process-request-handler.test.ts src/lib/intercom/in-process-request-handler.ts src/lib/miden/back/actions.test.ts src/lib/miden/back/actions.ts src/lib/miden/back/guardian-recovery.ts src/lib/miden/back/main.test.ts src/lib/miden/back/main.ts src/lib/miden/back/miden-client-proxy.ts src/lib/miden/back/safe-storage.test.ts src/lib/miden/back/safe-storage.ts src/lib/miden/back/vault.test.ts src/lib/miden/back/vault.ts src/lib/miden/guardian/history-storage.test.ts src/lib/miden/guardian/history-storage.ts src/lib/miden/recovery/financial.ts src/lib/miden/recovery/journal.test.ts src/lib/miden/recovery/journal.ts src/lib/miden/recovery/restore.test.ts src/lib/miden/recovery/restore.ts src/lib/miden/recovery/transaction-continuity.ts src/lib/miden/recovery/types.ts src/lib/miden/repo.ts src/lib/miden/sdk/miden-client-interface.ts src/lib/miden/storage-health.test.ts src/lib/miden/storage-health.ts src/lib/shared/types.ts src/offscreen/main.test.ts src/offscreen/main.ts src/lib/miden/recovery/account-restore.test.ts src/lib/miden/recovery/account-restore.ts src/lib/miden/recovery/guardian-state.test.ts src/lib/miden/recovery/guardian-state.ts src/lib/miden/recovery/sdk-restore.test.ts src/lib/miden/recovery/sdk-restore.ts --max-warnings=0 2>&1 | tee proof/lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-proof-green-task4b-corrections-v1
          path: proof/

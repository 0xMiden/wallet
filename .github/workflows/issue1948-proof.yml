name: Issue1948 frozen storage proof
on:
  push:
    branches:
      - 'ci/1948-proof-*'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/workflow-sha.txt
          echo 93e2fcbad6758a56e7197bdea1c701835ccfbfb6 | tee proof/source-sha.txt
          test "$(git rev-parse HEAD^)" = 93e2fcbad6758a56e7197bdea1c701835ccfbfb6
      - name: Install frozen dependencies
        id: install
        timeout-minutes: 6
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee proof/install.log
      - name: Run functional storage regressions
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/recovery/transaction-record.test.ts src/lib/miden/recovery/journal.test.ts src/lib/miden/recovery/restore.test.ts --testNamePattern='^Task4C2 ' --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
      - name: Report executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('proof/results.json'));const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n!==9)process.exit(1);for(const s of x.testResults)for(const a of s.assertionResults)if(a.status!=='pending')console.log(a.status+': '+a.fullName)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-proof-red-task4c2-foundation-v1
          path: proof/

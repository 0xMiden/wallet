name: Issue1948 frozen candidate validation
on:
  push:
    branches:
      - 'ci/1948-proof-*'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 81f3b2f96f5b9b2580435d7c46168a166e4658ca
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          mkdir -p proof
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_SHA^")" = 81f3b2f96f5b9b2580435d7c46168a166e4658ca
          echo "$GITHUB_SHA" | tee proof/workflow-sha.txt
          git rev-parse HEAD | tee proof/source-sha.txt
          test "$(git rev-parse HEAD)" = 81f3b2f96f5b9b2580435d7c46168a166e4658ca
          test "$(git rev-parse HEAD^{tree})" = bb2bab0b07c6f5f957559d5b8abe74ec738b5e27
          git show "$GITHUB_SHA:.github/ci/issue1948-candidate.json" > proof/candidate-manifest.json
      - name: Install frozen dependencies
        id: install
        timeout-minutes: 6
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee proof/install.log
      - name: Run complete candidate types
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn tsc --noEmit 2>&1 | tee proof/types.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: storage-proof-green-task4c3-acquisition-preflight-v6c-types
          path: |
            proof/types.log
            proof/source-sha.txt
            proof/workflow-sha.txt
      - name: Run complete candidate lint
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn eslint src/lib/miden/recovery/note-acquisition.ts src/lib/miden/back/main.test.ts src/offscreen/main.test.ts --max-warnings=0 2>&1 | tee proof/lint.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: storage-proof-green-task4c3-acquisition-preflight-v6c-lint
          path: |
            proof/lint.log
            proof/source-sha.txt
            proof/workflow-sha.txt
      - name: Run complete candidate tests-1
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/back/main.test.ts src/offscreen/main.test.ts --testNamePattern=Task4C3F --maxWorkers=2 --json --outputFile=proof/results-1.json --no-coverage 2>&1 | tee proof/tests-1.log
      - name: Verify tests-1 executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const x=require('./proof/results-1.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n!==22||x.numPendingTests!==327||x.numFailedTests||x.numRuntimeErrorTestSuites)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: storage-proof-green-task4c3-acquisition-preflight-v6c-tests-1
          path: |
            proof/tests-1.log
            proof/source-sha.txt
            proof/workflow-sha.txt
            proof/results-1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-proof-green-task4c3-acquisition-preflight-v6c
          path: proof/

name: Issue1948 frozen candidate validation
on:
  push:
    branches:
      - 'ci/1948-proof-*'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5da91a4987d8f8d02934bcc55093cfb4767029ab
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          mkdir -p proof
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_SHA^")" = 5da91a4987d8f8d02934bcc55093cfb4767029ab
          echo "$GITHUB_SHA" | tee proof/workflow-sha.txt
          git rev-parse HEAD | tee proof/source-sha.txt
          test "$(git rev-parse HEAD)" = 5da91a4987d8f8d02934bcc55093cfb4767029ab
          test "$(git rev-parse HEAD^{tree})" = 5d64c210b52f700f313d87e950b678a47bb2c7f3
          git show "$GITHUB_SHA:.github/ci/issue1948-candidate.json" > proof/candidate-manifest.json
      - name: Install frozen dependencies
        id: install
        timeout-minutes: 6
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee proof/install.log
      - name: Run complete candidate types
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn tsc --noEmit 2>&1 | tee proof/types.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: storage-proof-green-task4c3-guardian-v5-types
          path: |
            proof/types.log
            proof/source-sha.txt
            proof/workflow-sha.txt
      - name: Run complete candidate lint
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn eslint src/lib/miden/sdk/miden-client-interface.ts src/lib/miden/sdk/miden-client-interface.recovery.test.ts src/lib/miden/back/vault.test.ts --max-warnings=0 2>&1 | tee proof/lint.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: storage-proof-green-task4c3-guardian-v5-lint
          path: |
            proof/lint.log
            proof/source-sha.txt
            proof/workflow-sha.txt
      - name: Run complete candidate tests-1
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/back/vault.test.ts --testNamePattern=Task4C3E --maxWorkers=2 --json --outputFile=proof/results-1.json --no-coverage 2>&1 | tee proof/tests-1.log
      - name: Verify tests-1 executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const x=require('./proof/results-1.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n!==9||x.numPendingTests!==347||x.numFailedTests||x.numRuntimeErrorTestSuites)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: storage-proof-green-task4c3-guardian-v5-tests-1
          path: |
            proof/tests-1.log
            proof/source-sha.txt
            proof/workflow-sha.txt
            proof/results-1.json
      - name: Run complete candidate tests-2
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/sdk/miden-client-interface.recovery.test.ts --maxWorkers=2 --json --outputFile=proof/results-2.json --no-coverage 2>&1 | tee proof/tests-2.log
      - name: Verify tests-2 executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const x=require('./proof/results-2.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n!==53||x.numPendingTests!==0||x.numFailedTests||x.numRuntimeErrorTestSuites)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: storage-proof-green-task4c3-guardian-v5-tests-2
          path: |
            proof/tests-2.log
            proof/source-sha.txt
            proof/workflow-sha.txt
            proof/results-2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-proof-green-task4c3-guardian-v5
          path: proof/

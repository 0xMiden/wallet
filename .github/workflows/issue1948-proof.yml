name: Issue1948 frozen candidate validation
on:
  push:
    branches:
      - 'ci/1948-proof-*'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/workflow-sha.txt
          echo 9ca28b75672fdfc9e4dac1a088761bc8ca40e8a4 | tee proof/source-sha.txt
          test "$(git rev-parse HEAD^)" = 9ca28b75672fdfc9e4dac1a088761bc8ca40e8a4
          cp .github/ci/issue1948-candidate.json proof/candidate-manifest.json
      - name: Install frozen dependencies
        id: install
        timeout-minutes: 6
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee proof/install.log
      - name: Run complete candidate types
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn tsc --noEmit 2>&1 | tee proof/types.log
      - name: Run complete candidate lint
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn eslint src/lib/miden/back/actions.test.ts src/lib/miden/back/actions.ts src/lib/miden/back/vault.test.ts src/lib/miden/back/vault.ts src/lib/miden/recovery/canonical-reads.test.ts src/lib/miden/recovery/canonical-reads.ts src/lib/miden/recovery/financial.test.ts src/lib/miden/recovery/financial.ts src/lib/miden/recovery/journal.test.ts src/lib/miden/recovery/journal.ts src/lib/miden/recovery/nullifier-scan.ts src/lib/miden/recovery/read-turn.ts src/lib/miden/recovery/reconcile.test.ts src/lib/miden/recovery/reconcile.ts src/lib/miden/recovery/restore.test.ts src/lib/miden/recovery/restore.ts src/lib/miden/recovery/retirement.test.ts src/lib/miden/recovery/retirement.ts src/lib/miden/recovery/retry-transition.test.ts src/lib/miden/recovery/retry-transition.ts src/lib/miden/recovery/types.ts src/lib/miden/recovery/validation.ts src/lib/miden/transaction/retry.recovery.test.ts src/lib/miden/transaction/retry.ts src/lib/shared/types.ts --max-warnings=0 2>&1 | tee proof/lint.log
      - name: Run complete candidate tests-1
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/recovery/access.test.ts src/lib/miden/recovery/account-restore.test.ts src/lib/miden/recovery/canonical-reads.test.ts src/lib/miden/recovery/capture.test.ts src/lib/miden/recovery/continuity.test.ts src/lib/miden/recovery/financial-writer.test.ts src/lib/miden/recovery/financial.test.ts src/lib/miden/recovery/guardian-state.test.ts --maxWorkers=2 --json --outputFile=proof/results-1.json 2>&1 | tee proof/tests-1.log
      - name: Verify tests-1 executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const x=require('./proof/results-1.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n<1||x.numPendingTests||x.numRuntimeErrorTestSuites)process.exit(1)"
      - name: Run complete candidate tests-2
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/recovery/journal.test.ts src/lib/miden/recovery/reconcile.test.ts src/lib/miden/recovery/restore.test.ts src/lib/miden/recovery/retirement.test.ts src/lib/miden/recovery/retry-transition.test.ts src/lib/miden/recovery/sdk-restore.test.ts src/lib/miden/recovery/sdk-snapshot.test.ts src/lib/miden/transaction/retry.earn.test.ts --maxWorkers=2 --json --outputFile=proof/results-2.json 2>&1 | tee proof/tests-2.log
      - name: Verify tests-2 executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const x=require('./proof/results-2.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n<1||x.numPendingTests||x.numRuntimeErrorTestSuites)process.exit(1)"
      - name: Run complete candidate tests-3
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/transaction/retry.landed.test.ts src/lib/miden/transaction/retry.recovery.test.ts src/lib/miden/transaction/retry.test.ts src/lib/miden/transaction/retry.unconfirmed.test.ts src/lib/miden/transaction/reconcile-judge.test.ts src/lib/miden/transaction/reconcile-reads.test.ts src/lib/miden/transaction/reconcile-unconfirmed.delivery.test.ts src/lib/miden/transaction/reconcile-unconfirmed.pass.test.ts --maxWorkers=2 --json --outputFile=proof/results-3.json 2>&1 | tee proof/tests-3.log
      - name: Verify tests-3 executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const x=require('./proof/results-3.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n<1||x.numPendingTests||x.numRuntimeErrorTestSuites)process.exit(1)"
      - name: Run complete candidate tests-4
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn jest --runTestsByPath src/lib/miden/transaction/reconcile-unconfirmed.writes.test.ts src/lib/miden/back/actions.test.ts src/lib/intercom/in-process-request-handler.test.ts src/lib/miden/back/vault.test.ts --maxWorkers=2 --json --outputFile=proof/results-4.json 2>&1 | tee proof/tests-4.log
      - name: Verify tests-4 executed counts
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e "const x=require('./proof/results-4.json');const n=x.numPassedTests+x.numFailedTests;console.log(JSON.stringify({executed:n,passed:x.numPassedTests,failed:x.numFailedTests,pending:x.numPendingTests,runtime:x.numRuntimeErrorTestSuites}));if(n<1||x.numPendingTests||x.numRuntimeErrorTestSuites)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-proof-green-task4c1-complete-v3
          path: proof/

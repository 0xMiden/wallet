name: Issue1948 frozen candidate validation
on:
  push:
    branches:
      - 'ci/1948-proof-*'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/workflow-sha.txt
          echo 8b44daa52a7fc4f20eed474c9366abf9787f7a32 | tee proof/source-sha.txt
          test "$(git rev-parse HEAD^)" = 8b44daa52a7fc4f20eed474c9366abf9787f7a32
          cp .github/ci/issue1948-candidate.json proof/candidate-manifest.json
      - name: Install frozen dependencies
        id: install
        timeout-minutes: 6
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee proof/install.log
      - name: Run complete candidate types
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn tsc --noEmit 2>&1 | tee proof/types.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: storage-proof-green-task4c2-coherent-v1-types
          path: |
            proof/types.log
            proof/source-sha.txt
            proof/workflow-sha.txt
      - name: Run complete candidate lint
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          yarn eslint src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.deposit.test.tsx src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.tsx src/app/templates/EvmConnectModal/EvmBridgeDepositScreen.usdcx.test.tsx src/app/templates/EvmConnectModal/useCctpExecute.ts src/lib/epoch/EarnIntentWatcher.reconcile.test.tsx src/lib/epoch/bridge.ts src/lib/epoch/earn-note.ts src/lib/epoch/earn-withdraw-policy.ts src/lib/epoch/earn-withdraw-recovery.test.ts src/lib/epoch/earn-withdraw.test.ts src/lib/epoch/earn-withdraw.ts src/lib/epoch/earn.test.ts src/lib/epoch/earn.ts src/lib/epoch/epoch-send.test.ts src/lib/epoch/epoch-send.ts src/lib/epoch/miden-note.ts src/lib/epoch/receipt-execution.test.ts src/lib/epoch/receipt-execution.ts src/lib/epoch/receipt-owners.test.ts src/lib/epoch/receipt.ts src/lib/epoch/sdk.ts src/lib/epoch/store.execute.test.ts src/lib/epoch/store.ts src/lib/epoch/types.ts src/lib/intercom/in-process-request-handler.ts src/lib/miden/activity/bridge-receive.test.ts src/lib/miden/activity/bridge-receive.ts src/lib/miden/back/actions.ts src/lib/miden/back/main.ts src/lib/miden/back/vault.test.ts src/lib/miden/back/vault.ts src/lib/miden/db/types.ts src/lib/miden/recovery/journal.test.ts src/lib/miden/recovery/manual-execution.test.ts src/lib/miden/recovery/provider-boundaries.test.ts src/lib/miden/recovery/provider-enrichment.test.ts src/lib/miden/recovery/provider-record.ts src/lib/miden/recovery/provider-writers.test.ts src/lib/miden/recovery/receipt-backend.ts src/lib/miden/recovery/receipt-lifecycle.test.ts src/lib/miden/recovery/receipt-writer.test.ts src/lib/miden/recovery/receipt-writer.ts src/lib/miden/recovery/restore.test.ts src/lib/miden/recovery/restore.ts src/lib/miden/recovery/retirement.ts src/lib/miden/recovery/testing/provider-receipts.ts src/lib/miden/recovery/transaction-continuity.ts src/lib/miden/recovery/transaction-record.test.ts src/lib/miden/recovery/transaction-record.ts src/lib/miden/recovery/types.ts src/lib/miden/recovery/validation.ts src/lib/miden/transaction/bridged-receive-phase.test.ts src/lib/miden/transaction/complete.bridge-in.test.ts src/lib/miden/transaction/complete.ts src/lib/miden/transaction/earn-attempt-initiate.test.ts src/lib/miden/transaction/earn-attempt.test.ts src/lib/miden/transaction/earn-phase.test.ts src/lib/miden/transaction/earn-preparation.test.ts src/lib/miden/transaction/initiate.ts src/lib/miden/transaction/initiate.usdcx-source.test.ts src/lib/miden/transaction/modify-decline.test.ts src/lib/miden/transaction/outcome-telemetry.integration.test.ts src/lib/miden/transaction/transaction-failure-sentry.integration.test.ts src/lib/miden/transaction/transactions.branches.test.ts src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts src/lib/miden/transaction/transactions.extended.test.ts src/lib/miden/transaction/transactions.gaps.test.ts src/lib/miden/transaction/transactions.test.ts src/lib/one-click/tracking.claim.test.ts src/lib/one-click/tracking.test.ts src/lib/one-click/tracking.ts src/lib/shared/types.ts src/lib/usdcx/burn-status.test.ts src/lib/usdcx/burn-status.ts src/lib/usdcx/deposit.ts src/lib/usdcx/destination-status.test.ts src/lib/usdcx/destination-status.ts src/lib/usdcx/executor.ts --max-warnings=0 2>&1 | tee proof/lint.log

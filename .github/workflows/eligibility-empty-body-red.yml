name: Eligibility empty HTTP body expected red
on:
  push:
    branches: [ci/1894-empty-body-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = a36aff45f66d4c85f8927e338560eff5141a4797
      - name: Verify expected functional failures
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 7 - an empty HTTP body stream is accepted but a forged nonempty body is rejected' result.log || exit 1
          grep -F '400 !== 200' result.log || exit 1
          grep -F '# fail 1' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empty-body-red
          path: result.log

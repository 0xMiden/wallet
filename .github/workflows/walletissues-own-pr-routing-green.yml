          root = pathlib.Path(sys.argv[1])
          for name, spec in payloads.items():
              data = gzip.decompress(base64.b64decode(spec['gzip_base64'], validate=True))
              assert hashlib.sha256(data).hexdigest() == spec['sha256'], name
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              path.chmod(spec['mode'])
          bindings = {name: {k: v for k, v in spec.items() if k != 'gzip_base64'} for name, spec in payloads.items()}
          (root / 'source-bindings.json').write_text(json.dumps(bindings, indent=2) + '\n')
          (root / 'before.json').write_text(json.dumps({name: {
              'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest(),
              'mode': (root / name).stat().st_mode & 0o777} for name in bindings}, indent=2) + '\n')
          (root / 'transport.json').write_text(json.dumps({
              'source_commit': '803d36da495689803192c4b8a78648efdd56b31c', 'transport_sha': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'argv': ['python3', '-B', '-m', 'unittest', '-v', 'test_discover']
          }, indent=2) + '\n')
          MATERIALIZE
          python3 --version > "$PROOF_DIR/runtime.txt" 2>&1
          cat > "$PROOF_DIR/mutations.json" <<'MUTATIONS'
          {
            "stopped": {
              "target": "        blocked = any(negative.match(verdict.strip('* >')) for verdict in verdicts) or report['state'] == 'CHANGES_REQUESTED'",
              "replacement": "        blocked = False",
              "failures": 3,
              "methods": [
                "test_negative_outcome_overrides_complete_words_in_a_report",
                "test_stopped_report_is_present_but_never_complete",
                "test_later_stopped_report_wins_over_earlier_completion"
              ]
            },
            "head": {
              "target": "'current_head': report.get('commit_id') == item.get('headRefOid'),",
              "replacement": "'current_head': True,",
              "failures": 1,
              "methods": [
                "test_old_head_report_keeps_its_review_but_blocks_action"
              ]
            },
            "own-check": {
              "target": "outside = author_rule(item, repo, authors, allow_own=True)",
              "replacement": "outside = author_rule(item, repo, authors, allow_own=False)",
              "failures": 1,
              "methods": [
                "test_live_check_accepts_own_pr_without_changing_legacy_author_selection"
              ]
            },
            "draft": {
              "target": "holds = ['draft'] if item.get('isDraft') else []",
              "replacement": "holds = []",
              "failures": 4,
              "methods": [
                "test_all_own_prs_remain_visible_with_their_holds",
                "test_draft_and_linked_issue_hold_block_a_complete_report",
                "test_unowned_draft_is_held_with_or_without_a_complete_report"
              ]
            }
          }
          MUTATIONS
      - name: Prepare two red baselines and four isolated guard omissions
        id: prepare
        run: |
          set -euo pipefail
          cat > "$PROOF_DIR/prepare-phases.py" <<'PREPARE'
          import hashlib, json, pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          mutations = json.loads((root / 'mutations.json').read_text())
          normal = (root / 'source/discover.py').read_text()
          phases = {}
          for label in ['interface', 'outcome', 'normal'] + list(mutations):
              target = root / 'phases' / label
              shutil.copytree(root / 'source', target)
              if label in {'interface', 'outcome'}:
                  shutil.copyfile(root / ('baseline-' + label + '.py'), target / 'discover.py')
              elif label in mutations:
                  spec = mutations[label]
                  assert normal.count(spec['target']) == 1, label
                  (target / 'discover.py').write_text(normal.replace(spec['target'], spec['replacement'], 1))
              phases[label] = {name: {'sha256': hashlib.sha256((target / name).read_bytes()).hexdigest(),
                                    'mode': (target / name).stat().st_mode & 0o777}
                               for name in ['discover.py', 'ledger.py', 'test_discover.py']}
          (root / 'phase-source-bindings.json').write_text(json.dumps(phases, indent=2) + '\n')
          PREPARE
          python3 "$PROOF_DIR/prepare-phases.py" "$PROOF_DIR"
      - name: Run all 64 methods in each phase with natural exits and full output
        id: tests
        run: |
          set -euo pipefail
          gate=0
          for phase in interface outcome normal stopped head own-check draft; do
            cd "$PROOF_DIR/phases/$phase"
            set +e
            python3 -B -m unittest -v test_discover 2>&1 | tee "$PROOF_DIR/$phase.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "$PROOF_DIR/$phase.exit"
            printf '%s\n' "${statuses[1]}" > "$PROOF_DIR/$phase.tee.exit"
            expected=1
            if [ "$phase" = normal ]; then expected=0; fi
            if [ "${statuses[0]}" -ne "$expected" ] || [ "${statuses[1]}" -ne 0 ]; then gate=1; fi
          done
          exit "$gate"
      - name: Always verify unchanged sources and exact complete phase inventories
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          cat > "$PROOF_DIR/verify-results.py" <<'VERIFY'
          import ast, collections, hashlib, json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          original = json.loads((root / 'source-bindings.json').read_text())
          after = {name: {'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest(),
                          'mode': (root / name).stat().st_mode & 0o777} for name in original}
          (root / 'after.json').write_text(json.dumps(after, indent=2) + '\n')
          assert after == json.loads((root / 'before.json').read_text()), 'original source changed'
          assert all(after[name]['sha256'] == spec['sha256'] and after[name]['mode'] == spec['mode']
                     for name, spec in original.items())
          phases = json.loads((root / 'phase-source-bindings.json').read_text())
          mutations = json.loads((root / 'mutations.json').read_text())
          expected = []
          for cls in ast.parse((root / 'source/test_discover.py').read_text()).body:
              if isinstance(cls, ast.ClassDef):
                  expected += ['test_discover.' + cls.name + '.' + f.name for f in cls.body
                               if isinstance(f, ast.FunctionDef) and f.name.startswith('test_')]
          assert len(expected) == 64
          summary = {}
          for label, sources in phases.items():
              actual = {name: {'sha256': hashlib.sha256((root / 'phases' / label / name).read_bytes()).hexdigest(),
                               'mode': (root / 'phases' / label / name).stat().st_mode & 0o777} for name in sources}
              assert actual == sources, label + ': source changed'
              log = (root / (label + '.log')).read_text()
              seen = re.findall(r'^test_\w+ \((test_discover\.\w+\.test_\w+)\) \.\.\.', log, re.M)
              assert collections.Counter(seen) == collections.Counter(expected), label + ': method inventory'
              assert re.search(r'^Ran 64 tests in ', log, re.M), label + ': not a complete run'
              natural = int((root / (label + '.exit')).read_text())
              assert natural == (0 if label == 'normal' else 1), label + ': natural exit'
              assert (root / (label + '.tee.exit')).read_text().strip() == '0'
              failures = re.findall(r'^FAIL: .*?\((test_discover\.\w+\.test_\w+)\)', log, re.M)
              errors = re.findall(r'^ERROR: ', log, re.M)
              if label == 'interface':
                  assert len(failures) == 5 and len(errors) == 30, label
                  assert len(re.findall(r'^test_.*? \.\.\. ok$', log, re.M)) == 41, label
              elif label == 'outcome':
                  assert failures == ['test_discover.OwnPrRoutesTest.test_completed_verdict_keeps_historical_incomplete_assignment_evidence'] and not errors
              elif label == 'normal':
                  assert not failures and not errors and re.search(r'^OK$', log, re.M)
              else:
                  spec = mutations[label]
                  assert len(failures) == spec['failures'] and not errors, label
                  assert set(failures) == {'test_discover.OwnPrRoutesTest.' + name for name in spec['methods']}, label
              summary[label] = {'methods': 64, 'natural_exit': natural, 'failure_records': len(failures),
                                'error_records': len(errors), 'failure_methods': failures}
          (root / 'validation.json').write_text(json.dumps(summary, indent=2) + '\n')
          VERIFY
          python3 "$PROOF_DIR/verify-results.py" "$PROOF_DIR"
      - name: Always upload scoped proof
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: walletissues-own-pr-routing-proof
          path: ${{ env.PROOF_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

          W1644_BINDINGS
      - name: Retain source-bound collector
        id: helper
        run: |
          set -euo pipefail
          cat > "$PROOF_DIR/proof-tools.py" <<'W1644_HELPER'
          from pathlib import Path, PurePosixPath
          import hashlib
          import io
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import tarfile

          P = Path(os.environ['PROOF_DIR']).resolve()
          B = json.loads((P / 'bindings.json').read_text())


          def digest(raw):
              return hashlib.sha256(raw).hexdigest()


          def save(name, value):
              (P / name).write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')


          def load(name):
              return json.loads((P / name).read_text())


          def git(*args):
              return subprocess.check_output(['git', *args], env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'})


          def tree(ref):
              result = {}
              for row in git('ls-tree', '-rz', ref).split(b'\0'):
                  if row:
                      meta, name = row.split(b'\t', 1)
                      result[name.decode()] = meta.decode().split()
              return result


          def snapshot(label):
              status = git('status', '--porcelain=v1', '-uall').decode()
              entries = tree('HEAD')
              physical = {}
              for name, entry in entries.items():
                  path = Path(name)
                  info = path.lstat()
                  if entry[0] == '120000':
                      assert stat.S_ISLNK(info.st_mode), name
                      raw = os.readlink(path).encode()
                      kind = 'symlink'
                  else:
                      assert entry[1] == 'blob' and stat.S_ISREG(info.st_mode), name
                      assert bool(info.st_mode & 0o111) == (entry[0] == '100755'), name
                      raw = path.read_bytes()
                      kind = 'regular'
                  blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  assert blob == entry[2], name
                  physical[name] = {'kind': kind, 'mode': stat.S_IMODE(info.st_mode),
                                    'bytes': len(raw), 'sha256': digest(raw), 'working_blob': blob}
              index = Path(git('rev-parse', '--git-path', 'index').decode().strip())
              assert stat.S_ISREG(index.lstat().st_mode)
              raw_index = index.read_bytes()
              stages = git('ls-files', '--stage', '-z')
              (P / (label + '.physical-index.bin')).write_bytes(raw_index)
              (P / (label + '.stage-entries.bin')).write_bytes(stages)
              (P / (label + '.git-tree.bin')).write_bytes(git('ls-tree', '-rz', 'HEAD'))
              save(label + '.git-entries.json', entries)
              save(label + '.physical-source-map.json', physical)
              row = {'head': git('rev-parse', 'HEAD').decode().strip(),
                     'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'status': status,
                     'physical_index_sha256': digest(raw_index),
                     'physical_index_mode': stat.S_IMODE(index.lstat().st_mode),
                     'stage_entries_sha256': digest(stages), 'tracked_count': len(entries)}
              save(label + '.identity.json', row)
              assert row['head'] == os.environ['GITHUB_SHA'] and row['status'] == ''
              if label != 'initial':
                  original = load('initial.identity.json')
                  for key in ['head', 'tree', 'status', 'stage_entries_sha256', 'tracked_count']:
                      assert row[key] == original[key], (label, key)
                  assert entries == load('initial.git-entries.json')
                  assert physical == load('initial.physical-source-map.json')
                  assert stages == (P / 'initial.stage-entries.bin').read_bytes()
              return entries, physical


          def archive_source(entries, physical):
              raw = git('archive', '--format=tar', 'HEAD')
              (P / 'full-tracked-source.tar').write_bytes(raw)
              seen = {}
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
                  for item in archive.getmembers():
                      path = PurePosixPath(item.name)
                      assert not path.is_absolute() and '..' not in path.parts
                      if item.isdir():
                          continue
                      assert item.name in entries and item.name not in seen
                      expected = physical[item.name]
                      if item.issym():
                          assert expected['kind'] == 'symlink'
                          data = item.linkname.encode()
                      else:
                          assert item.isfile() and expected['kind'] == 'regular'
                          assert bool(item.mode & 0o111) == (entries[item.name][0] == '100755')
                          data = archive.extractfile(item).read()
                      assert digest(data) == expected['sha256'] and len(data) == expected['bytes']
                      seen[item.name] = {'mode': item.mode, 'type': expected['kind'],
                                         'bytes': len(data), 'sha256': digest(data)}
              assert set(seen) == set(entries)
              save('full-tracked-source.archive-inventory.json', seen)


          def framework(capture):
              for package, spec in B['framework'].items():
                  root = Path('node_modules') / package
                  assert json.loads((root / 'package.json').read_text())['version'] == spec['version']
                  for key, item in spec['files'].items():
                      path = root / item['relative']
                      assert stat.S_ISREG(path.lstat().st_mode)
                      raw = path.read_bytes()
                      assert len(raw) == item['bytes'] and digest(raw) == item['sha256'], (package, key)
                      artifact = P / (spec['artifact_prefix'] + '-' + key)
                      if capture:
                          artifact.write_bytes(raw)
                      else:
                          assert artifact.read_bytes() == raw


          def frozen_inputs():
              workflow = Path(B['workflow']).read_bytes()
              assert workflow == git('show', 'HEAD:' + B['workflow'])
              for filename, delimiter in [('bindings.json', 'W1644_BINDINGS'), ('proof-tools.py', 'W1644_HELPER')]:
                  start = ('          cat > "$PROOF_DIR/' + filename + '" <<\'' + delimiter + '\'\n').encode()
                  embedded = workflow.split(start, 1)[1].split(('          ' + delimiter + '\n').encode(), 1)[0]
                  assert all(not line or line.startswith(b'          ') for line in embedded.splitlines())
                  assert b''.join((line[10:] if line else b'') + b'\n' for line in embedded.splitlines()) == (P / filename).read_bytes()
              assert digest(Path(__file__).read_bytes()) == B['helper_sha256']
              assert digest((P / 'run-logged.bash').read_bytes()) == B['logger_sha256']


          def source():
              assert os.environ['GITHUB_EVENT_NAME'] == 'push'
              assert os.environ['GITHUB_REF_NAME'] == B['branch']
              assert os.environ['GITHUB_REF'] == 'refs/heads/' + B['branch']
              assert git('rev-parse', 'HEAD^').decode().strip() == B['source']
              assert git('rev-parse', B['source'] + '^').decode().strip() == B['baseline']
              assert git('rev-parse', B['baseline'] + '^{tree}').decode().strip() == B['baseline_tree']
              assert git('rev-parse', B['source'] + '^{tree}').decode().strip() == B['source_tree']
              assert git('diff-tree', '--no-commit-id', '--name-status', '-r', B['source']).decode().strip() == 'A\t' + B['target']
              assert git('diff-tree', '--no-commit-id', '--name-status', '-r', 'HEAD').decode().strip() == 'A\t' + B['workflow']
              base, before, after = tree(B['baseline']), tree(B['source']), tree('HEAD')
              assert len(before) == B['source_count'] and len(after) == B['source_count'] + 1
              assert set(before) - set(base) == {B['target']} and all(before[name] == entry for name, entry in base.items())
              assert set(after) - set(before) == {B['workflow']} and all(after[name] == entry for name, entry in before.items())
              frozen_inputs()
              assert digest(Path('yarn.lock').read_bytes()) == B['lock_sha256']
              assert digest(Path(B['target']).read_bytes()) == B['target_sha256']
              for group in ['atomic', 'compatibility']:
                  for name, spec in B[group].items():
                      assert digest(Path(name).read_bytes()) == spec['sha256'], name
              for ref, name in [(B['baseline'], 'baseline-commit.raw'), (B['source'], 'test-checkpoint-commit.raw'), ('HEAD', 'transport-commit.raw')]:
                  raw = git('cat-file', 'commit', ref)
                  assert b'\ngpgsig -----BEGIN SSH SIGNATURE-----\n' in raw
                  (P / name).write_bytes(raw)
              (P / 'test-only.patch').write_bytes(git('diff', B['baseline'], B['source'], '--binary'))
              (P / 'workflow.yml').write_bytes(Path(B['workflow']).read_bytes())
              save('run-identity.json', {key: os.environ[key] for key in [
                  'GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_REF', 'GITHUB_REF_NAME', 'GITHUB_RUN_ID',
                  'GITHUB_RUN_ATTEMPT', 'GITHUB_EVENT_NAME']})
              entries, physical = snapshot('initial')
              archive_source(entries, physical)


          def checked_result(label):
              red = label == 'admission'
              expected_paths = {B['target']: B['target_spec']} if red else B[label]
              result = load(label + '.jest.json')
              expected_total = sum(spec['count'] for spec in expected_paths.values())
              fail_count = 6 if red else 0
              counts = {'numTotalTests': expected_total, 'numPassedTests': expected_total - fail_count,
                        'numFailedTests': fail_count, 'numTotalTestSuites': len(expected_paths),
                        'numFailedTestSuites': int(red), 'numPassedTestSuites': len(expected_paths) - int(red),
                        'numPendingTestSuites': 0, 'numPendingTests': 0, 'numTodoTests': 0, 'numRuntimeErrorTestSuites': 0}
              for key, value in counts.items():
                  assert result[key] == value, (label, key)
              assert result['success'] is (not red) and result['wasInterrupted'] is False and result['openHandles'] == []
              assert result['snapshot']['failure'] is False and result['snapshot']['unmatched'] == result['snapshot']['unchecked'] == 0
              assert len(result['testResults']) == len(expected_paths)
              inventory, failures, seen_paths = [], {}, set()
              for suite in result['testResults']:
                  name = str(Path(suite['name']).relative_to(Path.cwd()))
                  assert name in expected_paths and name not in seen_paths
                  seen_paths.add(name)
                  spec = expected_paths[name]
                  assert suite['status'] == ('failed' if red else 'passed')
                  expected = {item['full_name']: item for item in spec['cases']}
                  cases = suite['assertionResults']
                  assert len(cases) == spec['count'] == len({case['fullName'] for case in cases})
                  assert {case['fullName'] for case in cases} == set(expected)
                  for case in cases:
                      identity = expected[case['fullName']]
                      assert case['title'] == identity['title'] and case['ancestorTitles'] == identity['ancestor_titles']
                      assert case['fullName'] == ' '.join([*case['ancestorTitles'], case['title']])
                      assert case['invocations'] == 1 and case['retryReasons'] == [] and case['failing'] is False
                      inventory.append({'path': name, 'case': case})
                      if not red or identity['result'] == 'PASS':
                          assert case['status'] == 'passed' and case['failureMessages'] == case['failureDetails'] == []
                          if 'assertions' in identity:
                              assert case['numPassingAsserts'] == identity['assertions']
                          continue
                      assert case['status'] == 'failed' and len(case['failureMessages']) == len(case['failureDetails']) == 1
                      assert case['numPassingAsserts'] == identity['prerequisites']
                      detail = case['failureDetails'][0]
                      assert type(detail) is dict and set(detail) == {'matcherResult'}
                      matcher = detail['matcherResult']
                      assert set(matcher) == set(identity['matcher_keys']) and matcher['pass'] is False
                      message = re.sub(r'\x1b\[[0-9;]*m', '', matcher['message'])
                      assert message.startswith('expect(received).' + identity['matcher'] + '(expected)')
                      if identity['matcher'] == 'toEqual':
                          assert matcher['name'] == 'toEqual' and matcher['expected'] == identity['expected']
                          if identity['id'] == 'A1':
                              assert matcher['actual'] == identity['actual']
                          else:
                              actual = matcher['actual']
                              assert len(actual) == 2
                              assert [[row['noteIds'], row['extraInputs']] for row in actual] == identity['actual_links']
                              assert all(row['accountId'] == 'mtst1accounta' and row['consumeEntryPoint'] == 'swap_settlement'
                                         and row['feeAdmission'] == 'known_sufficient' for row in actual)
                      elif identity['matcher'] == 'toHaveLength':
                          assert re.search(r'Expected length:\s+1\b', message)
                          assert re.search(r'Received length:\s+2\b', message)
                          for token in ['payback-00', 'payback-01', 'payback-02', 'payback-03', 'swap-A', 'swap-B']:
                              assert token in message
                      else:
                          assert identity['matcher'] == matcher['name'] == 'toBe'
                          assert type(matcher['expected']) is str and type(matcher['actual']) is str
                          assert matcher['expected'] != matcher['actual']
                      raw = re.sub(r'\x1b\[[0-9;]*m', '', case['failureMessages'][0])
                      prefix, stack = re.split(r'\n\s+at ', raw, maxsplit=1)
                      assert prefix == 'Error: ' + message
                      first = re.split(r'\n\s+at ', stack)[0].strip()
                      pattern = r'[^\n]*\(' + re.escape(str(Path.cwd() / name)) + ':' + identity['frame'] + r'\)'
                      assert re.fullmatch(pattern, first), first
                      failures[case['fullName']] = {'first_frame': first, 'prerequisites': case['numPassingAsserts'],
                                                   'matcher': matcher, 'raw_message': case['failureMessages'][0],
                                                   'post_failure_assertions': 'UNRUN; no credit'}
              assert seen_paths == set(expected_paths) and len(failures) == fail_count
              if red:
                  assert sum(item['case']['numPassingAsserts'] for item in inventory) == 54
                  assert sum(item['case']['numPassingAsserts'] for item in inventory) + fail_count == 60
                  log = re.sub(r'\x1b\[[0-9;]*m', '', (P / 'admission.log').read_text())
                  observed = re.findall(r'swap-admission A3 fee admissions (\[[^\n]*\])', log)
                  assert len(observed) == 1
                  reasons = json.loads(observed[0])
                  assert len(reasons) == 2 and all(reason in ['known_sufficient', 'balance_unknown'] for reason in reasons)
                  save('admission-A3-observed-reasons.json', {'actual_reasons': reasons, 'winner_reason_requirement': None})
              save(label + '.inventory.json', {'origin': 'Fresh actual complete unfiltered Jest assertionResults',
                                             'expected_count': expected_total, 'actual': inventory})
              return {'total': expected_total, 'pass': expected_total - fail_count, 'fail': fail_count,
                      'failures': failures, 'inventory': label + '.inventory.json'}


          def seal():
              validation = {'status': 'INVALID', 'production_gate': 'CLOSED', 'transport': 'NEVER_MERGE'}
              try:
                  outcomes = {key: os.environ.get(key.upper() + '_OUTCOME', 'missing') for key in B['outcomes']}
                  validation['outcomes'] = outcomes
                  for key, value in outcomes.items():
                      assert value == ('failure' if key == 'admission' else 'success'), (key, value)
                  snapshot('validation')
                  framework(False)
                  frozen_inputs()
                  for label, template in B['commands'].items():
                      command = load(label + '.command.json')
                      assert command['argv'] == [item.replace('$PROOF_DIR', str(P)) for item in template]
                      assert command['cwd'] == str(Path.cwd())
                      assert (P / (label + '.log')).is_file()
                      assert int((P / (label + '.exit')).read_text()) == (1 if label == 'admission' else 0)
                      assert int((P / (label + '.tee.exit')).read_text()) == 0
                  suites = {label: checked_result(label) for label in ['admission', 'atomic', 'compatibility']}
                  assert sum(row['total'] for row in suites.values()) == 236
                  for label in B['snapshots']:
                      row = load(label + '.identity.json')
                      assert digest((P / (label + '.physical-index.bin')).read_bytes()) == row['physical_index_sha256']
                      assert digest((P / (label + '.stage-entries.bin')).read_bytes()) == row['stage_entries_sha256']
                      assert load(label + '.git-entries.json') == load('initial.git-entries.json')
                      assert load(label + '.physical-source-map.json') == load('initial.physical-source-map.json')
                  validation.update(status='EXACT_SCOPED_ADMISSION_CAUSAL_RED', suites=suites,
                                    production_gate='ROOT_ACTUAL_SCOPED_ACCEPTANCE_REQUIRED',
                                    limits='No production/completion/current-main/final-review/coverage/platform/visual or whole1644 acceptance')
              except Exception as error:
                  validation['reason'] = str(error)
              finally:
                  save('validation.json', validation)
                  files = {}
                  for path in sorted(P.iterdir()):
                      if path.name == 'hash-manifest.json':
                          continue
                      assert stat.S_ISREG(path.lstat().st_mode), path.name
                      raw = path.read_bytes()
                      files[path.name] = {'bytes': len(raw), 'sha256': digest(raw),
                                          'mode': stat.S_IMODE(path.lstat().st_mode), 'type': 'regular'}
                  save('hash-manifest.json', {'files': files, 'self_excluded': ['hash-manifest.json']})
              print(json.dumps({'status': validation['status'], 'reason': validation.get('reason')}))
              raise SystemExit(0 if validation['status'] == 'EXACT_SCOPED_ADMISSION_CAUSAL_RED' else 1)


          mode = sys.argv[1]
          if mode == 'source':
              source()
          elif mode == 'prepared':
              snapshot('prepared')
              framework(True)
          elif mode == 'final':
              snapshot('final')
              framework(False)
          elif mode == 'seal':
              seal()
          else:
              raise SystemExit('Unknown mode: ' + mode)
          W1644_HELPER
      - name: Checkout sole-workflow transport at actual push SHA
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind signed checkpoint and exact sole-workflow ancestry
        id: source
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged source python3 "$PROOF_DIR/proof-tools.py" source
      - name: Set supported Node runtime
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Retain actual runtime versions
        id: runtime
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged runtime node -p 'JSON.stringify(process.versions)'
      - name: Install exact frozen dependencies with normal hooks
        id: install
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged install timeout 10m yarn install --frozen-lockfile --non-interactive
      - name: Bind prepared source and pinned Jest implementations
        id: prepared
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged prepared python3 "$PROOF_DIR/proof-tools.py" prepared
      - name: Check named new and frozen regression format
        id: format
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged format yarn prettier --check src/lib/miden/transaction/initiate.swap-admission.test.ts src/lib/miden/transaction/initiate.swap-settlement.test.ts
      - name: Lint named new and frozen regressions with zero warnings
        id: eslint
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged eslint yarn eslint --max-warnings 0 src/lib/miden/transaction/initiate.swap-admission.test.ts src/lib/miden/transaction/initiate.swap-settlement.test.ts
      - name: Run unchanged TypeScript gate
        id: typescript
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged typescript yarn tsc --noEmit --pretty false
      - name: Run all ten admission cases preserving expected natural red
        id: admission
        if: ${{ !cancelled() && steps.format.outcome == 'success' && steps.eslint.outcome == 'success' && steps.typescript.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged admission yarn jest --runTestsByPath src/lib/miden/transaction/initiate.swap-admission.test.ts --maxWorkers=2 --ci --coverage=false --json --outputFile "$PROOF_DIR/admission.jest.json"
      - name: Run unchanged seven linkage cases without filters
        id: atomic
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged atomic yarn jest --runTestsByPath src/lib/miden/transaction/initiate.swap-settlement.test.ts --maxWorkers=2 --ci --coverage=false --json --outputFile "$PROOF_DIR/atomic.jest.json"
      - name: Run five complete compatibility suites without filters
        id: compatibility
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged compatibility yarn jest --runTestsByPath src/lib/miden/swap/settlement.test.ts src/lib/miden/transaction/initiate.batch-isolation.test.ts src/lib/miden/transaction/initiate.held-claims.test.ts src/lib/miden/transaction/complete.swap-stamp.test.ts src/lib/miden/back/sync-manager.test.ts --maxWorkers=2 --ci --coverage=false --json --outputFile "$PROOF_DIR/compatibility.jest.json"
      - name: Always retain final physical source and separate index maps
        id: final
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$PROOF_DIR/run-logged.bash"
          run_logged final python3 "$PROOF_DIR/proof-tools.py" final
      - name: Always validate and seal exact scoped evidence
        id: seal
        if: ${{ always() }}
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          BINDINGS_OUTCOME: ${{ steps.bindings.outcome }}
          HELPER_OUTCOME: ${{ steps.helper.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PREPARED_OUTCOME: ${{ steps.prepared.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          ADMISSION_OUTCOME: ${{ steps.admission.outcome }}
          ATOMIC_OUTCOME: ${{ steps.atomic.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        run: |
          set -euo pipefail
          python3 "$PROOF_DIR/proof-tools.py" seal
      - name: Always upload private NEVER MERGE proof
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wallet1644-pr1659-admission-red-proof
          path: ${{ env.PROOF_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

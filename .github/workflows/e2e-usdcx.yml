name: E2E USDCx

# Runs the live USDCx suites on the extension when Release E2E dispatches it, through the runner `yarn e2e:real` uses
# (scripts/e2e-real.mjs), in two jobs. The Arc job runs usdcx-in (a deposit from the CI key into a fresh Guardian wallet),
# usdcx-burn (a Send burn to that key from a fresh standard and a fresh Guardian wallet, each waiting for Circle's payout)
# and usdcx (the round trip: burn, payout, deposit back). The L2 job then runs usdcx-in-l2 (a deposit the same key signs
# on Base Sepolia, on Arbitrum Sepolia and on Ethereum Sepolia, which Circle forwards to Arc, its relayer mints and the
# wallet claims) and usdcx-burn-l2 (Send burns from fresh Guardian wallets to the key's address on the same three
# chains, each waiting for Circle's payout there and the wallet's own confirmation). Nothing is a double: public Miden
# testnet and its faucet, the hosted Guardian, Arc Testnet, Base Sepolia, Arbitrum Sepolia, Ethereum Sepolia, Circle's
# Iris, forwarder and executor, xReserve, its attestation service and Gateway. A red payout or forward step can be
# Circle's doing rather than the wallet's, and its message says so. The runner probes every service before it builds,
# builds the extension itself for each suite and runs the browser headless.
#
# The suites burn 5 USDCx to and deposit from ONE key, so successful burn payouts replenish what deposits spend.
# The payout depends on Circle's fee for each burn. The L2 and Ethereum Sepolia deposits also pay gas in ETH,
# which is sent to the key by hand. CI has its own key, the repository
# secret USDCX_HARNESS_ARC_KEY: never a developer's harness key and never the iOS job's. In each job only the step that
# writes it to the runner's key file reads the secret; the suites read the file through the runner, and no cache or
# upload includes it.
#
# Not a per-PR gate: it spends public testnet funds and depends on services the project does not run.

on:
  workflow_dispatch:

permissions:
  contents: read
  # The linked-PR injections list a dispatched branch's open pull request and read its description.
  pull-requests: read

# Two runs would pay into and spend from the one key, which breaks each run's payout proof, so every run, from any
# branch, queues on this one group with both its jobs and none is cancelled once it started: a cancelled run can leave a
# payout that lands in the next run's window. GitHub keeps one waiting run per group, so a run still waiting when a newer
# one queues is cancelled before it starts.
concurrency:
  group: usdcx-harness-arc-key
  cancel-in-progress: false

jobs:
  chrome-usdcx-arc:
    name: USDCx E2E (Chrome, Arc Testnet)
    runs-on: warp-ubuntu-latest-x64-8x
    # The suites' own budgets come to 160 min: usdcx-in 30, usdcx-burn two tests of 35 and usdcx 60
    # (playwright.usdcx.config.ts). Each suite's preflight and build add about 5, and a cold setup about 30 (the CLI
    # compile, the Playwright browsers' 12 and apt's 6), so 205, rounded up to 210. A dispatch may first build a linked
    # web-sdk PR from source, and its CLI cold, on this runner (30 more).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 240 || 210 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cargo builds the pinned miden-client CLI the wallet fixtures use.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        # Key follows package.json so an SDK/CLI-pin bump invalidates naturally.
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      # On a dispatch from a pull request's branch these build against that pull request's linked
      # web-sdk and Guardian PRs, as its own CI does; on any other run both are no-ops.
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      # Not frozen: an injection rewrites package.json to `file:` deps the committed lockfile cannot match.
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      # With package.json's kernel pin, or a linked client or Protocol PR, this exports MIDEN_CLIENT_BIN, and the
      # runner then uses that CLI instead of installing its own.
      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli

      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos

      # No xvfb: the runner runs these suites headless. The azure apt mirror intermittently blackholes (E2E Bridge
      # has stalled ~57 min in apt-get update), so the browsers' system deps come from the canonical mirror.
      - name: Prefer the canonical Ubuntu mirror
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt, and the browser download has wedged for 2h18m in E2E Bridge. Headless runs
        # the full Chromium build, which this installs.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      # The runner creates a fresh key when this file is missing, whose payouts would leave with the runner, so the
      # step fails the job when the secret is not set.
      - name: Write the CI harness Arc key
        env:
          USDCX_HARNESS_ARC_KEY: ${{ secrets.USDCX_HARNESS_ARC_KEY }}
        run: node scripts/write-ci-harness-arc-key.mjs

      # The Arc suites in turn, narrowest first, and each only once the one before passed: a red suite can leave a
      # payout or a deposit still landing on the key, inside the next suite's payout window. Each Playwright run empties
      # test-results/, so each suite's results upload, and a burning suite's payout fees reach the job summary, before
      # the next suite starts. An upload or a summary may fail without failing the job: the Arc suites after it run only
      # when every step before them passed, and its failure is never the wallet's.
      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture
        env:
          E2E_FIXTURE_PRELAUNCH_TESTNET: ${{ (env.E2E_NETWORK == '' || env.E2E_NETWORK == 'testnet') && !startsWith(env.MIDEN_REMOTE_CONFIG_URL, 'http://') && 'true' || 'false' }}

      - name: Run usdcx-in
        id: usdcx_in
        run: node scripts/e2e-real.mjs --suite usdcx-in
      - name: Upload usdcx-in results
        if: always() && steps.usdcx_in.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: usdcx-in-e2e-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run usdcx-burn
        id: usdcx_burn
        run: node scripts/e2e-real.mjs --suite usdcx-burn
      - name: Upload usdcx-burn results
        if: always() && steps.usdcx_burn.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: usdcx-burn-e2e-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Add usdcx-burn payout fees to the job summary
        if: always() && steps.usdcx_burn.outcome != 'skipped'
        continue-on-error: true
        run: |
          if [ -f test-results/usdcx-payout-fees.md ]; then
            cat test-results/usdcx-payout-fees.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run usdcx (round trip)
        id: usdcx_round_trip
        run: node scripts/e2e-real.mjs --suite usdcx
      - name: Upload usdcx results
        if: always() && steps.usdcx_round_trip.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: usdcx-round-trip-e2e-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Add usdcx payout fees to the job summary
        if: always() && steps.usdcx_round_trip.outcome != 'skipped'
        continue-on-error: true
        run: |
          if [ -f test-results/usdcx-payout-fees.md ]; then
            cat test-results/usdcx-payout-fees.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # After the Arc job, red or green: its suites leave nothing pending on Base Sepolia, Arbitrum Sepolia or Ethereum
  # Sepolia, so a red one cannot break a proof here. Never in a cancelled run. This job's own setup guards the key: a
  # failed step skips usdcx-in-l2 and, through its condition, usdcx-burn-l2. `needs` also keeps the two jobs from
  # spending from the key at once.
  chrome-usdcx-l2:
    name: USDCx E2E (Chrome, Base, Arbitrum and Ethereum Sepolia)
    needs: chrome-usdcx-arc
    if: ${{ !cancelled() }}
    runs-on: warp-ubuntu-latest-x64-8x
    # usdcx-in-l2 three tests of 55 (25 of each wait on Circle's attestation, which can fall back to source finality)
    # and usdcx-burn-l2 three of 38 come to 279; with two preflights and builds (10) and a cold setup (30), 319, rounded
    # up to 325. A dispatch's from-source builds add 30, to 355, inside the 360 minutes this repository allows any E2E
    # USDCx job.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 355 || 325 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cargo builds the pinned miden-client CLI the wallet fixtures use.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache miden-client-cli
        # Key follows package.json so an SDK/CLI-pin bump invalidates naturally.
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miden-client
          key: miden-client-cli-${{ runner.os }}-${{ hashFiles('package.json') }}

      # On a dispatch from a pull request's branch these build against that pull request's linked
      # web-sdk and Guardian PRs, as its own CI does; on any other run both are no-ops.
      - name: Inject linked web-sdk PR
        id: inject-web-sdk
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        id: inject-guardian
        uses: ./.github/actions/inject-linked-guardian-pr

      - name: Install dependencies
        if: steps.inject-web-sdk.outputs.patched != 'true' && steps.inject-guardian.outputs.patched != 'true'
        run: yarn install --frozen-lockfile
      # Not frozen: an injection rewrites package.json to `file:` deps the committed lockfile cannot match.
      - name: Install dependencies (linked PRs injected)
        if: steps.inject-web-sdk.outputs.patched == 'true' || steps.inject-guardian.outputs.patched == 'true'
        uses: ./.github/actions/yarn-install

      # With package.json's kernel pin, or a linked client or Protocol PR, this exports MIDEN_CLIENT_BIN, and the
      # runner then uses that CLI instead of installing its own.
      - name: Install miden-client-cli
        uses: ./.github/actions/install-miden-client-cli

      - name: Drop apt repositories this repo never installs from
        uses: ./.github/actions/apt-drop-unused-repos

      # No xvfb: the runner runs these suites headless. The azure apt mirror intermittently blackholes (E2E Bridge
      # has stalled ~57 min in apt-get update), so the browsers' system deps come from the canonical mirror.
      - name: Prefer the canonical Ubuntu mirror
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt, and the browser download has wedged for 2h18m in E2E Bridge. Headless runs
        # the full Chromium build, which this installs.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      # The runner creates a fresh key when this file is missing, whose payouts would leave with the runner, so the
      # step fails the job when the secret is not set.
      - name: Write the CI harness Arc key
        env:
          USDCX_HARNESS_ARC_KEY: ${{ secrets.USDCX_HARNESS_ARC_KEY }}
        run: node scripts/write-ci-harness-arc-key.mjs

      # usdcx-in-l2 spends from the key on all three chains, and usdcx-burn-l2 proves each payout as the rise of the
      # key's balance there from a read taken right before its burn. Every deposit is mined before usdcx-in-l2's step
      # ends, so running them in this order is enough.
      - name: Start wallet eligibility fixture
        uses: ./.github/actions/start-eligibility-fixture
        env:
          E2E_FIXTURE_PRELAUNCH_TESTNET: ${{ (env.E2E_NETWORK == '' || env.E2E_NETWORK == 'testnet') && !startsWith(env.MIDEN_REMOTE_CONFIG_URL, 'http://') && 'true' || 'false' }}

      - name: Run usdcx-in-l2
        id: usdcx_in_l2
        run: node scripts/e2e-real.mjs --suite usdcx-in-l2
      - name: Upload usdcx-in-l2 results
        if: always() && steps.usdcx_in_l2.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: usdcx-in-l2-e2e-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # After a red usdcx-in-l2 too: its deposits are mined before its step ends, and a burn it broadcast but never saw
      # mined would fail usdcx-burn-l2 as key-moved, naming such a deposit. Never once a setup step failed, which
      # usdcx-in-l2 not being skipped shows.
      - name: Run usdcx-burn-l2
        id: usdcx_burn_l2
        if: ${{ !cancelled() && steps.usdcx_in_l2.outcome != 'skipped' }}
        run: node scripts/e2e-real.mjs --suite usdcx-burn-l2
      - name: Upload usdcx-burn-l2 results
        if: always() && steps.usdcx_burn_l2.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: usdcx-burn-l2-e2e-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Add usdcx-burn-l2 payout fees to the job summary
        if: always() && steps.usdcx_burn_l2.outcome != 'skipped'
        continue-on-error: true
        run: |
          if [ -f test-results/usdcx-payout-fees.md ]; then
            cat test-results/usdcx-payout-fees.md >> "$GITHUB_STEP_SUMMARY"
          fi

name: Eligibility staging workerd expected red
on:
  push:
    branches: [ci/1894-empty-body-green]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git checkout --detach 03d728db4c8af9dce8096126c780669b5d349f25 && test "$(git rev-parse HEAD)" = 03d728db4c8af9dce8096126c780669b5d349f25
      - name: Verify the missing real cache scenario
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          cat > proof/wrangler.jsonc <<'JSON'
          {"name":"eligibility-staging-proof","main":"../services/feature-eligibility/staging-topology-worker.mjs","compatibility_date":"2026-10-20","workers_dev":false,"vars":{"TOPOLOGY_BEARER":"synthetic-test-only-bearer"},"durable_objects":{"bindings":[{"name":"TOPOLOGY_CONTROL","class_name":"TopologyControl"},{"name":"ELIGIBILITY_GUARD","class_name":"EligibilityGuard"},{"name":"CALLER_GUARD","class_name":"CallerEligibilityGuard"}]},"migrations":[{"tag":"v1","new_sqlite_classes":["TopologyControl","EligibilityGuard","CallerEligibilityGuard"]}]}
          JSON
          npm install --prefix proof --no-save --ignore-scripts wrangler@4.151.3
          proof/node_modules/.bin/wrangler dev --local --config proof/wrangler.jsonc --port 18949 > proof/runtime.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent http://127.0.0.1:18949/ > /dev/null; then break; fi
            sleep 1
          done
          node --test services/feature-eligibility/staging-topology.test.mjs services/feature-eligibility/staging-topology-run.test.mjs services/feature-eligibility/staging-topology-cache.test.mjs > proof/unit.log 2>&1
          grep -F '# pass 16' proof/unit.log
          set +e
          node --test services/feature-eligibility/staging-topology-workerd.test.mjs > proof/result.log 2>&1
          status=$?
          set -e
          cat proof/result.log
          test "$status" -ne 0
          grep -F 'not ok 1 - isolated workerd cache scenario proves the real service miss and hit' proof/result.log
          grep -F '503 !== 200' proof/result.log
          grep -F '# fail 1' proof/result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eligibility-empty-body-green
          path: |
            proof/runtime.log
            proof/result.log
            proof/unit.log
            proof/wrangler.jsonc

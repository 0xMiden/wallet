name: Earn E2E (Chrome)
on:
  pull_request:
  workflow_dispatch: {}
concurrency:
  group: earn-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Runs on EVERY PR (no path filter, by choice) so a change that breaks the
  # Epoch "Earn" deposit WITHOUT touching earn paths -- an @epoch-protocol SDK
  # bump, an @miden-sdk bump, a shared-file edit -- is still caught. Runs in
  # parallel with the other CI workflows on its own runner. DEPOSIT-ONLY for now
  # (withdraw scenarios land in phase 2). earn-e2e-gate is the stable
  # required-check name.
  earn-e2e:
    name: earn-e2e (chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_NETWORK: localhost
      MIDEN_NTX_AUTH: e2e-ntx-secret
      # Baked into the app bundle at BUILD time (vite defines). The earn spec
      # starts the matching hermetic doubles at RUN time on these exact ports:
      #   - the fake Epoch allocator (quote / miden-recipient / compact /
      #     intentStatus) on :8548,
      #   - the fake Epoch positions catalog on :8549,
      #   - a local Anvil (Compact stub) the deposit's one EVM read hits on :8545.
      EPOCH_ALLOCATOR_URL: http://127.0.0.1:8548
      EPOCH_POSITIONS_URL: http://127.0.0.1:8549
      E2E_EVM_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      # Pinned exact (NOT @stable): a required gate must not drift with upstream
      # rustc -- a newer stable can reject the pinned older CLI crate and go red
      # on unrelated PRs. Bump this deliberately (and the cache key below).
      - uses: dtolnay/rust-toolchain@1.96.1
      # Foundry provides `anvil` -- the local EVM node the earn spec boots for the
      # deposit's `getForcedWithdrawalStatus` read. AnvilInstance resolves the
      # binary from PATH / ~/.foundry/bin.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Cache cargo (cli + note-transport)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ${{ runner.temp }}/note-transport/target
          # rustc pin is in the key so a toolchain bump forces a clean rebuild.
          key: earn-e2e-cargo-v1-rust1.96.1-${{ hashFiles('package.json', 'playwright/e2e/local-stack/versions.env') }}
      - run: yarn install --frozen-lockfile
      - name: Pre-install miden-client-cli (off the per-test clock)
        run: |
          # The harness auto-installs the CLI lazily on first use, but that ~7min
          # compile blows the 300s per-test timeout. Pre-install the SAME pinned
          # rev here so the harness's `miden-client --version` check short-circuits.
          # Skip when the cargo cache already restored it (else `cargo install`
          # errors "binary already exists").
          if ! command -v miden-client >/dev/null 2>&1; then
            url=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.url)")
            rev=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.rev)")
            cargo install miden-client-cli --git "$url" --rev "$rev" --locked
          fi
          miden-client --version
      - name: Start local 0.16 node (validator + sequencer + ntx-builder + prover)
        uses: ./.github/actions/run-local-node
      - name: Wait for node RPC
        working-directory: playwright/e2e/local-stack
        run: |
          probe() { timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for _ in $(seq 1 90); do
            probe 57291 && probe 50052 && echo "node(57291)+prover(50052) ready" && exit 0
            sleep 2
          done
          echo "node RPC (57291) / prover (50052) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -120
          exit 1
      - name: Start note-transport
        # The CLI-minted collateral token + the P2IDE collateral note are delivered
        # to / discovered by the wallet through the note-transport relay: on
        # localhost the wallet defaults its transport endpoint to 127.0.0.1:57292
        # (src/lib/miden-chain/constants.ts) and the CLI's `init` passes
        # `--note-transport-endpoint` from the localhost env. Without this service
        # the minted collateral never reaches the wallet balance and funding hangs.
        # (Guardian co-signer is still omitted — earn needs no co-signing.)
        run: playwright/e2e/local-stack/run-note-transport.sh
      - name: Build extension (localnet)
        run: yarn test:e2e:blockchain:build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run earn specs
        run: xvfb-run -a yarn playwright test --config playwright.earn.config.ts --retries=1
      - name: Dump stack logs on failure
        if: failure()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -400
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: earn-e2e-report
          path: test-results/
      - name: Tear down
        if: always()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml down -v || true

  # Stable required-check name: passes iff earn-e2e succeeded, fails if it
  # failed/cancelled. Mark THIS "required" in branch protection (not earn-e2e
  # directly) so the required check name stays stable if the job is renamed.
  earn-e2e-gate:
    name: earn-e2e-gate
    needs: [earn-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.earn-e2e.result }}" != "success" ]; then
            echo "earn-e2e ${{ needs.earn-e2e.result }}"; exit 1; fi
          echo "earn-e2e ok"

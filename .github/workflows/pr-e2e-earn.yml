name: Earn E2E (Chrome)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: earn-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Heavy job runs on push-to-main and workflow_dispatch, not on pull_request.
  # The workflow still triggers on PRs so earn-e2e-gate (the required check) can
  # report green when the suite is skipped.
  earn-e2e:
    name: earn-e2e (chrome)
    if: github.event_name != 'pull_request'
    # 2 vCPUs is ADEQUATE — do not "fix" this suite by chasing a larger runner.
    # That was measured twice. On this runner two consumes completed end to end in
    # 12.1s and 9.9s, and the node batched both; capping the prover's rayon pool to
    # 2 threads off-CI proves a consume in ~6s, 20x under the 120s delegated-prove
    # ceiling. The "4 prove requests, no completion line" reading that once lived
    # here was wrong: at this log level the prover emits only the
    # `Generated execution traces` INFO line, and it emitted one for each request
    # INCLUDING the two that succeeded.
    runs-on: warp-ubuntu-latest-arm64-2x
    # 120 rather than 60/75: while this branch carries `Client PR:` / `Web SDK PR:` /
    # `Guardian PR:` markers, the suite builds the miden-client CLI and the node from
    # source. That is a cold cargo build the pin-keyed cache cannot serve until one run
    # finishes and populates ~/.cargo/bin — and every run was timing out first, so the
    # cache stayed empty and every run stayed cold. Observed: 15 min for the wallet build
    # plus 59 min of client build still unfinished at the 75-minute mark. The ceiling only
    # binds on a cold build; a warm run is unaffected by raising it.
    timeout-minutes: 120
    env:
      E2E_NETWORK: localhost
      MIDEN_NTX_AUTH: e2e-ntx-secret
      # Baked into the app bundle at BUILD time (vite defines). The earn spec
      # starts the matching hermetic doubles at RUN time on these exact ports:
      #   - the fake Epoch allocator (quote / miden-recipient / compact /
      #     intentStatus) on :8548,
      #   - the fake Epoch positions catalog on :8549,
      #   - a local Anvil (Compact stub) the deposit's one EVM read hits on :8545.
      EPOCH_ALLOCATOR_URL: http://127.0.0.1:8548
      EPOCH_POSITIONS_URL: http://127.0.0.1:8549
      E2E_EVM_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Pinned exact (NOT @stable): a required gate must not drift with upstream
      # rustc -- a newer stable can reject the pinned older CLI crate and go red
      # on unrelated PRs. Bump this deliberately (and the cache key below).
      - uses: dtolnay/rust-toolchain@1.98.1
      # Foundry provides `anvil` -- the local EVM node the earn spec boots for the
      # deposit's `getForcedWithdrawalStatus` read. AnvilInstance resolves the
      # binary from PATH / ~/.foundry/bin.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
      # The cargo cache is SHARED by every E2E workflow and warmed on main
      # (.github/workflows/warm-e2e-cargo-cache.yml), so a PR restores it instead
      # of spending ~12 min rebuilding binaries that are byte-identical across
      # jobs. Keyed on what actually determines those binaries - the rustc pin
      # and the pinned miden-client-cli rev - NOT on all of
      # package.json, which changes on most PRs for unrelated reasons and used to
      # bust this cache every time.
      - name: Compute shared cargo cache key
        id: cargo_cache_key
        run: |
          rev=$(node -p "require('./package.json').midenClientCliGit.rev")
          url=$(node -p "require('./package.json').midenClientCliGit.url")
          ver=$(node -p "require('./package.json').midenClientCliVersion ?? ''")
          pins=$(printf '%s|%s|%s' "$url" "$rev" "$ver" | sha256sum | cut -c1-16)
          if [ "${{ runner.arch }}" = X64 ]; then
            namespace=miden-e2e-cargo-v2
          else
            namespace=miden-e2e-cargo-v3-${{ runner.arch }}
          fi
          echo "key=$namespace-rust1.98.1-cli-$pins" >> "$GITHUB_OUTPUT"
      - name: Cache cargo (cli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          # rustc pin is in the key so a toolchain bump forces a clean rebuild.
          key: ${{ steps.cargo_cache_key.outputs.key }}
      # These suites drive a real extension build, so they need the same unreleased
      # dependencies the compile surfaces do: the fee APIs from the linked web-sdk PR and
      # `resolveAuthArg` from the linked guardian PR. Without them the suite builds against
      # the published packages and fails on missing exports — which reads as a product
      # failure rather than an unshipped dependency. Both are no-ops when the PR body
      # carries no marker.
      - name: Inject linked web-sdk PR
        uses: ./.github/actions/inject-linked-web-sdk-pr
      - name: Inject linked guardian PR
        uses: ./.github/actions/inject-linked-guardian-pr
      # Plain `yarn install`: the injections rewrite package.json to `file:` deps, which the
      # committed lockfile cannot match, so `--frozen-lockfile` would fail by construction.
      - name: Run Install
        uses: ./.github/actions/yarn-install
      - name: Pre-install miden-client-cli (off the per-test clock)
        # The harness auto-installs the CLI lazily on first use, but that ~7min compile
        # blows the 300s per-test timeout, so it is pre-installed here. The action also
        # rebuilds it against a linked Protocol PR when the PR carries one: the CLI
        # EXECUTES AND PROVES transactions client-side, so an unpatched one dies inside
        # its own local execution with a bare `x assert` that the harness misreports as
        # a drained chain. No marker, no rebuild, and nothing about this step changes.
        uses: ./.github/actions/install-miden-client-cli
      - name: Start local 0.16 node (validator + sequencer + ntx-builder + prover)
        uses: ./.github/actions/run-local-node
        with:
          # Deposit/withdraw assertions are re-derived for a fee leaving the account.
          # Verified locally against a fee-charging chain.
          verification-base-fee: '10000'
      - name: Wait for node RPC
        working-directory: playwright/e2e/local-stack
        run: |
          probe() { timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for _ in $(seq 1 90); do
            probe 57291 && probe 50052 && echo "node(57291)+prover(50052) ready" && exit 0
            sleep 2
          done
          echo "node RPC (57291) / prover (50052) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -120
          exit 1
      - name: Bring up guardian
        working-directory: playwright/e2e/local-stack
        run: |
          for attempt in 1 2 3; do
            docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian up -d guardian && exit 0
            echo "guardian bring-up attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          exit 1
      - name: Start note-transport
        # The CLI-minted collateral token + the P2IDE collateral note are delivered
        # to / discovered by the wallet through the note-transport relay: on
        # localhost the wallet defaults its transport endpoint to 127.0.0.1:57292
        # (src/lib/miden-chain/constants.ts) and the CLI's `init` passes
        # `--note-transport-endpoint` from the localhost env. Without this service
        # the minted collateral never reaches the wallet balance and funding hangs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: playwright/e2e/local-stack/run-note-transport.sh
      - name: Build extension (localnet)
        run: yarn test:e2e:blockchain:build
      - name: Install xvfb
        # The azure apt mirror intermittently blackholes: runs have stalled ~57 min
        # inside `apt-get update`, been killed by the job cap, and produced no test
        # results. Prefer the canonical mirror, bound + retry fetches, cap the step.
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y xvfb
      - name: Install Playwright browser
        # `--with-deps` shells out to apt, and the browser download itself has
        # wedged for 2h18m. Cap it so a stall fails fast instead of eating the job.
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Wait for guardian
        working-directory: playwright/e2e/local-stack
        run: |
          for _ in $(seq 1 120); do
            curl -s -o /dev/null -m 2 "http://127.0.0.1:3000/" && echo "guardian(3000) ready" && exit 0
            sleep 2
          done
          echo "guardian HTTP (3000) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian logs --no-color | tail -150
          exit 1
      - name: Run earn specs
        run: xvfb-run -a yarn playwright test --config playwright.earn.config.ts --retries=1
      - name: Report flaky (retried-then-passed) specs
        # A spec that failed once and passed on the retry above is reported as a
        # plain green run, so the flake it represents is invisible. Print one
        # FLAKY line per such spec from the JSON report so the flake rate can be
        # read off the log / tracked over time. Diagnostic only -- never fails.
        if: always()
        run: node scripts/report-flaky-e2e.mjs test-results/results.json
      - name: Dump local node logs on failure
        if: failure()
        uses: ./.github/actions/dump-local-node-logs

      - name: Dump stack logs on failure
        if: failure()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian logs --no-color | tail -400
      - uses: actions/upload-artifact@v4
        # Keep the screenshot filmstrip only on main-push runs (the record);
        # on PRs, upload only when the run failed (debug artifact, as before).
        if: ${{ github.event_name == 'push' || failure() }}
        with:
          name: earn-e2e-report
          path: test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian down -v || true

  # Stable required-check name. On PRs the heavy job is skipped and this still
  # reports success so branch protection is not blocked. On main it requires
  # earn-e2e to have succeeded.
  earn-e2e-gate:
    name: earn-e2e-gate
    needs: [earn-e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      - run: |
          RESULT="${{ needs.earn-e2e.result }}"
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = pull_request ]; then
            [ "$RESULT" = skipped ] || { echo "earn-e2e $RESULT on PR, expected skipped"; exit 1; }
            echo "earn-e2e skipped on PR"
          else
            [ "$RESULT" = success ] || { echo "earn-e2e $RESULT"; exit 1; }
            echo "earn-e2e ok"
          fi

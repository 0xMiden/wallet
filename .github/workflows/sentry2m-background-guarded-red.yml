        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind frozen checkpoint and sole workflow addition
        id: source
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged source python3 "$PROOF_DIR/proof-tools.py" source

      - name: Setup Node22

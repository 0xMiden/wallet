name: NEVER-MERGE Sentry2M background guarded expected red

on:
  push:
    branches: [ci/sentry2m-background-red]

permissions:
  contents: read

jobs:
  guarded-background-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PROOF_HEAD_SHA: ${{ github.sha }}
      PROOF_REF: ${{ github.ref }}
      PROOF_EVENT: ${{ github.event_name }}
      PROOF_REPOSITORY: ${{ github.repository }}
      PROOF_WORKFLOW_REF: ${{ github.workflow_ref }}
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_RUN_ID: ${{ github.run_id }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Initialize immutable private proof packet
        id: initialize
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="$RUNNER_TEMP/sentry2m-background-red"
          printf 'PROOF_DIR=%s\n' "$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir "$PROOF_DIR"
          cat > "$PROOF_DIR/run-logged.bash" <<'LOGGER_SOURCE'
          run_logged() {
            local label="$1"
            shift
            python3 "$PROOF_DIR/proof-tools.py" command-start "$label" "$@"
            if [ -e "$PROOF_DIR/$label.log" ]; then return 91; fi
            printf 'Running %s\n' "$label" > "$PROOF_DIR/$label.log"
            set +e
            "$@" 2>&1 | tee -a "$PROOF_DIR/$label.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "$PROOF_DIR/$label.exit"
            printf '%s\n' "${statuses[1]}" > "$PROOF_DIR/$label.tee.exit"
            python3 "$PROOF_DIR/proof-tools.py" command-end "$label" "${statuses[0]}" "${statuses[1]}"
            if [ "${statuses[1]}" -ne 0 ]; then return "${statuses[1]}"; fi
            return "${statuses[0]}"

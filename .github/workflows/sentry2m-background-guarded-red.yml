              try:
                  record['head'] = value('rev-parse', 'HEAD')
                  record['head_tree'] = value('rev-parse', 'HEAD^{tree}')
                  entries = tree('HEAD')
                  record['committed_entries'] = entries
                  for name, entry in entries.items():

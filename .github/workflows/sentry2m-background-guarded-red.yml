          def seal():
              inventory = {}
              for path in sorted(proof.rglob('*')):
                  if path.is_file() and not path.is_symlink() and not path.name.startswith('seal.'):
                      data = path.read_bytes()
                      inventory[path.relative_to(proof).as_posix()] = {'bytes': len(data), 'sha256': digest(data)}
              save('pre-upload-seal.json', {'at': now(), 'files': inventory,

          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged jest yarn jest --runTestsByPath src/lib/extension/notifications.test.ts src/components/NoteToastProvider.test.tsx src/lib/miden/back/background-notification.test.ts --runInBand --coverage=false --no-colors --json --outputFile="$PROOF_DIR/jest.json"

      - name: Always capture final complete source modes and index
        id: final
        if: ${{ always() }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged final python3 "$PROOF_DIR/proof-tools.py" final

      - name: Inspect exact boundaries but keep rendering acceptance closed
        id: validate
        if: ${{ always() }}
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          TOOLS2_OUTCOME: ${{ steps.tools2.outcome }}
          TOOLS3_OUTCOME: ${{ steps.tools3.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PREPARED_OUTCOME: ${{ steps.prepared.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          SHELL_OUTCOME: ${{ steps.shell.outcome }}
          JEST_OUTCOME: ${{ steps.jest.outcome }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="${PROOF_DIR:-$RUNNER_TEMP/sentry2m-background-red}"
          source "$PROOF_DIR/run-logged.bash"
          run_logged validate python3 "$PROOF_DIR/proof-tools.py" validate

      - name: Seal only existing evidence before upload
        id: seal
        if: ${{ always() }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged seal python3 "$PROOF_DIR/proof-tools.py" seal

      - name: Always retain raw evidence for root archive and API acceptance
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sentry2m-background-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sentry2m-background-red
          if-no-files-found: error
          retention-days: 7


          def canonical(data):
              return json.dumps(data, sort_keys=True, ensure_ascii=True, separators=(',', ':')).encode()
          
          
          def save(name, data):
              with (proof / name).open('x') as target:
                  target.write(json.dumps(data, indent=2, ensure_ascii=True) + '\n')
          
          
          def now():
              return datetime.now(timezone.utc).isoformat()
          
          
          def git(*args):
              return subprocess.check_output(['git', *args], env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'})
          
          
          def value(*args):
              return git(*args).decode().strip()
          
          
          def tree(ref):
              result = {}
              for record in git('ls-tree', '-r', '-z', ref).split(b'\0'):
                  if record:
                      entry, name = record.split(b'\t', 1)
                      result[name.decode()] = entry.decode().split()
              return result
          
          
          def frozen_source(entries):
              oids = [entry[2] for entry in entries.values()]
              raw = subprocess.check_output(['git', 'cat-file', '--batch'], input=('\n'.join(oids) + '\n').encode())
              cursor = 0
              result = {}
              for name, entry in entries.items():
                  end = raw.index(b'\n', cursor)
                  oid, kind, size = raw[cursor:end].decode().split()
                  size = int(size)
                  data = raw[end + 1:end + 1 + size]
                  assert [entry[2], 'blob'] == [oid, kind] and len(data) == size
                  result[name] = {'entry': entry, 'bytes': size, 'sha256': digest(data)}
                  cursor = end + size + 2
              assert cursor == len(raw)
              return result
          
          
          def snapshot(label):
              record = {'at': now(), 'cwd': str(Path.cwd()), 'errors': [], 'complete': False,

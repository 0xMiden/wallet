                   'limits': 'Inventory only. Does not attest its own future logs/exits, upload, API result, archive integrity or root acceptance.',
                   'actual_red_acceptance': 'CLOSED', 'production_background_fix_gate': 'CLOSED', 'merge': 'NEVER'})

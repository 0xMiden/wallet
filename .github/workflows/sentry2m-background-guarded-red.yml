                  assert manifest['source_entry_map'] == tree(BINDINGS['source']) and manifest['checkout_entry_map'] == tree('HEAD')
                  assert manifest['proof_tools_sha256'] == digest(Path(__file__).read_bytes())
                  assert manifest['runner_helper_sha256'] == digest((proof / 'run-logged.bash').read_bytes())
                  assert manifest['workflow_sha256'] == digest(Path(BINDINGS['workflow']).read_bytes())
                  assert json.loads((proof / 'bindings.json').read_text()) == BINDINGS
                  assert digest(canonical(json.loads((proof / 'source-entry-map.json').read_text()))) == BINDINGS['source_entry_map_sha256']
                  assert frameworks(False) == json.loads((proof / 'framework-identity.json').read_text())
                  result = checked_result()

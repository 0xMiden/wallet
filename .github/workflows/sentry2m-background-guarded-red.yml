                          path = Path(name)
                          observed = path.lstat()
                          if entry[0] == '120000':
                              assert stat.S_ISLNK(observed.st_mode), 'Symlink type changed'
                              data = os.fsencode(os.readlink(path))
                          else:
                              assert entry[0] in ['100644', '100755'] and stat.S_ISREG(observed.st_mode), 'File type changed'
                              assert bool(observed.st_mode & 0o111) == (entry[0] == '100755'), 'Executable mode changed'
                              data = path.read_bytes()
                          record['working_entries'][name] = {
                              'entry': entry, 'bytes': len(data), 'sha256': digest(data),
                              'physical_mode': stat.S_IMODE(observed.st_mode),
                              'blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
                      except Exception as error:
                          record['errors'].append({'path': name, 'reason': str(error)})
                  raw_stage = git('ls-files', '--stage', '-z')
                  (proof / (label + '.index-stage.bin')).write_bytes(raw_stage)
                  for item in raw_stage.split(b'\0'):
                      if item:
                          metadata, name = item.split(b'\t', 1)
                          record['index_entries'].append([name.decode(), *metadata.decode().split()])
                  index = Path(value('rev-parse', '--git-path', 'index'))
                  assert index.is_file() and not index.is_symlink(), 'Missing or symlinked index'
                  raw_index = index.read_bytes()
                  (proof / (label + '.index.bin')).write_bytes(raw_index)
                  record['index_sha256'] = digest(raw_index)
                  record['index_stage_sha256'] = digest(raw_stage)
                  record['status'] = value('status', '--porcelain=v1', '--untracked-files=all')
                  record['complete'] = not record['errors'] and len(record['working_entries']) == len(entries)
              except Exception as error:
                  record['errors'].append({'reason': str(error)})
              finally:
                  save(label + '.map.json', record)
              return record
          
          
          def check_snapshot(label):
              record = json.loads((proof / (label + '.map.json')).read_text())
              baseline = json.loads((proof / 'source-clean.map.json').read_text())
              manifest = json.loads((proof / 'source-and-checkout.json').read_text())
              entries = manifest['checkout_entry_map']
              assert record['complete'] and not record['errors'], 'Incomplete snapshot: ' + label
              assert record['head'] == manifest['checkout_commit'] and record['head_tree'] == manifest['checkout_tree']
              assert record['committed_entries'] == entries, 'Committed source drift'
              assert sorted(record['index_entries']) == sorted([name, entry[0], entry[2], '0'] for name, entry in entries.items()), 'Index stage drift'
              assert set(record['working_entries']) == set(entries), 'Incomplete source entries'
              assert all(item['entry'] == entries[name] and item['blob'] == entries[name][2]
                         for name, item in record['working_entries'].items()), 'Source bytes changed'
              assert record['working_entries'] == baseline['working_entries'], 'Physical modes or source changed'
              assert not record['status'], 'Dirty source or untracked files'
              assert digest((proof / (label + '.index.bin')).read_bytes()) == record['index_sha256']
              assert digest((proof / (label + '.index-stage.bin')).read_bytes()) == record['index_stage_sha256']
              return digest((proof / (label + '.map.json')).read_bytes())
          
          
          def identity():
              keys = ['HEAD_SHA', 'REF', 'EVENT', 'REPOSITORY', 'WORKFLOW_REF', 'WORKFLOW_SHA', 'RUN_ID', 'RUN_ATTEMPT']
              save('run-identity.json', {key: os.environ['PROOF_' + key] for key in keys})
              save('bindings.json', BINDINGS)
              print('Recorded run identity; actual result and root acceptance remain unaccepted')
          
          
          def source():
              snapshot('source-clean')
              head = value('rev-parse', 'HEAD')
              before, after = tree(BINDINGS['source']), tree(head)
              frozen = frozen_source(before)
              save('source-entry-map.json', frozen)
              manifest = {**BINDINGS, 'source_commit': BINDINGS['source'],
                          'checkout_commit': head, 'checkout_tree': value('rev-parse', 'HEAD^{tree}'),
                          'source_entry_map': before, 'checkout_entry_map': after,
                          'workflow_sha256': digest(Path(BINDINGS['workflow']).read_bytes()),
                          'proof_tools_sha256': digest(Path(__file__).read_bytes()),
                          'runner_helper_sha256': digest((proof / 'run-logged.bash').read_bytes())}
              save('source-and-checkout.json', manifest)
              for label, ref in [('source', BINDINGS['source']), ('source-parent', BINDINGS['source_parent']), ('checkout', head)]:
                  (proof / (label + '-commit.txt')).write_bytes(git('cat-file', 'commit', ref))
                  (proof / (label + '-tree.txt')).write_bytes(git('ls-tree', '-r', ref))
              (proof / 'workflow-only.diff').write_bytes(git('diff', '--binary', BINDINGS['source'], head))
              (proof / 'test-only.diff').write_bytes(git('diff', '--binary', BINDINGS['source_parent'], BINDINGS['source']))
              assert head == os.environ['PROOF_HEAD_SHA'] == os.environ['PROOF_WORKFLOW_SHA'], 'Head/event/workflow mismatch'
              assert os.environ['PROOF_REPOSITORY'] == BINDINGS['repository'], 'Repository mismatch'
              assert os.environ['PROOF_EVENT'] == 'push' and os.environ['PROOF_REF'] == 'refs/heads/' + BINDINGS['branch']
              assert os.environ['PROOF_WORKFLOW_REF'] == BINDINGS['repository'] + '/' + BINDINGS['workflow'] + '@' + os.environ['PROOF_REF']
              assert all(re.fullmatch(r'[1-9][0-9]*', os.environ['PROOF_' + key]) for key in ['RUN_ID', 'RUN_ATTEMPT'])
              assert value('rev-parse', BINDINGS['source'] + '^{tree}') == BINDINGS['source_tree']
              assert value('rev-parse', BINDINGS['source_parent'] + '^{tree}') == BINDINGS['source_parent_tree']
              assert value('rev-list', '--parents', '-n', '1', head).split() == [head, BINDINGS['source']], 'Direct transport parent required'
              assert value('rev-list', '--parents', '-n', '1', BINDINGS['source']).split() == [BINDINGS['source'], BINDINGS['source_parent']]
              assert digest(canonical(frozen)) == BINDINGS['source_entry_map_sha256'], 'Frozen source byte/mode map changed'
              assert len(before) == BINDINGS['source_entries'] and all(after.get(name) == entry for name, entry in before.items())
              assert set(after) - set(before) == {BINDINGS['workflow']} and len(after) == len(before) + 1, 'Sole addition required'
              assert after[BINDINGS['workflow']][:2] == ['100644', 'blob']
              assert digest(git('cat-file', 'commit', BINDINGS['source'])) == BINDINGS['source_commit_sha256']
              assert digest((proof / 'test-only.diff').read_bytes()) == BINDINGS['test_only_git_diff_sha256']
              for name, suite in BINDINGS['suites'].items():
                  assert digest(Path(name).read_bytes()) == suite['sha256'] and not Path(name).is_symlink()
              lines = Path(BINDINGS['regression_path']).read_text().splitlines()
              for site in BINDINGS['failure_sites'].values():
                  assert lines[site['line'] - 1] == site['source'], 'Authored assertion changed'
              check_snapshot('source-clean')
              print('Verified complete frozen source, signed checkpoint bytes, sole workflow addition and exact push provenance')
          
          
          def frameworks(capture):
              observed = {}
              for name, binding in BINDINGS['framework_files'].items():
                  path = Path('node_modules') / name
                  assert path.is_file() and not path.is_symlink(), 'Missing dependency: ' + name
                  data = path.read_bytes()
                  retained = 'framework/' + name
                  if capture:
                      target = proof / retained
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open('xb') as output:
                          output.write(data)
                  assert (proof / retained).read_bytes() == data, 'Retained/runtime framework mismatch: ' + name
                  assert digest(data) == binding['sha256'] and len(data) == binding['bytes'], 'Pinned framework drift: ' + name
                  if name.endswith('/package.json'):
                      assert json.loads(data)['version'] == binding['version'], 'Framework version changed'
                  observed[name] = {'sha256': digest(data), 'bytes': len(data), 'retained': retained}
              return observed
          
          
          def prepared():
              snapshot('prepared')
              check_snapshot('prepared')
              save('framework-identity.json', frameworks(True))
              assert digest(Path('yarn.lock').read_bytes()) == BINDINGS['source_lock_sha256']
              save('tool-versions.json', {name: subprocess.check_output([name, '--version'], text=True).strip() for name in ['node', 'yarn']})
              print('Verified post-install snapshot and exact pinned matcher/serializer/formatter source bytes and versions')
          
          
          def plain(value):
              assert type(value) is str
              return re.sub(r'\x1b\[[0-9;]*m', '', value)
          
          
          def checked_result():
              result = json.loads((proof / 'jest.json').read_text())
              observed, failures = {}, {}
              for suite in result['testResults']:
                  name = Path(suite['name']).relative_to(Path.cwd()).as_posix()
                  assert name in BINDINGS['suites'] and name not in observed, 'Unexpected/duplicate suite'
                  binding = BINDINGS['suites'][name]
                  cases = suite['assertionResults']
                  names = sorted(case['fullName'] for case in cases)
                  assert len(names) == len(set(names)) == binding['count'] and names == sorted(binding['names']), 'Case inventory changed'
                  assert digest(Path(name).read_bytes()) == binding['sha256']
                  failed = []
                  for case in cases:
                      title = case['fullName']
                      assert case['failing'] is False and case['invocations'] == 1 and case['retryReasons'] == [], 'Retry/failing-test modifier'
                      site = BINDINGS['failure_sites'].get(title)
                      if site is None:
          PROOF_SOURCE_2

      - name: Retain proof helper source part 3
        id: tools3
        run: |
          set -euo pipefail
          umask 077
          cat >> "$PROOF_DIR/proof-tools.py" <<'PROOF_SOURCE_3'
                          assert case['status'] == 'passed' and case['failureMessages'] == case['failureDetails'] == [], 'Control failure/skip'
                          continue
                      assert name == BINDINGS['regression_path'] and case['status'] == 'failed'
                      assert len(case['failureMessages']) == len(case['failureDetails']) == 1
                      assert case['numPassingAsserts'] == site['prior_passing_assertions'], 'Wrong first failing assertion'
                      detail = case['failureDetails'][0]
                      assert type(detail) is dict and set(detail) == {'matcherResult'}, 'Frozen circus structured-detail shape changed'
                      matcher = detail['matcherResult']
                      assert type(matcher) is dict and set(matcher) == {'message', 'pass'}, 'Unexpected matcher factory schema'
                      assert matcher['pass'] is site['matcher_pass'], 'Wrong negation/factory pass value'
                      message, raw = plain(matcher['message']), plain(case['failureMessages'][0])
                      assert raw.startswith('Error: ' + message + '\n'), 'Raw and structured matcher text disagree'
                      outer = raw[len('Error: ' + message):]
                      frames = re.split(r'\n\s+at ', outer)
                      assert frames[0] == '' and len(frames) >= 2, 'Missing outer assertion stack'
                      first = frames[1].strip()
                      frame_pattern = r'^[^\n]*\(' + re.escape(str(Path.cwd() / name)) + ':' + str(site['line']) + r':' + str(site['column']) + r'\)$'
                      assert re.fullmatch(frame_pattern, first), 'Wrong first authored assertion frame'
                      if site['matcher'] == 'toHaveBeenCalledTimes':
                          assert message == site['canonical_message'], 'Wrong exact called-times expected1/received0 rendering'
                      else:
                          assert message.startswith(site['canonical_header']), 'Wrong toThrow matcher/type/source-error header'
                          rendered = message[len(site['canonical_header']):]
                          assert rendered.strip(), 'Missing pinned toThrow formatted source/stack'
                          assert site['throw_source'] in rendered, 'Wrong thrown fixture source frame'
                          assert re.search(r'\b' + re.escape(name) + ':' + str(site['throw_line']) + r':' + str(site['throw_column']) + r'\)', rendered), 'Wrong first throw source site'
                      failures[title] = {'assertion_line': site['line'], 'first_authored_frame': first,
                                         'passing_assertions_before_failure': case['numPassingAsserts'],
                                         'matcher_factory_pass': matcher['pass'], 'matcher_message_sha256': digest(message.encode()),
                                         'raw_failure_sha256': digest(case['failureMessages'][0].encode()),
                                         'strict_rendering_accepted': False,
                                         'later_assertion_credit': False}
                      failed.append(title)
                  expected_status = 'failed' if failed else 'passed'
                  assert suite['status'] == expected_status
                  assert bool(suite['message']) == bool(failed), 'Suite setup/runtime message mismatch'
                  observed[name] = {'total': len(cases), 'passed': len(cases) - len(failed), 'failures': failed}
              assert set(observed) == set(BINDINGS['suites']) and set(failures) == set(BINDINGS['failure_sites'])
              assert (result['numTotalTestSuites'], result['numFailedTestSuites'], result['numPassedTestSuites']) == (3, 1, 2)
              assert (result['numTotalTests'], result['numFailedTests'], result['numPassedTests']) == (33, 2, 31)
              assert all(result[key] == 0 for key in ['numPendingTestSuites', 'numPendingTests', 'numTodoTests', 'numRuntimeErrorTestSuites'])
              assert result['success'] is False and result['wasInterrupted'] is False and result['openHandles'] == []
              return {'total': 33, 'passed': 31, 'failed': 2, 'suites': observed, 'failure_boundaries': failures,
                      'acceptance': 'CLOSED_PENDING_EXACT_SYNCHRONOUS_RENDERING_PROOF'}
          
          
          def command_record(start):
              label = sys.argv[2]
              assert label in [*BINDINGS['logged_commands'], 'identity', 'validate', 'seal']
              if start:
                  save(label + '.command-start.json', {'at': now(), 'cwd': str(Path.cwd()), 'argv': sys.argv[3:],
                       'executable': shutil.which(sys.argv[3]), 'run_id': os.environ['PROOF_RUN_ID'],
                       'run_attempt': os.environ['PROOF_RUN_ATTEMPT'], 'head': os.environ['PROOF_HEAD_SHA']})
              else:
                  save(label + '.command-end.json', {'at': now(), 'cwd': str(Path.cwd()),
                       'exit': int(sys.argv[3]), 'tee_exit': int(sys.argv[4]),
                       'log_sha256': digest((proof / (label + '.log')).read_bytes()),
                       'log_bytes': (proof / (label + '.log')).stat().st_size})
          
          
          def expected_argv(label):
              files = BINDINGS['named_ts_files']
              commands = {
                  'identity': ['python3', str(proof / 'proof-tools.py'), 'identity'],
                  'source': ['python3', str(proof / 'proof-tools.py'), 'source'],
                  'install': ['timeout', '10m', 'yarn', 'install', '--frozen-lockfile', '--non-interactive'],
                  'prepared': ['python3', str(proof / 'proof-tools.py'), 'prepared'],
                  'format': ['yarn', 'prettier', '--check', 'CHANGELOG.md', *files],
                  'eslint': ['yarn', 'eslint', '--max-warnings', '0', *files],
                  'typescript': ['yarn', 'tsc', '--noEmit', '--pretty', 'false'],
                  'shellsource': ['python3', str(proof / 'proof-tools.py'), 'shell-source'],
                  'shell': ['bash', '-n', str(proof / 'workflow-run-blocks.bash')],
                  'jest': ['yarn', 'jest', '--runTestsByPath', *BINDINGS['suites'], '--runInBand', '--coverage=false', '--no-colors', '--json', '--outputFile=' + str(proof / 'jest.json')],
                  'final': ['python3', str(proof / 'proof-tools.py'), 'final'],
                  'validate': ['python3', str(proof / 'proof-tools.py'), 'validate'],
                  'seal': ['python3', str(proof / 'proof-tools.py'), 'seal']}
              return commands[label]
          
          
          def check_command(label):
              start = json.loads((proof / (label + '.command-start.json')).read_text())
              end = json.loads((proof / (label + '.command-end.json')).read_text())
              assert start['argv'] == expected_argv(label) and start['cwd'] == end['cwd'] == str(Path.cwd()), 'Command identity changed'
              assert start['head'] == os.environ['PROOF_HEAD_SHA'] and start['run_id'] == os.environ['PROOF_RUN_ID'] and start['run_attempt'] == os.environ['PROOF_RUN_ATTEMPT']
              assert datetime.fromisoformat(start['at']) <= datetime.fromisoformat(end['at'])
              assert end['exit'] == (1 if label == 'jest' else 0) and end['tee_exit'] == 0, 'Wrong natural command/tee exit'
              assert (proof / (label + '.exit')).read_text() == str(end['exit']) + '\n'
              assert (proof / (label + '.tee.exit')).read_text() == str(end['tee_exit']) + '\n'
              log = (proof / (label + '.log')).read_bytes()
              assert digest(log) == end['log_sha256'] and len(log) == end['log_bytes'] and log, 'Log missing/changed'
          
          
          def shell_source():
              text = Path(BINDINGS['workflow']).read_text()
              blocks, current = [], None
              for line in text.splitlines(keepends=True):
                  if line == '        run: |\n':
                      current = []
                      blocks.append(current)
                  elif current is not None and (line.startswith('          ') or not line.strip()):
                      current.append(line[10:] if line.startswith('          ') else line)
                  else:
                      current = None
              assert len(blocks) == len(BINDINGS['outcomes']), 'Missing workflow run blocks'
              with (proof / 'workflow-run-blocks.bash').open('x') as target:
                  target.write('\n'.join(''.join(block) for block in blocks))
              print('Extracted all literal workflow shell blocks for independent syntax-only gate')
          
          
          def validate():
              validation = {'status': 'INVALID', 'production_background_fix_gate': 'CLOSED', 'actual_red_acceptance': 'CLOSED',
                            'root_api_archive_acceptance': 'UNRUN', 'future_upload': 'NOT_ATTESTED', 'merge': 'NEVER'}
              outcomes = {name: os.environ.get(name.upper() + '_OUTCOME', 'missing') for name in BINDINGS['outcomes']}
              save('step-outcomes.json', outcomes)
              required = ['run-identity.json', 'bindings.json', 'run-logged.bash', 'proof-tools.py', 'source-and-checkout.json',
                          'source-entry-map.json', 'source-commit.txt', 'source-parent-commit.txt', 'checkout-commit.txt',
                          'source-tree.txt', 'source-parent-tree.txt', 'checkout-tree.txt', 'workflow-only.diff', 'test-only.diff',
                          'framework-identity.json', 'tool-versions.json', 'workflow-run-blocks.bash', 'jest.json']
              required += ['framework/' + name for name in BINDINGS['framework_files']]
              required += [label + suffix for label in ['identity', *BINDINGS['logged_commands']]
                           for suffix in ['.log', '.exit', '.tee.exit', '.command-start.json', '.command-end.json']]
              required += [label + suffix for label in ['source-clean', 'prepared', 'final-clean', 'validator-clean']
                           for suffix in ['.map.json', '.index.bin', '.index-stage.bin']]
              try:
                  snapshot('validator-clean')
                  missing = [name for name in required if not (proof / name).is_file() or not (proof / name).stat().st_size]
                  save('evidence-completeness.json', {'at': now(), 'required': required, 'missing_or_empty': missing,
                       'future_validation_exit_and_upload': 'Root must independently inspect after archive download'})
                  assert not missing, 'Incomplete evidence: ' + repr(missing)
                  for name, outcome in outcomes.items():

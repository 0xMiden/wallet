          4be330298b3f7c17f7b63fcedd94688c11d5a34f7d52cb7cd04348d3379f99bf  patches/vaul+1.1.2.patch
          INPUTS
          test "$(stat -c '%a' packages/dapp-browser/package.json)" = 755
          sha256sum --check <<'STATIC'

name: Mutation reporter regression RED
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact qualification QA commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  reporter-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind immutable source and minimal payload
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          mkdir -p "$RUNNER_TEMP/reporter-proof"
          printf 'source=%s\nrun=%s\nattempt=%s\npurpose=expected functional reporter RED, not semantic adoption\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/reporter-proof/provenance.txt"
          cd .github/qa/mutation-reporter-qualification
          sha256sum -c SHA256SUMS | tee "$RUNNER_TEMP/reporter-proof/source-checksums.txt"
          cp SHA256SUMS "$RUNNER_TEMP/reporter-proof/SHA256SUMS"
      - name: Observe the predicted reporter failure
        run: |
          set -uo pipefail
          cd .github/qa/mutation-reporter-qualification
          bash baseline/tests/run-tests.sh mutate_qualification_reporter_prediction_red \
            2>&1 | tee "$RUNNER_TEMP/reporter-proof/functional-red.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$RUNNER_TEMP/reporter-proof/actual-test-exit.txt"
          exit "$rc"
      - name: Preserve actual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reporter-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reporter-proof
          if-no-files-found: error
          retention-days: 14

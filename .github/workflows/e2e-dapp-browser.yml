name: '2147 M two-guard expected assertion RED reference'

# Isolated orphan QA transport; this registered filename runs no native E2E jobs.
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact reviewed QA transport commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  m-guard-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
    steps:
      - name: Bind manual dispatch to the reviewed QA branch and SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/qa/2147-m-guard-red1-33431-20261116
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # wallet main pin
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify orphan scope, modes and payload hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git show -s --format=%P HEAD)"
          expected=$(cat <<'FILES'
          .github/workflows/e2e-dapp-browser.yml
          source-after.sha256
          source-before.sha256
          source-overlay.patch
          FILES
          )
          test "$(git ls-tree -r --name-only HEAD | LC_ALL=C sort)" = "$expected"
          test "$(git ls-tree -r --format='%(objectmode)' HEAD | LC_ALL=C sort -u)" = 100644
          sha256sum --check <<'PAYLOAD'
          d1f4cea9fe123d126efff2858225f4c7227a74b8815044f9ff448b25c8a10054  source-overlay.patch
          bd6361d04817bf2774793ecbd6d8ddc7328c71eef0c1562ed8370e0b51bcdc0c  source-before.sha256
          00be382ae8cbc54e028bf3cc63dd3faf757a51752735cc82e363aab63ab3df2f  source-after.sha256
          PAYLOAD

      - name: Check out approved public wallet baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # wallet main pin
        with:
          repository: 0xMiden/wallet
          ref: 75bbe564302c1b8aff9138dc0b9c1e3a59f72daf
          fetch-depth: 2
          path: wallet
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Ordinary frozen install on unchanged public baseline
        working-directory: wallet
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 75bbe564302c1b8aff9138dc0b9c1e3a59f72daf
          test "$(git rev-parse 'HEAD^{tree}')" = 582bba55736e65aaa668755abf07676f9ed38a94
          test "$(git show -s --format=%P HEAD)" = bb7392f1b88823965c956a283c561f494351136a
          test -z "$(git status --porcelain --untracked-files=all)"
          sha256sum --check <<'INPUTS'
          1023476b177f3c1c8dca8cb1451b59709044c0d8ec290c2a530f02905028008e  package.json
          d179f23b11f83eaac87ec445039d80fb4b563cf28b4c6fb0d0a2069936af7f6b  yarn.lock

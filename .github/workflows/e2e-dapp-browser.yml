      - name: Upload only two reviewed regular public synthetic outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # public v4, parent metadata
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            wallet/coverage/coverage-final.json
            wallet/coverage/test-count.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false

  coverage-gate:
    needs: coverage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
    steps:
      - name: Require all three successful shards
        shell: bash
        env:
          SHARDS_RESULT: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          test "$SHARDS_RESULT" = success
      - name: Bind manual dispatch to the reviewed QA branch and SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/qa/2147-full-coverage-33431-20261116
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # wallet main pin
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify orphan scope, modes and payload hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          printf 'source=%s source_tree=%s run=%s job=%s attempt=%s\n' "$EXPECTED_SOURCE" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$GITHUB_RUN_ATTEMPT"
          test -z "$(git show -s --format=%P HEAD)"
          expected=$(cat <<'FILES'
          .github/workflows/e2e-dapp-browser.yml
          source-after.sha256
          source-before.sha256
          source-overlay.patch
          FILES
          )
          test "$(git ls-tree -r --name-only HEAD | LC_ALL=C sort)" = "$expected"
          test "$(git ls-tree -r --format='%(objectmode)' HEAD | LC_ALL=C sort -u)" = 100644
          sha256sum --check <<'PAYLOAD'
          9c9348090a252e7d74fc8e8e53d550fae17372140f862c36b56ebaec5b2a3489  source-overlay.patch
          38a6ccd2b4e1df98e11d6f78d61f0047b33e1b3918057c94c83df47ac6af9d2e  source-before.sha256
          58bdcccee9c7bb98a691a7d2b5993b03fc6c766b024c8caddddfc0899540511f  source-after.sha256
          PAYLOAD

      - name: Check out approved public wallet baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # wallet main pin
        with:
          repository: 0xMiden/wallet
          ref: 293d668a14aa4226cd666d2f3344de6d65c5d762
          fetch-depth: 2
          path: wallet
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Ordinary frozen install on unchanged public baseline
        working-directory: wallet
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 293d668a14aa4226cd666d2f3344de6d65c5d762
          test "$(git rev-parse 'HEAD^{tree}')" = 3fe0463e0c0fd443d480bc3eb511c2f9f63af10f
          test "$(git show -s --format=%P HEAD)" = 9f239a3171140260d1c3b1133b49a04eaecc5683
          test -z "$(git status --porcelain --untracked-files=all)"

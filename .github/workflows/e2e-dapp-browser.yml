                          ['/o2-tools/cargo', '+nightly-2026-08-06', 'build', '--locked', '--manifest-path', P + '/rust/Cargo.toml']]
              preparation = run_phase('preparation', commands, prep_deadline)
              require_pass(preparation)
              prepared = discover_prepared()
              image_observed['applicationMounts'] = [dict(source=str(wallet / name), target=str(wallet / name), readOnly=True)
                                                     for name in RUNTIME_MOUNTS]
              image_observed['preparedMounts'] = [dict(source=row['path'], target=row['path'], readOnly=True) for row in prepared]
              image_observed['privateMount'] = dict(source=str(runtime_root), target='/o2-private', readOnly=False)
              create_private(root / 'image-observed.json', json.dumps(image_observed, separators=(',', ':')).encode())
              require_pass(run_phase('preparation', [['/o2-tools/rustup', 'run', 'nightly-2026-08-06', 'rustc', '--version', '--verbose']], prep_deadline))
              compiler = root / 'rustup-home/toolchains/nightly-2026-08-06-x86_64-unknown-linux-gnu/bin/rustc'
              create_private(root / 'toolchain-observed.json', json.dumps(tool_identity(compiler), separators=(',', ':')).encode())
              verify_sources()
              verify_prepared()
              verify_dependencies()
              remaining(prep_deadline)
              record('preparation', 'passed', preparation['exitCode'], preparation['treeTerminated'])
              remaining(prep_deadline)
              runtime_deadline = min(job_deadline, time.monotonic_ns() + 300000000000)
              active_phase = 'runtime'
              record('runtime', 'started', None, None)
              stage = 'rust-tests'
              verify_sources()
              verify_prepared()
              verify_dependencies()
              test_binary = next(row['path'] for row in prepared if row['kind'] == 'rust-test')
              rust = run_phase('runtime', [[test_binary, '--list'], [test_binary, '--test-threads=1']], runtime_deadline)
              require_pass(rust)
              assert verify_rust_report() == 6
              capture = runtime_root / 'capture'
              owned_directory(capture)
              capture_empty = not any(capture.iterdir())
              assert capture_empty
              verify_sources()
              verify_prepared()
              verify_dependencies()
              stage = 'rust-cli'
              cli_path = str(target / 'debug/o2-signing-inputs-probe')
              cli = run_phase('runtime', [[cli_path, '--out-dir', '/o2-private/capture']], runtime_deadline)
              require_pass(cli)
              assert sorted(path.name for path in capture.iterdir()) == ['metadata.json', 's1.bin', 's2.bin']
              for name in ('metadata.json', 's1.bin', 's2.bin'):
                  private_file(capture / name, 16777216)
              # Producer/codec assertions remain in the frozen Rust/JS, not recreated as JS getters.
              result_absent_before_jest = not os.path.lexists(capture / 'probe-result.json')
              assert result_absent_before_jest and not os.path.lexists(runtime_root / 'jest-results.json')
              verify_sources()
              verify_prepared()
              verify_dependencies()
              stage = 'jest'
              jest = run_phase('runtime', [[node['path'], '--experimental-vm-modules', 'node_modules/jest/bin/jest.js', '--config', P + '/wallet/jest.config.mjs',
                                          '--runInBand', '--coverage=false', '--no-cache', '--json', '--outputFile=/o2-private/jest-results.json']], runtime_deadline)
              require_pass(jest)
              counts = suite_counts()
              assert sorted(path.name for path in capture.iterdir()) == ['metadata.json', 'probe-result.json', 's1.bin', 's2.bin']
              capture_identity = owned_directory(capture)
              capture_fd = os.open(capture, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC)
              try:
                  assert same_inode(capture_identity, os.fstat(capture_fd))
                  result = read_private_result(capture_fd, BINDINGS_SHA)
                  assert same_inode(capture_identity, owned_directory(capture))
                  retained_result = result
              finally:
                  os.close(capture_fd)
              verify_sources()
              verify_prepared()
              verify_dependencies()
              remaining(runtime_deadline)
              sources_verified = True
              privacy_verified = True
              qualified_pending = qualify_observation(result, rust, cli, jest, counts, provider_identity)
              record('runtime', 'passed' if qualified_pending else 'incomplete', jest['exitCode'], jest['treeTerminated'])
              remaining(runtime_deadline)
              # Delivery waits for actual cleanup and complete validated memory.
          
          
          def record_failure(failure_outcome: PhaseOutcome | None) -> None:
              if public_delivery_ready and active_phase is not None:
                  # A prior successful native outcome says nothing about an unrelated validation failure.
                  if not any(value['phase'] == active_phase and value['status'] != 'started' for value in phase_records):
                      exit_code = failure_outcome['exitCode'] if failure_outcome is not None else None
                      terminated = failure_outcome['treeTerminated'] if failure_outcome is not None else (True if all_children_terminated else None)
                      status = 'setup-failure' if failure_outcome is not None and failure_outcome['status'] == 'setup-failure' else 'incomplete'
                      record(active_phase, status, exit_code, terminated)
          
          
          failure_outcome = None
          try:
              main()
          except PhaseFailure as failure:
              failure_outcome = failure.outcome
              qualified_pending = False
              try:
                  record_failure(failure_outcome)
              except BaseException:
                  pass
          except BaseException:
              qualified_pending = False
              try:
                  record_failure(None)
              except BaseException:
                  pass
          finally:
              if root is not None and root_identity is not None and job_deadline:
                  try:
                      if public_delivery_ready and all_children_terminated:
                          record('cleanup', 'started', None, True)
                  except BaseException:
                      pass
                  try:
                      clean_state()
                  except BaseException:
                      cleanup_ok = False
                  try:
                      if public_delivery_ready:
                          record('cleanup', 'passed' if cleanup_ok else 'incomplete', None,
                                 True if all_children_terminated else None)
                  except BaseException:
                      cleanup_ok = False
          qualified = qualified_pending and cleanup_ok
          # A phase/JSON success cannot override incomplete containment, source, suite or cleanup facts.
          delivered = False
          try:
              assert phase_records_valid and public_delivery_ready
              bundle = build_public_bundle(phase_records, retained_result if qualified else None, qualified)
              emit_public_bundle(bundle)
              delivered = True
          except BaseException:
              qualified_pending = False
              qualified = False
          sys.exit(0 if qualified and delivered else 1)
          O2_SOURCE_5
      - name: Own one bounded PREP plus aggregate runtime and cleanup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          O2_CONTROLLER="$(python3 -c 'import hashlib, json, os, pathlib, stat, sys, time
          try:
              os.umask(0o077)
              temp = pathlib.Path(os.environ["RUNNER_TEMP"])
              assert temp.resolve(strict=True) == temp
              path = temp / "o2-hosted-control.json"
              before = os.lstat(path)
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, "rb") as stream:
                  st = os.fstat(stream.fileno())
                  assert (st.st_dev, st.st_ino) == (before.st_dev, before.st_ino)
                  assert stat.S_ISREG(st.st_mode) and stat.S_IMODE(st.st_mode) == 0o600 and st.st_nlink == 1
                  assert st.st_uid == os.getuid() and st.st_size <= 4096
                  control = json.loads(stream.read(4097))
              root = pathlib.Path(control["stateRoot"])
              st = os.lstat(root)
              assert root.parent == temp and root.name.startswith("o2-hosted-") and root.resolve(strict=True) == root
              assert stat.S_ISDIR(st.st_mode) and st.st_uid == os.getuid() and st.st_gid == os.getgid() and stat.S_IMODE(st.st_mode) == 0o700
              assert (st.st_dev, st.st_ino) == (control["stateDevice"], control["stateInode"])
              assert control["uid"] == os.getuid() and control["gid"] == os.getgid()
              assert control["jobDeadlineNs"] == control["guardMonotonicNs"] + 900000000000
              assert time.monotonic_ns() < control["jobDeadlineNs"]
              path = root / "controller.py"
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, "rb") as stream:
                  st = os.fstat(stream.fileno())
                  assert stat.S_ISREG(st.st_mode) and st.st_uid == os.getuid() and st.st_nlink == 1 and stat.S_IMODE(st.st_mode) == 0o600
                  raw = stream.read(100000)
                  assert len(raw) == 88024 and hashlib.sha256(raw).hexdigest() == "f5708220b493ad6c874f466bad79501a68ba57d25dcb21c33eae7572055726e6"
              print(str(path))
          except BaseException:
              sys.exit(1)
          ')"
          python3 "$O2_CONTROLLER" 2>>"${O2_CONTROLLER%/*}/source.stderr.log"
      - name: Attempt owned-state fallback without inventing termination facts
        if: ${{ always() && steps.guard.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'O2_FALLBACK'
          import hashlib, json, os, pathlib, stat, sys, time
          if not os.path.lexists(pathlib.Path(os.environ["RUNNER_TEMP"]) / "o2-hosted-control.json"):
              sys.exit(0)
          try:
              os.umask(0o077)
              temp = pathlib.Path(os.environ["RUNNER_TEMP"])
              assert temp.resolve(strict=True) == temp
              path = temp / "o2-hosted-control.json"
              before = os.lstat(path)
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, "rb") as stream:
                  st = os.fstat(stream.fileno())
                  assert (st.st_dev, st.st_ino) == (before.st_dev, before.st_ino)
                  assert stat.S_ISREG(st.st_mode) and stat.S_IMODE(st.st_mode) == 0o600 and st.st_nlink == 1
                  assert st.st_uid == os.getuid() and st.st_size <= 4096
                  control = json.loads(stream.read(4097))
              root = pathlib.Path(control["stateRoot"])
              st = os.lstat(root)
              assert root.parent == temp and root.name.startswith("o2-hosted-") and root.resolve(strict=True) == root
              assert stat.S_ISDIR(st.st_mode) and st.st_uid == os.getuid() and st.st_gid == os.getgid() and stat.S_IMODE(st.st_mode) == 0o700
              assert (st.st_dev, st.st_ino) == (control["stateDevice"], control["stateInode"])
              assert control["uid"] == os.getuid() and control["gid"] == os.getgid()
              assert control["jobDeadlineNs"] == control["guardMonotonicNs"] + 900000000000
              assert time.monotonic_ns() < control["jobDeadlineNs"]
              assert not os.path.lexists(root / "controller-active")
              # No controller was launched: no contained children can have been created.
              # A surviving active sentinel after cancellation deliberately leaves private residuals.
              assert time.monotonic_ns() < control["jobDeadlineNs"]
              import shutil
              assert shutil.rmtree.avoids_symlink_attacks
              shutil.rmtree(root)
              assert not os.path.lexists(root)
              after = os.lstat(path)
              assert (before.st_dev, before.st_ino) == (after.st_dev, after.st_ino)
              os.unlink(path)
          except BaseException:
              sys.exit(1)
          O2_FALLBACK

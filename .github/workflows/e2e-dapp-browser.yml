          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args], env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'})
          
          
          def path(root, name):
              assert isinstance(name, str) and re.fullmatch(r'[A-Za-z0-9_./@+\[\]\-]+', name), 'Invalid path characters'
              assert not name.startswith('/') and PurePosixPath(name).as_posix() == name
              assert all(part not in ('', '.', '..') for part in name.split('/')), 'Unsafe path'
              result = root
              assert result.is_dir() and not result.is_symlink()
              for part in name.split('/')[:-1]:
                  result /= part
                  assert result.is_dir() and not result.is_symlink(), 'Unsafe parent'
              return result / name.split('/')[-1]
          
          
          def binding(root, name, mode='100644'):

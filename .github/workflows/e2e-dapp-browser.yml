name: Isolated timeout regression (expected green)

# Diagnostic QA branch only; never a wallet merge gate or runtime adoption.
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact QA commit SHA to check out and verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  frozen-timeout-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ripgrep for guarded evidence regressions (CI only)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Verify frozen source and run propagation/guard regressions (expected green)
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/2027-timeout-source-hashes.txt"
          source=$(git rev-parse HEAD)
          printf 'expected_source=%s\ncheckout_head=%s\ngithub_sha=%s\n' \
            "$EXPECTED_SOURCE" "$source" "$GITHUB_SHA" | tee "$proof"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$source" = "$EXPECTED_SOURCE"
          test "$source" = "$GITHUB_SHA"

          archive="$GITHUB_WORKSPACE/.github/qa/2027-timeout-origin-runtime.zip"
          sha256sum "$archive" | tee -a "$proof"
          printf '%s  %s\n' \
            'c5e41b626c38db3bcf8c22b48a52ad39d265be66cc9994543c4286bd70e4eb27' "$archive" \
            | sha256sum --check --strict | tee -a "$proof"
          candidate=$(mktemp -d "$RUNNER_TEMP/2027-timeout-candidate.XXXXXX")
          # The hash-pinned archive has 170 regular files, all under runtime-0.9.0.
          unzip -q "$archive" -d "$candidate"
          cd "$candidate"
          sha256sum runtime-0.9.0/scripts/rev-evidence.py \
            runtime-0.9.0/tests/test_prepare_timeout_origin.py | tee -a "$proof"
          printf '%s\n' \
            'f8851ceb7a40053c194524162a6850beab6495d2002f0865149271daeddcd905  runtime-0.9.0/scripts/rev-evidence.py' \
            'fe8a06df82c4e8e59824be83b6ae937d9c073157c2e23d81a74a6ff8c01d7158  runtime-0.9.0/tests/test_prepare_timeout_origin.py' \
            | sha256sum --check --strict | tee -a "$proof"

          python3 -B -m unittest discover \
            -s runtime-0.9.0/tests \
            -p test_prepare_timeout_origin.py \
            -v 2>&1 | tee "$RUNNER_TEMP/2027-timeout-regression.log"
          bash runtime-0.9.0/tests/run-tests.sh plan_read_budget_counts_the_current_source_target \
            2>&1 | tee -a "$RUNNER_TEMP/2027-timeout-regression.log"
          bash runtime-0.9.0/tests/run-tests.sh evidence_source_context_memo \
            2>&1 | tee -a "$RUNNER_TEMP/2027-timeout-regression.log"
          bash runtime-0.9.0/tests/run-tests.sh evidence_hardening_routing \
            2>&1 | tee -a "$RUNNER_TEMP/2027-timeout-regression.log"
      - name: Upload only regression log and source/hash proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeout-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/2027-timeout-regression.log
            ${{ runner.temp }}/2027-timeout-source-hashes.txt
          if-no-files-found: warn
          retention-days: 7

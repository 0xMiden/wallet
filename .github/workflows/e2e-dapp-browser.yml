          PAYLOADS = {'source-overlay.patch': '0b39b46d55bd3046bcf62e74fc7729c1d11b8e1f844357b59761a75d9b964dd7', 'source-before.sha256': 'b0e1bf9ffa8daac50b3d67eabbe601192c6001f76dec1e99da82570c23fcb594', 'source-after.sha256': 'ea6f337e96a5f8344c3dc7a51a756669c967b0a5dca5abbe76640726e70b8e8b'}
          PATCH_LIMIT = 2 * 1024 * 1024
          HASH_LIMIT = 32 * 1024
          METADATA_LIMIT = 128 * 1024
          OUTPUT_NAMES = {'format.patch', 'source-after.sha256', 'format-metadata.json'}
          
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          
          
          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args], env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'})
          
          
          def path(root, name):
              assert isinstance(name, str) and re.fullmatch(r'[A-Za-z0-9_./@+\[\]\-]+', name), 'Invalid path characters'
              assert not name.startswith('/') and PurePosixPath(name).as_posix() == name
              assert all(part not in ('', '.', '..') for part in name.split('/')), 'Unsafe path'
              result = root
              assert result.is_dir() and not result.is_symlink()
              for part in name.split('/')[:-1]:
                  result /= part
                  assert result.is_dir() and not result.is_symlink(), 'Unsafe parent'
              return result / name.split('/')[-1]
          
          
          def binding(root, name, mode='100644'):
              file = path(root, name)
              info = file.lstat()
              if mode == '120000':
                  aliases = {entry['path']: entry for entry in INPUT['aliases']}
                  assert name in aliases and stat.S_ISLNK(info.st_mode), 'Unexpected link'
                  data = os.fsencode(os.readlink(file))
                  assert data == aliases[name]['target'].encode() and blob(data) == aliases[name]['gitBlob']
              else:
                  assert mode in ('100644', '100755') and stat.S_ISREG(info.st_mode), 'Not a regular file'
                  assert stat.S_IMODE(info.st_mode) == int(mode[3:], 8), 'Changed mode'
                  data = file.read_bytes()
              return {'path': name, 'sha256': sha(data), 'gitBlob': blob(data), 'mode': mode}
          
          
          def manifest(data):
              result = {}
              for line in data.decode('ascii').splitlines():
                  match = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9_./@+\-]+)', line)
                  assert match, 'Malformed manifest'
                  digest, name = match.groups()
                  assert name not in result and not name.startswith('/')
                  assert all(part not in ('', '.', '..') for part in name.split('/'))
                  assert PurePosixPath(name).as_posix() == name
                  result[name] = digest
              assert list(result) == sorted(result), 'Unsorted manifest'
              return result
          
          
          def baseline(root):
              assert git(root, 'rev-parse', 'HEAD').decode().strip() == INPUT['baseline']
              assert git(root, 'rev-parse', 'HEAD^{tree}').decode().strip() == INPUT['baselineTree']
              assert git(root, 'show', '-s', '--format=%P', 'HEAD').decode().strip() == INPUT['baselineParent']
              assert git(root, 'diff', '--cached', '--name-only') == b'', 'Staged files'
              index = Path(git(root, 'rev-parse', '--path-format=absolute', '--git-path', 'index').decode().strip())
              return sha(index.read_bytes())
          
          
          def state(root):
              tracked = {}
              for row in git(root, 'ls-tree', '-rz', 'HEAD').split(b'\0'):
                  if not row:
                      continue
                  header, raw_name = row.split(b'\t', 1)
                  mode, kind, oid = header.decode().split()
                  name = raw_name.decode()
                  assert kind == 'blob' and mode in ('100644', '100755', '120000')
                  tracked[name] = binding(root, name, mode)
              others = [name.decode() for name in git(root, 'ls-files', '--others', '--exclude-standard', '-z').split(b'\0') if name]
              assert set(others) == {entry['path'] for entry in INPUT['sourceFiles'] if entry['baselineGitBlob'] is None}
              return {**tracked, **{name: binding(root, name) for name in others}}
          
          
          def fixed(root):
              for entry in INPUT['fixedInputs']:
                  assert binding(root, entry['path'], entry['mode']) == {key: entry[key] for key in ('path', 'sha256', 'gitBlob', 'mode')}
          
          
          def capture(root):
              area = root.parent / 'format-state'
              assert area.is_dir() and not area.is_symlink()
              before = area / 'before'
              assert not os.path.lexists(before) and not os.path.lexists(area / 'state.json')
              assert len(INPUT['sourceFiles']) == 68 and len(INPUT['formatPaths']) == 5
              assert len(set(INPUT['formatPaths'])) == 5
              assert INPUT['formatPaths'] == ['test/bridge-signing-fixture.ts', 'src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts', 'src/lib/miden/transaction/transactions.send-stage-timings.test.ts', 'src/lib/miden/transaction/transactions.branches.test.ts', 'src/lib/miden/transaction/transactions.guardian-offscreen.test.ts']
              for name, digest in PAYLOADS.items():
                  assert binding(root.parent, name)['sha256'] == digest
              hashes = manifest((root.parent / 'source-after.sha256').read_bytes())
              assert hashes == {entry['path']: entry['sha256'] for entry in INPUT['sourceFiles']}
              for entry in INPUT['sourceFiles']:
                  assert binding(root, entry['path']) == {key: entry[key] for key in ('path', 'sha256', 'gitBlob', 'mode')}
              fixed(root)
              index = baseline(root)
              initial = state(root)
              source = {entry['path']: entry for entry in INPUT['sourceFiles']}
              for row in git(root, 'ls-tree', '-rz', 'HEAD').split(b'\0'):
                  if row:
                      header, raw_name = row.split(b'\t', 1)
                      mode, kind, oid = header.decode().split()
                      name = raw_name.decode()
                      wanted = source[name]['gitBlob'] if name in source else oid
                      assert initial[name]['gitBlob'] == wanted
              before.mkdir()
              for name in INPUT['formatPaths']:
                  destination = before / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(path(root, name).read_bytes())
                  destination.chmod(0o644)
                  assert binding(before, name) == initial[name]
              ignored = sha(git(root, 'ls-files', '--others', '--ignored', '--exclude-standard', '-z'))
              (area / 'state.json').write_text(json.dumps({'index': index, 'files': initial, 'ignoredScopeSha256': ignored}, sort_keys=True) + '\n')
              (area / 'state.json').chmod(0o644)
          
          
          def check(root):
              area = root.parent / 'format-state'
              binding(area, 'state.json')
              initial = json.loads((area / 'state.json').read_text())
              assert baseline(root) == initial['index'], 'Index changed'
              assert sha(git(root, 'ls-files', '--others', '--ignored', '--exclude-standard', '-z')) == initial['ignoredScopeSha256'], 'Ignored path scope changed'
              current = state(root)
              assert set(current) == set(initial['files']), 'Source domain changed'
              allowed = set(INPUT['formatPaths'])
              snapshot = area / 'before'
              entries = list(snapshot.rglob('*'))
              assert all(not entry.is_symlink() for entry in entries), 'Snapshot link'
              assert {entry.relative_to(snapshot).as_posix() for entry in entries if not entry.is_dir()} == allowed
              for name, old in initial['files'].items():
                  assert current[name]['mode'] == old['mode']
                  if name not in allowed:
                      assert current[name] == old, 'Non-format path changed: ' + name
              for entry in INPUT['sourceFiles']:
                  name = entry['path']
                  assert current[name]['mode'] == '100644'
                  if name in allowed:
                      assert binding(area / 'before', name) == {key: entry[key] for key in ('path', 'sha256', 'gitBlob', 'mode')}
              fixed(root)
              return [current[entry['path']] for entry in INPUT['sourceFiles']]
          
          
          def format_patch(root, before, after):
              pieces = []
              total = 0
              for entry in after:
                  name = entry['path']
                  if name not in INPUT['formatPaths']:
                      continue
                  old = before[name]
                  result = subprocess.run(['git', 'diff', '--no-index', '--no-ext-diff', '--no-textconv', '--no-color', '--full-index', '--',
                                           str(root.parent / 'format-state' / 'before' / name), str(path(root, name))], capture_output=True)
                  assert result.returncode in (0, 1), 'Native diff failed'
                  if result.returncode == 0:
                      assert old == entry
                      continue
                  assert old['gitBlob'] != entry['gitBlob']
                  lines = result.stdout.decode('utf-8').splitlines(keepends=True)
                  assert lines[0].startswith('diff --git ') and lines[1] == f"index {old['gitBlob']}..{entry['gitBlob']} 100644\n"
                  assert lines[2].startswith('--- ') and lines[3].startswith('+++ ')
                  assert any(line.startswith('@@ ') for line in lines[4:]), 'Not a text patch'
                  assert sum(line.startswith('diff --git ') for line in lines) == 1
                  lines[0] = f'diff --git a/{name} b/{name}\n'
                  lines[2] = f'--- a/{name}\n'
                  lines[3] = f'+++ b/{name}\n'
                  piece = ''.join(lines).encode()
                  total += len(piece)
                  assert total <= PATCH_LIMIT, 'Patch exceeds 2 MiB; no truncation/export'
                  pieces.append(piece)
              return b''.join(pieces)
          
          
          def export(root):
              after = check(root)
              before = {entry['path']: {key: entry[key] for key in ('path', 'sha256', 'gitBlob', 'mode')} for entry in INPUT['sourceFiles']}
              patch = format_patch(root, before, after)
              hashes = ''.join(entry['sha256'] + '  ' + entry['path'] + '\n' for entry in after).encode()
              assert len(hashes) <= HASH_LIMIT and len(manifest(hashes)) == 68
              version_file = root.parent / 'format-state' / 'prettier-version.txt'
              binding(version_file.parent, version_file.name)
              version = version_file.read_text().strip()
              assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[A-Za-z0-9.+\-]+)?', version), 'Invalid installed version'
              assert version == '3.8.4', 'Installed Prettier version mismatch; HOLD'
              source_c = os.environ['EXPECTED_SOURCE']
              assert re.fullmatch(r'[0-9a-f]{40}', source_c) and source_c == os.environ['GITHUB_SHA']
              run = os.environ['GITHUB_RUN_ID']
              attempt = os.environ['GITHUB_RUN_ATTEMPT']
              job_name = os.environ['GITHUB_JOB']
              assert re.fullmatch(r'[1-9][0-9]*', run) and re.fullmatch(r'[1-9][0-9]*', attempt)
              assert re.fullmatch(r'[A-Za-z_][A-Za-z0-9_\-]*', job_name)
              metadata = {
                  'status': 'FORMAT_GENERATED_ONLY_NOT_STATIC_UNIT_OR_TYPE_PASS',
                  'sourceC': source_c, 'runId': run, 'runAttempt': attempt, 'jobName': job_name,
                  'baseline': INPUT['baseline'], 'baselineTree': INPUT['baselineTree'], 'baselineParent': INPUT['baselineParent'],
                  'manualGenerationSha256': PAYLOADS['source-after.sha256'], 'inputPayloadSha256': PAYLOADS,
                  'manualDeltas': INPUT['manualDeltas'], 'preFormatSource': list(before.values()), 'postFormatSource': after,
                  'formatterVersion': version, 'lockConfigInputs': INPUT['fixedInputs'], 'formatPaths': INPUT['formatPaths'],
                  'patchSha256': sha(patch), 'patchBytes': len(patch), 'sourceAfterManifestSha256': sha(hashes)
              }
              body = (json.dumps(metadata, indent=2, sort_keys=True) + '\n').encode()
              assert len(body) <= METADATA_LIMIT, 'Metadata exceeds 128 KiB'
              output = root.parent / 'format-output'
              assert not os.path.lexists(output), 'Output must be absent, never overwrite/clean'
              output.mkdir()
              for name, data in [('format.patch', patch), ('source-after.sha256', hashes), ('format-metadata.json', body)]:
                  (output / name).write_bytes(data)
                  (output / name).chmod(0o644)
              assert {file.name for file in output.iterdir()} == OUTPUT_NAMES
              for name, cap in [('format.patch', PATCH_LIMIT), ('source-after.sha256', HASH_LIMIT), ('format-metadata.json', METADATA_LIMIT)]:
                  assert binding(output, name)['sha256'] == sha({'format.patch': patch, 'source-after.sha256': hashes, 'format-metadata.json': body}[name])
                  assert (output / name).stat().st_size <= cap
              assert check(root) == after
          
          
          if __name__ == '__main__':
              assert len(sys.argv) == 2 and sys.argv[1] in ('capture', 'check', 'export')
              {'capture': capture, 'check': check, 'export': export}[sys.argv[1]](Path.cwd())
              print('FORMAT_METADATA_' + sys.argv[1].upper() + '_OK; NOT A PROJECT GATE RESULT')
          FORMAT_METADATA_PART_3_END
          chmod 644 ../format-state/generate.py
          python3 -I -B ../format-state/generate.py capture

      - name: Generate formatting with the frozen installed house Prettier on exactly 5 paths
        id: format
        working-directory: wallet
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          yarn -s prettier --version > ../format-state/prettier-version.txt
          chmod 644 ../format-state/prettier-version.txt
          test "$(cat ../format-state/prettier-version.txt)" = 3.8.4 # mismatch: fail/HOLD before formatting
          yarn prettier --write test/bridge-signing-fixture.ts src/lib/miden/transaction/transactions.bridged-earn-offscreen.test.ts src/lib/miden/transaction/transactions.send-stage-timings.test.ts src/lib/miden/transaction/transactions.branches.test.ts src/lib/miden/transaction/transactions.guardian-offscreen.test.ts

      - name: Check the format domain after ordinary success or failure without imposing old hashes on formatted code
        id: domain
        if: ${{ always() && steps.source.outcome == 'success' }}
        working-directory: wallet
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B ../format-state/generate.py check

      - name: Generate and validate exactly three bounded public code metadata files
        id: outputs
        if: ${{ success() && steps.format.outcome == 'success' && steps.domain.outcome == 'success' }}
        working-directory: wallet
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B ../format-state/generate.py export

      - name: Export only the three validated files for one day
        if: ${{ success() && steps.outputs.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 1
        with:
          name: 2147-format-${{ inputs.expected_source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            format-output/format.patch
            format-output/source-after.sha256
            format-output/format-metadata.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false

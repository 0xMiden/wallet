name: Required source quotes (deliberate baseline regression)

# Manual regression-only QA; no runtime patch or source-read certification.
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact QA commit SHA to check out and verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  required-source-quotes-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source and original runtime hashes before import
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/required-source-quotes-setup.log") 2>&1
          proof="$RUNNER_TEMP/required-source-quotes-source-hashes.txt"
          source=$(git rev-parse HEAD)
          printf 'expected_source=%s\ncheckout_head=%s\ngithub_sha=%s\n' \
            "$EXPECTED_SOURCE" "$source" "$GITHUB_SHA" | tee "$proof"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$source" = "$EXPECTED_SOURCE"
          test "$source" = "$GITHUB_SHA"
          sha256sum .github/qa/test-required-source-quotes.py .github/workflows/e2e-dapp-browser.yml | tee -a "$proof"
          archive="$GITHUB_WORKSPACE/.github/qa/2027-timeout-origin-runtime.zip"
          printf '%s  %s\n' \
            'dba8a1b618194daf7e6c0581b834511cd49cd3af5f278e001fedb4c95b792912' "$archive" \
            | sha256sum --check --strict | tee -a "$proof"
          candidate=$(mktemp -d "$RUNNER_TEMP/required-source-quotes-runtime.XXXXXX")
          # Extract only the hash-pinned original; never patch it in this regression job.
          unzip -q "$archive" -d "$candidate"
          runtime="$candidate/runtime-0.9.0"
          printf '%s  %s\n' \
            '034c153a8b135e0b5492b88402a1f9347bfa83de01d835604ea9759c249f9620' \
            "$runtime/scripts/rev-evidence.py" \
            'c40e65f1d171d6a63ac0db3d4501f4995eba4c8cb7905221d7b41cfe6f7aa80c' \
            "$runtime/scripts/lib/review-read-audit.py" \
            | sha256sum --check --strict | tee -a "$proof"
          printf 'QUOTES_RUNTIME=%s\n' "$runtime" >> "$GITHUB_ENV"
      - name: Run real permission regression (baseline assertions expected to fail)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$GITHUB_WORKSPACE/.github/qa/test-required-source-quotes.py" \
            --runtime "$QUOTES_RUNTIME" \
            2>&1 | tee "$RUNNER_TEMP/required-source-quotes-tests.log"
      - name: Always retain regression source, hashes and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-source-quotes-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/qa/test-required-source-quotes.py
            .github/workflows/e2e-dapp-browser.yml
            ${{ runner.temp }}/required-source-quotes-source-hashes.txt
            ${{ runner.temp }}/required-source-quotes-setup.log
            ${{ runner.temp }}/required-source-quotes-tests.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

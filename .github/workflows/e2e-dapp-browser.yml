name: H090 combined runtime (canonical contract QA)

# Linux fixture evidence with declared genuine host CLI metadata; no runtime adoption.
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact QA commit SHA to check out and verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  combined-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONOPTIMIZE: '0'
      PYTHONPATH: ''
      REVIEW_COUNCIL_CONTRACT_WORKERS: '4'
      REVIEW_COUNCIL_CONTRACT_DEADLINE_SECONDS: '300'
      REVIEW_COUNCIL_CONTRACT_OUTPUT_BYTES: '4194304'
      REVIEW_COUNCIL_CONTRACT_DIAGNOSTIC_BYTES: '8192'
      REVIEW_COUNCIL_CONTRACT_TERM_GRACE_SECONDS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable inputs and stage truthful original TREE at exact P
        id: setup
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-combined-contract"
          mkdir "$evidence"
          exec > >(tee "$evidence/setup.log") 2>&1
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          source=$(git rev-parse HEAD)
          printf 'expected_source=%s\ncheckout_head=%s\ngithub_sha=%s\nrun_id=%s\nrun_attempt=%s\nrepository=%s\nserver_url=%s\n' \
            "$EXPECTED_SOURCE" "$source" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" | tee "$evidence/provenance.txt"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$source" = "$EXPECTED_SOURCE"
          test "$source" = "$GITHUB_SHA"
          sha256sum .github/qa/2027-timeout-origin-runtime.zip .github/qa/source-combined-* \
            .github/qa/facts-routing-reuse.patch .github/qa/required-source-quotes.patch .github/qa/runner-source-paths.patch \
            .github/qa/test-required-source-quotes.py .github/qa/test-runner-source-paths.py \
            .github/workflows/e2e-dapp-browser.yml \
            | tee "$evidence/input-hashes.txt"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          import zipfile

          qa = Path(os.environ['GITHUB_WORKSPACE']) / '.github/qa'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'source-combined-contract'
          expected = {
              '2027-timeout-origin-runtime.zip': 'dba8a1b618194daf7e6c0581b834511cd49cd3af5f278e001fedb4c95b792912',
              'source-combined-090.manifest.json': '4d77b6d710c3a1ad956caaa601860e3f1f7dc44aec2a73166be877d5809570a0',
              'source-combined-frozen-roster.json': 'e5f4e32a9fe418b6c27876796356d48d12c11436bfc3a1f56087ad57c033bd25',
              'source-combined-provider-metadata.json': '6ff2c626bc803ad43b4ebcc8948ab2d5dd6d6dc402821343448834b6b4080a36',
              'facts-routing-reuse.patch': '573763b90327be5c49e5bb4dc64563414a2562ce0fb3ae834bb570f2a0c9e202',
              'required-source-quotes.patch': '259fc097c23f637a74026a4dfcfcd81f7afc42963aec63e29e70c7704db1fdcc',
              'runner-source-paths.patch': 'e4f0f53d3017ac2cc075dd7c85fd6d5a87fbaddb4e0f8970bd45e571e6f93824',
          }
          for name, digest in expected.items():
              path = qa / name
              metadata = path.lstat()
              assert stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1, name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          manifest = json.loads((qa / 'source-combined-090.manifest.json').read_bytes())
          assert isinstance(manifest, dict) and len(manifest) == 171
          for name, entry in manifest.items():
              parts = PurePosixPath(name).parts
              assert parts and not name.startswith('/') and '\\' not in name
              assert all(part not in ('', '.', '..', '.git') for part in name.split('/'))
              assert str(PurePosixPath(name)) == name
              assert set(entry) == {'sha256', 'mode'} and entry['mode'] in (0o644, 0o755)
              assert len(entry['sha256']) == 64 and all(c in '0123456789abcdef' for c in entry['sha256'])
          auditor = 'scripts/lib/review-read-audit.py'
          assert manifest[auditor]['sha256'] == 'c40e65f1d171d6a63ac0db3d4501f4995eba4c8cb7905221d7b41cfe6f7aa80c'
          assert manifest['scripts/rev-evidence.py']['sha256'] == '034c153a8b135e0b5492b88402a1f9347bfa83de01d835604ea9759c249f9620'
          assert manifest['tests/run-tests.sh'] == {
              'sha256': '3241aff49494d152d40aa3d545a7d02c4db5dd3c00989126e868e8a7d34cdce4', 'mode': 0o755}
          roster = json.loads((qa / 'source-combined-frozen-roster.json').read_bytes())
          assert len(roster['seats']) == 4
          for index, row in enumerate(roster['seats'], 1):
              assert row['seat'] == ('codex-luna' if index == 1 else f'codex-luna-{index}')
              assert (row['adapter'], row['model'], row['effort'], row['extra']) == ('codex', 'gpt-6-luna', 'xhigh', False)
          # Commit-bound input pins associate the H roster/capture; policy is workflow/receipt-bound.
          capture = json.loads((qa / 'source-combined-provider-metadata.json').read_bytes())
          assert capture['stdout'] == 'codex-cli 0.167.1\n' and capture['stderr'] == ''
          assert capture['returncode'] == 0 and capture['versions'] == {'codex': 'codex-cli 0.167.1'}
          assert capture['argv'] == ['/Users/celrisen/.pi/agent/bin/codex', '--version']
          assert capture['resolved_binary'] == '/Users/celrisen/.nvm/versions/node/v20.19.6/lib/node_modules/@openai/codex/bin/codex.js'
          assert capture['time'] == '2026-11-13T11:19:08.287777+00:00'
          assert capture['genuine_metadata_only'] is True and capture['not_a_provider_execution'] is True
          # Validate every ZIP member before creating P or importing any candidate code.
          members = {}
          with zipfile.ZipFile(qa / '2027-timeout-origin-runtime.zip') as archive:
              assert len(archive.infolist()) == 171
              for member in archive.infolist():
                  parts = member.filename.split('/')
                  assert parts[0] == 'runtime-0.9.0' and len(parts) > 1
                  assert all(part not in ('', '.', '..', '.git') for part in parts)
                  assert '\\' not in member.filename and not member.is_dir()
                  name = '/'.join(parts[1:])
                  assert name in manifest and name not in members
                  mode = member.external_attr >> 16
                  assert member.create_system == 3 and stat.S_ISREG(mode), name
                  assert stat.S_IMODE(mode) == manifest[name]['mode'], name
                  assert not member.flag_bits & 1, name
                  raw = archive.read(member)
                  assert hashlib.sha256(raw).hexdigest() == manifest[name]['sha256'], name
                  members[name] = raw
          assert set(members) == set(manifest)
          root = Path('/Volumes/X10 Pro/walletissues-storage-20261112/tooling/2027-facts-quoted-runner-candidate/runtime-0.9.0')
          assert not root.exists() and not root.is_symlink()
          for parent in root.parents:
              assert not parent.is_symlink(), parent
              if parent.exists():
                  assert parent.is_dir(), parent
          subprocess.run(['sudo', 'mkdir', '-p', str(root.parent)], check=True)
          subprocess.run(['sudo', 'chown', f'{os.getuid()}:{os.getgid()}', str(root.parent)], check=True)
          root.mkdir()
          assert root.resolve(strict=True) == root
          assert not evidence.resolve(strict=True).is_relative_to(root)
          for name, raw in members.items():
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              path.chmod(manifest[name]['mode'])
          actual = {}
          for path in root.rglob('*'):
              assert not path.is_symlink(), path
              if path.is_dir():
                  continue
              metadata = path.lstat()
              assert stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1
              actual[str(path.relative_to(root))] = {
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'mode': stat.S_IMODE(metadata.st_mode),
              }
          assert actual == manifest
          (evidence / 'baseline-source-modes.json').write_text(json.dumps(actual, indent=2) + '\n')
          print('Verified 171 original files, safe members, modes, original auditor/compiler and frozen inputs', flush=True)
          PY
          runtime='/Volumes/X10 Pro/walletissues-storage-20261112/tooling/2027-facts-quoted-runner-candidate/runtime-0.9.0'
          git -C "$runtime" init -b contract-baseline
          git -C "$runtime" config core.autocrlf false
          git -C "$runtime" config core.fileMode true
          git -C "$runtime" add -f -- .
          base=$(git -C "$runtime" write-tree)
          test "$(git -C "$runtime" cat-file -t "$base")" = tree
          test -z "$(git -C "$runtime" diff --no-renames --name-only "$base" --)"
          test -z "$(git -C "$runtime" ls-files --others --exclude-standard)"
          printf '%s\n' "$base" > "$evidence/baseline-tree.txt"
          git -C "$runtime" ls-tree -r "$base" > "$evidence/baseline-git-tree.txt"
          python3 -B - "$runtime" "$base" "$evidence/baseline-source-modes.json" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          root, base, manifest_path = sys.argv[1:]
          expected = json.load(open(manifest_path))
          actual = {}
          tree = subprocess.check_output(['git', '-C', root, 'ls-tree', '-rz', base])
          for entry in tree.split(b'\0'):
              if not entry:
                  continue
              metadata, name = entry.split(b'\t', 1)
              mode, kind, oid = metadata.decode().split()
              assert kind == 'blob' and mode in ('100644', '100755')
              raw = subprocess.check_output(['git', '-C', root, 'cat-file', 'blob', oid])
              actual[name.decode()] = {'sha256': hashlib.sha256(raw).hexdigest(), 'mode': int(mode, 8) & 0o777}
          assert actual == expected and len(actual) == 171
          print('Original Git TREE independently matches all 171 baseline bytes/modes; no commit created.')
          PY
          # No commit, signing override or hook bypass: --base accepts an original tree object.
          patch --batch --forward --fuzz=0 -p1 -d "$runtime" \
            < .github/qa/facts-routing-reuse.patch | tee "$evidence/facts-patch.log"
          if grep -Ei 'offset|fuzz' "$evidence/facts-patch.log"; then exit 1; fi
          patch --batch --forward --fuzz=0 -p1 -d "$runtime" \
            < .github/qa/required-source-quotes.patch | tee "$evidence/patch.log"
          if grep -Ei 'offset|fuzz' "$evidence/patch.log"; then exit 1; fi
          patch --batch --forward --fuzz=0 -p1 -d "$runtime" \
            < .github/qa/runner-source-paths.patch | tee "$evidence/runner-patch.log"
          if grep -Ei 'offset|fuzz' "$evidence/runner-patch.log"; then exit 1; fi
          test "$(git -C "$runtime" diff --no-renames --name-only "$base" --)" = $'scripts/lib/review-read-audit.py\nscripts/rev-evidence.py\ntests/run-tests.sh'
          test -z "$(git -C "$runtime" ls-files --others --exclude-standard)"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          root = Path('/Volumes/X10 Pro/walletissues-storage-20261112/tooling/2027-facts-quoted-runner-candidate/runtime-0.9.0')
          evidence = Path(os.environ['RUNNER_TEMP']) / 'source-combined-contract'
          expected = json.loads((evidence / 'baseline-source-modes.json').read_bytes())
          expected['scripts/lib/review-read-audit.py']['sha256'] = '32c0d0ae08bce8a74d4414ebbd3550d191135e1778067a443358b973bcd1c7f1'
          expected['scripts/rev-evidence.py']['sha256'] = '7092175a97a81d5e8131cd144e245db4f65a064fc2a8ce6d19486d06f560639a'
          expected['tests/run-tests.sh']['sha256'] = '5ffa3cd0b09b845aa00b0fe3c585cc8252cb75610bd8fbd4f6699a3dc63b1add'
          actual = {}
          for path in root.rglob('*'):
              if '.git' in path.relative_to(root).parts:
                  continue
              metadata = path.lstat()
              assert not path.is_symlink()
              if stat.S_ISDIR(metadata.st_mode):
                  continue
              assert stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1
              actual[str(path.relative_to(root))] = {
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'mode': stat.S_IMODE(metadata.st_mode),
              }
          assert actual == expected and len(actual) == 171
          (evidence / 'candidate-source-modes.json').write_text(json.dumps(actual, indent=2) + '\n')
          print('Verified exact compiler+auditor+runner patches and all 171 candidate bytes/modes', flush=True)
          PY
          tar -czf "$evidence/candidate-and-baseline-git.tar.gz" -C "$runtime" .
          probe=$(mktemp -d "$evidence/probe.XXXXXX")
          cache=$(mktemp -d "$evidence/cache.XXXXXX")
          printf 'COMBINED_RUNTIME=%s\nCOMBINED_BASE=%s\nCOMBINED_PROBE=%s\nCOMBINED_CACHE=%s\n' \
            "$runtime" "$base" "$probe" "$cache" >> "$GITHUB_ENV"
      - name: Install and record host prerequisites only
        if: ${{ success() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/source-combined-contract/platform-tools.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y ripgrep
          uname -a
          cat /etc/os-release
          python3 --version
          node --version
          git --version
          bash --version
          rg --version
          patch --version
          printf '%s\n' 'Linux deterministic fixtures only; declared genuine local codex-cli 0.167.1 metadata.' \
            'No provider execution, model availability, macOS qualification, or runtime adoption is established.'
      - name: Regress real runner discovery, filter and exact source-path origins
        if: ${{ success() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-combined-contract"
          status=0
          REVIEW_COUNCIL_HOST=pi python3 -B "$GITHUB_WORKSPACE/.github/qa/test-runner-source-paths.py" \
            --runner "$COMBINED_RUNTIME/tests/run-tests.sh" --logs "$evidence/runner-source-paths" \
            > "$evidence/runner-source-paths.stdout" 2> "$evidence/runner-source-paths.stderr" || status=$?
          printf '%s\n' "$status" > "$evidence/runner-source-paths.status"
          cat "$evidence/runner-source-paths.stdout"
          cat "$evidence/runner-source-paths.stderr" >&2
          exit "$status"
      - name: Canonical STATIC then unchanged receipt AUTHORITATIVE and verify-only
        if: ${{ success() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-combined-contract"
          exec > >(tee "$evidence/gates.log") 2>&1
          # Do not let inherited exact-selection, discovery, shards or overrides narrow the canonical groups.
          for name in $(compgen -v); do
            case "$name" in REVIEW_COUNCIL_TEST_*|REV_EVIDENCE_*) unset "$name" ;; esac
          done
          unset REVIEW_COUNCIL_CONTRACT_RUNNER REVIEW_COUNCIL_CONTRACT_PROVIDER_VERSIONS
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          export REVIEW_COUNCIL_CACHE_DIR="$COMBINED_CACHE"
          env | LC_ALL=C sort | grep -E '^REVIEW_COUNCIL_CONTRACT_(WORKERS|DEADLINE_SECONDS|OUTPUT_BYTES|DIAGNOSTIC_BYTES|TERM_GRACE_SECONDS)=' \
            > "$evidence/policy.txt"
          test -z "$(find "$COMBINED_CACHE" -mindepth 1 -print -quit)"
          test -z "$(find "$COMBINED_PROBE" -mindepth 1 -print -quit)"
          REVIEW_COUNCIL_HOST=pi python3 -B "$COMBINED_RUNTIME/scripts/rev-contract-check.py" \
            --root "$COMBINED_RUNTIME" --base "$COMBINED_BASE" --session "$COMBINED_PROBE" \
            --static-check --static-result "$COMBINED_PROBE/static-contract.json" \
            > "$evidence/static.stdout" 2> "$evidence/static.stderr"
          REVIEW_COUNCIL_HOST=pi python3 -B - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['COMBINED_RUNTIME'])
          probe = Path(os.environ['COMBINED_PROBE'])
          evidence = Path(os.environ['RUNNER_TEMP']) / 'source-combined-contract'
          spec = importlib.util.spec_from_file_location('contract', root / 'scripts/rev-contract-check.py')
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          assert root.resolve(strict=True) == root
          assert probe.resolve(strict=True) == probe and not probe.is_relative_to(root)
          cache = Path(os.environ['COMBINED_CACHE'])
          assert cache.resolve(strict=True) == cache and not cache.is_relative_to(root)
          assert probe != cache
          assert checker.source_plugin(root) == (root, '')
          changed = checker.changed_paths(root, os.environ['COMBINED_BASE'])
          assert changed == {'scripts/lib/review-read-audit.py', 'scripts/rev-evidence.py', 'tests/run-tests.sh'}
          touched = sorted(path for path in changed if checker.is_boundary(path, ''))
          assert touched == ['scripts/lib/review-read-audit.py', 'scripts/rev-evidence.py', 'tests/run-tests.sh']
          plugin, runner, executor = checker.contract_executor(root, root)
          assert plugin == root and runner == root / 'tests/run-tests.sh'
          manifest = json.loads((evidence / 'candidate-source-modes.json').read_bytes())
          assert executor == {
              'policy': 'checker-owned', 'plugin': str(root), 'runner': str(runner),
              'runner_sha256': manifest['tests/run-tests.sh']['sha256'],
              'runner_mode': manifest['tests/run-tests.sh']['mode'],
              'execution': {'max_workers': 4, 'shared_deadline_seconds': 300, 'output_bytes': 4194304,
                            'diagnostic_bytes': 8192, 'term_grace_seconds': 2},
          }
          assert list(checker.CONTRACT_TESTS) == [
              'provider_envelope_replay', 'read_audit_binds_delivered_output', 'plan_evidence', 'rev_reviewer']
          subject = checker.subject_boundary_hashes(root, '', touched)
          assert subject == {name: {'kind': 'regular', **manifest[name]} for name in touched}
          identity = checker.static_identity(root, executor, touched, subject)
          names = set(checker.BOUNDARIES) | set(checker.CONTRACT_FILES)
          names.update(name for name in manifest if checker.is_contract_input(name))
          assert identity['boundaries'] == {name: manifest.get(name) for name in names}
          raw = checker.receipt_bytes(probe / 'static-contract.json', 'CI static')
          receipt = checker.validate_receipt(raw, identity, checker.digest(checker.encoded(identity)), touched, 'CI static')
          assert (evidence / 'static.stdout').read_text() == str(probe / 'static-contract.json') + '\n'
          assert (evidence / 'static.stderr').read_bytes() == b''
          print(json.dumps(receipt['identity'], indent=2))
          # This is only an external byte-identity guard, never a replacement receipt.
          (evidence / 'static.sha256').write_text(checker.digest(raw) + '  ' + str(probe / 'static-contract.json') + '\n')
          PY
          # Supported override is populated ONLY after validated STATIC, from the hash-verified genuine capture.
          REVIEW_COUNCIL_CONTRACT_PROVIDER_VERSIONS=$(python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['GITHUB_WORKSPACE']) / '.github/qa/source-combined-provider-metadata.json'
          raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '6ff2c626bc803ad43b4ebcc8948ab2d5dd6d6dc402821343448834b6b4080a36'
          capture = json.loads(raw)
          assert capture['stdout'] == 'codex-cli 0.167.1\n' and capture['stderr'] == ''
          assert capture['returncode'] == 0 and capture['versions'] == {'codex': 'codex-cli 0.167.1'}
          assert capture['genuine_metadata_only'] is True and capture['not_a_provider_execution'] is True
          print(json.dumps(capture['versions']))
          PY
          )
          test "$REVIEW_COUNCIL_CONTRACT_PROVIDER_VERSIONS" = '{"codex": "codex-cli 0.167.1"}'
          export REVIEW_COUNCIL_CONTRACT_PROVIDER_VERSIONS
          printf '%s\n' 'AUTHORITATIVE uses declared genuine host version capture, NOT provider execution in CI.'
          REVIEW_COUNCIL_HOST=pi python3 -B "$COMBINED_RUNTIME/scripts/rev-contract-check.py" \
            --root "$COMBINED_RUNTIME" --base "$COMBINED_BASE" --session "$COMBINED_PROBE" \
            --roster "$GITHUB_WORKSPACE/.github/qa/source-combined-frozen-roster.json" \
            --static-result "$COMBINED_PROBE/static-contract.json" \
            > "$evidence/authoritative.stdout" 2> "$evidence/authoritative.stderr"
          REVIEW_COUNCIL_HOST=pi python3 -B "$COMBINED_RUNTIME/scripts/rev-contract-check.py" \
            --root "$COMBINED_RUNTIME" --base "$COMBINED_BASE" --session "$COMBINED_PROBE" \
            --roster "$GITHUB_WORKSPACE/.github/qa/source-combined-frozen-roster.json" --verify-only \
            > "$evidence/verify.stdout" 2> "$evidence/verify.stderr"
          sha256sum --check --strict "$evidence/static.sha256"
          REVIEW_COUNCIL_HOST=pi python3 -B - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import stat
          root = Path(os.environ['COMBINED_RUNTIME'])
          probe = Path(os.environ['COMBINED_PROBE'])
          evidence = Path(os.environ['RUNNER_TEMP']) / 'source-combined-contract'
          qa = Path(os.environ['GITHUB_WORKSPACE']) / '.github/qa'
          spec = importlib.util.spec_from_file_location('contract', root / 'scripts/rev-contract-check.py')
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          static = json.loads(checker.receipt_bytes(probe / 'static-contract.json', 'CI static'))
          identity = checker.contract_identity(static['identity'], qa / 'source-combined-frozen-roster.json')
          assert identity['provider_versions'] == {'codex': 'codex-cli 0.167.1'}
          assert identity['core_roster'] == [
              {'seat': 'codex-luna' if i == 1 else f'codex-luna-{i}',
               'adapter': 'codex', 'model': 'gpt-6-luna', 'effort': 'xhigh'} for i in range(1, 5)]
          key = checker.digest(checker.encoded(identity))
          path = probe / ('contract-pass-' + key + '.json')
          raw = checker.receipt_bytes(path, 'CI authoritative')
          changed = checker.changed_paths(root, os.environ['COMBINED_BASE'])
          assert changed == {'scripts/lib/review-read-audit.py', 'scripts/rev-evidence.py', 'tests/run-tests.sh'}
          touched = sorted(name for name in changed if checker.is_boundary(name, ''))
          assert touched == ['scripts/lib/review-read-audit.py', 'scripts/rev-evidence.py', 'tests/run-tests.sh']
          receipt = checker.validate_receipt(raw, identity, key, touched, 'CI authoritative')
          assert receipt['log_sha256'] == static['log_sha256']
          assert (evidence / 'authoritative.stdout').read_text() == str(path) + '\n'
          assert (evidence / 'verify.stdout').read_text() == str(path) + '\n'
          assert (evidence / 'authoritative.stderr').read_bytes() == b''
          assert (evidence / 'verify.stderr').read_bytes() == b''
          cache = Path(os.environ['COMBINED_CACHE']) / 'contracts'

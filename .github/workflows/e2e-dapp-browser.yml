          def same_inode(a, b):
              return (a.st_dev, a.st_ino, a.st_uid, a.st_gid, a.st_mode) == (b.st_dev, b.st_ino, b.st_uid, b.st_gid, b.st_mode)
          
          
          def owned_directory(path):

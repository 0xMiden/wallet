name: Swap notice source checks

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact QA commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [checks]
    env:
      WALLET_SOURCE: e9625e1ff2655b8f9b6d9a28a169f11e4ccb5997
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind workflow source
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/2115-proof"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          printf 'qa_source=%s\nwallet_source=%s\nrun_id=%s\nrun_attempt=%s\nlane=%s\n' \
            "$GITHUB_SHA" "$WALLET_SOURCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE" \
            > "$RUNNER_TEMP/2115-proof/provenance.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WALLET_SOURCE }}
          fetch-depth: 3
          persist-credentials: false
      - name: Bind original wallet source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WALLET_SOURCE"
          test "$(git rev-parse HEAD^)" = 'fed73f86d6b53edd67de4de8dddc1c63c7668cc2'
          git diff HEAD~2 HEAD > "$RUNNER_TEMP/2115-proof/source.patch"
          sha256sum src/screens/swap-flow/SwapManager.tsx src/screens/swap-flow/SwapManager.test.tsx \
            playwright/tests/wallet-access.spec.ts CHANGELOG.md package.json yarn.lock \
            > "$RUNNER_TEMP/2115-proof/source-hashes.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install exact dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Run real consumer and producer suites
        if: matrix.lane == 'checks'
        run: |
          set -euo pipefail
          mkdir -p test-results
          yarn jest --runTestsByPath src/screens/swap-flow/SwapManager.test.tsx src/lib/miden/swap/use-swap-tokens.test.ts src/components/FeatureUnavailable.test.tsx --maxWorkers=2 --json --outputFile=test-results/2115-green-jest.json 2>&1 | tee "$RUNNER_TEMP/2115-proof/jest.log"
      - name: Kill four predicted semantic mutants
        if: matrix.lane == 'checks'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = pathlib.Path('src/screens/swap-flow/SwapManager.tsx')
          original = source.read_text()
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / '2115-proof'
          page = 'src/screens/swap-flow/SwapManager.test.tsx'
          prefix = 'SwapFlow / SwapManager startup eligibility on the 1Click route '
          temporary = [prefix + 'keeps the form closed while the decision is pending',
                       prefix + 'keeps the form closed while the decision is failed',
                       prefix + 'uses temporary-unavailability copy when the pair registry read failed']
          cases = [
            ('old-mapping', [("      : 'bridgeFeatureUnavailableTitle';", "      : 'swapUnavailableTitle';"),
                             ("      : 'bridgeFeatureUnavailableBody';", "      : 'swapUnavailableBody';")], temporary),
            ('empty-is-temporary', [("const notConfigured = availability.state === 'unavailable' && availability.reason === 'not-configured';", 'const notConfigured = false;')],
             [prefix + 'keeps the genuine empty-registry notice copy']),
            ('restriction-is-temporary', [("const restricted = availability.state === 'unavailable' && availability.reason === 'restricted';", 'const restricted = false;')],
             [prefix + 'keeps the form closed while the decision is restricted']),
            ('wrong-body', [("      : 'bridgeFeatureUnavailableBody';", "      : 'swapUnavailableBody';")], temporary)
          ]
          predictions = [{'name': name, 'expected_failed_names': expected} for name, _, expected in cases]
          (proof / 'mutation-predictions.json').write_text(json.dumps(predictions, indent=2))
          outcomes = []
          try:
            for name, replacements, expected in cases:
              mutant = original
              for old, new in replacements:
                assert mutant.count(old) == 1, (name, old)
                mutant = mutant.replace(old, new)
              source.write_text(mutant)
              output = proof / (name + '.json')
              with (proof / (name + '.log')).open('w') as log:
                run = subprocess.run(['yarn', 'jest', '--runTestsByPath', page, '--maxWorkers=2',
                    '--testNamePattern', 'startup eligibility on the 1Click route', '--json', '--outputFile=' + str(output)],
                    stdout=log, stderr=subprocess.STDOUT)
              result = json.loads(output.read_text())
              failures = [a['fullName'] for suite in result['testResults'] for a in suite['assertionResults'] if a['status'] == 'failed']
              assert run.returncode == 1 and result['numTotalTests'] > 0, name
              assert result['numRuntimeErrorTestSuites'] == 0 and sorted(failures) == sorted(expected), (name, failures)
              outcomes.append({'name': name, 'exit': run.returncode, 'failed_names': failures, 'runtime_errors': 0})
              source.write_text(original)
          finally:
            source.write_text(original)
          assert source.read_text() == original
          (proof / 'mutation-outcomes.json').write_text(json.dumps(outcomes, indent=2))
          (proof / 'restored-source-sha256.txt').write_text(hashlib.sha256(source.read_bytes()).hexdigest() + '\n')
          PY
      - name: Check formatting, types, lint and pins
        if: matrix.lane == 'checks'
        run: |
          set -euo pipefail
          yarn tsc --noEmit -p .
          yarn eslint src/screens/swap-flow/SwapManager.tsx src/screens/swap-flow/SwapManager.test.tsx playwright/tests/wallet-access.spec.ts
          yarn -s lint:e2e
          yarn -s lint:i18n
          yarn -s check:prover-pin
      - name: Start existing wallet eligibility fixture
        if: matrix.lane == 'visual'
        uses: ./.github/actions/start-eligibility-fixture
        env:
          E2E_FIXTURE_PRELAUNCH_TESTNET: 'true'
      - name: Build existing mock extension
        if: matrix.lane == 'visual'
        env:
          MIDEN_USE_MOCK_CLIENT: 'true'
          MIDEN_E2E_DISABLE_SIDEPANEL: 'false'
        run: |
          set -euo pipefail
          yarn build:chrome 2>&1 | tee "$RUNNER_TEMP/2115-proof/build.log"
          test -f dist/chrome_unpacked/manifest.json
      - name: Install existing browser prerequisites
        if: matrix.lane == 'visual'
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Exercise existing real wallet-access flow
        if: matrix.lane == 'visual'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/2115-playwright.json
        run: xvfb-run -a yarn playwright test playwright/tests/wallet-access.spec.ts --workers=1 --retries=0 --reporter=list,json > "$RUNNER_TEMP/2115-proof/playwright.log" 2>&1
      - name: Preserve source-bound results and capped screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swap-notice-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/2115-proof
            test-results
          retention-days: 14
          if-no-files-found: error

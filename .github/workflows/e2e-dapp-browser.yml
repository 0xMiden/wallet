              assert pathlib.Path(path).resolve() == pathlib.Path(path)
              return st
          
          
          def private_file(path, limit):
              before = os.lstat(path)
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
              try:
                  st = os.fstat(fd)
                  assert same_inode(before, st) and stat.S_ISREG(st.st_mode) and st.st_nlink == 1
                  assert st.st_uid == os.getuid() and st.st_gid == os.getgid()
                  assert stat.S_IMODE(st.st_mode) == 0o600 and st.st_size <= limit
                  raw = os.read(fd, limit + 1)
                  assert len(raw) == st.st_size and len(raw) <= limit
                  assert same_inode(st, os.lstat(path)) and os.fstat(fd).st_size == len(raw)
                  return raw
              finally:

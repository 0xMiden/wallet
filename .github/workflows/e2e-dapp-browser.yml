                  assert match, 'Malformed manifest'
                  digest, name = match.groups()
                  assert name not in result and not name.startswith('/')
                  assert all(part not in ('', '.', '..') for part in name.split('/'))
                  assert PurePosixPath(name).as_posix() == name
                  result[name] = digest

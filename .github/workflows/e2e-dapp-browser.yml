          assert checker.receipt_bytes(cache / 'static' / (static['key'] + '.json'), 'CI static cache') == (probe / 'static-contract.json').read_bytes()
          manifest = json.loads((evidence / 'candidate-source-modes.json').read_bytes())
          actual = {}
          for source in root.rglob('*'):
              if '.git' in source.relative_to(root).parts:
                  continue
              metadata = source.lstat()
              assert not source.is_symlink()
              if stat.S_ISDIR(metadata.st_mode):
                  continue
              assert stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1
              actual[str(source.relative_to(root))] = {
                  'sha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'mode': stat.S_IMODE(metadata.st_mode)}
          assert actual == manifest and len(actual) == 171
          assert checker.changed_paths(root, os.environ['COMBINED_BASE']) == {'scripts/lib/review-read-audit.py', 'scripts/rev-evidence.py', 'tests/run-tests.sh'}
          for name in ('2027-timeout-origin-runtime.zip', 'source-combined-090.manifest.json',
                       'source-combined-frozen-roster.json', 'source-combined-provider-metadata.json',
                       'facts-routing-reuse.patch', 'required-source-quotes.patch', 'runner-source-paths.patch'):
              # Compare against the checkout's pre-execution hashes without modifying inputs or receipts.
              recorded = (evidence / 'input-hashes.txt').read_text().splitlines()
              line = next(line for line in recorded if line.endswith('  .github/qa/' + name))
              assert hashlib.sha256((qa / name).read_bytes()).hexdigest() == line.split()[0]
          print(json.dumps(receipt['identity'], indent=2))
          print('Canonical receipts validated; static bytes unchanged; all 171 candidate bytes/modes unchanged.')
          print('Successful internal group stdout is opaque; no per-group logs or assertion counts are inferred.')
          PY
      - name: Always retain immutable source, raw receipts, identities and all available logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-combined-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/workflows/e2e-dapp-browser.yml
            .github/qa/2027-timeout-origin-runtime.zip
            .github/qa/source-combined-*
            .github/qa/facts-routing-reuse.patch
            .github/qa/required-source-quotes.patch
            .github/qa/runner-source-paths.patch
            .github/qa/test-required-source-quotes.py
            .github/qa/test-runner-source-paths.py
            ${{ runner.temp }}/source-combined-contract/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

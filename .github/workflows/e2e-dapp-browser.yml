name: Facts routing reuse (isolated regression QA)

# Manual metadata-only QA. Original034 is intentionally functionally RED;
# failures propagate normally. No producer patch, runtime adoption or wallet execution.
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact QA commit SHA to check out and verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  facts-routing-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source and both original runtime copies before import
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/facts-routing-reuse-setup.log") 2>&1
          proof="$RUNNER_TEMP/facts-routing-reuse-source-hashes.txt"
          source=$(git rev-parse HEAD)
          printf 'expected_source=%s\ncheckout_head=%s\ngithub_sha=%s\n' \
            "$EXPECTED_SOURCE" "$source" "$GITHUB_SHA" | tee "$proof"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$source" = "$EXPECTED_SOURCE"
          test "$source" = "$GITHUB_SHA"
          sha256sum .github/qa/test-facts-routing-reuse.py \
            .github/workflows/e2e-dapp-browser.yml | tee -a "$proof"
          archive="$GITHUB_WORKSPACE/.github/qa/2027-timeout-origin-runtime.zip"
          printf '%s  %s\n' \
            'dba8a1b618194daf7e6c0581b834511cd49cd3af5f278e001fedb4c95b792912' "$archive" \
            | sha256sum --check --strict | tee -a "$proof"
          for identity in candidate reference; do
            directory=$(mktemp -d "$RUNNER_TEMP/facts-routing-reuse-$identity.XXXXXX")
            unzip -q "$archive" -d "$directory"
            runtime="$directory/runtime-0.9.0"
            test "$(find "$runtime" -type f | wc -l)" -eq 171
            printf '%s  %s\n' \
              '034c153a8b135e0b5492b88402a1f9347bfa83de01d835604ea9759c249f9620' \
              "$runtime/scripts/rev-evidence.py" \
              | sha256sum --check --strict | tee -a "$proof"
            # Keep the exact unmodified imported source as evidence even on assertion failure.
            cp "$runtime/scripts/rev-evidence.py" "$RUNNER_TEMP/facts-routing-reuse-$identity-compiler.py"
            printf 'FACTS_%s_RUNTIME=%s\n' "${identity^^}" "$runtime" >> "$GITHUB_ENV"
          done
      - name: Ensure host Git and ripgrep for temporary metadata fixtures only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/facts-routing-reuse-tools.log") 2>&1
          command -v git
          git --version
          if ! command -v rg; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          rg --version
      - name: Run exactly five real regressions and propagate assertion failures
        shell: bash
        run: |
          set -euo pipefail
          test "$FACTS_CANDIDATE_RUNTIME" != "$FACTS_REFERENCE_RUNTIME"
          # Capture status only to verify the test count; never invert a functional failure.
          set +e
          python3 -B "$GITHUB_WORKSPACE/.github/qa/test-facts-routing-reuse.py" \
            --runtime "$FACTS_CANDIDATE_RUNTIME" \
            --reference-runtime "$FACTS_REFERENCE_RUNTIME" \
            2>&1 | tee "$RUNNER_TEMP/facts-routing-reuse-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          grep -E '^Ran 5 tests in ' "$RUNNER_TEMP/facts-routing-reuse-tests.log"
          exit "$status"
      - name: Always retain exact source, compiler copies, hashes and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facts-routing-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/qa/test-facts-routing-reuse.py
            .github/workflows/e2e-dapp-browser.yml
            ${{ runner.temp }}/facts-routing-reuse-source-hashes.txt
            ${{ runner.temp }}/facts-routing-reuse-setup.log
            ${{ runner.temp }}/facts-routing-reuse-tools.log
            ${{ runner.temp }}/facts-routing-reuse-tests.log
            ${{ runner.temp }}/facts-routing-reuse-candidate-compiler.py
            ${{ runner.temp }}/facts-routing-reuse-reference-compiler.py
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Check and apply only the 63 reviewed source postimages
        id: source
        working-directory: wallet
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(wc -l < ../source-before.sha256)" -eq 46
          test "$(wc -l < ../source-after.sha256)" -eq 63
          sha256sum --check ../source-before.sha256
          while IFS= read -r file; do
            test ! -e "$file"
            test ! -L "$file"
          done < <(comm -13 <(cut -c67- ../source-before.sha256) <(cut -c67- ../source-after.sha256))
          git apply --check ../source-overlay.patch
          git apply ../source-overlay.patch
          sha256sum --check ../source-after.sha256
          while read -r hash file; do
            test -f "$file"
            test ! -L "$file"
            test "$(stat -c '%a' "$file")" = 644
          done < ../source-after.sha256
          test "$(git diff --name-only --no-renames HEAD | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" = a5b3ea65a6423f43f9e3db9340778719cc225f670e905d6c81d5f751b0517ffe
          test "$(git ls-files --others --exclude-standard | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" = 3f6916d6ece02fd13e172afb4019009b45447ff70e5d40c7ca5bf1e7a450c536
          test "$(node --version | cut -d. -f1)" = v22
          test "$(yarn --version)" = 1.22.22
          node --version
          yarn --version

      - name: Check locked and installed reporter versions
        working-directory: wallet
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_PATH
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const lock = fs.readFileSync('yarn.lock', 'utf8');
          const expected = { 'istanbul-lib-coverage': '3.2.2', 'istanbul-lib-report': '3.0.1', 'istanbul-reports': '3.2.0' };
          for (const [name, version] of Object.entries(expected)) {
            const entry = lock.split('\n\n').find(entry => entry.startsWith(name + '@'));
            assert(entry, 'missing lock header: ' + name);
            assert(entry.includes('version "' + version + '"'));
            assert.equal(require(name + '/package.json').version, version);
            console.log(name + '=' + version);
          }
          assert.equal(require('./package.json').dependencies['@miden-sdk/miden-sdk'], '0.17.5');
          JS


      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # public v4, same run
        with:
          name: coverage-shard-1
          path: ${{ runner.temp }}/full-coverage/coverage-shards/coverage-shard-1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # public v4, same run
        with:
          name: coverage-shard-2
          path: ${{ runner.temp }}/full-coverage/coverage-shards/coverage-shard-2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # public v4, same run
        with:
          name: coverage-shard-3
          path: ${{ runner.temp }}/full-coverage/coverage-shards/coverage-shard-3

      - name: Merge all three nonempty maps and counts and enforce global 95
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_PATH
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'full-coverage/coverage-shards');
          assert.deepEqual(fs.readdirSync(root).sort(), ['coverage-shard-1', 'coverage-shard-2', 'coverage-shard-3']);
          let total = 0;
          for (let shard = 1; shard <= 3; shard++) {
            const dir = path.join(root, 'coverage-shard-' + shard);
            assert(fs.lstatSync(dir).isDirectory());
            assert.deepEqual(fs.readdirSync(dir).sort(), ['coverage-final.json', 'test-count.json']);
            for (const name of ['coverage-final.json', 'test-count.json']) {
              assert(fs.lstatSync(path.join(dir, name)).isFile());
              assert(fs.statSync(path.join(dir, name)).size > 0);
            }
            const map = JSON.parse(fs.readFileSync(path.join(dir, 'coverage-final.json'), 'utf8'));
            assert(Object.keys(map).length > 0);
            const count = JSON.parse(fs.readFileSync(path.join(dir, 'test-count.json'), 'utf8'));
            assert.deepEqual(Object.keys(count), ['numTotalTests']);
            assert(Number.isSafeInteger(count.numTotalTests) && count.numTotalTests > 0);
            console.log(JSON.stringify({ shard, tests: count.numTotalTests }));
            total += count.numTotalTests;
          }
          assert(Number.isSafeInteger(total) && total > 0);
          console.log(JSON.stringify({ fullTests: total, shards: 3 }));
          JS
          # Maps stay outside baseline source; retain exact untracked17 guard.
          ln -s "$GITHUB_WORKSPACE/wallet/scripts" "$RUNNER_TEMP/full-coverage/scripts"
          node scripts/ci/coverage-resource-sampler.mjs merge &
          SAMPLER_PID=$!
          stop_sampler() {
            kill "$SAMPLER_PID" 2>/dev/null || true
            wait "$SAMPLER_PID" 2>/dev/null || true
            return 0
          }
          trap stop_sampler EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cd "$RUNNER_TEMP/full-coverage"
          set +e
          node scripts/merge-jest-coverage.mjs coverage-shards/coverage-shard-1/coverage-final.json coverage-shards/coverage-shard-2/coverage-final.json coverage-shards/coverage-shard-3/coverage-final.json
          merge_exit=$?
          set -e
          echo "merge_exit=$merge_exit"
          exit "$merge_exit"


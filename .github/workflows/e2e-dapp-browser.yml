        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          yarn -s lint:e2e

      - name: Static i18n - root i18n lint
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          yarn -s lint:i18n

      - name: Static pin - native prover pin consistency check
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          yarn -s check:prover-pin

      - name: Record complete actual Jest JSON and require all twelve control files GREEN
        if: ${{ always() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('jest-results.json', 'utf8'));
          console.log('JEST_RESULTS_JSON ' + JSON.stringify(report));
          assert.equal(report.success, true);
          assert.equal(report.numRuntimeErrorTestSuites, 0);
          assert.equal(report.numTotalTestSuites, 12);
          assert.equal(report.numPassedTestSuites, 12);
          assert.equal(report.numFailedTestSuites, 0);
          assert.equal(report.numPendingTestSuites, 0);
          assert.equal(report.numFailedTests, 0);
          assert(report.numTotalTests > 0);
          assert.equal(report.numPassedTests, report.numTotalTests);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numTodoTests, 0);
          const expectedPaths = [
            'src/lib/agglayer/b2agg/request.test.ts',
            'src/lib/epoch/miden-note.producer.test.ts',
            'src/lib/miden/back/miden-client-proxy.test.ts',
            'src/lib/miden/sdk/dry-run-request.test.ts',
            'src/lib/miden/transaction/transactions.guardian.test.ts',
            'src/lib/store/simulate-custom-tx.store.test.ts',
            'src/screens/send-flow/ReviewTransaction.test.tsx',
            'src/lib/miden/transaction/bridge-effects.test.ts',
            'src/lib/miden/transaction/proposal-effect-guard.test.ts',
            'src/lib/epoch/miden-note.test.ts',
            'src/lib/epoch/collateral-note.test.ts',
            'src/lib/miden/transaction/initiate.bridge-review.test.ts'
          ];
          assert.equal(report.testResults.length, 12);
          let actualTests = 0;
          for (const path of expectedPaths) {
            const matches = report.testResults.filter(suite => suite.name.endsWith('/' + path));
            assert.equal(matches.length, 1);
            const suite = matches[0];
            assert.equal(suite.status, 'passed');
            assert(suite.assertionResults.length > 0);
            assert(suite.assertionResults.every(test => test.status === 'passed'));
            actualTests += suite.assertionResults.length;
          }
          assert.equal(actualTests, report.numTotalTests);
          console.log(JSON.stringify({ total: report.numTotalTests, passed: report.numPassedTests,
            failed: report.numFailedTests, suites: report.numTotalTestSuites,
            controls: report.testResults.map(suite => ({ path: suite.name,
              tests: suite.assertionResults.length, status: suite.status })) }));
          JS


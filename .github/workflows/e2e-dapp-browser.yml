name: Swap notice regression proof

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact QA commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WALLET_SOURCE: fed73f86d6b53edd67de4de8dddc1c63c7668cc2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind workflow source
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/2115-proof"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          printf 'qa_source=%s\nwallet_source=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$WALLET_SOURCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/2115-proof/provenance.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WALLET_SOURCE }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind tests-only wallet source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WALLET_SOURCE"
          test "$(git rev-parse HEAD^)" = '7e2a34b5f1e7133d63302769c86f375d7c477fc4'
          test "$(git diff --name-only HEAD^ HEAD)" = 'src/screens/swap-flow/SwapManager.test.tsx'
          git show --format=fuller --stat HEAD > "$RUNNER_TEMP/2115-proof/source.txt"
          git diff HEAD^ HEAD -- src/screens/swap-flow/SwapManager.test.tsx > "$RUNNER_TEMP/2115-proof/regression.patch"
          sha256sum src/screens/swap-flow/SwapManager.tsx src/screens/swap-flow/SwapManager.test.tsx package.json yarn.lock \
            > "$RUNNER_TEMP/2115-proof/source-hashes.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install exact dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Expected functional regression failure
        run: |
          set -uo pipefail
          mkdir -p test-results
          set +e
          yarn jest --runTestsByPath src/screens/swap-flow/SwapManager.test.tsx --maxWorkers=2 --json --outputFile=test-results/2115-jest.json 2>&1 | tee "$RUNNER_TEMP/2115-proof/jest.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/2115-proof/jest.exit"
          exit "$status"
      - name: Preserve actual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swap-notice-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/2115-proof
            test-results/2115-jest.json
          retention-days: 14
          if-no-files-found: error

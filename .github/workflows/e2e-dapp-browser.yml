          yarn install --frozen-lockfile --network-timeout 600000

      - name: Check and apply only the 63 reviewed source postimages
        id: source
        working-directory: wallet
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(wc -l < ../source-before.sha256)" -eq 46
          test "$(wc -l < ../source-after.sha256)" -eq 63
          sha256sum --check ../source-before.sha256
          while IFS= read -r file; do
            test ! -e "$file"
            test ! -L "$file"
          done < <(comm -13 <(cut -c67- ../source-before.sha256) <(cut -c67- ../source-after.sha256))
          git apply --check ../source-overlay.patch
          git apply ../source-overlay.patch
          sha256sum --check ../source-after.sha256
          while read -r hash file; do
            test -f "$file"
            test ! -L "$file"
            test "$(stat -c '%a' "$file")" = 644
          done < ../source-after.sha256
          test "$(git diff --name-only --no-renames HEAD | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" = a5b3ea65a6423f43f9e3db9340778719cc225f670e905d6c81d5f751b0517ffe
          test "$(git ls-files --others --exclude-standard | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" = 3f6916d6ece02fd13e172afb4019009b45447ff70e5d40c7ca5bf1e7a450c536
          test "$(node --version | cut -d. -f1)" = v22
          test "$(yarn --version)" = 1.22.22
          node --version
          yarn --version

      - name: Unit - twelve whole existing files (no filtering or exit remapping)
        id: tests
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          yarn jest --runTestsByPath src/lib/agglayer/b2agg/request.test.ts src/lib/epoch/miden-note.producer.test.ts src/lib/miden/back/miden-client-proxy.test.ts src/lib/miden/sdk/dry-run-request.test.ts src/lib/miden/transaction/transactions.guardian.test.ts src/lib/store/simulate-custom-tx.store.test.ts src/screens/send-flow/ReviewTransaction.test.tsx src/lib/miden/transaction/bridge-effects.test.ts src/lib/miden/transaction/proposal-effect-guard.test.ts src/lib/epoch/miden-note.test.ts src/lib/epoch/collateral-note.test.ts src/lib/miden/transaction/initiate.bridge-review.test.ts --maxWorkers=2 --json --outputFile=../jest-results.json

      - name: Root types - full configured root typecheck
        working-directory: wallet
        timeout-minutes: 8
        run: |
          yarn tsc --noEmit


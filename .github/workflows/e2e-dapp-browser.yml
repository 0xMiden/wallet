name: '2147 bounded hosted format generation'

# Isolated orphan QA transport; this registered filename runs no native E2E jobs.
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact reviewed QA transport commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  format-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
    steps:
      - name: Bind manual dispatch to the reviewed QA branch and SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY_ID" = 853430876
          test "$GITHUB_REF" = refs/heads/qa/2147-t-format-five-33431-20261116
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # wallet main pin
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify orphan scope, modes and payload hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git show -s --format=%P HEAD)"
          expected=$(cat <<'FILES'
          .github/workflows/e2e-dapp-browser.yml
          source-after.sha256
          source-before.sha256
          source-overlay.patch
          FILES
          )
          test "$(git ls-tree -r --name-only HEAD | LC_ALL=C sort)" = "$expected"
          test "$(git ls-tree -r --format='%(objectmode)' HEAD | LC_ALL=C sort -u)" = 100644
          sha256sum --check <<'PAYLOAD'
          0b39b46d55bd3046bcf62e74fc7729c1d11b8e1f844357b59761a75d9b964dd7  source-overlay.patch
          b0e1bf9ffa8daac50b3d67eabbe601192c6001f76dec1e99da82570c23fcb594  source-before.sha256
          ea6f337e96a5f8344c3dc7a51a756669c967b0a5dca5abbe76640726e70b8e8b  source-after.sha256
          PAYLOAD

      - name: Check out approved public wallet baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # wallet main pin
        with:
          repository: 0xMiden/wallet
          ref: 293d668a14aa4226cd666d2f3344de6d65c5d762
          fetch-depth: 2
          path: wallet
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Ordinary frozen install on unchanged public baseline

          .claude/skills/miden-wallet-frontend ../../skills/miden-wallet-frontend
          ALIAS_TARGETS
          test "$(yarn --version)" = 1.22.22
          # Baseline postinstall inside install6: rimraf node_modules/@openzeppelin/miden-multisig-client/node_modules/@miden-sdk && patch-package && yarn build:hd-key && yarn build:bread-connect
          # tsc --project packages/hd-key/tsconfig.json; tsc --project packages/bread-connect/tsconfig.json
          yarn install --frozen-lockfile --network-timeout 600000

      - name: Check and apply only the two reviewed M test appends
        id: source
        working-directory: wallet
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(wc -l < ../source-before.sha256)" -eq 2
          test "$(wc -l < ../source-after.sha256)" -eq 2
          test "$(cut -c67- ../source-before.sha256)" = "$(cut -c67- ../source-after.sha256)"
          sha256sum --check ../source-before.sha256
          while read -r hash file; do
            test -f "$file"
            test ! -L "$file"
            test "$(stat -c '%a' "$file")" = 644
          done < ../source-before.sha256
          git apply --check ../source-overlay.patch
          git apply ../source-overlay.patch
          sha256sum --check ../source-after.sha256
          while read -r hash file; do
            test -f "$file"
            test ! -L "$file"
            test "$(stat -c '%a' "$file")" = 644
          done < ../source-after.sha256
          test "$(git diff --name-only --no-renames HEAD | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" = 4d009464ac538a65925a99603410a9ce9a76e526995cc93e8c74c432984a7574
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(node --version | cut -d. -f1)" = v22
          test "$(yarn --version)" = 1.22.22
          node --version
          yarn --version

      - name: Root types - full configured root typecheck
        working-directory: wallet
        timeout-minutes: 8
        run: |
          yarn tsc --noEmit

      - name: Static ESLint - the two reviewed M test files
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          yarn eslint --ext .ts,.tsx src/lib/miden/transaction/effect-checked-signer.test.ts src/lib/miden/transaction/proposal-effect-guard.test.ts

      - name: Static harness - root E2E convention lint
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          yarn -s lint:e2e

      - name: Static i18n - root i18n lint
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          yarn -s lint:i18n

      - name: Static pin - native prover pin consistency check
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pin_output=$(yarn -s check:prover-pin)
          pin_status=$?
          set -e
          printf '%s\n' "$pin_output"
          if [ "$pin_status" -ne 0 ]; then
            exit "$pin_status"
          fi
          test "$(printf '%s\n' "$pin_output" | grep -Fxc -- '[native-prover-pin] @miden-sdk/miden-sdk 0.17.5 → miden-client 0.17.4; native-prover requires ^0.17.2')" -eq 1
          test "$(printf '%s\n' "$pin_output" | grep -Fxc -- '✅ prover miden-client requirement ^0.17.2 is satisfied by the SDK'"'"'s miden-client 0.17.4, and all 7 transaction-kernel crates resolve identically in packages/native-prover/android/rust-bridge/Cargo.lock and the web-sdk lockfile.')" -eq 1

      - name: Unit - two whole M files; expected native assertion failure, never remapped
        id: tests
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          yarn jest --runTestsByPath src/lib/miden/transaction/effect-checked-signer.test.ts src/lib/miden/transaction/proposal-effect-guard.test.ts --maxWorkers=2 --json --outputFile=../jest-results.json

      - name: Record complete actual Jest JSON and check the expected two-failure envelope
        if: ${{ always() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          if (!fs.existsSync('jest-results.json')) {
            console.error('JEST_RESULTS_JSON MISSING: incomplete evidence; skipped prerequisites or Jest are NOT EXECUTED');
            throw new Error('Missing complete actual Jest JSON');
          }
          const report = JSON.parse(fs.readFileSync('jest-results.json', 'utf8'));
          console.log('JEST_RESULTS_JSON ' + JSON.stringify(report));
          assert.equal('${{ steps.tests.outcome }}', 'failure');
          assert.equal(report.success, false);
          assert.equal(report.numRuntimeErrorTestSuites, 0);
          assert.equal(report.numTotalTestSuites, 2);
          assert.equal(report.numPassedTestSuites, 0);
          assert.equal(report.numFailedTestSuites, 2);
          assert.equal(report.numPendingTestSuites, 0);
          assert.equal(report.numFailedTests, 2);
          assert(Number.isInteger(report.numTotalTests) && report.numTotalTests > 2);
          assert.equal(report.numPassedTests, report.numTotalTests - 2);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numTodoTests, 0);
          const expected = [
            {"path": "src/lib/miden/transaction/effect-checked-signer.test.ts", "failed": "refuses a second valid authentication for one bridged send before delegation", "passed": "passes one authentication for a bridged send creating its original note"},
            {"path": "src/lib/miden/transaction/proposal-effect-guard.test.ts", "failed": "refuses a bridged-send view creating no note despite its recorded original note", "passed": "permits a bridged-send view creating its recorded original note"}
          ];
          assert.equal(new Set(expected.map(suite => suite.path)).size, 2);
          assert.equal(report.testResults.length, 2);
          let actualTests = 0;
          let actualFailed = 0;
          for (const { path, failed, passed } of expected) {
            const matches = report.testResults.filter(suite => suite.name.endsWith('/' + path));
            assert.equal(matches.length, 1);
            const suite = matches[0];
            assert.equal(suite.status, 'failed');
            assert(suite.assertionResults.length > 0);
            assert.equal(suite.assertionResults.filter(test => test.title === failed).length, 1);
            assert.equal(suite.assertionResults.filter(test => test.title === passed).length, 1);
            for (const test of suite.assertionResults) {
              assert.equal(test.status, test.title === failed ? 'failed' : 'passed');
              if (test.status === 'failed') actualFailed += 1;
            }
            actualTests += suite.assertionResults.length;
          }
          assert.equal(actualTests, report.numTotalTests);
          assert.equal(actualFailed, report.numFailedTests);
          console.log(JSON.stringify({ assertionResults: actualTests,
            observedAssertionCounts: report.testResults.map(suite => ({ path: suite.name,
              numPassingAsserts: suite.assertionResults.map(test => test.numPassingAsserts ?? null) })),
            total: report.numTotalTests, passed: report.numPassedTests,
            failed: report.numFailedTests, suites: report.numTotalTestSuites,
            controls: report.testResults.map(suite => ({ path: suite.name,
              tests: suite.assertionResults.length, status: suite.status })) }));
          JS


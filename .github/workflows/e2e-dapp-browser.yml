      - name: Check and apply only the 63 reviewed source postimages
        id: source
        working-directory: wallet
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(wc -l < ../source-before.sha256)" -eq 46
          test "$(wc -l < ../source-after.sha256)" -eq 63
          sha256sum --check ../source-before.sha256
          while IFS= read -r file; do
            test ! -e "$file"
            test ! -L "$file"
          done < <(comm -13 <(cut -c67- ../source-before.sha256) <(cut -c67- ../source-after.sha256))
          git apply --check ../source-overlay.patch
          git apply ../source-overlay.patch
          sha256sum --check ../source-after.sha256
          while read -r hash file; do
            test -f "$file"
            test ! -L "$file"
            test "$(stat -c '%a' "$file")" = 644
          done < ../source-after.sha256
          test "$(git diff --name-only --no-renames HEAD | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" = a5b3ea65a6423f43f9e3db9340778719cc225f670e905d6c81d5f751b0517ffe
          test "$(git ls-files --others --exclude-standard | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" = 3f6916d6ece02fd13e172afb4019009b45447ff70e5d40c7ca5bf1e7a450c536
          test "$(node --version | cut -d. -f1)" = v22
          test "$(yarn --version)" = 1.22.22
          node --version
          yarn --version

      - name: Check locked and installed reporter versions
        working-directory: wallet
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_PATH
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const lock = fs.readFileSync('yarn.lock', 'utf8');
          const expected = { 'istanbul-lib-coverage': '3.2.2', 'istanbul-lib-report': '3.0.1', 'istanbul-reports': '3.2.0' };
          for (const [name, version] of Object.entries(expected)) {
            const entry = lock.split('\n\n').find(entry => entry.startsWith(name + '@'));
            assert(entry, 'missing lock header: ' + name);
            assert(entry.includes('version "' + version + '"'));
            assert.equal(require(name + '/package.json').version, version);
            console.log(name + '=' + version);
          }
          assert.equal(require('./package.json').dependencies['@miden-sdk/miden-sdk'], '0.17.5');
          JS

      - name: FULL Jest coverage shard with house sampler
        id: tests
        working-directory: wallet
        timeout-minutes: 5
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '3'
        run: |
          set -euo pipefail
          unset NODE_PATH
          test ! -e .env
          test ! -L .env
          printf 'source=%s baseline=293d668a14aa4226cd666d2f3344de6d65c5d762 run=%s job=%s attempt=%s shard=%s/%s\n' "$EXPECTED_SOURCE" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$GITHUB_RUN_ATTEMPT" "$SHARD" "$SHARDS"
          node scripts/ci/coverage-resource-sampler.mjs "$SHARD" &
          SAMPLER_PID=$!
          stop_sampler() {
            kill "$SAMPLER_PID" 2>/dev/null || true
            wait "$SAMPLER_PID" 2>/dev/null || true
            return 0
          }
          trap stop_sampler EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          set +e
          JEST_COVERAGE_SHARD=1 yarn test:coverage --maxWorkers=2 --shard="$SHARD/$SHARDS" --coverageReporters=json --coverageReporters=text-summary --json --outputFile=coverage/jest-results.json
          test_exit=$?
          set -e
          echo "jest_exit=$test_exit"
          exit "$test_exit"

      - name: Bounded local counts and conditional skips
        if: ${{ always() && steps.source.outcome == 'success' }}
        working-directory: wallet
        shell: bash
        run: |
          set -euo pipefail
          node scripts/badge-data.mjs count coverage/jest-results.json coverage/test-count.json
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          for (const file of ['coverage/coverage-final.json', 'coverage/test-count.json', 'coverage/jest-results.json']) {
            assert(fs.lstatSync(file).isFile());
            assert(fs.statSync(file).size > 0);
          }
          const report = JSON.parse(fs.readFileSync('coverage/jest-results.json', 'utf8'));
          const map = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
          assert(Object.keys(map).length > 0);
          assert(Number.isSafeInteger(report.numTotalTests));
          assert(report.numTotalTests > 0);
          assert(report.numTotalTestSuites > 0);
          assert(report.numPassedTests > 0);
          assert(report.numPassedTestSuites > 0);
          const adapterNames = [
            'MidenWallet conformance imported the real suite, not a mock',
            'MidenWallet conformance the extension provider implements every method',
            'MidenWallet conformance mobile (dApp browser injection script) is missing exactly its known gaps, no more and no fewer',
            'MidenWallet conformance desktop (Tauri injection script) is missing exactly its known gaps, no more and no fewer'
          ];
          const adapterPending = [], otherPending = [];
          let assertions = 0;
          assert.equal(report.testResults.length, report.numTotalTestSuites);
          for (const suite of report.testResults) {
            const path = suite.name.replace(process.cwd() + '/', '');
            assert(suite.assertionResults.length > 0);
            const counts = {};
            for (const test of suite.assertionResults) {
              assertions++;
              counts[test.status] = (counts[test.status] || 0) + 1;
              if (test.status === 'pending') {
                (path === 'src/lib/adapter/conformance.test.ts' ? adapterPending : otherPending).push(test.fullName);
              } else {
                assert(['passed', 'failed'].includes(test.status), 'todo/disabled/incomplete');
              }
              if (test.status === 'failed') console.log(JSON.stringify({ failure: test.fullName, path }));
            }
            console.log(JSON.stringify({ suite: path, status: suite.status, counts }));
            assert(['passed', 'pending'].includes(suite.status), 'failed/incomplete suite');
          }
          if (adapterPending.length) {
            assert.equal(adapterPending.length, 4);
            assert.deepEqual([...adapterPending].sort(), [...adapterNames].sort());
            console.log(JSON.stringify({ skips: adapterPending, reason: 'adapter conditional: load failure or missing getSurfaceCases' }));
          }
          assert.equal(otherPending.length, 0);
          assert.equal(report.numPendingTests, adapterPending.length);
          assert.equal(report.numPendingTestSuites, adapterPending.length ? 1 : 0);
          assert.equal(report.numPassedTestSuites + report.numPendingTestSuites, report.numTotalTestSuites);
          assert.equal(assertions, report.numTotalTests);
          assert.equal(report.numPassedTests + adapterPending.length, report.numTotalTests);
          console.log(JSON.stringify({ total: report.numTotalTests, passed: report.numPassedTests, failed: report.numFailedTests, pending: report.numPendingTests, suites: report.numTotalTestSuites }));
          assert.equal(report.success, true);
          assert.equal(report.numRuntimeErrorTestSuites, 0);

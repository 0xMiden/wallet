name: '2147 O2 private bounded hosted profile'
# Inert four-file source proposal; publication, privacy and ONE attempt remain parent-owned.
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact separately reviewed orphan source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  o2-private-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
    steps:
      - name: Bind source and create private original job guard
        id: guard
        shell: bash
        run: |
          python3 - <<'O2_GUARD'
          import datetime, json, os, pathlib, re, stat, sys, tempfile, time
          start = time.monotonic_ns()
          utc = datetime.datetime.now(datetime.timezone.utc).isoformat()
          try:
              os.umask(0o077)
              assert os.getuid() != 0 and os.getgid() != 0
              assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              assert os.environ["GITHUB_REF"] == "refs/heads/qa/2147-o2-hosted-runtime-33431-20261116"
              expected = os.environ["EXPECTED_SOURCE"]
              assert re.fullmatch("[0-9a-f]{40}", expected) and expected == os.environ["GITHUB_SHA"]
              temp = pathlib.Path(os.environ["RUNNER_TEMP"])
              assert temp.resolve(strict=True) == temp
              st = os.lstat(temp)
              assert stat.S_ISDIR(st.st_mode) and st.st_uid == os.getuid() and not st.st_mode & 0o022
              control_path = temp / "o2-hosted-control.json"
              assert not os.path.lexists(control_path)
              root = pathlib.Path(tempfile.mkdtemp(prefix="o2-hosted-", dir=temp))
              os.chmod(root, 0o700)
              st = os.lstat(root)
              assert stat.S_ISDIR(st.st_mode) and st.st_uid == os.getuid() and stat.S_IMODE(st.st_mode) == 0o700
              for name in ("runtime", "runtime/capture", "runtime/home", "runtime/tmp", "cargo-home", "rustup-home", "prep-home", "prep-tmp"):
                  (root / name).mkdir(mode=0o700)
              for name in ("source.stdout.log", "source.stderr.log"):
                  fd = os.open(root / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  os.close(fd)
              control = dict(schemaVersion=1, stateRoot=str(root), stateDevice=st.st_dev, stateInode=st.st_ino,
                             uid=os.getuid(), gid=os.getgid(), guardMonotonicNs=start, guardUtc=utc, jobDeadlineNs=start+900000000000)
              fd = os.open(control_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, "w") as stream:
                  stream.write(json.dumps(control, separators=(",", ":")))
          except BaseException:
              sys.exit(1)
          O2_GUARD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check public payload bytes before contained source admission
        shell: bash
        run: |
          python3 - <<'O2_SCOPE'
          import hashlib, json, os, pathlib, stat, sys, time
          try:
              os.umask(0o077)
              temp = pathlib.Path(os.environ["RUNNER_TEMP"])
              assert temp.resolve(strict=True) == temp
              path = temp / "o2-hosted-control.json"
              before = os.lstat(path)
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, "rb") as stream:
                  st = os.fstat(stream.fileno())
                  assert (st.st_dev, st.st_ino) == (before.st_dev, before.st_ino)
                  assert stat.S_ISREG(st.st_mode) and stat.S_IMODE(st.st_mode) == 0o600 and st.st_nlink == 1
                  assert st.st_uid == os.getuid() and st.st_size <= 4096
                  control = json.loads(stream.read(4097))
              root = pathlib.Path(control["stateRoot"])
              st = os.lstat(root)
              assert root.parent == temp and root.name.startswith("o2-hosted-") and root.resolve(strict=True) == root
              assert stat.S_ISDIR(st.st_mode) and st.st_uid == os.getuid() and st.st_gid == os.getgid() and stat.S_IMODE(st.st_mode) == 0o700
              assert (st.st_dev, st.st_ino) == (control["stateDevice"], control["stateInode"])
              assert control["uid"] == os.getuid() and control["gid"] == os.getgid()
              assert control["jobDeadlineNs"] == control["guardMonotonicNs"] + 900000000000
              assert time.monotonic_ns() < control["jobDeadlineNs"]
              for name, expected in {'source-before.sha256': '38a6ccd2b4e1df98e11d6f78d61f0047b33e1b3918057c94c83df47ac6af9d2e', 'source-after.sha256': '4a55e8eefa0661af5ea58ba65595b09d7dd26bf34097734c97fe9786a5ff03f1', 'source-overlay.patch': 'a93896ccfecb7f9e5b331afff253c7f96cd6ef2807c8eebdbeeb620aa4aaf242'}.items():
                  st = os.lstat(name)
                  assert stat.S_ISREG(st.st_mode) and st.st_nlink == 1 and stat.S_IMODE(st.st_mode) == 0o644
                  assert st.st_uid == os.getuid() and st.st_gid == os.getgid()
                  fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
                  with os.fdopen(fd, "rb") as stream:
                      opened = os.fstat(stream.fileno())
                      assert (opened.st_dev, opened.st_ino, opened.st_mode, opened.st_uid, opened.st_gid) == (st.st_dev, st.st_ino, st.st_mode, st.st_uid, st.st_gid)
                      assert hashlib.sha256(stream.read()).hexdigest() == expected
                  assert time.monotonic_ns() < control["jobDeadlineNs"]
          except BaseException:
              sys.exit(1)
          O2_SCOPE
      - name: Check out frozen public wallet baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 0xMiden/wallet
          ref: 293d668a14aa4226cd666d2f3344de6d65c5d762
          path: wallet
          fetch-depth: 2
          persist-credentials: false
      - name: Assemble private literal controller chunk 1
        shell: bash
        run: |
          python3 -c 'import hashlib, json, os, pathlib, stat, sys, time
          try:
              os.umask(0o077)
              temp = pathlib.Path(os.environ["RUNNER_TEMP"])
              assert temp.resolve(strict=True) == temp
              path = temp / "o2-hosted-control.json"
              before = os.lstat(path)
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, "rb") as stream:
                  st = os.fstat(stream.fileno())
                  assert (st.st_dev, st.st_ino) == (before.st_dev, before.st_ino)
                  assert stat.S_ISREG(st.st_mode) and stat.S_IMODE(st.st_mode) == 0o600 and st.st_nlink == 1
                  assert st.st_uid == os.getuid() and st.st_size <= 4096
                  control = json.loads(stream.read(4097))
              root = pathlib.Path(control["stateRoot"])
              st = os.lstat(root)
              assert root.parent == temp and root.name.startswith("o2-hosted-") and root.resolve(strict=True) == root
              assert stat.S_ISDIR(st.st_mode) and st.st_uid == os.getuid() and st.st_gid == os.getgid() and stat.S_IMODE(st.st_mode) == 0o700

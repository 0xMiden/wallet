name: AA frozen diagnostic green and mutation proof
on:
  push:
    branches: [ci/sentry-aa-green-proof]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind exact source and audited packet
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd();p=root/'.github/aa-diagnostic-proof';m=json.loads((p/'manifest.json').read_text());head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==m['source_sha']
          assert subprocess.check_output(['git','rev-parse','HEAD^:'],text=True).strip()==m['source_tree']
          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          assert sorted(changed)==sorted(['.github/workflows/aa-diagnostic-green-proof.yml',*[str(f.relative_to(root)) for f in p.iterdir()]])
          hashes=json.loads((p/'hashes.json').read_text())
          for rel,sha in hashes.items():assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==sha
          out=root/'proof';out.mkdir();(out/'binding.json').write_text(json.dumps({'workflow_sha':head,'source_sha':m['source_sha'],'source_tree':m['source_tree'],'packet_hashes':hashes,'original_mutation_manifest_sha256':m['mutation_cases_sha256']},indent=2))
          PYCODE
      - name: Install frozen dependencies
        timeout-minutes: 6
        run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Green gates and expected failing diagnostic mutations
        run: python3 .github/aa-diagnostic-proof/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aa-diagnostic-green-mutation-proof
          path: proof/

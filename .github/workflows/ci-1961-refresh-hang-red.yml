name: Post-action refresh expected red
on:
  push:
    branches: [ci/1961-refresh-hang-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: test "$(git rev-parse HEAD^)" = 48d116f23e8a37683f44b8376e55ead4d9d288b3
      - run: yarn install --frozen-lockfile --network-timeout 120000
        timeout-minutes: 6
      - name: Verify the four expected hanging refresh failures
        run: |
          mkdir -p proof
          set +e
          yarn jest --runTestsByPath src/lib/store/index.test.ts --testNamePattern='settles when a refresh request never responds|stops waiting when the backend never initializes' --maxWorkers=2 --json --outputFile=proof/results.json 2>&1 | tee proof/tests.log
          status=${PIPESTATUS[0]}
          test "$status" -ne 0 || exit 1
          node -e "const x=require('./proof/results.json');const a=x.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status!=='pending');if(a.length!==4 || a.some(t=>t.status!=='failed' || !t.failureMessages.join(' ').includes('Expected: true'))) {console.error(JSON.stringify(a));process.exit(1)} console.log('Four intended hanging refresh assertions failed')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-action-refresh-red
          path: proof/

name: Retry status evidence red proof
on:
  push:
    branches: [ci/retry-status-red-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry-status-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/retry-status-evidence/workflow-sha.txt"
          test "$(git rev-parse HEAD^)" = 3f62912f20295c3a0afded5b3a77905fda15a138
          cp -R .github/retry-status-proof "$RUNNER_TEMP/retry-status-packet"
          git checkout --detach 3f62912f20295c3a0afded5b3a77905fda15a138
          cp "$RUNNER_TEMP/retry-status-packet/source.json" "$RUNNER_TEMP/retry-status-evidence/"
      - name: Install frozen dependencies
        timeout-minutes: 6
        run: yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee "$RUNNER_TEMP/retry-status-evidence/install.log"
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn tsc --noEmit -p . 2>&1 | tee "$RUNNER_TEMP/retry-status-evidence/types.log"
      - name: Strict named lint
        run: yarn eslint src/screens/generating-transaction/GeneratingTransaction.test.tsx --max-warnings 0 2>&1 | tee "$RUNNER_TEMP/retry-status-evidence/lint.log"
      - name: Verify intended functional failures
        run: python3 "$RUNNER_TEMP/retry-status-packet/proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-status-red-proof
          path: ${{ runner.temp }}/retry-status-evidence
          if-no-files-found: error

name: Bridge balance diagnostic contract green and mutations
on:
  push:
    branches: [ci/d2-contract-green-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Bind immutable test source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d2-green-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/d2-green-evidence/workflow-sha.txt"
          test "$(git rev-parse HEAD^)" = ed7adc8397bd769fe1b948dd4ee76c8325c07722
          cp -R .github/d2-green-proof "$RUNNER_TEMP/d2-green-packet"
          git checkout --detach ed7adc8397bd769fe1b948dd4ee76c8325c07722
          test "$(git rev-parse HEAD^{tree})" = e557be972a8402f03b46f9efa14c7047850ad8c6
          cp "$RUNNER_TEMP/d2-green-packet/source.json" "$RUNNER_TEMP/d2-green-evidence/"
      - name: Install frozen dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --network-timeout 120000 2>&1 | tee "$RUNNER_TEMP/d2-green-evidence/install.log"
      - name: Full TypeScript check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          yarn tsc --noEmit -p . 2>&1 | tee "$RUNNER_TEMP/d2-green-evidence/types.log"
      - name: Strict named test lint
        run: |
          set -euo pipefail
          yarn eslint src/lib/telemetry/bridge-balance-diagnostics.test.ts src/lib/telemetry/user-visible-error.test.ts src/lib/telemetry/egress-boundary.test.ts src/app/templates/EvmConnectModal/EvmBridgeDepositForm.test.tsx src/lib/telemetry/ui-producer-diagnostics.ts src/components/AmountInput.tsx src/app/templates/EvmConnectModal/EvmBridgeDepositForm.tsx --max-warnings 0 2>&1 | tee "$RUNNER_TEMP/d2-green-evidence/lint.log"
      - name: Verify green baseline and independent functional mutations
        run: python3 "$RUNNER_TEMP/d2-green-packet/proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-contract-green-proof
          path: ${{ runner.temp }}/d2-green-evidence
          if-no-files-found: error

              manifest = {'source_commit': BINDINGS['source'], 'source_tree': value('rev-parse', BINDINGS['source'] + '^{tree}'),
                          'checkout_commit': head, 'checkout_tree': value('rev-parse', 'HEAD^{tree}'),
                          'source_entry_map': before, 'checkout_entry_map': after,
                          'workflow_sha256': digest(Path(BINDINGS['workflow']).read_bytes()),
                          'proof_tools_sha256': digest(Path(__file__).read_bytes()),
                          'runner_helper_sha256': digest((proof / 'run-logged.bash').read_bytes())}
              save('source-and-checkout.json', manifest)
              save('source-entry-map.json', before)
              save('checkout-entry-map.json', after)
              for label, ref in [('source', BINDINGS['source']), ('checkout', head), ('main', BINDINGS['main'])]:
                  (proof / (label + '-commit.txt')).write_bytes(git('cat-file', 'commit', ref))
                  (proof / (label + '-tree.txt')).write_bytes(git('ls-tree', '-r', ref))
              (proof / 'workflow.yml').write_bytes(Path(BINDINGS['workflow']).read_bytes())
              (proof / 'expanded-source.test.ts').write_bytes(Path(BINDINGS['test_path']).read_bytes())
              (proof / 'workflow-only.diff').write_bytes(git('diff', '--binary', BINDINGS['source'], head))
              (proof / 'test-only.diff').write_bytes(git('diff', '--binary', BINDINGS['main'], BINDINGS['source']))
              assert head == os.environ['PROOF_HEAD_SHA'] == os.environ['PROOF_WORKFLOW_SHA'], 'Event/workflow/head mismatch'
              assert os.environ['PROOF_EVENT'] == 'push' and os.environ['PROOF_REF'] == 'refs/heads/' + BINDINGS['branch'], 'Unique push branch required'
              assert os.environ['PROOF_REPOSITORY'] == '0xMiden/wallet', 'Unexpected repository'
              assert os.environ['PROOF_WORKFLOW_REF'] == os.environ['PROOF_REPOSITORY'] + '/' + BINDINGS['workflow'] + '@' + os.environ['PROOF_REF'], 'Workflow ref mismatch'
              assert all(os.environ['PROOF_' + key].isdigit() for key in ['RUN_ID', 'RUN_ATTEMPT']), 'Missing run identity'
              assert manifest['source_tree'] == BINDINGS['source_tree'], 'Frozen source tree mismatch'
              assert value('rev-list', '--parents', '-n', '1', BINDINGS['source']).split() == [BINDINGS['source'], BINDINGS['main']], 'Source parent mismatch'
              assert value('rev-list', '--parents', '-n', '1', head).split() == [head, BINDINGS['source']], 'One direct transport commit required'
              assert len(before) == 3614 and len(after) == 3615, 'Source/transport entry count mismatch'
              assert all(after.get(name) == entry for name, entry in before.items()), 'Frozen source entries changed'
              assert set(after) - set(before) == {BINDINGS['workflow']} and after[BINDINGS['workflow']][:2] == ['100644', 'blob'], 'Only regular workflow may be added'
              assert digest(Path(BINDINGS['test_path']).read_bytes()) == BINDINGS['inventory']['source_sha256'], 'Expanded test bytes changed'
              lines = Path(BINDINGS['test_path']).read_text().splitlines()
              for site in BINDINGS['failure_sites'].values():
                  assert lines[site['line'] - 1] == site['source'], 'Authored matcher moved'
              snapshot('source-clean')
              print('Bound frozen 3614-entry source, sole workflow addition, complete 97-case inventory and exact push provenance')
          
          
          def prepared():
              snapshot('prepared')
              assert digest(Path('yarn.lock').read_bytes()) == BINDINGS['lock_sha256'], 'Frozen lockfile changed'
              identities = {}
              for name, binding in BINDINGS['framework'].items():
                  observed = {}
                  for key, path in binding['files'].items():
                      local = Path('node_modules') / name / path['relative']
                      assert local.is_file() and not local.is_symlink(), 'Missing framework file'
                      data = local.read_bytes()
                      assert digest(data) == path['sha256'], 'Pinned framework bytes mismatch: ' + name
                      output = binding['artifact_prefix'] + '-' + key
                      (proof / output).write_bytes(data)
                      observed[key] = {'sha256': digest(data), 'bytes': len(data), 'artifact': output}
                      if key == 'package.json':
                          assert json.loads(data)['version'] == binding['version'], 'Pinned framework version mismatch'
                  identities[name] = {'version': binding['version'], 'files': observed}
              save('framework-identities.json', identities)
              save('tool-versions.json', {name: subprocess.check_output([name, '--version'], text=True).strip() for name in ['node', 'yarn']})
              print('Verified frozen install source/index and exact Jest matcher, each, circus and serializer implementations')
          
          
          def plain(message):
              return re.sub(r'\x1b\[[0-9;]*m', '', message)
          
          
          def diff_arrays(message):
              prefix = 'expect(received).toEqual(expected) // deep equality\n\n'
              assert message.startswith(prefix), 'Wrong matcher prefix'
              match = re.fullmatch(r'- Expected  - (\d+)\n\+ Received  \+ (\d+)\n\n(.+)', message[len(prefix):], re.DOTALL)
              assert match, 'Unexpected toEqual array diff'
              expected, actual = [], []
              removed = added = 0
              for line in match[3].splitlines():
                  assert line[:2] in ['  ', '- ', '+ '], 'Unexpected diff marker'
                  content = line[2:]
                  if line[:2] != '+ ':
                      expected.append(content)
                  if line[:2] != '- ':
                      actual.append(content)
                  removed += line[:2] == '- '
                  added += line[:2] == '+ '
              assert (removed, added) == (int(match[1]), int(match[2])), 'Diff annotation mismatch'
          
              def array(lines):
                  text = '\n'.join(lines).strip()
                  assert text.startswith('Array ['), 'Expected pretty-format Array'
                  text = re.sub(r',\s*\]', '\n]', text[len('Array '):])
                  data = json.loads(text)
                  assert isinstance(data, list), 'Nonarray diff'
                  return data
          
              return array(expected), array(actual)
          
          
          def checked_result():
              result = load('jest.json')
              assert len(result['testResults']) == 1, 'Exactly one suite required'
              suite = result['testResults'][0]
              assert suite['name'] == str(Path.cwd() / BINDINGS['test_path']) and suite['status'] == 'failed', 'Wrong suite or status'
              cases = suite['assertionResults']
              expected_cases = {case['full_name']: case for case in BINDINGS['inventory']['cases']}
              assert len(cases) == len(expected_cases) == 97, 'Missing/extra cases'
              names = [case['fullName'] for case in cases]
              assert len(set(names)) == 97 and set(names) == set(expected_cases), 'Wrong/duplicate full inventory'
              failures = {}
              for case in cases:
                  name = case['fullName']
                  expected_case = expected_cases[name]
                  assert case['ancestorTitles'] == expected_case['ancestor_titles'] and case['title'] == expected_case['title'], 'Nested case identity mismatch'
                  assert case['failing'] is False and case['invocations'] == 1 and case['retryReasons'] == [], 'Retry or expected-failing case'
                  site = BINDINGS['failure_sites'].get(name)
                  if site is None:
                      assert case['status'] == 'passed' and case['failureMessages'] == [] and case['failureDetails'] == [], 'Old/new control failed: ' + name
                      continue
                  assert case['status'] == 'failed' and len(case['failureMessages']) == len(case['failureDetails']) == 1, 'Wrong failure count'
                  assert case['numPassingAsserts'] == site['passing_assertions_before_failure'], 'Wrong first failing assertion'
                  message = plain(case['failureMessages'][0])
                  prefix, stack = re.split(r'\n\s+at ', message, maxsplit=1)
                  assert prefix.startswith('Error: '), 'Wrong authored matcher error type'
                  expected, actual = diff_arrays(prefix[len('Error: '):].rstrip())
                  assert canonical(expected) == canonical(site['expected']) and canonical(actual) == canonical(site['received']), 'Wrong expected/received array'
                  frames = re.split(r'\n\s+at ', stack)
                  first = frames[0].strip()
                  authored = r'^[^\n]*\(' + re.escape(str(Path.cwd() / BINDINGS['test_path'])) + ':' + str(site['line']) + r':[1-9][0-9]*\)$'
                  assert re.fullmatch(authored, first), 'First stack frame must be the exact authored synchronous matcher'
                  detail = case['failureDetails'][0]
                  assert type(detail) is dict and set(detail) == {'matcherResult'}, 'Unexpected frozen structured failure shape'
                  matcher = detail['matcherResult']
                  assert type(matcher) is dict and set(matcher) == {'actual', 'expected', 'message', 'name', 'pass'}, 'Unexpected frozen matcher shape'
                  assert matcher['name'] == 'toEqual' and matcher['pass'] is False, 'Unexpected structured matcher'
                  assert type(matcher['message']) is str and plain(matcher['message']) == prefix[len('Error: '):], 'Raw/structured matcher mismatch'
                  assert canonical(matcher['expected']) == canonical(expected) and canonical(matcher['actual']) == canonical(actual), 'Structured values mismatch'
                  failures[name] = {'line': site['line'], 'first_authored_frame': first,
                                    'matcher': 'toEqual', 'expected': expected, 'received': actual,
                                    'passing_assertions_before_failure': case['numPassingAsserts'],
                                    'post_failure_assertions': 'UNRUN; no credit'}
              assert set(failures) == set(BINDINGS['failure_sites']) and len(failures) == 3, 'Exact authored failure set required'
              for key, count in {'numTotalTestSuites': 1, 'numFailedTestSuites': 1, 'numPassedTestSuites': 0,
                                 'numTotalTests': 97, 'numFailedTests': 3, 'numPassedTests': 94,
                                 'numPendingTestSuites': 0, 'numPendingTests': 0, 'numTodoTests': 0,
                                 'numRuntimeErrorTestSuites': 0}.items():
                  assert result[key] == count, 'Wrong summary: ' + key
              assert result['success'] is False and result['wasInterrupted'] is False and result['openHandles'] == [], 'Interrupted/runtime result'
              assert result['snapshot']['failure'] is False and result['snapshot']['unmatched'] == 0 and result['snapshot']['unchecked'] == 0, 'Snapshot error'
              return {'total': 97, 'passed': 94, 'failed': 3, 'retained_controls_passed': 92, 'new_omitted_flag_controls_passed': 2, 'exact_failures': failures}
          
          
          def required_files(final=False):
              required = ['run-identity.json', 'bindings.json', 'expected-case-inventory.json', 'run-logged.bash', 'proof-tools.py',
                          'source-and-checkout.json', 'source-entry-map.json', 'checkout-entry-map.json', 'workflow.yml',
                          'expanded-source.test.ts', 'workflow-only.diff', 'test-only.diff', 'tool-versions.json',
                          'framework-identities.json', 'jest.json', 'step-outcomes.json']
              required += [label + suffix for label in ['source', 'checkout', 'main'] for suffix in ['-commit.txt', '-tree.txt']]
              required += [label + suffix for label in BINDINGS['logged_commands'] for suffix in ['.log', '.exit', '.tee.exit', '.command.json']]
              required += [label + suffix for label in ['source-clean', 'prepared', 'final-clean', 'final-validation-clean'] for suffix in ['.map.json', '.index.bin', '.index-stage.bin']]
              required += [binding['artifact_prefix'] + '-' + key for binding in BINDINGS['framework'].values() for key in binding['files']]
              if final:
                  required += ['test-set-validation.json', 'validation-completeness.json']
                  required += ['validate' + suffix for suffix in ['.log', '.exit', '.tee.exit', '.command.json']]
              return required
          
          
          def completeness(name, required):
              missing = [item for item in required if not (proof / item).is_file() or (proof / item).is_symlink() or not (proof / item).stat().st_size]
              save(name, {'required': required, 'missing_or_empty': missing})
              assert not missing, 'Missing/empty evidence: ' + repr(missing)
          
          
          def validate_commands(labels):
              for label in labels:
                  assert (proof / (label + '.exit')).read_text().strip() == ('1' if label == 'jest' else '0'), 'Wrong natural exit: ' + label
                  assert (proof / (label + '.tee.exit')).read_text().strip() == '0', 'Tee failure: ' + label
                  command = load(label + '.command.json')
                  expected = [argument.replace('$PROOF_DIR', str(proof)) for argument in BINDINGS['commands'][label]]
                  assert command['argv'] == expected and command['cwd'] == str(Path.cwd()), 'Command identity mismatch: ' + label
          
          
          def validate():
              outcomes = {name: os.environ.get(name.upper() + '_OUTCOME', 'missing') for name in BINDINGS['outcomes']}
              save('step-outcomes.json', outcomes)
              validation = {'status': 'INVALID', 'runtime': 'UNACCEPTED', 'production_gate': 'CLOSED', 'outcomes': outcomes}
              try:
                  snapshot('final-validation-clean')
                  completeness('validation-completeness.json', required_files())
                  for name, outcome in outcomes.items():
                      assert outcome == ('failure' if name == 'jest' else 'success'), 'Independent step failed/skipped/cancelled: ' + name
                  validate_commands(BINDINGS['logged_commands'])
                  manifest = load('source-and-checkout.json')
                  assert manifest['source_commit'] == BINDINGS['source'] and manifest['source_tree'] == BINDINGS['source_tree'], 'Source receipt changed'
                  assert manifest['source_entry_map'] == tree(BINDINGS['source']) == load('source-entry-map.json'), 'Source map changed'
                  assert manifest['checkout_entry_map'] == tree('HEAD') == load('checkout-entry-map.json'), 'Checkout map changed'
                  assert all(manifest['checkout_entry_map'][name] == entry for name, entry in manifest['source_entry_map'].items()), 'Source entries changed'
                  assert set(manifest['checkout_entry_map']) - set(manifest['source_entry_map']) == {BINDINGS['workflow']}, 'Sole workflow addition changed'
                  assert manifest['proof_tools_sha256'] == digest(Path(__file__).read_bytes()), 'Validator bytes changed'
                  assert manifest['runner_helper_sha256'] == digest((proof / 'run-logged.bash').read_bytes()), 'Logging helper changed'
                  assert manifest['workflow_sha256'] == digest(Path(BINDINGS['workflow']).read_bytes()) == digest((proof / 'workflow.yml').read_bytes()), 'Workflow bytes changed'
                  assert (proof / 'expanded-source.test.ts').read_bytes() == Path(BINDINGS['test_path']).read_bytes(), 'Expanded evidence changed'
                  assert load('bindings.json') == BINDINGS and load('expected-case-inventory.json') == BINDINGS['inventory'], 'Case bindings changed'
                  assert load('run-identity.json') == {key: os.environ['PROOF_' + key] for key in BINDINGS['identity_keys']}, 'Run identity changed'
                  for name, binding in BINDINGS['framework'].items():
                      for key, file in binding['files'].items():
                          assert digest((proof / (binding['artifact_prefix'] + '-' + key)).read_bytes()) == file['sha256'], 'Framework evidence changed'
                          assert digest((Path('node_modules') / name / file['relative']).read_bytes()) == file['sha256'], 'Installed framework changed'
                  tests = checked_result()
                  snapshots = {label: validate_snapshot(label) for label in ['source-clean', 'prepared', 'final-clean', 'final-validation-clean']}
                  validation.update({'status': 'EXACT_THREE_AUTHORED_ASSERTIONS_ONLY', 'runtime': 'ACTUAL_GUARDED_CI_RED',
                                     'production_gate': 'ELIGIBLE_FOR_ROOT_ACCEPTANCE_ONLY', 'tests': tests,
                                     'snapshot_sha256': snapshots, 'merge': 'NEVER_MERGE_TRANSPORT',
                                     'limits': 'No later assertions, source fix, coverage, final review or merge credit'})
                  print('Observed exactly three authored toEqual failures at 2511/2574; all other 94 cases and independent gates pass; natural Jest red retained')
              except Exception as error:
                  validation['reason'] = str(error)
                  raise
              finally:
                  save('test-set-validation.json', validation)
          
          
          def seal():
              receipt = {'status': 'INVALID', 'production_gate': 'CLOSED', 'upload': 'PENDING_EXTERNAL_OBSERVATION'}
              try:
                  completeness('evidence-completeness.json', required_files(final=True))
                  validate_commands(['validate'])
                  assert load('test-set-validation.json')['status'] == 'EXACT_THREE_AUTHORED_ASSERTIONS_ONLY', 'Validator did not accept exact failures'
                  receipt.update({'status': 'COMPLETE_ELIGIBLE_FOR_ROOT_ACCEPTANCE_ONLY', 'production_gate': 'ROOT_ACCEPTANCE_REQUIRED'})
              except Exception as error:
                  receipt['reason'] = str(error)
                  raise
              finally:
                  save('seal-receipt.json', receipt)
                  files = {}
                  for path in sorted(proof.rglob('*')):
                      if path.is_file() and path.name != 'hash-manifest.json':
                          assert not path.is_symlink(), 'Unexpected evidence symlink'
                          data = path.read_bytes()
                          files[path.relative_to(proof).as_posix()] = {'bytes': len(data), 'sha256': digest(data)}
                  save('hash-manifest.json', {'algorithm': 'sha256', 'self_excluded': ['hash-manifest.json'], 'files': files})
          
          
          mode = sys.argv[1]
          if mode == 'identity':
              identity()
          elif mode == 'source':
              source()
          elif mode == 'prepared':
              prepared()
          elif mode == 'final':
              snapshot('final-clean')
              print('Recorded final source/index identities; any drift remains visible and invalid')
          elif mode == 'validate':
              validate()
          elif mode == 'seal':
              seal()
          else:
              raise ValueError('Unknown proof mode')
          PYTHON_HELPER
          python3 "$PROOF_DIR/proof-tools.py" identity

      - name: Checkout exact transport head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind frozen source and sole workflow addition
        id: source
        if: ${{ !cancelled() && steps.initialize.outcome == 'success' && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged source python3 "$PROOF_DIR/proof-tools.py" source

      - name: Setup Node22
        id: node
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install frozen dependencies with normal preparation hooks
        id: install
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.node.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged install timeout 10m yarn install --frozen-lockfile --non-interactive

      - name: Verify post-install source index and pinned Jest implementation
        id: prepared
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged prepared python3 "$PROOF_DIR/proof-tools.py" prepared

      - name: Check named test formatting
        id: format
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged format yarn prettier --check src/lib/miden/back/sync-manager.test.ts

      - name: Lint named test without warnings
        id: eslint
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged eslint yarn eslint --max-warnings 0 src/lib/miden/back/sync-manager.test.ts

      - name: Check TypeScript without emitting
        id: typescript
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged typescript yarn tsc --noEmit --pretty false

      - name: Run the complete 97-case sync-manager suite with natural Jest red
        id: jest
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source "$PROOF_DIR/run-logged.bash"
          run_logged jest yarn jest --runTestsByPath src/lib/miden/back/sync-manager.test.ts --maxWorkers=2 --coverage=false --no-colors --json --outputFile="$PROOF_DIR/jest.json"

      - name: Always record final source and index drift
        id: final
        if: ${{ always() }}
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="${PROOF_DIR:-$RUNNER_TEMP/wallet1644-current-preference-red}"
          source "$PROOF_DIR/run-logged.bash"
          run_logged final python3 "$PROOF_DIR/proof-tools.py" final

      - name: Require exactly the three authored matcher failures and seal all evidence
        id: validate
        if: always()
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PREPARED_OUTCOME: ${{ steps.prepared.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          JEST_OUTCOME: ${{ steps.jest.outcome }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        run: |
          set -euo pipefail
          umask 077
          export PROOF_DIR="${PROOF_DIR:-$RUNNER_TEMP/wallet1644-current-preference-red}"
          source "$PROOF_DIR/run-logged.bash"
          validator_exit=0
          run_logged validate python3 "$PROOF_DIR/proof-tools.py" validate || validator_exit=$?
          seal_exit=0
          python3 "$PROOF_DIR/proof-tools.py" seal || seal_exit=$?
          if [ "$validator_exit" -ne 0 ]; then exit "$validator_exit"; fi
          exit "$seal_exit"

      - name: Always retain complete raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wallet1644-current-preference-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wallet1644-current-preference-red
          if-no-files-found: error
          retention-days: 7

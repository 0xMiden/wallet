          proof = Path(os.environ['PROOF_DIR'])
          
          
          def git(*args):
              return subprocess.check_output(['git', *args])
          
          
          def value(*args):
              return git(*args).decode().strip()
          
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def save(name, data):
              (proof / name).write_text(json.dumps(data, indent=2, ensure_ascii=True) + '\n')
          
          
          def load(name):
              return json.loads((proof / name).read_text())
          
          
          def canonical(data):
              return json.dumps(data, sort_keys=True, ensure_ascii=True, separators=(',', ':'))
          
          
          def tree(ref):
              entries = {}
              for record in git('ls-tree', '-rz', ref).split(b'\0'):
                  if record:
                      metadata, name = record.split(b'\t', 1)
                      entries[name.decode()] = metadata.decode().split()
              return entries
          
          
          def snapshot(label):
              manifest = load('source-and-checkout.json')
              entries = tree('HEAD')
              working = {}
              for name, entry in entries.items():
                  path = Path(name)
                  try:
                      observed = path.lstat()
                      if stat.S_ISLNK(observed.st_mode):
                          kind, data = 'symlink', os.fsencode(os.readlink(path))
                      elif stat.S_ISREG(observed.st_mode):
                          kind, data = 'regular', path.read_bytes()
                      else:
                          raise ValueError('Unexpected file type')
                      working[name] = {'git_entry': entry, 'sha256': digest(data), 'bytes': len(data),
                                       'physical_mode': stat.S_IMODE(observed.st_mode), 'kind': kind,
                                       'working_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
                  except Exception as error:
                      working[name] = {'error': str(error), 'git_entry': entry}
              raw_stage = git('ls-files', '--stage', '-z')
              staged = {}
              for record in raw_stage.split(b'\0'):
                  if record:
                      metadata, name = record.split(b'\t', 1)
                      staged[name.decode()] = metadata.decode().split()
              index_path = Path(value('rev-parse', '--git-path', 'index'))
              assert index_path.is_file() and not index_path.is_symlink(), 'Missing or symlinked index'
              raw_index = index_path.read_bytes()
              (proof / (label + '.index.bin')).write_bytes(raw_index)
              (proof / (label + '.index-stage.bin')).write_bytes(raw_stage)
              record = {'head': value('rev-parse', 'HEAD'), 'tree': value('rev-parse', 'HEAD^{tree}'),
                        'committed_entries': entries, 'index_entries': staged,
                        'index_sha256': digest(raw_index), 'index_stage_sha256': digest(raw_stage),
                        'working_entries': working, 'status': value('status', '--porcelain=v2', '--untracked-files=all')}
              save(label + '.map.json', record)
              validate_snapshot(label)
              return record
          
          
          def validate_snapshot(label):
              manifest = load('source-and-checkout.json')
              record = load(label + '.map.json')
              entries = manifest['checkout_entry_map']
              assert record['head'] == manifest['checkout_commit'] and record['tree'] == manifest['checkout_tree'], 'Head/tree drift'
              assert record['committed_entries'] == entries, 'Committed entry drift'
              assert record['index_entries'] == {name: [entry[0], entry[2], '0'] for name, entry in entries.items()}, 'Index entry drift'
              assert digest((proof / (label + '.index.bin')).read_bytes()) == record['index_sha256'], 'Index evidence drift'
              assert digest((proof / (label + '.index-stage.bin')).read_bytes()) == record['index_stage_sha256'], 'Stage evidence drift'
              assert set(record['working_entries']) == set(entries) and not record['status'], 'Working inventory/status drift'
              for name, entry in entries.items():
                  observed = record['working_entries'][name]
                  assert observed.get('working_blob') == entry[2] and observed['git_entry'] == entry, 'Working bytes drift: ' + name
                  assert entry[1] == 'blob' and entry[0] in ['100644', '100755', '120000'], 'Unsupported Git entry'
                  assert observed['kind'] == ('symlink' if entry[0] == '120000' else 'regular'), 'File type drift: ' + name
                  if entry[0] != '120000':
                      assert bool(observed['physical_mode'] & 0o111) == (entry[0] == '100755'), 'Executable mode drift: ' + name
              baseline = record if label == 'source-clean' else load('source-clean.map.json')
              for key in ['head', 'tree', 'committed_entries', 'index_entries', 'index_sha256', 'index_stage_sha256', 'working_entries', 'status']:
                  assert record[key] == baseline[key], 'Source/index snapshot drift: ' + key
              return digest((proof / (label + '.map.json')).read_bytes())
          
          

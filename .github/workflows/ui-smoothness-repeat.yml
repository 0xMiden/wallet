# Same-build repeats of the UI smoothness bench, started by hand.
#
# The pull request job compares two commits on one runner. This job measures
# one commit several times, each in a fresh browser profile, so the spread of
# those medians is the noise floor. It does not post a comment.
name: UI Smoothness Repeat

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: How many fresh-profile runs of the same build
        default: "6"
        required: false

permissions:
  contents: read

jobs:
  repeat:
    name: Repeat the same build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Install
        uses: ./.github/actions/yarn-install

      - name: Install Playwright Chrome
        timeout-minutes: 12
        run: npx playwright install --with-deps chrome

      - name: Measure the same build repeatedly
        timeout-minutes: 40
        env:
          BENCH_BROWSER: chrome
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reps"
          repeats="${REPEATS:-6}"
          for i in $(seq 1 "$repeats"); do
            echo "repeat $i/$repeats"
            rebuild=()
            if [ "$i" = 1 ]; then rebuild=(--rebuild); fi
            BENCH_PROFILE="repeat-$i" node scripts/home-swipe-bench.mjs \
              --label "repeat-$i" --reps 6 --throttle 4 "${rebuild[@]}" \
              --summary "$RUNNER_TEMP/reps/$i.json"
          done
          node --input-type=module -e '
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";
            const dir = process.env.RUNNER_TEMP + "/reps";
            const rows = readdirSync(dir).filter(name => name.endsWith(".json")).sort().map(name => {
              const body = JSON.parse(readFileSync(dir + "/" + name, "utf8"));
              const mid = values => {
                const sorted = [...values].sort((a, b) => a - b);
                const i = Math.floor(sorted.length / 2);
                return sorted.length % 2 ? sorted[i] : (sorted[i - 1] + sorted[i]) / 2;
              };
              return {
                label: body.label,
                feel: mid(body.samples),
                inp: Math.max(...body.inp),
                listDropped: mid(body.listDropped),
                listP95: mid(body.listP95)
              };
            });
            writeFileSync(process.env.RUNNER_TEMP + "/spread.json", JSON.stringify(rows, null, 2));
            console.log(JSON.stringify(rows, null, 2));
          '

      - name: Upload the repeats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoothness-repeats-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/spread.json
            ${{ runner.temp }}/reps
          if-no-files-found: ignore

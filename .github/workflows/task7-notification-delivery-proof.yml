      - name: Retain source and framework capture helper
        run: |
          set -euo pipefail
          cat > "$PROOF_DIR/capture.py" <<'CAPTURE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import subprocess
          import sys
          
          P = Path(os.environ['PROOF_DIR'])
          ROOT = Path.cwd().resolve()
          SPEC = json.loads((P / 'source-spec.json').read_text())
          FRAMEWORK = '''expect/package.json
          expect/build/index.js
          jest-circus/package.json
          jest-circus/build/jestAdapterInit.js
          jest-circus/build/runner.js
          jest-util/package.json
          jest-util/build/index.js
          @jest/test-result/package.json
          @jest/test-result/build/index.js
          @jest/core/package.json
          @jest/core/build/index.js
          jest-matcher-utils/package.json
          jest-matcher-utils/build/index.js
          jest-message-util/package.json
          jest-message-util/build/index.js
          pretty-format/package.json
          pretty-format/build/index.js
          jest-mock/package.json
          jest-mock/build/index.js
          jest/package.json
          jest/build/index.js
          @swc/jest/package.json
          @swc/jest/index.js
          @babel/code-frame/package.json
          @babel/code-frame/lib/index.js
          stack-utils/package.json
          stack-utils/index.js
          slash/package.json
          slash/index.js'''.splitlines()
          
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=ROOT)
          
          
          def write(name, value):
              (P / name).write_text(json.dumps(value, indent=2) + '\n')
          
          
          def physical(path):
              relative = path.relative_to(ROOT)
              assert not any(part.is_symlink() for part in [path, *path.parents] if part != ROOT.parent), str(relative)
              assert path.is_file() and path.resolve().is_relative_to(ROOT), str(relative)
              data = path.read_bytes()
              return {'path': str(relative), 'sha256': sha(data), 'bytes': len(data), 'mode': stat.S_IMODE(path.stat().st_mode)}
          
          
          def snapshot(label, mode):
              rows = []
              for source in SPEC['source_files']:
                  row = physical(ROOT / source['path'])
                  expected = dict(source)
                  if source['path'] == SPEC['helper'] and mode == 'omission':
                      expected['sha256'] = SPEC['omission_helper_sha256']
                      expected['bytes'] = SPEC['omission_helper_bytes']
                  assert all(row[key] == expected[key] for key in ['sha256', 'bytes', 'mode']), (label, row, expected)
                  rows.append(row)
              stage = git('ls-files', '--stage', '-z')
              index = Path(git('rev-parse', '--git-path', 'index').decode().strip())
              if not index.is_absolute():
                  index = ROOT / index
              raw = index.read_bytes()
              assert raw[:4] == b'DIRC' and hashlib.sha1(raw[:-20]).digest() == raw[-20:]
              assert not git('diff', '--cached', '--name-only')
              changed = git('diff', '--name-only').decode().splitlines()
              assert changed == ([SPEC['helper']] if mode == 'omission' else []), (label, changed)
              status = git('status', '--porcelain=v1', '--untracked-files=all').decode()
              assert status == (' M ' + SPEC['helper'] + '\n' if mode == 'omission' else ''), (label, status)
              (P / (label + '.index-stage.bin')).write_bytes(stage)
              (P / (label + '.index.bin')).write_bytes(raw)
              (P / (label + '.diff')).write_bytes(git('diff', '--binary'))
              (P / (label + '.helper.ts')).write_bytes((ROOT / SPEC['helper']).read_bytes())
              write(label + '.source.json', {'mode': mode, 'sources': rows, 'index_sha256': sha(raw), 'status': status})
              if label == 'initial':
                  for source in SPEC['source_files']:
                      target = P / 'source' / source['path']
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(ROOT / source['path'], target)
                  write('initialized.json', {'source_head': SPEC['source_head'], 'initial_source_valid': True})
          
          
          def framework(label):
              rows = [physical(ROOT / 'node_modules' / path) for path in FRAMEWORK]
              if label == 'before':
                  for path in FRAMEWORK:
                      target = P / 'framework' / path
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(ROOT / 'node_modules' / path, target)
              else:
                  assert rows == json.loads((P / 'framework-before.json').read_text()), label
              write('framework-' + label + '.json', rows)
          
          
          def mutate():
              path = ROOT / SPEC['helper']
              data = path.read_bytes()
              needle = b"reportUserVisibleError(errorId, 'os_notification');"
              assert sha(data) == SPEC['normal_helper_sha256'] and data.count(needle) == 2
              changed = data.replace(needle, b'void errorId;')
              assert sha(changed) == SPEC['omission_helper_sha256'] and len(changed) == SPEC['omission_helper_bytes']
              (P / 'omission-helper.ts').write_bytes(changed)
              path.write_bytes(changed)
          
          
          def restore():
              assert (P / 'initialized.json').is_file()
              data = (P / 'source' / SPEC['helper']).read_bytes()
              assert sha(data) == SPEC['normal_helper_sha256']
              shutil.copy2(P / 'source' / SPEC['helper'], ROOT / SPEC['helper'])
          
          
          if __name__ == '__main__':
              command = sys.argv[1]
              if command == 'snapshot':
                  snapshot(sys.argv[2], sys.argv[3])
              elif command == 'framework':
                  framework(sys.argv[2])
              elif command == 'mutate':
                  mutate()
              elif command == 'restore':
                  restore()
              else:
                  raise ValueError(command)
          CAPTURE
      - name: Retain independent exact-result classifier
        run: |
          set -euo pipefail
          cat > "$PROOF_DIR/classify.py" <<'CLASSIFY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import struct
          
          P = Path(os.environ['PROOF_DIR'])
          ROOT = Path.cwd().resolve()
          EXPECTED = json.loads((P / 'expected-inventory.json').read_text())
          CASES = {(row['file'], row['full_name']) for row in EXPECTED['cases']}
          TARGETS = {(row['file'], row['full_name']): row for row in EXPECTED['omission_targets']}
          WITNESSES = {(row['file'], row['full_name']): row for row in EXPECTED['unchanged_native_witnesses']}
          assert len(CASES) == 71 and len(TARGETS) == 9 and len(WITNESSES) == 6
          FILES = ['src/lib/miden/back/background-notification.test.ts',
                   'src/lib/miden/back/background-notification-fallback.test.ts',
                   'src/lib/extension/notifications.test.ts', 'src/components/NoteToastProvider.test.tsx']
          for prerequisite in ['install', 'format', 'lint', 'typescript']:
              assert int((P / (prerequisite + '.exit')).read_text()) == 0, prerequisite
              assert int((P / (prerequisite + '.tee.exit')).read_text()) == 0, prerequisite
          results = {}
          
          for phase, counts in [('normal', (71, 0)), ('omission', (62, 9)), ('restored', (71, 0))]:
              passed, failed = counts
              argv = (P / (phase + '.argv')).read_bytes().split(b'\0')
              assert argv[-1] == b''
              wanted = ['yarn', 'jest', '--runTestsByPath', *FILES, '--maxWorkers=2', '--coverage=false',
                        '--no-colors', '--json', '--outputFile=' + str(P / (phase + '.jest.json'))]
              assert [part.decode() for part in argv[:-1]] == wanted, phase
              data = json.loads((P / (phase + '.jest.json')).read_text())
              assert (data['numTotalTests'], data['numPassedTests'], data['numFailedTests']) == (71, passed, failed), phase
              assert (data['numTotalTestSuites'], data['numPassedTestSuites'], data['numFailedTestSuites']) == (4, 2 if failed else 4, 2 if failed else 0), phase
              assert all(data[key] == 0 for key in ['numPendingTests', 'numTodoTests', 'numPendingTestSuites', 'numRuntimeErrorTestSuites']), phase
              assert data['wasInterrupted'] is False and data['success'] is (not failed), phase
              assert data['openHandles'] == [], phase
              rows = {}
              failures = {}
              for suite in data['testResults']:
                  path = str(Path(suite['name']).resolve().relative_to(ROOT))
                  assert suite['status'] in ['passed', 'failed'] and suite['assertionResults'], (phase, path)
                  for row in suite['assertionResults']:
                      key = (path, row['fullName'])
                      assert key in CASES and key not in rows, (phase, key)
                      assert row['invocations'] == 1 and row['retryReasons'] == [] and row['failing'] is False, (phase, key)
                      assert row['status'] in ['passed', 'failed'], (phase, key)
                      assert isinstance(row['numPassingAsserts'], int) and row['numPassingAsserts'] >= 1, (phase, key)
                      if row['status'] == 'failed':
                          assert phase == 'omission' and key in TARGETS, (phase, key)
                          target = TARGETS[key]
                          assert row['numPassingAsserts'] == target['prior_passing_assertions'], key
                          assert len(row['failureDetails']) == 1 and len(row['failureMessages']) == 1, key
                          matcher = row['failureDetails'][0]['matcherResult']
                          assert matcher['name'] == 'toEqual' and matcher['pass'] is False, key
                          assert matcher['actual'] == [] and matcher['expected'] == target['expected_report'], key
                          message = row['failureMessages'][0]
                          assert 'expect(received).toEqual(expected)' in message, key
                          frames = re.findall(r'\bat [^\n]*?\(([^()\n]+):(\d+):(\d+)\)', message)
                          assert frames, (key, message)
                          first = frames[0]
                          assert str(Path(first[0]).resolve().relative_to(ROOT)) == path, (key, first)
                          assert int(first[1]) == target['first_frame_line'], (key, first)
                          assert int(first[2]) == target['source_matcher_column'], (key, first)
                          failures[key] = {'passing_assertions': row['numPassingAsserts'], 'first_frame': first}
                      else:
                          assert row['failureDetails'] == [] and row['failureMessages'] == [], (phase, key)
                          if key in TARGETS:
                              assert row['numPassingAsserts'] == TARGETS[key]['normal_passing_assertions'], (phase, key)
                          if key in WITNESSES:
                              assert row['numPassingAsserts'] == WITNESSES[key]['passing_assertions'], (phase, key)
                      rows[key] = row
              assert set(rows) == CASES and set(failures) == (set(TARGETS) if failed else set()), phase
              assert int((P / (phase + '.exit')).read_text()) == (1 if failed else 0), phase
              assert int((P / (phase + '.tee.exit')).read_text()) == 0, phase
              results[phase] = {'total': 71, 'passed': passed, 'failed': failed,
                                'passing_assertions': sum(row['numPassingAsserts'] for row in rows.values()),
                                'rows': [{'file': key[0], 'full_name': key[1], 'status': row['status'], 'passing_assertions': row['numPassingAsserts']} for key, row in sorted(rows.items())],
                                'failures': [{'file': key[0], 'full_name': key[1], **value} for key, value in sorted(failures.items())]}
              if phase == 'normal':
                  normal = rows
              else:
                  for key, row in rows.items():
                      if phase == 'restored' or key not in TARGETS:
                          assert row['numPassingAsserts'] == normal[key]['numPassingAsserts'], (phase, key)
          assert results['normal']['passing_assertions'] == results['restored']['passing_assertions']
          assert results['normal']['passing_assertions'] - results['omission']['passing_assertions'] == 14
          def index_identity(raw):
              assert len(raw) >= 32 and raw[:4] == b'DIRC'
              assert hashlib.sha1(raw[:-20]).digest() == raw[-20:]
              version, count = struct.unpack('>II', raw[4:12])
              assert version in (2, 3), version
              limit = len(raw) - 20
              normalized = bytearray(raw[:limit])
              entries, pos = {}, 12
              stat_names = ['ctime_seconds', 'ctime_nanoseconds', 'mtime_seconds', 'mtime_nanoseconds',
                            'device', 'inode', 'uid', 'gid', 'size']
              for _ in range(count):
                  start = pos
                  assert pos + 62 <= limit
                  fields = struct.unpack('>10I20sH', raw[pos:pos + 62])
                  pos += 62
                  flags = fields[-1]
                  extended = None
                  if flags & 0x4000:
                      assert version == 3 and pos + 2 <= limit
                      extended = struct.unpack('>H', raw[pos:pos + 2])[0]
                      pos += 2
                  end = raw.index(b'\0', pos, limit)
                  path = raw[pos:end]
                  assert path and path not in entries
                  assert flags & 0x0fff == min(len(path), 0x0fff)
                  pos = start + ((end - start + 1 + 7) // 8) * 8
                  assert pos <= limit and not any(raw[end:pos])
                  stats = fields[:6] + fields[7:10]
                  entries[path] = {'mode': format(fields[6], '06o'), 'oid': fields[10].hex(),
                                   'stage': (flags >> 12) & 3, 'flags': flags, 'extended_flags': extended,
                                   'stats': dict(zip(stat_names, stats))}
                  # Only cache metadata is excluded; mode and every following identity byte remain.
                  normalized[start:start + 24] = b'\0' * 24
                  normalized[start + 28:start + 40] = b'\0' * 12
              extension_start = pos
              while pos < limit:
                  assert pos + 8 <= limit
                  assert raw[pos:pos + 4] not in [b'link', b'sdir']
                  length = struct.unpack('>I', raw[pos + 4:pos + 8])[0]
                  pos += 8 + length
                  assert pos <= limit
              assert pos == limit and len(entries) == count
              return bytes(normalized), entries, {'version': version, 'entries': count,
                  'raw_sha256': hashlib.sha256(raw).hexdigest(), 'checksum_sha1': raw[-20:].hex(),
                  'normalized_sha256': hashlib.sha256(normalized).hexdigest(),
                  'extension_bytes': limit - extension_start,
                  'extension_sha256': hashlib.sha256(raw[extension_start:limit]).hexdigest()}
          
          
          def stage_identity(raw):
              assert raw.endswith(b'\0')
              entries = {}
              for row in raw[:-1].split(b'\0'):
                  identity, path = row.split(b'\t', 1)
                  mode, oid, stage = identity.decode('ascii').split()
                  assert path not in entries
                  entries[path] = {'mode': mode, 'oid': oid, 'stage': int(stage)}
              return entries
          
          
          initial_raw = (P / 'initial.index.bin').read_bytes()
          initial_normalized, initial_entries, initial_metadata = index_identity(initial_raw)
          initial_stage_raw = (P / 'initial.index-stage.bin').read_bytes()
          initial_stage = stage_identity(initial_stage_raw)
          assert {path: {key: row[key] for key in ['mode', 'oid', 'stage']}
                  for path, row in initial_entries.items()} == initial_stage
          index_checks = {}
          for label in ['initial', 'before-normal', 'after-normal', 'before-omission', 'after-omission', 'before-restored', 'after-restored', 'final']:
              source = json.loads((P / (label + '.source.json')).read_text())
              stage_raw = (P / (label + '.index-stage.bin')).read_bytes()
              assert stage_raw == initial_stage_raw, label
              raw = (P / (label + '.index.bin')).read_bytes()
              normalized, entries, metadata = index_identity(raw)
              assert normalized == initial_normalized, label
              assert stage_identity(stage_raw) == {path: {key: row[key] for key in ['mode', 'oid', 'stage']}
                                                  for path, row in entries.items()}, label
              cache_changes = []
              for path, row in entries.items():
                  changed = {key: {'before': initial_entries[path]['stats'][key], 'after': value}
                             for key, value in row['stats'].items() if initial_entries[path]['stats'][key] != value}
                  if changed:
                      cache_changes.append({'path': path.decode('utf-8'), 'fields': changed})
              index_checks[label] = {**metadata, 'byte_equal_initial': raw == initial_raw,
                                     'stage_bytes_equal_initial': True, 'cache_changes': cache_changes}
              assert source['index_sha256'] == metadata['raw_sha256'], label
              assert source['mode'] == ('omission' if label in ['before-omission', 'after-omission'] else 'normal'), label
          (P / 'index-semantics.json').write_text(json.dumps({'status': 'LOGICAL_IDENTITY_AND_NON_CACHE_BYTES_UNCHANGED',
              'allowed_normalization': 'Only per-entry ctime/mtime/device/inode/uid/gid/size cache fields; each original SHA1 trailer is validated before comparison. Header, mode, OID, complete flags, extended flags, pathname/padding and extension bytes are preserved.',
              'snapshots': index_checks}, indent=2) + '\n')
          for label in ['after-normal', 'after-omission', 'after-restored']:
              assert json.loads((P / ('framework-' + label + '.json')).read_text()) == json.loads((P / 'framework-before.json').read_text()), label
          final = json.loads((P / 'finalization.json').read_text())
          assert final['restored'] is True and final['errors'] == []
          (P / 'classification.json').write_text(json.dumps({'status': 'OBSERVED_SCOPED_COUNTS_AND_SOURCE_VALID_CONTROLLER_ACCEPTANCE_REQUIRED', 'results': results, 'limits': ['No whole-head95, full Unit, platform, final review, live delivery or merge credit.']}, indent=2) + '\n')
          CLASSIFY
      - name: Retain bounded logger and final restore helper then bind source
        run: |
          set -euo pipefail
          cat > "$PROOF_DIR/finalize.py" <<'FINALIZE'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          
          P = Path(os.environ['PROOF_DIR'])
          P.mkdir(parents=True, exist_ok=True)
          errors = []
          restored = False
          try:
              spec = importlib.util.spec_from_file_location('capture', P / 'capture.py')
              capture = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(capture)
              helper = Path(capture.SPEC['helper'])
              if helper.is_file():
                  shutil.copy2(helper, P / 'before-final-restore-helper.ts')
              (P / 'before-final-restore.diff').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
              capture.restore()
              restored = True
              capture.snapshot('final', 'normal')
          except Exception as error:
              errors.append(type(error).__name__ + ': ' + str(error))
          (P / 'finalization.json').write_text(json.dumps({'restored': restored, 'errors': errors}, indent=2) + '\n')
          raise SystemExit(bool(errors))
          FINALIZE
          cat > "$PROOF_DIR/run-logged.bash" <<'LOGGER'
          run_logged() {
            local label="$1"
            shift
            printf '%s\0' "$@" > "$PROOF_DIR/$label.argv"
            set +e
            "$@" 2>&1 | tee "$PROOF_DIR/$label.log"
            local codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${codes[0]}" > "$PROOF_DIR/$label.exit"
            printf '%s\n' "${codes[1]}" > "$PROOF_DIR/$label.tee.exit"
            if [ "${codes[1]}" -ne 0 ]; then return "${codes[1]}"; fi
            return "${codes[0]}"
          }
          LOGGER
          test "$(git rev-parse HEAD)" = "$PROOF_HEAD"
          test "$PROOF_REF" = refs/heads/ci/1616-task7-notification-delivery-proof
          test "$(git show -s --format=%P HEAD)" = f75674cb97a3e4d5c956186140715f660e0b345d
          test "$(git rev-parse f75674cb97a3e4d5c956186140715f660e0b345d^{tree})" = 03c7f93500ded1839833cd2d266eb7888a20b476
          git diff --name-status f75674cb97a3e4d5c956186140715f660e0b345d HEAD > "$PROOF_DIR/workflow-only.names"
          printf 'A\t.github/workflows/task7-notification-delivery-proof.yml\n' > "$PROOF_DIR/expected-workflow-only.names"
          cmp "$PROOF_DIR/workflow-only.names" "$PROOF_DIR/expected-workflow-only.names"
          git diff --binary f75674cb97a3e4d5c956186140715f660e0b345d HEAD > "$PROOF_DIR/workflow-only.diff"
          git cat-file commit HEAD > "$PROOF_DIR/checkout-commit.txt"
          git cat-file commit f75674cb97a3e4d5c956186140715f660e0b345d > "$PROOF_DIR/source-commit.txt"
          git ls-tree --full-tree -r HEAD > "$PROOF_DIR/checkout-tree.txt"
          git ls-tree --full-tree -r f75674cb97a3e4d5c956186140715f660e0b345d > "$PROOF_DIR/source-tree.txt"
          python3 "$PROOF_DIR/capture.py" snapshot initial normal

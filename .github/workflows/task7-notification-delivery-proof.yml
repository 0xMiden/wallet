name: NEVER-MERGE Task7 notification delivery positive and sensitivity proof

on:
  push:
    branches: [ci/1616-task7-notification-delivery-proof]

permissions:
  contents: read

jobs:
  notification-delivery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

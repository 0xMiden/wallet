        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task7-notification-delivery-proof"
          export PROOF_DIR="$RUNNER_TEMP/task7-notification-delivery-proof"
          python3 - <<'SEAL'
          import hashlib,json,os,stat
          from pathlib import Path
          p=Path(os.environ['PROOF_DIR'])
          (p/'acceptance.txt').write_text('UNACCEPTED: external controller must verify exact run/head/parent/source, API artifact size and digest, safe archive readback, all71 case identities,71/0 ->62/9 causal ->71/0 outcomes, native chain witnesses, natural0/1/0 and tee0 exits, and unchanged source/index/framework. No whole-head95, full Unit, final review, platform/live or merge credit. Never merge.\n')
          rows=[]
          for f in sorted(p.rglob('*')):
              if f.is_file() and f.name not in ['files.sha256','files.json']:
                  assert not f.is_symlink()
                  b=f.read_bytes()
                  rows.append({'path':str(f.relative_to(p)),'bytes':len(b),'mode':stat.S_IMODE(f.stat().st_mode),'sha256':hashlib.sha256(b).hexdigest()})
          (p/'files.json').write_text(json.dumps(rows,indent=2)+'\n')
          rows.append({'path':'files.json','sha256':hashlib.sha256((p/'files.json').read_bytes()).hexdigest()})
          (p/'files.sha256').write_text(''.join(row['sha256']+'  '+row['path']+'\n' for row in rows))
          SEAL
      - name: Always retain complete private evidence
        if: always()

name: EVM relay service

# Pull-request checks of the deposit-address relay Worker (services/evm-relay).
# The Jest suites under services/evm-relay/test run in the Unit tests job of
# pr.yml with the rest of the repository. This workflow checks the parts that
# job does not: the Worker's own type-check, the deploy probe, the release
# check of the deploy workflow and a dry-run bundle against the committed
# wrangler.jsonc. It deploys nothing.

on:
  pull_request:
    paths:
      - 'services/evm-relay/**'
      - 'scripts/feature-eligibility-deploy-source.mjs'
      - '.github/workflows/evm-relay.yml'
      - '.github/workflows/deploy-evm-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evm-relay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: EVM relay checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - name: Type-check the Worker and its tests
        run: |
          npx tsc --noEmit -p services/evm-relay/tsconfig.json
          npx tsc --noEmit -p services/evm-relay/tsconfig.test.json
      - name: Test the deploy probe and the release check
        run: node --test services/evm-relay/check-deployment.test.mjs services/evm-relay/prepare-deployment.test.mjs
      - name: Validate Worker bundle and bindings
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.3 deploy --dry-run --config services/evm-relay/wrangler.jsonc

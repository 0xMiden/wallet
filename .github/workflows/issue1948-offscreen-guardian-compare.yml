name: Issue 1948 offscreen guardian coverage comparison
on:
  push:
    branches: [ci/1948-offscreen-guardian-compare]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: e853c96ed00e5af5cc63226eaa3cd80d4a8e0027
            file: src/offscreen/main.test.ts
            label: original
          - source: 6411c24a4793ad53c61701c8608732e734b291bf
            file: src/offscreen/main.dispatch-4.test.ts
            label: split
    name: ${{ matrix.label }}
    env:
      JEST_COVERAGE_SHARD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen source
        env:
          SOURCE: ${{ matrix.source }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - uses: ./.github/actions/yarn-install
      - uses: actions/download-artifact@v4
        with:
          name: sdk505-40842248402
          run-id: 40842248402
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Inject reviewed SDK
        run: |
          echo "3b2dc2765947b8d1ad064735d4bf08ccd100fc312c2901419220ebb721207905  $RUNNER_TEMP/sdk505.tgz" | sha256sum -c
          rm -rf node_modules/@miden-sdk/miden-sdk
          mkdir -p node_modules/@miden-sdk/miden-sdk
          tar -C node_modules/@miden-sdk/miden-sdk -xzf "$RUNNER_TEMP/sdk505.tgz"
      - name: Run same Guardian retry tests under V8 coverage
        env:
          TEST_FILE: ${{ matrix.file }}
        run: yarn test:coverage --runInBand --runTestsByPath "$TEST_FILE" --testNamePattern='guardianPipeline: an apply' --coverageReporters=json --json --outputFile=coverage/jest-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-compare-${{ matrix.label }}
          path: coverage/jest-results.json
          if-no-files-found: warn

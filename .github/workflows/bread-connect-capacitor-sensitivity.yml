          cat > "$proof/control.py" <<'CONTROL'
          import collections
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          proof = pathlib.Path(os.environ['PROOF'])
          contract = json.loads((proof / 'contract.json').read_text())
          mutant = os.environ['MUTANT']
          spec = contract['mutations'][mutant]

          def git(*args):
              return subprocess.check_output(['git', *args])

          def write(name, value):
              (proof / name).write_text(json.dumps(value, indent=2) + '\n')

          def entries(ref):
              result = {}
              for entry in git('ls-tree', '-r', '-z', ref).split(b'\0'):
                  if entry:
                      metadata, path = entry.split(b'\t', 1)
                      result[path.decode()] = metadata.decode().split()
              return result

          def snapshot():
              result = {}
              for path, (mode, kind, blob) in entries('HEAD').items():
                  assert kind == 'blob', (path, kind)
                  p = pathlib.Path(path)
                  data = os.readlink(p).encode() if mode == '120000' else p.read_bytes()
                  actual_mode = '120000' if p.is_symlink() else ('100755' if p.stat().st_mode & stat.S_IXUSR else '100644')
                  result[path] = {'mode': actual_mode, 'sha256': hashlib.sha256(data).hexdigest(), 'blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
              return result

          def expected_snapshot(phase):
              result = json.loads((proof / 'baseline-content.json').read_text())
              if phase == 'mutant':
                  data = pathlib.Path(spec['path']).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == spec['mutant_sha256']
                  result[spec['path']]['sha256'] = spec['mutant_sha256']
                  result[spec['path']]['blob'] = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              return result

          def preserve(phase, name):
              actual = snapshot()
              write(name, actual)
              assert actual == expected_snapshot(phase), 'unexpected tracked content or mode change'

          def check_exit(phase):
              p = proof / phase
              assert int((p / 'tee.exit').read_text()) == 0, 'tee failed'
              assert int((p / 'test.exit').read_text()) == (1 if phase == 'mutant' else 0), 'unexpected test exit'

          operation = sys.argv[1]
          if operation == 'bind':
              source = contract['source']
              head = git('rev-parse', 'HEAD').decode().strip()
              assert git('rev-parse', 'HEAD^').decode().strip() == source
              assert git('rev-parse', source + '^{tree}').decode().strip() == contract['source_tree']
              assert head == os.environ['GITHUB_SHA']
              assert os.environ['GITHUB_REF'] == contract['branch']
              before, after = entries(source), entries(head)
              assert len(before) == 3611
              assert contract['workflow'] not in before
              assert git('diff', '--name-status', source, head).decode().splitlines() == ['A\t' + contract['workflow']]
              assert before == {k: v for k, v in after.items() if k != contract['workflow']}
              assert git('status', '--porcelain', '--untracked-files=no') == b''
              actual = snapshot()
              assert all(actual[p]['blob'] == v[2] and actual[p]['mode'] == v[0] for p, v in after.items())
              write('baseline-content.json', actual)
              write('source-entries.json', before)
              write('checkout-entries.json', after)
              write('identity.json', {'source': source, 'source_tree': contract['source_tree'], 'checkout': head, 'checkout_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'github_sha': os.environ['GITHUB_SHA'], 'github_ref': os.environ['GITHUB_REF'], 'source_entries': len(before), 'preserved_entries': len(before), 'workflow_sha256': hashlib.sha256(pathlib.Path(contract['workflow']).read_bytes()).hexdigest(), 'mutant': mutant})
              (proof / 'workflow.patch').write_bytes(git('diff', '--binary', '--full-index', source, head))
          elif operation == 'mutate':
              preserve('positive', 'before-mutation-content.json')
              p = pathlib.Path(spec['path'])
              data = p.read_text()
              assert hashlib.sha256(data.encode()).hexdigest() == spec['source_sha256']
              for old, new, count in spec['replacements']:
                  if old.startswith('    if '):
                      assert data.splitlines(keepends=True).count(old) == count
                      data = ''.join(new if line == old else line for line in data.splitlines(keepends=True))
                  else:
                      assert data.count(old) == count
                      data = data.replace(old, new, count)
              assert hashlib.sha256(data.encode()).hexdigest() == spec['mutant_sha256']
              p.write_text(data)
              preserve('mutant', 'mutant-content.json')
              (proof / 'mutant.patch').write_bytes(git('diff', '--binary', '--full-index', 'HEAD', '--'))
          elif operation == 'preserve':
              phase = sys.argv[2]
              preserve(phase, phase + '-after-content.json')
          elif operation == 'restore':
              p = pathlib.Path(spec['path'])
              p.write_bytes(git('show', contract['source'] + ':' + spec['path']))
              preserve('positive', 'restored-content.json')
              assert git('diff', '--exit-code', 'HEAD', '--') == b''
              write('restoration.json', {'restored': True, 'source': contract['source'], 'mutant': mutant})
          elif operation == 'validate':
              language, phase = sys.argv[2:]
              check_exit(phase)
              p = proof / phase
              expected = spec['failures'] if phase == 'mutant' else {}
              inventory = contract['inventories'][language]
              if language == 'js':
                  result = json.loads((p / 'jest.json').read_text())
                  assert result['numTotalTests'] == 72 and result['numTotalTestSuites'] == 4
                  assert result['numPendingTests'] == result.get('numTodoTests', 0) == result['numRuntimeErrorTestSuites'] == 0
                  assert not any(suite.get('testExecError') for suite in result['testResults'])
                  cases = [case for suite in result['testResults'] for case in suite['assertionResults']]
                  assert collections.Counter(c['fullName'] for c in cases) == collections.Counter(inventory)
                  assert result['numFailedTests'] == len(expected) and result['numPassedTests'] == 72 - len(expected)
                  for case in cases:
                      assert case['status'] == ('failed' if case['fullName'] in expected else 'passed')
                      if case['fullName'] in expected:
                          oracle = expected[case['fullName']]
                          messages = case['failureMessages']
                          assert len(messages) == 1
                          message = messages[0]
                          assert 'Expected length: 0' in message and 'Received length: 1' in message
                          assert re.search(re.escape(oracle['file']) + ':' + str(oracle['line']) + r':\d+', message)
                  summary = {'total': 72, 'passed': 72 - len(expected), 'failed': len(expected), 'cases': {c['fullName']: c['status'] for c in cases}}
              elif language == 'swift':
                  assert int((p / 'compile.exit').read_text()) == int((p / 'compile-tee.exit').read_text()) == 0
                  compile_log = (p / 'compile.log').read_text()
                  assert not re.search(r'(?m)^.*: error:|^error:', compile_log), 'compiler error output'
                  log = (p / 'test.log').read_text()
                  assert not re.search(r'(?im)fatal error|unexpected signal|crashed|error: Exited', log), 'runtime failure output'
                  ended = re.findall(r"Test Case '-\[BreadConnectPluginTests.NativeOpenAttemptTests (\w+)\]' (passed|failed) ", log)
                  started = re.findall(r"Test Case '-\[BreadConnectPluginTests.NativeOpenAttemptTests (\w+)\]' started\.", log)
                  assert collections.Counter(started) == collections.Counter(inventory)
                  assert collections.Counter(name for name, status in ended) == collections.Counter(inventory)
                  assert all(status == ('failed' if name in expected else 'passed') for name, status in ended)
                  assert re.search(r'Executed 17 tests, with \d+ failures \(0 unexpected\)', log)
                  errors = re.findall(r'NativeOpenAttemptTests\.swift:(\d+): error: -\[BreadConnectPluginTests.NativeOpenAttemptTests (\w+)\] : ([^\n]+)', log)
                  assert len(errors) == sum(': error:' in line for line in log.splitlines())
                  by_name = collections.defaultdict(list)
                  for line, name, message in errors:
                      assert name in expected and message.startswith(('XCTAssertEqual failed:', 'XCTAssertNil failed:'))
                      by_name[name].append({'line': int(line), 'message': message})
                  assert set(by_name) == set(expected)
                  for name, oracle in expected.items():
                      assert oracle in by_name[name], (name, oracle, by_name[name])
                  if os.environ['MUTANT'] == 'M2' and phase == 'mutant':
                      assert all(item == expected[name] for name, items in by_name.items() for item in items)
                  if os.environ['MUTANT'] == 'M5' and phase == 'mutant':
                      for name, items in by_name.items():
                          allowed = [expected[name]] + spec.get('secondary', {}).get(name, [])
                          assert all(item in allowed for item in items), (name, items)
                  summary = {'total': 17, 'passed': 17 - len(expected), 'failed': len(expected), 'cases': dict(ended), 'assertions': dict(by_name)}
              elif language == 'java':
                  files = list((p / 'junit').glob('*.xml'))
                  assert len(files) == 1
                  suite = ET.parse(files[0]).getroot()
                  assert suite.attrib['name'] == 'com.miden.breadconnect.NativeOpenAttemptTest'
                  assert int(suite.attrib['tests']) == 16 and int(suite.attrib['errors']) == int(suite.attrib['skipped']) == 0
                  assert int(suite.attrib['failures']) == len(expected)
                  cases = suite.findall('testcase')
                  assert collections.Counter(c.attrib['name'] for c in cases) == collections.Counter(inventory)
                  actual = {}
                  for case in cases:
                      name = case.attrib['name']
                      assert not case.findall('error') and not case.findall('skipped')
                      failures = case.findall('failure')
                      assert len(failures) == (1 if name in expected else 0)
                      actual[name] = 'failed' if failures else 'passed'
                      if failures:
                          failure = failures[0]
                          assert failure.attrib['type'] == expected[name]['type'] == 'java.lang.AssertionError'
                          assert 'NativeOpenAttemptTest.' + name + '(NativeOpenAttemptTest.java:' + str(expected[name]['line']) + ')' in (failure.text or '')
                  summary = {'total': 16, 'passed': 16 - len(expected), 'failed': len(expected), 'cases': actual}
              else:
                  raise AssertionError(language)
              preserve(phase, phase + '-after-content.json')
              write(phase + '-validation.json', summary)
          else:
              raise AssertionError(operation)
          CONTROL
          python3 "$proof/control.py" bind
      - uses: actions/setup-node@v4
        if: matrix.language != 'swift'
        with: { node-version: 22 }
      - name: Install JavaScript dependencies
        if: matrix.language == 'js'
        uses: ./.github/actions/yarn-install
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.language == 'java'
        with: { packages: platform-tools }
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java'
      - name: Run the JavaScript positive control and M1 assertion mutant
        if: matrix.language == 'js'
        run: |
          set -euo pipefail
          set +e
          yarn prettier --check .github/workflows/bread-connect-capacitor-sensitivity.yml 2>&1 | tee "$PROOF/format.log"
          format_outcomes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${format_outcomes[0]}" > "$PROOF/format.exit"
          printf '%s\n' "${format_outcomes[1]}" > "$PROOF/format-tee.exit"
          test "${format_outcomes[0]}" -eq 0
          test "${format_outcomes[1]}" -eq 0
          for phase in positive mutant; do
            if [ "$phase" = mutant ]; then
              python3 "$PROOF/control.py" mutate
            fi
            out="$PROOF/$phase"
            mkdir -p "$out"
            python3 "$PROOF/control.py" preserve "$phase"
            set +e
            yarn jest packages/bread-connect-capacitor/src/index.test.ts \
              packages/bread-connect-capacitor/src/transport.test.ts \
              packages/bread-connect-capacitor/src/wallet.test.ts \
              packages/bread-connect-capacitor/src/native-opener.test.ts \
              --maxWorkers=2 --json --outputFile="$out/jest.json" 2>&1 | tee "$out/test.log"
            outcomes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${outcomes[0]}" > "$out/test.exit"
            printf '%s\n' "${outcomes[1]}" > "$out/tee.exit"
            python3 "$PROOF/control.py" validate js "$phase"
          done
      - name: Run the Swift positive control and one isolated assertion mutant
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          for phase in positive mutant; do
            if [ "$phase" = mutant ]; then
              python3 "$PROOF/control.py" mutate
            fi
            out="$PROOF/$phase"
            harness="$out/harness"
            mkdir -p "$harness/Sources/BreadConnectPlugin" "$harness/Tests/BreadConnectPluginTests"
            source=packages/bread-connect-capacitor/ios/Sources/BreadConnectPlugin/NativeOpenAttempt.swift
            tests=packages/bread-connect-capacitor/ios/Tests/NativeOpenAttemptTests.swift
            cp "$source" "$harness/Sources/BreadConnectPlugin/"
            cp "$tests" "$harness/Tests/BreadConnectPluginTests/"
            cmp "$source" "$harness/Sources/BreadConnectPlugin/NativeOpenAttempt.swift"
            cmp "$tests" "$harness/Tests/BreadConnectPluginTests/NativeOpenAttemptTests.swift"
            shasum -a 256 "$source" "$tests" \
              "$harness/Sources/BreadConnectPlugin/NativeOpenAttempt.swift" \
              "$harness/Tests/BreadConnectPluginTests/NativeOpenAttemptTests.swift" > "$out/source-sha256.txt"
            cat > "$harness/Package.swift" <<'PACKAGE'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(name: "CapacitorNativeOpenerProof", targets: [
              .target(name: "BreadConnectPlugin"),
              .testTarget(name: "BreadConnectPluginTests", dependencies: ["BreadConnectPlugin"])
          ])
          PACKAGE
            python3 "$PROOF/control.py" preserve "$phase"
            set +e
            swift build --package-path "$harness" --build-tests 2>&1 | tee "$out/compile.log"
            outcomes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${outcomes[0]}" > "$out/compile.exit"
            printf '%s\n' "${outcomes[1]}" > "$out/compile-tee.exit"
            test "${outcomes[0]}" -eq 0
            test "${outcomes[1]}" -eq 0
            set +e
            swift test --package-path "$harness" --skip-build 2>&1 | tee "$out/test.log"
            outcomes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${outcomes[0]}" > "$out/test.exit"
            printf '%s\n' "${outcomes[1]}" > "$out/tee.exit"
            python3 "$PROOF/control.py" validate swift "$phase"
          done
      - name: Run the actual Android plugin positive control and M4 assertion mutant
        if: matrix.language == 'java'
        run: |
          set -euo pipefail
          build="$PROOF/android-build"
          mkdir -p "$build"
          version="$(node -p "require('./package.json').dependencies['@capacitor/android']")"
          (cd "$build" && npm pack "@capacitor/android@$version" --silent > capacitor-package.txt)
          mkdir "$build/capacitor-android"
          tar -xzf "$build"/capacitor-android-*.tgz -C "$build/capacitor-android" --strip-components=1
          cat > "$build/settings.gradle" <<SETTINGS
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File('$build/capacitor-android/capacitor')
          include ':bread-connect-capacitor'
          project(':bread-connect-capacitor').projectDir = new File('$GITHUB_WORKSPACE/packages/bread-connect-capacitor/android')
          SETTINGS
          cat > "$build/build.gradle" <<'BUILD'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.13.0'
              }
          }
          BUILD
          printf 'android.useAndroidX=true\n' > "$build/gradle.properties"
          for phase in positive mutant; do
            if [ "$phase" = mutant ]; then
              python3 "$PROOF/control.py" mutate
            fi
            out="$PROOF/$phase"
            mkdir -p "$out/junit"
            python3 "$PROOF/control.py" preserve "$phase"
            set +e
            packages/bread-connect-kotlin/gradlew -p "$build" \
              :bread-connect-capacitor:clean \
              :bread-connect-capacitor:compileDebugJavaWithJavac \
              :bread-connect-capacitor:testDebugUnitTest --rerun-tasks --console=plain 2>&1 | tee "$out/test.log"
            outcomes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${outcomes[0]}" > "$out/test.exit"
            printf '%s\n' "${outcomes[1]}" > "$out/tee.exit"
            cp packages/bread-connect-capacitor/android/build/test-results/testDebugUnitTest/*.xml "$out/junit/"
            for name in BreadConnectPlugin NativeOpenAttempt; do
              find packages/bread-connect-capacitor/android/build -type f -name "$name.class" -size +0c > "$out/$name.classes"
              test -s "$out/$name.classes"
            done
            python3 "$PROOF/control.py" validate java "$phase"
          done
      - name: Restore and verify the complete source after the isolated mutant
        if: always() && env.PROOF != ''
        run: |
          set -euo pipefail
          python3 "$PROOF/control.py" restore
      - name: Retain positive, negative and source-restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-sensitivity-${{ matrix.mutant }}
          path: |
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/*.json
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/*.patch
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/*.log
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/*.exit
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/control.py
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/*.log
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/*.exit
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/*.txt
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/*.classes
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/*.json
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/junit/*.xml
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/harness/Package.swift
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/harness/Sources/
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/positive/harness/Tests/
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/*.log
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/*.exit
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/*.txt
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/*.classes
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/*.json
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/junit/*.xml
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/harness/Package.swift
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/harness/Sources/
            ${{ runner.temp }}/capacitor-sensitivity-${{ matrix.mutant }}/mutant/harness/Tests/
          if-no-files-found: error

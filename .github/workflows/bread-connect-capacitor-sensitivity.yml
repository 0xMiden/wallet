name: Capacitor request ownership sensitivity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capacitor-ownership-sensitivity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sensitivity:
    name: ${{ matrix.mutant }} (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mutant: M1, language: js, runner: ubuntu-latest }
          - { mutant: M2, language: swift, runner: macos-26 }
          - { mutant: M3, language: swift, runner: macos-26 }
          - { mutant: M4, language: java, runner: ubuntu-latest }
          - { mutant: M5, language: swift, runner: macos-26 }
    env:
      MUTANT: ${{ matrix.mutant }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Bind the fixed source and immutable test contract
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/capacitor-sensitivity-$MUTANT"
          mkdir -p "$proof"
          printf 'PROOF=%s\n' "$proof" >> "$GITHUB_ENV"
          export PROOF="$proof"
          cat > "$proof/contract.json" <<'CONTRACT'
          {
            "source": "4092a4c61ca3ca6dddb728a9a5c1c6e14b147441",

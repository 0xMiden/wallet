                "AppSwitchTransport completes a connection from a relaunch that comes after the ten minutes Bread accepts the request for",
                "AppSwitchTransport connects again after a cancel",
                "AppSwitchTransport connects through Bread and keeps the session with the request it answered",
                "AppSwitchTransport drops an answer whose seal does not open, and one for a session the app no longer holds",
                "AppSwitchTransport drops links that are not Bread's answer to the waiting request",
                "AppSwitchTransport gives up when Bread does not answer in time",

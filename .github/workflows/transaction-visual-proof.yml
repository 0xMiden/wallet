name: Transaction confirmation full visual proof

on:
  push:
    branches:
      - ci/transaction-visual-*

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify exact source parent
        run: git diff --exit-code f37a89b0e HEAD -- . ':!.github/workflows/transaction-visual-proof.yml'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/apt-drop-unused-repos
      - name: Install Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Capture transaction confirmation
        timeout-minutes: 10
        run: yarn playwright test --config playwright.one-click-visual.config.ts
      - name: Verify transaction captures
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          captures = [p for p in Path('test-results/one-click-visual').glob('*/transaction-*.png')]
          assert len(captures) == 36, f'expected 36 transaction captures, got {len(captures)}'
          CHECK
      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-full-visual-proof
          path: test-results/one-click-visual/
          if-no-files-found: warn
          retention-days: 7

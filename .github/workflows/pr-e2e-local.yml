name: Local E2E (Chrome)
on:
  pull_request:
concurrency:
  group: local-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chrome-local:
    # Run the core suite under BOTH block cadences: the miden-node default (3s
    # block / 1s batch, realistic timing) and fast 500ms blocks. Fast blocks
    # guarantee a block lands in the wallet's commit->relay window, making
    # send-private a deterministic guard for the private-note block-hint overshoot
    # (web-sdk#262 / wallet#502). The fast leg is scoped to that one timing-critical
    # spec to stay quick and stable; the default leg keeps full-suite coverage.
    # The default leg's name stays exactly "local-e2e (chrome)" so any required-check
    # mapping is unaffected.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name_suffix: ""
            block_interval: ""
            specs: ""
          - name_suffix: " [fast blocks]"
            block_interval: "500ms"
            specs: "playwright/e2e/tests/send-private.spec.ts"
    name: local-e2e (chrome)${{ matrix.name_suffix }}
    runs-on: ubuntu-latest
    # Cold-cache runs compile miden-client-cli (~8m) + note-transport (~5m);
    # warm-cache runs are ~20m. 45m gives the cold run headroom to seed the cache.
    timeout-minutes: 45
    env:
      E2E_NETWORK: localhost
      MIDEN_NTX_AUTH: e2e-ntx-secret
      # Empty on the default leg -> docker-compose ${VAR:-<default>} falls back to
      # the miden-node defaults; "500ms" on the fast leg.
      MIDEN_NODE_BLOCK_INTERVAL: ${{ matrix.block_interval }}
      MIDEN_NODE_BATCH_INTERVAL: ${{ matrix.block_interval }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      # Pinned exact (NOT @stable): a required gate must not drift with upstream
      # rustc — a newer stable can reject the pinned older CLI/transport crates and
      # go red on unrelated PRs. Bump this deliberately (and the cache key below).
      - uses: dtolnay/rust-toolchain@1.96.1
      # The cargo cache is SHARED by every E2E workflow and warmed on main
      # (.github/workflows/warm-e2e-cargo-cache.yml), so a PR restores it instead
      # of spending ~12 min rebuilding binaries that are byte-identical across
      # jobs. Keyed on what actually determines those binaries — the rustc pin,
      # the note-transport ref and the pinned miden-client-cli rev — NOT on all of
      # package.json, which changes on most PRs for unrelated reasons and used to
      # bust this cache every time.
      - name: Compute shared cargo cache key
        id: cargo_cache_key
        run: |
          rev=$(node -p "require('./package.json').midenClientCliGit.rev")
          url=$(node -p "require('./package.json').midenClientCliGit.url")
          ver=$(node -p "require('./package.json').midenClientCliVersion ?? ''")
          pins=$(printf '%s|%s|%s' "$url" "$rev" "$ver" | sha256sum | cut -c1-16)
          echo "key=miden-e2e-cargo-v1-rust1.96.1-${{ hashFiles('playwright/e2e/local-stack/versions.env') }}-$pins" >> "$GITHUB_OUTPUT"
      - name: Cache cargo (cli + note-transport)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ${{ runner.temp }}/note-transport/target
          # rustc pin is in the key so a toolchain bump forces a clean rebuild
          # (a binary built with a different rustc must not be reused).
          key: ${{ steps.cargo_cache_key.outputs.key }}
      - run: yarn install --frozen-lockfile
      - name: Pre-install miden-client-cli (off the per-test clock)
        run: |
          # The harness auto-installs the CLI lazily on first use, but that ~7min
          # compile blows the 300s per-test timeout. Pre-install the SAME pinned
          # rev here so the harness's `miden-client --version` check short-circuits.
          # Skip when the cargo cache already restored it (else `cargo install`
          # errors "binary already exists"). The cache key hashes package.json, so
          # a present binary is guaranteed to be the pinned rev.
          if ! command -v miden-client >/dev/null 2>&1; then
            url=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.url)")
            rev=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.rev)")
            cargo install miden-client-cli --git "$url" --rev "$rev" --locked
          fi
          miden-client --version
      - name: Bring up node + prover
        working-directory: playwright/e2e/local-stack
        run: |
          # --wait-timeout caps how long --wait blocks on readiness (--timeout is the
          # unrelated shutdown timeout). Retry the bring-up so a transient GHCR image
          # pull failure/rate-limit doesn't fail this (to-be-required) gate.
          for attempt in 1 2 3; do
            docker compose --env-file versions.env -f docker-compose.local.yml up --wait --wait-timeout 300 && exit 0
            echo "bring-up attempt $attempt failed; tearing down and retrying" >&2
            docker compose --env-file versions.env -f docker-compose.local.yml down -v || true
            sleep 10
          done
          exit 1
      - name: Wait for node RPC
        working-directory: playwright/e2e/local-stack
        run: |
          probe() { timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for _ in $(seq 1 90); do
            probe 57291 && probe 50052 && echo "node(57291)+prover(50052) ready" && exit 0
            sleep 2
          done
          echo "node RPC (57291) / prover (50052) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -120
          exit 1
      - name: Start note-transport
        run: playwright/e2e/local-stack/run-note-transport.sh
      - name: Build extension (localnet)
        run: E2E_NETWORK=localhost yarn test:e2e:blockchain:build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run core specs
        # --retries=1 (spec §7 budget; base config is retries:0, shared with the live
        # E2E): a small margin for a rare balance->send-UI sync hiccup on a loaded
        # runner. Deliberately NOT 2 -- kept at 1 so a genuine regression still fails
        # the (to-be-required) gate rather than passing on a lucky third attempt.
        # matrix.specs is empty for the default-timing leg (full core suite) and
        # scoped to send-private for the fast-blocks leg.
        run: xvfb-run -a yarn test:e2e:blockchain:run --retries=1 ${{ matrix.specs }}
      - name: Report flaky (retried-then-passed) specs
        # A spec that failed once and passed on the retry above is reported as a
        # plain green run, so the flake it represents is invisible. Print one
        # FLAKY line per such spec from the JSON report so the flake rate can be
        # read off the log / tracked over time. Diagnostic only -- never fails.
        if: always()
        run: node scripts/report-flaky-e2e.mjs test-results/results.json
      # Guardian (`guardian-*.spec.ts`) coverage lives in its own workflow,
      # pr-e2e-guardian-lifecycle.yml, which brings up BOTH guardians (A :3000 +
      # B :3001, `guardian-switch` compose profile) and runs the full suite via
      # the same playwright.guardian.config.ts. The switch/fault specs REQUIRE
      # guardian-B, so a single-guardian run here can't cover them -- and running
      # the identical suite in two workflows would just double the guardian CI
      # per PR. This workflow stays Tier-1 (core blockchain specs) only.
      - name: Dump stack logs on failure
        if: failure()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -400
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-e2e-report
          path: test-results/
      - name: Tear down
        if: always()
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml down -v || true

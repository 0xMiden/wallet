name: Local E2E (Chrome)
on:
  pull_request:
concurrency:
  group: local-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chrome-local:
    name: local-e2e (chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_NETWORK: localhost
      MIDEN_NTX_AUTH: e2e-ntx-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo (cli + note-transport)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ${{ runner.temp }}/note-transport/target
          key: local-e2e-cargo-v2-${{ hashFiles('package.json', 'playwright/e2e/local-stack/versions.env') }}
      - run: yarn install --frozen-lockfile
      - name: Pre-install miden-client-cli (off the per-test clock)
        run: |
          # The harness auto-installs the CLI lazily on first use, but that ~7min
          # compile blows the 300s per-test timeout. Pre-install the SAME pinned
          # rev here so the harness's `miden-client --version` check short-circuits.
          url=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.url)")
          rev=$(node -e "process.stdout.write(require('./package.json').midenClientCliGit.rev)")
          cargo install miden-client-cli --git "$url" --rev "$rev" --locked
          miden-client --version
      - name: Bring up node + prover
        working-directory: playwright/e2e/local-stack
        run: docker compose --env-file versions.env -f docker-compose.local.yml up --wait --timeout 300
      - name: Wait for node RPC + prover
        working-directory: playwright/e2e/local-stack
        run: |
          probe() { timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1" 2>/dev/null; }
          for _ in $(seq 1 90); do
            probe 57291 && probe 50051 && echo "node(57291)+prover(50051) ready" && exit 0
            sleep 2
          done
          echo "node RPC (57291) / prover (50051) not ready in time" >&2
          docker compose --env-file versions.env -f docker-compose.local.yml logs --no-color | tail -120
          exit 1
      - name: Start note-transport
        run: playwright/e2e/local-stack/run-note-transport.sh
      - name: Build extension (localnet)
        run: E2E_NETWORK=localhost yarn test:e2e:blockchain:build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run core specs
        run: xvfb-run -a yarn test:e2e:blockchain:run
      - name: Dump stack logs on failure
        if: failure()
        working-directory: playwright/e2e/local-stack
        run: docker compose -f docker-compose.local.yml logs --no-color | tail -400
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-e2e-report
          path: test-results/
      - name: Tear down
        if: always()
        working-directory: playwright/e2e/local-stack
        run: docker compose -f docker-compose.local.yml down -v || true

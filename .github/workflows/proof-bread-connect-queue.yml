name: Bread Connect queue semantic proof

on:
  push:
    branches: [ci/1594-queue-proof]

permissions:
  contents: read

jobs:
  queue-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout transport
        uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - name: Preserve transport outside source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wallet1594-queue"
          cp transport/.github/ci-proof/1594-queue/* "$RUNNER_TEMP/wallet1594-queue/"
          cp transport/.github/workflows/proof-bread-connect-queue.yml "$RUNNER_TEMP/wallet1594-queue/"
          cd "$RUNNER_TEMP/wallet1594-queue"
          sha256sum ./* > transport-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > transport-commit.txt
      - name: Checkout exact fixed source
        uses: actions/checkout@v4
        with:
          ref: a0a6b027cfc6c07c727c330c425ab6dbc2784590
          path: source
          persist-credentials: false
      - name: Set up Node22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source-bound queue matrix
        shell: bash
        run: bash "$RUNNER_TEMP/wallet1594-queue/run.sh" "$GITHUB_WORKSPACE/source"
      - name: Upload queue proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bread-connect-queue-proof-${{ github.sha }}
          path: ${{ runner.temp }}/wallet1594-queue/
          if-no-files-found: error
          retention-days: 14

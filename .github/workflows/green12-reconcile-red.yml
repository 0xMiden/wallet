name: Green12 reconciliation regression red
on:
  push:
    branches: [wiktor/green12-reconcile-red]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/yarn-install
      - run: yarn jest scripts/mainnet-provider-artifacts.test.ts --maxWorkers=2 -t Green12

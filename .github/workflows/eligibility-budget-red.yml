name: Eligibility shared budget expected red
on:
  push:
    branches: [ci/1894-budget-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD^)" = 2cdf2b2ba6ac5a91ca6e925ab67cbe15b606dc7d
      - name: Verify functional run bound regressions
        shell: bash
        run: |
          set +e
          node --test services/feature-eligibility/staging-topology-budget.test.mjs > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'not ok 1 - budget scenario shares one cap across reserve and lease paths' result.log || exit 1
          grep -F 'not ok 2 - budget scenario rejects reserve paths that bypass the shared cap' result.log || exit 1
          grep -F '# fail 2' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-red
          path: result.log

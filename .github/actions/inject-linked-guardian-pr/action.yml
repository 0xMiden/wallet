name: Inject linked guardian PR
description: >
  If the current PR's body contains a "Guardian PR: #N" marker, clone the
  linked guardian PR's head, build @openzeppelin/guardian-client and
  @openzeppelin/miden-multisig-client from source, and rewrite the wallet's
  package.json to point at both local builds via `file:` deps. Runs only on
  `pull_request` events (silent no-op on `push`). Fails fast if the linked PR
  is closed without merge.

  Marker syntax (anywhere in the body, first match wins):
    Guardian PR: #440
    Guardian PR: OpenZeppelin/guardian#440       (cross-repo / forks)

  WHY THIS EXISTS. The wallet consumes both guardian clients as published
  npm packages. A wallet change that needs an unreleased guardian export
  (`resolveAuthArg`, say) cannot compile in CI until those packages ship,
  and OpenZeppelin owns the release. Without this action the only options
  were to leave the compile jobs red or to stop importing the new API.

  BOTH PACKAGES COME FROM THE PR, as a pair. The multisig client reads every
  proposal back through guardian-client's converter, which maps the server's
  fields through an explicit list. Pair the PR's multisig client with the
  published guardian-client and any field the PR adds to the wire is dropped
  on the way back, so CI tests a client pair that never ships.

  Mirrors `inject-linked-web-sdk-pr`; it is deliberately the same shape so
  the two read alike. The differences are all simplifications: both clients
  are plain TypeScript, so there is no Rust toolchain to pre-install and no
  wasm target. It installs at the guardian `packages/` workspace root rather
  than inside one package: the multisig client depends on its sibling
  `@openzeppelin/guardian-client`, and a version bump moves both together, so
  resolving the sibling from the registry breaks on every guardian PR that
  raises the version before publishing. The workspace links it from the same
  checkout instead. Nothing else in the guardian repo is built.

inputs:
  github-token:
    description: Token for gh CLI calls (defaults to GITHUB_TOKEN).
    required: false
    default: ${{ github.token }}

outputs:
  patched:
    description: "true if a patch was injected, false otherwise."
    value: ${{ steps.parse.outputs.patched }}
  guardian_pr:
    description: The linked guardian PR number, or empty.
    value: ${{ steps.parse.outputs.num }}
  guardian_repo:
    description: The linked PR's repo (owner/repo), or empty.
    value: ${{ steps.parse.outputs.repo }}
  guardian_head_sha:
    description: The linked PR's head SHA, or empty.
    value: ${{ steps.parse.outputs.head_sha }}

runs:
  using: composite
  steps:
    - id: parse
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "pull_request_target" ]; then
          echo "patched=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=inject-linked-guardian-pr::Skipping on event=$EVENT_NAME (only pull_request triggers patch injection)."
          exit 0
        fi

        if [ -z "${PR_NUMBER:-}" ]; then
          echo "patched=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=inject-linked-guardian-pr::No PR number in event payload."
          exit 0
        fi

        body=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')

        # Anchored to start-of-line so a mention in prose ("see Guardian PR: #440")
        # does not trigger the patch — the marker must be on its own line.
        marker=$(printf '%s' "$body" \
          | grep -ioE '^[[:space:]]*Guardian PR:[[:space:]]*([0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+)?#[0-9]+' \
          | head -1 || true)
        if [ -z "$marker" ]; then
          echo "patched=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        repo=$(printf '%s' "$marker" | grep -oE '[0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+' | head -1 || echo "OpenZeppelin/guardian")
        num=$(printf '%s' "$marker" | grep -oE '[0-9]+$')

        meta=$(gh api "repos/${repo}/pulls/${num}" \
          --jq '"\(.head.repo.owner.login)\t\(.head.repo.name)\t\(.head.ref)\t\(.head.sha)\t\(.state)\t\(.merged)"' 2>/dev/null \
          || { echo "::error title=inject-linked-guardian-pr::Failed to fetch ${repo}#${num}. Does the PR exist? Is GH_TOKEN scoped to read it? A PR raised from a fork resolves to the fork, which must be readable by this token."; exit 1; })

        IFS=$'\t' read -r head_owner head_repo head_ref head_sha state merged <<< "$meta"

        # Closed without merge → loud failure. A merged PR is fine: the build
        # uses the head sha, which outlives the branch.
        state_lc=$(printf '%s' "$state" | tr '[:upper:]' '[:lower:]')
        if [ "$state_lc" != "open" ] && [ "$merged" != "true" ]; then
          {
            echo "## ❌ Linked guardian PR is closed without merge"
            echo
            echo "PR description marker: \`Guardian PR: ${repo}#${num}\`"
            echo
            echo "[\`${repo}#${num}\`](https://github.com/${repo}/pull/${num}) is in state \`${state}\` (not merged)."
            echo
            echo "Re-open it, point \`Guardian PR:\` at a different one, or remove the marker (the wallet will install the published @openzeppelin/guardian-client and @openzeppelin/miden-multisig-client versions pinned in package.json)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Linked PR closed::${repo}#${num} is closed without merge."
          exit 1
        fi

        echo "patched=true" >> "$GITHUB_OUTPUT"
        echo "repo=${repo}" >> "$GITHUB_OUTPUT"
        echo "num=${num}" >> "$GITHUB_OUTPUT"
        echo "head_owner=${head_owner}" >> "$GITHUB_OUTPUT"
        echo "head_repo=${head_repo}" >> "$GITHUB_OUTPUT"
        echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"
        echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
        echo "state=${state}" >> "$GITHUB_OUTPUT"
        echo "merged=${merged}" >> "$GITHUB_OUTPUT"

    - if: steps.parse.outputs.patched == 'true'
      shell: bash
      env:
        REPO: ${{ steps.parse.outputs.repo }}
        NUM: ${{ steps.parse.outputs.num }}
        HEAD_OWNER: ${{ steps.parse.outputs.head_owner }}
        HEAD_REPO: ${{ steps.parse.outputs.head_repo }}
        HEAD_REF: ${{ steps.parse.outputs.head_ref }}
        HEAD_SHA: ${{ steps.parse.outputs.head_sha }}
        MERGED: ${{ steps.parse.outputs.merged }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        GUARDIAN_DIR="${RUNNER_TEMP:-/tmp}/guardian-pr"
        CLIENT_SUBDIR="packages/guardian-client"
        MULTISIG_SUBDIR="packages/miden-multisig-client"

        # Fetch by SHA, not by branch: the head branch is usually deleted when
        # the PR merges, which breaks `clone --branch`. GitHub allows fetching
        # an arbitrary SHA (uploadpack.allowAnySHA1InWant), so this keeps
        # working for a merged PR — which is the common case here, since the
        # guardian change usually lands before its npm release ships.
        echo "::group::Fetch ${HEAD_OWNER}/${HEAD_REPO}@${HEAD_SHA:0:8} (PR was on ${HEAD_REF})"
        rm -rf "$GUARDIAN_DIR"
        mkdir -p "$GUARDIAN_DIR"
        git -C "$GUARDIAN_DIR" init -q
        git -C "$GUARDIAN_DIR" remote add origin "https://github.com/${HEAD_OWNER}/${HEAD_REPO}.git"
        # Authenticate the fetch. These repos are public, but anonymous fetches from the runner
        # started failing with `could not read Username for 'https://github.com'`, which git
        # reports when the server declines the request rather than only for private repos.
        git -C "$GUARDIAN_DIR" config http.extraheader \
          "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
        git -C "$GUARDIAN_DIR" fetch --depth 1 origin "${HEAD_SHA}"
        git -C "$GUARDIAN_DIR" checkout --detach FETCH_HEAD
        echo "::endgroup::"

        for subdir in "$CLIENT_SUBDIR" "$MULTISIG_SUBDIR"; do
          if [ ! -d "$GUARDIAN_DIR/$subdir" ]; then
            echo "::error title=inject-linked-guardian-pr::${REPO}#${NUM} has no ${subdir} directory. Is the marker pointing at the right repo?"
            exit 1
          fi
        done

        # Installed at the WORKSPACE ROOT, not inside a package. The multisig client
        # depends on its sibling `@openzeppelin/guardian-client` by registry range,
        # and guardian bumps both together, so on any PR that raises the version
        # before publishing, that range names a version npm does not have yet and a
        # standalone install dies with ERR_PNPM_NO_MATCHING_VERSION. The workspace
        # links the sibling from this same checkout, which is what guardian's own CI
        # does too.
        echo "::group::Install the guardian packages workspace"
        cd "$GUARDIAN_DIR/packages"
        # Not `npm ci`: the lockfile is resolved against the guardian branch's own dep
        # set and a wallet runner may carry a different registry mirror, so a drifted
        # lockfile must not fail the wallet's CI.
        #
        # --ignore-scripts skips dependency lifecycle scripts, which this build does not
        # need: it is `tsc` over sources. The builds below are invoked explicitly.
        npm install --no-audit --no-fund --ignore-scripts
        echo "::endgroup::"

        # guardian-client first: miden-multisig-client imports its generated dist.
        echo "::group::Build @openzeppelin/guardian-client and @openzeppelin/miden-multisig-client"
        npm run build -w @openzeppelin/guardian-client
        npm run build -w @openzeppelin/miden-multisig-client
        echo "::endgroup::"

        for subdir in "$CLIENT_SUBDIR" "$MULTISIG_SUBDIR"; do
          if [ ! -f "$GUARDIAN_DIR/$subdir/dist/index.js" ]; then
            echo "::error title=inject-linked-guardian-pr::Build produced no ${subdir}/dist/index.js, so the wallet would resolve an empty package."
            exit 1
          fi
        done

        # DROP THE BUILD-TIME node_modules BEFORE THE WALLET INSTALLS THESE.
        #
        # A `file:` dep is COPIED wholesale, nested node_modules included, and the wallet's
        # yarn then resolves imports against that copied tree instead of its own. The
        # workspace install puts deps at `packages/node_modules`, outside the copied
        # subtrees, so this is now a guard rather than the fix it once was. pnpm's
        # layout is not flat: here it gives @noble/curves@1.9.7 a v1 @noble/hashes while the
        # multisig client itself takes the ^2.0.1 it declares. Copy that in and the two
        # collapse: curves resolves against v2, which exports `./utils.js` and not `./utils`,
        # and the wallet's bundler dies with
        #   "./utils" is not exported ... from @openzeppelin/miden-multisig-client/node_modules/@noble/hashes
        # far from anything that names the real cause.
        #
        # Only dist/ and package.json are needed to consume either build. Removing node_modules
        # makes yarn resolve the declared deps in the WALLET's tree, which is what happens
        # with the published packages and is therefore the behaviour we want to reproduce.
        echo "::group::Drop the build-time node_modules from the injected packages"
        rm -rf "$GUARDIAN_DIR/$CLIENT_SUBDIR/node_modules" "$GUARDIAN_DIR/$MULTISIG_SUBDIR/node_modules"
        echo "::endgroup::"

        # Point the wallet at the local builds. $GITHUB_WORKSPACE, not
        # `git rev-parse --show-toplevel`: the CWD is inside the cloned
        # guardian repo, so rev-parse would silently rewrite ITS package.json
        # and leave the wallet on the published versions.
        echo "::group::Rewrite wallet package.json"
        cd "$GITHUB_WORKSPACE"
        node <<EOF
        const fs = require('fs');
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        const guardian = '@openzeppelin/guardian-client';
        const multisig = '@openzeppelin/miden-multisig-client';
        const targets = {
          [guardian]: 'file:' + "${GUARDIAN_DIR}/${CLIENT_SUBDIR}",
          [multisig]: 'file:' + "${GUARDIAN_DIR}/${MULTISIG_SUBDIR}",
        };
        const orig = {};
        for (const [name, target] of Object.entries(targets)) {
          for (const field of ['dependencies', 'devDependencies']) {
            if (pkg[field] && pkg[field][name] !== undefined) {
              orig[field + ' ' + name] = pkg[field][name];
              pkg[field][name] = target;
            }
          }
          // A resolution would pin the published version straight back through a
          // transitive edge, silently undoing the injection.
          for (const k of Object.keys(pkg.resolutions || {})) {
            if (k.includes(name)) {
              orig['(resolution) ' + k] = pkg.resolutions[k];
              delete pkg.resolutions[k];
            }
          }
        }
        if (orig['dependencies ' + multisig] === undefined && orig['devDependencies ' + multisig] === undefined) {
          console.error('::error::' + multisig + ' is not a dependency of the wallet, so nothing was patched.');
          process.exit(1);
        }
        // Pin ONE @openzeppelin/guardian-client, and make it the PR's build. The multisig
        // client declares its own dependency on it, and a \`file:\` dep can resolve that edge
        // separately from the wallet's own, yielding a second copy (a range the build does
        // not satisfy goes to the registry). Two copies means two declarations of RequestAuthPayload,
        // whose private \`canonicalJson\` field makes them nominally distinct, and every
        // signer handed across the boundary fails to typecheck. The pin names the same
        // \`file:\` target as the wallet's own dep, so both edges land on one copy. The
        // published copy is no candidate: its converter drops any field the PR adds to
        // the wire (see the header).
        pkg.resolutions = pkg.resolutions || {};
        pkg.resolutions['**/' + guardian] = targets[guardian];
        console.log('Pinned **/' + guardian + ' ->', targets[guardian]);
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        console.log('Replaced:', JSON.stringify(orig, null, 2), '->', JSON.stringify(targets, null, 2));
        EOF
        echo "::endgroup::"

        {
          echo "## 🔗 Linked guardian PR injected"
          echo
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| PR | [\`${REPO}#${NUM}\`](https://github.com/${REPO}/pull/${NUM}) |"
          echo "| Head | \`${HEAD_OWNER}/${HEAD_REPO}\` |"
          echo "| Pin (head sha) | \`${HEAD_SHA}\` |"
          echo "| Merged | \`${MERGED}\` |"
          echo
          echo "\`@openzeppelin/guardian-client\` and \`@openzeppelin/miden-multisig-client\` were built from source and injected as \`file:\` deps, with every \`@openzeppelin/guardian-client\` edge pinned to that same build. This is a runner-local mutation; nothing is committed."
        } >> "$GITHUB_STEP_SUMMARY"

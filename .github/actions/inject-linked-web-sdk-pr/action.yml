name: Inject linked web-sdk PR
description: >
  If the current PR's body contains a "Web SDK PR: #N" marker, clone the
  linked web-sdk PR's head branch, build the @miden-sdk/miden-sdk and
  @miden-sdk/react packages from source, and rewrite the wallet's
  package.json to point at the local builds via `file:` deps. Runs only on
  `pull_request` events (silent no-op on `push`). On the first run per
  PR (when `comment: true`), posts a sticky comment describing what was
  patched. Fails fast if the linked PR is closed without merge.

  Marker syntax (anywhere in the body, first match wins):
    Web SDK PR: #1234
    Web SDK PR: 0xMiden/web-sdk#1234        (cross-repo / forks)

  This action keeps package.json clean on disk for committers — they
  never need to hand-edit a `file:` dep. Local-dev parity is provided
  by scripts/dev-with-web-sdk-pr.sh, which writes the same patch under a
  marker block you can clear with --clear.

  Nested markers in the LINKED PR's own body are honored too, so a chain
  like wallet → web-sdk → protocol resolves transitively:
    Client PR: #N        pins the cloned SDK's miden-client crates
    Protocol PR: #N      emits a [patch.crates-io] for the protocol
                         crates, which reach the SDK through miden-client
  Both may be present on one web-sdk PR; they compose.

  Mirrors web-sdk's `inject-linked-client-pr` action; the differences are
  (1) the marker name, (2) the dep injection target (package.json vs.
  Cargo.toml), and (3) the build step (the SDK packages must be built
  from source for the wallet to consume them via `file:`, since the
  wallet's pinned npm version doesn't include any unpublished changes).

inputs:
  github-token:
    description: Token for gh CLI calls (defaults to GITHUB_TOKEN).
    required: false
    default: ${{ github.token }}
  comment:
    description: >
      Whether to post/update a sticky PR comment summarizing the patch.
      Default false: this action is typically called from many yarn-using
      jobs in the same workflow run, and posting the same comment from
      each is wasteful. Pass `comment: true` from exactly one designated
      job per workflow run (conventionally the first one that runs
      yarn install). The sticky-comment header dedups across calls, so
      over-firing is correct but spammy.
    required: false
    default: "false"

  build-node-module:
    description: >-
      Build the SDK's napi module and point MIDEN_MODULE_PATH at it. The published
      package ships that binary through platform optionalDependencies
      (@miden-sdk/node-linux-x64-gnu and friends); a `file:` source build has none, so
      any spec that imports the SDK under node dies with "Miden napi module not found".
      Off by default because it is a full native release build — opt in from the one
      job that runs those specs.
    required: false
    default: 'false'
outputs:
  patched:
    description: "true if a patch was injected, false otherwise."
    value: ${{ steps.parse.outputs.patched }}
  web_sdk_pr:
    description: The linked web-sdk PR number, or empty.
    value: ${{ steps.parse.outputs.num }}
  web_sdk_repo:
    description: The linked PR's repo (owner/repo), or empty.
    value: ${{ steps.parse.outputs.repo }}
  web_sdk_head_sha:
    description: The linked PR's head SHA, or empty.
    value: ${{ steps.parse.outputs.head_sha }}

runs:
  using: composite
  steps:
    - id: parse
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        # Skip on push / schedule / workflow_dispatch.
        if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "pull_request_target" ]; then
          echo "patched=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=inject-linked-web-sdk-pr::Skipping on event=$EVENT_NAME (only pull_request triggers patch injection)."
          exit 0
        fi

        if [ -z "${PR_NUMBER:-}" ]; then
          echo "patched=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=inject-linked-web-sdk-pr::No PR number in event payload."
          exit 0
        fi

        body=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')

        # Marker: "Web SDK PR:" optionally followed by "<owner>/<repo>" then "#N".
        # Anchored to start-of-line (with leading whitespace allowed) so a
        # casual mention in prose ("see Web SDK PR: #134") doesn't accidentally
        # trigger the patch — the marker has to be on its own line.
        # First match wins; case-insensitive.
        marker=$(printf '%s' "$body" \
          | grep -ioE '^[[:space:]]*Web SDK PR:[[:space:]]*([0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+)?#[0-9]+' \
          | head -1 || true)
        if [ -z "$marker" ]; then
          echo "patched=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        repo=$(printf '%s' "$marker" | grep -oE '[0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+' | head -1 || echo "0xMiden/web-sdk")
        num=$(printf '%s' "$marker" | grep -oE '[0-9]+$')

        # Resolve head + state.
        meta=$(gh api "repos/${repo}/pulls/${num}" \
          --jq '"\(.head.repo.owner.login)\t\(.head.repo.name)\t\(.head.ref)\t\(.head.sha)\t\(.state)\t\(.merged)"' 2>/dev/null \
          || { echo "::error title=inject-linked-web-sdk-pr::Failed to fetch ${repo}#${num}. Does the PR exist? Is GH_TOKEN scoped to read it?"; exit 1; })

        IFS=$'\t' read -r head_owner head_repo head_ref head_sha state merged <<< "$meta"

        # Closed without merge → loud failure. (A merged PR is acceptable —
        # it just means the linked branch may be stale; the local build
        # still uses the head sha which still exists.)
        state_lc=$(printf '%s' "$state" | tr '[:upper:]' '[:lower:]')
        if [ "$state_lc" != "open" ] && [ "$merged" != "true" ]; then
          {
            echo "## ❌ Linked web-sdk PR is closed without merge"
            echo
            echo "PR description marker: \`Web SDK PR: ${repo}#${num}\`"
            echo
            echo "[\`${repo}#${num}\`](https://github.com/${repo}/pull/${num}) is in state \`${state}\` (not merged)."
            echo
            echo "Either re-open the linked PR, point \`Web SDK PR:\` at a different one, or remove the marker (the wallet will install the published @miden-sdk/miden-sdk version pinned in package.json)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Linked PR closed::${repo}#${num} is closed without merge."
          exit 1
        fi

        echo "patched=true" >> "$GITHUB_OUTPUT"
        echo "repo=${repo}" >> "$GITHUB_OUTPUT"
        echo "num=${num}" >> "$GITHUB_OUTPUT"
        echo "head_owner=${head_owner}" >> "$GITHUB_OUTPUT"
        echo "head_repo=${head_repo}" >> "$GITHUB_OUTPUT"
        echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"
        echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
        echo "state=${state}" >> "$GITHUB_OUTPUT"
        echo "merged=${merged}" >> "$GITHUB_OUTPUT"

    - if: steps.parse.outputs.patched == 'true'
      shell: bash
      env:
        REPO: ${{ steps.parse.outputs.repo }}
        NUM: ${{ steps.parse.outputs.num }}
        HEAD_OWNER: ${{ steps.parse.outputs.head_owner }}
        HEAD_REPO: ${{ steps.parse.outputs.head_repo }}
        HEAD_REF: ${{ steps.parse.outputs.head_ref }}
        HEAD_SHA: ${{ steps.parse.outputs.head_sha }}
        MERGED: ${{ steps.parse.outputs.merged }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        # Where the linked web-sdk PR's head gets built. Runner-local; the
        # path becomes the file: dep target in the wallet's package.json.
        SDK_DIR="${RUNNER_TEMP:-/tmp}/web-sdk-pr"

        # Fetch the linked PR's head by SHA, not by branch. Branches on
        # the upstream repo are typically auto-deleted when the PR merges,
        # which makes `git clone --branch X` fail from that moment on
        # ("Remote branch X not found in upstream"). Commit objects in
        # the upstream's reflog/dangling state are still reachable to
        # `git fetch <sha>` because GitHub enables
        # `uploadpack.allowAnySHA1InWant` by default, so a SHA-fetch
        # survives the branch's deletion. This is what makes the action's
        # docstring claim "merged PR is acceptable" actually true.
        echo "::group::Fetch ${HEAD_OWNER}/${HEAD_REPO}@${HEAD_SHA:0:8} (PR was on ${HEAD_REF})"
        rm -rf "$SDK_DIR"
        mkdir -p "$SDK_DIR"
        git -C "$SDK_DIR" init -q
        git -C "$SDK_DIR" remote add origin "https://github.com/${HEAD_OWNER}/${HEAD_REPO}.git"
        git -C "$SDK_DIR" fetch --depth 1 origin "${HEAD_SHA}"
        git -C "$SDK_DIR" checkout --detach FETCH_HEAD
        echo "::endgroup::"

        # COMPOSE WITH WEB-SDK'S OWN LINKED-DEPENDENCY MARKERS.
        #
        # The linked web-sdk PR may itself depend on an unreleased miden-client,
        # declared by a `Client PR:` marker in ITS description — that is how
        # web-sdk's own CI builds it (.github/actions/inject-linked-client-pr
        # over there). Cloning the branch does not carry that marker's effect,
        # so without this the SDK builds against its published miden-client pin
        # and fails on whatever the client PR adds. The failure surfaces here as
        # a compile error deep inside the SDK, which reads like the SDK is
        # broken rather than like a dependency that was never applied.
        #
        # So: read the linked PR's body, resolve its client PR, and pin the SDK's
        # miden-client crates to that head sha before building. Same rewrite
        # web-sdk performs on itself, by SHA for the same reason (a merged PR's
        # branch is usually deleted; the commit object is not).
        #
        # The body is read once here; both nested markers below parse it, and a
        # web-sdk PR may carry either, both, or neither.
        sdk_body=$(gh api "repos/${REPO}/pulls/${NUM}" --jq '.body // ""' 2>/dev/null || echo "")

        echo "::group::Resolve the linked web-sdk PR's own Client PR marker"
        client_marker=$(printf '%s' "$sdk_body" \
          | grep -ioE '^[[:space:]]*Client PR:[[:space:]]*([0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+)?#[0-9]+' \
          | head -1 || true)
        if [ -z "$client_marker" ]; then
          echo "No Client PR marker on ${REPO}#${NUM}; the SDK builds against its published miden-client pin."
        else
          client_repo=$(printf '%s' "$client_marker" | grep -oE '[0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+' | head -1 || echo "0xMiden/rust-sdk")
          client_num=$(printf '%s' "$client_marker" | grep -oE '[0-9]+$')
          # `if !` rather than `|| { echo ...; exit 1; }`: inside a command
          # substitution the echo is captured into the variable instead of
          # printed, so the step would die with a bare exit 1 and no annotation
          # (gh's own stderr is already suppressed above).
          if ! client_meta=$(gh api "repos/${client_repo}/pulls/${client_num}" \
            --jq '"\(.head.repo.owner.login)\t\(.head.repo.name)\t\(.head.ref)\t\(.head.sha)"' 2>/dev/null); then
            echo "::error title=inject-linked-web-sdk-pr::${REPO}#${NUM} declares 'Client PR: ${client_repo}#${client_num}' but it could not be read."
            exit 1
          fi
          IFS=$'\t' read -r c_owner c_repo c_ref c_sha <<< "$client_meta"
          echo "Pinning the SDK's miden-client to ${c_owner}/${c_repo}@${c_sha:0:8} (from ${client_repo}#${client_num})"

          python3 - "$SDK_DIR/Cargo.toml" "https://github.com/${c_owner}/${c_repo}.git" "${c_sha}" "${client_repo}#${client_num}" <<'PYEOF'
        import re, sys
        path, url, sha, origin = sys.argv[1:5]
        dep_re = re.compile(r'^(?P<name>miden-client(?:-sqlite-store)?)\s*=\s*(?P<rhs>.+)$')
        with open(path) as f:
            lines = f.readlines()
        captured, patched = [], []
        for ln in lines:
            m = dep_re.match(ln)
            if not m:
                continue
            captured.append(ln.rstrip('\n'))
            df = ', default-features = false' if 'default-features = false' in m.group('rhs') else ''
            patched.append(f'{m.group("name")} = {{ git = "{url}", rev = "{sha}"{df} }}')
        if not captured:
            sys.exit(0)
        out, inserted = [], False
        for ln in lines:
            if dep_re.match(ln):
                if not inserted:
                    out.append("# >>>>>>> nested linked-client-pr (wallet CI) >>>>>>>\n")
                    out.append(f"# The linked web-sdk PR declares \"Client PR: {origin}\"; pinned to {sha}.\n")
                    out.append("# Runner-local override; never committed.\n")
                    for c in captured:
                        out.append("#  " + c + "\n")
                    out.append("# <<<<<<< nested linked-client-pr <<<<<<<\n")
                    out.extend(x + "\n" for x in patched)
                    inserted = True
                continue
            out.append(ln)
        with open(path, 'w') as f:
            f.writelines(out)
        print(f"Pinned {len(patched)} miden-client dep(s) to {sha[:8]}")
        PYEOF

          ( cd "$SDK_DIR" && cargo update -p miden-client >/dev/null 2>&1 || true )
        fi
        echo "::endgroup::"

        # And one level further out, for the protocol crates.
        #
        # miden-protocol / miden-standards / miden-tx / miden-tx-batch /
        # miden-block-prover are NOT direct deps of the SDK — they arrive
        # transitively through miden-client. So a `Protocol PR:` marker cannot be
        # applied as a dep-line rewrite; it emits a workspace-wide
        # [patch.crates-io] block instead. That is also what makes it correct:
        # [patch.crates-io] applies to the whole graph, so it redirects the
        # protocol crates the git-pinned miden-client above compiles against too,
        # and client, SDK and wallet all build against one miden-standards.
        #
        # Skipping it is how a MASM change in miden-standards lands in the client
        # but not in the SDK: the SDK's compiled account components keep the
        # published procedure roots, so guarded accounts hash to a root the client
        # doesn't recognize and the pinned-version assert throws at runtime —
        # nothing fails at compile time to point at the missing dependency.
        #
        # Pinned by rev for the same reason as the client block above.
        echo "::group::Resolve the linked web-sdk PR's own Protocol PR marker"
        protocol_marker=$(printf '%s' "$sdk_body" \
          | grep -ioE '^[[:space:]]*Protocol PR:[[:space:]]*([0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+)?#[0-9]+' \
          | head -1 || true)
        if [ -z "$protocol_marker" ]; then
          echo "No Protocol PR marker on ${REPO}#${NUM}; the SDK builds against published protocol crates."
        else
          protocol_repo=$(printf '%s' "$protocol_marker" | grep -oE '[0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+' | head -1 || echo "0xMiden/protocol")
          protocol_num=$(printf '%s' "$protocol_marker" | grep -oE '[0-9]+$')
          if ! protocol_meta=$(gh api "repos/${protocol_repo}/pulls/${protocol_num}" \
            --jq '"\(.head.repo.owner.login)\t\(.head.repo.name)\t\(.head.ref)\t\(.head.sha)"' 2>/dev/null); then
            echo "::error title=inject-linked-web-sdk-pr::${REPO}#${NUM} declares 'Protocol PR: ${protocol_repo}#${protocol_num}' but it could not be read."
            exit 1
          fi
          IFS=$'\t' read -r p_owner p_repo p_ref p_sha <<< "$protocol_meta"
          echo "Pinning the SDK's protocol crates to ${p_owner}/${p_repo}@${p_sha:0:8} (from ${protocol_repo}#${protocol_num})"

          python3 - "$SDK_DIR/Cargo.toml" "https://github.com/${p_owner}/${p_repo}.git" "${p_sha}" "${protocol_repo}#${protocol_num}" <<'PYEOF'
        import re, sys
        path, url, sha, origin = sys.argv[1:5]
        # All five live in the one protocol repo, so one rev pins them coherently.
        # miden-agglayer is in the protocol repo too and is a normal dep of miden-client.
        # Omitting it leaves it resolving miden-standards from the registry, so the graph
        # carries BOTH the patched rc.8 and a published rc.6 and the auth_tx procedure
        # roots still disagree — observed exactly that on wallet #806.
        crates = ['miden-protocol', 'miden-standards', 'miden-tx', 'miden-tx-batch',
                  'miden-block-prover', 'miden-agglayer']
        w = max(len(c) for c in crates)
        patched = [f'{c:<{w}} = {{ git = "{url}", rev = "{sha}" }}' for c in crates]
        head = [
            '# >>>>>>> nested linked-protocol-pr (wallet CI) >>>>>>>\n',
            f'# The linked web-sdk PR declares "Protocol PR: {origin}"; pinned to {sha}.\n',
            '# Workspace-wide rather than a dep-line rewrite: the protocol crates reach\n',
            '# the SDK through miden-client, so this redirects miden-client too.\n',
            '# Runner-local override; never committed.\n',
        ]
        tail = '# <<<<<<< nested linked-protocol-pr <<<<<<<\n'
        with open(path) as f:
            lines = f.readlines()
        table_re = re.compile(r'''^\s*\[patch\.(?:crates-io|"crates-io"|'crates-io')\]\s*$''')
        key_re = re.compile(r'^\s*(?P<name>[A-Za-z0-9_-]+)\s*=')
        header_re = re.compile(r'^\s*\[')
        start = next((i for i, ln in enumerate(lines) if table_re.match(ln)), None)
        if start is None:
            # No [patch.crates-io] yet: append one. A second header would be a
            # TOML duplicate-table error, hence the reuse path below.
            if lines and not lines[-1].endswith('\n'):
                lines.append('\n')
            out = lines + ['\n'] + head + ['[patch.crates-io]\n'] + [p + '\n' for p in patched] + [tail]
        else:
            end = next((i for i in range(start + 1, len(lines)) if header_re.match(lines[i])), len(lines))
            kept, superseded = [], []
            for ln in lines[start + 1:end]:
                m = key_re.match(ln)
                (superseded if m and m.group('name') in crates else kept).append(ln)
            out = (lines[:start + 1] + kept + head
                   + ['#  ' + s.rstrip('\n') + '\n' for s in superseded]
                   + [p + '\n' for p in patched] + [tail] + lines[end:])
        with open(path, 'w') as f:
            f.writelines(out)
        print(f'Patched {len(patched)} protocol crate(s) to {sha[:8]}')
        PYEOF

          # Pre-resolve the patched entries into Cargo.lock. Best-effort: cargo
          # re-resolves a changed [patch] table on the next build regardless, and
          # a crate absent from this graph is not an error.
          ( cd "$SDK_DIR" && for c in miden-protocol miden-standards miden-tx miden-tx-batch miden-block-prover miden-agglayer; do
              cargo update -p "$c" >/dev/null 2>&1 || true
            done )
        fi
        echo "::endgroup::"

        # Pre-install the SDK's pinned Rust toolchain BEFORE the first
        # cargo invocation. The wallet's CI runners are Node-only and
        # don't have nightly + wasm32 + rust-src installed, so when
        # `pnpm run build` invokes `cargo +nightly ... --target
        # wasm32-unknown-unknown -Z build-std=...`, rustup auto-installs
        # nightly mid-invocation and rollup-plugin-rust catches rustup's
        # progress output as stderr (mistaking it for the build error).
        # `rustup show` inside the SDK dir reads the rust-toolchain.toml
        # and force-installs the pinned channel + components + targets
        # synchronously, so subsequent cargo calls see a fully-ready
        # toolchain.
        echo "::group::Install Rust toolchain pinned by web-sdk's rust-toolchain.toml"
        cd "$SDK_DIR"
        rustup show
        cd -
        echo "::endgroup::"

        # Stable wasm32 std for the SDK's ST rollup path. Web-sdk's
        # rollup.config.js sets RUSTUP_TOOLCHAIN=stable when
        # MIDEN_BUILD_VARIANT=st (only nightly is needed for MT — see
        # 0xMiden/web-sdk@40587c5d). Without stable's wasm32 std, the
        # ST cargo build dies with "can't find crate for `std`".
        echo "::group::Install stable + wasm32 target for the ST rollup path"
        rustup install stable --no-self-update
        rustup target add wasm32-unknown-unknown --toolchain stable
        echo "::endgroup::"

        # Pre-install the SDK's pinned Rust toolchain BEFORE the first
        # cargo invocation. The wallet's CI runners are Node-only and
        # don't have nightly + wasm32 + rust-src installed, so when
        # `pnpm run build` invokes `cargo +nightly ... --target
        # wasm32-unknown-unknown -Z build-std=...`, rustup auto-installs
        # nightly mid-invocation and rollup-plugin-rust catches rustup's
        # progress output as stderr (mistaking it for the build error).
        # `rustup show` inside the SDK dir reads the rust-toolchain.toml
        # and force-installs the pinned channel + components + targets
        # synchronously, so subsequent cargo calls see a fully-ready
        # toolchain.
        echo "::group::Install Rust toolchain pinned by web-sdk's rust-toolchain.toml"
        cd "$SDK_DIR"
        rustup show
        cd -
        echo "::endgroup::"

        # Stable wasm32 std for the SDK's ST rollup path. Web-sdk's
        # rollup.config.js sets RUSTUP_TOOLCHAIN=stable when
        # MIDEN_BUILD_VARIANT=st (only nightly is needed for MT — see
        # 0xMiden/web-sdk@40587c5d). Without stable's wasm32 std, the
        # ST cargo build dies with "can't find crate for `std`".
        echo "::group::Install stable + wasm32 target for the ST rollup path"
        rustup install stable --no-self-update
        rustup target add wasm32-unknown-unknown --toolchain stable
        echo "::endgroup::"

        # Install + build the SDK packages from source. We need both
        # @miden-sdk/miden-sdk (the WASM SDK) and @miden-sdk/react (which
        # has its own dist/). The wallet may also depend on
        # @miden-sdk/vite-plugin transitively but it's lighter — it'll
        # install fine via pnpm's workspace install.
        echo "::group::Install web-sdk deps"
        cd "$SDK_DIR"
        # Use pnpm to match web-sdk's package manager. corepack is the
        # preferred way to invoke a versioned pnpm; fall back to npx.
        if command -v corepack >/dev/null 2>&1; then
          corepack enable >/dev/null 2>&1 || true
          PNPM="corepack pnpm"
        elif command -v pnpm >/dev/null 2>&1; then
          PNPM="pnpm"
        else
          npm install -g pnpm@9 >/dev/null
          PNPM="pnpm"
        fi
        $PNPM install --frozen-lockfile
        echo "::endgroup::"

        # Build the WASM SDK in fast mode (skips wasm-opt's 1-2 min
        # post-link pass, switches LTO off + codegen-units=16 via the
        # `release-fast` cargo profile). Wallet CI only consumes the
        # built dist/ for testing, never publishes it, so the fast
        # profile is correct here. Without this, the full release
        # build with wasm-opt -O3 takes ~15-20 min — ~3-5x what we
        # need.
        #
        # We do NOT skip the MT variant: post the cleanup commit that
        # dropped scripts/build-mt-conditional.js, `pnpm run build`
        # always builds both variants regardless of MIDEN_FAST_BUILD.
        echo "::group::Build @miden-sdk/miden-sdk (ST + MT, fast profile)"
        cd "$SDK_DIR/crates/web-client"
        MIDEN_FAST_BUILD=true $PNPM run build
        echo "::endgroup::"

        if [ "${{ inputs.build-node-module }}" = "true" ]; then
          echo "::group::Build the SDK's napi module (nodejs feature)"
          cd "$SDK_DIR"

          # `miden-client-web` is declared `crate-type = ["cdylib"]`, so a HOST
          # build (no --target) drops the addon at
          # target/release/libmiden_client_web.so on linux — right next to
          # target/release/libmiden_client_web.d, cargo's dep-info file.
          # Globbing `libmiden_client_web.*` and taking `head -1` therefore
          # picks the `.d` (it sorts before `.so`), and copying that ~200-byte
          # TEXT file to miden_client_web.node yields a green build, a set
          # MIDEN_MODULE_PATH, and a spec that dies on
          # `require(): invalid ELF header`.
          #
          # So: ask cargo where it actually put the artifact rather than
          # guessing. That is also immune to CARGO_TARGET_DIR,
          # `build.target-dir`, and a --target triple relocating the directory.
          # (Progress and diagnostics still go to stderr, so the job log is
          # unchanged; only the JSON message stream is captured.)
          artifacts="${RUNNER_TEMP:-/tmp}/napi-build-artifacts.jsonl"
          cargo build -p miden-client-web --no-default-features --features nodejs \
            --release --message-format=json-render-diagnostics > "$artifacts"

          lib="$(python3 - "$artifacts" <<'PYEOF'
        import json, sys

        # A cdylib's compiler-artifact message lists the linked library in
        # `filenames`; the .d dep-info file is never in there. Match the LIB
        # target's name (miden_client_web), not the package name
        # (miden-client-web), and accept every host extension so this keeps
        # working if the action is ever run on a macOS or Windows runner.
        found = ""
        with open(sys.argv[1], encoding="utf-8", errors="replace") as fh:
            for line in fh:
                line = line.strip()
                if not line.startswith("{"):
                    continue
                try:
                    msg = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if msg.get("reason") != "compiler-artifact":
                    continue
                if (msg.get("target") or {}).get("name") != "miden_client_web":
                    continue
                for name in msg.get("filenames") or []:
                    if name.endswith((".so", ".dylib", ".dll")):
                        found = name
        print(found)
        PYEOF
        )"

          # NB: keep this as an explicit `if`, not `[ -n "$lib" ] || { ...; }`
          # after a pipeline — under `set -euo pipefail` a failing producer
          # kills the step before the error message can fire, which is how the
          # previous version could only ever fail silently.
          if [ -z "$lib" ] || [ ! -f "$lib" ]; then
            echo "::error title=napi build::cargo built miden-client-web but reported no cdylib for the 'miden_client_web' lib target (artifact messages: $artifacts)."
            exit 1
          fi

          # node's `require()` only accepts a native addon under a `.node` name.
          # Write it beside the library, which is exactly where the SDK's own
          # dev-mode loader puts its copy
          # (crates/web-client/js/node/loader.js, candidate 4).
          node_module="$(dirname "$lib")/miden_client_web.node"
          cp -f "$lib" "$node_module"

          # Prove it loads before handing the path to the specs — this is the
          # check that would have caught the `.d` file. A bad addon now fails
          # here, in this step, instead of as an opaque playwright failure ten
          # minutes later. `process.exit(0)` because napi's tokio runtime can
          # hold the event loop open.
          node -e 'const p = process.argv[1]; const m = require(p); if (!m || typeof m !== "object") { throw new Error("napi module loaded but exported " + typeof m); } console.log("napi module loads: " + p); process.exit(0);' "$node_module"

          # Consumed by the SDK loader's step 1 (explicit override). It has to
          # be this env var rather than the loader's repo-target-dir fallback:
          # yarn COPIES a `file:` dep into node_modules, so that fallback walks
          # up from the wallet's node_modules and never finds the SDK checkout.
          echo "MIDEN_MODULE_PATH=$node_module" >> "$GITHUB_ENV"
          echo "::endgroup::"
        fi

        echo "::group::Build @miden-sdk/react"
        cd "$SDK_DIR/packages/react-sdk"
        $PNPM run build
        echo "::endgroup::"

        echo "::group::Build @miden-sdk/vite-plugin"
        cd "$SDK_DIR/packages/vite-plugin"
        $PNPM run build
        echo "::endgroup::"

        # Now patch the wallet's package.json to depend on the local
        # builds via `file:` URIs. Yarn 1 supports file: deps natively
        # (copies the dir into node_modules at install time), and
        # `yarn.lock` updates accordingly.
        #
        # IMPORTANT: use `$GITHUB_WORKSPACE` to find the wallet root, NOT
        # `git rev-parse --show-toplevel`. Our CWD here is inside the
        # cloned SDK repo, so rev-parse would return the SDK root and
        # we'd silently mutate the SDK's package.json (which doesn't have
        # `@miden-sdk/miden-sdk` as a top-level dep, so the rewrite
        # would be a no-op and the wallet's CI would build against its
        # original npm-pinned version — exactly what the marker is
        # supposed to override).
        echo "::group::Rewrite wallet package.json"
        wallet_root="$GITHUB_WORKSPACE"
        cd "$wallet_root"
        node <<EOF
        const fs = require('fs');
        const path = require('path');
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        const sdkPath = "${SDK_DIR}/crates/web-client";
        const reactPath = "${SDK_DIR}/packages/react-sdk";
        const vitePluginPath = "${SDK_DIR}/packages/vite-plugin";
        const targets = {
          '@miden-sdk/miden-sdk': 'file:' + sdkPath,
          '@miden-sdk/react': 'file:' + reactPath,
          '@miden-sdk/vite-plugin': 'file:' + vitePluginPath,
        };
        const orig = {};
        for (const [k, v] of Object.entries(targets)) {
          if (pkg.dependencies && pkg.dependencies[k] !== undefined) {
            orig[k] = pkg.dependencies[k];
            pkg.dependencies[k] = v;
          }
          if (pkg.devDependencies && pkg.devDependencies[k] !== undefined) {
            orig['(dev) ' + k] = pkg.devDependencies[k];
            pkg.devDependencies[k] = v;
          }
        }
        // Clear yarn resolutions for these scopes so yarn can't pin to the
        // pre-injection version through a transitive resolution.
        if (pkg.resolutions) {
          for (const k of Object.keys(pkg.resolutions)) {
            if (k.includes('@miden-sdk')) {
              orig['(resolution) ' + k] = pkg.resolutions[k];
              delete pkg.resolutions[k];
            }
          }
        }
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        console.log('Original deps replaced:', JSON.stringify(orig, null, 2));
        EOF
        echo "::endgroup::"

        # Surface the patch state in the job summary regardless of comment-on/off.
        {
          echo "## 🔗 Linked web-sdk PR injected"
          echo
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Marker | \`Web SDK PR: ${REPO}#${NUM}\` |"
          echo "| Head | \`${HEAD_OWNER}/${HEAD_REPO}@${HEAD_REF}\` |"
          echo "| Pin | \`${HEAD_SHA}\` |"
          echo "| Build path | \`${SDK_DIR}\` |"
          echo "| Merged upstream | \`${MERGED}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    # Comment lifecycle (only fires when comment=true, by convention from a
    # single designated job per workflow run):
    #   - patched=true → upsert the sticky comment via the same `header`,
    #     so re-runs UPDATE the existing comment in place (no duplicates).
    #   - patched=false → DELETE any prior comment with the same header.
    # The comment step is decorative — if it fails (missing pull-requests:
    # write permission, transient API blip, etc.) we don't want to abort
    # the build. Surface as a notice and continue.
    #
    # `always()` keeps the comment posting even when the SDK-build step
    # above failed. The comment surfaces the marker / linked-PR info so
    # the user can see what we *tried* to test against — useful precisely
    # in the broken-build case, when they need to decide between fixing
    # the marker, fixing the linked PR, or removing the marker.
    - if: always() && inputs.comment == 'true' && steps.parse.outputs.patched == 'true'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728 # v2.9.4
      with:
        header: linked-web-sdk-pr
        message: |
          🔗 **Linked web-sdk PR**: [`${{ steps.parse.outputs.repo }}#${{ steps.parse.outputs.num }}`](https://github.com/${{ steps.parse.outputs.repo }}/pull/${{ steps.parse.outputs.num }})

          | Field | Value |
          |---|---|
          | Patched at | `${{ steps.parse.outputs.head_owner }}/${{ steps.parse.outputs.head_repo }}@${{ steps.parse.outputs.head_ref }}` |
          | Pin (head sha) | `${{ steps.parse.outputs.head_sha }}` |
          | Upstream state | `${{ steps.parse.outputs.state }}` (merged: `${{ steps.parse.outputs.merged }}`) |

          This run is testing against the linked PR's head — `@miden-sdk/miden-sdk` and `@miden-sdk/react` are built from source and installed via `file:` deps. The published wallet artifact will use the canonical npm-pinned versions; CI on `main` does **not** auto-patch.

          Local-dev parity:
          ```
          scripts/dev-with-web-sdk-pr.sh ${{ steps.parse.outputs.num }}    # apply the same patch locally
          scripts/dev-with-web-sdk-pr.sh --clear                            # remove it before commit
          ```

    - if: always() && inputs.comment == 'true' && steps.parse.outputs.patched != 'true'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728 # v2.9.4
      with:
        header: linked-web-sdk-pr
        delete: true

    # Its own step: the injection step above is 20.6k characters and GitHub caps a single
    # `run:` at 21000, so anything further added there fails the whole action at parse time
    # with "Exceeded max expression length" — which reads like a syntax error, not a size one.
    #
    # A partly-applied patch is silent: cargo emits no warning and simply resolves a registry
    # copy alongside the git one, so every step stays green while the account-component
    # procedure roots disagree. A missing miden-agglayer cost a full CI round exactly that way.
    - name: Verify the protocol patch applied cleanly
      shell: bash
      run: |
        set -euo pipefail
        SDK_DIR="${RUNNER_TEMP:-/tmp}/web-sdk-pr"
        lock="$SDK_DIR/Cargo.lock"
        [ -f "$lock" ] || exit 0          # no linked SDK PR: nothing to verify
        grep -q 'github.com/0xMiden/protocol' "$lock" || exit 0   # no protocol patch in play
        dupes=""
        for c in miden-protocol miden-standards miden-tx miden-tx-batch miden-block-prover miden-agglayer; do
          n=$(grep -c "^name = \"$c\"$" "$lock" 2>/dev/null || true)
          if [ "${n:-0}" -gt 1 ]; then dupes="$dupes $c($n)"; fi
        done
        if [ -n "$dupes" ]; then
          echo "::error title=inject-linked-web-sdk-pr::protocol patch applied only partly; these resolve to more than one source:${dupes}. The build mixes protocol versions and the account procedure roots will not match."
          exit 1
        fi
        echo 'protocol patch verified: one source per crate'

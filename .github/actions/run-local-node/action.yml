name: Start local 0.16 test node
description: >
  Build (cached) and start the 0.16 test node via miden-client's scripts/start-test-node.sh at
  the rev pinned in playwright/e2e/local-stack/versions.env. The script cargo-installs the four
  node binaries (at the node rev its Cargo.lock pins), generates genesis, seeds each component's
  DB, and starts validator + sequencer + ntx-builder + prover, leaving them running
  (--background). The published ghcr node images lag the node the SDK is built against, so the
  node is compiled from source rather than pulled.
inputs:
  verification-base-fee:
    description: >
      The chain's `verification_base_fee`, in the fee asset's smallest unit, baked into genesis.
      NON-ZERO IS THE POINT: on a zero-fee chain the kernel skips the fee branch entirely, so
      every fee-related assertion in the suite passes without a fee ever being charged, which
      looks like coverage and is not. 10000 matches devnet. Pass '0' only for a suite that
      cannot yet run against fees, and say why at the call site.
    required: false
    default: '10000'
runs:
  using: composite
  steps:
    - name: Read node pins
      id: pins
      shell: bash
      run: |
        set -a; . playwright/e2e/local-stack/versions.env; set +a
        echo "repo=$NODE_SRC_REPO" >> "$GITHUB_OUTPUT"
        echo "rev=$NODE_SRC_REF"  >> "$GITHUB_OUTPUT"
    - name: Install node build deps
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler clang cmake
    - name: Checkout miden-client (test-node infra)
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "${{ runner.temp }}/miden-client"
        git clone --filter=blob:none "${{ steps.pins.outputs.repo }}" "${{ runner.temp }}/miden-client"
        git -C "${{ runner.temp }}/miden-client" checkout "${{ steps.pins.outputs.rev }}"
    # Split restore/save rather than `actions/cache`. That action saves from a
    # POST step, and GitHub skips post steps once the job has failed — so the
    # cache could only ever be written by a fully green run. This node takes
    # ~36 min to compile cold, which on its own leaves too little of the job's
    # 60 min for the specs to finish: the job fails, the post step is skipped,
    # nothing is cached, and the next run starts cold again. The cache was
    # therefore never populated at all, and the failure it caused was the very
    # thing preventing it from being populated. Saving here, straight after the
    # build, breaks the cycle — the compile is what's expensive and it has
    # already succeeded, whatever the specs go on to do.
    - name: Restore node build
      id: node_cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/miden-client/target/test-node
        key: local-node-build-${{ steps.pins.outputs.rev }}-fee${{ inputs.verification-base-fee }}-rust1.96.1
    - name: Patch prover port 50051 -> 50052
      shell: bash
      # The wallet's localnet remote-prover endpoint is :50052 (the guardian binds :50051);
      # start-test-node.sh defaults the prover to :50051, so retarget it (and the ntx-builder's
      # tx-prover.url, which reads the same PROVER_PORT).
      run: |
        f="${{ runner.temp }}/miden-client/scripts/start-test-node.sh"
        # prover -> :50052 (guardian binds :50051); bind the sequencer RPC on 0.0.0.0 so the
        # bridge-networked guardian containers can reach it via host.docker.internal.
        sed -i 's/^PROVER_PORT=50051$/PROVER_PORT=50052/' "$f"
        sed -i 's|sequencer --rpc.listen "$RPC"|sequencer --rpc.listen "0.0.0.0:57291"|' "$f"
    - name: Patch block cadence
      shell: bash
      # start-test-node.sh HARDCODES the sequencer's `--block.interval 3s
      # --batch.interval 1s`. MIDEN_NODE_BLOCK_INTERVAL was written when this stack
      # ran under docker-compose.local.yml, which passed it through; the native
      # script reads no such variable, so setting it configured NOTHING and the
      # "fast blocks" leg has been running at 3s the whole time.
      #
      # That is worse than a slow leg, because a spec cannot see it. `recall.ts`
      # sizes a recall window in BLOCKS from this same variable — the only cadence
      # the process can claim to know — so at 500ms it asks for 360 blocks believing
      # they take 180s, and against a real 3s cadence they take 18 minutes. The spec
      # then fails as "the note never became reclaimable", which reads like a product
      # bug in recall and is nothing of the sort.
      #
      # Only patch when the caller asked for a cadence: unset means the leg wants the
      # script's own 3s, which is exactly what `recallBlocksForWindow` assumes for the
      # empty case, so the two already agree.
      run: |
        [ -n "${MIDEN_NODE_BLOCK_INTERVAL:-}" ] || { echo "No cadence requested; leaving the script's 3s/1s default."; exit 0; }
        f="${{ runner.temp }}/miden-client/scripts/start-test-node.sh"
        line='--block.interval 3s --batch.interval 1s'
        # Verified, not best-effort: a silently-missed sed is the exact failure above,
        # and it would come back the moment upstream reformats this line.
        grep -qF -- "$line" "$f" || {
          echo "::error::start-test-node.sh no longer contains '$line' — the block-cadence patch matched nothing. Update it, or the node runs at a cadence the specs do not expect."
          exit 1
        }
        sed -i "s|$line|--block.interval ${MIDEN_NODE_BLOCK_INTERVAL} --batch.interval ${MIDEN_NODE_BATCH_INTERVAL:-${MIDEN_NODE_BLOCK_INTERVAL}}|" "$f"
        grep -n -- '--block.interval' "$f"
    - name: Build + start node
      shell: bash
      # MIDEN_PROVER_TIMEOUT / MIDEN_PROVER_CAPACITY are read by miden-remote-prover's
      # own clap args, so they reach it through start-test-node.sh without patching the
      # script. Both defaults (60s, 1) are sized for a dedicated prover host and are
      # wrong here: this runner has 2 cores shared by validator + sequencer +
      # ntx-builder + prover + two Chrome instances, and the ntx-builder points at the
      # SAME prover (tx-prover.url), so the wallet contends with network-transaction
      # proving for it.
      #   timeout: a transaction proof that exceeds it is ABORTED server-side. At 60s a
      #     wallet consume under that load routinely lost, and the wallet's delegated
      #     prove has no client-side deadline of its own, so the write then hung
      #     indefinitely holding the offscreen WASM mutex — every later claim queued
      #     behind it and syncState timed out. That is the whole #718 claim stall.
      #   capacity: max IN-FLIGHT requests including the one being proved (the prover is
      #     serial), i.e. 1 means an ntx-builder proof in progress leaves no room for the
      #     wallet's. Give the two producers their own slots plus headroom.
      env:
        MIDEN_PROVER_TIMEOUT: 10m
        MIDEN_PROVER_CAPACITY: '4'
        # Read by miden-client's test-node-genesis when it renders genesis.toml.
        # Unset (or 0) means `verification_base_fee = 0` and a fee-free chain.
        MIDEN_TEST_NODE_VERIFICATION_BASE_FEE: ${{ inputs.verification-base-fee }}
      run: |
        cd "${{ runner.temp }}/miden-client"
        # Retried because bring-up has a startup race we do not own. The script
        # launches the ntx-builder without waiting for the sequencer's RPC to
        # listen, and the sequencer's first start rebuilds its account, nullifier
        # and state-forest trees from SQLite before it binds. On a slow runner that
        # rebuild outlasts the ntx-builder's connect, which then exits:
        #   failed to initialize ntx builder ... tcp connect error 127.0.0.1:57291
        #   Connection refused (os error 111)
        # and takes the whole job down in setup, before a single spec runs. Our own
        # "Wait for node RPC" step cannot cover this — it runs after the script has
        # already given up. A second attempt starts against warm SQLite-derived
        # RocksDB state, so the sequencer binds promptly.
        for attempt in 1 2 3; do
          if ./scripts/start-test-node.sh --background; then exit 0; fi
          echo "::warning::node bring-up attempt $attempt failed; retrying in 10s"
          pkill -f 'miden-(validator|node|ntx-builder|remote-prover)' 2>/dev/null || true
          sleep 10
        done
        echo "::error::node bring-up failed after 3 attempts"
        exit 1
    # Assert the chain came up with the fee that was asked for. Without this the single
    # most consequential property of the run is invisible: a suite that believes it is
    # proving fee behaviour passes on a fee-free chain and reports green.
    - name: Verify genesis fee parameters
      shell: bash
      run: |
        set -euo pipefail
        g="${{ runner.temp }}/miden-client/target/test-node/data/genesis-config/genesis.toml"
        actual=$(grep -E '^verification_base_fee' "$g" | tr -dc '0-9')
        want='${{ inputs.verification-base-fee }}'
        echo "genesis verification_base_fee=$actual (requested $want)"
        if [ "$actual" != "$want" ]; then
          echo "::error::genesis has verification_base_fee=$actual but $want was requested; the chain is not charging what the suite assumes"
          exit 1
        fi
        if [ "$actual" = "0" ]; then
          echo "::warning::this chain charges NO fee; any fee assertion in this run is vacuous"
        fi
    - name: Save node build
      if: steps.node_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/miden-client/target/test-node
        key: local-node-build-${{ steps.pins.outputs.rev }}-fee${{ inputs.verification-base-fee }}-rust1.96.1
    # start-test-node.sh fails with "a node service exited; see <dir>/logs" and then
    # exits, so the logs it points at are discarded with the runner. That turns any
    # bring-up failure into an unactionable red X — dump them here instead.
    - name: Node bring-up logs (on failure)
      if: failure()
      shell: bash
      run: |
        logs="${{ runner.temp }}/miden-client/target/test-node/data/logs"
        if [ ! -d "$logs" ]; then
          echo "No log directory at $logs — the node never got as far as starting a service."
          exit 0
        fi
        for f in "$logs"/*; do
          [ -f "$f" ] || continue
          echo "::group::$(basename "$f") (last 200 lines)"
          tail -200 "$f"
          echo "::endgroup::"
        done

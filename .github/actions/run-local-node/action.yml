name: Start local 0.16 test node
description: >
  Build (cached) and start the 0.16 test node via miden-client's scripts/start-test-node.sh at
  the rev pinned in playwright/e2e/local-stack/versions.env. The script cargo-installs the four
  node binaries (at the node rev its Cargo.lock pins), generates genesis, seeds each component's
  DB, and starts validator + sequencer + ntx-builder + prover, leaving them running
  (--background). The published ghcr node images lag the node the SDK is built against, so the
  node is compiled from source rather than pulled.

  When the PR carries a linked Protocol PR (resolved by inject-linked-web-sdk-pr, which must
  run EARLIER in the same job), the node, the remote prover and gen-genesis are all built
  against that same protocol rev. Without it the SDK and the host disagree about the MASM a
  guarded account links dynamically, and every guardian spec fails on a procedure root the
  host has never seen. No marker, no patch, and the cache key is unchanged.
inputs:
  verification-base-fee:
    description: >
      The chain's `verification_base_fee`, in the fee asset's smallest unit, baked into genesis.
      NON-ZERO IS THE POINT: on a zero-fee chain the kernel skips the fee branch entirely, so
      every fee-related assertion in the suite passes without a fee ever being charged, which
      looks like coverage and is not. 10000 matches devnet. Pass '0' only for a suite that
      cannot yet run against fees, and say why at the call site.
    required: false
    default: '10000'
  require-sdk-injection:
    description: >
      Fail when this action runs on a `pull_request` and
      .github/actions/inject-linked-web-sdk-pr has NOT already run in the same job.
      That ordering is the whole handover: the injection resolves the linked
      Protocol PR and exports the rev, and this action pins the node + prover to it.
      Reversed, the export lands too late, the node builds against its own published
      protocol crates, and the resulting skew shows up only as an unrelated-looking
      "procedure with root digest ... could not be found" mid-suite. Set to 'false'
      only for a PR-triggered job that deliberately runs no injection.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Read node pins
      id: pins
      shell: bash
      run: |
        set -a; . playwright/e2e/local-stack/versions.env; set +a
        echo "repo=$NODE_SRC_REPO" >> "$GITHUB_OUTPUT"
        echo "rev=$NODE_SRC_REF"  >> "$GITHUB_OUTPUT"
    - name: Install node build deps
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler clang cmake
    - name: Checkout miden-client (test-node infra)
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "${{ runner.temp }}/miden-client"
        git clone --filter=blob:none "${{ steps.pins.outputs.repo }}" "${{ runner.temp }}/miden-client"
        git -C "${{ runner.temp }}/miden-client" checkout "${{ steps.pins.outputs.rev }}"
    # THE NODE AND THE SDK MUST SHARE ONE PROTOCOL REV.
    #
    # A guarded-multisig account built in the browser links `miden::standards::fee`
    # DYNAMICALLY: the fee MASM is not inlined into the account code, so the HOST
    # supplies it at execution time. Rewrite that MASM (protocol#3786 did) and the
    # account's procedure root is one the old host has never seen. One transaction then
    # fails at four hops: the SDK executes it locally fine, the remote prover rejects
    # "procedure with root digest 0x... could not be found", the SDK re-proves locally
    # fine, and the node rejects the identical proven tx on re-execution with the same
    # digest. Plain singlesig accounts are self-contained and unaffected, which is why
    # the local and earn suites stay green on the very same stack while every guardian
    # spec fails — and why this reads as a product bug rather than a build-config one.
    #
    # The rev is NOT configured here. inject-linked-web-sdk-pr already resolved it from
    # the linked web-sdk PR's own `Protocol PR:` marker and exported it; a second pin in
    # versions.env would be a second source of truth, and the two would drift silently.
    - name: Pin the node's protocol crates to the linked Protocol PR
      id: protocol
      shell: bash
      env:
        REQUIRE_INJECTION: ${{ inputs.require-sdk-injection }}
      run: |
        set -euo pipefail
        clone="${{ runner.temp }}/miden-client"
        rev="${MIDEN_LINKED_PROTOCOL_REV:-}"
        url="${MIDEN_LINKED_PROTOCOL_URL:-https://github.com/0xMiden/protocol.git}"
        origin="${MIDEN_LINKED_PROTOCOL_ORIGIN:-a linked Protocol PR}"

        if [ -z "$rev" ]; then
          # Absent means either "no linked Protocol PR" or "the injection has not run in
          # this job yet". Only the breadcrumb tells them apart, and conflating them is
          # how a stock node ships under a patched SDK without a single red step.
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] \
             && [ -z "${MIDEN_LINKED_SDK_INJECTION_RAN:-}" ] \
             && [ "$REQUIRE_INJECTION" = "true" ]; then
            echo "::error title=run-local-node::inject-linked-web-sdk-pr has not run in this job."
            echo "::error::Move the 'Inject linked web-sdk PR' step ABOVE this one, or pass require-sdk-injection: 'false' if this job deliberately runs no injection."
            exit 1
          fi
          # No suffix, so the cache key stays byte-identical to the unpatched one and a
          # warm node build is not thrown away by merely adding this step.
          {
            echo "rev=none"
            echo "cache_suffix="
            echo "cargo_home=${CARGO_HOME:-$HOME/.cargo}"
          } >> "$GITHUB_OUTPUT"
          echo "No linked Protocol PR; the node builds against the protocol crates its own lockfile pins."
          exit 0
        fi

        # Pin by rev, never by branch: linked branches are deleted on merge, and a moving
        # ref would also make the cache key below meaningless.
        if ! printf '%s' "$rev" | grep -qE '^[0-9a-f]{40}$'; then
          echo "::error title=run-local-node::MIDEN_LINKED_PROTOCOL_REV='$rev' is not a 40-hex commit sha."
          exit 1
        fi

        # CARGO_HOME, not <clone>/.cargo/config.toml, and this is the whole trick.
        # `cargo install <crate>` builds an EPHEMERAL workspace with no directory
        # context, so it never reads the cwd config hierarchy — verified: a
        # deliberately broken patch in ./.cargo/config.toml is ignored and the install
        # succeeds, while the same patch in $CARGO_HOME/config.toml fails it. Scoped to
        # a private CARGO_HOME so the patch reaches ONLY the node build: the
        # note-transport build later in the job runs `cargo build --locked`, which
        # errors outright on a config patch it has to resolve around.
        ch="${{ runner.temp }}/node-cargo-home"
        rm -rf "$ch"; mkdir -p "$ch"
        # Registry and git caches are content-addressed, so sharing the job's restored
        # ones costs nothing and keeps the `Cache cargo` step useful here.
        # NO symlinks into this CARGO_HOME, for either registry/ or git/. miden-standards'
        # build script assembles a MASM workspace from inside its own source directory, and the
        # loader canonicalises member paths: under a symlinked prefix they no longer share the
        # workspace root and it dies with "workspace members must be located within the workspace
        # root". Seen first via git/ (the patched rc.8 checkout) and then, after symlinking only
        # registry/, via a registry-sourced miden-standards rc.4 pulled in transitively -- same
        # error, different path. The cost is a cold crates.io fetch for the node build; the
        # correctness is worth more than the cache.
        {
          echo "# Generated by .github/actions/run-local-node. Runner-local; never committed."
          echo "# Pins the node, the remote prover and gen-genesis to the protocol rev the"
          echo "# wallet's SDK is built against (${origin}), so the MASM the host supplies"
          echo "# at execution time hashes to the roots the browser-built accounts carry."
          echo "[patch.crates-io]"
          for c in miden-protocol miden-standards miden-tx miden-tx-batch miden-block-prover miden-agglayer; do
            printf '%-18s = { git = "%s", rev = "%s" }\n' "$c" "$url" "$rev"
          done
        } > "$ch/config.toml"
        echo "::group::$ch/config.toml"; cat "$ch/config.toml"; echo "::endgroup::"

        # `cargo install --locked` does not fail on a patch it cannot honour — it
        # SILENTLY resolves the packaged lockfile and ignores the patch entirely
        # (verified: exit 0, patched crate never compiled). Dropping the flag is what
        # makes the patch take; the verification steps below are what prove it did.
        f="$clone/scripts/start-test-node.sh"
        needle='cargo install --locked --root'
        grep -qF -- "$needle" "$f" || {
          echo "::error title=run-local-node::start-test-node.sh no longer contains '$needle' — the --locked strip matched nothing, so the protocol patch would be silently ignored."
          exit 1
        }
        sed -i "s|$needle|cargo install --root|" "$f"
        grep -n 'cargo install --root' "$f"

        {
          echo "rev=$rev"
          echo "url=$url"
          echo "cache_suffix=-proto$rev"
          echo "cargo_home=$ch"
        } >> "$GITHUB_OUTPUT"
        echo "Node protocol crates pinned to ${url} @ ${rev} (from ${origin})."
    # Fails in ~2 min instead of after the ~36 min cold build. Only on a cache miss:
    # a hit means no install runs at all, and the post-build step below checks what
    # the cached binaries were actually compiled from.
    - name: Verify the protocol patch resolves
      if: steps.protocol.outputs.rev != 'none' && steps.node_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CARGO_HOME: ${{ steps.protocol.outputs.cargo_home }}
        REV: ${{ steps.protocol.outputs.rev }}
      run: |
        set -euo pipefail
        cd "${{ runner.temp }}/miden-client"
        # Resolving rewrites Cargo.lock, which is the artifact worth asserting on.
        # An unused [patch] is a WARNING with exit 0, so the command succeeding proves
        # nothing on its own.
        # `cargo update -p` FIRST, not just a resolve. cargo does a minimal-change resolve, so a
        # [patch] whose version differs from the locked one (rc.8 here vs the committed rc.6) is
        # recorded as UNUSED until the crate is explicitly updated -- cargo says so itself: "If the
        # patch has a different version from what is locked in the Cargo.lock file, run `cargo
        # update` to use the new version." Without this every patched run fails the assertion below
        # with all six crates at x2: the rc.6 registry entry plus the git one.
        #
        # This also covers gen-genesis. start-test-node.sh builds it with `cargo build -p
        # test-node-genesis`, a WORKSPACE build resolving from this same Cargo.lock, so updating the
        # lock here is what stops genesis being produced by the stock protocol on an otherwise
        # patched run -- which neither assertion below could have detected.
        cargo update -p miden-protocol -p miden-standards -p miden-tx \
                     -p miden-tx-batch -p miden-block-prover -p miden-agglayer

        cargo metadata --format-version 1 >/dev/null
        bad=""
        for c in miden-protocol miden-standards miden-tx miden-tx-batch miden-block-prover miden-agglayer; do
          # -xF, not a regex: the crate name is embedded in quotes and a hand-escaped
          # pattern here is exactly the kind of thing that silently matches nothing.
          key=$(printf 'name = "%s"' "$c")
          n=$(grep -cxF "$key" Cargo.lock || true)
          if [ "${n:-0}" -ne 1 ]; then bad="$bad $c(x${n:-0})"; continue; fi
          src=$(grep -A2 -xF "$key" Cargo.lock | sed -n 's/^source = "\(.*\)"$/\1/p')
          case "$src" in
            *"#$REV") ;;
            *) bad="$bad $c[${src:-<no source>}]" ;;
          esac
        done
        if [ -n "$bad" ]; then
          echo "::error title=run-local-node::the protocol [patch.crates-io] did not take:${bad}"
          echo "::error::Two entries for a crate means the patch was declared but unused (cargo warns and exits 0); a registry source means it was never applied. Either way the node would run a different protocol rev from the SDK."
          exit 1
        fi
        echo "protocol patch resolves: all 6 crates at $REV"
    # Split restore/save rather than `actions/cache`. That action saves from a
    # POST step, and GitHub skips post steps once the job has failed — so the
    # cache could only ever be written by a fully green run. This node takes
    # ~36 min to compile cold, which on its own leaves too little of the job's
    # 60 min for the specs to finish: the job fails, the post step is skipped,
    # nothing is cached, and the next run starts cold again. The cache was
    # therefore never populated at all, and the failure it caused was the very
    # thing preventing it from being populated. Saving here, straight after the
    # build, breaks the cycle — the compile is what's expensive and it has
    # already succeeded, whatever the specs go on to do.
    - name: Restore node build
      id: node_cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/miden-client/target/test-node
        key: local-node-build-${{ steps.pins.outputs.rev }}-fee${{ inputs.verification-base-fee }}${{ steps.protocol.outputs.cache_suffix }}-rust1.96.1
    - name: Patch prover port 50051 -> 50052
      shell: bash
      # The wallet's localnet remote-prover endpoint is :50052 (the guardian binds :50051);
      # start-test-node.sh defaults the prover to :50051, so retarget it (and the ntx-builder's
      # tx-prover.url, which reads the same PROVER_PORT).
      run: |
        f="${{ runner.temp }}/miden-client/scripts/start-test-node.sh"
        # prover -> :50052 (guardian binds :50051); bind the sequencer RPC on 0.0.0.0 so the
        # bridge-networked guardian containers can reach it via host.docker.internal.
        sed -i 's/^PROVER_PORT=50051$/PROVER_PORT=50052/' "$f"
        sed -i 's|sequencer --rpc.listen "$RPC"|sequencer --rpc.listen "0.0.0.0:57291"|' "$f"
    - name: Patch block cadence
      shell: bash
      # start-test-node.sh HARDCODES the sequencer's `--block.interval 3s
      # --batch.interval 1s`. MIDEN_NODE_BLOCK_INTERVAL was written when this stack
      # ran under docker-compose.local.yml, which passed it through; the native
      # script reads no such variable, so setting it configured NOTHING and the
      # "fast blocks" leg has been running at 3s the whole time.
      #
      # That is worse than a slow leg, because a spec cannot see it. `recall.ts`
      # sizes a recall window in BLOCKS from this same variable — the only cadence
      # the process can claim to know — so at 500ms it asks for 360 blocks believing
      # they take 180s, and against a real 3s cadence they take 18 minutes. The spec
      # then fails as "the note never became reclaimable", which reads like a product
      # bug in recall and is nothing of the sort.
      #
      # Only patch when the caller asked for a cadence: unset means the leg wants the
      # script's own 3s, which is exactly what `recallBlocksForWindow` assumes for the
      # empty case, so the two already agree.
      run: |
        [ -n "${MIDEN_NODE_BLOCK_INTERVAL:-}" ] || { echo "No cadence requested; leaving the script's 3s/1s default."; exit 0; }
        f="${{ runner.temp }}/miden-client/scripts/start-test-node.sh"
        line='--block.interval 3s --batch.interval 1s'
        # Verified, not best-effort: a silently-missed sed is the exact failure above,
        # and it would come back the moment upstream reformats this line.
        grep -qF -- "$line" "$f" || {
          echo "::error::start-test-node.sh no longer contains '$line' — the block-cadence patch matched nothing. Update it, or the node runs at a cadence the specs do not expect."
          exit 1
        }
        sed -i "s|$line|--block.interval ${MIDEN_NODE_BLOCK_INTERVAL} --batch.interval ${MIDEN_NODE_BATCH_INTERVAL:-${MIDEN_NODE_BLOCK_INTERVAL}}|" "$f"
        grep -n -- '--block.interval' "$f"
    - name: Build + start node
      shell: bash
      # MIDEN_PROVER_TIMEOUT / MIDEN_PROVER_CAPACITY are read by miden-remote-prover's
      # own clap args, so they reach it through start-test-node.sh without patching the
      # script. Both defaults (60s, 1) are sized for a dedicated prover host and are
      # wrong here: this runner has 2 cores shared by validator + sequencer +
      # ntx-builder + prover + two Chrome instances, and the ntx-builder points at the
      # SAME prover (tx-prover.url), so the wallet contends with network-transaction
      # proving for it.
      #   timeout: a transaction proof that exceeds it is ABORTED server-side. At 60s a
      #     wallet consume under that load routinely lost, and the wallet's delegated
      #     prove has no client-side deadline of its own, so the write then hung
      #     indefinitely holding the offscreen WASM mutex — every later claim queued
      #     behind it and syncState timed out. That is the whole #718 claim stall.
      #   capacity: max IN-FLIGHT requests including the one being proved (the prover is
      #     serial), i.e. 1 means an ntx-builder proof in progress leaves no room for the
      #     wallet's. Give the two producers their own slots plus headroom.
      env:
        MIDEN_PROVER_TIMEOUT: 10m
        MIDEN_PROVER_CAPACITY: '4'
        # Read by miden-client's test-node-genesis when it renders genesis.toml.
        # Unset (or 0) means `verification_base_fee = 0` and a fee-free chain.
        # The name start-test-node.sh actually reads; MIDEN_TEST_NODE_VERIFICATION_BASE_FEE
        # is read by nothing, so the requested fee never reached genesis.
        MIDEN_VERIFICATION_BASE_FEE: ${{ inputs.verification-base-fee }}
        # Carries the [patch.crates-io] into `cargo install` (and into the gen-genesis
        # build, so genesis is generated by the same protocol rev the chain runs).
        # Resolves to the runner's own ~/.cargo when nothing is pinned, i.e. a no-op.
        CARGO_HOME: ${{ steps.protocol.outputs.cargo_home }}
      run: |
        cd "${{ runner.temp }}/miden-client"
        # Retried because bring-up has a startup race we do not own. The script
        # launches the ntx-builder without waiting for the sequencer's RPC to
        # listen, and the sequencer's first start rebuilds its account, nullifier
        # and state-forest trees from SQLite before it binds. On a slow runner that
        # rebuild outlasts the ntx-builder's connect, which then exits:
        #   failed to initialize ntx builder ... tcp connect error 127.0.0.1:57291
        #   Connection refused (os error 111)
        # and takes the whole job down in setup, before a single spec runs. Our own
        # "Wait for node RPC" step cannot cover this — it runs after the script has
        # already given up. A second attempt starts against warm SQLite-derived
        # RocksDB state, so the sequencer binds promptly.
        for attempt in 1 2 3; do
          if ./scripts/start-test-node.sh --background; then exit 0; fi
          echo "::warning::node bring-up attempt $attempt failed; retrying in 10s"
          pkill -f 'miden-(validator|node|ntx-builder|remote-prover)' 2>/dev/null || true
          sleep 10
        done
        echo "::error::node bring-up failed after 3 attempts"
        exit 1
    # Direct evidence about the binaries that are now RUNNING, not about a resolve that
    # happened next to them: cargo writes, for every compiled unit, the absolute path of
    # every source file it read. A protocol crate under registry/src means the patch
    # missed that unit. This also covers the cache-hit path, where no install runs at all
    # and the dep-info restored with the build is the only record of its provenance.
    - name: Verify the node binaries carry the linked protocol rev
      if: steps.protocol.outputs.rev != 'none'
      shell: bash
      env:
        REV: ${{ steps.protocol.outputs.rev }}
      run: |
        set -euo pipefail
        deps="${{ runner.temp }}/miden-client/target/test-node/build/release/deps"
        names='miden-protocol|miden-standards|miden-tx|miden-tx-batch|miden-block-prover|miden-agglayer'
        if ! compgen -G "$deps/*.d" >/dev/null; then
          echo "::error title=run-local-node::no dep-info under $deps, so what the node binaries were compiled from cannot be established. Refusing to report a node that may be running published protocol crates."
          exit 1
        fi
        # xargs, not a glob: this directory holds thousands of files.
        scan() { find "$deps" -name '*.d' -print0 | xargs -0 grep -hoE "$1" | sort -u; }
        stray=$(scan "registry/src/[^/]+/($names)-[0-9][^/]*" || true)
        if [ -n "$stray" ]; then
          echo "::error title=run-local-node::the node binaries were compiled against PUBLISHED protocol crates despite the patch:"
          printf '::error::  %s\n' $stray
          exit 1
        fi
        ids=$(scan "git/checkouts/[^/]+/[0-9a-f]+/(crates/)?($names)/" \
              | sed -E 's#git/checkouts/[^/]+/([0-9a-f]+)/.*#\1#' | sort -u || true)
        if [ -z "$ids" ]; then
          echo "::error title=run-local-node::no git-sourced protocol crate in the node build; the patch never reached the install."
          exit 1
        fi
        for id in $ids; do
          case "$REV" in
            "$id"*) ;;
            *) echo "::error title=run-local-node::node compiled protocol sources from git checkout '$id', which is not a prefix of the pinned rev $REV"; exit 1 ;;
          esac
        done
        echo "node binaries built from protocol @ $REV (git checkouts: $ids)"
    # Assert the chain came up with the fee that was asked for. Without this the single
    # most consequential property of the run is invisible: a suite that believes it is
    # proving fee behaviour passes on a fee-free chain and reports green.
    # importFunders() reads wallet_*.mac AND native_faucet.mac from ONE directory: it imports
    # the faucet to learn its id, because the CLI has no token-symbol entry for MIDEN and the
    # funding asset must be named by id. start-test-node.sh splits them — wallets land in
    # <clone>/data/funders, the faucet in <clone>/data — and no single directory has both, so
    # assemble one. The harness's own default ($HOME/miden/miden-client/...) only ever resolved
    # on a checkout that happened to sit at that path.
    - name: Assemble the funder wallet directory
      shell: bash
      run: |
        set -euo pipefail
        clone="${{ runner.temp }}/miden-client"
        dir="${{ runner.temp }}/e2e-funders"
        rm -rf "$dir"; mkdir -p -m 700 "$dir"
        # These carry spendable keys; keep them owner-only as the node wrote them.
        cp -p "$clone"/data/funders/wallet_*.mac "$dir/"
        cp -p "$clone"/data/native_faucet.mac "$dir/"
        n=$(ls "$dir"/wallet_*.mac | wc -l | tr -d ' ')
        [ "$n" -gt 0 ] || { echo "::error::no funder wallets were exposed by the node"; exit 1; }
        echo "assembled $n funder wallet(s) + native_faucet.mac in $dir"
        echo "MIDEN_E2E_FUNDER_DIR=$dir" >> "$GITHUB_ENV"

    - name: Verify genesis fee parameters
      shell: bash
      run: |
        set -euo pipefail
        g="${{ runner.temp }}/miden-client/target/test-node/data/genesis-config/genesis.toml"
        actual=$(grep -E '^verification_base_fee' "$g" | tr -dc '0-9')
        want='${{ inputs.verification-base-fee }}'
        echo "genesis verification_base_fee=$actual (requested $want)"
        if [ "$actual" != "$want" ]; then
          echo "::error::genesis has verification_base_fee=$actual but $want was requested; the chain is not charging what the suite assumes"
          exit 1
        fi
        if [ "$actual" = "0" ]; then
          echo "::warning::this chain charges NO fee; any fee assertion in this run is vacuous"
        fi
    - name: Save node build
      if: steps.node_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/miden-client/target/test-node
        key: local-node-build-${{ steps.pins.outputs.rev }}-fee${{ inputs.verification-base-fee }}${{ steps.protocol.outputs.cache_suffix }}-rust1.96.1
    # start-test-node.sh fails with "a node service exited; see <dir>/logs" and then
    # exits, so the logs it points at are discarded with the runner. That turns any
    # bring-up failure into an unactionable red X — dump them here instead.
    - name: Node bring-up logs (on failure)
      if: failure()
      shell: bash
      run: |
        logs="${{ runner.temp }}/miden-client/target/test-node/data/logs"
        if [ ! -d "$logs" ]; then
          echo "No log directory at $logs — the node never got as far as starting a service."
          exit 0
        fi
        for f in "$logs"/*; do
          [ -f "$f" ] || continue
          echo "::group::$(basename "$f") (last 200 lines)"
          tail -200 "$f"
          echo "::endgroup::"
        done

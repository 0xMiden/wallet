[package]
name = "miden-native-prover-jni"
description = "JNI bridge for the native Miden transaction prover. Android-only; compiles to a cdylib loaded by the Kotlin Capacitor plugin (com.miden.nativeprover.MidenNativeProverPlugin)."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `cdylib` produces a `.so` that Android's `System.loadLibrary` can dlopen.
# JNI lookup expects `Java_<package>_<class>_<method>` symbol naming, which
# this crate exports via `pub extern "system" fn Java_..._proveNative`.
crate-type = ["cdylib"]

# Standalone package — not part of any workspace.
[workspace]

[dependencies]
# The miden-client line the wallet's @miden-sdk/miden-sdk is built from. Both the
# TransactionInputs / ProvenTransaction wire format AND the transaction-kernel /
# library MAST procedure roots must match the SDK byte-for-byte, and the roots come
# from the transaction-kernel crates this package's Cargo.lock resolves, not from
# miden-client itself: a prover built against a different kernel rejects valid
# transactions with "procedure with root digest ... could not be found".
#
# So the safety check is the kernel-crate comparison in
# scripts/check-native-prover-pin.mjs, which CI runs against the web-sdk tag's
# Cargo.lock: it fails when the SDK's miden-client is outside this range or when any
# kernel crate resolves differently on the two sides. A client-only move inside the
# range keeps the committed binaries valid; they are rebuilt only when a kernel crate
# moves. `concurrent` cascades rayon-backed parallel proving through miden-tx ->
# miden-prover.
miden-client = { version = "^0.17.2", default-features = false, features = ["std", "concurrent"] }

# JNI binding crate. Only depended on here because this lib is
# Android-Java-specific; the canonical miden-mobile-prover crate (in
# web-sdk) stays pure C ABI and Java-agnostic.
jni = { version = "0.21", default-features = false }

# wasm32-getrandom escape hatch isn't needed here — JNI lib runs on
# android targets, has the standard getrandom backend.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

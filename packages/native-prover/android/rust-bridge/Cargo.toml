[package]
name = "miden-native-prover-jni"
description = "JNI bridge for the native Miden transaction prover. Android-only; compiles to a cdylib loaded by the Kotlin Capacitor plugin (com.miden.nativeprover.MidenNativeProverPlugin)."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `cdylib` produces a `.so` that Android's `System.loadLibrary` can dlopen.
# JNI lookup expects `Java_<package>_<class>_<method>` symbol naming, which
# this crate exports via `pub extern "system" fn Java_..._proveNative`.
crate-type = ["cdylib"]

# Standalone package — not part of any workspace.
[workspace]

[dependencies]
# Pin the EXACT published miden-client the wallet's @miden-sdk/miden-sdk is
# built from. Both the TransactionInputs / ProvenTransaction wire format AND the
# transaction-kernel / library MAST procedure roots must match the SDK
# byte-for-byte — building against a divergent rev (even at the same 0.16.x
# version number) makes the prover reject valid transactions with "procedure
# with root digest … could not be found".
#
# The wallet is on @miden-sdk/miden-sdk 0.16.0-rc.5, whose Cargo.lock resolves
# miden-client to 0.16.0-rc.3 — the pin below. CI enforces the invariant via
# scripts/check-native-prover-pin.mjs (#594): a pin↔SDK mismatch that isn't a
# documented exemption fails the build. Bump this in lockstep with the wallet's
# @miden-sdk/miden-sdk version (and rebuild the committed binaries); only defer a
# bump behind an exemption when it's a miden-client-only move — neither the
# 0.15→0.16 move nor the rc.2→rc.3 one was that, since the kernel moved too
# (miden-protocol/miden-tx 0.16.0-rc.4 → 0.16.0-rc.6, Miden VM 0.29.1). The
# rc.2→rc.3 client bump that came with SDK rc.5 IS kernel-stable (miden-protocol
# /miden-tx stay 0.16.0-rc.6, Miden VM stays 0.29.4), but the pin and the
# committed binaries were rebuilt anyway rather than exempted.
# `concurrent` cascades rayon-backed parallel proving through miden-tx →
# miden-prover.
miden-client = { version = "=0.16.0-rc.3", default-features = false, features = ["std", "concurrent"] }

# JNI binding crate. Only depended on here because this lib is
# Android-Java-specific; the canonical miden-mobile-prover crate (in
# web-sdk) stays pure C ABI and Java-agnostic.
jni = { version = "0.21", default-features = false }

# wasm32-getrandom escape hatch isn't needed here — JNI lib runs on
# android targets, has the standard getrandom backend.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package]
name = "miden-native-prover-jni"
description = "JNI bridge for the native Miden transaction prover. Android-only; compiles to a cdylib loaded by the Kotlin Capacitor plugin (com.miden.nativeprover.MidenNativeProverPlugin)."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `cdylib` produces a `.so` that Android's System.loadLibrary can dlopen.
# JNI lookup expects `Java_<package>_<class>_<method>` symbol naming, which
# this crate exports via `pub extern "system" fn Java_..._proveNative`.
crate-type = ["cdylib"]

# Standalone package — not part of any workspace.
[workspace]

[dependencies]
# Pin the EXACT published miden-client reviewed for the wallet's
# @miden-sdk/miden-sdk version (see utility/checkNativeProverSdkPin.mjs).
# The wallet is currently on web-sdk v0.15.9, whose Cargo.lock resolves
# miden-client 0.15.5. This prover remains on 0.15.4 under the explicit
# exception in that guard because the kernel-critical crate set is unchanged.
#
# When the versions diverge, compare miden-protocol, miden-tx, miden-core-lib,
# miden-assembly, miden-core, miden-mast-package, and miden-prover between the
# SDK tag and the prover build. Any change there can move transaction-kernel /
# library MAST procedure roots and requires bumping this pin and rebuilding the
# committed Android/iOS native-prover binaries. Client-layer-only drift may be
# recorded as an explicit exception in the guard after that comparison.
#
# Both the TransactionInputs / ProvenTransaction wire format AND the
# transaction-kernel / library MAST procedure roots must match the SDK
# byte-for-byte — building against a divergent pre-release git rev (even at the
# same 0.15.x version number) makes the prover reject valid transactions with
# "procedure with root digest … could not be found".
# `concurrent` cascades rayon-backed parallel proving through miden-tx →
# miden-prover.
miden-client = { version = "=0.15.4", default-features = false, features = ["std", "concurrent"] }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }

# JNI binding crate. Only depended on here because this lib is
# Android-Java-specific; the canonical miden-mobile-prover crate (in
# web-sdk) stays pure C ABI and Java-agnostic.
jni = { version = "0.21", default-features = false }

# wasm32-getrandom escape hatch isn't needed here — JNI lib runs on
# android targets, has the standard getrandom backend.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

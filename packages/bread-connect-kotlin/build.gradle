plugins {
    id 'com.android.library' version '8.13.0'
    id 'org.jetbrains.kotlin.android' version '2.1.0'
}

android {
    namespace 'com.miden.breadconnect'
    compileSdk 36

    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    androidTestCompileOnly files(androidComponents.sdkComponents.sdkDirectory.map { sdk ->
        ['android.test.base', 'android.test.runner', 'android.test.mock'].collect { name ->
            sdk.file("platforms/android-36/optional/${name}.jar")
        }
    })

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Open in Bread</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fdf8f4;
      --card: #ffffff;
      --text: #1f1a17;
      --muted: #6b625c;
      --accent: #e77537;
      --accent-text: #ffffff;
      --border: #eadfd6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161311;
        --card: #211c19;
        --text: #f5efea;
        --muted: #b3a9a1;
        --border: #3a322d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      text-align: center;
    }
    .logo { width: 72px; height: 72px; }
    h1 { margin: 16px 0 8px; font-size: 22px; line-height: 1.3; overflow-wrap: anywhere; }
    p { margin: 0 0 24px; color: var(--muted); }
    .actions { display: flex; flex-direction: column; gap: 12px; }
    .button {
      display: block;
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .primary { background: var(--accent); color: var(--accent-text); }
    .secondary { border: 1px solid var(--border); color: var(--text); }
    .stores { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .text { color: var(--muted); font-size: 15px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="64 68 273 263.2" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <path d="M206.299 76.0532C206.211 76.8855 203.732 77.0542 203.034 77.1415C149.848 83.6945 78.8709 130.188 116.163 190.806C116.443 224.327 115.71 257.878 116.111 291.399C116.152 294.949 117.089 298.307 116.134 302.125C115.459 302.823 108.732 299.995 107.428 299.488C90.615 292.953 74.9193 286.097 73.0978 265.792C70.4614 236.386 75.0415 203.184 73.0978 173.382C39.4134 116.686 106.561 74.4237 155.47 68.5691C173.516 66.41 189.299 70.7166 206.287 76.0591L206.299 76.0532Z" fill="#E77537"/>
      <path d="M274.938 198.098C274.898 198.936 277.039 198.977 277.72 199.082C294.888 201.7 308.629 206.42 315.932 223.67C329.341 255.323 303.257 286.202 274.211 295.88C247.935 304.633 219.087 309.656 192.456 317.652C180.892 319.043 175.288 312.723 173.693 301.851V157.68C177.406 129.21 203.49 120.719 227.368 113.672C252.742 106.176 290.43 97.6444 306.062 126.021C320.879 152.908 302.273 188.344 274.933 198.104L274.938 198.098Z" fill="white"/>
    </svg>
    <h1 id="title-generic">Open in Bread</h1>
    <h1 id="title-target" hidden>Open <span id="host"></span> in Bread</h1>
    <p>Bread is the Miden wallet. Pages you open in Bread can connect to your wallet.</p>
    <div class="actions">
      <a id="get" class="button primary" hidden>Get Bread</a>
      <a id="open" class="button secondary" hidden>Already have Bread? Open it</a>
      <ul id="stores" class="stores">
        <li><a class="button primary" href="https://apps.apple.com/app/id6789341854">Bread for iPhone and iPad</a></li>
        <li><a class="button primary" href="https://play.google.com/store/apps/details?id=com.miden.wallet">Bread for Android</a></li>
        <li><a class="button secondary" href="https://chromewebstore.google.com/detail/bread-wallet-by-miden/coajhopfooegmaifelglfboehacldcbo">Bread for Chrome</a></li>
      </ul>
      <a id="continue" class="text" hidden>Continue in browser</a>
    </div>
  </main>
  <script src="open.js"></script>
</body>
</html>

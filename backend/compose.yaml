name: miden-wallet-backend

services:
  backend:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      PORT: '8787'
      DB_PATH: /data/onramp.sqlite
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - backend-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  backend-data:

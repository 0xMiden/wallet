# Reverse proxy for the Miden Wallet backend. nginx owns TLS and the rate limits; the backend has none.
# The source is the template `backend/nginx.conf`. `make generate-nginx-conf DOMAIN=<domain>` fills in the domain
# and the certificate directory, and installs the result in the nginx `conf.d` directory, which nginx includes
# in its `http` block. Change the template, not the installed file.
# The backend must trust this proxy. Set TRUSTED_PROXIES in .env to the address that the backend sees for nginx:
# the gateway of the Docker network with Compose, or 127.0.0.1,::1 when the server runs on the host (DEPLOYMENT.md).
# Do not expose port 8787 to other hosts: a direct caller bypasses these limits.

# A CORS preflight uses no rate-limit token. An empty key is not counted.
map $request_method $miden_backend_limit_key {
  OPTIONS '';
  default $binary_remote_addr;
}

# One zone for each route, so each route has its own allowance for each IP.
# POST routes: 10 requests per minute. Order status: 60 per minute (the wallet polls it).
limit_req_zone $miden_backend_limit_key zone=miden_transak_challenge:10m rate=10r/m;
limit_req_zone $miden_backend_limit_key zone=miden_transak_session:10m rate=10r/m;
limit_req_zone $miden_backend_limit_key zone=miden_order_signature:10m rate=10r/m;
limit_req_zone $miden_backend_limit_key zone=miden_order_status:10m rate=60r/m;

upstream miden_wallet_backend {
  server 127.0.0.1:8787;
  keepalive 16;
}

# Port 80 serves only the ACME challenge of the certificate renewal. All other requests go to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name __DOMAIN__;
  server_tokens off;

  ssl_certificate __CERT_DIR__/fullchain.pem;
  ssl_certificate_key __CERT_DIR__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:miden_backend_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  limit_req_status 429;
  limit_req_log_level warn;

  # The backend accepts a JSON body of 8 kB at most.
  client_max_body_size 8k;

  proxy_http_version 1.1;
  proxy_set_header Connection '';
  proxy_set_header Host $host;
  # Replace the header, do not append: the backend trusts this value as the client IP.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  # The session route waits for Transak (15 s for each call).
  proxy_read_timeout 60s;

  # `burst` + 1 requests can come at one time. Then the rate applies.
  location = /transak/challenge {
    limit_req zone=miden_transak_challenge burst=9 nodelay;
    error_page 429 = @write_limited;
    proxy_pass http://miden_wallet_backend;
  }

  location = /transak/session {
    limit_req zone=miden_transak_session burst=9 nodelay;
    error_page 429 = @write_limited;
    proxy_pass http://miden_wallet_backend;
  }

  location ~ ^/orders/[^/]+/signature$ {
    limit_req zone=miden_order_signature burst=9 nodelay;
    error_page 429 = @write_limited;
    proxy_pass http://miden_wallet_backend;
  }

  location ~ ^/orders/[^/]+$ {
    limit_req zone=miden_order_status burst=29 nodelay;
    error_page 429 = @read_limited;
    proxy_pass http://miden_wallet_backend;
  }

  # `/health` and unknown paths have no limit.
  location / {
    proxy_pass http://miden_wallet_backend;
  }

  # The same JSON error shape as the backend. The body has no private data, so each origin can read it.
  location @write_limited {
    default_type application/json;
    add_header Retry-After 6 always;
    add_header Access-Control-Allow-Origin * always;
    return 429 '{"error":"Too many requests"}';
  }

  location @read_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Access-Control-Allow-Origin * always;
    return 429 '{"error":"Too many requests"}';
  }
}

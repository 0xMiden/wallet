<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="shortcut icon" href="misc/brand/new-bread.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <title>Bread</title>
    <style>
      /* Full height hierarchy for mobile.
         `clip` (not `hidden`) so vertical overflow stays visible: `hidden`
         forces overflow-y to `auto`, which would clip the BottomNav shadow
         at the body safe-area padding edge. */
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: clip;
      }

      /* Text rendering improvements */
      html {
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Match main.css: don't let iOS treat chrome as selectable text (#503). */
        -webkit-user-select: none;
        user-select: none;
      }

      input,
      textarea,
      [contenteditable='true'],
      .select-text {
        -webkit-user-select: text;
        user-select: text;
      }

      /*
       * Safe area padding for notched devices.
       * !important because Tailwind 4 preflight + app CSS (which loads AFTER
       * this inline <style>) sets body padding via rules that end up winning
       * the cascade, zeroing out our env() values. We need these to stick.
       */
      body {
        padding-top: env(safe-area-inset-top) !important;
        /* --keyboard-height is set by the inline keyboard script below when
           the soft keyboard shows (Keyboard resize is 'none', so the WebView
           itself never resizes). max() keeps the safe-area floor and avoids
           double-counting the bottom inset, which iOS includes in the
           reported keyboard height. */
        padding-bottom: max(16px, env(safe-area-inset-bottom), var(--keyboard-height, 0px)) !important;
        padding-left: env(safe-area-inset-left) !important;
        padding-right: env(safe-area-inset-right) !important;
        box-sizing: border-box;
        /* Ride up in sync with the iOS keyboard slide (~250ms, decelerating
           curve close to UIKit's keyboard animation). */
        transition: padding-bottom 250ms cubic-bezier(0.38, 0.7, 0.125, 1);
      }

      /* Ensure #root children take full height */
      #root > div {
        width: 100% !important;
        height: 100% !important;
        max-width: 100vw !important;
        min-width: 0 !important;
        overflow-x: clip;
      }

      /* Override extension-specific fixed width classes */
      .w-\[360px\],
      .w-\[600px\],
      .w-\[37\.5rem\],
      .w-\[500px\] {
        width: 100% !important;
        max-width: 100% !important;
      }

      .max-w-\[360px\],
      .max-w-\[600px\],
      .max-w-\[500px\] {
        max-width: 100% !important;
      }

      /* Override extension-specific fixed height classes */
      .h-\[600px\],
      .h-\[640px\],
      .h-\[40rem\] {
        height: 100% !important;
      }

      .max-h-\[600px\],
      .max-h-\[640px\] {
        max-height: none !important;
      }

      /* Fix for images and SVGs that might overflow */
      img,
      svg {
        max-width: 100%;
      }

      /*
       * Splash placeholder shown until React mounts.
       *
       * On iOS 26+ the WKWebView blanks the page if there's no first paint
       * before the page's main script finishes evaluating. The Miden SDK
       * uses a top-level `await __wbg_init` to load the 62.7MB WASM module,
       * which delays module evaluation by hundreds of ms — long enough that
       * iOS 26 sees "no paint since load commit" and forcibly clears the
       * compositor layers, leaving the user staring at a blank screen for
       * the rest of the session.
       *
       * Putting visible content inside `<div id="root">` gives WebKit
       * something to paint immediately, satisfying the first-paint check.
       * React's `createRoot(...).render()` replaces this content as soon
       * as the WASM finishes loading.
       */
      #miden-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fbfbfb;
      }

      /* Dark-mode splash: match --color-app-bg dark value in src/main.css.
         The .dark class is set by the inline pre-paint script below (same
         resolution logic as lib/settings/theme.ts) before first paint. */
      html.dark,
      html.dark body,
      html.dark #miden-splash {
        background-color: #191919;
      }

      .miden-splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 44px;
        width: 100%;
      }

      .miden-splash-mark {
        width: min(56vw, 220px);
        height: auto;
      }

      .miden-splash-wordmark {
        width: min(58vw, 220px);
        height: auto;
        object-fit: contain;
      }
    </style>
    <script>
      // Pre-paint theme resolution so the splash doesn't flash light in dark
      // mode. Mirrors resolveTheme() in src/lib/settings/theme.ts: explicit
      // 'dark'/'light' from localStorage wins; 'system' (or no value) follows
      // prefers-color-scheme. React re-applies via initTheme() after mount.
      (function () {
        var setting = null;
        try {
          setting = localStorage.getItem('theme_setting');
        } catch (e) {}
        var dark =
          setting === 'dark' ||
          (setting !== 'light' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <!--
      Splash element lives OUTSIDE #root so it stays paintable while
      React's createRoot mounts into the empty #root. mobile-app.tsx
      removes #miden-splash after the React render call returns.
    -->
    <div id="miden-splash">
      <div class="miden-splash-brand" aria-hidden="true">
        <img class="miden-splash-mark" src="misc/brand/new-bread.svg" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/mobile-app.tsx"></script>
  </body>
</html>

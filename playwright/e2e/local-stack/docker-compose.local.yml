# Local E2E stack — node topology (validator + sequencer + ntx-builder) + remote prover.
#
# Usage:
#   docker compose --env-file versions.env -f docker-compose.local.yml up --wait --timeout 300
#
# Ports exposed on 127.0.0.1 only:
#   - node RPC (sequencer):  127.0.0.1:57291
#   - remote prover:         127.0.0.1:50051
#
# Environment variables consumed (from versions.env or the job env):
#   NODE_IMAGE_TAG      — exact ghcr.io/0xmiden/* image tag (e.g. v0.15.0)
#   MIDEN_NTX_AUTH      — shared auth secret between sequencer ↔ ntx-builder
#                         (defaults to 'e2e-ntx-secret'; must match on both sides)
#
# Reference topology: 0xMiden/node docker-compose.yml @ v0.15.0
# Deltas applied:
#   1. All images fully qualified (ghcr.io/0xmiden/<name>:${NODE_IMAGE_TAG}).
#   2. Default genesis only — no --genesis-config-file fixture mounted.
#   3. sequencer: ports 127.0.0.1:57291, auth header from MIDEN_NTX_AUTH, healthcheck.
#   4. ntx-builder: auth header from MIDEN_NTX_AUTH (must match sequencer).
#   5. tx-prover: ports 127.0.0.1:50051, --capacity=16 added.
#   6. sequencer depends_on tx-prover:service_started so --wait blocks correctly.

services:
  bootstrap-validator:
    image: ghcr.io/0xmiden/miden-validator:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/validator/.bootstrapped ]; then
          echo "Validator already bootstrapped."
          exit 0
        fi
        echo "Cleaning incomplete validator bootstrap state..."
        rm -rf /data/genesis /data/validator /data/accounts
        mkdir -p /data/genesis /data/validator /data/accounts
        echo "Bootstrapping validator (default genesis)..."
        miden-validator bootstrap \
          --data-directory /data/validator \
          --genesis-block-directory /data/genesis \
          --accounts-directory /data/accounts
        touch /data/validator/.bootstrapped

  bootstrap-node:
    image: ghcr.io/0xmiden/miden-node:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      bootstrap-validator:
        condition: service_completed_successfully
    command:
      - |
        set -e
        if [ -f /data/node/.bootstrapped ]; then
          echo "Node already bootstrapped."
          exit 0
        fi
        echo "Cleaning incomplete node bootstrap state..."
        rm -rf /data/node
        mkdir -p /data/node
        echo "Bootstrapping node..."
        miden-node bootstrap \
          --data-directory /data/node \
          --file /data/genesis/genesis.dat
        touch /data/node/.bootstrapped

  bootstrap-ntx-builder:
    image: ghcr.io/0xmiden/miden-ntx-builder:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      bootstrap-node:
        condition: service_completed_successfully
    command:
      - |
        set -e
        if [ -f /data/ntx-builder/.bootstrapped ]; then
          echo "Network transaction builder already bootstrapped."
          exit 0
        fi
        echo "Cleaning incomplete network transaction builder bootstrap state..."
        rm -rf /data/ntx-builder
        mkdir -p /data/ntx-builder
        echo "Bootstrapping network transaction builder..."
        miden-ntx-builder bootstrap \
          --data-directory /data/ntx-builder \
          --file /data/genesis/genesis.dat
        touch /data/ntx-builder/.bootstrapped

  tx-prover:
    image: ghcr.io/0xmiden/miden-remote-prover:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    command:
      - miden-remote-prover
      - --kind=transaction
      - --port=50051
      - --capacity=16
    ports:
      - "127.0.0.1:50051:50051"

  validator:
    image: ghcr.io/0xmiden/miden-validator:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-validator:
        condition: service_completed_successfully
    command:
      - miden-validator
      - start
      - --listen=0.0.0.0:50101
      - --data-directory=/data/validator

  sequencer:
    image: ghcr.io/0xmiden/miden-node:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-node:
        condition: service_completed_successfully
      validator:
        condition: service_started
      tx-prover:
        condition: service_started
    command:
      - miden-node
      - sequencer
      - --rpc.listen=0.0.0.0:57291
      - --data-directory=/data/node
      - --validator.url=http://validator:50101
      - --ntx-builder.url=http://ntx-builder:50301
      - --rpc.network-tx-auth-header-value=${MIDEN_NTX_AUTH:-e2e-ntx-secret}
    ports:
      - "127.0.0.1:57291:57291"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 57291 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  ntx-builder:
    image: ghcr.io/0xmiden/miden-ntx-builder:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-ntx-builder:
        condition: service_completed_successfully
      sequencer:
        condition: service_started
      tx-prover:
        condition: service_started
    command:
      - miden-ntx-builder
      - start
      - --listen=0.0.0.0:50301
      - --rpc.url=http://sequencer:57291
      - --rpc.auth-header-value=${MIDEN_NTX_AUTH:-e2e-ntx-secret}
      - --tx-prover.url=${MIDEN_REMOTE_PROVER_URL:-http://tx-prover:50051}
      - --data-directory=/data/ntx-builder

volumes:
  node-data:

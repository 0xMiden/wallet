# Local E2E stack — guardian profiles only. The 0.16 node (validator + sequencer +
# ntx-builder + remote prover) and the note-transport service run as HOST PROCESSES
# (see .github/actions/run-local-node + run-note-transport.sh), NOT in this compose:
# the published 0.16 node images lag the encrypted-tx node the SDK is built against,
# so the node is compiled + run from miden-client's start-test-node.sh. This file provides
# only the Tier-2 `guardian` profile (OpenZeppelin guardian + postgres) and
# a Tier-3 `guardian-switch` profile (second, distinct-keypair guardian for
# switch/recovery specs).
#
# Every service here sits behind a profile, so there is no profile-less `up` —
# name the profile you want.
#
# Usage:
#   # Tier-2 guardian (after the host-process node is up):
#   docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian up -d --wait --wait-timeout 300
#   # Tier-3 second guardian, for switch-target scenarios (implies Tier-2 too):
#   docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian-switch up -d guardian guardian-postgres guardian-b guardian-b-postgres
#
# Ports published on 127.0.0.1 only:
# guardian profile:
#   - guardian HTTP:         127.0.0.1:3000
#   - guardian gRPC:         127.0.0.1:50051
#   - guardian-postgres:     127.0.0.1:5432
# guardian-switch profile:
#   - guardian-b HTTP:       127.0.0.1:3001 (container :3000)
#   - guardian-b gRPC:       127.0.0.1:50053 (container :50051)
#   - guardian-b-postgres:   127.0.0.1:5433
#
# NOT provided here: the node RPC (127.0.0.1:57291) and the remote prover
# (127.0.0.1:50052). Both belong to the host-process node — see
# .github/actions/run-local-node and the README — and both guardians reach the
# node through the host gateway (see the entrypoints below).
#
# Environment variables consumed (from versions.env or the job env):
#   GUARDIAN_IMAGE_TAG  — exact ghcr.io/openzeppelin/guardian tag (guardian AND
#                         guardian-b both pin to this same tag — see versions.env)
#
# There is deliberately no NODE_IMAGE_TAG: the published node images lag the node
# the SDK is built against, so the node is compiled from source (versions.env,
# README.md).

services:
  guardian-postgres:
    # Floating patch tag is intentional here: this is throwaway per-run guardian
    # state, not a Miden component — it does not need the exact-digest pinning the
    # node/prover/CLI (versions.env) require for reproducibility.
    image: postgres:16-alpine
    profiles: ["guardian"]
    environment:
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=guardian
      - POSTGRES_DB=guardian
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  guardian:
    image: ghcr.io/openzeppelin/guardian:${GUARDIAN_IMAGE_TAG}
    pull_policy: if_not_present
    profiles: ["guardian"]
    # The node runs as a host process (not in this compose). The guardian image hardcodes
    # a `localhost:57291` node dial (MidenLocal), so /etc/hosts remaps 'localhost' to the
    # host gateway (extra_hosts host.docker.internal) to reach the host-process node RPC,
    # which start-test-node.sh binds on 0.0.0.0:57291 for exactly this cross-container reach.
    # Bridge (not network_mode: host) keeps guardian + guardian-b on distinct published ports.
    restart: on-failure
    depends_on:
      guardian-postgres:
        condition: service_healthy
    # Node runs on the host; make host.docker.internal resolve to the host gateway so the
    # /etc/hosts 'localhost' remap below reaches the host-process node RPC (0.0.0.0:57291).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:50051:50051"
    volumes:
      - guardian-keystore:/var/guardian/keystore
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        seq_ip=$$(getent hosts host.docker.internal 2>/dev/null | awk '{print $$1}' | head -n1)
        if [ -n "$$seq_ip" ]; then
          sed "s/^127\.0\.0\.1[[:space:]]\+localhost\$$/$$seq_ip localhost/" /etc/hosts | sed '/^::1[[:space:]]/d' > /etc/hosts.new
          if grep -qF "$$seq_ip localhost" /etc/hosts.new; then
            cat /etc/hosts.new > /etc/hosts
            echo "guardian: remapped 'localhost' -> $$seq_ip (host.docker.internal), node runs on the host and MidenLocal hardcodes localhost:57291"
          else
            echo "guardian: WARNING localhost rewrite did NOT match the 127.0.0.1 line; leaving /etc/hosts untouched -- node RPC will fail loudly"
          fi
        else
          echo "guardian: 'host.docker.internal' not resolvable; leaving /etc/hosts untouched (node RPC calls will fail until it is)"
        fi
        exec /app/server
    environment:
      - RUST_LOG=info
      - GUARDIAN_ENV=dev
      - GUARDIAN_NETWORK_TYPE=MidenLocal
      - GUARDIAN_KEYSTORE_PATH=/var/guardian/keystore
      - DATABASE_URL=postgres://guardian:guardian@guardian-postgres:5432/guardian

  # --- Tier-3: second guardian for switch/recovery specs (HTTP :3001) --------
  # Discovery (Step 1 of the switch-container task): the guardian image has NO
  # env var for HTTP/gRPC ports — `docker inspect`'d env is only
  # {DATABASE_URL, RUST_LOG, GUARDIAN_ENV, GUARDIAN_NETWORK_TYPE,
  # GUARDIAN_KEYSTORE_PATH}, its Dockerfile ExposedPorts are hardcoded
  # 3000/50051, and its Cmd is the bare `/app/server` with no CLI flags — the
  # binary's startup log always prints `listeners http=3000 grpc=50051`
  # regardless of env/args. Both guardians are therefore bridge-networked and
  # differ only in their published ports: `guardian` keeps 3000/50051 and
  # `guardian-b` remaps 3001->3000 and 50053->50051. (Two `network_mode: host`
  # copies would hard-conflict on the container-side ports — confirmed via
  # `docker logs`: "Failed to bind HTTP server: Os { code: 98, kind: AddrInUse }".)
  #
  # The port remap alone isn't sufficient, though: `GUARDIAN_NETWORK_TYPE=MidenLocal`
  # is ALSO hardcoded in the binary to dial the node at literal
  # `http://localhost:57291` (confirmed via the same startup log line and by
  # binary string inspection — no env var overrides it either). On a bridge
  # network "localhost" is only the container's own loopback, and the node runs
  # as a host process, so guardian-b would never reach the node RPC. The
  # entrypoint below patches `/etc/hosts` at container start so "localhost"
  # resolves to `host.docker.internal` (the host gateway, mapped in via
  # `extra_hosts`) instead of 127.0.0.1/::1 — falling back to a no-op if
  # `host.docker.internal` isn't resolvable. Verified end-to-end against a
  # throwaway container pair (rewritten "localhost" TCP-reachable at the
  # target's real address, not a bind failure).
  #
  # Distinct keypair: nothing above configures a signing key at all —
  # `GUARDIAN_ACK_ECDSA_BACKEND` (unset here) defaults to "in-memory", i.e. an
  # ephemeral key generated fresh per process (`ecdsa_backend=in-memory` in the
  # startup log), so guardian and guardian-b independently generate different
  # ECDSA keys with no shared seed. The Falcon key is instead persisted under
  # `GUARDIAN_KEYSTORE_PATH`; guardian-b gets its OWN `guardian-b-keystore`
  # volume (not `guardian-keystore`) so that one is independent too. Verified:
  # `/pubkey?scheme=ecdsa` differs between :3000 and :3001 (see task report).
  guardian-b-postgres:
    image: postgres:16-alpine
    profiles: ["guardian-switch"]
    environment:
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=guardian
      - POSTGRES_DB=guardian_b
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian_b"]
      interval: 5s
      timeout: 5s
      retries: 10

  guardian-b:
    image: ghcr.io/openzeppelin/guardian:${GUARDIAN_IMAGE_TAG}
    pull_policy: if_not_present
    profiles: ["guardian-switch"]
    restart: on-failure
    depends_on:
      guardian-b-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:50053:50051"
    volumes:
      - guardian-b-keystore:/var/guardian/keystore
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        seq_ip=$$(getent hosts host.docker.internal 2>/dev/null | awk '{print $$1}' | head -n1)
        if [ -n "$$seq_ip" ]; then
          sed "s/^127\.0\.0\.1[[:space:]]\+localhost\$$/$$seq_ip localhost/" /etc/hosts | sed '/^::1[[:space:]]/d' > /etc/hosts.new
          if grep -qF "$$seq_ip localhost" /etc/hosts.new; then
            cat /etc/hosts.new > /etc/hosts
            echo "guardian-b: remapped 'localhost' -> $$seq_ip (host.docker.internal), node runs on the host and MidenLocal hardcodes localhost:57291"
          else
            echo "guardian-b: WARNING localhost rewrite did NOT match the 127.0.0.1 line (base image/sed change?); leaving /etc/hosts untouched -- node RPC will fail loudly"
          fi
        else
          echo "guardian-b: 'host.docker.internal' not resolvable; leaving /etc/hosts untouched (node RPC calls will fail until it is)"
        fi
        exec /app/server
    environment:
      - RUST_LOG=info
      - GUARDIAN_ENV=dev
      - GUARDIAN_NETWORK_TYPE=MidenLocal
      - GUARDIAN_KEYSTORE_PATH=/var/guardian/keystore
      - DATABASE_URL=postgres://guardian:guardian@guardian-b-postgres:5432/guardian_b

volumes:
  guardian-keystore:
  guardian-b-keystore:

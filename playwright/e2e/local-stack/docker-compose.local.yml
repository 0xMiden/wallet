# Local E2E stack — node topology (validator + sequencer + ntx-builder) + remote
# prover, plus a Tier-2 `guardian` profile (OpenZeppelin guardian + postgres) and
# a Tier-3 `guardian-switch` profile (second, distinct-keypair guardian for
# switch/recovery specs).
#
# Usage:
#   docker compose --env-file versions.env -f docker-compose.local.yml up --wait --wait-timeout 300
#   # Tier-2 guardian (after the node is up):
#   docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian up -d guardian
#   # Tier-3 second guardian, for switch-target scenarios (implies Tier-2 too):
#   docker compose --env-file versions.env -f docker-compose.local.yml --profile guardian-switch up -d guardian guardian-postgres guardian-b guardian-b-postgres
#
# Ports exposed on 127.0.0.1 only:
#   - node RPC (sequencer):  127.0.0.1:57291
#   - remote prover:         127.0.0.1:50052 (container :50051)
# Guardian profile (network_mode: host — binds directly on the host, see below):
#   - guardian HTTP:         :3000
#   - guardian-postgres:     127.0.0.1:5432
# guardian-switch profile (guardian-b is bridge-networked + port-published, see below):
#   - guardian-b HTTP:       127.0.0.1:3001 (container :3000)
#   - guardian-b gRPC:       127.0.0.1:50053 (container :50051)
#   - guardian-b-postgres:   127.0.0.1:5433
#
# Environment variables consumed (from versions.env or the job env):
#   NODE_IMAGE_TAG      — exact ghcr.io/0xmiden/* image tag (e.g. v0.15.0)
#   GUARDIAN_IMAGE_TAG  — exact ghcr.io/openzeppelin/guardian tag (guardian AND
#                         guardian-b both pin to this same tag — see versions.env)
#   MIDEN_NTX_AUTH      — shared auth secret between sequencer ↔ ntx-builder
#                         (defaults to 'e2e-ntx-secret'; must match on both sides)
#
# Reference topology: 0xMiden/node docker-compose.yml @ v0.15.0
# Deltas applied:
#   1. All images fully qualified (ghcr.io/0xmiden/<name>:${NODE_IMAGE_TAG}).
#   2. Default genesis only — no --genesis-config-file fixture mounted.
#   3. sequencer: ports 127.0.0.1:57291, auth header from MIDEN_NTX_AUTH, healthcheck.
#   4. ntx-builder: auth header from MIDEN_NTX_AUTH (must match sequencer).
#   5. tx-prover: host :50052 -> container :50051 (guardian owns host :50051), --capacity=16.
#   6. sequencer depends_on tx-prover:service_started so --wait blocks correctly.
#   7. Tier-2 `guardian` profile: OpenZeppelin guardian (network_mode: host, HTTP
#      :3000) + postgres:16 backend (:5432), gated behind the profile so the base
#      `up --wait` skips them; started explicitly after the node is ready.
#   8. Tier-3 `guardian-switch` profile: a second OpenZeppelin guardian
#      (`guardian-b`) + its own postgres, for switch/recovery specs that need two
#      *distinct* guardians. See the `guardian-b` service comment below for why
#      it can't just be a second `network_mode: host` copy of `guardian`, and for
#      how it still reaches the node despite that.

services:
  bootstrap-validator:
    image: ghcr.io/0xmiden/miden-validator:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/validator/.bootstrapped ]; then
          echo "Validator already bootstrapped."
          exit 0
        fi
        echo "Cleaning incomplete validator bootstrap state..."
        rm -rf /data/genesis /data/validator /data/accounts
        mkdir -p /data/genesis /data/validator /data/accounts
        echo "Bootstrapping validator (default genesis)..."
        miden-validator bootstrap \
          --data-directory /data/validator \
          --genesis-block-directory /data/genesis \
          --accounts-directory /data/accounts
        touch /data/validator/.bootstrapped

  bootstrap-node:
    image: ghcr.io/0xmiden/miden-node:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      bootstrap-validator:
        condition: service_completed_successfully
    command:
      - |
        set -e
        if [ -f /data/node/.bootstrapped ]; then
          echo "Node already bootstrapped."
          exit 0
        fi
        echo "Cleaning incomplete node bootstrap state..."
        rm -rf /data/node
        mkdir -p /data/node
        echo "Bootstrapping node..."
        miden-node bootstrap \
          --data-directory /data/node \
          --file /data/genesis/genesis.dat
        touch /data/node/.bootstrapped

  bootstrap-ntx-builder:
    image: ghcr.io/0xmiden/miden-ntx-builder:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      bootstrap-node:
        condition: service_completed_successfully
    command:
      - |
        set -e
        if [ -f /data/ntx-builder/.bootstrapped ]; then
          echo "Network transaction builder already bootstrapped."
          exit 0
        fi
        echo "Cleaning incomplete network transaction builder bootstrap state..."
        rm -rf /data/ntx-builder
        mkdir -p /data/ntx-builder
        echo "Bootstrapping network transaction builder..."
        miden-ntx-builder bootstrap \
          --data-directory /data/ntx-builder \
          --file /data/genesis/genesis.dat
        touch /data/ntx-builder/.bootstrapped

  tx-prover:
    image: ghcr.io/0xmiden/miden-remote-prover:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    command:
      - miden-remote-prover
      - --kind=transaction
      - --port=50051
      - --capacity=16
    # Published on host :50052 (NOT :50051): the host-network guardian binds host
    # :50051 for its hardcoded gRPC listener, so the prover moves aside. Guardian
    # transactions delegate proving to this endpoint, so the wallet's localnet
    # proving URL (constants.ts) points at :50052 to match. NTX-builder still
    # reaches the prover internally via tx-prover:50051 on the bridge.
    ports:
      - "127.0.0.1:50052:50051"

  validator:
    image: ghcr.io/0xmiden/miden-validator:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-validator:
        condition: service_completed_successfully
    command:
      - miden-validator
      - start
      - --listen=0.0.0.0:50101
      - --data-directory=/data/validator

  sequencer:
    image: ghcr.io/0xmiden/miden-node:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-node:
        condition: service_completed_successfully
      validator:
        condition: service_started
      tx-prover:
        condition: service_started
    command:
      - miden-node
      - sequencer
      - --rpc.listen=0.0.0.0:57291
      - --data-directory=/data/node
      - --validator.url=http://validator:50101
      - --ntx-builder.url=http://ntx-builder:50301
      - --rpc.network-tx-auth-header-value=${MIDEN_NTX_AUTH:-e2e-ntx-secret}
    ports:
      - "127.0.0.1:57291:57291"
    # No custom healthcheck: the miden-node image ships its own HEALTHCHECK
    # (like the sibling validator/ntx-builder/prover images). Overriding it with
    # `nc` fails because the minimal image has no netcat. Runner-side readiness
    # is gated by the workflow's "Wait for node RPC" step.

  ntx-builder:
    image: ghcr.io/0xmiden/miden-ntx-builder:${NODE_IMAGE_TAG}
    pull_policy: if_not_present
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-ntx-builder:
        condition: service_completed_successfully
      sequencer:
        condition: service_started
      tx-prover:
        condition: service_started
    command:
      - miden-ntx-builder
      - start
      - --listen=0.0.0.0:50301
      - --rpc.url=http://sequencer:57291
      - --rpc.auth-header-value=${MIDEN_NTX_AUTH:-e2e-ntx-secret}
      - --tx-prover.url=${MIDEN_REMOTE_PROVER_URL:-http://tx-prover:50051}
      - --data-directory=/data/ntx-builder

  # --- Tier-2: local multisig guardian (HTTP :3000) ------------------------
  # The published guardian image is postgres-backed, and MidenLocal hardcodes the
  # node RPC to http://localhost:57291 — so the guardian shares the host network
  # to reach the published node and to bind its HTTP :3000 (what the wallet uses).
  # Both live in the `guardian` profile so the base `up --wait` (node stack) skips
  # them; the workflow starts the guardian after the node is ready.
  guardian-postgres:
    # Floating patch tag is intentional here: this is throwaway per-run guardian
    # state, not a Miden component — it does not need the exact-digest pinning the
    # node/prover/CLI (versions.env) require for reproducibility.
    image: postgres:16-alpine
    profiles: ["guardian"]
    environment:
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=guardian
      - POSTGRES_DB=guardian
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  guardian:
    image: ghcr.io/openzeppelin/guardian:${GUARDIAN_IMAGE_TAG}
    pull_policy: if_not_present
    profiles: ["guardian"]
    # Bridge network + `/etc/hosts` "localhost"->sequencer rewrite (identical to
    # guardian-b below), NOT `network_mode: host`. Host mode + MidenLocal's
    # hardcoded `localhost:57291` node dial is unreliable on macOS Docker Desktop:
    # the guardian v0.16 image panics HARD at build time ("Failed to create
    # network client: ... transport error") on a transient node-connection blip
    # where v0.15 tolerated it, so a host-mode guardian-a crash-loops. Reaching the
    # node through the compose network (sequencer's real IP) instead of the host
    # loopback is the proven-stable path guardian-b already uses, and it publishes
    # on 127.0.0.1 only (dropping host mode's all-interfaces exposure caveat).
    restart: on-failure
    depends_on:
      guardian-postgres:
        condition: service_healthy
      sequencer:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:50051:50051"
    volumes:
      - guardian-keystore:/var/guardian/keystore
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        seq_ip=$$(getent hosts sequencer 2>/dev/null | awk '{print $$1}' | head -n1)
        if [ -n "$$seq_ip" ]; then
          sed "s/^127\.0\.0\.1[[:space:]]\+localhost\$$/$$seq_ip localhost/" /etc/hosts | sed '/^::1[[:space:]]/d' > /etc/hosts.new
          if grep -qF "$$seq_ip localhost" /etc/hosts.new; then
            cat /etc/hosts.new > /etc/hosts
            echo "guardian: remapped 'localhost' -> $$seq_ip (sequencer), MidenLocal hardcodes localhost:57291"
          else
            echo "guardian: WARNING localhost rewrite did NOT match the 127.0.0.1 line; leaving /etc/hosts untouched -- node RPC will fail loudly"
          fi
        else
          echo "guardian: 'sequencer' not resolvable yet; leaving /etc/hosts untouched (node RPC calls will fail until it is)"
        fi
        exec /app/server
    environment:
      - RUST_LOG=info
      - GUARDIAN_ENV=dev
      - GUARDIAN_NETWORK_TYPE=MidenLocal
      - GUARDIAN_KEYSTORE_PATH=/var/guardian/keystore
      - DATABASE_URL=postgres://guardian:guardian@guardian-postgres:5432/guardian

  # --- Tier-3: second guardian for switch/recovery specs (HTTP :3001) --------
  # Discovery (Step 1 of the switch-container task): the v0.15.0 image has NO
  # env var for HTTP/gRPC ports — `docker inspect`'d env is only
  # {DATABASE_URL, RUST_LOG, GUARDIAN_ENV, GUARDIAN_NETWORK_TYPE,
  # GUARDIAN_KEYSTORE_PATH}, its Dockerfile ExposedPorts are hardcoded
  # 3000/50051, and its Cmd is the bare `/app/server` with no CLI flags — the
  # binary's startup log always prints `listeners http=3000 grpc=50051`
  # regardless of env/args. So `guardian-b` can't reuse `network_mode: host`
  # like `guardian` (two host-mode containers hard-conflict on those same
  # ports — confirmed via `docker logs`: "Failed to bind HTTP server: Os {
  # code: 98, kind: AddrInUse }"). This is the brief's anticipated fallback:
  # a distinct (default/bridge) network + published-port remap, 3001->3000 and
  # 50053->50051.
  #
  # That remap alone isn't sufficient, though: `GUARDIAN_NETWORK_TYPE=MidenLocal`
  # is ALSO hardcoded in the binary to dial the node at literal
  # `http://localhost:57291` (confirmed via the same startup log line and by
  # binary string inspection — no env var overrides it either). On
  # `network_mode: host` that hardcoded "localhost" reaches the real node
  # because the container shares the host's loopback; on a normal bridge
  # network "localhost" is only the container's own loopback, so guardian-b
  # would never be able to reach the sequencer. The entrypoint below patches
  # `/etc/hosts` at container start so "localhost" resolves to the `sequencer`
  # service's address on this network instead of 127.0.0.1/::1 (falls back to
  # a no-op if `sequencer` isn't resolvable yet, e.g. when only the guardian
  # services are started standalone) — verified end-to-end against a
  # throwaway container pair (rewritten "localhost" TCP-reachable at the
  # target's real address, not a bind failure).
  #
  # Distinct keypair: nothing above configures a signing key at all —
  # `GUARDIAN_ACK_ECDSA_BACKEND` (unset here) defaults to "in-memory", i.e. an
  # ephemeral key generated fresh per process (`ecdsa_backend=in-memory` in the
  # startup log), so guardian and guardian-b independently generate different
  # ECDSA keys with no shared seed. The Falcon key is instead persisted under
  # `GUARDIAN_KEYSTORE_PATH`; guardian-b gets its OWN `guardian-b-keystore`
  # volume (not `guardian-keystore`) so that one is independent too. Verified:
  # `/pubkey?scheme=ecdsa` differs between :3000 and :3001 (see task report).
  guardian-b-postgres:
    image: postgres:16-alpine
    profiles: ["guardian-switch"]
    environment:
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=guardian
      - POSTGRES_DB=guardian_b
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian_b"]
      interval: 5s
      timeout: 5s
      retries: 10

  guardian-b:
    image: ghcr.io/openzeppelin/guardian:${GUARDIAN_IMAGE_TAG}
    pull_policy: if_not_present
    profiles: ["guardian-switch"]
    restart: on-failure
    depends_on:
      guardian-b-postgres:
        condition: service_healthy
      # Enforce node-before-guardian ordering (matches how the node services
      # depend on each other); service_started not service_healthy to mirror the
      # rest of the stack and avoid a hang on the image healthcheck. guardian-b's
      # restart: on-failure still backstops the started-but-RPC-not-yet-ready gap.
      sequencer:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:50053:50051"
    volumes:
      - guardian-b-keystore:/var/guardian/keystore
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        seq_ip=$$(getent hosts sequencer 2>/dev/null | awk '{print $$1}' | head -n1)
        if [ -n "$$seq_ip" ]; then
          sed "s/^127\.0\.0\.1[[:space:]]\+localhost\$$/$$seq_ip localhost/" /etc/hosts | sed '/^::1[[:space:]]/d' > /etc/hosts.new
          if grep -qF "$$seq_ip localhost" /etc/hosts.new; then
            cat /etc/hosts.new > /etc/hosts
            echo "guardian-b: remapped 'localhost' -> $$seq_ip (sequencer), MidenLocal hardcodes localhost:57291"
          else
            echo "guardian-b: WARNING localhost rewrite did NOT match the 127.0.0.1 line (base image/sed change?); leaving /etc/hosts untouched -- node RPC will fail loudly"
          fi
        else
          echo "guardian-b: 'sequencer' not resolvable yet; leaving /etc/hosts untouched (node RPC calls will fail until it is)"
        fi
        exec /app/server
    environment:
      - RUST_LOG=info
      - GUARDIAN_ENV=dev
      - GUARDIAN_NETWORK_TYPE=MidenLocal
      - GUARDIAN_KEYSTORE_PATH=/var/guardian/keystore
      - DATABASE_URL=postgres://guardian:guardian@guardian-b-postgres:5432/guardian_b

volumes:
  node-data:
  guardian-keystore:
  guardian-b-keystore:

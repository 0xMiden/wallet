apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// App version — single source of truth is the monorepo root package.json, so a
// version bump there (which the release process already does) flows to Android
// automatically. Mirrors iOS, where `mobile:ios:set-version` stamps the
// marketing version from the same package.json; no per-release manual edit here.
def rootPackageJson = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))
def appVersionName = rootPackageJson.version as String
// Parse major.minor.patch to ints. tokenize('.') splits on the dot first, so a
// pre-release such as "1.15.18-rc.1" yields ["1","15","18-rc","1"]; the regex
// strips the "-rc" from the patch token (-> "18") and the trailing "1" is ignored.
// Fail loudly (not with a raw Groovy stack trace) if it isn't 3-part semver.
def versionParts = appVersionName.tokenize('.').collect { it.replaceAll(/[^0-9].*$/, '') }
if (versionParts.size() < 3 || versionParts[0..2].any { it.isEmpty() }) {
    throw new GradleException("Cannot derive Android version: root package.json version '${appVersionName}' is not major.minor.patch")
}
def (vMajor, vMinor, vPatch) = versionParts[0..2].collect { it.toInteger() }
// versionCode = major*10_000_000 + minor*100_000 + patch*1_000 + build,
// e.g. 1.15.18 (build 1) -> 11518001. Strictly increasing across major/minor/
// patch, so Play's monotonic-versionCode rule always holds. Fixed-width slots
// cap minor < 100, patch < 100 and build < 1000 (keep the override in range).
// The build suffix defaults to 1; a version bump is required per upload, but the
// SAME version can be re-uploaded (e.g. after a rejected upload) by bumping it
// via `-PandroidBuildNumber=N`.
def androidBuildNumber = (project.findProperty("androidBuildNumber") ?: "1").toString().toInteger()
def appVersionCode = vMajor * 10000000 + vMinor * 100000 + vPatch * 1000 + androidBuildNumber

android {
    namespace = "com.miden.wallet"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.miden.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    packaging {
        jniLibs {
            pickFirsts += [
                'lib/arm64-v8a/libuniffi_yttrium.so',
                'lib/armeabi-v7a/libuniffi_yttrium.so',
                'lib/x86_64/libuniffi_yttrium.so'
            ]
        }
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // Reown AppKit native dApp connector for Android WalletConnect.
    implementation platform('com.reown:android-bom:1.6.13')
    implementation 'com.reown:android-core'
    implementation 'com.reown:appkit'
    // Biometric authentication for hardware security
    implementation 'androidx.biometric:biometric:1.1.0'
    // secp256k1 ECDSA + Keccak-256 for the Guardian hot-key signing path
    // (HotKeyPlugin). Keystore wraps the 32-byte k256 secret with RSA-OAEP;
    // BouncyCastle handles everything outside the Keystore boundary.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
